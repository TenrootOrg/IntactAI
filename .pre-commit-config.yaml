# Pre-commit hook config for IntactAI.
#
# To activate locally:
#   pip install pre-commit
#   pre-commit install
#
# Once activated, every `git commit` runs gitleaks on the staged diff
# and blocks the commit if a secret is detected. The hook is also
# auto-installed by `scripts/first-init.sh` when run in a developer
# clone (when `.git` and `.pre-commit-config.yaml` are both present).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Pin to a known-good tag. Bump after testing against
    # `bash scripts/scan-secrets.sh` on the working tree.
    rev: v8.21.2
    hooks:
      - id: gitleaks
        # `protect --staged` runs against the index (= what's about to
        # be committed). The repo-level .gitleaks.toml provides the
        # rules + allowlist.
        args: ["protect", "--staged", "--config", ".gitleaks.toml", "--redact"]
