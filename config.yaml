domain: 192.168.120.10

# Installation options
options:
  # Download forensic tools (Hayabusa, Eric Zimmerman tools, Sysinternals, etc.)
  # Set to false for faster installation, tools can be downloaded later via Maintenance button
  download_forensic_tools: true

  # Before installing, poll each pinned module's upstream GitHub repo
  # (Velociraptor, Timesketch, IRIS, Plaso, Portainer, ELK) for a newer
  # release. For each newer release found, prompt the operator; press y
  # to bump the pinned version in this file in place. Set false for
  # unattended installs so the prompt doesn't block.
  #
  # Rate-limit note: when enabled, this makes 6 anonymous calls to
  # api.github.com per install run. GitHub's anonymous API limit is
  # 60 requests/hour per IP. Running ~10+ installs from the same IP
  # within an hour (e.g., a shared NAT'd office network, an air-gap
  # build pipeline that rebuilds repeatedly, or rapid local testing)
  # can exhaust the quota and cause the check to silently skip modules.
  # The installer detects this at runtime and logs a clear
  # "GitHub rate limit exhausted" warning; the install itself
  # continues normally using whatever versions are pinned below.
  check_module_updates: true

modules:
  agentic:
    enabled: true
  aws:
    enabled: true
  azure:
    enabled: true
  elk:
    enabled: true
    id: elastic
    password: '123123'
  iris:
    enabled: true
    id: administrator #Cant be changed
    password: '123123'
  portainer:
    enabled: true
    id: admin
    password: '1234qwer!@#$' # Portainer requires >=12 chars; shorter values fall back to the same built-in default
  timesketch:
    enabled: true
    id: tenroot
    password: '123123'
  velociraptor:
    api_id: api
    api_password: '123123'
    enabled: true
    id: tenroot
    password: '123123'
project_name: intact
versions:
  elk: 9.3.3
  iris: v2.4.27
  plaso: '20260119'
  portainer: 2.39.1
  timesketch: '20260326'
  velociraptor: '0.76.5'
  # Legacy Velociraptor build for old Windows hosts (Server 2008 R2, Win 7)
  # where the modern Go 1.22+ binary crashes with 0xc0000005. 0.7.1 is the
  # last 0.7.x release built with Go 1.20 and runs cleanly on those OSes.
  # install.sh downloads this version alongside the main binary so both
  # the live-client (repack) and offline-collector flows can produce
  # legacy-compatible installers without an internet round-trip at runtime.
  velociraptor_legacy: '0.7.1'
  backend: '1.0.0'
