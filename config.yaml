schema_version: 2

# Dashboard / API login — set up in the browser, not in this file.
#
# true  = this appliance has no login yet. Browsing to https://<domain>/ shows
#         a one-time setup page where you choose the username and password.
#         Completing setup flips this to false automatically.
# false = a login is configured. The setup page is closed and https://<domain>/
#         shows the login page.
#
# THIS IS ALSO THE RECOVERY SWITCH. There is one operator account and the
# password is stored only as a hash, so it cannot be read back. If you forget
# it, or ten wrong attempts in a row trigger the lockout and you don't want to
# wait it out, set this back to true and reload the page — you'll get the setup
# page again and can choose new credentials. It takes effect immediately; no
# restart needed.
#
# Because flipping this re-opens the setup page to whoever loads it first, it
# deliberately requires access to this file on the appliance host. That host
# access IS the authentication for a password reset. Don't leave it true on a
# box you haven't just set up.
#
# The login gates the dashboard, /api/, the upload endpoint and the
# /velociraptor/ proxy. The other bundled tools (Kibana, IRIS, Portainer,
# Timesketch, VolWeb) listen on their own ports and keep their own separate
# logins — see the `modules:` section below.
first_login: true

domain: 192.168.120.11

# Installation options
options:
  # Download OPTIONAL forensic tools beyond the default set.
  #
  # The "default" tools — every tool marked `enabled: true` in
  # data/tools_inventory.yaml — are what the shipped default blueprints
  # (Velociraptor hunts, CVE, agentic, Timesketch/KAPE, memory) need, and
  # they ALWAYS download (at install and via System Maintenance) and are the
  # only tools bundled into Prepare-Package / Online-Upgrade.
  #
  # This flag gates the EXTRA optional tools (the ones marked
  # `enabled: false` in tools_inventory.yaml, e.g. Trawler, TimelineExplorer,
  # the large toolkits). Leave false to keep installs/maintenance lean and
  # only fetch what the default blueprints require; set true to also pull the
  # optional tools during install and System Maintenance.
  download_tools: false

  # GitHub API token used by the installer AND the backend's Online Upgrade /
  # Prepare Package flows (release lookups, target config.yaml fetches, module
  # update checks, source downloads).
  #
  # WHY: without a token, every api.github.com call is ANONYMOUS and shares a
  # 60-requests/hour PER-IP cap. Installs + upgrades burn several calls each,
  # so shared/NAT'd networks or repeated test runs hit the cap and the upgrade
  # UI shows "rate limited — try again later". A token raises the cap to
  # 5,000 requests/hour for this machine.
  #
  # MINIMAL PERMISSION: the platform only READS a public repository, so the
  # token needs NO write access of any kind. Never use a token with
  # repo-write/admin scopes here.
  #
  # HOW TO GET ONE (2 minutes, either kind works):
  #
  #   Classic token (simplest):
  #     1. Open  https://github.com/settings/tokens/new
  #        (GitHub → your avatar → Settings → Developer settings →
  #         Personal access tokens → Tokens (classic) → Generate new token)
  #     2. Note: "IntactAI upgrades" · Expiration: your policy (e.g. 90 days)
  #     3. Leave EVERY scope checkbox UNCHECKED — an empty-scope token still
  #        authenticates and gets the 5,000/hr limit.
  #     4. Generate token → copy the ghp_... value below. GitHub shows it
  #        only once; if lost, just generate a new one.
  #
  #   Fine-grained token (stricter orgs):
  #     1. Open  https://github.com/settings/personal-access-tokens/new
  #     2. Repository access: "Public repositories (read-only)"
  #     3. Grant NO additional permissions → Generate → copy github_pat_...
  #
  # When it expires, upgrade dialogs fall back to the anonymous 60/hr cap —
  # nothing breaks; generate a new token and paste it here.
  #
  # Applied at install into modules/backend/.env (GITHUB_TOKEN=...); the
  # backend also reads it from this file directly, so adding it later works
  # without reinstalling. Leave empty to stay anonymous.
  github_token: ''

modules:
  # CloudTrail — native AWS DFIR detection (CloudTrail events + SIGMA rules,
  # feeding the fusion engine). No container image; the versioned artifact is the
  # AWS SIGMA rule pack (see versions.aws_sigma).
  #
  # Now ON by default. It has no long-running container and no service to fail:
  # enabling it makes the rule pack part of every install and upgrade, and the
  # upgrade engine treats it as policy 'none' (nothing to health-probe) for that
  # reason. Set false to leave the AWS detection content off this host.
  aws_sigma:
    enabled: true
  o365rc:
    enabled: false
  # Plaso — log2timeline timeline parser. On-demand image: pulled by the
  # backend when timesketch or a standalone forensic job invokes it.
  # No long-running container, so this flag is the ONLY signal of
  # whether the operator wants plaso available on this host (the
  # PLASO_VERSION pin in modules/backend/.env is shipped as a constant
  # and doesn't reflect operator intent).
  plaso:
    enabled: true
  elk:
    enabled: true
    id: elastic
    password: '123123'
  iris:
    enabled: true
    id: administrator #Cant be changed
    password: '123123'
  # Portainer — container infrastructure management UI. On by default: it is
  # the operator's window into the container layer (logs, restarts, resource
  # use) and is the first thing wanted when something on the box misbehaves.
  # The dashboard card is already wired (modules/nginx/html/partials/dashboard.html)
  # and appears once the service reports healthy.
  portainer:
    enabled: true
    id: admin
    # CHANGE THIS BEFORE THE APPLIANCE IS REACHABLE BY ANYONE ELSE.
    #
    # This file is committed, so whatever sits here is public and identical on
    # every default install -- "complex" does not make it secret. It is a
    # starting credential, not a secret, and Portainer's admin account is a
    # window onto the whole container layer.
    #
    # Constraints if you replace it: Portainer enforces >= 12 characters even
    # when seeded via --admin-password-file, and a value that fails validation
    # leaves the admin account silently uncreated with the UI stuck in its
    # timed-out "initial setup" state. Anything empty, shorter than 12, or
    # equal to the RETIRED default `1234qwer!@#$` is refused outright and
    # replaced with a random password (read it from
    # modules/portainer/secrets/admin_password) -- see
    # generate_portainer_secrets in lib/modules/portainer.sh.
    password: 'Ch4nge-Me!Intact2026'
  timesketch:
    enabled: true
    id: tenroot
    password: '123123'
  velociraptor:
    api_id: api
    api_password: '123123'
    enabled: true
    id: tenroot
    password: '123123'
  # VolWeb (memory-forensics analysis stack). The platform's admin
  # user is seeded with these creds at install time by
  # `lib/modules.sh:seed_volweb_admin`; the IntactAI backend
  # authenticates against VolWeb's REST API using the same pair
  # (no separate secret-store entry needed).
  volweb:
    enabled: true
    id: tenroot
    password: '123123'
project_name: intact
versions:
  elk: '9.4.4'
  iris: v2.4.29
  plaso: '20260512'
  portainer: '2.39.6'
  timesketch: '20260630'
  velociraptor: '0.77.2'
  # AWS DFIR detection = the SIGMA AWS CloudTrail rule pack (cloned from SigmaHQ).
  # No container image; this pins the rule-pack version that install / upgrade /
  # prepare-package bundle + update. Bump to refresh the AWS detection rules.
  aws_sigma: '2026.04'
  # Git ref for the FULL SigmaHQ clone at /opt/sigma-rules (powers BOTH AWS and
  # Azure detection). Previously install cloned HEAD (unreproducible — two
  # installs got different rules). SigmaHQ publishes monthly release tags
  # (rYYYY-MM-01); pin to one so detection content is reproducible + updatable.
  # Bump this to refresh the rules (aws_sigma above is the AWS-pack bundle label).
  sigma_rules: 'r2026-07-01'
  # Commit SHA for the google/dfiq clone bundled into the timesketch release
  # asset (dfiq/dfiq-data.tar) and moved into modules/timesketch/config/dfiq
  # at deploy time. Pinned to a commit, not "main", for the same reason
  # sigma_rules is pinned to a tag: an unpinned floating ref would let
  # bundled content silently drift between CI builds with no visible
  # version change. Bump by resolving a new commit from
  # https://github.com/google/dfiq/commits/main.
  dfiq: 'f07e5f2a5255afda7be9d9de13300d3df12d15f8'
  # Azure Unified Audit Log collection runs the DFIR-O365RC image
  # (anssi/dfir-o365rc). Upstream only publishes ':latest' (no version tags),
  # so we track latest — "upgrade" re-pulls the newest latest.
  o365rc: 'latest'
  # Legacy Velociraptor v0.7.x build for old Windows hosts (Server 2008 R2,
  # Win 7) where the modern Go 1.22+ binary crashes with 0xc0000005. 0.7.1
  # is the last 0.7.x release built with Go 1.20 and runs cleanly on those
  # OSes. install.sh downloads this alongside the main binary so both the
  # live-client (repack) and offline-collector flows can produce
  # legacy-compatible installers without an internet round-trip at runtime.
  # Set this to an empty string or remove the key to skip legacy downloads.
  velociraptor_legacy: '0.7.1'
  # VolWeb in-tree memory-forensics analysis stack (modules/volweb/).
  # forensicxlab publishes versioned semver tags WITHOUT a `v` prefix
  # (Docker Hub: forensicxlab/volweb-backend + forensicxlab/volweb-frontend
  # — current latest = 3.16.0 pushed 2026-03-20). Backend + frontend
  # release in lockstep so a SINGLE pin drives both (same pattern as
  # IRIS, where `iris: v2.4.27` drives 4 containers).
  volweb: '3.16.0'
  # Backend runtime image tag (Wave F: intact-backend:<this value>). Set this
  # to match the RELEASE NAME when cutting a release (e.g. 'intact-20260713'),
  # same convention as every other module pin above; 'development' on dev
  # branches/boxes. install/upgrade stamp it into BACKEND_VERSION (backend/.env)
  # and the intact upgrade uses it to detect + apply an image swap on a
  # Full-mode release (services/upgrade/intact.py: backend_target_tag,
  # backend_full_mode, ensure_backend_runtime_image).
  #
  # It ALSO still serves its original role as a SAFETY KEY: the intact
  # upgrade's version-writeback runs in the OLD (pre-restart) process during
  # Phase 1, and an older release's writeback regex spins forever (100% CPU,
  # wedges the whole backend) if it can't find this key in the `versions:`
  # block. The pre-prepare merge injects this key before that writeback runs,
  # so the key being present keeps every release's writeback safe. (The
  # current regex also fails fast on a missing key —
  # services/upgrade/base.set_module_version_in_config — but this protects
  # the OLD code we can't change in an already-deployed release.)
  backend: 'intact-20260813'

  # ── External sidecar pins (postgres / opensearch / redis / nginx / rabbitmq) ──
  # 2026-06-14 refactor: these used to be scraped live from each
  # module's upstream docker-compose at the pinned primary version,
  # via services/upgrade/transitive_resolver.py + an in-memory + disk
  # cache layer + a TRANSITIVE_DEFAULTS fallback table. That whole
  # chain is gone now — the live scrape produced silent drift between
  # install and upgrade (an operator hit it 2026-06-14: install used
  # postgres:15 from the compose default, upgrade scraped upstream's
  # postgres:13.0-alpine pin, postgres-13 then refused to start
  # against postgres-15 data). Single source of truth = these lines.
  # Naming convention: `<module>_<sidecar>` — read by
  # services/upgrade/package.py:get_transitive_tag and stamped into
  # each module's modules/<module>/.env before its docker compose up.
  # To bump any sidecar: edit the value here, then re-run the module's
  # install/upgrade flow. Both online + offline (air-gap) paths read
  # the SAME entries via the bundled manifest.
  # ⚠ Timesketch ↔ OpenSearch coupling — bump together, OpenSearch FIRST.
  # (ref: https://github.com/google/timesketch/releases)
  #   Timesketch 20260611+ requires OpenSearch >= 2.19.5 (native wildcard field
  #   mapping). 20260617 adds: hosts already on OpenSearch 3.x must be >= 3.7.0.
  #   This 2.19.5 pin satisfies 20260617 on the 2.x line.
  # OpenSearch is always upgraded + made healthy BEFORE the Timesketch web/worker
  # containers — `modules/timesketch/docker-compose.yaml` declares
  # `timesketch-web depends_on timesketch-opensearch: service_healthy` — so the
  # ordering holds automatically on online upgrade, offline upgrade, AND offline
  # install (all run the same `docker compose up`). A 2.x -> 3.x jump is a MAJOR
  # OpenSearch upgrade (reindex / rolling) — don't just swap the tag.
  timesketch_opensearch: '2.19.5'
  timesketch_postgres:   '13.0-alpine'
  timesketch_redis:      '7.2.11-alpine'
  timesketch_nginx:      '1.25.5-alpine-slim'
  iris_rabbitmq:         '3-management-alpine'
  # Main reverse-proxy nginx (modules/nginx/, the intact_nginx container). Was a
  # floating `nginx:alpine` default — pinned so install/upgrade are reproducible.
  # Independent from timesketch_nginx above (separate container + .env); pin each
  # to the version IT was tested with, not a shared one. Stock nginx alpine tag.
  nginx:                 '1.31.2-alpine'
  # tusd resumable-upload sidecar (intact_tusd in the backend compose). Pinned
  # here so install/upgrade drive one reproducible tag; a bump recreates the
  # container (docker restart alone keeps the old image). Docker Hub:
  # tusproject/tusd — v2.9.2 current.
  backend_tusd:          'v2.10.0'
  volweb_postgres:       '14.1'
  # Was floating '7' — pinned to the exact patch (debian variant, matches the
  # currently-deployed redis:7). Reproducible; bump deliberately.
  volweb_redis:          '7.4.9'
