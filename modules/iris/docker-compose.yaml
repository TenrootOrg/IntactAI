# IRIS - Incident Response Platform
# Port: 8443 (Web UI - HTTPS)

services:
  iris-rabbitmq:
    container_name: intact_iris_rabbitmq
    # No default — `versions.iris_rabbitmq` in config.yaml is
    # authoritative. install.sh:deploy_iris stamps RABBITMQ_VERSION
    # into modules/iris/.env before compose up; UI install/upgrade
    # does the same via stamp_transitive_env_from_manifest. Refactor
    # 2026-06-14 dropped the `:-3-management-alpine` fallback.
    image: rabbitmq:${RABBITMQ_VERSION:?must be set via modules/iris/.env — see versions.iris_rabbitmq in config.yaml}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      # 60s, not 20s. Every iris upgrade does `compose down` then `up`, so this
      # is always a FRESH container doing an Erlang/Mnesia cold boot, and
      # iris-app gates on `condition: service_healthy`. At 20s the budget was
      # 20 + 10x6 = 80s; on 2026-08-18 a UI import (5.8 GB upload + extract +
      # 11 GB of image loads, 2.5 GB already swapped) blew past it and the whole
      # stack failed with "dependency failed to start: container
      # intact_iris_rabbitmq is unhealthy". It was purely timing -- the same
      # container reported Healthy moments later during the rollback.
      #
      # start_period is a GRACE window: failures inside it do not count against
      # `retries`, so raising it cannot turn a pass into a fail or mask a real
      # failure -- a broken rabbitmq still fails, just later.
      #
      # Budget is start_period + interval x retries, so this is 120 + 10x6 =
      # 180s, level with volweb and behind elk's 210s -- rather than the 80s
      # that made rabbitmq the tightest healthcheck on the appliance.
      start_period: 120s
    networks:
      - iris_internal

  iris-db:
    container_name: intact_iris_db
    image: ghcr.io/dfir-iris/iriswebapp_db:${IRIS_VERSION}
    entrypoint: /bin/bash
    command:
      - /postgres_start_with_secrets.sh
    env_file:
      - .env
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_ADMIN_PASSWORD
    volumes:
      - ./scripts/postgres_start_with_secrets.sh:/postgres_start_with_secrets.sh:ro
      - iris_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - iris_internal

  iris-app:
    container_name: intact_iris_app
    image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION}
    entrypoint: /bin/bash
    command:
      - /iriswebapp_start_with_secrets.sh
    user: "65534"
    env_file:
      - .env
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_ADMIN_PASSWORD
      - IRIS_SECRET_KEY
      - IRIS_SECURITY_PASSWORD_SALT
      - IRIS_ADM_PASSWORD
    volumes:
      - ./scripts/iriswebapp_start_with_secrets.sh:/iriswebapp_start_with_secrets.sh:ro
      - ./config/certificates/rootCA:/etc/irisRootCA:ro
      - ./config/certificates:/home/iris/certificates:ro
      - iris_downloads:/home/iris/downloads
      - iris_templates:/home/iris/user_templates
      - iris_server_data:/home/iris/server_data
    restart: unless-stopped
    depends_on:
      iris-rabbitmq:
        condition: service_healthy
      iris-db:
        condition: service_healthy
    networks:
      - iris_internal
      - intact_network

  iris-worker:
    container_name: intact_iris_worker
    image: ghcr.io/dfir-iris/iriswebapp_app:${IRIS_VERSION}
    entrypoint: /bin/bash
    command:
      - /worker_start_with_secrets.sh
    user: "65534"
    env_file:
      - .env
    secrets:
      - POSTGRES_PASSWORD
      - POSTGRES_ADMIN_PASSWORD
      - IRIS_SECRET_KEY
      - IRIS_SECURITY_PASSWORD_SALT
    volumes:
      - ./scripts/worker_start_with_secrets.sh:/worker_start_with_secrets.sh:ro
      - ./config/certificates/rootCA:/etc/irisRootCA:ro
      - ./config/certificates:/home/iris/certificates:ro
      - iris_downloads:/home/iris/downloads
      - iris_templates:/home/iris/user_templates
      - iris_server_data:/home/iris/server_data
    restart: unless-stopped
    depends_on:
      iris-rabbitmq:
        condition: service_healthy
      iris-db:
        condition: service_healthy
      iris-app:
        condition: service_started
    networks:
      - iris_internal

  iris-nginx:
    container_name: intact_iris_nginx
    image: ghcr.io/dfir-iris/iriswebapp_nginx:${IRIS_VERSION}
    env_file:
      - .env
    volumes:
      - ./config/certificates/web_certificates:/www/certs:ro
    ports:
      - "8443:8443"
    restart: unless-stopped
    depends_on:
      - iris-app
    networks:
      - iris_internal
      - intact_network

volumes:
  iris_db_data:
  iris_downloads:
  iris_templates:
  iris_server_data:

secrets:
  POSTGRES_PASSWORD:
    file: secrets/POSTGRES_PASSWORD
  POSTGRES_ADMIN_PASSWORD:
    file: secrets/POSTGRES_ADMIN_PASSWORD
  IRIS_SECRET_KEY:
    file: secrets/IRIS_SECRET_KEY
  IRIS_SECURITY_PASSWORD_SALT:
    file: secrets/IRIS_SECURITY_PASSWORD_SALT
  IRIS_ADM_PASSWORD:
    file: secrets/IRIS_ADM_PASSWORD

networks:
  iris_internal:
    name: iris_internal
  intact_network:
    external: true
