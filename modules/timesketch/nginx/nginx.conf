# NOTE: no `upstream` blocks. Every proxy_pass below resolves its target
# lazily through Docker's DNS (resolver + variable), because a static upstream
# caches the container IP at nginx start-up and 502s forever once that
# container is recreated. See the comment on `location /`.

server {
    # TLS termination for the Timesketch UI (Timesketch has no native web
    # TLS — upstream's recommended method is a reverse proxy). Uses the
    # shared self-signed cert (CN=domain) that install.sh / change_ip.sh
    # generate + rotate; change_ip restarts this nginx so it picks up a
    # regenerated cert automatically.
    listen 5000 ssl;
    server_name _;

    ssl_certificate /etc/nginx/cert.crt;
    ssl_certificate_key /etc/nginx/cert.key;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Legacy UI - served at /legacy/
    location /legacy/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ts_legacy timesketch-web-legacy:5001;
        proxy_pass http://$ts_legacy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /legacy;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # V3 UI - served at /v3/ (Investigation feature lives here; the
    # ng frontend's "Investigate" button links to /v3/sketch/<id>/...).
    # Resolve the upstream lazily via Docker DNS (resolver + variable) so
    # that if the v3 container is down — mid-upgrade, or an image that
    # doesn't ship the v3 frontend — only /v3/ returns 502 and the main
    # UI on / keeps serving. A static upstream would make nginx fail to
    # start entirely on an unresolvable host. The rewrite strips the /v3
    # prefix (the v3 app serves its assets under /assets, not /v3/assets).
    location /v3/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ts_v3 timesketch-web-v3:5002;
        rewrite ^/v3/(.*)$ /$1 break;
        proxy_pass http://$ts_v3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /v3;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Main UI - everything else.
    #
    # Resolved LAZILY via Docker DNS, for the same reason /v3/ above is: a
    # static `upstream` block resolves the container's IP once, when nginx
    # starts, and caches it forever. Recreating timesketch-web gives it a NEW
    # IP, so every request then 502s against a dead address —
    #   connect() failed (111: Connection refused) ... upstream: 172.18.0.21
    # — until someone thinks to restart THIS container, which is not an
    # obvious thing to think. Observed after a `compose up -d
    # --force-recreate timesketch-web`, and it would hit a customer on any
    # upgrade or Settings->Timesketch restart that recreates the web
    # container. `resolver ... valid=10s` re-resolves instead.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ts_web timesketch-web:5000;
        proxy_pass http://$ts_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
