upstream timesketch_web {
    server timesketch-web:5000;
}

upstream timesketch_legacy {
    server timesketch-web-legacy:5001;
}

server {
    listen 5000;
    server_name _;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Legacy UI - served at /legacy/
    location /legacy/ {
        proxy_pass http://timesketch_legacy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /legacy;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # V3 UI - served at /v3/ (Investigation feature lives here; the
    # ng frontend's "Investigate" button links to /v3/sketch/<id>/...).
    # Resolve the upstream lazily via Docker DNS (resolver + variable) so
    # that if the v3 container is down — mid-upgrade, or an image that
    # doesn't ship the v3 frontend — only /v3/ returns 502 and the main
    # UI on / keeps serving. A static upstream would make nginx fail to
    # start entirely on an unresolvable host. The rewrite strips the /v3
    # prefix (the v3 app serves its assets under /assets, not /v3/assets).
    location /v3/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ts_v3 timesketch-web-v3:5002;
        rewrite ^/v3/(.*)$ /$1 break;
        proxy_pass http://$ts_v3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /v3;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Main UI - everything else
    location / {
        proxy_pass http://timesketch_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
