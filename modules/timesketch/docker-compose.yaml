# TimeSketch - Timeline Analysis Platform
# Port: 5000 (Web UI)

services:
  timesketch-postgres:
    container_name: intact_timesketch_postgres
    # No default. POSTGRES_VERSION must be set in modules/timesketch/.env
    # by either install.sh:deploy_timesketch (reads versions.timesketch_postgres
    # from config.yaml) or the apply-side stamp_transitive_env_from_manifest
    # (reads it from the bundled manifest, which prepare populated from
    # the same config.yaml entry). 2026-06-14 refactor: dropped the
    # historical `${VAR:-15}` fallback because it caused the
    # install-vs-upgrade postgres-version drift incident — install used
    # the compose default, upgrade scraped upstream, and the two
    # disagreed. Single source of truth is `versions.timesketch_postgres`
    # in config.yaml; loud failure if `.env` isn't stamped is preferable
    # to silent drift.
    image: postgres:${POSTGRES_VERSION:?must be set via modules/timesketch/.env — see versions.timesketch_postgres in config.yaml}
    environment:
      - POSTGRES_USER=timesketch
      - POSTGRES_DB=timesketch
    # POSTGRES_PASSWORD was `${POSTGRES_PASSWORD:-timesketch}`, and the fallback
    # was LIVE: modules/timesketch/.env contains no such key and nothing set it,
    # so every deployment ran the timeline database on timesketch/timesketch.
    # Note the asymmetry that hid it -- the version pins above fail loudly with
    # `:?`, while the password silently defaulted. A stale image tag is
    # recoverable; a default database password is not.
    #
    # Delivered via secrets/ rather than the module .env because that .env is
    # git-TRACKED and a credential there would be staged by the next `git add`.
    # Written by deploy_timesketch() in lib/modules.sh and by
    # _ensure_postgres_password() on the upgrade path.
    env_file:
      - ./secrets/postgres.env
    volumes:
      - timesketch_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      # Data store: reachable ONLY by the Timesketch app containers.
      # Was on intact_network, where all 25 containers could reach it.
      - timesketch_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesketch"]
      interval: 10s
      timeout: 5s
      retries: 5

  timesketch-opensearch:
    container_name: intact_timesketch_opensearch
    # Timesketch >=20260611 requires OpenSearch >=2.19.5 (native wildcard field
    # mapping landed there; older datastores get rejected at startup with
    # `UnsupportedDatastoreVersionError`). Pin the floor explicitly — the
    # image is fully forward-compatible with 2.11.x volumes, so existing
    # installs auto-migrate the data dir on first start at the new version.
    # No default — see the postgres comment above for the rationale.
    # `versions.timesketch_opensearch` in config.yaml is authoritative.
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:?must be set via modules/timesketch/.env — see versions.timesketch_opensearch in config.yaml}
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_MEM:-2}g -Xmx${OPENSEARCH_MEM:-2}g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - timesketch_opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      # Data store: reachable ONLY by the Timesketch app containers.
      # Was on intact_network, where all 25 containers could reach it.
      - timesketch_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 5-minute grace period during initial start. OpenSearch loads
      # ~24 plugins + bootstraps a single-node cluster, which on
      # memory-constrained hosts (heap is 2 GB, total RAM often <16 GB
      # with ELK + IRIS + VolWeb running) can take 90-180 seconds.
      # Without start_period, docker counts those slow boots as
      # healthcheck failures (5 × 30s = 150s budget), marks the
      # container "Error", and downstream services depending on
      # service_healthy refuse to start — even though OpenSearch
      # itself is fine. This was observed during a 20251219 -> 20260326
      # Timesketch upgrade where opensearch went Started → Waiting →
      # Error before reporting green.
      start_period: 5m

  timesketch-redis:
    container_name: intact_timesketch_redis
    # No default — `versions.timesketch_redis` in config.yaml is
    # authoritative; install + upgrade both stamp REDIS_VERSION into
    # modules/timesketch/.env. Redis is non-stateful in the timesketch
    # deployment (Celery broker only), so version changes are safe
    # across restarts — but the loud failure still helps if `.env`
    # isn't stamped at all.
    image: redis:${REDIS_VERSION:?must be set via modules/timesketch/.env — see versions.timesketch_redis in config.yaml}
    command: redis-server
    restart: unless-stopped
    networks:
      # Data store: reachable ONLY by the Timesketch app containers.
      # Was on intact_network, where all 25 containers could reach it.
      - timesketch_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timesketch-web:
    container_name: intact_timesketch_web
    image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:${TIMESKETCH_VERSION:-latest}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/log/timesketch
        [ -r /opt/intact/llm_providers/apply.sh ] && bash /opt/intact/llm_providers/apply.sh; true
        exec /docker-entrypoint.sh timesketch-web
    environment:
      - NUM_WSGI_WORKERS=${NUM_WSGI_WORKERS:-4}
    volumes:
      - ./config:/etc/timesketch
      # IntactAI's contrib LLM providers (openrouter, litellm_proxy). apply.sh
      # writes them into the vendor image's site-packages on every start —
      # /opt/venv has no volume, so a one-off docker cp would be destroyed by
      # the next recreate. Read-only: the container never writes back here.
      # The `[ -r ] && … ; true` guard above is load-bearing — on a partially
      # applied upgrade docker bind-mounts an empty dir, and Timesketch must
      # still start. See llm_providers/README.md.
      - ./llm_providers:/opt/intact/llm_providers:ro
      - timesketch_upload:/usr/share/timesketch/upload
      - timesketch_logs:/var/log/timesketch
    restart: unless-stopped
    depends_on:
      timesketch-postgres:
        condition: service_healthy
      timesketch-opensearch:
        condition: service_healthy
      timesketch-redis:
        condition: service_healthy
    networks:
      - intact_network        # reached by timesketch-nginx
      - timesketch_internal   # reaches postgres / opensearch / redis

  timesketch-web-legacy:
    container_name: intact_timesketch_web_legacy
    image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:${TIMESKETCH_VERSION:-latest}
    # Converted from `entrypoint: ["/docker-entrypoint.sh"]` to the bash -c
    # form so the contrib-LLM-provider prologue runs first. Cosmetic, not
    # behavioural: /docker-entrypoint.sh runs gunicorn as a child rather than
    # exec'ing it, so the process tree is identical either way.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/log/timesketch
        [ -r /opt/intact/llm_providers/apply.sh ] && bash /opt/intact/llm_providers/apply.sh; true
        exec /docker-entrypoint.sh timesketch-web-legacy
    environment:
      - NUM_WSGI_WORKERS=${NUM_WSGI_WORKERS:-2}
      - TIMESKETCH_UI_MODE=legacy
      - TIMESKETCH_SETTINGS=/etc/timesketch/timesketch_legacy.conf
    volumes:
      - ./config:/etc/timesketch
      - ./llm_providers:/opt/intact/llm_providers:ro
      - timesketch_upload:/usr/share/timesketch/upload
      - timesketch_logs:/var/log/timesketch
    restart: unless-stopped
    depends_on:
      # SHORT form, deliberately. This was briefly `condition: service_healthy`
      # to serialise schema creation and avoid a `DuplicateTable: relation
      # "user" already exists` traceback from whichever container lost the
      # race. That race is real but COSMETIC -- gunicorn restarts the worker
      # and the stack comes up regardless.
      #
      # Gating on health turned that cosmetic race into a hard install failure
      # when the probe itself was wrong (2026-08-16). Trading a self-healing
      # traceback for a total install failure is a bad bargain in both
      # directions, so the dependency is back to ordering only.
      - timesketch-web
    networks:
      - intact_network        # reached by timesketch-nginx
      - timesketch_internal   # reaches postgres / opensearch / redis

  timesketch-web-v3:
    container_name: intact_timesketch_web_v3
    image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:${TIMESKETCH_VERSION:-latest}
    # Same conversion as timesketch-web-legacy above.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/log/timesketch
        [ -r /opt/intact/llm_providers/apply.sh ] && bash /opt/intact/llm_providers/apply.sh; true
        exec /docker-entrypoint.sh timesketch-web-v3
    environment:
      - NUM_WSGI_WORKERS=${NUM_WSGI_WORKERS:-2}
      - TIMESKETCH_UI_MODE=v3
    volumes:
      - ./config:/etc/timesketch
      - ./llm_providers:/opt/intact/llm_providers:ro
      - timesketch_upload:/usr/share/timesketch/upload
      - timesketch_logs:/var/log/timesketch
    restart: unless-stopped
    depends_on:
      # SHORT form, deliberately. This was briefly `condition: service_healthy`
      # to serialise schema creation and avoid a `DuplicateTable: relation
      # "user" already exists` traceback from whichever container lost the
      # race. That race is real but COSMETIC -- gunicorn restarts the worker
      # and the stack comes up regardless.
      #
      # Gating on health turned that cosmetic race into a hard install failure
      # when the probe itself was wrong (2026-08-16). Trading a self-healing
      # traceback for a total install failure is a bad bargain in both
      # directions, so the dependency is back to ordering only.
      - timesketch-web
    networks:
      - intact_network        # reached by timesketch-nginx
      - timesketch_internal   # reaches postgres / opensearch / redis

  timesketch-nginx:
    container_name: intact_timesketch_nginx
    # No default — `versions.timesketch_nginx` in config.yaml is
    # authoritative. Previously hardcoded as `nginx:alpine`, which
    # broke air-gap installs (compose tried to pull from Docker Hub
    # rather than using the bundled image). Fixed 2026-06-14 to honor
    # the env var the prepare/apply machinery has been writing all
    # along.
    image: nginx:${NGINX_VERSION:?must be set via modules/timesketch/.env — see versions.timesketch_nginx in config.yaml}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Shared self-signed cert for TLS termination (CN=domain), same one
      # the main nginx/IRIS/Portainer use. nginx runs as root so the 600/640
      # key is readable.
      - ../nginx/ssl/nginx-cert.crt:/etc/nginx/cert.crt:ro
      - ../nginx/ssl/nginx-cert.key:/etc/nginx/cert.key:ro
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      - timesketch-web
      - timesketch-web-legacy
      - timesketch-web-v3
    networks:
      - intact_network

  timesketch-worker:
    container_name: intact_timesketch_worker
    image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:${TIMESKETCH_VERSION:-latest}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/log/timesketch
        [ -r /opt/intact/llm_providers/apply.sh ] && bash /opt/intact/llm_providers/apply.sh; true
        exec /docker-entrypoint.sh timesketch-worker
    environment:
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL:-INFO}
    volumes:
      - ./config:/etc/timesketch
      # The worker runs the Celery-side LLM features (summarize/synthesize),
      # so it needs the providers just as much as the web frontends do.
      - ./llm_providers:/opt/intact/llm_providers:ro
      - timesketch_upload:/usr/share/timesketch/upload
      - timesketch_logs:/var/log/timesketch
    restart: unless-stopped
    depends_on:
      # SHORT form, deliberately. This was briefly `condition: service_healthy`
      # to serialise schema creation and avoid a `DuplicateTable: relation
      # "user" already exists` traceback from whichever container lost the
      # race. That race is real but COSMETIC -- gunicorn restarts the worker
      # and the stack comes up regardless.
      #
      # Gating on health turned that cosmetic race into a hard install failure
      # when the probe itself was wrong (2026-08-16). Trading a self-healing
      # traceback for a total install failure is a bad bargain in both
      # directions, so the dependency is back to ordering only.
      - timesketch-web
    networks:
      - intact_network        # reached by timesketch-nginx
      - timesketch_internal   # reaches postgres / opensearch / redis

volumes:
  timesketch_postgres_data:
  timesketch_opensearch_data:
  timesketch_upload:
  timesketch_logs:

networks:
  intact_network:
    external: true
  # Private network for the Timesketch data stores.
  #
  # OpenSearch runs with DISABLE_SECURITY_PLUGIN=true, i.e. NO authentication
  # at all. While it sat on intact_network, any of the ~25 containers there
  # could read, modify or DELETE every forensic timeline with no credentials
  # and no audit trail -- verified by reading the full index list from
  # intact_nginx. For a DFIR platform that is an evidence-integrity problem,
  # not merely a confidentiality one. Postgres (which held timesketch/
  # timesketch) and Redis (no requirepass) were equally exposed.
  #
  # Isolation rather than enabling the security plugin: with
  # DISABLE_INSTALL_DEMO_CONFIG=true, turning the plugin on requires transport
  # TLS certs, a hand-authored internal_users.yml, securityadmin.sh to
  # initialise, and credentials threaded into timesketch.conf (where
  # OPENSEARCH_USER/PASSWORD are currently None) plus a migration for existing
  # indices. This shrinks the blast radius from 25 containers to 4 as a
  # compose-only change. It does NOT add authentication -- compromise
  # timesketch-web itself and OpenSearch is still open. Real auth remains
  # worth doing; this is the cheap 80%.
  #
  # Safe because nothing outside this module reaches OpenSearch over the
  # network: the backend's only access is
  # `docker exec intact_timesketch_opensearch curl localhost:9200`
  # (maintenance_routes.py:816,836,1063), and docker exec does not traverse
  # the Docker network.
  timesketch_internal:
    name: timesketch_internal
