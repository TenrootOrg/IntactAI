worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use Docker's internal DNS server to re-resolve container IPs after restarts
    # valid=30s means re-check DNS every 30 seconds
    # ipv6=off because Docker internal network is IPv4 only
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Increase upload limit for offline collectors (importer.py limit is 500MB)
    client_max_body_size 500M;

    # The old `main` fields plus the Intact user that the auth_request gate let
    # through (auth_request_set $intact_user in each gated location), so every
    # request to every tool is attributable to a person. Empty when the gate
    # refused the request, "-" where no gate runs: the static dashboard shell,
    # and /api/, which Flask gates itself.
    log_format intact '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" user="$intact_user"';

    access_log /var/log/nginx/access.log intact;

    # X-Intact-User exists only for the log line above, never for the browser.
    # auth_request never forwards it, and an outside GET /api/auth/verify gets
    # the internal location's 404; this covers any other reply that would carry
    # it. A location with its own proxy_hide_header drops this one (array
    # directives are not merged), so such a location repeats it.
    proxy_hide_header X-Intact-User;
    proxy_hide_header X-Intact-Auth;

    # The signed-in user's own credential for a tool (services/tool_accounts,
    # returned by the verify as X-Intact-Auth and captured with
    # auth_request_set $intact_auth). Never the browser's own Authorization:
    # that can be another person's cached login (Velociraptor Basic typed in
    # this browser earlier, a stale VolWeb token). With none ready, nginx sends
    # none and the tool shows its own login. The credential travels nginx -> tool only.
    map $intact_auth $intact_tool_authz {
        ""      "";
        default $intact_auth;
    }

    # The Cookie header minus the dashboard's `intact_session`, for every tool
    # upstream (proxy_set_header Cookie $intact_tool_cookie). Cookies are not
    # isolated by port, so without this Kibana, Portainer, IRIS, Timesketch,
    # VolWeb and Velociraptor all received a live dashboard session. The tools'
    # own cookies pass untouched. Two passes: a browser can hold two
    # intact_session cookies (different Path/Domain) and send both.
    # First regex: the cookie leads (or is alone). Second: it follows a "; ".
    map $http_cookie $intact_cookie_pass1 {
        "~^\s*intact_session=[^;]*;?\s*(?<intact_ck_tail>.*)$"            "$intact_ck_tail";
        "~^(?<intact_ck_head>.*?);\s*intact_session=[^;]*(?<intact_ck_tail>.*)$" "$intact_ck_head$intact_ck_tail";
        default $http_cookie;
    }
    map $intact_cookie_pass1 $intact_tool_cookie {
        "~^\s*intact_session=[^;]*;?\s*(?<intact_ck_tail>.*)$"            "$intact_ck_tail";
        "~^(?<intact_ck_head>.*?);\s*intact_session=[^;]*(?<intact_ck_tail>.*)$" "$intact_ck_head$intact_ck_tail";
        default $intact_cookie_pass1;
    }

    sendfile on;
    keepalive_timeout 65;

    # Plaintext HTTP entry point (80, 8080). The only response here is an
    # upgrade to HTTPS: the dashboard, /api/ backend, and tus upload proxy
    # all move to the TLS server block below so cloud credentials, LLM API
    # keys, Velociraptor collection passwords, and case data are never
    # transmitted in cleartext (CWE-319).
    #
    # $host reflects the client-supplied Host header. It's validated
    # against a plain hostname/IP-literal pattern before being reflected
    # into the redirect's Location — anything else is rejected outright —
    # and the redirect is marked non-cacheable, so a spoofed/malformed
    # Host can't be turned into an attacker-controlled open-redirect
    # target or poison a shared cache sitting in front of the appliance.
    server {
        listen 80;
        listen 8080;
        server_name _;

        if ($host !~* "^(\[[0-9a-fA-F:]+\]|[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?)$") {
            return 400;
        }

        add_header Cache-Control "no-store" always;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        # Tell browsers to stop offering plaintext HTTP after first contact.
        # The other three: no MIME sniffing, no full URLs (case IDs, hostnames)
        # in the Referer sent to other sites, and a CSP holding only directives
        # the inline-script dashboard cannot trip over (no script-src): it may
        # not be framed by another origin, run plugins or move its base URL.
        # Every location below with its own add_header repeats all four, as
        # nginx drops the server-level ones there.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

        # Authentication (CWE-306) now lives in the backend, not here.
        #
        # This block used to carry a server-level `auth_basic` + htpasswd,
        # which was the platform's ONLY authentication. It has been replaced
        # by a real session login (see modules/backend/services/auth_service.py
        # and routes/auth_routes.py), for two reasons:
        #
        #   1. auth_basic could only protect what came THROUGH nginx. The
        #      backend performed no check of its own, so any peer container on
        #      intact_network could reach intact_backend:5001 directly and
        #      drive the entire API — case export/delete, Velociraptor hunts,
        #      POST /api/maintenance/purge — with zero credentials. That was
        #      audit finding F-010. The backend's before_request gate
        #      (app.py:_auth_gate) closes it; an nginx-level gate never could.
        #   2. A browser Basic Auth popup has no logout, no session, no audit
        #      trail and no password-reset path.
        #
        # Division of labour now:
        #   * /api/          -> gated by the backend itself (Flask
        #                       before_request). Nothing needed here.
        #   * /velociraptor/ -> proxies to intact_velociraptor:8889, never
        #     /api/uploads/     touches Flask, so ONLY nginx can gate them.
        #                       Both use `auth_request` below.
        #   * /              -> deliberately open. It serves the static
        #                       dashboard shell, which is inert HTML/JS holding
        #                       no case data; every byte of real data comes from
        #                       /api/, which is gated. The frontend redirects to
        #                       /login.html on its first 401.
        #
        #   * the Kibana (5602), Portainer (9444), IRIS (8444), Timesketch (5443)
        #     and VolWeb (8002) servers -> also non-Flask, so gated the same way.
        #     Each tool keeps its own login behind the gate.

        # auth_request target. `internal` makes it unreachable from outside
        # (an external GET /api/auth/verify matches this exact location and
        # gets a 404). The body must NOT be forwarded: without
        # proxy_pass_request_body off, nginx would buffer each tus PATCH body
        # to satisfy the subrequest and defeat the `proxy_request_buffering
        # off` that /api/uploads/ sets for exactly that reason.
        # $intact_tool is `set` by the calling location (a subrequest shares its
        # parent's variables): the backend checks the role against that tool.
        location = /api/auth/verify {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=$intact_tool;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Unauthenticated 401 on a path the operator NAVIGATES to (/velociraptor/)
        # -> send them to the login page, with the reason preserved so it can say
        # "your session expired" rather than showing a bare form. Without this,
        # nginx would serve its own raw 401 error page.
        location @login_redirect {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Cache-Control "no-store" always;
            return 302 /login.html?reason=expired;
        }

        # Unauthenticated 401 on the upload path. Deliberately NOT a redirect:
        # tus runs over XMLHttpRequest, which follows 3xx transparently, so a
        # 302 would hand the tus client the login page's HTML with status 200 and
        # it would treat that as a successful PATCH. Return a real 401 with a
        # JSON body — js/upload.js keys off the status to stop retrying and
        # redirect the page itself.
        location @upload_unauthorized {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Cache-Control "no-store" always;
            return 401 '{"error":"unauthenticated","message":"Your Intact.AI session expired. Sign in again to continue uploading.","reason":"expired"}';
        }

        # 403 from the verify: signed in, but this role may not use the tool.
        # A page (or JSON for tus), never the login redirect: the session is
        # fine, so login.html would just send them back here in a loop.
        location @velociraptor_forbidden {
            default_type text/html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Cache-Control "no-store" always;
            return 403 '<!doctype html><title>Access denied</title><p>Your role cannot open Velociraptor. Ask an Intact.AI administrator for access.</p>';
        }
        location @upload_forbidden {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Cache-Control "no-store" always;
            return 403 '{"error":"forbidden","message":"Your role cannot upload evidence. Ask an Intact.AI administrator for access.","reason":"role"}';
        }

        # Velociraptor GUI proxy
        location /velociraptor/ {
            # Requires an Intact session before the request is even proxied.
            # Velociraptor has its own login behind this (see
            # modules/velociraptor/entrypoint.sh) — this is the same
            # two-step the Basic Auth prompt used to impose, not a new one.
            set $intact_tool velociraptor;
            auth_request /api/auth/verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            auth_request_set $intact_auth $upstream_http_x_intact_auth;
            error_page 401 = @login_redirect;
            error_page 403 = @velociraptor_forbidden;

            # Using a variable forces Nginx to use the resolver for DNS
            # Note: with variable proxy_pass, must explicitly pass the URI
            set $velociraptor_upstream "intact_velociraptor:8889";
            proxy_pass http://$velociraptor_upstream$request_uri;
            proxy_set_header Cookie $intact_tool_cookie;
            proxy_set_header Authorization $intact_tool_authz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Note: proxy_redirect default cannot be used with variable proxy_pass
        }

        # VolWeb is served directly on host port 8002 (see
        # modules/volweb/docker-compose.yaml). The dashboard's "Open
        # VolWeb" button links to http://<host>:8002/ — no path-based
        # proxy here because the upstream Vue bundle hardcodes /assets/
        # paths under root and a sub-path proxy would break them.

        # tus upload endpoint - proxy to tusd server for resumable uploads
        location /api/uploads/ {
            # Gated here rather than in the backend: this proxies straight to
            # tusd, so no Flask code ever runs for an upload. Without it this
            # is unauthenticated, size-unbounded ingestion (client_max_body_size
            # 0 below).
            #
            # The subrequest fires once per tus PATCH — ~320 times for a 10 GB
            # upload at the 32 MB chunkSize in js/upload.js — so
            # /api/auth/verify is a pure signed-cookie check with no database
            # access. It was 5 MB (~2000 subrequests for that same upload)
            # until measurement showed the per-chunk round trip, not the
            # bytes, dominating large uploads.
            # `set` must stay above the `rewrite ... break` below, which ends
            # the rewrite directives (a `set` after it never runs).
            set $intact_tool uploads;
            auth_request /api/auth/verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            error_page 401 = @upload_unauthorized;
            error_page 403 = @upload_forbidden;

            # Using a variable forces Nginx to use the resolver for DNS
            # Rewrite /api/uploads/* to /files/* for tusd
            set $tusd_upstream "intact_tusd:8080";
            rewrite ^/api/uploads/(.*)$ /files/$1 break;
            proxy_pass http://$tusd_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite Location header from tusd (/files/) to our public path (/api/uploads/)
            proxy_redirect ~^(https?://[^/]+)/files/(.*)$ $1/api/uploads/$2;

            # tus protocol headers - pass through
            proxy_set_header Tus-Resumable $http_tus_resumable;
            proxy_set_header Upload-Length $http_upload_length;
            proxy_set_header Upload-Offset $http_upload_offset;
            proxy_set_header Upload-Metadata $http_upload_metadata;
            proxy_set_header Content-Type $http_content_type;

            # No CORS: the only uploader is the dashboard's own tus client, on
            # this origin, which reads every response header (Location,
            # Upload-Offset) without Expose-Headers. tusd echoes the request's
            # Origin back as Access-Control-Allow-Origin on its own, so that
            # stays hidden: no other site gets to read upload replies.
            # Note: add_header directives are NOT inherited into a location
            # that defines its own, so the server-level headers have to
            # be repeated here (and in every location below that sets its
            # own add_header) or browsers would silently stop seeing them.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header X-Intact-User;
            proxy_hide_header X-Intact-Auth;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

            # No size limit for tus (chunked uploads)
            client_max_body_size 0;

            # Stability for tus behind nginx: stream PATCH bodies straight through
            # to tusd instead of buffering the whole chunk in nginx first (buffering
            # is what stalls/drops large or slow uploads and bloats nginx memory).
            # HTTP/1.1 keeps the upstream connection alive for chunked transfer.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;

            # Increase timeouts for large uploads
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            # tusd recreates alongside the backend during an upgrade swap —
            # same brief-outage gap as /api/ (see the matching comment
            # below). Return a clean JSON error instead of nginx's raw HTML
            # page; tus clients retry resumable uploads on their own, this
            # just avoids surfacing a confusing raw error to any consumer
            # that inspects the response body.
            proxy_intercept_errors on;
            error_page 502 503 504 = @tusd_unavailable;
        }

        location @tusd_unavailable {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Retry-After 5 always;
            return 503 '{"error":"upload_service_unavailable","message":"IntactAI upload service is restarting (upgrade in progress). Please retry in a few seconds.","retry_after":5}';
        }

        # Backend API proxy (uses velociraptor CLI)
        # A memory image posted straight to the API (a script, curl) rather than
        # through the resumable tus path the UI uses. The server-level
        # client_max_body_size of 500M applies to /api/ and a memory dump is
        # measured in gigabytes, so without this nginx answers 413 with an HTML
        # page the caller's JSON parser then chokes on -- and Flask never sees
        # the request, so there is no run, no log and nothing to retry. That is
        # exactly how a 1.5 GB upload failed as "Unexpected token '<'".
        #
        # This is the same shape as the tus location: no size cap, bodies
        # streamed straight through rather than buffered in nginx first, and an
        # hour to finish. The UI does NOT come through here.
        location = /api/memory/upload {
            set $backend_upstream "intact_backend:5001";
            proxy_pass http://$backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_unavailable;
        }

        # Volatility's whole Windows symbol pack (windows.zip) is 840 MB, over the
        # 500M /api/ cap. Same shape as /api/memory/upload: no cap, streamed.
        location = /api/memory/symbols/upload {
            set $backend_upstream "intact_backend:5001";
            proxy_pass http://$backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_unavailable;
        }

        location /api/ {
            # Using a variable forces Nginx to use the resolver for DNS
            # Note: with variable proxy_pass, must explicitly pass the URI
            set $backend_upstream "intact_backend:5001";
            proxy_pass http://$backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for long-running artifact operations
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;

            # JSON replies compressed: the pickers load the whole fleet, about
            # 200 bytes a client -- 2 MB at 10,000 -- and a case graph is larger.
            # JSON only: streams (text/event-stream) and file downloads are left
            # as they are.
            gzip on;
            gzip_types application/json;
            gzip_min_length 1024;

            # No CORS headers: the dashboard calls /api/ from this same origin
            # and nothing on another origin calls it. The old wildcard never
            # covered cookie-carrying requests (browsers refuse `*` with
            # credentials), so it only invited other sites to read whatever
            # /api/ answers without a session. Cross-origin writes are refused
            # by the backend itself.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # The backend container is briefly unavailable during an upgrade
            # recreate (image swap or restart). The dashboard's own JS polling
            # already tolerates this (try/catch + re-poll within 1-10s), but a
            # direct hit to an /api/ URL during that window — a manually
            # opened status link, a script, curl — would otherwise get
            # nginx's raw HTML error page. Serve a small JSON message instead
            # so any caller can detect and retry cleanly.
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_unavailable;
        }

        location @backend_unavailable {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Retry-After 5 always;
            return 503 '{"error":"backend_unavailable","message":"IntactAI backend is restarting (upgrade in progress). Please retry in a few seconds.","retry_after":5}';
        }

        # Root - serve dashboard
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # "no-cache", not "no-store": the browser keeps its copy but asks every
            # time, and an unchanged file comes back as a 304 with no body. It is
            # never stale -- an edit is seen on the next load, the ?v= bumps still
            # work. "no-store" re-downloaded the 210 KB Case Analysis page and all
            # its scripts, uncompressed, on every visit to the tab.
            gzip on;
            gzip_types text/css application/javascript application/json image/svg+xml;
            gzip_min_length 1024;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
            add_header Cache-Control "no-cache";
        }
    }

    # VolWeb — dedicated HTTPS server on host port 8002.
    # The upstream VolWeb frontend image hardcodes Vue's base URL as
    # `/`, so it can't be served under a sub-path of the main
    # dashboard (every /assets/ request 404s against the IntactAI
    # html). Using a separate port + server block keeps URL paths
    # clean while still terminating TLS in the main nginx — operators
    # don't have to disable cert warnings on a second hostname.
    server {
        listen 8002 ssl;
        listen [::]:8002 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        # Generous upload size — VolWeb accepts memory dumps directly
        # too (we use the shared-volume fast-path internally, but the
        # native UI's "Upload" button is still useful for off-platform
        # dumps).
        client_max_body_size 64g;

        # Intact login gate. A second port is its own server, so it needs its
        # own internal verify location (an obscure path, so it cannot shadow a
        # VolWeb one) and a redirect to the login page on 443, not this port.
        # The session cookie has no port, so the browser sends it here too.
        location = /__intact_auth_verify {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=volweb;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location @login_redirect {
            add_header Cache-Control "no-store" always;
            return 302 https://$host/login.html?reason=expired;
        }
        # 403 from the verify: signed in, but this role may not open the tool.
        # Its own page, not the login redirect, which would loop (the session
        # is fine). The same in every tool server below.
        location @forbidden {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            return 403 '<!doctype html><title>Access denied</title><p>Your role cannot open VolWeb. Ask an Intact.AI administrator for access.</p>';
        }

        # Django admin can change any VolWeb password, the Super-admin's tool
        # account included: its own gate (access_policy.TOOLS volweb_admin).
        location = /__intact_auth_verify_admin {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=volweb_admin;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /admin/ {
            auth_request /__intact_auth_verify_admin;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;
            set $volweb_upstream "intact_volweb_frontend:3000";
            proxy_pass http://$volweb_upstream;
            proxy_set_header Cookie $intact_tool_cookie;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Entry point from the dashboard's "Open VolWeb". VolWeb's SPA shows its
        # login form unless localStorage holds a token; nginx replaces the
        # Bearer on every request with the signed-in Intact user's own
        # (Authorization below), so placeholders are enough and whatever an
        # earlier user left there is never used. $intact_user is [a-z0-9._-].
        location = /__intact_sso {
            auth_request /__intact_auth_verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            return 200 '<!doctype html><title>Opening VolWeb</title><script>localStorage.setItem("access_token","intact");localStorage.setItem("refresh_token","intact");localStorage.setItem("username","$intact_user");location.replace("/");</script>';
        }

        location / {
            auth_request /__intact_auth_verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            auth_request_set $intact_auth $upstream_http_x_intact_auth;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            # Frontend container's nginx listens on 3000 (verified via
            # `cat /etc/nginx/conf.d/default.conf` — port 80 in the
            # image manifest is misleading; only 3000 is wired up).
            set $volweb_upstream "intact_volweb_frontend:3000";
            proxy_pass http://$volweb_upstream;
            # Not the dashboard's intact_session (see $intact_tool_cookie).
            proxy_set_header Cookie $intact_tool_cookie;
            proxy_set_header Authorization $intact_tool_authz;
            # Force Host: localhost — VolWeb's Django backend rejects
            # any HTTP_HOST containing underscores (RFC 1034/1035 /
            # DisallowedHost). The frontend's internal nginx proxies
            # /api/ → backend and forwards the Host header verbatim
            # by default, so without this override the API path 400s.
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support — VolWeb uses Django Channels (daphne)
            # to push selective-extraction + yarascan progress.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # IRIS on its own port (8444; the host's 8443 is IRIS's own 127.0.0.1-only
    # port). Proxies to IRIS's nginx, which keeps its own TLS. Same gate as the
    # VolWeb server above.
    server {
        listen 8444 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Evidence and report uploads go into IRIS directly.
        client_max_body_size 0;

        location = /__intact_auth_verify {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=iris;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location @login_redirect {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 302 https://$host/login.html?reason=expired;
        }
        location @forbidden {
            default_type text/html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 403 '<!doctype html><title>Access denied</title><p>Your role cannot open IRIS. Ask an Intact.AI administrator for access.</p>';
        }

        location / {
            auth_request /__intact_auth_verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            set $iris_upstream "intact_iris_nginx:8443";
            proxy_pass https://$iris_upstream$request_uri;
            proxy_set_header Cookie $intact_tool_cookie;
            # $http_host keeps :8444, so IRIS's redirects and its CSRF
            # origin/referrer check see the port the browser used.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # socket.io (case activity, notifications).
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Stream big uploads through instead of spooling them in nginx.
            proxy_request_buffering off;
        }
    }

    # Timesketch on its own port (5443; the host's 5000 is Timesketch's own
    # 127.0.0.1-only port). Proxies to Timesketch's nginx, which keeps its TLS
    # and its /legacy/ and /v3/ routing.
    server {
        listen 5443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Plaso and CSV timeline uploads go into Timesketch directly.
        client_max_body_size 0;

        location = /__intact_auth_verify {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=timesketch;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location @login_redirect {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 302 https://$host/login.html?reason=expired;
        }
        location @forbidden {
            default_type text/html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 403 '<!doctype html><title>Access denied</title><p>Your role cannot open Timesketch. Ask an Intact.AI administrator for access.</p>';
        }

        location / {
            auth_request /__intact_auth_verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            auth_request_set $intact_auth $upstream_http_x_intact_auth;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            set $timesketch_upstream "intact_timesketch_nginx:5000";
            proxy_pass https://$timesketch_upstream$request_uri;
            proxy_set_header Cookie $intact_tool_cookie;
            # Timesketch's header SSO under a per-box secret header name
            # (written by lib/modules/timesketch.sh render_timesketch_conf_templates;
            # absent until then, and Timesketch shows its own login).
            include /etc/nginx/local/timesketch-sso*.conf;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Same as Timesketch's own nginx: long uploads and analyzer calls.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # Stream big uploads through instead of spooling them in nginx.
            proxy_request_buffering off;
        }
    }

    # Kibana on its own port (5602; the host's 5601 is Kibana's own
    # 127.0.0.1-only port). Its own origin, not a /kibana/ path under the
    # dashboard, so Kibana's pages share no cookies or storage with Intact.
    # The listen ports here are fixed; the operator picks the host side of
    # each publish in config.yaml (modules/nginx/docker-compose.yaml).
    server {
        listen 5602 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /__intact_auth_verify {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=kibana;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location @login_redirect {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 302 https://$host/login.html?reason=expired;
        }
        location @forbidden {
            default_type text/html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 403 '<!doctype html><title>Access denied</title><p>Your role cannot open Kibana. Ask an Intact.AI administrator for access.</p>';
        }

        location / {
            auth_request /__intact_auth_verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            auth_request_set $intact_auth $upstream_http_x_intact_auth;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;

            # Variable upstream: nginx still starts when ELK is not installed.
            set $kibana_upstream "intact_kibana:5601";
            proxy_pass https://$kibana_upstream$request_uri;
            proxy_set_header Cookie $intact_tool_cookie;
            proxy_set_header Authorization $intact_tool_authz;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Portainer on its own port (9444; the host's 9443 is Portainer's own
    # 127.0.0.1-only port, which the upgrade engine probes).
    server {
        listen 9444 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Image tar imports go into Portainer directly; the http-level 500M
        # would 413 them (direct 9443 never had a limit).
        client_max_body_size 0;

        location = /__intact_auth_verify {
            internal;
            set $auth_upstream "intact_backend:5001";
            proxy_pass http://$auth_upstream/api/auth/verify?tool=portainer;
            proxy_pass_request_body off;
            # auth subrequests are always GET: the backend's cross-origin check
            # needs the real method (nginx injects the user's credential, so a
            # same-site page could otherwise drive the tool as them).
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location @login_redirect {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 302 https://$host/login.html?reason=expired;
        }
        location @forbidden {
            default_type text/html;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store" always;
            return 403 '<!doctype html><title>Access denied</title><p>Your role cannot open Portainer. Ask an Intact.AI administrator for access.</p>';
        }

        location / {
            auth_request /__intact_auth_verify;
            auth_request_set $intact_user $upstream_http_x_intact_user;
            error_page 401 = @login_redirect;
            error_page 403 = @forbidden;
            # Stream big uploads through instead of spooling them in nginx.
            proxy_request_buffering off;

            set $portainer_upstream "intact_portainer:9443";
            proxy_pass https://$portainer_upstream$request_uri;
            proxy_set_header Cookie $intact_tool_cookie;
            # Host with the port so Portainer's Origin-vs-Host CSRF check passes.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Container consoles and attach run over a WebSocket; an idle
            # shell would be cut after nginx's default 60s read timeout.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
