worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Use Docker's internal DNS server to re-resolve container IPs after restarts
    # valid=30s means re-check DNS every 30 seconds
    # ipv6=off because Docker internal network is IPv4 only
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Increase upload limit for offline collectors (importer.py limit is 500MB)
    client_max_body_size 500M;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Plaintext HTTP entry point (80, 8080). The only response here is an
    # upgrade to HTTPS: the dashboard, /api/ backend, and tus upload proxy
    # all move to the TLS server block below so cloud credentials, LLM API
    # keys, Velociraptor collection passwords, and case data are never
    # transmitted in cleartext (CWE-319).
    #
    # $host reflects the client-supplied Host header. It's validated
    # against a plain hostname/IP-literal pattern before being reflected
    # into the redirect's Location — anything else is rejected outright —
    # and the redirect is marked non-cacheable, so a spoofed/malformed
    # Host can't be turned into an attacker-controlled open-redirect
    # target or poison a shared cache sitting in front of the appliance.
    server {
        listen 80;
        listen 8080;
        server_name _;

        if ($host !~* "^(\[[0-9a-fA-F:]+\]|[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?)$") {
            return 400;
        }

        add_header Cache-Control "no-store" always;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        # Tell browsers to stop offering plaintext HTTP after first contact.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Server-level HTTP Basic Auth gate (CWE-306). Without this, every
        # location below — the dashboard, /api/ (read/export/delete any
        # case, launch Velociraptor hunts, POST /api/maintenance/purge),
        # /api/uploads/ (unauthenticated size-unbounded tus ingestion), and
        # /velociraptor/ — is reachable by anyone who can route to this
        # port with zero credentials; the backend itself performs no
        # compensating auth check (see modules/backend/app.py /
        # routes/case_routes.py). auth_basic is a server-level directive so
        # it's inherited by every location in this block; the htpasswd file
        # is generated per-install (see lib/modules.sh:generate_nginx_secrets
        # and services/upgrade/intact.py:ensure_nginx_basic_auth_secret) —
        # never a hardcoded credential.
        auth_basic "Intact.AI";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Velociraptor GUI proxy
        location /velociraptor/ {
            # Using a variable forces Nginx to use the resolver for DNS
            # Note: with variable proxy_pass, must explicitly pass the URI
            set $velociraptor_upstream "intact_velociraptor:8889";
            proxy_pass http://$velociraptor_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Note: proxy_redirect default cannot be used with variable proxy_pass
        }

        # VolWeb is served directly on host port 8002 (see
        # modules/volweb/docker-compose.yaml). The dashboard's "Open
        # VolWeb" button links to http://<host>:8002/ — no path-based
        # proxy here because the upstream Vue bundle hardcodes /assets/
        # paths under root and a sub-path proxy would break them.

        # tus upload endpoint - proxy to tusd server for resumable uploads
        location /api/uploads/ {
            # Using a variable forces Nginx to use the resolver for DNS
            # Rewrite /api/uploads/* to /files/* for tusd
            set $tusd_upstream "intact_tusd:8080";
            rewrite ^/api/uploads/(.*)$ /files/$1 break;
            proxy_pass http://$tusd_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite Location header from tusd (/files/) to our public path (/api/uploads/)
            proxy_redirect ~^(https?://[^/]+)/files/(.*)$ $1/api/uploads/$2;

            # tus protocol headers - pass through
            proxy_set_header Tus-Resumable $http_tus_resumable;
            proxy_set_header Upload-Length $http_upload_length;
            proxy_set_header Upload-Offset $http_upload_offset;
            proxy_set_header Upload-Metadata $http_upload_metadata;
            proxy_set_header Content-Type $http_content_type;

            # Expose tus headers to client
            # Note: add_header directives are NOT inherited into a location
            # that defines its own, so the server-level HSTS header has to
            # be repeated here (and in every location below that sets its
            # own add_header) or browsers would silently stop seeing it.
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'POST, GET, HEAD, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Tus-Resumable, Upload-Length, Upload-Offset, Upload-Metadata, Content-Type, X-HTTP-Method-Override' always;
            add_header Access-Control-Expose-Headers 'Tus-Resumable, Upload-Length, Upload-Offset, Location, Upload-Metadata' always;

            # No size limit for tus (chunked uploads)
            client_max_body_size 0;

            # Stability for tus behind nginx: stream PATCH bodies straight through
            # to tusd instead of buffering the whole chunk in nginx first (buffering
            # is what stalls/drops large or slow uploads and bloats nginx memory).
            # HTTP/1.1 keeps the upstream connection alive for chunked transfer.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;

            # Increase timeouts for large uploads
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # tusd recreates alongside the backend during an upgrade swap —
            # same brief-outage gap as /api/ (see the matching comment
            # below). Return a clean JSON error instead of nginx's raw HTML
            # page; tus clients retry resumable uploads on their own, this
            # just avoids surfacing a confusing raw error to any consumer
            # that inspects the response body.
            proxy_intercept_errors on;
            error_page 502 503 504 = @tusd_unavailable;
        }

        location @tusd_unavailable {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Retry-After 5 always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 503 '{"error":"upload_service_unavailable","message":"IntactAI upload service is restarting (upgrade in progress). Please retry in a few seconds.","retry_after":5}';
        }

        # Backend API proxy (uses velociraptor CLI)
        location /api/ {
            # Using a variable forces Nginx to use the resolver for DNS
            # Note: with variable proxy_pass, must explicitly pass the URI
            set $backend_upstream "intact_backend:5001";
            proxy_pass http://$backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for long-running artifact operations
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;

            # CORS headers
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # The backend container is briefly unavailable during an upgrade
            # recreate (image swap or restart). The dashboard's own JS polling
            # already tolerates this (try/catch + re-poll within 1-10s), but a
            # direct hit to an /api/ URL during that window — a manually
            # opened status link, a script, curl — would otherwise get
            # nginx's raw HTML error page. Serve a small JSON message instead
            # so any caller can detect and retry cleanly.
            proxy_intercept_errors on;
            error_page 502 503 504 = @backend_unavailable;
        }

        location @backend_unavailable {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Retry-After 5 always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 503 '{"error":"backend_unavailable","message":"IntactAI backend is restarting (upgrade in progress). Please retry in a few seconds.","retry_after":5}';
        }

        # Root - serve dashboard
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Disable caching for HTML files
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # VolWeb — dedicated HTTPS server on host port 8002.
    # The upstream VolWeb frontend image hardcodes Vue's base URL as
    # `/`, so it can't be served under a sub-path of the main
    # dashboard (every /assets/ request 404s against the IntactAI
    # html). Using a separate port + server block keeps URL paths
    # clean while still terminating TLS in the main nginx — operators
    # don't have to disable cert warnings on a second hostname.
    server {
        listen 8002 ssl;
        listen [::]:8002 ssl;
        server_name _;

        ssl_certificate /etc/nginx/cert.crt;
        ssl_certificate_key /etc/nginx/cert.key;

        # Generous upload size — VolWeb accepts memory dumps directly
        # too (we use the shared-volume fast-path internally, but the
        # native UI's "Upload" button is still useful for off-platform
        # dumps).
        client_max_body_size 64g;

        location / {
            # Frontend container's nginx listens on 3000 (verified via
            # `cat /etc/nginx/conf.d/default.conf` — port 80 in the
            # image manifest is misleading; only 3000 is wired up).
            set $volweb_upstream "intact_volweb_frontend:3000";
            proxy_pass http://$volweb_upstream;
            # Force Host: localhost — VolWeb's Django backend rejects
            # any HTTP_HOST containing underscores (RFC 1034/1035 /
            # DisallowedHost). The frontend's internal nginx proxies
            # /api/ → backend and forwards the Host header verbatim
            # by default, so without this override the API path 400s.
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support — VolWeb uses Django Channels (daphne)
            # to push selective-extraction + yarascan progress.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
