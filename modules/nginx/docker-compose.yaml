# Nginx Reverse Proxy
# Port: 80 (HTTP)

services:
  nginx:
    container_name: intact_nginx
    # Pinned default (was floating :-alpine) so a bare `docker compose up` or an
    # older config without the pin is still reproducible. install/upgrade stamp
    # NGINX_VERSION from versions.nginx in config.yaml.
    image: nginx:${NGINX_VERSION:-1.31.2-alpine}
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./ssl/nginx-cert.crt:/etc/nginx/cert.crt:ro
      - ./ssl/nginx-cert.key:/etc/nginx/cert.key:ro
      # No htpasswd mount any more. The site's Basic Auth gate was replaced by
      # a session login owned by the backend (see nginx.conf's auth_request
      # block and modules/backend/services/auth_service.py). Do not re-add a
      # bind mount for a file that is no longer generated — docker would create
      # a DIRECTORY at the missing source path and nginx would fail to start.
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
      # VolWeb dashboard tile opens https://<host>:8002/ — main nginx
      # terminates TLS here and proxies to intact_volweb_frontend:80.
      # See modules/nginx/config/nginx.conf for the matching server block.
      - "8002:8002"
    restart: unless-stopped
    networks:
      - intact_network
    healthcheck:
      # Port 80 now redirects to HTTPS (see nginx.conf); wget's --spider
      # would follow that redirect and then fail on the self-signed cert,
      # so use curl -f, which treats the 301 itself as a healthy response.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  intact_network:
    external: true
