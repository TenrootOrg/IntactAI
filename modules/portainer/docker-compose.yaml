# Portainer - Docker Management UI
# Port: 9443 (Web UI - HTTPS)

services:
  portainer-agent:
    container_name: intact_portainer_agent
    image: portainer/agent:${PORTAINER_AGENT_VERSION:-2.39.5}
    # Only the real docker.sock mount is needed for the agent to manage
    # containers/images/networks/volumes via the Docker API. The
    # /var/lib/docker/volumes host mount (dropped here) only powers
    # Portainer's optional "browse volume contents by host path" file
    # browser feature, which isn't used — it was pure extra host
    # filesystem exposure for a feature we don't need.
    #
    # NOT fronted by a docker-socket-proxy: the agent already implements
    # its own protocol-level restriction between itself and the Portainer
    # server (it isn't a raw docker.sock passthrough), and real-world
    # reports (Tecnativa/docker-socket-proxy#57) show wrapping the agent's
    # own socket in a second generic proxy breaks agent<->server
    # connectivity with no documented fix — not worth the risk for a
    # narrower, already-partially-covered threat model.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - portainer_internal
      - intact_network

  portainer:
    container_name: intact_portainer
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.39.5}
    # Serve the UI with the shared Nginx TLS cert so Portainer presents the
    # same certificate as the rest of the stack on :443, instead of the
    # self-signed cert Portainer generates internally on first run.
    # --tlsskipverify refers to trust for the portainer-agent connection
    # (unrelated to the UI cert flags below).
    # --admin-password-file seeds the admin account on first boot so the
    # install doesn't hit Portainer's 5-minute "initial setup" timeout; the
    # password file is produced by generate_portainer_secrets() in lib/modules.sh.
    command: >-
      -H tcp://portainer-agent:9001
      --tlsskipverify
      --tlscert /certs/cert.pem
      --tlskey /certs/key.pem
      --admin-password-file /run/secrets/portainer_admin_password
    volumes:
      - portainer_data:/data
      - ../nginx/ssl/nginx-cert.crt:/certs/cert.pem:ro
      - ../nginx/ssl/nginx-cert.key:/certs/key.pem:ro
      - ./secrets/admin_password:/run/secrets/portainer_admin_password:ro
    ports:
      - "9443:9443"
    restart: unless-stopped
    depends_on:
      - portainer-agent
    networks:
      - portainer_internal
      - intact_network

volumes:
  portainer_data:

networks:
  portainer_internal:
    name: portainer_internal
  intact_network:
    external: true
