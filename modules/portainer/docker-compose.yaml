# Portainer - Docker Management UI
# Port: 9443 (Web UI - HTTPS)

services:
  portainer-agent:
    container_name: mssp_portainer_agent
    image: portainer/agent:${PORTAINER_AGENT_VERSION:-2.27.0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    restart: unless-stopped
    networks:
      - portainer_internal
      - mssp_network

  portainer:
    container_name: mssp_portainer
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.27.0}
    command: -H tcp://portainer-agent:9001 --tlsskipverify
    volumes:
      - portainer_data:/data
    ports:
      - "9443:9443"
    restart: unless-stopped
    depends_on:
      - portainer-agent
    networks:
      - portainer_internal
      - mssp_network

volumes:
  portainer_data:

networks:
  portainer_internal:
    name: portainer_internal
  mssp_network:
    external: true
