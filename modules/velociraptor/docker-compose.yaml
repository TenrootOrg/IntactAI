# Velociraptor - EDR/Forensics Platform
# Ports: 8889 (GUI), 8000 (TLS Frontend/Clients), 8001 (gRPC API)

services:
  velociraptor:
    container_name: intact_velociraptor
    image: velociraptor-server:${VELOCIRAPTOR_VERSION}
    # `velociraptor-server` is a private local image name (not on any
    # public registry). Without this hint, `docker compose up -d` tries
    # to pull from Docker Hub first, gets "pull access denied", then
    # falls back to build — wasting ~10s and emitting a misleading
    # error. `pull_policy: build` skips the doomed pull and goes
    # straight to the local Dockerfile when the tagged image is
    # missing. No effect when the tagged image already exists.
    pull_policy: build
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - VELOCIRAPTOR_TAG=${VELOCIRAPTOR_TAG}
        - VELOCIRAPTOR_VERSION=${VELOCIRAPTOR_VERSION}
    env_file:
      - .env
    environment:
      - VELOX_FRONTEND_HOSTNAME=${VELOX_FRONTEND_HOSTNAME:-localhost}
      - VELOX_PUBLIC_IP=${VELOX_PUBLIC_IP:-localhost}
      - VELOX_SERVER_URL=${VELOX_SERVER_URL:-https://localhost:8001/}
    volumes:
      # Host-mounted working dir (was the velociraptor_data named volume). Holds
      # server/client/api .config.yaml — server.config.yaml carries the CA, so
      # this MUST survive container/volume deletion or every enrolled client
      # breaks. Host-mounting makes it durable, editable and backuppable. The
      # binary + clients/ are repacked into here by entrypoint.sh on every boot,
      # so only the configs are "real" state. Path is gitignored (CA key).
      # Existing deployments are migrated from the old named volume by
      # services/upgrade/velociraptor.migrate_velociraptor_config_to_host().
      - ${VELO_DATA_PATH:-../../data/velociraptor}:/velociraptor:rw
      - velociraptor_datastore:/var.:rw
      - velociraptor_tmp:/tmp:rw
      - ${TOOLS_PATH:-../../data/tools}:/tools:ro  # Persistent tools directory
      # Shared memory-dump staging — see modules/volweb/docker-compose.yaml
      # for the matching bind on VolWeb's side. The memory pipeline writes
      # the extracted .raw here once instead of: docker-cp host → HTTP
      # upload → VolWeb media. Saves ~9 min and ~10 GB transient disk per
      # 5 GB dump. The host directory is created by install.sh.
      - memory_dumps_shared:/data/memory_dumps:rw
    ports:
      # 8000 is the ONLY port that belongs on a public interface: every enrolled
      # endpoint phones home here over TLS, and README's firewall matrix lists
      # it as required.
      #
      # The GUI and the gRPC API are localhost-only. Both were published on all
      # interfaces, and the GUI runs plain HTTP with use_plain_http (see
      # entrypoint.sh) — so port 8889 was a direct bypass of nginx's TLS *and*
      # its Basic Auth, for a service that holds case data and can task
      # endpoints. Neither port needs to be reachable off-box: nginx proxies
      # /velociraptor/ to intact_velociraptor:8889 and the backend reaches the
      # API at intact_velociraptor:8001, both over intact_network by container
      # name. Kept as loopback rather than removed so lib/health.sh's
      # localhost:8001 probe still works.
      - "127.0.0.1:8889:8889"   # GUI (HTTP) — analysts use nginx /velociraptor/
      - "8000:8000"             # TLS Frontend (client connections) — public
      - "127.0.0.1:8001:8001"   # gRPC API — backend uses the container name
    restart: unless-stopped
    networks:
      - intact_network

volumes:
  # velociraptor_data removed — /velociraptor is now a host bind-mount (see above).
  velociraptor_datastore:
  velociraptor_tmp:
  # Shared with modules/backend + modules/volweb. The volume is
  # pre-created by install.sh:ensure_shared_volumes() so every stack
  # treats it as `external` and nobody fights over ownership.
  memory_dumps_shared:
    external: true
    name: intact_memory_dumps

networks:
  intact_network:
    external: true
