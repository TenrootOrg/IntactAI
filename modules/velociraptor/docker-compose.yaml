# Velociraptor - EDR/Forensics Platform
# Ports: 8889 (GUI), 8000 (TLS Frontend/Clients), 8001 (gRPC API)

services:
  velociraptor:
    container_name: intact_velociraptor
    image: velociraptor-server:${VELOCIRAPTOR_VERSION}
    # `velociraptor-server` is a private local image name (not on any
    # public registry). Without this hint, `docker compose up -d` tries
    # to pull from Docker Hub first, gets "pull access denied", then
    # falls back to build — wasting ~10s and emitting a misleading
    # error. `pull_policy: build` skips the doomed pull and goes
    # straight to the local Dockerfile when the tagged image is
    # missing. No effect when the tagged image already exists.
    pull_policy: build
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - VELOCIRAPTOR_TAG=${VELOCIRAPTOR_TAG}
        - VELOCIRAPTOR_VERSION=${VELOCIRAPTOR_VERSION}
    env_file:
      - .env
    environment:
      - VELOX_FRONTEND_HOSTNAME=${VELOX_FRONTEND_HOSTNAME:-localhost}
      - VELOX_PUBLIC_IP=${VELOX_PUBLIC_IP:-localhost}
      - VELOX_SERVER_URL=${VELOX_SERVER_URL:-https://localhost:8001/}
    volumes:
      - velociraptor_data:/velociraptor:rw
      - velociraptor_datastore:/var.:rw
      - velociraptor_tmp:/tmp:rw
      - ${TOOLS_PATH:-../../data/tools}:/tools:ro  # Persistent tools directory
      # Shared memory-dump staging — see modules/volweb/docker-compose.yaml
      # for the matching bind on VolWeb's side. The memory pipeline writes
      # the extracted .raw here once instead of: docker-cp host → HTTP
      # upload → VolWeb media. Saves ~9 min and ~10 GB transient disk per
      # 5 GB dump. The host directory is created by install.sh.
      - memory_dumps_shared:/data/memory_dumps:rw
    ports:
      - "8889:8889"   # GUI (HTTP)
      - "8000:8000"   # TLS Frontend (client connections)
      - "8001:8001"   # gRPC API
    restart: unless-stopped
    networks:
      - intact_network

volumes:
  velociraptor_data:
  velociraptor_datastore:
  velociraptor_tmp:
  # Shared with modules/backend + modules/volweb. The volume is
  # pre-created by install.sh:ensure_shared_volumes() so every stack
  # treats it as `external` and nobody fights over ownership.
  memory_dumps_shared:
    external: true
    name: intact_memory_dumps

networks:
  intact_network:
    external: true
