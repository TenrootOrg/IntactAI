name: Windows.Registry.Hunter
description: |
   This artifact parses and categorizes information for the registry.

   Build time: 2026-01-06T23:33:06Z

   Read more about this artifact here https://github.com/Velocidex/registry_hunter

   ## Collecting only few rules

   This artifact contains thousands of rules and by default performs
   deep registry analysis. If you do not need to apply all the rules,
   simply navigate to:

     https://registry-hunter.velocidex.com/docs/rules/

   Select the rule you want and add the description to the
   `DescriptionFilter` parameter below.

   ## RemappingStrategy

   In order to present a unified view of all registry hives we remap various
   hives we remap various hives into the "registry" accessor. There are a
   number of strategies implemented for this:

   1. API - This strategy uses the API for the majority of hives including
      user hives. Therefore users who are not currently logged in will not
      have their NTUser.dat hives mounted.
   2. API And NTUser.dat - This strategy uses the API for most of the hives,
      except for all the raw user hives will be mapped in HKEY_USERS.
      Therefore all users will be visible.
   3. Raw Hives - This stragegy is most suitable for working off an image or
      acquired hive files. All raw hives will be mapped (include SYSTEM, SOFTWARE etc).

   Using the API will result in faster collection times, but may be some
   differences:

   * Some registry keys are blocked with API access, even for the system
     user - so we get permission denied for these. Therefore, even with the API
     stragegy above we remap the raw files into the "raw_registry" accessor.
     The rule may work around this by using this accessor directly.
   * Some hive files are not accessible and can only be accessible using the
     API (e.g. the BCD hives).

   ## CollectionPolicy

   Some rules attempt to resolve links to other files on the disk. For
   example, category `Autoruns` may attempt to resolve the actual
   binaries being launched. These targets may be collected according
   to the `CollectionPolicy`. By default targets are not
   resolved. However, you may specify that unsigned binaries be
   collected (uploaded to the server), or other files (e.g. a `lnk`
   file).

parameters:
- name: Categories
  type: multichoice
  default: |
   ["ASEP","ASEP Classes","Antivirus","Autoruns","Cloud Storage","Devices","Event Logs","Installed Software","Microsoft Exchange","Microsoft Office","Network Shares","Persistence","Program Execution","Services","System Info","Third Party Applications","Threat Hunting","User Accounts","User Activity","Volume Shadow Copies","Web Browsers"]
  choices:
    - "ASEP"
    - "ASEP Classes"
    - "Antivirus"
    - "Autoruns"
    - "Cloud Storage"
    - "Devices"
    - "Event Logs"
    - "Installed Software"
    - "Microsoft Exchange"
    - "Microsoft Office"
    - "Network Shares"
    - "Persistence"
    - "Program Execution"
    - "Services"
    - "System Info"
    - "Third Party Applications"
    - "Threat Hunting"
    - "User Accounts"
    - "User Activity"
    - "Volume Shadow Copies"
    - "Web Browsers"
- name: RuleFilter
  type: regex
  default: .

- name: CollectionPolicy
  description: |
    Extracted targets will be collected using this policy.
  type: choices
  choices:
    - ExcludeSigned
    - HashOnly
    - AllFiles
    - None
  default: HashOnly

- name: MaxFileSize
  type: int
  description: |
    The max size in bytes of the individual files to upload (Default 100mb).

- name: MaxHashSize
  type: int
  description: |
    The max size in bytes of the individual files to hash (default 100mb).

- name: RemappingStrategy
  description: |
     In order to present a unified view of all registry hives we remap various hives
     into the "registry" accessor. This setting controls the strategy we use to do so.
     See more information in the artifact description.
  type: choices
  default: "API And NTUser.dat"
  choices:
   - API
   - API And NTUser.dat
   - Raw Hives
   - None

- name: TrustedPathRegex
  type: regex
  default: ^C:\\\\Windows\\\\
  description: Do not hash or upload any files matching this regex.

- name: RootDrive
  default: C:/
  description: |
     Path to the top level drive. If one of the PathTO* parameters are not
     specified, then we use this to figure out the usual paths to the hives.

- name: AlsoUploadHives
  type: bool
  description: If checked, we also upload all the hives.

- name: DEBUG
  type: bool
  description: Add more logging.

implied_permissions:
- IMPERSONATION

export: |
    LET _info <= SELECT * FROM info()
    LET S = scope()
    LET RootFilter <= S.RootFilter || "."
    LET NTFS_CACHE_TIME <= S.NTFS_CACHE_TIME || 1000000
    LET CollectionPolicy <= S.CollectionPolicy || "ExcludeSigned"
    LET RemappingStrategy <= S.RemappingStrategy || "API And NTUser.dat"

    LET CollectionPolicy <= if(condition=RemappingStrategy =~ "API",
      then= CollectionPolicy,
      else=log(message="CollectionPolicy set to None as RemappingStrategy strategy is not API based") && "None")

    LET MaxFileSize <= S.MaxFileSize || 100000000
    LET MaxHashSize <= S.MaxHashSize || 100000000

    LET _ <= log(message="MaxFileSize %v, MaxHashSize %v", args=[ MaxFileSize, MaxHashSize])

    // In ExcludeSigned and HashOnly we dont upload signed binaries.
    LET ShouldUploadSignedBinary <= dict(
       ShouldUpload = NOT CollectionPolicy =~ "ExcludeSigned|HashOnly")

    // In HashOnly mode we never upload anything.
    LET ShouldUploadAnyFile <= dict(
       ShouldUpload = NOT CollectionPolicy =~ "HashOnly|None")

    LET DoNotUpload <= dict(ShouldUpload=FALSE)

    // Upload the file if ShouldUpload marks it ready for upload.
    LET MaybeUpload(OSPath, Details) = if(
      condition=Details.Stat AND Details.ShouldUpload,
      then=Details + dict(Upload=upload(file=OSPath)),
      else=Details)

    // Determine if we should upload the file based on signature.
    LET ShouldUpload(Details) = if(
      condition= OSPath =~ TrustedPathRegex OR
                 NOT Details.Stat.Size OR
                 ( MaxFileSize > 0 AND Details.Stat.Size > MaxFileSize ),
      then= Details + DoNotUpload,
      else=if(
       // What to do about binaries? If they have an issuer name then
       // they are signed.
       condition=Details.Signatures.IssuerName,
       then=Details + ShouldUploadSignedBinary,
       else=Details + ShouldUploadAnyFile))

    // If the file is a binary, also add authenticode information.
    LET MaybeBinary(OSPath, Details) = ShouldUpload(Details=if(
       condition=Details.Magic =~ "PE.+executable",
       then=Details + dict(Signatures=authenticode(filename=OSPath)),
       else=Details))

    // Hash the file if it is not too large
    LET MaybeHash(OSPath, Details) = if(
      condition=Details.Stat AND Details.Stat.Size < MaxHashSize
                AND NOT OSPath =~ TrustedPathRegex,
      then=Details + dict(Hashes=hash(path=OSPath),
                          Magic=magic(path=OSPath)),
      else=Details)

    // Calculate the details column with hashes and magic.
    LET _GetDetails(OSPath) = if(
    condition= CollectionPolicy =~ "None" OR NOT OSPath.Components,
    then=dict(),
    else=MaybeUpload(OSPath=OSPath, Details=MaybeBinary(
      OSPath=OSPath,
      Details=MaybeHash(OSPath=OSPath,
           Details=dict(filename=OSPath, Stat=OSPath &&
              log(message="Checking file %v", args=OSPath, dedup= -1) &&
              stat(filename=OSPath))))))

    LET GetDetails(OSPath) = cache(period=10000,
       func= _GetDetails(OSPath=pathspec(parse=OSPath, path_type="windows")),
       name="GetDetails", key=str(str=OSPath))

    -- This contains the metadata for Glob rules.
    LET _MD <= parse_json_array(data=gunzip(string=base64decode(string="")))
    LET MD(DescriptionFilter, RootFilter, CategoryFilter, CategoryExcludedFilter) =
     SELECT Glob, Category, Description,
            get(field="Details") AS Details,
            get(field="Comment") AS Comment,
            get(field="Filter") AS Filter, Root
     FROM _MD
     WHERE Description =~ DescriptionFilter
       AND Root =~ RootFilter
       AND Category =~ CategoryFilter
       AND NOT Category =~ CategoryExcludedFilter

    -- On Non Windows systems we need to use case insensitive accessor or we might not find the right hives.
    LET DefaultAccessor <= if(condition=_info[0].OS =~ "windows", then="ntfs", else="file_nocase")
    LET HKLM <= pathspec(parse="HKEY_LOCAL_MACHINE", path_type="registry")
    LET RootDrive <= pathspec(Path=S.RootDrive || "C:/")
    LET PathTOSAM <= S.PathTOSAM || RootDrive + "Windows/System32/config/SAM"
    LET PathTOAmcache <= S.PathTOAmcache || RootDrive + "Windows/appcompat/Programs/Amcache.hve"
    LET PathTOSystem <= S.PathTOSystem || RootDrive + "Windows/System32/Config/System"
    LET PathTOSecurity <= S.PathTOSecurity || RootDrive + "Windows/System32/Config/Security"
    LET PathTOSoftware <= S.PathTOSoftware || RootDrive + "Windows/System32/Config/Software"
    LET PathTOUsers <= S.PathTOUsers || RootDrive + "Users/"

    -- HivePath: The path to the hive on disk
    -- RegistryPath: The path in the registry to mount the hive
    -- RegMountPoint: The path inside the hive to mount (usually /)
    LET _map_file_to_reg_path(HivePath, RegistryPath, RegMountPoint, Accessor, Description) = dict(
       type="mount", description=Description,
       `from`=dict(accessor='raw_reg',
                   prefix=pathspec(
                      Path=RegMountPoint,
                      DelegateAccessor=Accessor,
                      DelegatePath=HivePath),
                   path_type='registry'),
        `on`=dict(accessor='registry',
                  prefix=RegistryPath,
                  path_type='registry'))

    LET _standard_mappings = (
       _map_file_to_reg_path(
          HivePath=PathTOSystem,
          RegistryPath="HKEY_LOCAL_MACHINE\\System\\CurrentControlSet",
          RegMountPoint="/ControlSet001",
          Accessor=DefaultAccessor,
          Description="Map SYSTEM Hive to CurrentControlSet"),
       _map_file_to_reg_path(
          HivePath=PathTOSoftware,
          RegistryPath="HKEY_LOCAL_MACHINE\\Software",
          RegMountPoint="/",
          Accessor=DefaultAccessor,
          Description="Map Software hive to HKEY_LOCAL_MACHINE"),
       _map_file_to_reg_path(
          HivePath=PathTOSystem,
          RegistryPath="HKEY_LOCAL_MACHINE\\System",
          RegMountPoint="/",
          Accessor=DefaultAccessor,
          Description="Map System hive to HKEY_LOCAL_MACHINE"),
       _map_file_to_reg_path(
          HivePath=PathTOSecurity,
          RegistryPath="HKEY_LOCAL_MACHINE\\Security",
          RegMountPoint="/",
          Accessor=DefaultAccessor,
          Description="Map SECURITY Hive to HKEY_LOCAL_MACHINE"),
    )

    // Map raw hives for hives that are not normally accessible via API
    LET _unmounted_hive_mapping = (
      _map_file_to_reg_path(
          HivePath=PathTOSAM,
          RegistryPath="SAM",
          RegMountPoint="/",
          Accessor=DefaultAccessor,
          Description="Map SAM to /SAM/"),
      _map_file_to_reg_path(
          HivePath=PathTOAmcache,
          RegistryPath="Amcache",
          RegMountPoint="/",
          Accessor=DefaultAccessor,
          Description="Map Amcache to /Amcache/"),
    )

    LET _Env = SELECT _value FROM items(item= {
       SELECT * FROM environ()
    })

    LET _VQLEnv = SELECT dict(key=_key, value=_value) AS Items
    FROM items(item=_Env[0]._value)
    WHERE _key AND NOT _key =~ "VELOCIRAPTOR"

    LET _api_remapping <= (
        dict(type="impersonation",
            os="windows",
            hostname="RegistryMapper",
            env=_VQLEnv.Items),
        -- By default remap the entire "registry" accessor for API access.
        dict(type="mount",
          `from`=dict(accessor="registry", prefix='/', path_type='registry'),
          on=dict(accessor="registry", prefix='/', path_type="registry")),

       -- Always remap raw Security because the API stops us from reading the keys.
       _map_file_to_reg_path(
          HivePath=PathTOSecurity,
          RegistryPath="HKEY_LOCAL_MACHINE\\Security",
          RegMountPoint="/",
          Accessor=DefaultAccessor,
          Description="Map SECURITY Hive to HKEY_LOCAL_MACHINE"),
    )

    -- In API mode we sometimes can not access the keys due to permissions.
    -- These mapping ensure rules can specifically access the raw hives if they
    -- need to.
    LET _raw_hive_mapping_for_api <= (
      dict(type="mount",
        description="Map System Hive to raw_registry accessor",
        `from`=dict(accessor="raw_reg",
         prefix=pathspec(Path='/',
           DelegatePath=PathTOSystem,
           DelegateAccessor=DefaultAccessor),
         path_type='registry'),
       on=dict(accessor="raw_registry",
               prefix='/HKEY_LOCAL_MACHINE/System',
               path_type="registry")),
      dict(type="mount",
        description="Map Software Hive to raw_registry accessor",
        `from`=dict(accessor="raw_reg",
         prefix=pathspec(Path='/',
           DelegatePath=PathTOSoftware,
           DelegateAccessor=DefaultAccessor),
         path_type='registry'),
       on=dict(accessor="raw_registry",
               prefix='/HKEY_LOCAL_MACHINE/Software',
               path_type="registry")),
    )

    // The BCD hive is normally located on an unmounted drive so we
    // always map it with the API.
    LET _bcd_map <= (dict(
       type="mount",
       `from`=dict(accessor="registry", prefix='HKEY_LOCAL_MACHINE\\BCD00000000', path_type='registry'),
       on=dict(accessor="registry", prefix='HKEY_LOCAL_MACHINE\\BCD00000000', path_type="registry")))

    -- Map all the NTUser.dat files even in API mode because these are often not mounted.
    LET _map_ntuser = SELECT
    _map_file_to_reg_path(
      HivePath=OSPath,
      RegMountPoint="/",
      Accessor=DefaultAccessor,
      Description=format(format="Map NTUser.dat from User %v to HKEY_USERS",
                         args=OSPath[-2]),

      -- This is technically the SID but it is clearer to just use the username
      RegistryPath="HKEY_USERS\\" + OSPath[-2]) AS Mapping
    FROM glob(globs="*/NTUser.dat", root=PathTOUsers)

    LET _map_userclass = SELECT
    _map_file_to_reg_path(
      HivePath=OSPath,
      RegMountPoint="/",
      Accessor=DefaultAccessor,
      Description=format(
         format="Map UsrClass.dat from User %v to HKEY_USERS/%v/Software/Classes",
         args=[OSPath[2], OSPath[2]]),

      -- This is technically the SID but it is clearer to just use the username
      RegistryPath="HKEY_USERS\\" + OSPath[2] + "\\Software\\Classes") AS Mapping
    FROM glob(globs="*/AppData/Local/Microsoft/Windows/UsrClass.dat",
              root=PathTOUsers)


    LET _log_array(Message) = if(condition=log(message=Message), then=[])

    // Apply the mappings:
    LET RemapRules = if(condition=RemappingStrategy =~ "API.+NTUser",
       then=_api_remapping +
            _map_ntuser.Mapping +
            _map_userclass.Mapping +
            _unmounted_hive_mapping +
            _raw_hive_mapping_for_api  +
            _log_array(Message="Using API And NTUser.dat Mapping"),

    else=if(condition=RemappingStrategy =~ "API",
       then=_api_remapping +
            _unmounted_hive_mapping +
            _log_array(Message="Using API Mapping"),

    else=if(condition=RemappingStrategy =~ "raw hive",
       then=_map_ntuser.Mapping +
            _map_userclass.Mapping +
            _unmounted_hive_mapping +
            _standard_mappings +
            _raw_hive_mapping_for_api +
            _log_array(Message="Using Raw Hives Mapping"),
    else=log(message="Unsupported remapping strategy %v", args=RemappingStrategy))))

    LET AppCompatCacheParser <= '''[
    ["HeaderWin10", "x=>x.HeaderSize", [
      ["HeaderSize", 0, "unsigned int"],
      ["Entries", "x=>x.HeaderSize", Array, {
          type: "Entry",
          sentinel: "x=>x.Size = 0",
          count: 10000,
          max_count: 10000,
      }]
    ]],
    ["HeaderWin8", 128, [
      ["Entries", 128, Array, {
          type: "EntryWin8",
          sentinel: "x=>x.EntrySize = 0",
          count: 10000,
          max_count: 10000,
      }]
    ]],
    
    ["EntryWin8", "x=>x.EntrySize + 12", [
      ["Signature", 0, "String", {
         length: 4,
      }],
      ["EntrySize", 8, "unsigned int"],
      ["PathSize", 12, "uint16"],
      ["Path", 14, "String", {
          length: "x=>x.PathSize",
          encoding: "utf16",
      }],
      ["LastMod", "x=>x.PathSize + 14 + 10", "WinFileTime"]
    ]],
    
    ["Entry", "x=>x.Size + 12", [
      ["Signature", 0, "String", {
         length: 4,
      }],
      ["Size", 8, "unsigned int"],
      ["PathSize", 12, "uint16"],
      ["Path", 14, "String", {
          length: "x=>x.PathSize",
          encoding: "utf16",
      }],
      ["LastMod", "x=>x.PathSize + 14", "WinFileTime"],
      ["DataSize", "x=>x.PathSize + 14 + 8", "uint32"],
      ["Data", "x=>x.PathSize + 14 + 8 + 4" , "String", {
          length: "x=>x.DataSize",
      }],
    
      # The last byte of the Data block is 1 for execution
      ["Execution", "x=>x.PathSize + 14 + 8 + 4 + x.DataSize - 4", "uint32"]
    ]],
    
    # This is the Win7 parser but we dont use it right now.
    ["HeaderWin7x64", 128, [
      ["Signature", 0, "uint32"],
      ["Entries", 128, "Array", {
          count: 10000,
          sentinel: "x=>x.PathSize = 0",
          type: EntryWin7x64,
      }]
    ]],
    ["EntryWin7x64", 48, [
      ["PathSize", 0, "uint16"],
      ["PathOffset", 8, "uint32"],
      ["Path", "x=>x.PathOffset - x.StartOf", "String", {
          encoding: "utf16",
          length: "x=>x.PathSize",
      }],
      ["LastMod", 16, "WinFileTime"]
    ]]
    
    ]'''
    
    LET AppCompatCacheWin10(Blob) = parse_binary(
        accessor="data",
        filename=Blob,
        profile=AppCompatCacheParser,
        struct="HeaderWin10")
    
    LET AppCompatCacheWin8(Blob) = parse_binary(
        accessor="data",
        filename=Blob,
        profile=AppCompatCacheParser,
        struct="HeaderWin8")
    
    LET AppCompatCache(Blob) = SELECT LastMod, Path,
        Execution, GetDetails(OSPath=ExpandPath(Path=Path)) AS Details
    FROM foreach(
      row=if(
        condition=AppCompatCacheWin10(Blob=Blob).HeaderSize IN (52, 48),
        then=AppCompatCacheWin10(Blob=Blob).Entries,
        else=AppCompatCacheWin8(Blob=Blob).Entries))
    
    LET AppCompatFlagsPrograms(OSPath) = SELECT OSPath.Basename AS Program
       FROM glob(globs='Compatibility Assistant/{Store,Persisted}/*',
                 accessor="registry", root=OSPath)
    
    LET FetchKeyValues(OSPath) = to_dict(item={
      SELECT Name AS _key, Data.value AS _value
      FROM glob(globs="*", accessor="registry", root=OSPath)
    })
    
    LET GetDateFrom128Bit(x) = parse_binary(accessor="data",
      filename=x, profile='''
      [["X", 0, [
         ["year", 0, "uint16"],
         ["month", 2, "uint16"],
         ["day", 6, "uint16"],
         ["hour", 8, "uint16"],
         ["minute", 10, "uint16"],
         ["seconds", 12, "uint16"],
         ["Date", 0, "Value", {
            value: "x=>format(format='%04d-%02d-%02dT%02d:%02d:%02d', args=[x.year, x.month, x.day, x.hour, x.minute, x.seconds])"
          }]
      ]]]
      ''', struct="X").Date
    
    LET ExtractValueFromComment(x) = parse_string_with_regex(
      string=x.Metadata.Comment, regex=format(format="%v [=-] ([^,]+)", args=x.Data)).g1
    
    -- Map from binary integer to a winfiletime - handle both binary encoding and integers
    LET FILETIME(t) = if(condition=format(format="%T", args=[t,]) =~ "\\[\\]uint8",
       then=timestamp(winfiletime=parse_binary(accessor="data", filename=t, struct="uint64") || 0),
       else=timestamp(winfiletime=t || 0))
    
    -- Map from binary integer to a winfiletime - handle both binary encoding and integers
    LET IP(t) = if(condition=format(format="%T", args=[t,]) =~ "\\[\\]uint8",
       then=ip(netaddr4_le=parse_binary(accessor="data", filename=t, struct="uint32be") || 0),
       else=ip(netaddr4_le=t || 0))
    
    LET GetRawValue(OSPath) = stat(filename=OSPath, accessor="raw_registry").Data.value
    
    LET EnrichAmCacheShortcut(Details) = if(condition=Details.ShortcutPath,
    then=Details + GetDetails(OSPath=ExpandPath(Path=Details.ShortcutPath)),
    else=Details)
    
    LET GetAppPaths(OSPath) = SELECT OSPath, Mtime, FetchKeyValues(OSPath=OSPath) AS App
      FROM glob(root=OSPath, globs="*", accessor="registry")
      WHERE IsDir
    
    LET GetProviderDllForGUID(GUID) = GetValue(
        OSPath="HKEY_LOCAL_MACHINE\\SOFTWARE\\Classes\\CLSID\\" + GUID + "\\InProcServer32\\@")
    
    LET _CharToString(X) = SELECT
      format(format="%c", args=_value) AS C FROM foreach(row=X)
    
    LET CharsToString(X) = join(array=_CharToString(X=X).C)
    LET AppKeyExtract(OSPath) = SELECT Name,
       get(item=AppKeyLookup, field=Name) AS Key, Mtime,
       FetchKeyValuesWithRegex(OSPath=OSPath,
          Regex="ShellExecute|Association|RegisteredApp") AS Details
    FROM glob(root=OSPath, globs="*", accessor="registry")
    
    LET AppKeyLookup <= dict(
      `20`="APPCOMMAND_BASS_BOOST",
      `19`="APPCOMMAND_BASS_DOWN",
      `21`="APPCOMMAND_BASS_UP",
      `1`="APPCOMMAND_BROWSER_BACKWARD",
      `6`="APPCOMMAND_BROWSER_FAVORITES",
      `2`="APPCOMMAND_BROWSER_FORWARD",
      `7`="APPCOMMAND_BROWSER_HOME",
      `3`="APPCOMMAND_BROWSER_REFRESH",
      `5`="APPCOMMAND_BROWSER_SEARCH",
      `4`="APPCOMMAND_BROWSER_STOP",
      `31`="APPCOMMAND_CLOSE",
      `36`="APPCOMMAND_COPY",
      `45`="APPCOMMAND_CORRECTION_LIST",
      `37`="APPCOMMAND_CUT",
      `43`="APPCOMMAND_DICTATE_OR_COMMAND_CONTROL_TOGGLE",
      `28`="APPCOMMAND_FIND",
      `40`="APPCOMMAND_FORWARD_MAIL",
      `27`="APPCOMMAND_HELP",
      `17`="APPCOMMAND_LAUNCH_APP1",
      `18`="APPCOMMAND_LAUNCH_APP2",
      `15`="APPCOMMAND_LAUNCH_MAIL",
      `16`="APPCOMMAND_LAUNCH_MEDIA_SELECT",
      `52`="APPCOMMAND_MEDIA_CHANNEL_DOWN",
      `51`="APPCOMMAND_MEDIA_CHANNEL_UP",
      `49`="APPCOMMAND_MEDIA_FAST_FORWARD",
      `11`="APPCOMMAND_MEDIA_NEXTTRACK",
      `47`="APPCOMMAND_MEDIA_PAUSE",
      `46`="APPCOMMAND_MEDIA_PLAY",
      `14`="APPCOMMAND_MEDIA_PLAY_PAUSE",
      `12`="APPCOMMAND_MEDIA_PREVIOUSTRACK",
      `48`="APPCOMMAND_MEDIA_RECORD",
      `50`="APPCOMMAND_MEDIA_REWIND",
      `13`="APPCOMMAND_MEDIA_STOP",
      `44`="APPCOMMAND_MIC_ON_OFF_TOGGLE",
      `25`="APPCOMMAND_MICROPHONE_VOLUME_DOWN",
      `24`="APPCOMMAND_MICROPHONE_VOLUME_MUTE",
      `26`="APPCOMMAND_MICROPHONE_VOLUME_UP",
      `29`="APPCOMMAND_NEW",
      `30`="APPCOMMAND_OPEN",
      `38`="APPCOMMAND_PASTE",
      `33`="APPCOMMAND_PRINT",
      `35`="APPCOMMAND_REDO",
      `39`="APPCOMMAND_REPLY_TO_MAIL",
      `32`="APPCOMMAND_SAVE",
      `41`="APPCOMMAND_SEND_MAIL",
      `42`="APPCOMMAND_SPELL_CHECK",
      `22`="APPCOMMAND_TREBLE_DOWN",
      `23`="APPCOMMAND_TREBLE_UP",
      `34`="APPCOMMAND_UNDO",
      `9`="APPCOMMAND_VOLUME_DOWN",
      `8`="APPCOMMAND_VOLUME_MUTE",
      `10`="APPCOMMAND_VOLUME_UP")
    
    LET EnrichAmCacheWithDetails(Details) = if(condition=Details.LowerCaseLongPath,
    then=Details + GetDetails(OSPath=Details.LowerCaseLongPath),
    else=Details)
    
    LET _ParseFirewallRule(X) = to_dict(item={
       SELECT split(string=_value, sep_string="=")[0] AS _key,
              split(string=_value, sep_string="=")[1] AS _value
       FROM foreach(row=split(string=X, sep_string='|'))
       WHERE NOT _key =~ "^v"
    })
    
    LET MaybeEnrichFirewallRule(OSPath, Details) = if(condition=Details.App,
    then=Details + GetDetails(OSPath=ExpandPath(Path=Details.App)), else=Details)
    
    LET ParseFirewallRule(X) = MaybeEnrichFirewallRule(
       OSPath=OSPath, Details=_ParseFirewallRule(X=X)) +
       dict(Protocol=ProtocolLookup(X=_ParseFirewallRule(X=X).Protocol))
    
    LET MRUProfile <= '''
    [["Header", 0, [
       ["Array", 0, "Array", {
          "count": 500,
          "sentinel": "x=>NOT x",
          "type": "int32"
        }]
    ]]]
    '''
    
    LET CalculateMRUEx(OSPath) = SELECT split(string=utf16(string=GetValue(OSPath=OSPath + str(str=_value))), sep='\x00')[0] AS value
    FROM foreach(row=parse_binary(
           profile=MRUProfile,
           accessor="data",
           filename=GetValue(OSPath=OSPath + "MRUListEx") || "",
           struct="Header").Array)
    WHERE _value > 0
    
    LET _BAMPrograms(Root) = SELECT OSPath.Basename AS Program,
      timestamp(winfiletime=parse_binary(accessor="data",
          filename=Data.value, struct="uint64")) AS Timestamp
    FROM glob(accessor="registry", globs="*", root=Root)
    WHERE NOT Program =~ "^(Version|Sequence)"
    
    LET userAssistProfile = '''
      [
        ["Header", 0, [
          ["NumberOfExecutions", 4, "uint32"],
          ["LastExecution", 60, "WinFileTime", {"type":"uint64"}]
        ]]
      ]
    '''
    
    LET _ExtractUserAssist(Data) = parse_binary(accessor="data",
                      filename=Data,
                      profile=userAssistProfile, struct="Header")
    
    LET _RADAR(OSPath) = SELECT OSPath.Basename AS Program,
       timestamp(winfiletime=GetValue(OSPath=OSPath + "LastDetectionTime")) AS LastDetectionTime
    FROM glob(accessor="registry", globs='*', root=OSPath)
    
    LET _RecentFileList(OSPath) = SELECT Data.value AS F
    FROM glob(accessor="registry", globs='*', root=OSPath)
    WHERE OSPath.Basename =~ "File"
    
    LET _FeatureUsage(OSPath) = SELECT OSPath.Basename AS Application,
        Data.value AS Number
    FROM glob(accessor="registry", globs='*', root=OSPath)
    
    LET RDPMRU(OSPath) = SELECT Data.value AS Server
    FROM glob(accessor="registry", globs='*', root=OSPath + "Default")
    WHERE OSPath.Basename =~ "MRU"
    
    LET _ParseActions(Data)  = parse_binary(accessor="data",
                filename=Data, struct="Header",
                profile='''
    [["Header", 0, [
     ["__Ver", 0, "uint16"],
     ["__UserLen", 2, "uint32"],
     ["User", 6, "String", {length: "x=>x.__UserLen", encoding: "utf16"}],
     ["__ActionType", "x=>6 + x.__UserLen", "uint16"],
     ["ActionType", "x=>6 + x.__UserLen", "Enumeration", {
        type: "uint32",
        choices: {
          "26214": "BinaryAction",
          "30583": "ComHanlder",
          "34952": "Email",
          "39321": "MessageBox",
        }
     }],
     ["Action", "x=>6 + x.__UserLen + 2", "Union", {
       selector: "x=>x.__ActionType",
       choices: {
         "26214": BinaryAction,
         "30583": ComHandler,
       }
     }],
    ]],
    ["ComHandler", 0, [
     ["ClassID", 4, "GUID"],
     ["__DataLen", 20, uint32],
     ["Data", 24, "String", {
       "length": "x=>x.__DataLen",
       "encoding": "utf16",
     }]
    ]],
    ["GUID", 16, [
     ["__D1", 0, "uint32"],
     ["__D2", 4, "uint16"],
     ["__D3", 6, "uint16"],
     ["__D4", 8, "String", {"term": "", "length": 2}],
     ["__D5", 10, "String", {"term": "", "length": 6}],
     ["Value", 0, "Value", {
        "value": "x=>format(format='{%08x-%04x-%04x-%02x-%02x}', args=[x.__D1, x.__D2, x.__D3, x.__D4, x.__D5])"
    }]
    ]],
    ["BinaryAction", 0, [
     ["__BinLen", 4, "uint32"],
     ["Binary", 8, "String", {length: "x=>x.__BinLen", encoding: "utf16"}],
    ]]]
    ''')
    
    LET _ParseDynamicInfo(Data) = parse_binary(accessor="data",
                filename=Data, struct="Header",
                profile='''
    [["Header", 0, [
     ["__Ver", 0, "uint16"],
     ["Created", 4, "WinFileTime", {"type": "uint64"}],
     ["LastStart", 12, "WinFileTime", {"type": "uint64"}],
     ["LastStop", 20, "WinFileTime", {"type": "uint64"}],
     ["TaskState", 28, "uint32"],
     ["LastErrorCode", 32, "uint32"],
     ["LastSuccessfulRun", 36, "WinFileTime", {"type": "uint64"}],
    ]]]
    ''')
    
    LET _TaskCacheEnrichBinaries(Details) =
       Details + dict(BinaryInfo=GetDetails(
           OSPath=ExpandPath(Path=Details.Actions.Action.Binary)))
    
    LET _TaskCache(OSPath) = SELECT _TaskCacheEnrichBinaries(
    Details=to_dict(item={
      SELECT OSPath.Basename AS _key,
        if(condition= OSPath.Basename =~ "DynamicInfo",
           then=_ParseDynamicInfo(Data=Data.value),
        else= if(condition= OSPath.Basename =~ "Actions",
           then=_ParseActions(Data=Data.value),
        else=Data.value)) AS _value
      FROM glob(accessor="registry", globs='*', root=OSPath)
    }) + dict(OSPath=OSPath)) AS Details
    FROM glob(accessor="registry", globs='*', root=OSPath)
    
    LET _ServiceTypeLookup <= dict(`1`="KernelDriver", `2`="FileSystemDriver", `4`="Adapter", `8`="RecognizerDriver", `16`="Win32OwnProcess", `32`="Win32ShareProcess", `256`="InteractiveProcess", `96`="Win32ShareProcess")
    LET _ServiceStartModeLookup <= dict(`0`="Boot", `1`="System", `2`="Automatic", `3`="Manual", `4`="Disabled")
    
    LET MaybeEnrichService(OSPath, Details) = if(condition=Details.ImagePath,
     then=Details + GetDetails(OSPath=ExpandPath(Path=Details.ImagePath)),
     else=Details)
    
    LET _ServicesInfo(OSPath) = MaybeEnrichService(OSPath=OSPath, Details=
        FetchKeyValuesWithRegex(OSPath=OSPath,
             Regex="Description|DisplayName|ServiceDll|Group|ImagePath|RequiredPrivileges|Type|Parameters|SERVICEDLL") +
        dict(Mtime=Mtime, Service=OSPath.Basename,
             TypeName=get(item=_ServiceTypeLookup, field=str(str=GetValue(OSPath=OSPath + "Type"))),
             StartName=get(item=_ServiceStartModeLookup, field=str(str=GetValue(OSPath=OSPath + "Start")))
        ))
    
    LET ParseMitigationOptions(H) = RemoveNullDictValue(D=dict(
     DEP=
       (H[-1:] = "1" && "Always On") ||
       (H[-1:] = "2" && "Always On - enable ATL thunk emulation"),
     SEHOP=(H[-2:-1] = "1"),
     ASLR=
        (H[-3:-2] = "1" && "Enable force relocate.") ||
        (H[-3:-2] = "2" && "Force relocate off.") ||
        (H[-3:-2] = "3" && "Force relocate always on."),
     `Heap terminate`=
        (H[-4:-3] = "1" && "Always On.") ||
        (H[-4:-3] = "2" && "Always Off."),
     `Bottom ASLR`=
        (H[-5:-4] = "1" && "Always On.") ||
        (H[-5:-4] = "2" && "Always Off."),
     `HEASLR`=
        (H[-6:-5] = "1" && "Always On.") ||
        (H[-6:-5] = "2" && "Always Off."),
     `Strict handle checks`=
        (H[-7:-6] = "1" && "Always On.") ||
        (H[-7:-6] = "2" && "Always Off."),
     `Win32k system call disable policy`=
        (H[-8:-7] = "1" && "Always On.") ||
        (H[-8:-7] = "2" && "Always Off."),
     `Extension point disable policy`=
        (H[-9:-8] = "1" && "Always On.") ||
        (H[-9:-8] = "2" && "Always Off."),
     `Dynamic code policy (probably).`=
        (H[-10:-9] = "1" && "Always On.") ||
        (H[-10:-9] = "2" && "Always Off.") ||
        (H[-10:-9] = "3" && "Always On with optout."),
     `Control Flow Guard (CFG)`=
        (H[-11:-10] = "1" && "Enable") ||
        (H[-11:-10] = "2" && "Disable"),
     `Binary signature policy.`=
        (H[-12:-11] = "1" && "Microsoft signed only.") ||
        (H[-12:-11] = "2" && "Disable?"),
     `Font loading prevention.`=
        (H[-13:-12] = "1" && "Enable") ||
        (H[-13:-12] = "2" && "Disable") ||
        (H[-13:-12] = "3" && "Enable with Audit"),
     `Image load policy (remote images).`=
        (H[-14:-13] = "1" && "Always On") ||
        (H[-14:-13] = "2" && "Always Off") ||
        (H[-14:-13] = "3" && "Reserved"),
     `Image load policy (low mandatory label).`=
        (H[-15:-14] = "1" && "Always On") ||
        (H[-15:-14] = "2" && "Always Off") ||
        (H[-15:-14] = "3" && "Reserved")))
    
    LET _NormalizeClassDLL(OSPath) = if( condition= OSPath.Basename =~ "^[1-9]+$", then= OSPath.Dirname, else=OSPath)
    LET ClassDLLCache <= dict()
    LET CacheClassPaths(CLSID, OSPath) = set(item= ClassDLLCache,
       field=CLSID, value=OSPath) && OSPath
    
    LET NormalizeClassDLL(CLSID, OSPath) = CacheClassPaths(CLSID=CLSID,
    OSPath=_NormalizeClassDLL(OSPath=pathspec(parse=OSPath, path_type="windows")))
    
    LET FetchKeyValuesWithRegex(OSPath, Regex) = to_dict(item={
      SELECT Name AS _key, Data.value AS _value
      FROM glob(globs="*", accessor="registry", root=OSPath)
      WHERE Name =~ Regex
    })
    
    LET _ProtocolLookup <= dict(`6`="TCP", `17`="UDP")
    LET ProtocolLookup(X) = get(item=_ProtocolLookup, field=X) || X
    
    LET GetValue(OSPath) = stat(filename=OSPath, accessor="registry").Data.value
    
    LET CalculateMRU(OSPath) = SELECT GetValue(OSPath=OSPath + g1) AS value
        FROM parse_records_with_regex(accessor="data",
        file=GetValue(OSPath=OSPath + "MRUList") || "", regex="(.)")
    
    LET ResolveSID(SID) = pathspec(parse=stat(accessor="registry",
        filename="HKEY_LOCAL_MACHINE/Software/Microsoft/Windows NT/CurrentVersion/ProfileList/" + SID + "/ProfileImagePath").Data.value).Basename
    
    LET FormatMAC(x) = parse_binary(accessor="data",
      filename=x, profile='''
      [["X", 0, [
        ["x0", 0, "uint8"],
        ["x1", 1, "uint8"],
        ["x2", 2, "uint8"],
        ["x3", 3, "uint8"],
        ["x4", 4, "uint8"],
        ["x5", 5, "uint8"],
        ["mac", 0, Value, {"value": "x=>format(format='%02x:%02x:%02x:%02x:%02x:%02x', args=[x.x0, x.x1, x.x2, x.x3, x.x4, x.x5])"}]
      ]]]
      ''', struct="X").mac
    
    LET RemoveNullDictValue(D) = to_dict(item={
       SELECT * FROM items(item=D)
       WHERE _value
    })
    
    

    -- This contains the queries for Full Query Rules - they skip the glob and just run arbitrary VQL.
    LET FullQueries <= parse_json_array(data=gunzip(string=base64decode(string="")))

    LET _ExpandedTransforms <= dict(
        `^\\\\SystemRoot\\\\`="%SystemRoot%\\",
        `^system32\\\\`="%SystemRoot%\\System32\\",
        `^{.+}.+`="\\$0",
        `^C:\\\\Program Files[^\\\\]*\\\\[^ ]+`='"$0"',
        `^%[^ ]+%[^ ]+`='"$0"'
      )

    // Extract the binary from the command line
    LET ExpandPath(Path) = lowcase(string=commandline_split(
    command=expand(path=regex_transform(source=Path,
      map=_ExpandedTransforms)))[0])

sources:
- name: Remapping
  query: |
    SELECT * FROM RemapRules

  notebook:
  - type: none

- name: Rules
  query: |
    LET CategoryFilter <= S.CategoryFilter || join(array=Categories, sep="|")
    LET AllFullQueries <=
        SELECT * FROM FullQueries
        WHERE Category =~ CategoryFilter
          AND Description =~ RuleFilter

    LET AllRules <=
      SELECT * FROM MD(DescriptionFilter=RuleFilter, RootFilter=RootFilter,
        CategoryFilter=CategoryFilter, CategoryExcludedFilter=S.CategoryExcludedFilter)

    SELECT * FROM chain(a=AllRules, b=AllFullQueries)
  notebook:
  - type: none

- name: Globs
  notebook:
  - type: none

  query: |
    LET AllGlobs <=
      SELECT Root, enumerate(items=Glob) AS Globs
      FROM AllRules
      GROUP BY Root

    SELECT * FROM AllGlobs

- name: Uploads
  notebook:
  - type: none

  query: |
   LET UploadFiles = SELECT OSPath AS SourceFile, Size,
       Btime AS Created,
       Ctime AS Changed,
       Mtime AS Modified,
       Atime AS LastAccessed,
       upload(file=OSPath, accessor=DefaultAccessor, mtime=Mtime) AS Upload
    FROM glob(accessor=DefaultAccessor, globs=[
       PathTOSAM, PathTOAmcache, PathTOSystem,
       PathTOSecurity, PathTOSoftware, PathTOUsers + "*/ntuser.dat*"
    ])

   SELECT * FROM if(condition=AlsoUploadHives, then=UploadFiles)

