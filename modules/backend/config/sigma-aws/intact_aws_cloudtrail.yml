id: d674e50c-d56c-5e4e-8731-bce87feef8b1
status: experimental
description: A database lost its deletion protection or its automatic backups (retention set to 0) -- the step before deleting it for good.
author: Intact.AI (built on real CloudTrail attack recordings)
date: '2026-10-26'
tags:
- attack.impact
- attack.t1490
- attack.t1485
logsource:
  product: aws
  service: cloudtrail
detection:
