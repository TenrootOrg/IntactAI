# Intact.AI AWS CloudTrail rules (2026-10-26). Generic (no account, vendor or resource names),
# built and scored on real attack recordings (Splunk attack_data, Stratus Red Team) and kept
# quiet on a real account. intact.* fields come from services/aws/cloudtrail_enrich.py.
title: AWS Admin Port Opened To The Internet
id: 837ed0a3-968e-5f37-a904-55160470ab39
status: experimental
description: A security group, Lightsail firewall or network ACL now lets the whole internet (0.0.0.0/0 or ::/0) reach an administrative port
  (SSH, RDP, databases, WinRM...) or every port.
author: Intact.AI (built on real CloudTrail attack recordings)
date: '2026-10-26'
tags:
- attack.initial-access
- attack.t1190
- attack.defense-evasion
- attack.t1562.007
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - AuthorizeSecurityGroupIngress
    - ModifySecurityGroupRules
    - PutInstancePublicPorts
    - OpenInstancePublicPorts
    - CreateNetworkAclEntry
    - ReplaceNetworkAclEntry
    intact.admin_port_open: 'true'
  filter:
    errorCode|exists: true
  condition: selection and not filter
falsepositives:
- An administrator doing this on purpose; check who, from where, and whether it was planned
level: high
