# Fusion weighting rules -- what a detection is WORTH.
#
# Read by services/fusion/weighting.py at every fuse (no restart, no DB). A box can
# add its own rules, or switch shipped ones off, in <data>/fusion_weighting.local.yaml
# (same format, checked FIRST; `disable: [rule-id, ...]`). See weighting.py.
#
# RULES OF THE ROAD
# - Generic: match on what a thing IS or DOES (a category's words, a name pattern,
#   a numbers-only difference), never on one vendor or one domain.
# - Lowering is for things that are ordinary on their own; anything that stays
#   worth a look must stay visible (low, not gone). Unknown input never goes down.
# - Every rule says WHY (reason) and proves itself (examples). The examples run in
#   tests/test_fusion_weighting_catalogue.py -- a rule without one fails the build.
#
# entity_rules: first match wins, top to bottom.
#   when: artifact (glob, any of), type (any of), flags_any, attr_words {attr: [words]},
#         attr_regex {attr: regex}, check (weighting.CHECKS) + args [attr, ...]
#   then: anomaly (score; >=100 critical, >=20 high, >=10 medium, >=1 low, 0 info)
#         or severity; add_flags; remove_flags
# Origin of the first rules: 2026-10-07, a real two-server admin case where 133 of
# 148 findings were HIGH and the report called an agent updater a backdoor.

version: 1

entity_rules:

  # ---- web history (DetectRaptor.Webhistory) ---------------------------------
  # The detection names a CATEGORY; every hit used to score high whatever it said.
  - id: web-local-address
    reason: "a direct-IP visit to an address on the local network (a device's own page)"
    when: {artifact: "*webhistory*", type: [event, ioc], attr_words: {category: [direct ip]},
           check: local_ip, args: [domain]}
    then: {anomaly: 0}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: Direct IP address, domain: 169.254.95.118}, expect: informational}
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: Direct IP address, domain: 192.168.1.1}, expect: informational}

  - id: web-generated-name-on-abused-tld
    reason: "a generated-looking name on a top-level domain often abused for malware"
    when: {artifact: "*webhistory*", type: [event, ioc], attr_words: {category: [tld]},
           check: random_label, args: [domain]}
    then: {anomaly: 12}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: TLD, domain: ljzq.lzqmjakbblmvy.top}, expect: medium}

  - id: web-malicious-purpose
    reason: "a site category used for malware hosting, exfiltration, credentials or offensive tooling"
    when: {artifact: "*webhistory*", type: [event, ioc],
           attr_words: {category: [offensive, exploit, c2, command and control, credential, hacking,
                                   malware, exfiltrat, stealer, ransom]}}
    then: {anomaly: 12}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: Malware Hosting and Exfiltration, domain: pastebin.com}, expect: medium}

  - id: web-recon-tooling
    reason: "a network scanner or reconnaissance tool's site"
    when: {artifact: "*webhistory*", type: [event, ioc], attr_words: {category: [enumeration, scanner, recon]}}
    then: {anomaly: 10}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: Enumeration, domain: www.advanced-ip-scanner.com}, expect: medium}

  - id: web-common-context-dependent
    reason: "a common site category that matters only in context (remote support, shared hosting, shorteners, direct IP, cheap TLDs)"
    when: {artifact: "*webhistory*", type: [event, ioc],
           attr_words: {category: [rmm, remote, phishing host, file shar, shortener, direct ip,
                                   cloud storage, paste, tld]}}
    then: {anomaly: 1}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: RMM, domain: www.teamviewer.com}, expect: low}
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: Phishing Hosting, domain: drive.google.com}, expect: low}
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: ioc,
         attrs: {category: Direct IP address, domain: 84.110.121.170}, expect: low}

  - id: web-everyday-tools
    reason: "an everyday tool's website (archivers, utilities, downloads)"
    when: {artifact: "*webhistory*", type: [event, ioc],
           attr_words: {category: [archive, utilit, download, software, browser]}}
    then: {anomaly: 0}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: ioc,
         attrs: {category: Archive Utilities, domain: www.7-zip.org}, expect: informational}

  - id: web-unknown-category
    reason: "a web category this catalogue does not know yet -- kept at medium, never silently lowered"
    when: {artifact: "*webhistory*", type: [event, ioc], attr_regex: {category: "."}}
    then: {anomaly: 10}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.Webhistory, type: event,
         attrs: {category: Some Category Added Next Year, domain: x.example}, expect: medium}

  # ---- renamed binaries (DetectRaptor.BinaryRename) --------------------------
  - id: installer-of-same-program
    reason: "a downloaded installer of the program (its own name plus a version or setup word), not a rename"
    when: {artifact: "*binaryrename*", type: [event, ioc], check: installer_of_same_program,
           args: [name, original_name]}
    then: {anomaly: 0, add_flags: [installer_copy], remove_flags: [masquerading]}
    examples:
      - {artifact: DetectRaptor.Windows.Detection.BinaryRename, type: event, flags: [detection, masquerading],
         attrs: {name: winrar-x64-611.exe, original_name: WinRAR.exe}, expect: informational}
      - {artifact: DetectRaptor.Windows.Detection.BinaryRename, type: event, flags: [detection, masquerading],
         attrs: {name: "putty-64bit-0.81-installer.msi", original_name: PuTTY.exe}, expect: informational}
      # the TOOL itself under its usual name stays as rated (dual-use: credential dumping)
      - {artifact: DetectRaptor.Windows.Detection.BinaryRename, type: event, flags: [detection, masquerading],
         anomaly: 50, attrs: {name: procdump64.exe, original_name: procdump}, expect: high}
      - {artifact: DetectRaptor.Windows.Detection.BinaryRename, type: event, flags: [detection, masquerading],
         anomaly: 50, attrs: {name: svchost.exe, original_name: mimikatz.exe}, expect: high}

  # ---- SIGMA/Hayabusa heuristics that over-fire (not a specific technique) ----
  # A broad "PowerShell looks suspicious" heuristic fires on almost any PowerShell,
  # including benign module auto-loads (e.g. the NetTCPIP module). Measured: 446 hits
  # from one APTSimulator run and 260 on a clean box, nearly all benign. It is a
  # medium by default, which (once the finding floor is medium) would bury the real
  # medium techniques beside it. Downweight the HEURISTIC to low -- still visible,
  # not a finding. A specific-technique SIGMA rule (WMI Persistence, credential
  # access, defense evasion) is NOT matched here and keeps its rating.
  - id: sigma-powershell-heuristic-noise
    reason: "a broad PowerShell-execution heuristic, not a specific technique -- fires on benign module loads, very high false-positive"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [potentially malicious pwsh,
           uncommon powershell host]}}
    then: {anomaly: 5}
    examples:
      - {type: event, flags: [sigma], attrs: {title: "Potentially Malicious PwSh"}, expect: low}
      - {type: event, flags: [sigma], attrs: {title: "Uncommon PowerShell Hosts"}, expect: low}
      # a specific technique the heuristic rule must NOT touch (stays medium):
      - {type: event, flags: [sigma], anomaly: 15, attrs: {title: "WMI Persistence"}, expect: medium}

  # ---- a program changing its OWN settings / Windows running its own services ----
  # Origin 2026-10-14: a clean Nextron domain controller (Server 2022, no attack) raised
  # 8 high findings; APT29's reports turned the same patterns into "Defender disabled"
  # and "ADS / timestomping on the DC". Each rule is a shape, not a product.
  - id: program-writes-own-settings
    reason: "the process changing this settings key runs from the folder of the product the key belongs to -- the program updating or protecting itself, not tampering"
    when: {type: [event], flags_any: [sigma], check: writes_own_settings, args: [ev_proc, details]}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "Disable Windows Defender Functionalities Via Registry Keys",
                 ev_proc: 'C:\Program Files\Windows Defender\MsMpEng.exe',
                 details: 'EventType: SetValue ¦ RegKey: HKLM\SOFTWARE\Microsoft\Windows Defender\Features\TamperProtection ¦ Details: DWORD (0x00000000)'},
         expect: low}
      # the same key written by anything else keeps its severity:
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "Disable Windows Defender Functionalities Via Registry Keys",
                 ev_proc: 'C:\Windows\System32\reg.exe',
                 details: 'EventType: SetValue ¦ RegKey: HKLM\SOFTWARE\Microsoft\Windows Defender\Features\TamperProtection ¦ Details: DWORD (0x00000000)'},
         expect: high}
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "Disable Windows Defender Functionalities Via Registry Keys",
                 ev_proc: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe',
                 details: 'RegKey: HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware'},
         expect: high}

  - id: shared-service-host
    reason: "a 'suspicious service path' that is the system's shared service host with a -k group -- how Windows runs its built-in services"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [suspicious service path]},
           attr_regex: {details: 'path:\s*(%systemroot%|c:\\windows)\\system32\\svchost\.exe\s+-k\s+\w+\s*($|¦)'}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "Suspicious Service Path", details: 'Svc: Printer Extensions and Notifications ¦ Path: %SystemRoot%\system32\svchost.exe -k print'},
         expect: low}
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "Suspicious Service Path", details: 'Svc: updater ¦ Path: C:\Users\Public\svchost.exe -k netsvcs'},
         expect: high}
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "Suspicious Service Path", details: 'Svc: x ¦ Path: cmd.exe /c powershell -enc AAA'},
         expect: high}

  - id: remoting-copy-helpers
    reason: "PowerShell's own Copy-Item -ToSession helper functions, run in the remote session -- a file copy, not ADS abuse or timestomping (the copy itself is judged by its own rule)"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [alternate data stream, timestomp]},
           attr_regex: {details: 'pstargetsupportsalternatestreams|pssetfilemetadata|psgetfilemetadata|pscopyfiletoremotesession|pscopytosessionhelper|pscopyfromsessionhelper'}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "NTFS Alternate Data Stream", details: 'ScriptBlock: function PSTargetSupportsAlternateStreams { param([string]$targetPath) ... }'},
         expect: low}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Powershell Timestomp", details: 'ScriptBlock: function PSSetFileMetadata { ... }'},
         expect: low}
      # a real timestomp script keeps its severity:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Powershell Timestomp", details: 'ScriptBlock: $f=Get-Item .\kx.lock; $f.CreationTime=(Get-Item C:\Windows\System32\cmd.exe).CreationTime'},
         expect: medium}

  # Origin 2026-10-18: one workstation of a 69-host hunt kept 737,520 medium rows; 90% were
  # this one launch, tripping four rules at once (stdin redirection, "getsystem" named pipe,
  # cmd stream redirection, Electron child process).
  - id: browser-native-messaging-host
    reason: "a Chromium browser starting an extension's native-messaging helper -- cmd.exe wired to the browser's own nativeMessaging pipes, how every such helper is launched"
    when: {type: [event], flags_any: [sigma],
           attr_regex: {details: 'cmdline:\s*\S*cmd\.exe\s+/d\s+/s\s+/c\s+""[^"¦]+\.exe"\s+chrome-extension://[a-p]{32}/(\s+--parent-window=\d+)?"\s*<\s*\\\\\.\\pipe\\chrome\.nativemessaging\.in\.[0-9a-f]+\s*>\s*\\\\\.\\pipe\\chrome\.nativemessaging\.out\.[0-9a-f]+\s*(¦|$)'}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Susp CmdLine (Possible Meterpreter getsystem)",
                 details: 'Cmdline: C:\WINDOWS\system32\cmd.exe /d /s /c ""C:\Program Files (x86)\ExampleVendor\host.exe" chrome-extension://ponmlkjihgfedcbaponmlkjihgfedcba/ --parent-window=0" < \\.\pipe\chrome.nativeMessaging.in.0123456789abcdef > \\.\pipe\chrome.nativeMessaging.out.0123456789abcdef ¦ Proc: C:\Windows\System32\cmd.exe ¦ PID: 13'},
         expect: low}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Suspicious Electron Application Child Processes",
                 details: 'Cmdline: C:\WINDOWS\system32\cmd.exe /d /s /c ""C:\Users\a\AppData\Local\Helper\helper.exe" chrome-extension://abcdefghijklmnopabcdefghijklmnop/" < \\.\pipe\chrome.nativeMessaging.in.fedcba9876543210 > \\.\pipe\chrome.nativeMessaging.out.fedcba9876543210'},
         expect: low}
      # the real getsystem pattern keeps its severity:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Susp CmdLine (Possible Meterpreter getsystem)",
                 details: 'Cmdline: cmd.exe /c echo vzkqmb > \\.\pipe\vzkqmb ¦ Proc: C:\Windows\System32\cmd.exe'},
         expect: medium}
      # so does a command with the browser pipes tacked on:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Cmd Stream Redirection",
                 details: 'Cmdline: C:\WINDOWS\system32\cmd.exe /d /s /c ""C:\x\host.exe" chrome-extension://abcdefghijklmnopabcdefghijklmnop/" < \\.\pipe\chrome.nativeMessaging.in.1a > \\.\pipe\chrome.nativeMessaging.out.1a & powershell -enc AAAA ¦ Proc: C:\Windows\System32\cmd.exe'},
         expect: medium}

  # ---- detections that recorded nothing, or describe the OS doing its own work ----
  # Origin 2026-10-14: with its bursts gone, a clean domain controller showed 18 medium
  # rows of exactly these shapes (and a clean Windows 10 client the same ones).
  - id: sigma-no-content
    reason: "the detection recorded no content -- every field it names is empty or n/a, so there is nothing to act on"
    when: {type: [event], flags_any: [sigma], check: no_content, args: [details]}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "WMI Persistence", details: "Namespace: n/a ¦ Query: n/a ¦ SID: n/a ¦ PID: n/a ¦ Provider: n/a ¦ PossibleCause: n/a"},
         expect: low}
      - {type: event, flags: [sigma], anomaly: 15, attrs: {title: "WMI Persistence", details: "Message: n/a"}, expect: low}
      # only lowers: an informational row with no content stays informational
      - {type: event, flags: [sigma], anomaly: 0, attrs: {title: "Win RM Session Created", details: "Message: n/a"}, expect: informational}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Powershell WMI Persistence", details: "ScriptBlock: function wmi { $FilterArgs = @{name='x'; Query='SELECT * FROM __InstanceCreationEvent'} }"},
         expect: medium}

  - id: os-raw-disk-read
    reason: "a raw disk read by the kernel or a Windows system binary -- indexing, backup and telemetry do this all day"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [raw access read]},
           attr_regex: {details: '(?i)(^|¦)\s*(proc:\s*(<unknown process>|c:\\windows\\system32\\[^\\¦]+\.exe)\s*(¦|$))'}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Raw Access Read", details: 'Proc: C:\Windows\System32\CompatTelRunner.exe ¦ Device: \Device\HarddiskVolume3 ¦ PID: 5196'}, expect: low}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Raw Access Read", details: 'Proc: <unknown process> ¦ Device: \Device\HarddiskVolume3 ¦ PID: 4'}, expect: low}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Raw Access Read", details: 'Proc: C:\Users\bob\AppData\Local\Temp\x.exe ¦ Device: \Device\HarddiskVolume3'}, expect: medium}

  - id: image-locked-not-replaced
    reason: "Sysmon process tampering of type 'image is locked for access' -- routine; hollowing reads 'image is replaced'"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [proc tampering], details: [image is locked for access]}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Proc Tampering", details: 'Proc: C:\Windows\System32\wbem\WMIADAP.exe ¦ Type: Image is locked for access'}, expect: low}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "Proc Tampering", details: 'Proc: C:\Users\a\x.exe ¦ Type: Image is replaced'}, expect: medium}

  - id: deletion-rule-on-a-create
    reason: "a rule about a DELETION that fired on a key CREATION -- the event contradicts the rule"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [deletion], details: ["eventtype: createkey"]}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "RunMRU Registry Key Deletion - Registry", details: 'EventType: CreateKey ¦ TgtObj: HKU\S-1-5-21-1-500\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU'}, expect: low}
      - {type: event, flags: [sigma], anomaly: 30,
         attrs: {title: "RunMRU Registry Key Deletion - Registry", details: 'EventType: DeleteKey ¦ TgtObj: HKU\S-1-5-21-1-500\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU'}, expect: high}

  - id: os-servicing-helper
    reason: "the Windows servicing helper started from its own per-run folder under Windows\\Temp -- component installs and updates"
    when: {type: [event], flags_any: [sigma], attr_regex: {ev_proc: '(?i)\\windows\\temp\\[0-9a-f-]{36}\\dismhost\.exe$'}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "WmiPrvSE Spawned A Process", ev_proc: 'C:\Windows\Temp\877306D1-C5B7-46FA-841E-4FBA6346B328\DismHost.exe'}, expect: low}
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "WmiPrvSE Spawned A Process", ev_proc: 'C:\Windows\Temp\dismhost.exe'}, expect: medium}

  - id: app-package-provisioning
    reason: "an app package added to the deployment pipeline -- store and OS apps being provisioned"
    when: {type: [event], flags_any: [sigma], attr_words: {title: [appx located in uncommon directory added to deployment pipeline]}}
    then: {anomaly: 1, only_lower: true}
    examples:
      - {type: event, flags: [sigma], anomaly: 15,
         attrs: {title: "AppX Located in Uncommon Directory Added to Deployment Pipeline"}, expect: low}
      - {type: event, flags: [sigma], anomaly: 15, attrs: {title: "AppX Package Installation From Suspicious Location"}, expect: medium}

pattern_rules:

  - id: recurring-maintenance
    pattern: recurring_maintenance
    reason: "the same detection on the same host for months, about an object that differs only by numbers -- software updating itself"
    params: {min_episodes: 6, min_span_days: 60, same_share: 0.8, severity: low}

  - id: routine-account-spread
    pattern: routine_account_spread
    reason: "an account used on several hosts for a long time with many observations -- people's normal work, not lateral movement"
    params: {min_span_days: 30, min_observations: 20, severity: low}
