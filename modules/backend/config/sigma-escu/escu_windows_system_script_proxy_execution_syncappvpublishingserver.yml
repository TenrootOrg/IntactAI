title: Windows System Script Proxy Execution Syncappvpublishingserver
id: 8dd73f89-682d-444c-8b41-8e679966ad3c
status: experimental
description: The following analytic detects the execution of Syncappvpublishingserver.vbs via wscript.exe or cscript.exe,
  which may indicate an attempt to download remote files or perform privilege escalation. This detection leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. Monitoring this activity
  is crucial as it can signify malicious use of a native Windows script for unauthorized actions. If confirmed malicious,
  this behavior could lead to unauthorized file downloads or elevated privileges, posing a significant security risk.
references:
- https://research.splunk.com/8dd73f89-682d-444c-8b41-8e679966ad3c/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1216
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\wscript.exe'
    - '*\\cscript.exe'
  sel2:
    CommandLine: '*syncappvpublishingserver.vbs*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1216/atomic_red_team/windows-sysmon.log
