title: Linux Auditd Insert Kernel Module Using Insmod Utility
id: bc0ca53f-dea6-4906-9b12-09c396fdf1d3
status: experimental
description: The following analytic detects the insertion of a Linux kernel module using the insmod utility. It leverages
  data from Linux Auditd, focusing on process execution logs that include process names and command-line details. This activity
  is significant as it may indicate the installation of a rootkit or malicious kernel module, potentially allowing an attacker
  to gain elevated privileges and bypass security detections. If confirmed malicious, this could lead to unauthorized code
  execution, persistent access, and severe compromise of the affected system.
references:
- https://research.splunk.com/bc0ca53f-dea6-4906-9b12-09c396fdf1d3/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1547.006
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: SYSCALL
  sel2:
    comm: insmod
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1547.006/linux_auditd_insmod_new/linux_auditd_new_insmod.log
