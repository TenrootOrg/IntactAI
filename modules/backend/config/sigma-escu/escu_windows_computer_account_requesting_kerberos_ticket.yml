title: Windows Computer Account Requesting Kerberos Ticket
id: fb3b2bb3-75a4-4279-848a-165b42624770
status: experimental
description: The following analytic detects a computer account requesting a Kerberos ticket, which is unusual as typically
  user accounts request these tickets. This detection leverages Windows Security Event Logs, specifically EventCode 4768,
  to identify instances where the TargetUserName ends with a dollar sign ($), indicating a computer account. This activity
  is significant because it may indicate the use of tools like KrbUpRelay or other Kerberos-based attacks. If confirmed malicious,
  this could allow attackers to impersonate computer accounts, potentially leading to unauthorized access and lateral movement
  within the network.
references:
- https://research.splunk.com/fb3b2bb3-75a4-4279-848a-165b42624770/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1558
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4768'
  sel2:
    TargetUserName: '*$'
  sel3:
    src_ip: ::1
  condition: (sel1 and sel2 and not sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1558/windows_computer_account_requesting_kerberos_ticket/windows-xml.log
