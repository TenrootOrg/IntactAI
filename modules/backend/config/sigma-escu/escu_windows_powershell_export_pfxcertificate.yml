title: Windows PowerShell Export PfxCertificate
id: ed06725f-6da6-439f-9dcc-ab30e891297c
status: experimental
description: The following analytic detects the use of the PowerShell cmdlet `export-pfxcertificate` by leveraging Script
  Block Logging. This activity is significant as it may indicate an adversary attempting to exfiltrate certificates from the
  Windows Certificate Store. Monitoring this behavior is crucial for identifying potential certificate theft, which can lead
  to unauthorized access and impersonation attacks. If confirmed malicious, this activity could allow attackers to compromise
  secure communications, authenticate as legitimate users, and escalate their privileges within the network.
references:
- https://research.splunk.com/ed06725f-6da6-439f-9dcc-ab30e891297c/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1552.004
- attack.t1649
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*export-pfxcertificate*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1649/atomic_red_team/4104_export_pfxcertificate.log
