title: Allow File And Printing Sharing In Firewall
id: ce27646e-d411-11eb-8a00-acde48001122
status: experimental
description: The following analytic detects the modification of firewall settings to allow file and printer sharing. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions involving 'netsh' commands that
  enable file and printer sharing. This activity is significant because it can indicate an attempt by ransomware to discover
  and encrypt files on additional machines connected to the compromised host. If confirmed malicious, this could lead to widespread
  file encryption across the network, significantly increasing the impact of a ransomware attack.
references:
- https://research.splunk.com/ce27646e-d411-11eb-8a00-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1686.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\netsh.exe'
  sel2:
    OriginalFileName: netsh.exe
  sel3:
    CommandLine: '*firewall*'
  sel4:
    CommandLine: '*group="File and Printer Sharing"*'
  sel5:
    CommandLine: '*enable=Yes*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/ransomware_ttp/data2/windows-sysmon.log
