title: Windows Impair Defense Disable Win Defender Report Infection
id: 201946c6-b1d5-42bb-a7e0-5f7123f47fc4
status: experimental
description: The following analytic detects modifications to the Windows registry that disable Windows Defender's infection
  reporting. It leverages data from the Endpoint.Registry datamodel, specifically monitoring changes to the "DontReportInfectionInformation"
  registry key. This activity is significant because it can prevent Windows Defender from reporting detailed threat information
  to Microsoft, potentially allowing malware to evade detection. If confirmed malicious, this action could enable attackers
  to bypass security measures, maintain persistence, and avoid detection, leading to prolonged unauthorized access and potential
  data breaches.
references:
- https://research.splunk.com/201946c6-b1d5-42bb-a7e0-5f7123f47fc4/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Microsoft\\MRT\\DontReportInfectionInformation'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable-windows-security-defender-features/windefender-bypas-2-sysmon.log
