title: Linux Auditd Doas Tool Execution
id: 91b8ca78-f205-4826-a3ef-cd8d6b24e97b
status: experimental
description: The following analytic detects the execution of the 'doas' tool on a Linux host. This tool allows standard users
  to perform tasks with root privileges, similar to 'sudo'. The detection leverages data from Linux Auditd, focusing on process
  names and command-line executions. This activity is significant as 'doas' can be exploited by adversaries to gain elevated
  privileges on a compromised host. If confirmed malicious, this could lead to unauthorized administrative access, potentially
  compromising the entire system.
references:
- https://research.splunk.com/91b8ca78-f205-4826-a3ef-cd8d6b24e97b/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.003
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: SYSCALL
  sel2:
    comm: doas
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.003/linux_auditd_doas_new/linux_auditd_new_doas.log
