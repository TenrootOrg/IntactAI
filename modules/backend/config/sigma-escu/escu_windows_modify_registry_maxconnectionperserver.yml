title: Windows Modify Registry MaxConnectionPerServer
id: 064cd09f-1ff4-4823-97e0-45c2f5b087ec
status: experimental
description: The following analytic identifies a suspicious modification of the Windows registry setting for max connections
  per server. It detects changes to specific registry paths using data from the Endpoint.Registry datamodel. This activity
  is significant because altering this setting can be exploited by attackers to increase the number of concurrent connections
  to a remote server, potentially facilitating DDoS attacks or enabling more effective lateral movement within a compromised
  network. If confirmed malicious, this could lead to network disruption or further compromise of additional systems.
references:
- https://research.splunk.com/064cd09f-1ff4-4823-97e0-45c2f5b087ec/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\MaxConnectionsPerServer*'
  sel2:
    TargetObject: '*\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Internet Settings\\MaxConnectionsPer1_0Server*'
  sel3:
    Details:
    - '* (0x0000000a)'
    - '0x0000000a'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/warzone_rat/maxconnectionperserver/registry_event.log
