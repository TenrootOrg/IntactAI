title: Linux Auditd Find Credentials From Password Stores
id: 4de73044-9a1d-4a51-a1c2-85267d8dcab3
status: experimental
description: The following analytic detects suspicious attempts to find credentials stored in password stores, indicating
  a potential attacker's effort to access sensitive login information. Password stores are critical repositories that contain
  valuable credentials, and unauthorized access to them can lead to significant security breaches. By monitoring for unusual
  or unauthorized activities related to password store access, this analytic helps identify potential credential theft attempts,
  allowing security teams to respond promptly and prevent unauthorized access to critical systems and data.
references:
- https://research.splunk.com/4de73044-9a1d-4a51-a1c2-85267d8dcab3/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555.005
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    CommandLine:
    - '*find*'
    - '*grep*'
  sel2:
    CommandLine:
    - '*password*'
    - '*pass *'
    - '*credential*'
    - '*creds*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.005/linux_auditd_find_credentials/auditd_execve_find_creds.log
