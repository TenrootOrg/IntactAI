title: Zscaler Adware Activities Threat Blocked
id: 3407b250-345a-4d71-80db-c91e555a3ece
status: experimental
description: The following analytic identifies potential adware activity blocked by Zscaler. It leverages web proxy logs to
  detect blocked actions associated with adware threats. Key data points such as device owner, user, URL category, destination
  URL, and IP are analyzed. This activity is significant as adware can degrade system performance, lead to unwanted advertisements,
  and potentially expose users to further malicious content. If confirmed malicious, it could indicate an attempt to compromise
  user systems, necessitating further investigation and remediation to prevent potential data breaches or system exploitation.
references:
- https://research.splunk.com/3407b250-345a-4d71-80db-c91e555a3ece/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1566
logsource:
  category: proxy
detection:
  sel1:
    action: blocked
  sel2:
    threatname: '*adware*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566/zscalar_web_proxy/zscalar_web_proxy.json
