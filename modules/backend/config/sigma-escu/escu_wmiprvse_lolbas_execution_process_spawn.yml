title: Wmiprvse LOLBAS Execution Process Spawn
id: b7e11721-08b1-4d8b-9628-813bb2380514
status: experimental
description: The following analytic detects `wmiprvse.exe` spawning a LOLBAS execution process. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process creation events where `wmiprvse.exe` is the parent process and
  the child process is a known LOLBAS binary. This activity is significant as it may indicate lateral movement or remote code
  execution by an adversary abusing Windows Management Instrumentation (WMI). If confirmed malicious, this behavior could
  allow attackers to execute arbitrary code, escalate privileges, or maintain persistence within the environment, posing a
  severe security risk.
references:
- https://research.splunk.com/b7e11721-08b1-4d8b-9628-813bb2380514/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\wmiprvse.exe'
  sel2:
