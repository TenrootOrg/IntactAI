title: Windows Cisco Secure Endpoint Stop Immunet Service Via Sfc
id: 44badcb1-2e8c-4628-9537-021bbae571ad
status: experimental
description: The following analytic detects the use of the `sfc.exe` utility, in order to stop the Immunet Protect service.
  The Sfc.exe utility is part of Cisco Secure Endpoint installation. This detection leverages telemetry from the endpoint,
  focusing on command-line executions involving the `-k` parameter. This activity is significant as it indicates potential
  tampering with defensive mechanisms. If confirmed malicious, attackers could partially blind the EDR, enabling further compromise
  and lateral movement within the network.
references:
- https://research.splunk.com/44badcb1-2e8c-4628-9537-021bbae571ad/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sfc.exe'
  sel2:
    CommandLine: '* -k*'
  sel3:
    Image:
    - '*:\\Windows\\System32\\*'
    - '*:\\Windows\\SysWOW64\\*'
    - :\\Windows\\WinSxS\\*
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/cisco_secure_endpoint_tampering/sfc_tampering.log
