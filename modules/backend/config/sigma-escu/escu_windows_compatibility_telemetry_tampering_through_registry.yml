title: Windows Compatibility Telemetry Tampering Through Registry
id: 43834687-cc48-4878-a2fa-f76e4271791f
status: experimental
description: This detection identifies suspicious modifications to the Windows Compatibility Telemetry registry settings,
  specifically within the "TelemetryController" registry key and "Command" registry value. It leverages data from the Endpoint.Registry
  data model, focusing on registry paths and values indicative of such changes. This activity is significant because CompatTelRunner.exe
  and the "Microsoft Compatibility Appraiser" task always run as System and can be used to elevate privileges or establish
  a highly privileged persistence mechanism. If confirmed malicious, this could enable unauthorized code execution, privilege
  escalation, or persistent access to the compromised system.
references:
- https://research.splunk.com/43834687-cc48-4878-a2fa-f76e4271791f/
author: Splunk Security Content (Apache-2.0), Steven Dick
tags:
- attack.t1546
- attack.t1053.005
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\AppCompatFlags\\TelemetryController*'
  sel2:
    TargetObject: '*\\Command'
  sel3:
    Details:
    - '* ((empty))'
    - (empty)
  condition: (sel1 and sel2 and not (sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1546/compattelrunner_abuse/compattelrunner_abuse.log
