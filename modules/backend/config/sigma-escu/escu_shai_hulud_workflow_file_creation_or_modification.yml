title: Shai-Hulud Workflow File Creation or Modification
id: 6b4a0a7f-10d1-4d72-9c4c-5c6a3d9f9d6a
status: experimental
description: 'Detects creation or deletion of malicious GitHub Actions workflow files associated with

  Shai-Hulud worm variants on Linux or Windows endpoints. This includes the original shai-hulud-workflow.yml,

  the 2.0 backdoor discussion.yaml (enables command injection via GitHub Discussions on self-hosted

  runners named SHA1HULUD), and the secrets exfiltration workflow formatter_*.yml pattern. These

  files are used to exfiltrate credentials and propagate across repositories.'
references:
- https://research.splunk.com/6b4a0a7f-10d1-4d72-9c4c-5c6a3d9f9d6a/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1574.006
- attack.t1554
- attack.t1195
logsource:
  category: file_event
detection:
  sel1:
    TargetFilename:
    - '*/.github/workflows/discussion.yaml'
    - '*/.github/workflows/discussion.yml'
    - '*/.github/workflows/formatter_*.yaml'
    - '*/.github/workflows/formatter_*.yml'
    - '*/.github/workflows/shai-hulud-workflow.yaml'
    - '*/.github/workflows/shai-hulud-workflow.yml'
    - '*/.github/workflows/shai-hulud.yaml'
    - '*/.github/workflows/shai-hulud.yml'
    - '*\\.github\\workflows\\discussion.yaml'
    - '*\\.github\\workflows\\discussion.yml'
    - '*\\.github\\workflows\\formatter_*.yaml'
    - '*\\.github\\workflows\\formatter_*.yml'
    - '*\\.github\\workflows\\shai-hulud-workflow.yaml'
    - '*\\.github\\workflows\\shai-hulud-workflow.yml'
    - '*\\.github\\workflows\\shai-hulud.yaml'
    - '*\\.github\\workflows\\shai-hulud.yml'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1195.001/npm/shai_hulud_workflow_sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1195.001/npm/windows_workflow_sysmon.log
