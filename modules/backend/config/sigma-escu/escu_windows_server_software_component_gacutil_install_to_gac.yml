title: Windows Server Software Component GACUtil Install to GAC
id: 7c025ef0-9e65-4c57-be39-1c13dbb1613e
status: experimental
description: The following analytic detects the use of GACUtil.exe to add a DLL into the Global Assembly Cache (GAC). It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. This activity
  is significant because adding a DLL to the GAC allows it to be called by any application, potentially enabling widespread
  code execution. If confirmed malicious, this could allow an attacker to execute arbitrary code across the operating system,
  leading to privilege escalation or persistent access.
references:
- https://research.splunk.com/7c025ef0-9e65-4c57-be39-1c13dbb1613e/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1505.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\gacutil.exe'
  sel2:
    CommandLine:
    - '*-i *'
    - '*/i *'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1505.004/gacutil_windows-sysmon.log
