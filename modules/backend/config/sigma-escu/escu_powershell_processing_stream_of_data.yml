title: Powershell Processing Stream Of Data
id: 0d718b52-c9f1-11eb-bc61-acde48001122
status: experimental
description: 'The following analytic detects suspicious PowerShell script execution involving compressed stream data processing,
  identified via EventCode 4104.

  It leverages PowerShell Script Block Logging to flag scripts using `IO.Compression`, `IO.StreamReader`, or decompression
  methods.

  This activity is significant as it often indicates obfuscated PowerShell or embedded .NET/binary execution, which are common
  tactics for evading detection.

  If confirmed malicious, this behavior could allow attackers to execute hidden code, escalate privileges, or maintain persistence
  within the environment.'
references:
- https://research.splunk.com/0d718b52-c9f1-11eb-bc61-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*IO.Compression.*'
    - '*IO.StreamReader*'
    - '*]::Decompress*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/streamreader.log
