title: Windows AppX Deployment Unsigned Package Installation
id: 9b5e7c14-f8d2-4a3b-b1a7-e5c9f2a8d123
status: experimental
description: The following analytic detects attempts to install unsigned MSIX/AppX packages using the -AllowUnsigned parameter.
  This detection leverages Windows event logs from the AppXDeployment-Server, specifically focusing on EventID 603 which indicates
  the start of a deployment operation with specific deployment flags. The flag value 8388608 corresponds to the -AllowUnsigned
  option in PowerShell's Add-AppxPackage cmdlet. This activity is significant as adversaries have been observed leveraging
  unsigned MSIX packages to deliver malware, bypassing signature verification that would normally protect users from malicious
  packages. If confirmed malicious, this could allow attackers to execute arbitrary code, establish persistence, or deliver
  malware while evading traditional detection mechanisms.
references:
- https://research.splunk.com/9b5e7c14-f8d2-4a3b-b1a7-e5c9f2a8d123/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1553.005
- attack.t1204.002
logsource:
  product: windows
  service: appxdeployment-server
detection:
  sel1:
    EventID: '603'
  sel2:
    Flags: '8388608'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1204.002/appx/windows_appxdeploymentserver.log
