title: Windows Scheduled Tasks for CompMgmtLauncher or Eventvwr
id: feb43b86-8c38-46cd-865e-20ce8a96c26c
status: experimental
description: The following analytic detects the creation or modification of Windows Scheduled Tasks related to CompMgmtLauncher
  or Eventvwr. These legitimate system utilities, used for launching the Computer Management Console and Event Viewer, can
  be abused by attackers to execute malicious payloads under the guise of normal system processes. By leveraging these tasks,
  adversaries can establish persistence or elevate privileges without raising suspicion. This detection helps security analysts
  identify unusual or unauthorized scheduled tasks involving these executables, allowing for timely investigation and remediation
  of potential threats.
references:
- https://research.splunk.com/feb43b86-8c38-46cd-865e-20ce8a96c26c/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1053
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4698'
  sel2:
    TaskContent:
    - '*&lt;Command&gt;C:\\Windows\\System32\\CompMgmtLauncher.exe&lt;/Command&gt;*'
    - '*<Command>C:\\Windows\\System32\\CompMgmtLauncher.exe</Command>*'
  sel3:
    TaskContent:
    - '*&lt;Command&gt;C:\\Windows\\System32\\zh-CN\\eventvwr.msc&lt;/Command&gt;*'
    - '*<Command>C:\\Windows\\System32\\zh-CN\\eventvwr.msc</Command>*'
  sel4:
    TaskContent:
    - '*&lt;Command&gt;C:\\Windows\\System32\\eventvwr.msc&lt;/Command&gt;*'
    - '*<Command>C:\\Windows\\System32\\eventvwr.msc</Command>*'
  condition: (sel1 and ((sel2 or sel3) or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053/valleyrat_schedtask/valleyrat_schedtask.log
