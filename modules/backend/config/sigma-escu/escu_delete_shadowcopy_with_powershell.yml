title: Delete ShadowCopy With PowerShell
id: 5ee2bcd0-b2ff-11eb-bb34-acde48001122
status: experimental
description: The following analytic detects the use of PowerShell to delete shadow copies via the WMIC PowerShell module.
  It leverages EventCode 4104 and searches for specific keywords like "ShadowCopy," "Delete," or "Remove" within the ScriptBlockText.
  This activity is significant because deleting shadow copies is a common tactic used by ransomware, such as DarkSide, to
  prevent data recovery. If confirmed malicious, this action could lead to irreversible data loss and hinder recovery efforts,
  significantly impacting business continuity and data integrity.
references:
- https://research.splunk.com/5ee2bcd0-b2ff-11eb-bb34-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1490
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*ShadowCopy*'
  sel3:
    ScriptBlockText: '*Delete*'
  sel4:
    ScriptBlockText: '*Remove*'
  condition: (sel1 and sel2 and (sel3 or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/single_event_delete_shadowcopy.log
