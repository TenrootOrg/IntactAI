title: GetWmiObject DS User with PowerShell
id: 22d3b118-04df-11ec-8fa3-acde48001122
status: experimental
description: 'The following analytic detects the execution of `powershell.exe` with command-line arguments used to query domain
  users via the `Get-WmiObject` cmdlet and `-class ds_user` parameter.

  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line
  executions.

  This activity is significant as it indicates potential reconnaissance efforts by adversaries to enumerate domain users,
  which is a common step in Active Directory Discovery.

  If confirmed malicious, this could lead to further attacks, including privilege escalation and lateral movement within the
  network.'
references:
- https://research.splunk.com/22d3b118-04df-11ec-8fa3-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    Image: '*\\cmd.exe'
  sel8:
    OriginalFileName: Cmd.Exe
  sel9:
    CommandLine: '*get-wmiobject*'
  sel10:
    CommandLine: '*ds_user*'
  sel11:
    CommandLine: '*root\\directory\\ldap*'
  sel12:
    CommandLine: '*-namespace*'
  condition: (((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) or (sel7 or sel8)) and sel9 and sel10 and sel11 and
    sel12)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/windows-sysmon.log
