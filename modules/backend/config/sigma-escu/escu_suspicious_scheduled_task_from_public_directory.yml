title: Suspicious Scheduled Task from Public Directory
id: 7feb7972-7ac3-11eb-bac8-acde48001122
status: experimental
description: The following analytic identifies the creation of scheduled tasks that execute binaries or scripts from public
  directories, such as users\public, \programdata\, or \windows\temp, using schtasks.exe with the /create command. It leverages
  Sysmon Event ID 1 data to detect this behavior. This activity is significant because it often indicates an attempt to maintain
  persistence or execute malicious scripts, which are common tactics in malware deployment. If confirmed as malicious, this
  could lead to data compromise, unauthorized access, and potential lateral movement within the network.
references:
- https://research.splunk.com/7feb7972-7ac3-11eb-bac8-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\schtasks.exe'
  sel2:
    CommandLine: '*\\users\\public\\*'
  sel3:
    CommandLine: '*\\programdata\\*'
  sel4:
    CommandLine: '*windows\\temp*'
  sel5:
    CommandLine: '*/create*'
  condition: (sel1 and ((sel2 or sel3) or sel4) and sel5)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/schtasks/windows-sysmon.log
x-intact-burst: false
x-intact: 'Fired 8 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
