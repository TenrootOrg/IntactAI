title: Suspicious wevtutil Usage
id: 2827c0fd-e1be-4868-ae25-59d28e0f9d4f
status: experimental
description: 'The following analytic detects the usage of wevtutil.exe with parameters for clearing event logs such as Application,
  Security, Setup, Trace, or System.

  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments.

  This activity is significant because clearing event logs can be an attempt to cover tracks after malicious actions, hindering
  forensic investigations.

  If confirmed malicious, this behavior could allow an attacker to erase evidence of their activities, making it difficult
  to trace their actions and understand the full scope of the compromise.'
references:
- https://research.splunk.com/2827c0fd-e1be-4868-ae25-59d28e0f9d4f/
author: Splunk Security Content (Apache-2.0), David Dorsey, Michael Haag, Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1685.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\wevtutil.exe'
  sel2:
    OriginalFileName: wevtutil.exe
  sel3:
    CommandLine:
    - '* cl *'
    - '*clear-log*'
  sel4:
    CommandLine:
    - '*/Trace*'
    - '*AMSI/Debug*'
    - '*Application*'
    - '*CiscoSecureEndpoint*'
    - '*Microsoft-Windows-BitLocker*'
    - '*Microsoft-Windows-Bits*'
    - '*Microsoft-Windows-CAPI2*'
    - '*Microsoft-Windows-Kernel-File*'
    - '*Microsoft-Windows-Kernel-Process*'
    - '*Microsoft-Windows-LDAP*'
    - '*Microsoft-Windows-PowerShell*'
    - '*Microsoft-Windows-Sysmon*'
    - '*Microsoft-Windows-TerminalServices-LocalSessionManager*'
    - '*Microsoft-Windows-TerminalServices-RemoteConnectionManager*'
    - '*Microsoft-Windows-WMI-Activity*'
    - '*OpenSSH/*'
    - '*PowerShellCore/*'
    - '*Security*'
    - '*Setup*'
    - '*System*'
    - '*Windows Firewall With Advanced Security*'
    - '*Windows PowerShell*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1070.001/windows_pwh_log_cleared/wevtutil_clear_log.log
