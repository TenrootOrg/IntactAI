title: Linux Disable Services
id: f2e08a38-6689-4df4-ad8c-b51c16262316
status: experimental
description: The following analytic detects attempts to disable a service on a Linux system. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on processes like "systemctl," "service," and "svcadm" with commands containing
  "disable." This activity is significant as adversaries may disable security or critical services to evade detection and
  facilitate further malicious actions, such as deploying destructive payloads. If confirmed malicious, this could lead to
  the termination of essential security services, allowing attackers to persist undetected and potentially cause significant
  damage to the system.
references:
- https://research.splunk.com/f2e08a38-6689-4df4-ad8c-b51c16262316/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1489
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/systemctl'
    - '*/service'
    - '*/svcadm'
  sel2:
    CommandLine: '* disable*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1489/linux_service_stop_disable/sysmon_linux.log
