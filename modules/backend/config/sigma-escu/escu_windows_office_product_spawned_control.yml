title: Windows Office Product Spawned Control
id: 081c485d-ac8d-4bee-ad4c-525772fead4d
status: experimental
description: The following analytic identifies instances where `control.exe` is spawned by a Microsoft Office product. It
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and parent process relationships.
  This activity is significant because it can indicate exploitation attempts related to CVE-2021-40444, where `control.exe`
  is used to execute malicious .cpl or .inf files. If confirmed malicious, this behavior could allow an attacker to execute
  arbitrary code, potentially leading to system compromise, data exfiltration, or further lateral movement within the network.
references:
- https://research.splunk.com/081c485d-ac8d-4bee-ad4c-525772fead4d/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1566.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage:
    - '*\\EQNEDT32.exe'
    - '*\\excel.exe'
    - '*\\Graph.exe'
    - '*\\msaccess.exe'
    - '*\\mspub.exe'
    - '*\\onenote.exe'
    - '*\\onenoteim.exe'
    - '*\\onenotem.exe'
    - '*\\outlook.exe'
    - '*\\powerpnt.exe'
    - '*\\visio.exe'
    - '*\\winproj.exe'
    - '*\\winword.exe'
  sel2:
    Image: '*\\control.exe'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566.001/macro/windows-sysmon_control.log
