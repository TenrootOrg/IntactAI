title: Windows Diskshadow Proxy Execution
id: 58adae9e-8ea3-11ec-90f6-acde48001122
status: experimental
description: The following analytic detects the use of DiskShadow.exe in scripting mode, which can execute arbitrary unsigned
  code. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions with scripting
  mode flags. This activity is significant because DiskShadow.exe is typically used for legitimate backup operations, but
  its misuse can indicate an attempt to execute unauthorized code. If confirmed malicious, this could lead to unauthorized
  code execution, potentially compromising the system and allowing further malicious activities.
references:
- https://research.splunk.com/58adae9e-8ea3-11ec-90f6-acde48001122/
author: Splunk Security Content (Apache-2.0), Lou Stella, Splunk
tags:
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\diskshadow.exe'
  sel2:
    OriginalFileName: diskshadow.exe
  sel3:
    CommandLine:
    - '*-s*'
    - '*/s*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218/diskshadow/windows-sysmon.log
