title: Linux Auditd Preload Hijack Via Preload File
id: c1b7abca-55cb-4a39-bdfb-e28c1c12745f
status: experimental
description: 'The following analytic detects suspicious preload hijacking via the `preload` file, which may indicate an attacker''s
  attempt to intercept or manipulate library loading processes.

  The `preload` file can be used to force the loading of specific libraries before others, potentially allowing malicious
  code to execute or alter application behavior.

  By monitoring for unusual or unauthorized modifications to the `preload` file, this analytic helps identify attempts to
  hijack preload mechanisms, enabling security teams to investigate and address potential threats to system integrity and
  security.

  Correlate this with related EXECVE or PROCTITLE events to identify the process or user responsible for the access or modification.'
references:
- https://research.splunk.com/c1b7abca-55cb-4a39-bdfb-e28c1c12745f/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1574.006
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: PATH
  sel2:
    full_path|re: /etc/ld.so.preload.*
  condition: sel1 and sel2
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1574.006/auditd_path_preload_file/path_preload.log
