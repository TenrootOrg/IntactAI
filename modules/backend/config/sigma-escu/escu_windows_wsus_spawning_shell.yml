title: Windows WSUS Spawning Shell
id: 76ea28ac-6f10-43fd-b5fe-340022ad0fd3
status: experimental
description: The following analytic identifies instances where a shell (PowerShell.exe or Cmd.exe) is spawned from wsusservice.exe,
  the Windows Server Update Services process. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process creation events where the parent process is wsusservice.exe. This activity is significant as it may
  indicate exploitation of CVE-2025-59287, a critical deserialization vulnerability in WSUS that allows unauthenticated remote
  code execution. If confirmed malicious, this behavior could allow attackers to execute arbitrary commands on WSUS servers,
  potentially leading to system compromise, data exfiltration, domain enumeration, or further lateral movement within the
  network.
references:
- https://research.splunk.com/76ea28ac-6f10-43fd-b5fe-340022ad0fd3/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\wsusservice.exe'
  sel2:
    Image: '*\\cmd.exe'
  sel3:
    OriginalFileName: Cmd.Exe
  sel4:
    Image: '*\\pwsh.exe'
  sel5:
    Image: '*\\powershell.exe'
  sel6:
    OriginalFileName: pwsh.dll
  sel7:
    OriginalFileName: PowerShell.EXE
  sel8:
    OriginalFileName: powershell_ise.EXE
  sel9:
    Image: '*\\powershell_ise.exe'
  condition: (sel1 and ((sel2 or sel3) or (((((sel4 or sel5) or sel6) or sel7) or sel8) or sel9)))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1505.003/wsus-windows-sysmon.log
