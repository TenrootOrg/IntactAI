title: WSReset UAC Bypass
id: 8b5901bc-da63-11eb-be43-acde48001122
status: experimental
description: The following analytic detects a suspicious modification of the registry aimed at bypassing User Account Control
  (UAC) by leveraging WSReset.exe. It identifies the creation or modification of specific registry values under the path "*\\AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\\Shell\\open\\command*".
  This detection uses data from Endpoint Detection and Response (EDR) agents, focusing on process and registry events. This
  activity is significant because UAC bypass techniques can allow attackers to execute high-privilege actions without user
  consent. If confirmed malicious, this could lead to unauthorized code execution and potential system compromise.
references:
- https://research.splunk.com/8b5901bc-da63-11eb-be43-acde48001122/
author: Splunk Security Content (Apache-2.0), Steven Dick, Teoderick Contreras, Splunk
tags:
- attack.t1548.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\AppX82a6gwre4fdg3bt635tn5ctqjf8msdd2\\Shell\\open\\command*'
  sel2:
    TargetObject: '*\\(Default)'
  sel3:
    TargetObject: '*\\DelegateExecute'
  condition: (sel1 and (sel2 or sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/uac_bypass/windows-sysmon.log
