title: Detect HTML Help Spawn Child Process
id: 723716de-ee55-4cd4-9759-c44e7e55ba4b
status: experimental
description: The following analytic detects the execution of hh.exe (HTML Help) spawning a child process, indicating the use
  of a Compiled HTML Help (CHM) file to execute Windows script code. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process creation events where hh.exe is the parent process. This activity is significant
  as it may indicate an attempt to execute malicious scripts via CHM files, a known technique for bypassing security controls.
  If confirmed malicious, this could lead to unauthorized code execution, potentially compromising the system.
references:
- https://research.splunk.com/723716de-ee55-4cd4-9759-c44e7e55ba4b/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\hh.exe'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.001/atomic_red_team/windows-sysmon.log
