title: Windows Ngrok Reverse Proxy Usage
id: e2549f2c-0aef-408a-b0c1-e0f270623436
status: experimental
description: The following analytic detects the execution of ngrok.exe on a Windows operating system. It leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments. This activity is significant
  because while ngrok is a legitimate tool for creating secure tunnels, it is increasingly used by adversaries to bypass network
  defenses and establish reverse proxies. If confirmed malicious, this could allow attackers to exfiltrate data, maintain
  persistence, or facilitate further attacks by tunneling traffic through the compromised system.
references:
- https://research.splunk.com/e2549f2c-0aef-408a-b0c1-e0f270623436/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1572
- attack.t1090
- attack.t1102
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\ngrok.exe'
  sel2:
    CommandLine:
    - '*start*'
    - '*--config*'
    - '*http*'
    - '*authtoken*'
    - '*tcp*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1572/ngrok/windows-sysmon.log
