title: Windows Wmic Memory Chip Discovery
id: aecaddaa-5885-4e44-a724-1edd5ecbc79f
status: experimental
description: The following analytic detects the execution of Windows Management Instrumentation Command-line (WMIC) commands
  related to memory chip discovery on a Windows system. Specifically, it monitors instances where commands such as “wmic memorychip”
  are used to retrieve detailed information about installed RAM modules. While these commands can serve legitimate administrative
  and troubleshooting purposes, they may also be employed by adversaries to gather system hardware specifications as part
  of their reconnaissance activities. By identifying and alerting on WMIC memory chip queries, security teams can enhance
  their ability to spot unauthorized information gathering and take proactive measures to mitigate potential threats.
references:
- https://research.splunk.com/aecaddaa-5885-4e44-a724-1edd5ecbc79f/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\wmic.exe'
  sel2:
    OriginalFileName: wmic.exe
  sel3:
    CommandLine: '* memorychip*'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/lamehug/T1082/wmic_cmd/wmic_cmd.log
