title: Credential Dumping via Copy Command from Shadow Copy
id: d8c406fe-23d2-45f3-a983-1abe7b83ff3b
status: experimental
description: The following analytic detects the use of the copy command to dump credentials from a shadow copy. It leverages
  Endpoint Detection and Response (EDR) data to identify processes with command lines referencing critical files like "sam",
  "security", "system", and "ntds.dit" in system directories. This activity is significant as it indicates an attempt to extract
  credentials, a common technique for unauthorized access and privilege escalation. If confirmed malicious, this could lead
  to attackers gaining sensitive login information, escalating privileges, moving laterally within the network, or accessing
  sensitive data.
references:
- https://research.splunk.com/d8c406fe-23d2-45f3-a983-1abe7b83ff3b/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    OriginalFileName: Cmd.Exe
  sel3:
    CommandLine: '*\\system32\\config\\sam*'
  sel4:
    CommandLine: '*\\system32\\config\\security*'
  sel5:
    CommandLine: '*\\system32\\config\\system*'
  sel6:
    CommandLine: '*\\windows\\ntds\\ntds.dit*'
  condition: ((sel1 or sel2) and (((sel3 or sel4) or sel5) or sel6))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.003/atomic_red_team/windows-sysmon.log
