title: Remcos RAT File Creation in Remcos Folder
id: 25ae862a-1ac3-11ec-94a1-acde48001122
status: experimental
description: The following analytic detects the creation of files in the Remcos folder within the AppData directory, specifically
  targeting keylog and clipboard log files. It leverages the Endpoint.Filesystem data model to identify .dat files created
  in paths containing "remcos." This activity is significant as it indicates the presence of the Remcos RAT, which performs
  keylogging, clipboard capturing, and audio recording. If confirmed malicious, this could lead to unauthorized data exfiltration
  and extensive surveillance capabilities for the attacker.
references:
- https://research.splunk.com/25ae862a-1ac3-11ec-94a1-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk, Sanjay Govind
tags:
- attack.t1113
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*.dat'
  sel2:
    TargetFilename: '*\\remcos\\*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/remcos/remcos_agent/sysmon.log
