title: Windows RMM Tool Execution
id: 4afbd373-b769-4f82-8375-41e0153e46f9
status: experimental
description: 'Detects process creation events of various remote access tools.

  Remote management tools, when used for legitimate purposes, can help IT professionals and system administrators remotely
  access and manage computer systems.

  However, threat actors may exploit these tools for malicious purposes.'
references:
- https://research.splunk.com/4afbd373-b769-4f82-8375-41e0153e46f9/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1219
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  sel1:
    EventID: '1'
  sel2:
