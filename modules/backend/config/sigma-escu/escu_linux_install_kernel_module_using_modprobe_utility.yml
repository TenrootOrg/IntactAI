title: Linux Install Kernel Module Using Modprobe Utility
id: 387b278a-6326-11ec-aa2c-acde48001122
status: experimental
description: The following analytic detects the installation of a Linux kernel module using the modprobe utility. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. This activity
  is significant because installing a kernel module can indicate an attempt to deploy a rootkit or other malicious kernel-level
  code, potentially leading to elevated privileges and bypassing security detections. If confirmed malicious, this could allow
  an attacker to gain persistent, high-level access to the system, compromising its integrity and security.
references:
- https://research.splunk.com/387b278a-6326-11ec-aa2c-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1547.006
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/kmod'
    - '*/sudo'
  sel2:
    CommandLine: '*modprobe*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1547.006/loading_linux_kernel_module/sysmon_linux.log
