title: AWS Defense Evasion Update Cloudtrail
id: 7c921d28-ef48-4f1b-85b3-0af8af7697db
status: experimental
description: The following analytic detects `UpdateTrail` events in AWS CloudTrail logs. It identifies attempts to modify
  CloudTrail settings, potentially to evade logging. The detection leverages CloudTrail logs, focusing on `UpdateTrail` events
  where the user agent is not the AWS console and the operation is successful. This activity is significant because altering
  CloudTrail settings can disable or limit logging, hindering visibility into AWS account activities. If confirmed malicious,
  this could allow attackers to operate undetected, compromising the integrity and security of the AWS environment.
references:
- https://research.splunk.com/7c921d28-ef48-4f1b-85b3-0af8af7697db/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: UpdateTrail
  sel2:
    eventSource: cloudtrail.amazonaws.com
  sel3:
    userAgent: console.amazonaws.com
  sel4:
    errorCode: null
  condition: (sel1 and sel2 and not sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/update_cloudtrail/aws_cloudtrail_events.json
