title: AWS Exfiltration via DataSync Task
id: 05c4b09f-ea28-4c7c-a7aa-a246f665c8a2
status: experimental
description: The following analytic detects the creation of an AWS DataSync task, which could indicate potential data exfiltration.
  It leverages AWS CloudTrail logs to identify the `CreateTask` event from the DataSync service. This activity is significant
  because attackers can misuse DataSync to transfer sensitive data from a private AWS location to a public one, leading to
  data compromise. If confirmed malicious, this could result in unauthorized access to sensitive information, causing severe
  data breaches and compliance violations.
references:
- https://research.splunk.com/05c4b09f-ea28-4c7c-a7aa-a246f665c8a2/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1119
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: CreateTask
  sel2:
    eventSource: datasync.amazonaws.com
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1119/aws_exfil_datasync/cloudtrail.json
