title: Linux Auditd Auditd Daemon Abort
id: 76d6573f-c4ab-4fa1-8390-c036416d4add
status: experimental
description: The following analytic detects the abnormal termination of the Linux audit daemon (auditd) by identifying DAEMON_ABORT
  events in audit logs. These terminations suggest a serious failure of the auditing subsystem, potentially due to resource
  exhaustion, corruption, or malicious interference. Unlike a clean shutdown, DAEMON_ABORT implies that audit logging may
  have been disabled without system administrator intent. Alerts should be generated on detection and correlated with DAEMON_START,
  DAEMON_END, and system logs to determine root cause. If no DAEMON_START follows soon after, or this pattern repeats, it
  indicates a high-severity issue that impacts log integrity and should be immediately investigated.
references:
- https://research.splunk.com/76d6573f-c4ab-4fa1-8390-c036416d4add/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685.004
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: DAEMON_ABORT
  condition: sel1
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.012/auditd_daemon_type/linux_auditd_daemon.log
