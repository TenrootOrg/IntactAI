title: Modification Of Wallpaper
id: accb0712-c381-11eb-8e5b-acde48001122
status: experimental
description: The following analytic detects the modification of registry keys related to the desktop wallpaper settings. It
  leverages Sysmon EventCode 13 to identify changes to the "Control Panel\\Desktop\\Wallpaper" and "Control Panel\\Desktop\\WallpaperStyle"
  registry keys, especially when the modifying process is not explorer.exe or involves suspicious file paths like temp or
  public directories. This activity is significant as it can indicate ransomware behavior, such as the REVIL ransomware, which
  changes the wallpaper to display a ransom note. If confirmed malicious, this could signify a compromised machine and the
  presence of ransomware, leading to potential data encryption and extortion.
references:
- https://research.splunk.com/accb0712-c381-11eb-8e5b-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1491
logsource:
  product: windows
  service: sysmon
  category: registry_event
detection:
  sel1:
    EventID: '13'
  sel2:
    TargetObject:
    - '*\\Control Panel\\Desktop\\Wallpaper'
    - '*\\Control Panel\\Desktop\\WallpaperStyle'
  sel3:
    Image: '*\\explorer.exe'
  sel4:
    TargetObject:
    - '*\\Control Panel\\Desktop\\Wallpaper'
    - '*\\Control Panel\\Desktop\\WallpaperStyle'
  sel5:
    Details:
    - '*\\temp\\*'
    - '*\\users\\public\\*'
  condition: (sel1 and ((sel2 and not sel3) or (sel4 and sel5)))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/revil/inf1/windows-sysmon.log
