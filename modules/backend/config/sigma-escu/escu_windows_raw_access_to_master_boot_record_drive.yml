title: Windows Raw Access To Master Boot Record Drive
id: 7b83f666-900c-11ec-a2d9-acde48001122
status: experimental
description: The following analytic detects suspicious raw access reads to the drive containing the Master Boot Record (MBR).
  It leverages Sysmon EventCode 9 to identify processes attempting to read or write to the MBR sector, excluding legitimate
  system processes. This activity is significant because adversaries often target the MBR to wipe, encrypt, or overwrite it
  as part of their impact payload. If confirmed malicious, this could lead to system instability, data loss, or a complete
  system compromise, severely impacting the organization's operations.
references:
- https://research.splunk.com/7b83f666-900c-11ec-a2d9-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1561.002
logsource:
  product: windows
  service: sysmon
  category: raw_access_thread
detection:
  sel1:
    EventID: '9'
  sel2:
    Device: \\Device\\Harddisk0\\DR0
  sel3:
    Image:
    - '*\\Windows\\System32\\*'
    - '*\\Windows\\SysWOW64\\*'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1561.002/mbr_raw_access/sysmon.log
x-intact-burst: false
x-intact: 'Fired 14 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
