title: Shim Database Installation With Suspicious Parameters
id: 404620de-46d8-48b6-90cc-8a8d7b0876a3
status: experimental
description: The following analytic detects the execution of sdbinst.exe with parameters indicative of silently creating a
  shim database. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names, parent processes,
  and command-line arguments. This activity is significant because shim databases can be used to intercept and manipulate
  API calls, potentially allowing attackers to bypass security controls or achieve persistence. If confirmed malicious, this
  could enable unauthorized code execution, privilege escalation, or persistent access to the compromised system.
references:
- https://research.splunk.com/404620de-46d8-48b6-90cc-8a8d7b0876a3/
author: Splunk Security Content (Apache-2.0), David Dorsey, Splunk
tags:
- attack.t1546.011
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sdbinst.exe'
  sel2:
    CommandLine:
    - '"C:\\Windows\\System32\\sdbinst.exe"'
    - C:\\Windows\\System32\\sdbinst.exe
    - '*-mm'
    - '*-?'
    - '*-m -bg'
  condition: (sel1 and not (sel2))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1546.011/atomic_red_team/windows-sysmon.log
