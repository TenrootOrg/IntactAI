title: Windows Powershell Cryptography Namespace
id: f8b482f4-6d62-49fa-a905-dfa15698317b
status: experimental
description: The following analytic detects suspicious PowerShell script execution involving the cryptography namespace via
  EventCode 4104. It leverages PowerShell Script Block Logging to identify scripts using cryptographic functions, excluding
  common hashes like SHA and MD5. This activity is significant as it is often associated with malware that decrypts or decodes
  additional malicious payloads. If confirmed malicious, this could allow an attacker to execute further code, escalate privileges,
  or establish persistence within the environment. Analysts should investigate the parent process, decrypted data, network
  connections, and the user executing the script.
references:
- https://research.splunk.com/f8b482f4-6d62-49fa-a905-dfa15698317b/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*System.Security.Cryptography*'
  sel3:
    ScriptBlockText:
    - '*SHA*'
    - '*MD5*'
    - '*DeriveBytes*'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/asyncrat_crypto_pwh_namespace/windows-powershell-xml.log
