title: Cisco Secure Firewall - Bits Network Activity
id: b08e69d4-b42d-494c-bd30-abaaa3571ba4
status: experimental
description: The following analytic detects the use of the Background Intelligent Transfer Service (BITS) client application
  in allowed outbound connections. It leverages logs from Cisco Secure Firewall Threat Defense devices and identifies instances
  where BITS is used to initiate downloads from non-standard or unexpected domains. While BITS is a legitimate Windows service
  used for downloading updates, it is also commonly abused by adversaries to stealthily retrieve payloads or tools. This analytic
  filters out known Microsoft Edge update URLs and focuses on connections that may indicate suspicious or unauthorized file
  transfers. If confirmed malicious, this could represent a command and control (C2) channel or a download of malware or tooling
  as part of an attack chain.
references:
- https://research.splunk.com/b08e69d4-b42d-494c-bd30-abaaa3571ba4/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags: []
logsource:
  product: cisco
  service: secure_firewall
detection:
  sel1:
    EventType: ConnectionEvent
  sel2:
    AC_RuleAction:
    - Trust
    - Allow
    - allowed
  sel3:
    ClientApplication: BITS
  sel4:
    URL: '*://msedge.b.tlu.dl*'
  condition: (sel1 and sel2 and sel3 and not (sel4))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_firewall_threat_defense/connection_event/connection_events.log
