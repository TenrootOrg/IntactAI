title: Windows Credentials from Password Stores Query
id: db02d6b4-5d5b-4c33-8d8f-f0577516a8c7
status: experimental
description: The following analytic detects the execution of the Windows OS tool cmdkey.exe, which is often abused by post-exploitation
  tools like winpeas, commonly used in ransomware attacks to list stored usernames, passwords, or credentials. This detection
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs. This activity is significant
  as it indicates potential credential harvesting, which can lead to privilege escalation and persistence. If confirmed malicious,
  attackers could gain unauthorized access to sensitive information and maintain control over compromised systems for further
  exploitation.
references:
- https://research.splunk.com/db02d6b4-5d5b-4c33-8d8f-f0577516a8c7/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmdkey.exe'
  sel2:
    OriginalFileName: cmdkey.exe
  sel3:
    CommandLine: '*/list*'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/winpeas/winpeas_cmdkeylist/cmdkey-sysmon.log
