title: Email files written outside of the Outlook directory
id: 8d52cf03-ba25-4101-aa78-07994aed4f74
status: experimental
description: 'The following analytic detects email files (.pst or .ost) being created outside the standard Outlook directories.

  It leverages the Endpoint.Filesystem data model to identify file creation events and filters for email files not located
  in "C:\Users\*\My Documents\Outlook Files\*" or "C:\Users\*\AppData\Local\Microsoft\Outlook*".

  This activity is significant as it may indicate data exfiltration or unauthorized access to email data.

  If confirmed malicious, an attacker could potentially access sensitive email content, leading to data breaches or further
  exploitation within the network.'
references:
- https://research.splunk.com/8d52cf03-ba25-4101-aa78-07994aed4f74/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1114.001
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*.pst'
    - '*.ost'
  sel2:
    TargetFilename:
    - C:\\Users\\*\\My Documents\\Outlook Files\\*
    - C:\\Users\\*\\AppData\\Local\\Microsoft\\Outlook*
  condition: (sel1 and not (sel2))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1114.001/windows_email_files_outside_email_dir/sysmon.log
