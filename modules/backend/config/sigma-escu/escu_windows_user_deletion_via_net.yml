title: Windows User Deletion Via Net
id: b0b6fd2c-8953-4d1b-8f7b-56075ea6ab3e
status: experimental
description: The following analytic detects the use of net.exe or net1.exe command-line to delete a user account on a system.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and command-line execution logs.
  This activity is significant as it may indicate an attempt to impair user accounts or cover tracks during lateral movement.
  If confirmed malicious, this could lead to unauthorized access removal, disruption of legitimate user activities, or concealment
  of adversarial actions, complicating incident response and forensic investigations.
references:
- https://research.splunk.com/b0b6fd2c-8953-4d1b-8f7b-56075ea6ab3e/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1531
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    CommandLine: '*user*'
  sel4:
    CommandLine: '*/delete*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/xmrig_miner/windows-sysmon.log
