title: Azure AD OAuth Application Consent Granted By User
id: 10ec9031-015b-4617-b453-c0c1ab729007
status: experimental
description: 'The following analytic detects when a user in an Azure AD environment grants consent to an OAuth application.
  It leverages Azure AD audit logs to identify events where users approve application consents.

  This activity is significant as it can expose organizational data to third-party applications, a common tactic used by malicious
  actors to gain unauthorized access.

  If confirmed malicious, this could lead to unauthorized access to sensitive information and resources. Immediate investigation
  is required to validate the application''s legitimacy, review permissions, and mitigate potential risks.'
references:
- https://research.splunk.com/10ec9031-015b-4617-b453-c0c1ab729007/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1528
logsource:
  product: azure
detection:
  sel1:
    operationName: Consent to application
  sel2:
    properties.result: success
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1528/azure_ad_user_consent_granted/azure_ad_user_consent_granted.log
