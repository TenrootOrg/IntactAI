title: Windows Cached Domain Credentials Reg Query
id: 40ccb8e0-1785-466e-901e-6a8b75c04ecd
status: experimental
description: The following analytic identifies a process command line querying the CachedLogonsCount registry value in the
  Winlogon registry. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line
  executions and registry queries. Monitoring this activity is significant as it can indicate the use of post-exploitation
  tools like Winpeas, which gather information about login caching settings. If confirmed malicious, this activity could help
  attackers understand login caching configurations, potentially aiding in credential theft or lateral movement within the
  network.
references:
- https://research.splunk.com/40ccb8e0-1785-466e-901e-6a8b75c04ecd/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1003.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\reg.exe'
  sel2:
    OriginalFileName: reg.exe
  sel3:
    CommandLine: '* query *'
  sel4:
    CommandLine: '*\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon*'
  sel5:
    CommandLine: '*CACHEDLOGONSCOUNT*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/winpeas/sysmon.log
