title: Windows CAB File on Disk
id: 622f08d0-69ef-42c2-8139-66088bc25acd
status: experimental
description: 'The following analytic detects .cab files being written to disk.

  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on events where the file name is ''*.cab''
  and the action is ''write''.

  This activity can be significant as .cab files can be used to deliver malicious payloads, including embedded .url files
  that execute harmful code.

  If confirmed malicious, this behavior could lead to unauthorized code execution and potential system compromise.

  Analysts should review the file path and associated artifacts for further investigation.'
references:
- https://research.splunk.com/622f08d0-69ef-42c2-8139-66088bc25acd/
author: Splunk Security Content (Apache-2.0), Michael Haag, Nasreddine Bencherchali, Splunk
tags:
- attack.t1566.001
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*.cab'
  sel2:
    TargetFilename:
    - '*\\AppData\\Local\\Microsoft\\*'
    - '*\\Windows Kits\\10\\ADK\\Installers\\*'
    - C:\\Program Files (x86)\\*
    - C:\\Program Files\\*
    - C:\\ProgramData\\Microsoft\\*
    - C:\\ProgramData\\Package Cache\\*
    - C:\\Windows\\appcompat\\*
    - C:\\Windows\\Logs\\CBS\\*
    - C:\\Windows\\servicing\\*
    - C:\\Windows\\SoftwareDistribution\\*
    - C:\\Windows\\System32\\*
    - C:\\Windows\\SystemApps\\*
    - C:\\Windows\\SysWOW64\\*
    - C:\\Windows\\WinSxS\\*
  condition: (sel1 and not (sel2))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059/autoit/cab_files.log
x-intact-burst: false
x-intact: 'Fired 41 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
