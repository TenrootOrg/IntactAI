title: Windows Service Create RemComSvc
id: 0be4b5d6-c449-4084-b945-2392b519c33b
status: experimental
description: The following analytic detects the creation of the RemComSvc service on a Windows endpoint, typically indicating
  lateral movement using RemCom.exe. It leverages Windows EventCode 7045 from the System event log, specifically looking for
  the "RemCom Service" name. This activity is significant as it often signifies unauthorized lateral movement within the network,
  which is a common tactic used by attackers to spread malware or gain further access. If confirmed malicious, this could
  lead to unauthorized access to sensitive systems, data exfiltration, or further compromise of the network.
references:
- https://research.splunk.com/0be4b5d6-c449-4084-b945-2392b519c33b/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  sel1:
    EventID: '7045'
  sel2:
    ServiceName: RemCom Service
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1543.003/atomic_red_team/remcom_windows-system.log
