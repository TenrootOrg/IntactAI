title: Cisco IOS XE Implant Access
id: 07c36cda-6567-43c3-bc1a-89dff61e2cd9
status: experimental
description: 'The following analytic identifies the potential exploitation of the Cisco IOS XE vulnerability, CVE-2023-20198,
  in the Web User Interface.

  It monitors POST requests to the "/webui/logoutconfirm.html?logon_hash=*" endpoint using the Web datamodel.

  This activity can be significant as it indicates potential access request to the implant

  If confirmed malicious, attackers could maintain privileged access, compromising the device''s integrity and security.'
references:
- https://research.splunk.com/07c36cda-6567-43c3-bc1a-89dff61e2cd9/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/webui/logoutconfirm.html?logon_hash=*'
  sel2:
    cs-method: POST
  sel3:
    sc-status: '200'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/cisco/iosxe/ciscocve202320198.log
