title: ServicePrincipalNames Discovery with PowerShell
id: 13243068-2d38-11ec-8908-acde48001122
status: experimental
description: The following analytic detects the use of `powershell.exe` to query the domain for Service Principal Names (SPNs)
  using Script Block Logging EventCode 4104. It identifies the use of the KerberosRequestorSecurityToken class within the
  script block, which is equivalent to using setspn.exe. This activity is significant as it often precedes kerberoasting or
  silver ticket attacks, which can lead to credential theft. If confirmed malicious, attackers could leverage this information
  to escalate privileges or persist within the environment.
references:
- https://research.splunk.com/13243068-2d38-11ec-8908-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1558.003
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*KerberosRequestorSecurityToken*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
