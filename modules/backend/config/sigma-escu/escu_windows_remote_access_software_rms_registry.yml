title: Windows Remote Access Software RMS Registry
id: e5b7b5a9-e471-4be8-8c5d-4083983ba329
status: experimental
description: The following analytic detects the creation or modification of Windows registry entries related to the Remote
  Manipulator System (RMS) Remote Admin tool. It leverages data from the Endpoint.Registry datamodel, focusing on registry
  paths containing "SYSTEM\\Remote Manipulator System." This activity is significant because RMS, while legitimate, is often
  abused by adversaries, such as in the Azorult malware campaigns, to gain unauthorized remote access. If confirmed malicious,
  this could allow attackers to remotely control the targeted host, leading to potential data exfiltration, system manipulation,
  or further network compromise.
references:
- https://research.splunk.com/e5b7b5a9-e471-4be8-8c5d-4083983ba329/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1219
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SYSTEM\\Remote Manipulator System*'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
