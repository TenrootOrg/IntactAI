title: GCP Multi-Factor Authentication Disabled
id: b9bc5513-6fc1-4821-85a3-e1d81e451c83
status: experimental
description: The following analytic detects an attempt to disable multi-factor authentication (MFA) for a Google Cloud Platform
  (GCP) user. It leverages Google Workspace Admin log events, specifically the `UNENROLL_USER_FROM_STRONG_AUTH` command. This
  activity is significant because disabling MFA can allow an adversary to maintain persistence within the environment using
  a compromised account without raising suspicion. If confirmed malicious, this action could enable attackers to bypass additional
  security layers, potentially leading to unauthorized access, data exfiltration, or further exploitation of the compromised
  account.
references:
- https://research.splunk.com/b9bc5513-6fc1-4821-85a3-e1d81e451c83/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Mauricio Velazco, Splunk
tags:
- attack.t1556.006
- attack.t1586.003
logsource:
  product: google_workspace
  service: google_workspace.admin
detection:
  sel1:
    event.name: UNENROLL_USER_FROM_STRONG_AUTH
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556/gcp_disable_mfa/gws_admin.log
