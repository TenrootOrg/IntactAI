title: Suspicious mshta child process
id: 60023bb6-5500-11eb-ae93-0242ac130002
status: experimental
description: The following analytic identifies child processes spawned from "mshta.exe". It leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on specific child processes like "powershell.exe" and "cmd.exe". This activity is significant
  because "mshta.exe" is often exploited by attackers to execute malicious scripts or commands. If confirmed malicious, this
  behavior could allow an attacker to execute arbitrary code, escalate privileges, or maintain persistence within the environment.
  Monitoring this activity helps in early detection of potential threats leveraging "mshta.exe" for malicious purposes.
references:
- https://research.splunk.com/60023bb6-5500-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Michael Haag, Teoderick Contreras Splunk
tags:
- attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\mshta.exe'
  sel2:
    Image:
    - '*\\powershell.exe'
    - '*\\colorcpl.exe'
    - '*\\msbuild.exe'
    - '*\\microsoft.workflow.compiler.exe'
    - '*\\searchprotocolhost.exe'
    - '*\\scrcons.exe'
    - '*\\cscript.exe'
    - '*\\wscript.exe'
    - '*\\cmd.exe'
    - '*\\bitsadmin.exe'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.005/atomic_red_team/windows-sysmon.log
