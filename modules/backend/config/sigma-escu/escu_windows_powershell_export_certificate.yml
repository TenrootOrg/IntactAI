title: Windows PowerShell Export Certificate
id: 5e38ded4-c964-41f4-8cb6-4a1a53c6929f
status: experimental
description: The following analytic detects the use of the PowerShell Cmdlet `export-certificate` by leveraging Script Block
  Logging. This activity is significant as it may indicate an adversary attempting to exfiltrate certificates from the local
  Certificate Store on a Windows endpoint. Monitoring this behavior is crucial because stolen certificates can be used to
  impersonate users, decrypt sensitive data, or facilitate further attacks. If confirmed malicious, this activity could lead
  to unauthorized access to encrypted communications and sensitive information, posing a severe security risk.
references:
- https://research.splunk.com/5e38ded4-c964-41f4-8cb6-4a1a53c6929f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1552.004
- attack.t1649
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*export-certificate*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1649/atomic_red_team/4104_export_certificate.log
