title: Interactive Session on Remote Endpoint with PowerShell
id: a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af
status: experimental
description: The following analytic detects the use of the `Enter-PSSession` cmdlet to establish an interactive session on
  a remote endpoint via the WinRM protocol. It leverages PowerShell Script Block Logging (EventCode=4104) to identify this
  activity by searching for specific script block text patterns. This behavior is significant as it may indicate lateral movement
  or remote code execution attempts by adversaries. If confirmed malicious, this activity could allow attackers to execute
  commands remotely, potentially leading to further compromise of the network and unauthorized access to sensitive information.
references:
- https://research.splunk.com/a4e8f3a4-48b2-11ec-bcfc-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1021.006
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Enter-PSSession*'
  sel3:
    ScriptBlockText: '*-ComputerName*'
  condition: (sel1 and (sel2 and sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.006/lateral_movement_pssession/windows-powershell-xml.log
