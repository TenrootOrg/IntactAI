title: Windows Rundll32 Load DLL in Temp Dir
id: 520da6fa-7d5d-4a3b-9c61-1087517b8d0f
status: experimental
description: This detection identifies instances where rundll32.exe is used to load a DLL from a temporary directory, such
  as C:\Users\<User>\AppData\Local\Temp\ or C:\Windows\Temp\. While rundll32.exe is a legitimate Windows utility used to execute
  functions exported from DLLs, its use to load libraries from temporary locations is highly suspicious. These directories
  are commonly used by malware and red team tools to stage payloads or execute code in-memory without writing it to more persistent
  locations. This behavior often indicates defense evasion, initial access, or privilege escalation, especially when the DLL
  is unsigned, recently written, or executed shortly after download. In normal user workflows, DLLs are not typically loaded
  from Temp paths, making this a high-fidelity indicator of potentially malicious activity. Monitoring this pattern is essential
  for detecting threats that attempt to blend in with native system processes while bypassing traditional application controls.
references:
- https://research.splunk.com/520da6fa-7d5d-4a3b-9c61-1087517b8d0f/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rundll32.exe'
  sel2:
    OriginalFileName: RUNDLL32.EXE
  sel3:
    CommandLine:
    - '*temp\\*'
    - '*\\tmp\\*'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.011/rundll32_dll_in_temp/rundll32_tmp.log
