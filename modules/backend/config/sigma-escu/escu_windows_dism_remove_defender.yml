title: Windows DISM Remove Defender
id: 8567da9e-47f0-11ec-99a9-acde48001122
status: experimental
description: The following analytic detects the use of `dism.exe` to remove Windows Defender. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on command-line executions that include specific parameters for disabling
  and removing Windows Defender. This activity is significant because adversaries may disable Defender to evade detection
  and carry out further malicious actions undetected. If confirmed malicious, this could lead to the attacker gaining persistent
  access, executing additional payloads, or exfiltrating sensitive data without being intercepted by Windows Defender.
references:
- https://research.splunk.com/8567da9e-47f0-11ec-99a9-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\dism.exe'
  sel2:
    CommandLine: '*/online*'
  sel3:
    CommandLine: '*/disable-feature*'
  sel4:
    CommandLine: '*Windows-Defender*'
  sel5:
    CommandLine: '*/remove*'
  condition: (sel1 and (sel2 and sel3 and sel4 and sel5))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/atomic_red_team/windows-sysmon_dism.log
