title: Suspicious SearchProtocolHost no Command Line Arguments
id: f52d2db8-31f9-4aa7-a176-25779effe55c
status: experimental
description: 'The following analytic detects instances of searchprotocolhost.exe running without command line arguments.

  This behavior is unusual and often associated with malicious activities, such as those performed by Cobalt Strike.

  The detection leverages Endpoint Detection and Response (EDR) telemetry, focusing on process execution data.

  This activity is significant because searchprotocolhost.exe typically runs with specific arguments, and its absence may
  indicate an attempt to evade detection.

  If confirmed malicious, this could lead to unauthorized code execution, potential credential dumping, or other malicious
  actions within the environment.'
references:
- https://research.splunk.com/f52d2db8-31f9-4aa7-a176-25779effe55c/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\searchprotocolhost.exe'
  sel2:
    OriginalFileName: searchprotocolhost.exe
  sel3:
    CommandLine:
    - '*searchprotocolhost'
    - '*searchprotocolhost.exe'
    - '*searchprotocolhost.exe"'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1055/cobalt_strike/windows-sysmon.log
