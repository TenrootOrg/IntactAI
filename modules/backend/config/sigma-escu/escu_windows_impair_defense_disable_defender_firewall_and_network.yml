title: Windows Impair Defense Disable Defender Firewall And Network
id: 8467d8cd-b0f9-46fa-ac84-a30ad138983e
status: experimental
description: The following analytic detects modifications in the Windows registry to disable firewall and network protection
  settings within Windows Defender Security Center. It leverages data from the Endpoint.Registry data model, specifically
  monitoring changes to the UILockdown registry value. This activity is significant as it may indicate an attempt to impair
  system defenses, potentially restricting users from modifying firewall or network protection settings. If confirmed malicious,
  this could allow an attacker to weaken the system's security posture, making it more vulnerable to further attacks and unauthorized
  access.
references:
- https://research.splunk.com/8467d8cd-b0f9-46fa-ac84-a30ad138983e/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows Defender Security Center\\Firewall and network protection\\UILockdown'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable-windows-security-defender-features/windefender-bypas-2-sysmon.log
