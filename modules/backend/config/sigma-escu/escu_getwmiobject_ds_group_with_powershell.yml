title: GetWmiObject Ds Group with PowerShell
id: df275a44-4527-443b-b884-7600e066e3eb
status: experimental
description: 'The following analytic identifies the execution of `powershell.exe` with command-line arguments used to query
  domain groups via the `Get-WmiObject` cmdlet and the `-class ds_group` parameter.

  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line
  executions.

  This activity is significant as it indicates potential reconnaissance efforts by adversaries to enumerate domain groups,
  which is a common step in Active Directory Discovery.

  If confirmed malicious, this could allow attackers to gain insights into the domain structure, aiding in further attacks
  and privilege escalation.'
references:
- https://research.splunk.com/df275a44-4527-443b-b884-7600e066e3eb/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1069.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    Image: '*\\cmd.exe'
  sel8:
    OriginalFileName: Cmd.Exe
  sel9:
    CommandLine: '*Get-WmiObject*'
  sel10:
    CommandLine: '*namespace *'
  sel11:
    CommandLine: '* root\\directory\\ldap*'
  sel12:
    CommandLine: '* ds_group*'
  sel13:
    CommandLine: '*class *'
  condition: (((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) or (sel7 or sel8)) and sel9 and sel10 and sel11 and
    sel12 and sel13)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1069.002/AD_discovery/windows-sysmon.log
