title: Windows Service Initiation on Remote Endpoint
id: 3f519894-4276-11ec-ab02-3e22fbd008af
status: experimental
description: The following analytic detects the execution of `sc.exe` with command-line arguments used to start a Windows
  Service on a remote endpoint. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names
  and command-line executions. This activity is significant because adversaries may exploit the Service Control Manager for
  lateral movement and remote code execution. If confirmed malicious, this could allow attackers to execute arbitrary code
  on remote systems, potentially leading to further compromise and persistence within the network.
references:
- https://research.splunk.com/3f519894-4276-11ec-ab02-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sc.exe'
  sel2:
    OriginalFileName: sc.exe
  sel3:
    CommandLine: '*\\\\*'
  sel4:
    CommandLine: '*start*'
  condition: ((sel1 or sel2) and (sel3 and sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1543.003/lateral_movement/windows-sysmon.log
