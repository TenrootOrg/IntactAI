title: Wscript Or Cscript Suspicious Child Process
id: 1f35e1da-267b-11ec-90a9-acde48001122
status: experimental
description: This analytic identifies a suspicious spawned process by WScript or CScript process. This technique was a common
  technique used by adversaries and malware to execute different LOLBIN, other scripts like PowerShell or spawn a suspended
  process to inject its code as a defense evasion. This TTP may detect some normal script that uses several application tools
  that are in the list of the child process it detects but a good pivot and indicator that a script may execute suspicious
  code.
references:
- https://research.splunk.com/1f35e1da-267b-11ec-90a9-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1055
- attack.t1134.004
- attack.t1543
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage:
    - '*\\cscript.exe'
    - '*\\wscript.exe'
  sel2:
    Image:
    - '*\\regsvr32.exe'
    - '*\\rundll32.exe'
    - '*\\winhlp32.exe'
    - '*\\certutil.exe'
    - '*\\msbuild.exe'
    - '*\\cmd.exe'
    - '*\\powershell*'
    - '*\\pwsh.exe'
    - '*\\wmic.exe'
    - '*\\mshta.exe'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.005/vbs_wscript/sysmon.log
