title: Linux Gdrive Binary Activity
id: a42f8029-5472-4c33-8943-bb17bb07466a
status: experimental
description: The following analytic detects the execution of the 'gdrive' tool on a Linux host. This tool allows standard
  users to perform tasks associated with Google Drive via the command line. This is used by actors to stage tools as well
  as exfiltrate data. The detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process
  names and command-line executions. If confirmed malicious, this could lead to compromise of systems or sensitive data being
  stolen.
references:
- https://research.splunk.com/a42f8029-5472-4c33-8943-bb17bb07466a/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1567
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/gdrive'
  sel2:
    CommandLine:
    - '* download *'
    - '* upload *'
    - '* list*'
    - '* update *'
    - '* sync *'
    - '* share *'
    - '* account add*'
    - '* drives *'
    - '* files *'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1567/gdrive/gdrive_linux.log
