title: Suspicious MSBuild Spawn
id: a115fba6-5514-11eb-ae93-0242ac130002
status: experimental
description: The following analytic identifies instances where wmiprvse.exe spawns msbuild.exe, which is unusual and indicative
  of potential misuse of a COM object. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process relationships and command-line executions. This activity is significant because msbuild.exe is typically spawned
  by devenv.exe during legitimate Visual Studio use, not by wmiprvse.exe. If confirmed malicious, this behavior could indicate
  an attacker executing arbitrary code or scripts, potentially leading to system compromise or further malicious activities.
references:
- https://research.splunk.com/a115fba6-5514-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1127.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\wmiprvse.exe'
  sel2:
    Image: '*\\msbuild.exe'
  sel3:
    OriginalFileName: MSBuild.exe
  condition: (sel1 and (sel2 or sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1127.001/windows-sysmon.log
