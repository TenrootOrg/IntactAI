title: Confluence Data Center and Server Privilege Escalation
id: 115bebac-0976-4f7d-a3ec-d1fb45a39a11
status: experimental
description: The following analytic identifies potential exploitation attempts on a known vulnerability in Atlassian Confluence,
  specifically targeting the /setup/*.action* URL pattern. It leverages web logs within the Splunk 'Web' Data Model, filtering
  for successful accesses (HTTP status 200) to these endpoints. This activity is significant as it suggests attackers might
  be exploiting a privilege escalation flaw in Confluence. If confirmed malicious, it could result in unauthorized access
  or account creation with escalated privileges, leading to potential data breaches or further exploitation within the environment.
references:
- https://research.splunk.com/115bebac-0976-4f7d-a3ec-d1fb45a39a11/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri:
    - '*/setup/setupadministrator.action*'
    - '*/setup/finishsetup.action*'
    - '*/json/setup-restore-local.action*'
    - '*/json/setup-restore-progress.action*'
    - '*/json/setup-restore.action*'
    - '*/bootstrap/selectsetupstep.action*'
  sel2:
    sc-status: '200'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/confluence/nginx_plus_kv_confluence.log
