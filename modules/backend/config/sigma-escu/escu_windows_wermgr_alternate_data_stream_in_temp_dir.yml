title: Windows Wermgr Alternate Data Stream in Temp Dir
id: 65222e9b-9d0b-4bfe-8da1-199b98e1d44a
status: experimental
description: 'The following analytic detects the wermgr.exe process creating an alternate stream in the temp directory. It
  leverages Sysmon EventID 15 to identify these actions.

  This activity is significant because wermgr.exe is typically associated with error reporting, not file creation. Such activity
  is significant as it may indicate RoguePlanet malware, which creates an alternate stream in the temp directory to execute
  malicious code.

  If confirmed malicious, this could lead to further malware infections, data exfiltration, or system compromise.'
references:
- https://research.splunk.com/65222e9b-9d0b-4bfe-8da1-199b98e1d44a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1564.004
logsource:
  product: windows
  service: sysmon
  category: create_stream_hash
detection:
  sel1:
    EventID: '15'
  sel2:
    TargetFilename: '*\\Temp\\*'
  sel3:
    TargetFilename: '*\\wermgr.exe:*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1564.004/rogueplanet/rogue_15.log
