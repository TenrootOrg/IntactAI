title: Socat Remote TCP Connection with Local Echo Disabled
id: 458c6c37-116d-4f01-8267-f09f5b82cd14
status: experimental
description: 'The following analytic detects execution of the socat utility with a remote TCP or OpenSSL connection and local
  terminal echo disabled.

  This configuration may be used for interactive terminal sessions, password handling, automation, or network debugging.

  When observed in an unexpected context, such as execution by an unusual parent process or connection to an untrusted endpoint,
  it may indicate suspicious remote access activity.'
references:
- https://research.splunk.com/458c6c37-116d-4f01-8267-f09f5b82cd14/
author: Splunk Security Content (Apache-2.0), Maria Jose Erquiaga, Splunk
tags:
- attack.t1059
- attack.t1572
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/socat*'
  sel2:
    CommandLine: '*echo=0*'
  sel3:
    CommandLine:
    - '*openssl:*'
    - '*tcp:*'
    - '*tcp4:*'
    - '*tcp6:*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059/utility_socat_remote_tcp_connection_with_echo_disabled/osquery.log
