title: GCP Authentication Failed During MFA Challenge
id: 345f7e1d-a3fe-4158-abd8-e630f9878323
status: experimental
description: The following analytic detects failed authentication attempts during the Multi-Factor Authentication (MFA) challenge
  on a Google Cloud Platform (GCP) tenant. It uses Google Workspace login failure events to identify instances where MFA methods
  were challenged but not successfully completed. This activity is significant as it may indicate an adversary attempting
  to access an account with compromised credentials despite MFA protection. If confirmed malicious, this could lead to unauthorized
  access attempts, potentially compromising sensitive data and resources within the GCP environment.
references:
- https://research.splunk.com/345f7e1d-a3fe-4158-abd8-e630f9878323/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Mauricio Velazco, Splunk
tags:
- attack.t1078.004
- attack.t1586.003
- attack.t1621
logsource:
  product: google_workspace
  service: google_workspace.admin
detection:
  sel1:
    event.name: login_failure
  sel2:
    login_challenge_method:
    - '*backup_code*'
    - '*google_authenticator*'
    - '*google_prompt*'
    - '*idv_any_phone*'
    - '*idv_preregistered_phone*'
    - '*internal_two_factor*'
    - '*knowledge_employee_id*'
    - '*knowledge_preregistered_email*'
    - '*login_location*'
    - '*knowledge_preregistered_phone*'
    - '*offline_otp*'
    - '*security_key*'
    - '*security_key_otp*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1621/gcp_failed_mfa/gws_login.log
