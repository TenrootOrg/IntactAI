title: Remote Process Instantiation via WMI
id: d25d2c3d-d9d8-40ec-8fdf-e86fe155a3da
status: experimental
description: The following analytic detects the execution of wmic.exe with parameters to spawn a process on a remote system.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions and process telemetry
  mapped to the `Processes` node of the `Endpoint` data model. This activity is significant as WMI can be abused for lateral
  movement and remote code execution, often used by adversaries and Red Teams. If confirmed malicious, this could allow attackers
  to execute arbitrary code on remote systems, facilitating further compromise and lateral spread within the network.
references:
- https://research.splunk.com/d25d2c3d-d9d8-40ec-8fdf-e86fe155a3da/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\wmic.exe'
  sel2:
    OriginalFileName: wmic.exe
  sel3:
    CommandLine: '*/node:*'
  sel4:
    CommandLine: '*process*'
  sel5:
    CommandLine: '*call*'
  sel6:
    CommandLine: '*create*'
  condition: ((sel1 or sel2) and (sel3 and sel4 and sel5 and sel6))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1047/atomic_red_team/windows-sysmon.log
