title: Powershell Defender Threat Actions Set to Allow
id: 7dd3ced1-dc48-4998-9bc2-57e6ae5efaa7
status: experimental
description: The following analytic detects the setting of the Windows Defender Threat Actions to allow. It leverages data
  from the Endpoint.Processes data model, specifically monitoring the execution of the `Set-MpPreference` cmdlet with the
  `-HighThreatDefaultAction`, `-ModerateThreatDefaultAction`, `-LowThreatDefaultAction`, and `-SevereThreatDefaultAction`
  parameters set to `6`. This activity is significant because it is commonly used by malware such as RATs, bots, or Trojans
  to evade detection by allowing threats to pass through the Windows Defender antivirus engine. If confirmed malicious, this
  action could allow an attacker to execute malicious code without being detected by Windows Defender, leading to potential
  data exfiltration, further system compromise, or persistent access within the environment.
references:
- https://research.splunk.com/7dd3ced1-dc48-4998-9bc2-57e6ae5efaa7/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    CommandLine: '*Set-MpPreference*'
  sel8:
    CommandLine:
    - '*-HighThreatDefaultAction*'
    - '*-ModerateThreatDefaultAction*'
    - '*-LowThreatDefaultAction*'
    - '*-SevereThreatDefaultAction*'
  sel9:
    CommandLine: '* 6*'
  condition: ((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) and sel7 and (sel8 and sel9))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/threat_allow_switch/threat_allow_salat.log
