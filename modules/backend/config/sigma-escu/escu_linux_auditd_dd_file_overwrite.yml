title: Linux Auditd Dd File Overwrite
id: d1b74420-4cea-4752-a123-9b40dfcca49a
status: experimental
description: The following analytic detects the use of the 'dd' command to overwrite files on a Linux system. It leverages
  data from Linux Auditd telemetry, focusing on process execution logs that include command-line details. This activity is
  significant because adversaries often use the 'dd' command to destroy or irreversibly overwrite files, disrupting system
  availability and services. If confirmed malicious, this behavior could lead to data destruction, making recovery difficult
  and potentially causing significant operational disruptions.
references:
- https://research.splunk.com/d1b74420-4cea-4752-a123-9b40dfcca49a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1485
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle: '*dd *'
  sel2:
    proctitle: '*of=*'
  sel3:
    proctitle: '*if=/dev/zero*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1485/linux_auditd_dd_overwrite/auditd_proctitle_dd_overwrite.log
