title: Windows Modify Registry ProxyEnable
id: b27f20bd-ef20-41d1-a1e9-25dedd5bf2f5
status: experimental
description: The following analytic detects modifications to the Windows registry key "ProxyEnable" to enable proxy settings.
  It leverages data from the Endpoint.Registry datamodel, specifically monitoring changes to the "Internet Settings\ProxyEnable"
  registry path. This activity is significant as it is commonly exploited by malware and adversaries to establish proxy communication,
  potentially connecting to malicious Command and Control (C2) servers. If confirmed malicious, this could allow attackers
  to redirect network traffic through a proxy, facilitating unauthorized communication and data exfiltration, thereby compromising
  the security of the affected host.
references:
- https://research.splunk.com/b27f20bd-ef20-41d1-a1e9-25dedd5bf2f5/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Internet Settings\\ProxyEnable'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1112/proxy_enable/proxyenable.log
