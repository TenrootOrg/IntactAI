title: Impacket Lateral Movement WMIExec Commandline Parameters
id: d6e464e4-5c6a-474e-82d2-aed616a3a492
status: experimental
description: The following analytic detects the use of Impacket's `wmiexec.py` tool for lateral movement by identifying specific
  command-line parameters. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on processes spawned
  by `wmiprvse.exe` with command-line patterns indicative of Impacket usage. This activity is significant as Impacket tools
  are commonly used by adversaries for remote code execution and lateral movement within a network. If confirmed malicious,
  this could allow attackers to execute arbitrary commands on remote systems, potentially leading to further compromise and
  data exfiltration.
references:
- https://research.splunk.com/d6e464e4-5c6a-474e-82d2-aed616a3a492/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1021.002
- attack.t1021.003
- attack.t1047
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\wmiprvse.exe'
  sel2:
    CommandLine|re: (?i)cmd\.exe\s+\/Q\s+\/c
  sel3:
    CommandLine|re: \\127\.0\.0\.1\.*
  sel4:
    CommandLine|re: __\d{1,10}\.\d{1,10}
  condition: (sel1 and sel2 and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.002/atomic_red_team/wmiexec_windows-sysmon.log
