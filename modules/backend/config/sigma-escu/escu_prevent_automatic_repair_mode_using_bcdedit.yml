title: Prevent Automatic Repair Mode using Bcdedit
id: 7742aa92-c9d9-11eb-bbfc-acde48001122
status: experimental
description: The following analytic detects the execution of "bcdedit.exe" with parameters to set the boot status policy to
  ignore all failures. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and
  command-line arguments. This activity is significant because it can indicate an attempt by ransomware to prevent a compromised
  machine from booting into automatic repair mode, thereby hindering recovery efforts. If confirmed malicious, this action
  could allow attackers to maintain control over the infected system, complicating remediation and potentially leading to
  further damage.
references:
- https://research.splunk.com/7742aa92-c9d9-11eb-bbfc-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\bcdedit.exe'
  sel2:
    CommandLine: '*bootstatuspolicy*'
  sel3:
    CommandLine: '*ignoreallfailures*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/ransomware_ttp/data1/windows-sysmon.log
