title: Windows Multi hop Proxy TOR Website Query
id: 4c2d198b-da58-48d7-ba27-9368732d0054
status: experimental
description: The following analytic identifies DNS queries to known TOR proxy websites, such as "*.torproject.org" and "www.theonionrouter.com".
  It leverages Sysmon EventCode 22 to detect these queries by monitoring DNS query events from endpoints. This activity is
  significant because adversaries often use TOR proxies to disguise the source of their malicious traffic, making it harder
  to trace their actions. If confirmed malicious, this behavior could indicate an attempt to obfuscate network traffic, potentially
  allowing attackers to exfiltrate data or communicate with command and control servers undetected.
references:
- https://research.splunk.com/4c2d198b-da58-48d7-ba27-9368732d0054/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1071.003
logsource:
  product: windows
  service: sysmon
  category: dns_query
detection:
  sel1:
    EventID: '22'
  sel2:
    QueryName:
    - '*.torproject.org'
    - www.theonionrouter.com
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/agent_tesla/agent_tesla_tor_dns_query/sysmon.log
