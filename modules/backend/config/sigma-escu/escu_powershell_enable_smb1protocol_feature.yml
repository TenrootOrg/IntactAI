title: Powershell Enable SMB1Protocol Feature
id: afed80b2-d34b-11eb-a952-acde48001122
status: experimental
description: The following analytic detects the enabling of the SMB1 protocol via `powershell.exe`. It leverages PowerShell
  script block logging (EventCode 4104) to identify the execution of the `Enable-WindowsOptionalFeature` cmdlet with the `SMB1Protocol`
  parameter. This activity is significant because enabling SMB1 can facilitate lateral movement and file encryption by ransomware,
  such as RedDot. If confirmed malicious, this action could allow an attacker to propagate through the network, encrypt files,
  and potentially disrupt business operations.
references:
- https://research.splunk.com/afed80b2-d34b-11eb-a952-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1027.005
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Enable-WindowsOptionalFeature*'
  sel3:
    ScriptBlockText: '*SMB1Protocol*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
