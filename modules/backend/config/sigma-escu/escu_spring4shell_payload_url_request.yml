title: Spring4Shell Payload URL Request
id: 9d44d649-7d67-4559-95c1-8022ff49420b
status: experimental
description: The following analytic detects attempts to exploit the Spring4Shell vulnerability (CVE-2022-22963) by identifying
  specific URL patterns associated with web shell payloads. It leverages web traffic data, focusing on HTTP GET requests with
  URLs containing indicators like "tomcatwar.jsp," "poc.jsp," and "shell.jsp." This activity is significant as it suggests
  an attacker is trying to deploy a web shell, which can lead to remote code execution. If confirmed malicious, this could
  allow the attacker to gain persistent access, execute arbitrary commands, and potentially escalate privileges within the
  compromised environment.
references:
- https://research.splunk.com/9d44d649-7d67-4559-95c1-8022ff49420b/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1133
- attack.t1190
- attack.t1505.003
logsource:
  category: web
detection:
  sel1:
    cs-method: GET
  sel2:
    c-uri:
    - '*tomcatwar.jsp*'
    - '*poc.jsp*'
    - '*shell.jsp*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/spring4shell/spring4shell_nginx.log
