title: AWS IAM Failure Group Deletion
id: 723b861a-92eb-11eb-93b8-acde48001122
status: experimental
description: The following analytic identifies failed attempts to delete AWS IAM groups. It leverages AWS CloudTrail logs
  to detect events where the DeleteGroup action fails due to errors like NoSuchEntityException, DeleteConflictException, or
  AccessDenied. This activity is significant as it may indicate unauthorized attempts to modify IAM group configurations,
  which could be a precursor to privilege escalation or other malicious actions. If confirmed malicious, this could allow
  an attacker to disrupt IAM policies, potentially leading to unauthorized access or denial of service within the AWS environment.
references:
- https://research.splunk.com/723b861a-92eb-11eb-93b8-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventSource: iam.amazonaws.com
  sel2:
    eventName: DeleteGroup
  sel3:
    errorCode:
    - NoSuchEntityException
    - DeleteConflictException
    - AccessDenied
  sel4:
    userAgent: '*.amazonaws.com'
  condition: (sel1 and sel2 and sel3 and not sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098/aws_iam_failure_group_deletion/aws_iam_failure_group_deletion.json
