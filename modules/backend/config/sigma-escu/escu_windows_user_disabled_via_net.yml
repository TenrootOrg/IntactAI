title: Windows User Disabled Via Net
id: b0359e05-c87b-4354-83d8-aee0d890243f
status: experimental
description: The following analytic detects the use of the `net.exe` utility to disable a user account via the command line.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs and command-line
  arguments. This activity is significant as it may indicate an adversary's attempt to disrupt user availability, potentially
  as a precursor to further malicious actions. If confirmed malicious, this could lead to denial of service for legitimate
  users, aiding the attacker in maintaining control or covering their tracks.
references:
- https://research.splunk.com/b0359e05-c87b-4354-83d8-aee0d890243f/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1531
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    CommandLine: '*user*'
  sel4:
    CommandLine: '*/active:no*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/xmrig_miner/windows-sysmon.log
