title: AWS Exfiltration via Batch Service
id: 04455dd3-ced7-480f-b8e6-5469b99e98e2
status: experimental
description: The following analytic identifies the creation of AWS Batch jobs that could potentially abuse the AWS Bucket
  Replication feature on S3 buckets. It leverages AWS CloudTrail logs to detect the `JobCreated` event, analyzing job details
  and their status. This activity is significant because attackers can exploit this feature to exfiltrate data by creating
  malicious batch jobs. If confirmed malicious, this could lead to unauthorized data transfer between S3 buckets, resulting
  in data breaches and loss of sensitive information.
references:
- https://research.splunk.com/04455dd3-ced7-480f-b8e6-5469b99e98e2/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1119
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: JobCreated
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1119/aws_exfil_datasync/cloudtrail.json
