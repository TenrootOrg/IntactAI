title: Cisco Secure Firewall - Connection to File Sharing Domain
id: f7e5e792-d907-46c1-a58e-4ff974dc462a
status: experimental
description: The following analytic detects outbound connections to commonly abused file sharing and pastebin-style hosting
  domains. It leverages Cisco Secure Firewall Threat Defense logs and focuses on allowed connections (action=Allow) where
  the url field matches a list of known data hosting or temporary storage services. While many of these platforms serve legitimate
  purposes, they are frequently leveraged by adversaries for malware delivery, data exfiltration, command and control (C2)
  beacons, or staging of encoded payloads. This analytic is valuable for identifying potential abuse of legitimate infrastructure
  as part of an attacker's kill chain. If confirmed malicious, this activity may indicate tool staging, credential dumping,
  or outbound data leaks over HTTP(S).
references:
- https://research.splunk.com/f7e5e792-d907-46c1-a58e-4ff974dc462a/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1071.001
- attack.t1090.002
- attack.t1105
- attack.t1567.002
- attack.t1588.002
logsource:
  product: cisco
  service: secure_firewall
detection:
  sel1:
    AC_RuleAction:
    - Trust
    - Allow
    - allowed
  sel2:
    EventType: ConnectionEvent
  sel3:
    URL:
    - '*//objects.githubusercontent.com*'
    - '*anonfiles.com*'
    - '*cdn.discordapp.com*'
    - '*ddns.net*'
    - '*dl.dropboxusercontent.com*'
    - '*ghostbin.co*'
    - '*glitch.me*'
    - '*gofile.io*'
    - '*hastebin.com*'
    - '*mediafire.com*'
    - '*mega.nz*'
    - '*onrender.com*'
    - '*pages.dev*'
    - '*paste.ee*'
    - '*pastebin.com*'
    - '*pastebin.pl*'
    - '*pastetext.net*'
    - '*privatlab.com*'
    - '*privatlab.net*'
    - '*send.exploit.in*'
    - '*sendspace.com*'
    - '*storage.googleapis.com*'
    - '*storjshare.io*'
    - '*supabase.co*'
    - '*temp.sh*'
    - '*transfer.sh*'
    - '*trycloudflare.com*'
    - '*ufile.io*'
    - '*w3spaces.com*'
    - '*workers.dev*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_firewall_threat_defense/connection_event/connection_events.log
