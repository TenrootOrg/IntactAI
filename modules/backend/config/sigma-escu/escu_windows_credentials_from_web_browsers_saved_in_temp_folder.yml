title: Windows Credentials from Web Browsers Saved in TEMP Folder
id: b36b23ea-763c-417b-bd4a-6a378dabad1a
status: experimental
description: The following analytic detects the creation of files containing passwords, cookies, and saved login account information
  by the Braodo stealer malware in temporary folders. Braodo often collects these credentials from browsers and applications,
  storing them in temp directories before exfiltration. This detection focuses on monitoring for the creation of files with
  patterns or formats commonly associated with stolen credentials. By identifying these activities, security teams can take
  needed action to prevent sensitive login data from being leaked, reducing the risk of unauthorized access to user accounts
  and systems.
references:
- https://research.splunk.com/b36b23ea-763c-417b-bd4a-6a378dabad1a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555.003
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*\\login*'
    - '*\\pass*'
    - '*\\cookie*'
    - '*\\master_key*'
  sel2:
    TargetFilename: '*\\temp\\*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.003/browser_credential_info_temp/braodo_browser_info.log
