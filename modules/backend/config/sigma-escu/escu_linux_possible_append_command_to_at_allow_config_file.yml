title: Linux Possible Append Command To At Allow Config File
id: 7bc20606-5f40-11ec-a586-acde48001122
status: experimental
description: The following analytic detects suspicious command lines that append user entries to /etc/at.allow or /etc/at.deny
  files. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions involving
  these files. This activity is significant because altering these configuration files can allow attackers to schedule tasks
  with elevated permissions, facilitating persistence on a compromised Linux host. If confirmed malicious, this could enable
  attackers to execute arbitrary code at scheduled intervals, potentially leading to further system compromise and unauthorized
  access to sensitive information.
references:
- https://research.splunk.com/7bc20606-5f40-11ec-a586-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1053.002
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*echo*'
  sel2:
    CommandLine:
    - '*/etc/at.allow'
    - '*/etc/at.deny'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.002/at_execution/sysmon_linux.log
