title: Windows Execute Arbitrary Commands with MSDT
id: e1d5145f-38fe-42b9-a5d5-457796715f97
status: experimental
description: The following analytic detects arbitrary command execution using Windows msdt.exe, a Diagnostics Troubleshooting
  Wizard. It leverages Endpoint Detection and Response (EDR) data to identify instances where msdt.exe is invoked via the
  ms-msdt:/ protocol handler to retrieve a remote payload. This activity is significant as it can indicate an exploitation
  attempt leveraging msdt.exe to execute arbitrary commands, potentially leading to unauthorized code execution. If confirmed
  malicious, this could allow an attacker to execute arbitrary code, escalate privileges, or persist within the environment,
  posing a severe security risk.
references:
- https://research.splunk.com/e1d5145f-38fe-42b9-a5d5-457796715f97/
author: Splunk Security Content (Apache-2.0), Michael Haag, Teoderick Contreras, Splunk
tags:
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\msdt.exe'
  sel2:
    CommandLine:
    - '*msdt*'
    - '*ms-msdt:*'
    - '*ms-msdt:/id*'
    - '*ms-msdt:-id*'
    - '*/id*'
  sel3:
    CommandLine: '*IT_BrowseForFile=*'
  sel4:
    CommandLine: '*IT_RebrowseForFile=*'
  sel5:
    CommandLine: '*.xml*'
  sel6:
    CommandLine: '*PCWDiagnostic*'
  condition: (sel1 and sel2 and ((sel3 or sel4) or sel5) and sel6)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566.001/macro/msdt.log
