title: Malicious InProcServer32 Modification
id: 127c8d08-25ff-11ec-9223-acde48001122
status: experimental
description: The following analytic detects a process modifying the registry with a known malicious CLSID under InProcServer32.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on registry modifications within the HKLM
  or HKCU Software Classes CLSID paths. This activity is significant as it may indicate an attempt to load a malicious DLL,
  potentially leading to code execution. If confirmed malicious, this could allow an attacker to persist in the environment,
  execute arbitrary code, or escalate privileges, posing a severe threat to system integrity and security.
references:
- https://research.splunk.com/127c8d08-25ff-11ec-9223-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.010
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\CLSID\\{89565275-A714-4a43-912E-978B935EDCCC}\\InProcServer32\\(Default)'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
