title: AWS Bedrock Invoke Model Access Denied
id: c53a8e62-f741-11ee-9f6e-acde48001122
status: experimental
description: The following analytic identifies access denied error when attempting to invoke AWS Bedrock models. It leverages
  AWS CloudTrail logs to detect when a user or service receives an AccessDenied error when calling the InvokeModel API. This
  activity is significant as it may indicate an adversary attempting to access Bedrock models with insufficient permissions
  after compromising credentials. If confirmed malicious, this could suggest reconnaissance activities or privilege escalation
  attempts targeting generative AI resources, potentially leading to data exfiltration or manipulation of model outputs.
references:
- https://research.splunk.com/c53a8e62-f741-11ee-9f6e-acde48001122/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1078
- attack.t1550
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventSource: bedrock.amazonaws.com
  sel2:
    eventName: InvokeModel
  sel3:
    errorCode: AccessDenied
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.004/aws_invoke_model_access_denied/cloudtrail.json
