title: PowerShell Start-BitsTransfer
id: 39e2605a-90d8-11eb-899e-acde48001122
status: experimental
description: The following analytic detects the execution of the PowerShell command `Start-BitsTransfer`, which can be used
  for file transfers, including potential data exfiltration. It leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on process creation events and command-line arguments. This activity is significant because `Start-BitsTransfer`
  can be abused by adversaries to upload sensitive files to remote locations, posing a risk of data loss. If confirmed malicious,
  this could lead to unauthorized data exfiltration, compromising sensitive information and potentially leading to further
  exploitation of the network.
references:
- https://research.splunk.com/39e2605a-90d8-11eb-899e-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1197
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    CommandLine: '*start-bitstransfer*'
  condition: ((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) and sel7)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1197/atomic_red_team/windows-sysmon.log
