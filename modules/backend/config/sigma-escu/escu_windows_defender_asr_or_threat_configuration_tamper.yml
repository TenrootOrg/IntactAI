title: Windows Defender ASR or Threat Configuration Tamper
id: d0c07718-19d1-4de2-aea9-e0ffff0ed986
status: experimental
description: 'The following analytic detects the use of commands to disable Attack Surface Reduction (ASR) rules or change
  threat default actions in Windows Defender.

  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions involving "Add-MpPreference"
  or "Set-MpPreference".

  This activity is significant because adversaries often use it to bypass Windows Defender, allowing malicious code to execute
  undetected.

  If confirmed malicious, this behavior could enable attackers to evade antivirus detection, maintain persistence, and execute
  further malicious activities without interference from Windows Defender.'
references:
- https://research.splunk.com/d0c07718-19d1-4de2-aea9-e0ffff0ed986/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine:
    - '*Add-MpPreference *'
    - '*Set-MpPreference *'
  sel2:
    CommandLine:
    - '*-AttackSurfaceReductionRules_Actions*'
    - '*-ThreatIDDefaultAction_Actions*'
  sel3:
    CommandLine:
    - '*Allow*'
    - '*NoAction*'
    - '*Disabled*'
    - '*_Actions 6*'
    - '*_Actions 9*'
    - '*_Actions 0*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable_defender_asr_or_threats/disable_defender_asr_or_threats.log
