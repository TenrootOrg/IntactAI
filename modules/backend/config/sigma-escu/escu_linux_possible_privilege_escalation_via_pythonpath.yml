title: Linux Possible Privilege Escalation via PYTHONPATH
id: 5edda575-409a-4820-a048-5780796a181e
status: experimental
description: 'The following analytic detects the creation of a malicious shared object at a Python importlib path outside
  the standard system library directories, a technique used to abuse PYTHONPATH for local privilege escalation.

  Attackers exploiting vulnerabilities such as the 2024 NeedRestart flaw (CVE-2024-48990) plant a crafted importlib/__init__.so
  in an attacker-controlled directory, then manipulate the PYTHONPATH environment variable so that a privileged process, such
  as NeedRestart running as root, loads the rogue module instead of the legitimate one, achieving code execution with elevated
  privileges.

  The detection monitors for file writes matching the importlib/__init__.so pattern that do not originate from expected system
  library paths.'
references:
- https://research.splunk.com/5edda575-409a-4820-a048-5780796a181e/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1068
- attack.t1574.007
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename: '*/importlib/__init__.so*'
  sel2:
    TargetFilename:
    - /lib/*
    - /lib64/*
    - /usr/lib/*
    - /usr/lib64/*
    - /usr/local/lib/*
    - /usr/local/lib64/*
  condition: (sel1 and not (sel2))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1068/linux_possible_privilege_escalation_via_pythonpath/snapattack_linux.log
