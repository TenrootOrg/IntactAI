title: Linux Octave Privilege Escalation
id: 78f7487d-42ce-4f7f-8685-2159b25fb477
status: experimental
description: The following analytic detects the execution of GNU Octave with elevated privileges, specifically when it runs
  system commands via sudo. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process command-line
  arguments that include "octave-cli," "--eval," "system," and "sudo." This activity is significant because it indicates a
  potential privilege escalation attempt, allowing a user to execute commands as root. If confirmed malicious, this could
  lead to full system compromise, enabling an attacker to gain root access and execute arbitrary commands, severely impacting
  system security and integrity.
references:
- https://research.splunk.com/78f7487d-42ce-4f7f-8685-2159b25fb477/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*octave-cli*'
  sel2:
    CommandLine: '*--eval*'
  sel3:
    CommandLine: '*system*'
  sel4:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/octave/sysmon_linux.log
