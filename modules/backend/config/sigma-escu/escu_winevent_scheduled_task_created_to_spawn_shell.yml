title: WinEvent Scheduled Task Created to Spawn Shell
id: 203ef0ea-9bd8-11eb-8201-acde48001122
status: experimental
description: The following analytic detects the creation of scheduled tasks designed to execute commands using native Windows
  shells like PowerShell, Cmd, Wscript, or Cscript. It leverages Windows Security EventCode 4698 to identify when such tasks
  are registered. This activity is significant as it may indicate an attempt to establish persistence or execute malicious
  commands on a system. If confirmed malicious, this could allow an attacker to maintain access, execute arbitrary code, or
  escalate privileges, posing a severe threat to the environment.
references:
- https://research.splunk.com/203ef0ea-9bd8-11eb-8201-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4698'
  sel2:
    TaskContent:
    - '*powershell.exe*'
    - '*wscript.exe*'
    - '*cscript.exe*'
    - '*cmd.exe*'
    - '*sh.exe*'
    - '*ksh.exe*'
    - '*zsh.exe*'
    - '*bash.exe*'
    - '*scrcons.exe*'
    - '*pwsh.exe*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/winevent_scheduled_task_created_to_spawn_shell/windows-xml.log
