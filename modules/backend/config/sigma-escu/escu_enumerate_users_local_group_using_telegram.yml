title: Enumerate Users Local Group Using Telegram
id: fcd74532-ae54-11eb-a5ab-acde48001122
status: experimental
description: The following analytic detects a Telegram process enumerating all network users in a local group. It leverages
  EventCode 4798, which is generated when a process enumerates a user's security-enabled local groups on a computer or device.
  This activity is significant as it may indicate an attempt to gather information on user accounts, a common precursor to
  further malicious actions. If confirmed malicious, this behavior could allow an attacker to map out user accounts, potentially
  leading to privilege escalation or lateral movement within the network.
references:
- https://research.splunk.com/fcd74532-ae54-11eb-a5ab-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1087
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4798'
  sel2:
    CallerProcessName: '*\\telegram.exe'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087/enumerate_users_local_group_using_telegram/windows-xml.log
