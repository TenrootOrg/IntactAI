title: Windows Mimikatz Binary Execution
id: a9e0d6d3-9676-4e26-994d-4e0406bb4467
status: experimental
description: The following analytic identifies the execution of the native mimikatz.exe binary on Windows systems, including
  instances where the binary is renamed. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on
  process names and original file names. This activity is significant because Mimikatz is a widely used tool for extracting
  authentication credentials, posing a severe security risk. If confirmed malicious, this activity could allow attackers to
  obtain sensitive credentials, escalate privileges, and move laterally within the network, leading to potential data breaches
  and system compromise.
references:
- https://research.splunk.com/a9e0d6d3-9676-4e26-994d-4e0406bb4467/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\mimikatz.exe'
  sel2:
    OriginalFileName: mimikatz.exe
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003/credential_extraction/mimikatzwindows-sysmon.log
