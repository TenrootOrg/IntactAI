title: Windows Cobalt Strike PowerShell Loader
id: a6351724-06dc-42dd-939f-679add826e76
status: experimental
description: 'Detects the PowerShell pattern used at the end of a Cobalt Strike PowerShell loader to perform the decompression
  of the executable.

  This loader is used in attacks such as scripted web delivery.

  Cobalt Strike is a legitimate, commercial penetration testing tool that has been largely co-opted by ransomware gangs to
  launch attacks.

  Cobalt Strike''s popularity is mainly due to its beacons or payload being stealthy, and easily customizable.

  Cobalt Strike Beacon provides encrypted communication with the C&C server to send information and receive commands.'
references:
- https://research.splunk.com/a6351724-06dc-42dd-939f-679add826e76/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1608
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*));IEX (New-Object IO.StreamReader(New-Object IO.Compression.GzipStream($s,[IO.Compression.CompressionMode]::Decompress))).ReadToEnd();'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1608/snapattack/snapattack.log
