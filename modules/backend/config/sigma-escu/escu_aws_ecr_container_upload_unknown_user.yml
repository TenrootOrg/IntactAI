title: AWS ECR Container Upload Unknown User
id: 300688e4-365c-4486-a065-7c884462b31d
status: experimental
description: The following analytic detects the upload of a new container image to AWS Elastic Container Registry (ECR) by
  an unknown user. It leverages AWS CloudTrail logs to identify `PutImage` events from the ECR service, filtering out known
  users. This activity is significant because container uploads should typically be performed by a limited set of authorized
  users. If confirmed malicious, this could indicate unauthorized access, potentially leading to the deployment of malicious
  containers, data exfiltration, or further compromise of the AWS environment.
references:
- https://research.splunk.com/300688e4-365c-4486-a065-7c884462b31d/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1204.003
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventSource: ecr.amazonaws.com
  sel2:
    eventName: PutImage
  sel3:
    userName: user
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1204.003/aws_ecr_container_upload/aws_ecr_container_upload.json
