title: O365 Add App Role Assignment Grant User
id: b2c81cc6-6040-11eb-ae93-0242ac130002
status: experimental
description: The following analytic detects the addition of an application role assignment grant to a user in Office 365.
  It leverages data from the `o365_management_activity` dataset, specifically monitoring the "Add app role assignment grant
  to user" operation. This activity is significant as it can indicate unauthorized privilege escalation or the assignment
  of sensitive roles to users. If confirmed malicious, this could allow an attacker to gain elevated permissions, potentially
  leading to unauthorized access to critical resources and data within the Office 365 environment.
references:
- https://research.splunk.com/b2c81cc6-6040-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Rod Soto, Splunk
tags:
- attack.t1136.003
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: AzureActiveDirectory
  sel2:
    Operation: Add app role assignment grant to user.
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1136.003/o365_new_federation/o365_new_federation.json
