title: Linux NOPASSWD Entry In Sudoers File
id: ab1e0d52-624a-11ec-8e0b-acde48001122
status: experimental
description: The following analytic detects the addition of NOPASSWD entries to the /etc/sudoers file on Linux systems. It
  leverages Endpoint Detection and Response (EDR) telemetry to identify command lines containing "NOPASSWD:". This activity
  is significant because it allows users to execute commands with elevated privileges without requiring a password, which
  can be exploited by adversaries to maintain persistent, privileged access. If confirmed malicious, this could lead to unauthorized
  privilege escalation, persistent access, and potential compromise of sensitive data and system integrity.
references:
- https://research.splunk.com/ab1e0d52-624a-11ec-8e0b-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*NOPASSWD:*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.003/nopasswd_sudoers/sysmon_linux.log
