title: Windows Credentials in Registry Reg Query
id: a8b3124e-2278-4b73-ae9c-585117079fb2
status: experimental
description: The following analytic identifies processes querying the registry for potential passwords or credentials. It
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions that access specific
  registry paths known to store sensitive information. This activity is significant as it may indicate credential theft attempts,
  often used by adversaries or post-exploitation tools like winPEAS. If confirmed malicious, this behavior could lead to privilege
  escalation, persistence, or lateral movement within the network, posing a severe security risk.
references:
- https://research.splunk.com/a8b3124e-2278-4b73-ae9c-585117079fb2/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1552.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\reg.exe'
  sel2:
    OriginalFileName: reg.exe
  sel3:
    CommandLine: '* query *'
  sel4:
    CommandLine:
    - '*\\Software\\ORL\\WinVNC3\\Password*'
    - '*\\SOFTWARE\\RealVNC\\WinVNC4 /v password*'
    - '*\\CurrentControlSet\\Services\\SNMP*'
    - '*\\Software\\TightVNC\\Server*'
    - '*\\Software\\SimonTatham\\PuTTY\\Sessions*'
    - '*\\Software\\OpenSSH\\Agent\\Keys*'
    - '*password*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/winpeas/winpeas_search_pwd/query-putty-sysmon.log
