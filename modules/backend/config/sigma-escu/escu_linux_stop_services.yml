title: Linux Stop Services
id: d05204a5-9f1c-4946-a7f3-4fa58d76d5fd
status: experimental
description: The following analytic detects attempts to stop or clear a service on Linux systems. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on processes like "systemctl," "service," and "svcadm" executing stop commands.
  This activity is significant as adversaries often terminate security or critical services to disable defenses or disrupt
  operations, as seen in malware like Industroyer2. If confirmed malicious, this could lead to the disabling of security mechanisms,
  allowing attackers to persist, escalate privileges, or deploy destructive payloads, severely impacting system integrity
  and availability.
references:
- https://research.splunk.com/d05204a5-9f1c-4946-a7f3-4fa58d76d5fd/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1489
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/systemctl'
    - '*/service'
    - '*/svcadm'
  sel2:
    CommandLine: '*stop*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1489/linux_service_stop_disable/sysmon_linux.log
