title: Windows Rapid Authentication On Multiple Hosts (counted event)
id: 62606c77-d53d-4182-9371-b02cdbbbcef7-base
status: experimental
description: The following analytic detects a source computer authenticating to 30 or more remote endpoints within a 5-minute
  timespan using Event ID 4624. This behavior is identified by analyzing Windows Event Logs for LogonType 3 events and counting
  unique target computers. Such activity is significant as it may indicate lateral movement or network share enumeration by
  an adversary. If confirmed malicious, this could lead to unauthorized access to multiple systems, potentially compromising
  sensitive data and escalating privileges within the network.
references:
- https://research.splunk.com/62606c77-d53d-4182-9371-b02cdbbbcef7/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1003.002
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4624'
  sel2:
    LogonType: '3'
  sel3:
    TargetUserName: ANONYMOUS LOGON
  sel4:
    TargetUserName: '*$'
  condition: (sel1 and sel2 and not sel3 and not sel4)
level: informational
name: escu_base_windows_rapid_authentication_on_multiple_hosts
