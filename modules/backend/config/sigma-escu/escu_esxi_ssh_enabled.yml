title: ESXi SSH Enabled
id: b8003567-c5b6-445b-8966-ecdacc81c24d
status: experimental
description: This detection identifies SSH being enabled on ESXi hosts, which can be an early indicator of malicious activity.
  Threat actors often use SSH to gain persistent remote access after compromising credentials or exploiting vulnerabilities.
references:
- https://research.splunk.com/b8003567-c5b6-445b-8966-ecdacc81c24d/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1021.004
logsource:
  product: esxi
detection:
  sel1:
    text: '*SSH access has been enabled'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.004/esxi_ssh_enabled/esxi_ssh_enabled.log
