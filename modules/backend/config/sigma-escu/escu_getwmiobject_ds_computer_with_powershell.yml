title: GetWmiObject Ds Computer with PowerShell
id: 7141122c-3bc2-4aaa-ab3b-7a85a0bbefc3
status: experimental
description: 'The following analytic detects the execution of `powershell.exe` with command-line arguments that utilize the
  `Get-WmiObject` cmdlet to discover remote systems, specifically targeting the `DS_Computer` parameter.

  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line
  executions.

  This activity is significant as it indicates potential reconnaissance efforts by adversaries to enumerate domain computers
  and gather situational awareness within Active Directory.

  If confirmed malicious, this behavior could allow attackers to map the network, identify critical systems, and plan further
  attacks, potentially leading to unauthorized access and data exfiltration.'
references:
- https://research.splunk.com/7141122c-3bc2-4aaa-ab3b-7a85a0bbefc3/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    Image: '*\\cmd.exe'
  sel8:
    OriginalFileName: Cmd.Exe
  sel9:
    CommandLine: '*Get-WmiObject*'
  sel10:
    CommandLine: '*namespace *'
  sel11:
    CommandLine: '*root\\directory\\ldap*'
  sel12:
    CommandLine: '*class *'
  sel13:
    CommandLine: '* ds_computer*'
  condition: (((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) or (sel7 or sel8)) and sel9 and sel10 and sel11 and
    sel12 and sel13)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1018/AD_discovery/windows-sysmon.log
