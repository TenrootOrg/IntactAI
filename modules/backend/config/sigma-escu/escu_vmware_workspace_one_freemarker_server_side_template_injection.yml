title: VMware Workspace ONE Freemarker Server-side Template Injection
id: 9e5726fe-8fde-460e-bd74-cddcf6c86113
status: experimental
description: 'The following analytic detects server-side template injection attempts related to CVE-2022-22954 in VMware Workspace
  ONE.

  It leverages web or proxy logs to identify HTTP GET requests to the endpoint catalog-portal/ui/oauth/verify with the freemarker.template.utility.Execute
  command.

  This activity is significant as it indicates potential exploitation attempts that could lead to remote code execution.

  If confirmed malicious, an attacker could execute arbitrary commands on the server, leading to full system compromise, data
  exfiltration, or further lateral movement within the network.'
references:
- https://research.splunk.com/9e5726fe-8fde-460e-bd74-cddcf6c86113/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1133
logsource:
  category: web
detection:
  sel1:
    cs-method: GET
  sel2:
    c-uri: '*/catalog-portal/ui/oauth/verify?error=&deviceudid=*'
  sel3:
    c-uri: '*freemarker.template.utility.Execute*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/vmware/vmware_scanning_pan_threat.log
