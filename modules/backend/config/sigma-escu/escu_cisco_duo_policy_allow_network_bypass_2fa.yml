title: Cisco Duo Policy Allow Network Bypass 2FA
id: 2593f641-6192-4f3d-b96c-2bd1c706215f
status: experimental
description: 'The following analytic detects when a Duo policy is created or updated to allow network-based bypass of two-factor
  authentication (2FA).

  It identifies this behavior by searching Duo administrator logs for policy creation or update actions where the networks_allow
  field is present,

  indicating that specific networks have been permitted to bypass 2FA requirements. This is achieved by parsing the event
  description and

  filtering for relevant policy changes, then aggregating the results by user and administrator details. Detecting this behavior
  is critical

  for a Security Operations Center (SOC) because allowing network-based 2FA bypass can significantly weaken authentication
  controls, potentially

  enabling unauthorized access if a trusted network is compromised or misconfigured. Attackers or malicious insiders may exploit
  this policy

  change to circumvent 2FA protections, increasing the risk of account takeover and lateral movement within the environment.
  Prompt detection

  enables SOC analysts '
references:
- https://research.splunk.com/2593f641-6192-4f3d-b96c-2bd1c706215f/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1556
logsource:
  product: cisco
  service: duo
detection:
  sel1:
    action: policy_update
  sel2:
    action: policy_create
  sel3:
    networks_allow: '*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556/cisco_duo_policy_allow_network_bypass_2fa/cisco_duo_administrator.json
