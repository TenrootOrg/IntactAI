title: Windows Credentials from Password Stores Chrome Copied in TEMP Dir
id: 4d14c86d-fdee-4393-94da-238d2706902f
status: experimental
description: The following analytic detects the copying of Chrome's Local State and Login Data files into temporary folders,
  a tactic often used by the Braodo stealer malware. These files contain encrypted user credentials, including saved passwords
  and login session details. The detection monitors for suspicious copying activity involving these specific Chrome files,
  particularly in temp directories where malware typically processes the stolen data. Identifying this behavior enables security
  teams to act quickly, preventing attackers from decrypting and exfiltrating sensitive browser credentials and mitigating
  the risk of unauthorized access.
references:
- https://research.splunk.com/4d14c86d-fdee-4393-94da-238d2706902f/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555.003
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*\\Local State'
    - '*\\Login Data'
  sel2:
    TargetFilename: '*\\temp\\*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.003/browser_credential_info_temp/braodo_browser_info.log
