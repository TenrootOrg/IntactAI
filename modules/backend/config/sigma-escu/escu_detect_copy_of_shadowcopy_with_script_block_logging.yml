title: Detect Copy of ShadowCopy with Script Block Logging
id: 9251299c-ea5b-11eb-a8de-acde48001122
status: experimental
description: The following analytic detects the use of PowerShell commands to copy the SAM, SYSTEM, or SECURITY hives, which
  are critical for credential theft. It leverages PowerShell Script Block Logging (EventCode=4104) to capture and analyze
  the full command executed. This activity is significant as it indicates an attempt to exfiltrate sensitive registry hives
  for offline password cracking. If confirmed malicious, this could lead to unauthorized access to credentials, enabling further
  compromise of the system and potential lateral movement within the network.
references:
- https://research.splunk.com/9251299c-ea5b-11eb-a8de-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1003.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*copy*'
    - '*[System.IO.File]::Copy*'
  sel3:
    ScriptBlockText:
    - '*System32\\config\\SAM*'
    - '*System32\\config\\SYSTEM*'
    - '*System32\\config\\SECURITY*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.002/detect_copy_of_shadowcopy_with_script_block_logging/windows-xml.log
