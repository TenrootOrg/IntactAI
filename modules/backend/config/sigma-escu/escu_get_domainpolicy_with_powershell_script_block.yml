title: Get DomainPolicy with Powershell Script Block
id: a360d2b2-065a-11ec-b0bf-acde48001122
status: experimental
description: The following analytic detects the execution of the `Get-DomainPolicy` cmdlet using PowerShell Script Block Logging
  (EventCode=4104). It leverages logs capturing script block text to identify attempts to obtain the password policy in a
  Windows domain. This activity is significant as it indicates potential reconnaissance efforts by adversaries or Red Teams
  to gather domain policy information, which is crucial for planning further attacks. If confirmed malicious, this behavior
  could lead to detailed knowledge of domain security settings, aiding in privilege escalation or lateral movement within
  the network.
references:
- https://research.splunk.com/a360d2b2-065a-11ec-b0bf-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1201
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-DomainPolicy*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/domainpolicy.log
