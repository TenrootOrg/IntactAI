title: Windows RDP Cache File Deletion
id: f3e86ff3-b1f9-4382-8924-6913385f1019
status: experimental
description: 'This detection identifies the deletion of RDP bitmap cache files—specifically .bmc and .bin files—typically
  stored in the user profile under the Terminal Server Client\Cache directory.

  These files are created by the native Windows Remote Desktop Client (mstsc.exe) and store graphical elements from remote
  sessions to improve performance.

  Deleting these files may indicate an attempt to remove forensic evidence of RDP usage.

  While rare in legitimate user behavior, this action is commonly associated with defense evasion techniques used by attackers
  or red teamers who wish to hide traces of interactive remote access.

  When observed in conjunction with recent logon activity, RDP session indicators, or script execution, this behavior should
  be treated as potentially malicious. Monitoring for deletion of these files provides valuable visibility into anti-forensic
  actions that often follow lateral movement or hands-on-keyboard activity.'
references:
- https://research.splunk.com/f3e86ff3-b1f9-4382-8924-6913385f1019/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
logsource:
  product: windows
  service: sysmon
detection:
  sel1:
    EventID:
    - '23'
    - '26'
  sel2:
    TargetFilename:
    - '*\\Terminal Server Client\\Cache\\*.bmc'
    - '*\\Terminal Server Client\\Cache\\cache*.bin'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1070.004/bmc_file_deleted/bmc_file_deleted.log
