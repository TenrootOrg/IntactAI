title: Windows Time Based Evasion via Choice Exec
id: d5f54b38-10bf-4b3a-b6fc-85949862ed50
status: experimental
description: The following analytic detects the use of choice.exe in batch files as a delay tactic, a technique observed in
  SnakeKeylogger malware. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and
  command-line executions. This activity is significant as it indicates potential time-based evasion techniques used by malware
  to avoid detection. If confirmed malicious, this behavior could allow attackers to execute code stealthily, delete malicious
  files, and persist on compromised hosts, making it crucial for SOC analysts to investigate promptly.
references:
- https://research.splunk.com/d5f54b38-10bf-4b3a-b6fc-85949862ed50/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1497.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\choice.exe'
  sel2:
    CommandLine: '*/T*'
  sel3:
    CommandLine: '*/N*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1497.003/time_delay_using_choice_exe/snakekeylogger_choice.log
