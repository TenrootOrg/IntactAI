title: Get DomainUser with PowerShell
id: 9a5a41d6-04e7-11ec-923c-acde48001122
status: experimental
description: The following analytic detects the execution of `powershell.exe` with command-line arguments used to enumerate
  domain users via the `Get-DomainUser` command. This detection leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on process names and command-line executions mapped to the `Processes` node of the `Endpoint` data model.
  This activity is significant as it indicates potential reconnaissance efforts by adversaries or Red Teams using PowerView
  for Active Directory discovery. If confirmed malicious, this could allow attackers to gain situational awareness and identify
  valuable targets within the domain, potentially leading to further exploitation.
references:
- https://research.splunk.com/9a5a41d6-04e7-11ec-923c-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    Image: '*\\powershell*'
  sel3:
    CommandLine: '*Get-DomainUser*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/windows-sysmon.log
