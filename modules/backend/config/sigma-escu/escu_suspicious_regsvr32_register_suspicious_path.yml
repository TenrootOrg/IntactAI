title: Suspicious Regsvr32 Register Suspicious Path
id: 62732736-6250-11eb-ae93-0242ac130002
status: experimental
description: The following analytic detects the use of Regsvr32.exe to register DLLs from suspicious paths such as AppData,
  ProgramData, or Windows Temp directories. It leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process execution logs and command-line arguments. This activity is significant because Regsvr32.exe can be abused to
  proxy execution of malicious code, bypassing traditional security controls. If confirmed malicious, this could allow an
  attacker to execute arbitrary code, potentially leading to system compromise, data exfiltration, or further lateral movement
  within the network.
references:
- https://research.splunk.com/62732736-6250-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\regsvr32.exe'
  sel2:
    OriginalFileName: REGSVR32.EXE
  sel3:
    CommandLine:
    - '*\\appdata\\*'
    - '*\\programdata\\*'
    - '*\\windows\\temp\\*'
  sel4:
    CommandLine:
    - '*.dll*'
    - '*.ax*'
    - '*.ocx*'
  condition: ((sel1 or sel2) and sel3 and not (sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.010/atomic_red_team/windows-sysmon.log
