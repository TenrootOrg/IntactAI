title: Microsoft SharePoint Server Elevation of Privilege
id: fcf4bd3f-a79f-4b7a-83bf-2692d60b859d
status: experimental
description: 'The following analytic detects potential exploitation attempts against Microsoft SharePoint Server vulnerability
  CVE-2023-29357.

  It leverages the Web datamodel to monitor for specific API calls and HTTP methods indicative of privilege escalation attempts.

  This activity is significant as it may indicate an attacker is trying to gain unauthorized privileged access to the SharePoint
  environment.

  If confirmed malicious, the impact could include unauthorized access to sensitive data, potential data theft, and further
  compromise of the SharePoint server, leading to a broader security breach.'
references:
- https://research.splunk.com/fcf4bd3f-a79f-4b7a-83bf-2692d60b859d/
author: Splunk Security Content (Apache-2.0), Michael Haag, Gowthamaraj Rajendran, Splunk
tags:
- attack.t1068
logsource:
  category: web
detection:
  sel1:
    c-uri:
    - '*/_api/web/siteusers*'
    - '*/_api/web/currentuser*'
  sel2:
    sc-status: '200'
  sel3:
    cs-method: GET
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/sharepoint/sharepointeop.log
