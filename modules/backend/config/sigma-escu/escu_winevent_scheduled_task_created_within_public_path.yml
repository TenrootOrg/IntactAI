title: WinEvent Scheduled Task Created Within Public Path
id: 5d9c6eee-988c-11eb-8253-acde48001122
status: experimental
description: The following analytic detects the creation of scheduled tasks within user-writable paths using Windows Security
  EventCode 4698. It identifies tasks registered via schtasks.exe or TaskService that execute commands from directories like
  Public, ProgramData, Temp, and AppData. This behavior is significant as it may indicate an attempt to establish persistence
  or execute unauthorized commands. If confirmed malicious, an attacker could maintain long-term access, escalate privileges,
  or execute arbitrary code, posing a severe threat to system integrity and security.
references:
- https://research.splunk.com/5d9c6eee-988c-11eb-8253-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4698'
  sel2:
    TaskContent:
    - '*\\users\\public\\*'
    - '*\\programdata\\*'
    - '*\\temp\\*'
    - '*\\Windows\\Tasks\\*'
    - '*\\appdata\\*'
    - '*\\perflogs\\*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/winevent_scheduled_task_created_to_spawn_shell/windows-xml.log
