title: Remote Process Instantiation via WMI and PowerShell
id: 112638b4-4634-11ec-b9ab-3e22fbd008af
status: experimental
description: The following analytic detects the execution of `powershell.exe` using the `Invoke-WmiMethod` cmdlet to start
  a process on a remote endpoint via WMI. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on
  command-line executions and process telemetry. This activity is significant as it indicates potential lateral movement or
  remote code execution attempts by adversaries. If confirmed malicious, this could allow attackers to execute arbitrary code
  on remote systems, leading to further compromise and persistence within the network.
references:
- https://research.splunk.com/112638b4-4634-11ec-b9ab-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    CommandLine: '*Invoke-WmiMethod*'
  sel8:
    CommandLine: '*-CN*'
  sel9:
    CommandLine: '*-Class Win32_Process*'
  sel10:
    CommandLine: '*-Name create*'
  condition: ((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) and (sel7 and sel8 and sel9 and sel10))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1047/lateral_movement/windows-sysmon.log
