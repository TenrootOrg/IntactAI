title: Windows Abused Web Services
id: 01f0aef4-8591-4daa-a53d-0ed49823b681
status: experimental
description: The following analytic detects a suspicious process making DNS queries to known, abused web services such as
  text-paste sites, VoIP, secure tunneling, instant messaging, and digital distribution platforms. This detection leverages
  Sysmon logs with Event ID 22, focusing on specific query names. This activity is significant as it may indicate an adversary
  attempting to download malicious files, a common initial access technique. If confirmed malicious, this could lead to unauthorized
  code execution, data exfiltration, or further compromise of the target host.
references:
- https://research.splunk.com/01f0aef4-8591-4daa-a53d-0ed49823b681/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1102
logsource:
  product: windows
  service: sysmon
  category: dns_query
detection:
  sel1:
    EventID: '22'
  sel2:
    QueryName:
    - '*//objects.githubusercontent.com*'
    - '*anonfiles.com*'
    - '*.argotunnel.com*'
    - '*cdn.discordapp.com*'
    - '*ddns.net*'
    - '*dl.dropboxusercontent.com*'
    - '*duckdns.org*'
    - '*ghostbin.co*'
    - '*glitch.me*'
    - '*gofile.io*'
    - '*hastebin.com*'
    - '*mediafire.com*'
    - '*mega.nz*'
    - '*ngrok.io*'
    - '*onrender.com*'
    - '*pages.dev*'
    - '*paste.ee*'
    - '*pastebin.com*'
    - '*pastebin.pl*'
    - '*pasteio.com*'
    - '*pastetext.net*'
    - '*privatlab.com*'
    - '*privatlab.net*'
    - '*send.exploit.in*'
    - '*sendspace.com*'
    - '*storage.googleapis.com*'
    - '*storjshare.io*'
    - '*supabase.co*'
    - '*temp.sh*'
    - '*textbin*'
    - '*transfer.sh*'
    - '*trycloudflare.com*'
    - '*ufile.io*'
    - '*w3spaces.com*'
    - '*workers.dev*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1102/njrat_ngrok_connection/ngrok.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1071.004/upload_files_dns/upload_files.log
