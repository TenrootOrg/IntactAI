title: Windows Enable Win32 ScheduledJob via Registry
id: 12c80db8-ef62-4456-92df-b23e1b3219f6
status: experimental
description: The following analytic detects the creation of a new DWORD value named "EnableAt" in the registry path "HKLM:\SOFTWARE\Microsoft\Windows
  NT\CurrentVersion\Schedule\Configuration". This modification enables the use of the at.exe or wmi Win32_ScheduledJob commands
  to add scheduled tasks on a Windows endpoint. The detection leverages registry event data from the Endpoint datamodel. This
  activity is significant because it may indicate that an attacker is enabling the ability to schedule tasks, potentially
  to execute malicious code at specific times or intervals. If confirmed malicious, this could allow persistent code execution
  on the system.
references:
- https://research.splunk.com/12c80db8-ef62-4456-92df-b23e1b3219f6/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1053.005
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\CurrentVersion\\Schedule\\Configuration*'
  sel2:
    TargetObject: '*\\EnableAt'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/atomic_red_team/enableat_windows-sysmon.log
