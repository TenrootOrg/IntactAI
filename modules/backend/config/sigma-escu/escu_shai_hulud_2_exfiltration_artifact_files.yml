title: Shai-Hulud 2 Exfiltration Artifact Files
id: 9e7d3c0f-4a5b-6c8d-1e2f-3a4b5c6d7e8f
status: experimental
description: 'Detects creation of exfiltration artifact files associated with Shai-Hulud 2.0 npm supply

  chain malware. The malware creates cloud.json, contents.json, environment.json, truffleSecrets.json,

  and actionsSecrets.json files containing harvested credentials from AWS, Azure, GCP, GitHub secrets,

  and environment variables. These files are staged before being pushed to attacker-controlled repositories.'
references:
- https://research.splunk.com/9e7d3c0f-4a5b-6c8d-1e2f-3a4b5c6d7e8f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1074.001
- attack.t1552.001
- attack.t1195.002
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*\\cloud.json'
    - '*\\contents.json'
    - '*\\environment.json'
    - '*\\truffleSecrets.json'
    - '*\\actionsSecrets.json'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1195.001/npm/shai_hulud_workflow_sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1195.001/npm/windows_workflow_sysmon.log
