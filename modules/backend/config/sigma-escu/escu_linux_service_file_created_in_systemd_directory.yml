title: Linux Service File Created In Systemd Directory
id: c7495048-61b6-11ec-9a37-acde48001122
status: experimental
description: The following analytic detects the creation of suspicious service files within the systemd directories on Linux
  platforms. It leverages logs containing file name, file path, and process GUID data from endpoints. This activity is significant
  for a SOC as it may indicate an adversary attempting to establish persistence on a compromised host. If confirmed malicious,
  this could lead to system compromise or data exfiltration, allowing attackers to maintain control over the system and execute
  further malicious activities.
references:
- https://research.splunk.com/c7495048-61b6-11ec-9a37-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1053.006
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename: '*.service'
  sel2:
    TargetFilename:
    - '*/etc/systemd/system*'
    - '*/lib/systemd/system*'
    - '*/usr/lib/systemd/system*'
    - '*/run/systemd/system*'
    - '*~/.config/systemd/*'
    - '*~/.local/share/systemd/*'
    - '*/etc/systemd/user*'
    - '*/lib/systemd/user*'
    - '*/usr/lib/systemd/user*'
    - '*/run/systemd/user*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.006/service_systemd/sysmon_linux.log
