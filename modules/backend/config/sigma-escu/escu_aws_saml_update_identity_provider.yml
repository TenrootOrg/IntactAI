title: AWS SAML Update identity provider
id: 2f0604c6-6030-11eb-ae93-0242ac130002
status: experimental
description: The following analytic detects updates to the SAML provider in AWS. It leverages AWS CloudTrail logs to identify
  the `UpdateSAMLProvider` event, analyzing fields such as `sAMLProviderArn`, `sourceIPAddress`, and `userIdentity` details.
  Monitoring updates to the SAML provider is crucial as it may indicate a perimeter compromise of federated credentials or
  unauthorized backdoor access set by an attacker. If confirmed malicious, this activity could allow attackers to manipulate
  identity federation, potentially leading to unauthorized access to cloud resources and sensitive data.
references:
- https://research.splunk.com/2f0604c6-6030-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Rod Soto, Splunk
