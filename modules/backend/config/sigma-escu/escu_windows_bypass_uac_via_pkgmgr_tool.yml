title: Windows Bypass UAC via Pkgmgr Tool
id: cce58e2c-988a-4319-9390-0daa9eefa3cd
status: experimental
description: The following analytic detects the execution of the deprecated 'pkgmgr.exe' process with an XML input file, which
  is unusual and potentially suspicious. This detection leverages Endpoint Detection and Response (EDR) telemetry, focusing
  on process execution details and command-line arguments. The significance lies in the deprecated status of 'pkgmgr.exe'
  and the use of XML files, which could indicate an attempt to bypass User Account Control (UAC). If confirmed malicious,
  this activity could allow an attacker to execute commands with elevated privileges, leading to potential system compromise
  and unauthorized changes.
references:
- https://research.splunk.com/cce58e2c-988a-4319-9390-0daa9eefa3cd/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pkgmgr.exe'
  sel2:
    CommandLine: '*.xml*'
  sel3:
    ParentImage:
    - '*:\\windows\\system32\\*'
    - '*:\\windows\\syswow64\\*'
    - '*:\\Program Files*'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/warzone_rat/pkgmgr_uac_bypass/pkgmgr_create_file.log
