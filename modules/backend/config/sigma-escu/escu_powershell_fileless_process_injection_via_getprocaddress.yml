title: Powershell Fileless Process Injection via GetProcAddress
id: a26d9db4-c883-11eb-9d75-acde48001122
status: experimental
description: The following analytic detects the use of `GetProcAddress` in PowerShell script blocks, leveraging PowerShell
  Script Block Logging (EventCode=4104). This method captures the full command sent to PowerShell, which is then logged in
  Windows event logs. The presence of `GetProcAddress` is unusual for typical PowerShell scripts and often indicates malicious
  activity, as many attack toolkits use it to achieve code execution. If confirmed malicious, this activity could allow an
  attacker to execute arbitrary code, potentially leading to system compromise. Analysts should review parallel processes
  and the entire logged script block for further investigation.
references:
- https://research.splunk.com/a26d9db4-c883-11eb-9d75-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1055
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*getprocaddress*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
