title: AdsiSearcher Account Discovery
id: de7fcadc-04f3-11ec-a241-acde48001122
status: experimental
description: The following analytic detects the use of the `[Adsisearcher]` type accelerator in PowerShell to query Active
  Directory for domain users. It leverages PowerShell Script Block Logging (EventCode=4104) to identify script blocks containing
  `[adsisearcher]`, `objectcategory=user`, and `.findAll()`. This activity is significant as it may indicate an attempt by
  adversaries or Red Teams to enumerate domain users for situational awareness and Active Directory discovery. If confirmed
  malicious, this could lead to further reconnaissance, privilege escalation, or lateral movement within the network.
references:
- https://research.splunk.com/de7fcadc-04f3-11ec-a241-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*[adsisearcher]*'
  sel3:
    ScriptBlockText: '*objectcategory=user*'
  sel4:
    ScriptBlockText: '*.findAll()*'
  condition: (sel1 and sel2 and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/adsisearcher_powershell.log
