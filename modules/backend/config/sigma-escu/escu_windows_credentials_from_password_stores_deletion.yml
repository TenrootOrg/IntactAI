title: Windows Credentials from Password Stores Deletion
id: 46d676aa-40c6-4fe6-b917-d23b621f0f89
status: experimental
description: The following analytic detects the execution of the Windows OS tool cmdkey.exe with the /delete parameter. This
  detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs and command-line
  arguments. The activity is significant because cmdkey.exe can be used by attackers to delete stored credentials, potentially
  leading to privilege escalation and persistence. If confirmed malicious, this behavior could allow attackers to remove stored
  user credentials, hindering incident response efforts and enabling further unauthorized access to the compromised system.
references:
- https://research.splunk.com/46d676aa-40c6-4fe6-b917-d23b621f0f89/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmdkey.exe'
  sel2:
    OriginalFileName: cmdkey.exe
  sel3:
    CommandLine: '*/delete*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555/cmdkey_delete_credentials_store/cmdkey_del_sys.log
