title: Windows Modify Registry to Add or Modify Firewall Rule
id: 43254751-e2ce-409a-b6b4-4f851e8dcc26
status: experimental
description: The following analytic detects a potential addition or modification of firewall rules, signaling possible configuration
  changes or security policy adjustments. It tracks commands such as netsh advfirewall firewall add rule and netsh advfirewall
  firewall set rule, which may indicate attempts to alter network access controls. Monitoring these actions ensures the integrity
  of firewall settings and helps prevent unauthorized network access.
references:
- https://research.splunk.com/43254751-e2ce-409a-b6b4-4f851e8dcc26/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\System\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\FirewallRules\\*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1112/firewall_modify_delete/firewall_mod_delete.log
x-intact-burst: false
x-intact: 'Fired 294 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
