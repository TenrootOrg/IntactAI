title: GitHub Enterprise Remove Organization
id: 94cb89aa-aec1-4585-91b1-affcdacf357e
status: experimental
description: The following analytic detects when a user removes an organization from GitHub Enterprise. The detection monitors
  GitHub Enterprise audit logs for organization deletion events, which could indicate unauthorized removal of critical business
  resources. For a SOC, identifying organization removals is crucial as it may signal account compromise, insider threats,
  or malicious attempts to disrupt business operations by deleting entire organizational structures. The impact could be severe,
  potentially resulting in loss of source code, repositories, team structures, access controls, and other critical organizational
  assets. This disruption could halt development workflows, cause data loss, and require significant effort to restore from
  backups if available. Additionally, unauthorized organization removal could be part of a larger attack campaign aimed at
  destroying or compromising enterprise assets.
references:
- https://research.splunk.com/94cb89aa-aec1-4585-91b1-affcdacf357e/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
