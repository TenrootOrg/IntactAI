title: Windows Odbcconf Load DLL
id: 141e7fca-a9f0-40fd-a539-9aac8be41f1b
status: experimental
description: The following analytic detects the execution of odbcconf.exe with the regsvr action to load a DLL. This is identified
  by monitoring command-line arguments in process creation logs from Endpoint Detection and Response (EDR) agents. This activity
  is significant as it may indicate an attempt to execute arbitrary code via DLL loading, a common technique used in various
  attack vectors. If confirmed malicious, this could allow an attacker to execute code with the privileges of the odbcconf.exe
  process, potentially leading to system compromise or further lateral movement.
references:
- https://research.splunk.com/141e7fca-a9f0-40fd-a539-9aac8be41f1b/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.008
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\odbcconf.exe'
  sel2:
    CommandLine:
    - '*/a *'
    - '*-a*'
  sel3:
    CommandLine: '*regsvr*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.008/atomic_red_team/windows-sysmon-odbc-regsvr.log
