title: Windows RDP Server Registry Deletion
id: 1a058296-7c68-4d66-9560-464764d6e26c
status: experimental
description: This detection identifies the deletion of registry keys under HKEY_CURRENT_USER\Software\Microsoft\Terminal Server
  Client\Servers\, which store records of previously connected remote systems via Remote Desktop Protocol (RDP). These keys
  are created automatically when a user connects to a remote host using the native Windows RDP client (mstsc.exe) and can
  be valuable forensic artifacts for tracking remote access activity. Malicious actors aware of this behavior may delete these
  keys after using RDP to hide evidence of their activity and avoid detection during incident response. This form of artifact
  cleanup is a known defense evasion technique, often performed during or after lateral movement. Legitimate users rarely
  delete these keys manually, making such actions highly suspicious—especially when correlated with RDP usage, unusual logon
  behavior, or other signs of compromise. Detecting the deletion of these registry entries can provide crucial insight into
  attempts to cover tracks foll
