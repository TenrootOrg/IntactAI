title: Linux SSH Authorized Keys Modification
id: f5ab595e-28e5-4327-8077-5008ba97c850
status: experimental
description: The following analytic detects the modification of SSH Authorized Keys on Linux systems. It leverages process
  execution data from Endpoint Detection and Response (EDR) agents, specifically monitoring commands like "bash" and "cat"
  interacting with "authorized_keys" files. This activity is significant as adversaries often modify SSH Authorized Keys to
  establish persistent access to compromised endpoints. If confirmed malicious, this behavior could allow attackers to maintain
  unauthorized access, bypassing traditional authentication mechanisms and potentially leading to further exploitation or
  data exfiltration.
references:
- https://research.splunk.com/f5ab595e-28e5-4327-8077-5008ba97c850/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1098.004
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/bash'
    - '*/cat'
  sel2:
    CommandLine: '*/authorized_keys*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098.004/ssh_authorized_keys/authkey_linux-sysmon.log
