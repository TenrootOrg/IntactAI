title: Get DomainPolicy with Powershell
id: b8f9947e-065a-11ec-aafb-acde48001122
status: experimental
description: The following analytic detects the execution of `powershell.exe` running the `Get-DomainPolicy` cmdlet, which
  is used to retrieve password policies in a Windows domain. It leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on process names and command-line executions. This activity is significant as it indicates potential reconnaissance
  efforts by adversaries to gather domain policy information, which is crucial for planning further attacks. If confirmed
  malicious, this could lead to unauthorized access to sensitive domain configurations, aiding in privilege escalation and
  lateral movement within the network.
references:
- https://research.splunk.com/b8f9947e-065a-11ec-aafb-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1201
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    Image: '*\\powershell*'
  sel3:
    CommandLine: '*Get-DomainPolicy*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1201/pwd_policy_discovery/windows-sysmon.log
