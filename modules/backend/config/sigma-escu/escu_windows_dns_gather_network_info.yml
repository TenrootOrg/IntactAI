title: Windows DNS Gather Network Info
id: 347e0892-e8f3-4512-afda-dc0e3fa996f3
status: experimental
description: The following analytic detects the use of the dnscmd.exe command to enumerate DNS records. It leverages data
  from Endpoint Detection and Response (EDR) agents, focusing on process command-line executions. This activity is significant
  as it may indicate an adversary gathering network information, a common precursor to more targeted attacks. If confirmed
  malicious, this behavior could enable attackers to map the network, identify critical assets, and plan subsequent actions,
  potentially leading to data exfiltration or further compromise of the network.
references:
- https://research.splunk.com/347e0892-e8f3-4512-afda-dc0e3fa996f3/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1590.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\dnscmd.exe'
  sel2:
    CommandLine: '* /enumrecords *'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1590.002/enum_dns_record/sysmon.log
