title: Windows SharePoint Spinstall0 GET Request
id: ac490de2-ee39-421c-b61b-1c4005dde427
status: experimental
description: The following analytic detects potential post-exploitation activity related to the Microsoft SharePoint CVE-2025-53770
  vulnerability. After successful exploitation via the ToolPane.aspx endpoint, attackers typically deploy a webshell named
  "spinstall0.aspx" in the SharePoint layouts directory. This detection identifies GET requests to this webshell, which indicates
  active use of the backdoor for command execution, data exfiltration, or credential/key extraction. Attackers commonly use
  these webshells to extract encryption keys, authentication tokens, and other sensitive information from the compromised
  SharePoint server.
references:
- https://research.splunk.com/ac490de2-ee39-421c-b61b-1c4005dde427/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1505.003
- attack.t1552
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/_layouts/15/spinstall0.aspx*'
  sel2:
    cs-method: GET
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/sharepoint/spinstall0.log
