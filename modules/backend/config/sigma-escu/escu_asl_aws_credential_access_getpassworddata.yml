title: ASL AWS Credential Access GetPasswordData
id: a79b607a-50cc-4704-bb9d-eff280cb78c2
status: experimental
description: The following analytic identifiesGetPasswordData API calls in your AWS account. It leverages  CloudTrail logs
  from Amazon Security Lake to detect this activity by counting the distinct instance IDs accessed. This behavior is significant
  as it may indicate an attempt to retrieve encrypted administrator passwords for running Windows instances, which is a critical
  security concern. If confirmed malicious, attackers could gain unauthorized access to administrative credentials, potentially
  leading to full control over the affected instances and further compromise of the AWS environment.
references:
- https://research.splunk.com/a79b607a-50cc-4704-bb9d-eff280cb78c2/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1110.001
- attack.t1586.003
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    api.operation: GetPasswordData
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552/aws_getpassworddata/asl_ocsf_cloudtrail.json
