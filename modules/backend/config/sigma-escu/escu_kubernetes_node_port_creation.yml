title: Kubernetes Node Port Creation
id: d7fc865e-b8a1-4029-a960-cf4403b821b6
status: experimental
description: The following analytic detects the creation of a Kubernetes NodePort service, which exposes a service to the
  external network. It identifies this activity by monitoring Kubernetes Audit logs for the creation of NodePort services.
  This behavior is significant for a SOC as it could allow an attacker to access internal services, posing a threat to the
  Kubernetes infrastructure's integrity and security. If confirmed malicious, this activity could lead to data breaches, service
  disruptions, or unauthorized access to sensitive information.
references:
- https://research.splunk.com/d7fc865e-b8a1-4029-a960-cf4403b821b6/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1204
logsource:
  product: kubernetes
  service: audit
detection:
  sel1:
    objectRef.resource: services
  sel2:
    verb: create
  sel3:
    requestObject.spec.type: NodePort
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1204/kube_audit_create_node_port_service/kube_audit_create_node_port_service.json
