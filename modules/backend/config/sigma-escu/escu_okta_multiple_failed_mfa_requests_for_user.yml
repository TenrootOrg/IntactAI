title: Okta Multiple Failed MFA Requests For User (counted event)
id: 826dbaae-a1e6-4c8c-b384-d16898956e73-base
status: experimental
description: The following analytic identifies multiple failed multi-factor authentication (MFA) requests for a single user
  within an Okta tenant. It triggers when more than 10 MFA attempts fail within 5 minutes, using Okta event logs to detect
  this pattern. This activity is significant as it may indicate an adversary attempting to bypass MFA by bombarding the user
  with repeated authentication requests, a technique used by threat actors like Lapsus and APT29. If confirmed malicious,
  this could lead to unauthorized access, potentially compromising sensitive information and systems.
references:
- https://research.splunk.com/826dbaae-a1e6-4c8c-b384-d16898956e73/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1621
logsource:
  product: okta
  service: okta
detection:
  sel1:
    eventType: user.authentication.auth_via_mfa
  sel2:
    outcome.result: FAILURE
  sel3:
    debugContext.debugData.factor: PASSWORD_AS_FACTOR
  condition: (sel1 and sel2 and not sel3)
level: informational
name: escu_base_okta_multiple_failed_mfa_requests_for_user
