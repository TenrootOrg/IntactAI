title: GitHub Organizations Disable 2FA Requirement
id: 3ed0d6ba-4791-4fa8-a1ef-403e438c7033
status: experimental
description: The following analytic detects when two-factor authentication (2FA) requirements are disabled in GitHub Organizations.
  The detection monitors GitHub Organizations audit logs for 2FA requirement changes by tracking actor details, organization
  information, and associated metadata. For a SOC, identifying disabled 2FA requirements is critical as it could indicate
  attempts to weaken account security controls. Two-factor authentication is a fundamental security control that helps prevent
  unauthorized access even if passwords are compromised. Disabling 2FA requirements could allow attackers to more easily compromise
  accounts through password-based attacks. The impact of disabled 2FA includes increased risk of account takeover, potential
  access to sensitive code and intellectual property, and compromise of the software supply chain. This activity could be
  part of a larger attack chain where an adversary first disables security controls before attempting broader account compromises.
references:
