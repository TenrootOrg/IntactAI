title: Linux GNU Awk Privilege Escalation
id: 0dcf43b9-50d8-42a6-acd9-d1c9201fe6ae
status: experimental
description: The following analytic detects the execution of the 'gawk' command with elevated privileges on a Linux system.
  It leverages Endpoint Detection and Response (EDR) telemetry to identify command-line executions where 'gawk' is used with
  'sudo' and 'BEGIN{system' patterns. This activity is significant because it indicates a potential privilege escalation attempt,
  allowing a user to execute system commands as root. If confirmed malicious, this could lead to full root access, enabling
  the attacker to control the system, modify critical files, and maintain persistent access.
references:
- https://research.splunk.com/0dcf43b9-50d8-42a6-acd9-d1c9201fe6ae/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*gawk*'
  sel2:
    CommandLine: '*BEGIN*{system*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/gawk/sysmon_linux.log
