title: Windows Credentials from Password Stores Chrome Login Data Access
id: 0d32ba37-80fc-4429-809c-0ba15801aeaf
status: experimental
description: 'The following analytic identifies non-Chrome processes accessing the Chrome user data file "login data."

  This file is an SQLite database containing sensitive information, including saved passwords.

  The detection leverages Windows Security Event logs, specifically event code 4663, to monitor access attempts.

  This activity is significant as it may indicate attempts by threat actors to extract and decrypt stored passwords, posing
  a risk to user credentials.

  If confirmed malicious, attackers could gain unauthorized access to sensitive accounts and escalate their privileges within
  the environment.'
references:
- https://research.splunk.com/0d32ba37-80fc-4429-809c-0ba15801aeaf/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ObjectName: '*\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\Login Data'
  sel3:
    ProcessName:
    - '*:\\Windows\\explorer.exe'
    - '*:\\Windows\\System32\\dllhost.exe'
    - '*\\AppData\\Local\\Google\\Chrome Beta\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome Dev\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome SxS\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome Unstable\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/redline/chrome_login_data_simulate_access/redline-login-data-security-xml.log
