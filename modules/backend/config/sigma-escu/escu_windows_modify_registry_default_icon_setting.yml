title: Windows Modify Registry Default Icon Setting
id: a7a7afdb-3c58-45b6-9bff-63e5acfd9d40
status: experimental
description: The following analytic detects suspicious modifications to the Windows registry's default icon settings, a technique
  associated with Lockbit ransomware. It leverages data from the Endpoint Registry data model, focusing on changes to registry
  paths under "*HKCR\\*\\defaultIcon\\(Default)*". This activity is significant as it is uncommon for normal users to modify
  these settings, and such changes can indicate ransomware infection or other malware. If confirmed malicious, this could
  lead to system defacement and signal a broader ransomware attack, potentially compromising sensitive data and system integrity.
references:
- https://research.splunk.com/a7a7afdb-3c58-45b6-9bff-63e5acfd9d40/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\defaultIcon\\(Default)*'
  sel2:
    TargetObject: '*HKCR\\*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/lockbit_ransomware/sysmon.log
x-intact-burst: false
x-intact: 'Fired 2096 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
