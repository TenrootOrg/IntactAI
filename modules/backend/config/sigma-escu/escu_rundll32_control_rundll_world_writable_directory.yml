title: Rundll32 Control RunDLL World Writable Directory
id: 1adffe86-10c3-11ec-8ce6-acde48001122
status: experimental
description: The following analytic detects the execution of rundll32.exe with the `Control_RunDLL` command, loading files
  from world-writable directories such as windows\temp, programdata, or appdata. This detection leverages Endpoint Detection
  and Response (EDR) telemetry, focusing on process command-line data and specific directory paths. This activity is significant
  as it may indicate an attempt to exploit CVE-2021-40444 or similar vulnerabilities, allowing attackers to execute arbitrary
  code. If confirmed malicious, this could lead to unauthorized code execution, privilege escalation, or persistent access
  within the environment.
references:
- https://research.splunk.com/1adffe86-10c3-11ec-8ce6-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rundll32.exe'
  sel2:
    OriginalFileName: RUNDLL32.EXE
  sel3:
    CommandLine: '*Control_RunDLL*'
  sel4:
    CommandLine:
    - '*\\appdata\\*'
    - '*\\windows\\temp\\*'
    - '*\\programdata\\*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.002/atomic_red_team/windows-sysmon.log
