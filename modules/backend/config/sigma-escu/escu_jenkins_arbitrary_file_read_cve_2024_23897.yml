title: Jenkins Arbitrary File Read CVE-2024-23897
id: c641260d-2b48-4eb1-b1e8-2cc5b8b99ab1
status: experimental
description: The following analytic identifies attempts to exploit Jenkins Arbitrary File Read CVE-2024-23897. It detects
  HTTP POST requests to Jenkins URLs containing "*/cli?remoting=false*" with a 200 status code. This activity is significant
  as it indicates potential unauthorized access to sensitive files on the Jenkins server, such as credentials and private
  keys. If confirmed malicious, this could lead to severe data breaches, unauthorized access, and further exploitation within
  the environment.
references:
- https://research.splunk.com/c641260d-2b48-4eb1-b1e8-2cc5b8b99ab1/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/cli?remoting=false*'
  sel2:
    sc-status: '200'
  sel3:
    cs-method: POST
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/jenkins/nginx_jenkins_cve_2023_23897.log
