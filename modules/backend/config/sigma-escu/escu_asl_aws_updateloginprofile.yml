title: ASL AWS UpdateLoginProfile
id: 5b3f63a3-865b-4637-9941-f98bd1a50c0d
status: experimental
description: The following analytic detects an AWS CloudTrail event where a user with permissions updates the login profile
  of another user. It leverages CloudTrail logs to identify instances where the user making the change is different from the
  user whose profile is being updated. This activity is significant because it can indicate privilege escalation attempts,
  where an attacker uses a compromised account to gain higher privileges. If confirmed malicious, this could allow the attacker
  to escalate their privileges, potentially leading to unauthorized access and control over sensitive resources within the
  AWS environment.
references:
- https://research.splunk.com/5b3f63a3-865b-4637-9941-f98bd1a50c0d/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1136.003
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    api.operation: UpdateLoginProfile
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078/aws_updateloginprofile/asl_ocsf_cloudtrail.json
