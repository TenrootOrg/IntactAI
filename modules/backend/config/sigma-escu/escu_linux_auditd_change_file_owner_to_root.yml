title: Linux Auditd Change File Owner To Root
id: 7b87c556-0ca4-47e0-b84c-6cd62a0a3e90
status: experimental
description: The following analytic detects the use of the 'chown' command to change a file owner to 'root' on a Linux system.
  It leverages Linux Auditd telemetry, specifically monitoring command-line executions and process details. This activity
  is significant as it may indicate an attempt to escalate privileges by adversaries, malware, or red teamers. If confirmed
  malicious, this action could allow an attacker to gain root-level access, leading to full control over the compromised host
  and potential persistence within the environment.
references:
- https://research.splunk.com/7b87c556-0ca4-47e0-b84c-6cd62a0a3e90/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1222.002
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle: '*chown *root*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.002/linux_auditd_chown_root/auditd_proctitle_chown_root.log
