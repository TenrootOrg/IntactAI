title: Windows Remote Services Rdp Enable
id: 8fbd2e88-4ea5-40b9-9217-fd0855e08cc0
status: experimental
description: The following analytic detects modifications in the Windows registry to enable Remote Desktop Protocol (RDP)
  on a targeted machine. It leverages data from the Endpoint.Registry datamodel, specifically monitoring changes to the "fDenyTSConnections"
  registry value. This activity is significant as enabling RDP via registry is uncommon and often associated with adversaries
  or malware attempting to gain remote access. If confirmed malicious, this could allow attackers to remotely control the
  compromised host, potentially leading to further exploitation and lateral movement within the network.
references:
- https://research.splunk.com/8fbd2e88-4ea5-40b9-9217-fd0855e08cc0/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1021.001
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Control\\Terminal Server\\fDenyTSConnections*'
  sel2:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
