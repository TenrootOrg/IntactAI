title: Linux Add Files In Known Crontab Directories
id: 023f3452-5f27-11ec-bf00-acde48001122
status: experimental
description: The following analytic detects unauthorized file creation in known crontab directories on Unix-based systems.
  It leverages filesystem data to identify new files in directories such as /etc/cron* and /var/spool/cron/*. This activity
  is significant as it may indicate an attempt by threat actors or malware to establish persistence on a compromised host.
  If confirmed malicious, this could allow attackers to execute arbitrary code at scheduled intervals, potentially leading
  to further system compromise and unauthorized access to sensitive information.
references:
- https://research.splunk.com/023f3452-5f27-11ec-bf00-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1053.003
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename:
    - '*/etc/cron*'
    - '*/var/spool/cron/*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.003/cronjobs_entry/sysmon_linux.log
