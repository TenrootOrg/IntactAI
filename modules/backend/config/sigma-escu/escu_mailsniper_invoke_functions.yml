title: Mailsniper Invoke functions
id: a36972c8-b894-11eb-9f78-acde48001122
status: experimental
description: The following analytic detects the execution of known MailSniper PowerShell functions on a machine. It leverages
  PowerShell logs (EventCode 4104) to identify specific script block text associated with MailSniper activities. This behavior
  is significant as MailSniper is often used by attackers to harvest sensitive emails from compromised Exchange servers. If
  confirmed malicious, this activity could lead to unauthorized access to sensitive email data, credential theft, and further
  compromise of the email infrastructure.
references:
- https://research.splunk.com/a36972c8-b894-11eb-9f78-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1114.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*Invoke-GlobalO365MailSearch*'
    - '*Invoke-GlobalMailSearch*'
    - '*Invoke-SelfSearch*'
    - '*Invoke-PasswordSprayOWA*'
    - '*Invoke-PasswordSprayEWS*'
    - '*Invoke-DomainHarvestOWA*'
    - '*Invoke-UsernameHarvestOWA*'
    - '*Invoke-OpenInboxFinder*'
    - '*Invoke-InjectGEventAPI*'
    - '*Invoke-InjectGEvent*'
    - '*Invoke-SearchGmail*'
    - '*Invoke-MonitorCredSniper*'
    - '*Invoke-AddGmailRule*'
    - '*Invoke-PasswordSprayEAS*'
    - '*Invoke-UsernameHarvestEAS*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
