title: Kerberos TGT Request Using RC4 Encryption
id: 18916468-9c04-11ec-bdc6-acde48001122
status: experimental
description: The following analytic detects a Kerberos Ticket Granting Ticket (TGT) request using RC4-HMAC encryption (type
  0x17) by leveraging Event 4768. This encryption type is outdated and its presence may indicate an OverPass The Hash attack.
  Monitoring this activity is crucial as it can signify credential theft, allowing adversaries to authenticate to the Kerberos
  Distribution Center (KDC) using a stolen NTLM hash. If confirmed malicious, this could enable unauthorized access to systems
  and resources, potentially leading to lateral movement and further compromise within the network.
references:
- https://research.splunk.com/18916468-9c04-11ec-bdc6-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1550
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4768'
  sel2:
    TicketEncryptionType: '0x17'
  sel3:
    ServiceName: '*$'
  condition: (sel1 and sel2 and not sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1550/kerberos_tgt_request_using_rc4_encryption/windows-xml.log
