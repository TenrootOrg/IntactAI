title: Linux Ingress Tool Transfer with Curl
id: 8c1de57d-abc1-4b41-a727-a7a8fc5e0857
status: experimental
description: The following analytic detects the use of the curl command with specific switches (-O, -sO, -ksO, --output) commonly
  used to download remote scripts or binaries. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process names and command-line arguments. This activity is significant as it may indicate an attempt to download
  and execute potentially malicious files, often used in initial stages of an attack. If confirmed malicious, this could lead
  to unauthorized code execution, enabling attackers to compromise the system further.
references:
- https://research.splunk.com/8c1de57d-abc1-4b41-a727-a7a8fc5e0857/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1105
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/curl'
  sel2:
    CommandLine:
    - '*-O*'
    - '*-sO*'
    - '*-ksO*'
    - '*--output*'
  sel3:
    CommandLine|re: (?i)(-O|-sO|-ksO|--output)
  condition: ((sel1 and sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/atomic_red_team/curl-linux-sysmon.log
