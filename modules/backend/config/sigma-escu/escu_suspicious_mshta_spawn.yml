title: Suspicious mshta spawn
id: 4d33a488-5b5f-11eb-ae93-0242ac130002
status: experimental
description: The following analytic detects the spawning of mshta.exe by wmiprvse.exe or svchost.exe. This behavior is identified
  using Endpoint Detection and Response (EDR) data, focusing on process creation events where the parent process is either
  wmiprvse.exe or svchost.exe. This activity is significant as it may indicate the use of a DCOM object to execute malicious
  scripts via mshta.exe, a common tactic in sophisticated attacks. If confirmed malicious, this could allow an attacker to
  execute arbitrary code, potentially leading to system compromise and further malicious activities.
references:
- https://research.splunk.com/4d33a488-5b5f-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\svchost.exe'
  sel2:
    ParentImage: '*\\wmiprvse.exe'
  sel3:
    Image: '*\\mshta.exe'
  sel4:
    OriginalFileName: MSHTA.EXE
  condition: ((sel1 or sel2) and (sel3 or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.005/atomic_red_team/windows-sysmon.log
