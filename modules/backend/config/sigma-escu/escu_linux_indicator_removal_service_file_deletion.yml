title: Linux Indicator Removal Service File Deletion
id: 6c077f81-2a83-4537-afbc-0e62e3215d55
status: experimental
description: The following analytic detects the deletion of Linux service unit configuration files by suspicious processes.
  It leverages Endpoint Detection and Response (EDR) telemetry, focusing on processes executing the 'rm' command targeting
  '.service' files. This activity is significant as it may indicate malware attempting to disable critical services or security
  products, a common defense evasion tactic. If confirmed malicious, this behavior could lead to service disruption, security
  tool incapacitation, or complete system compromise, severely impacting the integrity and availability of the affected Linux
  host.
references:
- https://research.splunk.com/6c077f81-2a83-4537-afbc-0e62e3215d55/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/rm'
  sel2:
    CommandLine: '*rm *'
  sel3:
    CommandLine: '*.service'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/awfulshred/test1/sysmon_linux.log
