title: Detect HTML Help URL in Command Line
id: 8c5835b9-39d9-438b-817c-95f14c69a31e
status: experimental
description: The following analytic detects the execution of hh.exe (HTML Help) loading a Compiled HTML Help (CHM) file from
  a remote URL. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line
  executions containing URLs. This activity is significant as it can indicate an attempt to execute malicious scripts via
  CHM files, potentially leading to unauthorized code execution. If confirmed malicious, this could allow an attacker to run
  scripts using engines like JScript or VBScript, leading to further system compromise or data exfiltration.
references:
- https://research.splunk.com/8c5835b9-39d9-438b-817c-95f14c69a31e/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\hh.exe'
  sel2:
    OriginalFileName: HH.EXE
  sel3:
    CommandLine: '*http*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.001/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_network_visibility_module/cisco_nvm_flowdata/nvm_flowdata.log
