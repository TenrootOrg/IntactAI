title: Windows Service Create SliverC2
id: 89dad3ee-57ec-43dc-9044-131c4edd663f
status: experimental
description: The following analytic detects the creation of a Windows service named "Sliver" with the description "Sliver
  Implant," indicative of SliverC2 lateral movement using the PsExec module. It leverages Windows EventCode 7045 from the
  System Event log to identify this activity. This behavior is significant as it may indicate an adversary's attempt to establish
  persistence or execute commands remotely. If confirmed malicious, this activity could allow attackers to maintain control
  over the compromised system, execute arbitrary code, and further infiltrate the network.
references:
- https://research.splunk.com/89dad3ee-57ec-43dc-9044-131c4edd663f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1569.002
logsource:
  product: windows
  service: system
detection:
  sel1:
    EventID: '7045'
  sel2:
    ServiceName: sliver
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1055/sliver/sliver_windows-system.log
