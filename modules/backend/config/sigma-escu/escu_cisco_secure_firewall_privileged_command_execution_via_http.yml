title: Cisco Secure Firewall - Privileged Command Execution via HTTP
id: 0c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
status: experimental
description: 'This analytic detects HTTP requests to privileged execution paths on Cisco routers, specifically targeting the
  `/level/15/exec/-/*` endpoint using Cisco Secure Firewall Intrusion Events.

  This detection leverages Snort signature 65370 to identify requests to these sensitive endpoints, which when combined with
  other indicators may signal active exploitation or post-compromise activity.'
references:
- https://research.splunk.com/0c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Michael Haag, Splunk
tags:
- attack.t1059
- attack.t1505.003
logsource:
  product: cisco
  service: secure_firewall
detection:
  sel1:
    EventType: IntrusionEvent
  sel2:
    SignatureID: '65370'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_firewall_threat_defense/intrusion_event/intrusion_events.log
