title: SilentCleanup UAC Bypass
id: 56d7cfcc-da63-11eb-92d4-acde48001122
status: experimental
description: The following analytic detects suspicious modifications to the registry that may indicate a UAC (User Account
  Control) bypass attempt via the SilentCleanup task. It leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on registry changes in the path "*\\Environment\\windir" with executable values. This activity is significant as
  it can allow an attacker to gain high-privilege execution without user consent, bypassing UAC protections. If confirmed
  malicious, this could lead to unauthorized administrative access, enabling further system compromise and persistence.
references:
- https://research.splunk.com/56d7cfcc-da63-11eb-92d4-acde48001122/
author: Splunk Security Content (Apache-2.0), Steven Dick, Teoderick Contreras, Splunk
tags:
- attack.t1548.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Environment\\windir'
  sel2:
    Details: '*.exe*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/uac_bypass/windows-sysmon.log
