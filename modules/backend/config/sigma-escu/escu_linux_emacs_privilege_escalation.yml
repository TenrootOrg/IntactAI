title: Linux Emacs Privilege Escalation
id: 92033cab-1871-483d-a03b-a7ce98665cfc
status: experimental
description: The following analytic detects the execution of Emacs with elevated privileges using the `sudo` command and the
  `--eval` option. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs
  that include command-line arguments. This activity is significant because it indicates a potential privilege escalation
  attempt, where a user could gain root access by running Emacs with elevated permissions. If confirmed malicious, this could
  allow an attacker to execute arbitrary commands as root, leading to full system compromise and unauthorized access to sensitive
  information.
references:
- https://research.splunk.com/92033cab-1871-483d-a03b-a7ce98665cfc/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*emacs*'
  sel2:
    CommandLine: '*--eval*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/emacs/sysmon_linux.log
