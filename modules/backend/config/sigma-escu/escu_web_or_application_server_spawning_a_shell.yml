title: Web or Application Server Spawning a Shell
id: 8fdb41ad-091c-4d7a-af1d-9123fe94b539
status: experimental
description: 'The following analytic detects instances where Java, or Tomcat

  processes spawn a Linux shell, which may indicate exploitation attempts, such as

  those related to CVE-2021-44228 (Log4Shell). This detection leverages Endpoint Detection

  and Response (EDR) telemetry, focusing on process names and parent-child process

  relationships. This activity is significant as it can signify a compromised Java

  application, potentially leading to unauthorized shell access. If confirmed malicious,

  attackers could execute arbitrary commands, escalate privileges, or maintain persistent

  access, posing a severe threat to the environment.'
references:
- https://research.splunk.com/8fdb41ad-091c-4d7a-af1d-9123fe94b539/
author: Splunk Security Content (Apache-2.0), Michael Haag, Nasreddine Bencherchali, Splunk
tags:
- attack.t1190
- attack.t1133
logsource:
  category: process_creation
detection:
  sel1:
    ParentImage:
    - '*/java'
    - '*\\java'
    - '*/tomcat*'
    - '*\\tomcat*'
    - '*/httpd'
    - '*\\httpd'
    - '*/lighttpd'
    - '*\\lighttpd'
    - '*/apache2'
    - '*\\apache2'
    - '*/nginx'
    - '*\\nginx'
    - '*/node'
    - '*\\node'
    - '*/caddy'
    - '*\\caddy'
  sel2:
    Image:
    - '*/sh'
    - '*\\sh'
    - '*/ksh'
    - '*\\ksh'
    - '*/zsh'
    - '*\\zsh'
    - '*/bash'
    - '*\\bash'
    - '*/dash'
    - '*\\dash'
    - '*/rbash'
    - '*\\rbash'
    - '*/fish'
    - '*\\fish'
    - '*/csh'
    - '*\\csh'
    - '*/tcsh'
    - '*\\tcsh'
    - '*/ion'
    - '*\\ion'
    - '*/eshell'
    - '*\\eshell'
  sel3:
    ParentImage:
    - '*/httpd.exe'
    - '*\\httpd.exe'
    - '*/nginx.exe'
    - '*\\nginx.exe'
    - '*/php*.exe'
    - '*\\php*.exe'
    - '*/php-cgi.exe'
    - '*\\php-cgi.exe'
    - '*/tomcat*.exe'
    - '*\\tomcat*.exe'
    - '*/caddy.exe'
    - '*\\caddy.exe'
    - '*/UMWorkerProcess.exe'
    - '*\\UMWorkerProcess.exe'
    - '*/w3wp.exe'
    - '*\\w3wp.exe'
    - '*/ws_TomcatService.exe'
    - '*\\ws_TomcatService.exe'
    - '*/node.exe'
    - '*\\node.exe'
    - '*/java.exe'
    - '*\\java.exe'
  sel4:
    Image:
    - '*/cmd.exe'
    - '*\\cmd.exe'
    - '*/powershell.exe'
    - '*\\powershell.exe'
    - '*/powershell_ise.exe'
    - '*\\powershell_ise.exe'
    - '*/pwsh.exe'
    - '*\\pwsh.exe'
    - '*/sh.exe'
    - '*\\sh.exe'
    - '*/bash.exe'
    - '*\\bash.exe'
    - '*/wscript.exe'
    - '*\\wscript.exe'
    - '*/cscript.exe'
    - '*\\cscript.exe'
    - '*/wt.exe'
    - '*\\wt.exe'
    - '*/WindowsTerminal.exe'
    - '*\\WindowsTerminal.exe'
    - '*/mshta.exe'
    - '*\\mshta.exe'
  condition: ((sel1 and sel2) or (sel3 and sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/java/java_spawn_shell_nix.log
