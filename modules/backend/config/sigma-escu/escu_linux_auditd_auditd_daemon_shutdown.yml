title: Linux Auditd Auditd Daemon Shutdown
id: 6e2574b3-e24b-4321-ae3c-ba83a75bb714
status: experimental
description: The following analytic detects the unexpected termination of the Linux Audit daemon (auditd) by monitoring for
  log entries of type DAEMON_END. This event signifies that the audit logging service has stopped, either due to a legitimate
  system shutdown, manual administrative action, or potentially malicious tampering. Since auditd is responsible for recording
  critical security events, its sudden stoppage may indicate an attempt to disable security monitoring or evade detection
  during an attack. This detection should be correlated with system logs to determine whether the shutdown was part of routine
  maintenance or an anomaly. If confirmed as malicious, this could lead to a compromised system where security events are
  no longer being logged, allowing attackers to operate undetected. Therefore, monitoring and alerting on auditd shutdown
  events is crucial for maintaining the integrity of system security monitoring.
references:
- https://research.splunk.com/6e2574b3-e24b-4321-ae3c-ba83a75bb714/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685.004
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: DAEMON_END
  condition: sel1
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.012/auditd_daemon_end/linux_daemon_end.log
