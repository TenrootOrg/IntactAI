title: Confluence Unauthenticated Remote Code Execution CVE-2022-26134
id: fcf4bd3f-a79f-4b7a-83bf-2692d60b859c
status: experimental
description: The following analytic detects attempts to exploit CVE-2022-26134, an unauthenticated remote code execution vulnerability
  in Confluence. It leverages the Web datamodel to analyze network and CIM-compliant web logs, identifying suspicious URL
  patterns and parameters indicative of exploitation attempts. This activity is significant as it allows attackers to execute
  arbitrary code on the Confluence server without authentication, potentially leading to full system compromise. If confirmed
  malicious, this could result in unauthorized access, data exfiltration, and further lateral movement within the network.
  Immediate investigation and remediation are crucial to prevent extensive damage.
references:
- https://research.splunk.com/fcf4bd3f-a79f-4b7a-83bf-2692d60b859c/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1505
- attack.t1190
- attack.t1133
logsource:
  category: web
detection:
  sel1:
    c-uri:
    - '*${*'
    - '*%2F%7B*'
  sel2:
    c-uri: '*org.apache.commons.io.IOUtils*'
  sel3:
    c-uri: '*java.lang.Runtime@getRuntime().exec*'
  sel4:
    c-uri: '*java.lang.Runtime%40getRuntime%28%29.exec*'
  sel5:
    c-uri: '*getEngineByName*'
  sel6:
    c-uri: '*nashorn*'
  sel7:
    c-uri: '*ProcessBuilder*'
  condition: (sel1 and (((sel2 and sel3) or sel4) or (sel5 and sel6 and sel7)))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/java/confluence.log
