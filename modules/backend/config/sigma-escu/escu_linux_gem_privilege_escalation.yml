title: Linux Gem Privilege Escalation
id: 0115482a-5dcb-4bb0-bcca-5d095d224236
status: experimental
description: The following analytic detects the execution of the RubyGems utility with elevated privileges, specifically when
  it is used to run system commands as root. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on command-line executions that include "gem open -e" and "sudo". This activity is significant because it indicates
  a potential privilege escalation attempt, allowing a user to execute commands as the root user. If confirmed malicious,
  this could lead to full system compromise, enabling the attacker to gain root access and execute arbitrary commands with
  elevated privileges.
references:
- https://research.splunk.com/0115482a-5dcb-4bb0-bcca-5d095d224236/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*gem*open*-e*'
  sel2:
    CommandLine: '*-c*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/gem/sysmon_linux.log
