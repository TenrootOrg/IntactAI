title: Windows Steal Authentication Certificates Export PfxCertificate
id: 391329f3-c14b-4b8d-8b37-ac5012637360
status: experimental
description: The following analytic detects the use of the PowerShell cmdlet `export-pfxcertificate` on the command line,
  indicating an attempt to export a certificate from the local Windows Certificate Store. This detection leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process execution logs and command-line arguments. This activity
  is significant as it may indicate an attempt to exfiltrate authentication certificates, which can be used to impersonate
  users or decrypt sensitive data. If confirmed malicious, this could lead to unauthorized access and potential data breaches.
references:
- https://research.splunk.com/391329f3-c14b-4b8d-8b37-ac5012637360/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*export-pfxcertificate*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1649/atomic_red_team/export_pfxcertificate_windows-sysmon.log
