title: Ryuk Test Files Detected
id: 57d44d70-28d9-4ed1-acf5-1c80ae2bbce3
status: experimental
description: The following analytic identifies the presence of files containing the keyword "Ryuk" in any folder on the C
  drive, indicative of Ryuk ransomware activity. It leverages the Endpoint Filesystem data model to detect file paths matching
  this pattern. This activity is significant as Ryuk ransomware is known for its destructive impact, encrypting critical files
  and demanding ransom. If confirmed malicious, this could lead to significant data loss, operational disruption, and financial
  damage due to ransom payments and recovery efforts. Immediate investigation and response are crucial to mitigate potential
  damage.
references:
- https://research.splunk.com/57d44d70-28d9-4ed1-acf5-1c80ae2bbce3/
author: Splunk Security Content (Apache-2.0), Rod Soto, Jose Hernandez, Splunk
tags:
- attack.t1486
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: C:\\*Ryuk*
  condition: sel1
level: medium
x-escu:
