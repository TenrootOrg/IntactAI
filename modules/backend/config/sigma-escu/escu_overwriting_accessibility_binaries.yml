title: Overwriting Accessibility Binaries
id: 13c2f6c3-10c5-4deb-9ba1-7c4460ebe4ae
status: experimental
description: The following analytic detects modifications to Windows accessibility binaries such as sethc.exe, utilman.exe,
  osk.exe, Magnify.exe, Narrator.exe, DisplaySwitch.exe, and AtBroker.exe. It leverages filesystem activity data from the
  Endpoint.Filesystem data model to identify changes to these specific files. This activity is significant because adversaries
  can exploit these binaries to gain unauthorized access or execute commands without logging in. If confirmed malicious, this
  could allow attackers to bypass authentication mechanisms, potentially leading to unauthorized system access and further
  compromise of the environment.
references:
- https://research.splunk.com/13c2f6c3-10c5-4deb-9ba1-7c4460ebe4ae/
author: Splunk Security Content (Apache-2.0), David Dorsey, Splunk
tags:
- attack.t1546.008
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*\\Windows\\System32\\sethc.exe*'
  sel2:
    TargetFilename: '*\\Windows\\System32\\utilman.exe*'
  sel3:
    TargetFilename: '*\\Windows\\System32\\osk.exe*'
  sel4:
    TargetFilename: '*\\Windows\\System32\\Magnify.exe*'
  sel5:
    TargetFilename: '*\\Windows\\System32\\Narrator.exe*'
  sel6:
    TargetFilename: '*\\Windows\\System32\\DisplaySwitch.exe*'
  sel7:
    TargetFilename: '*\\Windows\\System32\\AtBroker.exe*'
  condition: ((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) or sel7)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1546.008/atomic_red_team/windows-sysmon.log
