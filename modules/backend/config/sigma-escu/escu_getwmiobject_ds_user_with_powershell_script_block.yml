title: GetWmiObject DS User with PowerShell Script Block
id: fabd364e-04f3-11ec-b34b-acde48001122
status: experimental
description: The following analytic detects the execution of the `Get-WmiObject` cmdlet with the `DS_User` class parameter
  via PowerShell Script Block Logging (EventCode=4104). It leverages logs to identify attempts to query all domain users using
  WMI. This activity is significant as it may indicate an adversary or Red Team operation attempting to enumerate domain users
  for situational awareness and Active Directory discovery. If confirmed malicious, this behavior could lead to further reconnaissance,
  enabling attackers to map out the network and identify potential targets for privilege escalation or lateral movement.
references:
- https://research.splunk.com/fabd364e-04f3-11ec-b34b-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*get-wmiobject*'
  sel3:
    ScriptBlockText: '*ds_user*'
  sel4:
    ScriptBlockText: '*-namespace*'
  sel5:
    ScriptBlockText: '*root\\directory\\ldap*'
  condition: (sel1 and sel2 and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
