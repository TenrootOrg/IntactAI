title: Sdelete Application Execution
id: 31702fc0-2682-11ec-85c3-acde48001122
status: experimental
description: The following analytic detects the execution of the sdelete.exe application, a Sysinternals tool often used by
  adversaries to securely delete files and remove forensic evidence from a targeted host. This detection leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process execution logs. Monitoring this activity is crucial as
  sdelete.exe is not commonly used in regular operations and its presence may indicate an attempt to cover malicious activities.
  If confirmed malicious, this could lead to the loss of critical forensic data, hindering incident response and investigation
  efforts.
references:
- https://research.splunk.com/31702fc0-2682-11ec-85c3-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
- attack.t1485
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sdelete.exe'
  sel2:
    OriginalFileName: sdelete.exe
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1485/sdelete/sysmon.log
