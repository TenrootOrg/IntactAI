title: Linux Deletion of SSL Certificate
id: 839ab790-a60a-4f81-bfb3-02567063f615
status: experimental
description: The following analytic detects the deletion of SSL certificates on a Linux machine. It leverages filesystem event
  logs to identify when files with extensions .pem or .crt are deleted from the /etc/ssl/certs/ directory. This activity is
  significant because attackers may delete or modify SSL certificates to disable security features or evade defenses on a
  compromised system. If confirmed malicious, this behavior could indicate an attempt to disrupt secure communications, evade
  detection, or execute a destructive payload, potentially leading to significant security breaches and data loss.
references:
- https://research.splunk.com/839ab790-a60a-4f81-bfb3-02567063f615/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
- attack.t1485
logsource:
  category: file_delete
  product: linux
detection:
  sel1:
    TargetFilename: /etc/ssl/certs/*
  sel2:
    TargetFilename:
    - '*.pem'
    - '*.crt'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/acidrain/sysmon_linux.log
