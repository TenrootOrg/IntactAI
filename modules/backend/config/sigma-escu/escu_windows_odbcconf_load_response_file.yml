title: Windows Odbcconf Load Response File
id: 1acafff9-1347-4b40-abae-f35aa4ba85c1
status: experimental
description: The following analytic detects the execution of odbcconf.exe with a response file, which may contain commands
  to load a DLL (REGSVR) or other instructions. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process names and command-line arguments. This activity is significant as it may indicate an attempt to execute
  arbitrary code or load malicious DLLs, potentially leading to unauthorized actions. If confirmed malicious, this could allow
  an attacker to gain code execution, escalate privileges, or establish persistence within the environment.
references:
- https://research.splunk.com/1acafff9-1347-4b40-abae-f35aa4ba85c1/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.008
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\odbcconf.exe'
  sel2:
    CommandLine:
    - '*-f *'
    - '*/f *'
  sel3:
    CommandLine: '*.rsp*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.008/atomic_red_team/windows-sysmon-odbc-rsp.log
