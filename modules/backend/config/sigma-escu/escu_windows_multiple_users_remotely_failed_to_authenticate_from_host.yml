title: Windows Multiple Users Remotely Failed To Authenticate From Host (counted event)
id: 80f9d53e-9ca1-11eb-b0d6-acde48001122-base
status: experimental
description: The following analytic identifies a source host failing to authenticate against a remote host with 30 unique
  users. It leverages Windows Event 4625 with Logon Type 3, indicating remote authentication attempts. This behavior is significant
  as it may indicate a Password Spraying attack, where an adversary attempts to gain initial access or elevate privileges
  in an Active Directory environment. If confirmed malicious, this activity could lead to unauthorized access, privilege escalation,
  and potential compromise of sensitive information. This detection is crucial for real-time security monitoring and threat
  hunting.
references:
- https://research.splunk.com/80f9d53e-9ca1-11eb-b0d6-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4625'
  sel2:
    LogonType: '3'
  sel3:
    IpAddress: '-'
  condition: (sel1 and sel2 and not sel3)
level: informational
name: escu_base_windows_multiple_users_remotely_failed_to_authenticate_from_host
