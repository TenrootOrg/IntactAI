title: Azure AD New MFA Method Registered For User
id: 2628b087-4189-403f-9044-87403f777a1b
status: experimental
description: The following analytic detects the registration of a new Multi-Factor Authentication (MFA) method for an Azure
  AD account. It leverages Azure AD AuditLogs to identify when a user registers new security information. This activity is
  significant because adversaries who gain unauthorized access to an account may add their own MFA method to maintain persistence.
  If confirmed malicious, this could allow attackers to bypass existing security controls, maintain long-term access, and
  potentially escalate their privileges within the environment.
references:
- https://research.splunk.com/2628b087-4189-403f-9044-87403f777a1b/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1556.006
logsource:
  product: azure
detection:
  sel1:
    category: AuditLogs
  sel2:
    operationName: User registered security info
  sel3:
    properties.operationType: Add
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556.006/azure_ad_new_mfa_method_registered_for_user/azuread.log
