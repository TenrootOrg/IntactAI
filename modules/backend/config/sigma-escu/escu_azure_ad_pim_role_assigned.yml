title: Azure AD PIM Role Assigned
id: fcd6dfeb-191c-46a0-a29c-c306382145ab
status: experimental
description: The following analytic detects the assignment of an Azure AD Privileged Identity Management (PIM) role. It leverages
  Azure Active Directory events to identify when a user is added as an eligible member to a PIM role. This activity is significant
  because PIM roles grant elevated privileges, and their assignment should be closely monitored to prevent unauthorized access.
  If confirmed malicious, an attacker could exploit this to gain privileged access, potentially leading to unauthorized actions,
  data breaches, or further compromise of the environment.
references:
- https://research.splunk.com/fcd6dfeb-191c-46a0-a29c-c306382145ab/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1098.003
logsource:
  product: azure
detection:
  sel1:
    operationName: Add eligible member to role in PIM completed*
  condition: sel1
level: medium
x-escu:
