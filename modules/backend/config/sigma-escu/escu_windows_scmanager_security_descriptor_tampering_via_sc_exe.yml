title: Windows ScManager Security Descriptor Tampering Via Sc.EXE
id: 04023928-0381-4935-82cb-03372b2ef644
status: experimental
description: The following analytic detects changes in the ScManager service security descriptor settings. It leverages data
  from Endpoint Detection and Response (EDR) agents, specifically searching for any process execution involving the "sc.exe"
  binary with the "sdset" flag targeting the "scmanager" service. If confirmed malicious, this could allow an attacker to
  escalate their privileges.
references:
- https://research.splunk.com/04023928-0381-4935-82cb-03372b2ef644/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Michael Haag, Splunk
tags:
- attack.t1569.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sc.exe'
  sel2:
    OriginalFileName: sc.exe
  sel3:
    CommandLine: '*sdset *'
  sel4:
    CommandLine: '*scmanager*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1569.002/scmanager_sddl_tamper/scmanager_sddl_tamper_sysmon.log
