title: Windows Credential Dumping LSASS Memory Createdump
id: b3b7ce35-fce5-4c73-85f4-700aeada81a9
status: experimental
description: The following analytic detects the use of CreateDump.exe to perform a process dump. This binary is not native
  to Windows and is often introduced by third-party applications, including PowerShell 7. The detection leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process names, GUIDs, and complete command-line executions. This
  activity is significant as it may indicate an attempt to dump LSASS memory, which can be used to extract credentials. If
  confirmed malicious, this could lead to unauthorized access and lateral movement within the network.
references:
- https://research.splunk.com/b3b7ce35-fce5-4c73-85f4-700aeada81a9/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\createdump.exe'
  sel2:
    OriginalFileName: FX_VER_INTERNALNAME_STR
  sel3:
    CommandLine: '*-u *'
  sel4:
    CommandLine: '*-f *'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.001/atomic_red_team/createdump_windows-sysmon.log
