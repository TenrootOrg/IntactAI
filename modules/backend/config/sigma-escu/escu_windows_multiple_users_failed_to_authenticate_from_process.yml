title: Windows Multiple Users Failed To Authenticate From Process (counted event)
id: 9015385a-9c84-11eb-bef2-acde48001122-base
status: experimental
description: The following analytic detects a source process failing to authenticate with 30 unique users, indicating a potential
  Password Spraying attack. It leverages Windows Event 4625 with Logon Type 2, collected from domain controllers, member servers,
  and workstations. This activity is significant as it may represent an adversary attempting to gain initial access or elevate
  privileges within an Active Directory environment. If confirmed malicious, this could lead to unauthorized access, privilege
  escalation, or further compromise of the network, posing a severe security risk.
references:
- https://research.splunk.com/9015385a-9c84-11eb-bef2-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4625'
  sel2:
    LogonType: '2'
  sel3:
    ProcessName: '-'
  condition: (sel1 and sel2 and not sel3)
level: informational
name: escu_base_windows_multiple_users_failed_to_authenticate_from_process
