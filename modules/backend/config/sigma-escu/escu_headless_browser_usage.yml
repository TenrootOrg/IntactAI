title: Headless Browser Usage
id: 869ba261-c272-47d7-affe-5c0aa85c93d6
status: experimental
description: The following analytic detects the usage of headless browsers within an organization. It identifies processes
  containing the "--headless" and "--disable-gpu" command line arguments, which are indicative of headless browsing. This
  detection leverages data from the Endpoint.Processes datamodel to identify such processes. Monitoring headless browser usage
  is significant as these tools can be exploited by adversaries for malicious activities like web scraping, automated testing,
  and undetected web interactions. If confirmed malicious, this activity could lead to unauthorized data extraction, automated
  attacks, or other covert operations on web applications.
references:
- https://research.splunk.com/869ba261-c272-47d7-affe-5c0aa85c93d6/
author: Splunk Security Content (Apache-2.0), Michael Haag, Teoderick Contreras, Splunk
tags:
- attack.t1497
- attack.t1564.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\Chrome.exe'
    - '*\\Brave.exe'
    - '*\\Opera.exe'
    - '*\\Vivaldi.exe'
    - '*\\msedge.exe'
  sel2:
    CommandLine: '*--headless*'
  sel3:
    CommandLine: '*--disable-gpu*'
  condition: (sel1 and (sel2 and sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1185/headlessbrowser/headless_mockbin.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1497/headless_browser/headless_chrome.log
