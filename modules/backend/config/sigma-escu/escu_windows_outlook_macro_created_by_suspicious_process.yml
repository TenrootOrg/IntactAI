title: Windows Outlook Macro Created by Suspicious Process
id: 3ec347e3-a94a-4a8b-a918-8306ea403182
status: experimental
description: The following analytic detects the creation of an Outlook Macro (VbaProject.OTM) by a suspicious process. This
  file is normally created when you create a macro from within Outlook. If this file is created by a process other than Outlook.exe
  it may be maliciously created. This detection leverages data from the Filesystem datamodel, specifically looking for the
  file creation event for VbaProject.OTM. This activity is significant as it is commonly associated with some malware infections,
  indicating potential malicious intent to harvest email information.
references:
- https://research.splunk.com/3ec347e3-a94a-4a8b-a918-8306ea403182/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1137
- attack.t1059.005
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*Appdata\\Roaming\\Microsoft\\Outlook\\VbaProject.OTM'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/notdoor/outlook_macro/windows-sysmon.log
