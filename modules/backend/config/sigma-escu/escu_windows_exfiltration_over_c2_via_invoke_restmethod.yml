title: Windows Exfiltration Over C2 Via Invoke RestMethod
id: 06ade821-f6fa-40d0-80af-15bc1d45b3ba
status: experimental
description: The following analytic detects potential data exfiltration using PowerShell's Invoke-RestMethod. It leverages
  PowerShell Script Block Logging to identify scripts that attempt to upload files via HTTP POST requests. This activity is
  significant as it may indicate an attacker is exfiltrating sensitive data, such as desktop screenshots or files, to an external
  command and control (C2) server. If confirmed malicious, this could lead to data breaches, loss of sensitive information,
  and further compromise of the affected systems. Immediate investigation is recommended to determine the intent and scope
  of the activity.
references:
- https://research.splunk.com/06ade821-f6fa-40d0-80af-15bc1d45b3ba/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1041
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Invoke-RestMethod *'
  sel3:
    ScriptBlockText: '* -Uri *'
  sel4:
    ScriptBlockText: '* -Method *'
  sel5:
    ScriptBlockText: '* Post *'
  sel6:
    ScriptBlockText: '* -InFile *'
  condition: (sel1 and sel2 and sel3 and sel4 and sel5 and sel6)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/winter-vivern/pwh_exfiltration/windows-powershell-xml.log
