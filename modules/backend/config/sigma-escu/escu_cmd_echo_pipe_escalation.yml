title: CMD Echo Pipe - Escalation
id: eb277ba0-b96b-11eb-b00e-acde48001122
status: experimental
description: The following analytic identifies the use of named-pipe impersonation for privilege escalation, commonly associated
  with Cobalt Strike and similar frameworks. It detects command-line executions where `cmd.exe` uses `echo` to write to a
  named pipe, such as `cmd.exe /c echo 4sgryt3436 > \\.\Pipe\5erg53`. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process and command-line telemetry. This activity is significant as it indicates
  potential privilege escalation attempts. If confirmed malicious, attackers could gain elevated privileges, enabling further
  compromise and persistence within the environment.
references:
- https://research.splunk.com/eb277ba0-b96b-11eb-b00e-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.003
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    OriginalFileName: Cmd.Exe
  sel3:
    CommandLine: '*%comspec%*'
  sel4:
    CommandLine: '*echo*'
  sel5:
    CommandLine: '*pipe*'
  condition: (((sel1 or sel2) or sel3) and (sel4 and sel5))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1055/cobalt_strike/windows-sysmon.log
