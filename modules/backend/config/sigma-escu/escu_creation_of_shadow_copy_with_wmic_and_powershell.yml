title: Creation of Shadow Copy with wmic and powershell
id: 2ed8b538-d284-449a-be1d-82ad1dbd186b
status: experimental
description: The following analytic detects the creation of shadow copies using "wmic" or "Powershell" commands. It leverages
  the Endpoint.Processes data model in Splunk to identify processes where the command includes "shadowcopy" and "create".
  This activity is significant because it may indicate an attacker attempting to manipulate or access data in an unauthorized
  manner, potentially leading to data theft or manipulation. If confirmed malicious, this behavior could allow attackers to
  backup and exfiltrate sensitive data or hide their tracks by restoring files to a previous state after an attack.
references:
- https://research.splunk.com/2ed8b538-d284-449a-be1d-82ad1dbd186b/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\wmic.exe'
  sel2:
    OriginalFileName: wmic.exe
  sel3:
    Image: '*\\pwsh.exe'
  sel4:
    Image: '*\\powershell.exe'
  sel5:
    OriginalFileName: pwsh.dll
  sel6:
    OriginalFileName: PowerShell.EXE
  sel7:
    OriginalFileName: powershell_ise.EXE
  sel8:
    Image: '*\\powershell_ise.exe'
  sel9:
    CommandLine: '*shadowcopy*'
  sel10:
    CommandLine: '*create*'
  condition: (((sel1 or sel2) or (((((sel3 or sel4) or sel5) or sel6) or sel7) or sel8)) and sel9 and sel10)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.003/atomic_red_team/windows-sysmon.log
