title: Get-ForestTrust with PowerShell Script Block
id: 70fac80e-0bf1-11ec-9ba0-acde48001122
status: experimental
description: The following analytic detects the execution of the Get-ForestTrust command from PowerSploit using PowerShell
  Script Block Logging (EventCode=4104). This method captures the full command sent to PowerShell, providing detailed visibility
  into potentially suspicious activities. Monitoring this behavior is crucial as it can indicate an attempt to gather domain
  trust information, which is often a precursor to lateral movement or privilege escalation. If confirmed malicious, this
  activity could allow an attacker to map trust relationships within the domain, facilitating further exploitation and access
  to sensitive resources.
references:
- https://research.splunk.com/70fac80e-0bf1-11ec-9ba0-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1482
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*get-foresttrust*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1482/discovery/windows-powershell-xml.log
