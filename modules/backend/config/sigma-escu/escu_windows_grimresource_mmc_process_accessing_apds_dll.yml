title: Windows GrimResource - MMC Process Accessing APDS DLL
id: 872d1651-7838-4b47-ad3e-ef5e63453a7f
status: experimental
description: 'GrimResource is a code execution technique discovered by Elastic Security in 2024 that abuses a stored XSS vulnerability
  in apds.dll to achieve arbitrary code execution inside mmc.exe, a signed, trusted Windows binary.

  The attack is delivered via a malicious .msc file (MMC Saved Console file).

  When the victim opens the .msc file, MMC processes an embedded transformNode operation that triggers the XSS in apds.dll,
  which is then leveraged to execute attacker-controlled script within the MMC process context.'
references:
- https://research.splunk.com/872d1651-7838-4b47-ad3e-ef5e63453a7f/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1059.007
- attack.t1218.014
logsource:
  product: windows
  service: security
detection:
  sel1:
    AccessList: '%%4416'
  sel2:
    EventID: '4663'
  sel3:
    ObjectName: '*:\\Windows\\System32\\apds.dll'
  sel4:
    ProcessName: '*:\\Windows\\System32\\mmc.exe'
  condition: (sel1 and sel2 and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.007/snapattack/snapattack.log
