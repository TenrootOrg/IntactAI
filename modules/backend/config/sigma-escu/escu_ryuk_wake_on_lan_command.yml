title: Ryuk Wake on LAN Command
id: 538d0152-7aaa-11eb-beaa-acde48001122
status: experimental
description: The following analytic detects the use of Wake-on-LAN commands associated with Ryuk ransomware. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on specific process and command-line activities. This behavior
  is significant as Ryuk ransomware uses Wake-on-LAN to power on devices in a compromised network, increasing its encryption
  success rate. If confirmed malicious, this activity could lead to widespread ransomware encryption across multiple endpoints,
  causing significant operational disruption and data loss. Immediate isolation and thorough investigation of the affected
  endpoints are crucial to mitigate the impact.
references:
- https://research.splunk.com/538d0152-7aaa-11eb-beaa-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine:
    - '* 8 LAN'
    - '* 8 LAN *'
    - '* 9 REP'
    - '* 9 REP *'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.003/ryuk/windows-sysmon.log
