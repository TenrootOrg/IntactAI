title: Windows Firewall Rule Deletion
id: ca5327e1-0a91-4e23-bbd4-8901806c00e1
status: experimental
description: This detection identifies instances where a Windows Firewall rule has been deleted, potentially exposing the
  system to security risks. Unauthorized removal of firewall rules can indicate an attacker attempting to bypass security
  controls or malware disabling protections for persistence and command-and-control communication. The event logs details
  such as the deleted rule name, protocol, port, and the user responsible for the action. Security teams should monitor for
  unexpected deletions, correlate with related events, and investigate anomalies to prevent unauthorized access and maintain
  network security posture.
