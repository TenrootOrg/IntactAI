title: Windows RDP Login Session Was Established
id: 00ca7f9e-88ab-4841-a6c2-83979ab1ed29
status: experimental
description: The following analytic detects instances where a successful Remote Desktop Protocol (RDP) login session was established,
  as indicated by Windows Security Event ID 4624 with Logon Type 10. This event confirms that a user has not only provided
  valid credentials but has also initiated a full interactive RDP session. It is a key indicator of successful remote access
  to a Windows system. When correlated with Event ID 1149, which logs RDP authentication success, this analytic helps distinguish
  between mere credential acceptance and actual session establishment—critical for effective monitoring and threat detection.
references:
- https://research.splunk.com/00ca7f9e-88ab-4841-a6c2-83979ab1ed29/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1021.001
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4624'
  sel2:
    LogonType: '10'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.001/rdp_session_established/4624_10_logon.log
