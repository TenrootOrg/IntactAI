title: Windows RunMRU Command Execution
id: a15aa1ab-2b79-467f-8201-65e0f32d5b1a
status: experimental
description: The following analytic detects modifications to the Windows RunMRU registry key, which stores a history of commands
  executed through the Run dialog box (Windows+R). It leverages Endpoint Detection and Response (EDR) telemetry to monitor
  registry events targeting this key. This activity is significant as malware often uses the Run dialog to execute malicious
  commands while attempting to appear legitimate. If confirmed malicious, this could indicate an attacker using indirect command
  execution techniques for defense evasion or persistence. The detection excludes MRUList value changes to focus on actual
  command entries.
references:
- https://research.splunk.com/a15aa1ab-2b79-467f-8201-65e0f32d5b1a/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Michael Haag, Splunk
tags:
- attack.t1202
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU*'
  sel2:
    TargetObject: '*\\MRUList'
  sel3:
    Details:
    - '* (unknown)'
    - unknown
  condition: (sel1 and not (sel2) and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1202/atomic_red_team/windows-sysmon_runmru.log
x-intact-burst: false
x-intact: 'Fired 9 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
