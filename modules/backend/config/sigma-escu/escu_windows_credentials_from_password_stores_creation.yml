title: Windows Credentials from Password Stores Creation
id: c0c5a479-bf57-4ca0-af3a-4c7081e5ba05
status: experimental
description: The following analytic detects the execution of the Windows OS tool cmdkey.exe, which is used to create stored
  usernames, passwords, or credentials. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process execution logs and command-line arguments. This activity is significant because cmdkey.exe is often abused by
  post-exploitation tools and malware, such as Darkgate, to gain unauthorized access. If confirmed malicious, this behavior
  could allow attackers to escalate privileges and maintain persistence on the targeted host, facilitating further attacks
  and potential data breaches.
references:
- https://research.splunk.com/c0c5a479-bf57-4ca0-af3a-4c7081e5ba05/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmdkey.exe'
  sel2:
    OriginalFileName: cmdkey.exe
  sel3:
    CommandLine: '*/generic*'
  sel4:
    CommandLine:
    - '*/user*'
    - '*/password*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555/cmdkey_create_credential_store/cmdkey_gen_sys.log
