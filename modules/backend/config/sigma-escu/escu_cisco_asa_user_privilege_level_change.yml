title: Cisco ASA - User Privilege Level Change
id: 5f7d8c3e-9a2b-4d6f-8e1c-3b5a9d7f2c4e
status: experimental
description: 'This analytic detects privilege level changes for user accounts on Cisco ASA devices via CLI or ASDM.

  Adversaries may escalate account privileges to gain elevated access to network infrastructure, enable additional command
  execution capabilities, or establish higher-level persistent access. Privilege levels on Cisco ASA range from 0 (lowest)
  to 15 (full administrative access), with level 15 providing complete device control.

  The detection monitors for ASA message ID 502103, which is generated whenever a user account''s privilege level is modified,
  capturing both the old and new privilege levels along with the username and administrator who made the change.

  Investigate unexpected privilege changes, especially escalations to level 15, substantial privilege increases (e.g., from
  level 1 to 15), changes performed outside business hours, changes by non-administrative users, or changes without corresponding
  change management tickets.'
references:
- https://research.splunk.com/5f7d8c3e-9a2b-4d6f-8e1c-3b5a9d7f2c4e/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
