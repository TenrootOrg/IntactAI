title: Cisco ASA - Packet Capture Activity
id: 7e9c3f8a-4b2d-4c5e-9a1f-6d8e5b3c2a9f
status: experimental
description: 'This analytic detects execution of packet capture commands on Cisco ASA devices via CLI or ASDM.

  Adversaries may abuse the built-in packet capture functionality to perform network sniffing, intercept credentials transmitted
  over the network, capture sensitive data in transit, or gather intelligence about network traffic patterns and internal
  communications. Packet captures can reveal usernames, passwords, session tokens, and confidential business data.

  The detection monitors for command execution events (message ID 111008 or 111010) containing "capture" commands, which are
  used to initiate packet capture sessions on specific interfaces or for specific traffic patterns on the ASA device.

  Investigate unauthorized packet capture activities, especially captures targeting sensitive interfaces (internal network
  segments, DMZ), captures configured to capture large volumes of traffic, captures with suspicious filter criteria, captures
  initiated by non-administrative accounts, or captures durin'
references:
- https://research.splunk.com/7e9c3f8a-4b2d-4c5e-9a1f-6d8e5b3c2a9f/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1040
- attack.t1557
logsource:
  product: cisco
  service: asa
detection:
  sel1:
    message_id:
    - '111008'
    - '111010'
  sel2:
    command: capture *
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_asa/generic/cisco_asa_generic_logs.log
