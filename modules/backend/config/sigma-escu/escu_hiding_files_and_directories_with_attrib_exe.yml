title: Hiding Files And Directories With Attrib exe
id: 6e5a3ae4-90a3-462d-9aa6-0119f638c0f1
status: experimental
description: The following analytic detects the use of the Windows binary attrib.exe to hide files or directories by marking
  them with specific flags. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line
  arguments that include the "+h" flag. This activity is significant because hiding files can be a tactic used by attackers
  to conceal malicious files or tools from users and security software. If confirmed malicious, this behavior could allow
  an attacker to persist in the environment undetected, potentially leading to further compromise or data exfiltration.
references:
- https://research.splunk.com/6e5a3ae4-90a3-462d-9aa6-0119f638c0f1/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\attrib.exe'
  sel2:
    CommandLine: '*+h*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1222.001/atomic_red_team/windows-sysmon.log
