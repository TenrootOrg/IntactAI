title: Resize ShadowStorage volume
id: bc760ca6-8336-11eb-bcbb-acde48001122
status: experimental
description: The following analytic identifies the resizing of shadow storage volumes, a technique used by ransomware like
  CLOP to prevent the recreation of shadow volumes. This detection leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on command-line executions involving "vssadmin.exe" with parameters related to resizing shadow storage.
  This activity is significant as it indicates an attempt to hinder recovery efforts by manipulating shadow copies. If confirmed
  malicious, this could lead to successful ransomware deployment, making data recovery difficult and increasing the potential
  for data loss.
references:
- https://research.splunk.com/bc760ca6-8336-11eb-bcbb-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras
tags:
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\cmd.exe'
  sel2:
    ParentImage: '*\\powershell.exe'
  sel3:
    ParentImage: '*\\powershell_ise.exe'
  sel4:
    ParentImage: '*\\wmic.exe'
  sel5:
    Image: '*\\vssadmin.exe'
  sel6:
    CommandLine: '*resize*'
  sel7:
    CommandLine: '*shadowstorage*'
  sel8:
    CommandLine: '*/maxsize*'
  condition: ((((sel1 or sel2) or sel3) or sel4) and sel5 and sel6 and sel7 and sel8)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/clop/clop_a/windows-sysmon.log
