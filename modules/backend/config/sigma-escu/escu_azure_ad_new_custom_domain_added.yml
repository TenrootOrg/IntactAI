title: Azure AD New Custom Domain Added
id: 30c47f45-dd6a-4720-9963-0bca6c8686ef
status: experimental
description: The following analytic detects the addition of a new custom domain within an Azure Active Directory (AD) tenant.
  It leverages Azure AD AuditLogs to identify successful "Add unverified domain" operations. This activity is significant
  as it may indicate an adversary attempting to establish persistence by setting up identity federation backdoors, allowing
  them to impersonate users and bypass authentication mechanisms. If confirmed malicious, this could enable attackers to gain
  unauthorized access, escalate privileges, and maintain long-term access to the Azure AD environment, posing a severe security
  risk.
references:
- https://research.splunk.com/30c47f45-dd6a-4720-9963-0bca6c8686ef/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Gowthamaraj Rajendran, Splunk
tags:
- attack.t1484.002
logsource:
  product: azure
detection:
  sel1:
    operationName: Add unverified domain
  sel2:
    properties.result: success
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1484.002/new_federated_domain/azure-audit.log
