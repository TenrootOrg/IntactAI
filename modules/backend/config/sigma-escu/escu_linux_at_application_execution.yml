title: Linux At Application Execution
id: bf0a378e-5f3c-11ec-a6de-acde48001122
status: experimental
description: The following analytic detects the execution of the "At" application in Linux, which can be used by attackers
  to create persistence entries on a compromised host. This detection leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process names and parent process names associated with "at" or "atd". This activity is significant
  because the "At" application can be exploited to maintain unauthorized access or deliver additional malicious payloads.
  If confirmed malicious, this behavior could lead to data theft, ransomware attacks, or other severe consequences. Immediate
  investigation is required to determine the legitimacy of the execution and mitigate potential risks.
references:
- https://research.splunk.com/bf0a378e-5f3c-11ec-a6de-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Bhavin Patel, Splunk
tags:
- attack.t1053.002
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/at'
    - '*/atd'
  sel2:
    ParentImage:
    - '*/at'
    - '*/atd'
  condition: (sel1 or sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.002/at_execution/sysmon_linux.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_isovalent/cisco_isovalent.log
