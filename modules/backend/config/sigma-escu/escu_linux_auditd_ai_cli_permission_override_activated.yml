title: Linux Auditd AI CLI Permission Override Activated
id: 737e8baa-d44e-4fa9-8281-24056ed424c0
status: experimental
description: 'This detection identifies when an AI command-line tool is launched in an unsafe mode that bypasses normal safety
  checks and user approvals.

  For instance, running claude --dangerously-skip-permissions skips all safety restrictions, allowing the tool to operate
  freely, while gemini --yolo automatically approves all actions without prompting the user.

  These modes, often called permission overrides or YOLO mode, let the AI execute commands, modify files, or perform tasks
  without confirmation.

  Detecting their use is important to prevent unintended or potentially harmful operations.'
references:
- https://research.splunk.com/737e8baa-d44e-4fa9-8281-24056ed424c0/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1480
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle: '*gemini*'
  sel2:
    proctitle:
    - '*--yolo*'
    - '*-y *'
  sel3:
    proctitle: '*claude*'
  sel4:
    proctitle: '*--dangerously-skip-permissions*'
  condition: ((sel1 and sel2) or (sel3 and sel4))
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1480/ai_cli_override/gemini_yolo.log
