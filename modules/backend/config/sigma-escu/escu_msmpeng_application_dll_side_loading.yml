title: Msmpeng Application DLL Side Loading
id: 8bb3f280-dd9b-11eb-84d5-acde48001122
status: experimental
description: The following analytic detects the suspicious creation of msmpeng.exe or mpsvc.dll in non-default Windows Defender
  folders. It leverages the Endpoint.Filesystem datamodel to identify instances where these files are created outside their
  expected directories. This activity is significant because it is associated with the REvil ransomware, which uses DLL side-loading
  to execute malicious payloads. If confirmed malicious, this could lead to ransomware deployment, resulting in data encryption,
  system compromise, and potential data loss or extortion.
references:
- https://research.splunk.com/8bb3f280-dd9b-11eb-84d5-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk, Sanjay Govind
tags:
- attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*\\msmpeng.exe'
  sel2:
    TargetFilename: '*\\mpsvc.dll'
  sel3:
    TargetFilename:
    - '*\\Program Files\\windows defender\\*'
    - '*\\WinSxS\\*defender-service*'
    - '*\\WinSxS\\Temp\\*defender-service*'
  condition: ((sel1 or sel2) and not (sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/revil/msmpeng_side/windows-sysmon.log
