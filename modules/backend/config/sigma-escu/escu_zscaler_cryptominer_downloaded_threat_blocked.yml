title: Zscaler CryptoMiner Downloaded Threat Blocked
id: ed76ce37-bab9-4ec0-bf3e-9c6a6cf43365
status: experimental
description: The following analytic identifies attempts to download cryptomining software that are blocked by Zscaler. It
  leverages web proxy logs to detect blocked actions associated with cryptominer threats, analyzing key data points such as
  device owner, user, URL category, destination URL, and IP. This activity is significant for a SOC as it helps in early identification
  and mitigation of cryptomining activities, which can compromise network integrity and resource availability. If confirmed
  malicious, this activity could lead to unauthorized use of network resources for cryptomining, potentially degrading system
  performance and increasing operational costs.
references:
- https://research.splunk.com/ed76ce37-bab9-4ec0-bf3e-9c6a6cf43365/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Rod Soto, Splunk
tags:
- attack.t1566
logsource:
  category: proxy
detection:
  sel1:
    action: blocked
  sel2:
    threatname: '*miner*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566/zscalar_web_proxy/zscalar_web_proxy.json
