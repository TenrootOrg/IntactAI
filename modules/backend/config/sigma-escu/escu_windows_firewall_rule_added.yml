title: Windows Firewall Rule Added
id: efc25501-4e75-4075-8cc5-ac80f2847d80
status: experimental
description: This detection identifies instances where a Windows Firewall rule is added by monitoring Event ID 4946 in the
  Windows Security Event Log. Firewall rule modifications can indicate legitimate administrative actions, but they may also
  signal unauthorized changes, misconfigurations, or malicious activity such as attackers allowing traffic for backdoors or
  persistence mechanisms. By analyzing fields like RuleName, RuleId, Computer, and ProfileChanged, security teams can determine
  whether the change aligns with expected behavior. Correlating with user activity and process execution can help distinguish
  false positives from real threats, ensuring better visibility into potential security risks.
