title: Linux Auditd Find Credentials From Password Managers
id: 784241aa-85a5-4782-a503-d071bd3446f9
status: experimental
description: The following analytic detects suspicious attempts to find credentials stored in password managers, which may
  indicate an attacker's effort to retrieve sensitive login information. Password managers are often targeted by adversaries
  seeking to access stored passwords for further compromise or lateral movement within a network. By monitoring for unusual
  or unauthorized access to password manager files or processes, this analytic helps identify potential credential theft attempts,
  enabling security teams to respond quickly to protect critical accounts and prevent further unauthorized access.
references:
- https://research.splunk.com/784241aa-85a5-4782-a503-d071bd3446f9/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555.005
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    CommandLine:
    - '*find*'
    - '*grep*'
  sel2:
    CommandLine:
    - '*.kdbx*'
    - '*KeePass*'
    - '*.enforced*'
    - '*.lpdb*'
    - '*.opvault*'
    - '*.agilekeychain*'
    - '*.dashlane*'
    - '*.rfx*'
    - '*passbolt*'
    - '*.spdb*'
    - '*StickyPassword*'
    - '*.walletx*'
    - '*enpass*'
    - '*vault*'
    - '*.kdb*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.005/linux_auditd_find_password_db/auditd_execve_pwd_mgr.log
