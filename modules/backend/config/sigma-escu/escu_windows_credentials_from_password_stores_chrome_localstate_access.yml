title: Windows Credentials from Password Stores Chrome LocalState Access
id: 3b1d09a8-a26f-473e-a510-6c6613573657
status: experimental
description: 'The following analytic detects non-Chrome processes accessing the Chrome "Local State" file, which contains
  critical settings and information. It leverages Windows Security Event logs, specifically event code 4663, to identify this
  behavior.

  This activity is significant because threat actors can exploit this file to extract the encrypted master key used for decrypting
  saved passwords in Chrome.

  If confirmed malicious, this could lead to unauthorized access to sensitive information, posing a severe security risk.

  Monitoring this anomaly helps identify potential threats and safeguard browser-stored data.'
references:
- https://research.splunk.com/3b1d09a8-a26f-473e-a510-6c6613573657/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ObjectName: '*\\AppData\\Local\\Google\\Chrome\\User Data\\Local State'
  sel3:
    ProcessName:
    - '*:\\Windows\\explorer.exe'
    - '*\\AppData\\Local\\Google\\Chrome Beta\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome Dev\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome SxS\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome Unstable\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe'
    - '*\\platform_experience_helper.exe*'
    - '*:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe*'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/redline/chrome_local_state_simulate_access/redline-localstate-smalldata-xml.log
