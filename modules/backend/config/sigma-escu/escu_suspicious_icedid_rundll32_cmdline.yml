title: Suspicious IcedID Rundll32 Cmdline
id: bed761f8-ee29-11eb-8bf3-acde48001122
status: experimental
description: The following analytic detects a suspicious `rundll32.exe` command line used to execute a DLL file, a technique
  associated with IcedID malware. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line
  executions containing the pattern `*/i:*`. This activity is significant as it indicates potential malware attempting to
  load an encrypted DLL payload, often named `license.dat`. If confirmed malicious, this could allow attackers to execute
  arbitrary code, leading to further system compromise and potential data exfiltration.
references:
- https://research.splunk.com/bed761f8-ee29-11eb-8bf3-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rundll32.exe'
  sel2:
    OriginalFileName: RUNDLL32.EXE
  sel3:
    CommandLine: '*/i:*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/icedid/inf_icedid/windows-sysmon.log
