title: Cisco ASA - Logging Message Suppression
id: 4e6c9d2a-8f3b-4c7e-9a5f-2d8b6e1c4a9f
status: experimental
description: 'This analytic detects suppression of specific logging messages on Cisco ASA devices using the "no logging message"
  command.

  Adversaries may suppress specific log message IDs to selectively disable logging of security-critical events such as authentication
  failures, configuration changes, or suspicious network activity. This targeted approach allows attackers to evade detection
  while maintaining normal logging operations that might otherwise alert administrators to complete logging disablement.

  The detection monitors for command execution events (message ID 111008 or 111010) containing the "no logging message" command,
  which is used to suppress specific message IDs from being logged regardless of the configured severity level.

  Investigate unauthorized message suppression, especially suppression of security-critical message IDs (authentication, authorization,
  configuration changes), suppression performed by non-administrative accounts, during unusual hours, or without documented
  justific'
references:
- https://research.splunk.com/4e6c9d2a-8f3b-4c7e-9a5f-2d8b6e1c4a9f/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1685.001
- attack.t1070
logsource:
  product: cisco
  service: asa
detection:
  sel1:
    message_id:
    - '111008'
    - '111010'
  sel2:
    command: no logging message *
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_asa/generic/cisco_asa_generic_logs.log
