title: ASL AWS IAM Assume Role Policy Brute Force (counted event)
id: 726959fe-316d-445c-a584-fa187d64e295-base
status: experimental
description: The following analytic detects multiple failed attempts to assume an AWS IAM role, indicating a potential brute
  force attack. It leverages AWS CloudTrail logs to identify `MalformedPolicyDocumentException` errors with a status of `failure`
  and filters out legitimate AWS services. This activity is significant as repeated failures to assume roles can indicate
  an adversary attempting to guess role names, which is a precursor to unauthorized access. If confirmed malicious, this could
  lead to unauthorized access to AWS resources, potentially compromising sensitive data and services.
references:
- https://research.splunk.com/726959fe-316d-445c-a584-fa187d64e295/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1580
- attack.t1110
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    api.operation: AssumeRole
  sel2:
    api.response.error: AccessDenied
  condition: (sel1 and sel2)
level: informational
name: escu_base_asl_aws_iam_assume_role_policy_brute_force
