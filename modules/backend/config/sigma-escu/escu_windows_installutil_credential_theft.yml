title: Windows InstallUtil Credential Theft
id: ccfeddec-43ec-11ec-b494-acde48001122
status: experimental
description: The following analytic detects instances where the Windows InstallUtil.exe binary loads `vaultcli.dll` and `Samlib.dll`.
  This detection leverages Sysmon EventCode 7 to identify these specific DLL loads. This activity is significant because it
  can indicate an attempt to execute code that bypasses application control and captures credentials using tools like Mimikatz.
  If confirmed malicious, this behavior could allow an attacker to steal credentials, potentially leading to unauthorized
  access and further compromise of the system.
references:
- https://research.splunk.com/ccfeddec-43ec-11ec-b494-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Mauricio Velazo, Splunk
tags:
- attack.t1218.004
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    Image: '*\\installutil.exe'
  sel3:
    ImageLoaded:
    - '*\\samlib.dll'
    - '*\\vaultcli.dll'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.004/atomic_red_team/windows-sysmon.log
