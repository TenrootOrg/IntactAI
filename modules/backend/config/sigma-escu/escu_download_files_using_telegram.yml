title: Download Files Using Telegram
id: 58194e28-ae5e-11eb-8912-acde48001122
status: experimental
description: The following analytic detects suspicious file downloads by the Telegram application on a Windows system. It
  leverages Sysmon EventCode 15 to identify instances where Telegram.exe creates files with a Zone.Identifier, indicating
  a download. This activity is significant as it may indicate an adversary using Telegram to download malicious tools, such
  as network scanners, for further exploitation. If confirmed malicious, this behavior could lead to network mapping, lateral
  movement, and potential compromise of additional systems within the network.
references:
- https://research.splunk.com/58194e28-ae5e-11eb-8912-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1105
logsource:
  product: windows
  service: sysmon
  category: create_stream_hash
detection:
  sel1:
    EventID: '15'
  sel2:
    Image: '*\\telegram.exe'
  sel3:
    TargetFilename: '*:Zone.Identifier'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/minergate/windows-sysmon.log
