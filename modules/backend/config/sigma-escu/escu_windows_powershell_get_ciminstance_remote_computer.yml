title: Windows PowerShell Get CIMInstance Remote Computer
id: d8c972eb-ed84-431a-8869-ca4bd83257d1
status: experimental
description: The following analytic detects the use of the Get-CimInstance cmdlet with the -ComputerName parameter, indicating
  an attempt to retrieve information from a remote computer. It leverages PowerShell Script Block Logging to identify this
  specific command execution. This activity is significant as it may indicate unauthorized remote access or information gathering
  by an attacker. If confirmed malicious, this could allow the attacker to collect sensitive data from remote systems, potentially
  leading to further exploitation or lateral movement within the network.
references:
- https://research.splunk.com/d8c972eb-ed84-431a-8869-ca4bd83257d1/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*get-ciminstance*'
  sel3:
    ScriptBlockText: '*computername*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/atomic_red_team/get_ciminstance_windows-powershell.log
