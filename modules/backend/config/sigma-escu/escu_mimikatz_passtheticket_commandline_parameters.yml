title: Mimikatz PassTheTicket CommandLine Parameters
id: 13bbd574-83ac-11ec-99d4-acde48001122
status: experimental
description: The following analytic detects the use of Mimikatz command line parameters associated with pass-the-ticket attacks.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific command-line patterns related
  to Kerberos ticket manipulation. This activity is significant because pass-the-ticket attacks allow adversaries to move
  laterally within an environment using stolen Kerberos tickets, bypassing normal access controls. If confirmed malicious,
  this could enable attackers to escalate privileges, access sensitive information, and maintain persistence within the network.
references:
- https://research.splunk.com/13bbd574-83ac-11ec-99d4-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1550.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*sekurlsa::tickets /export*'
  sel2:
    CommandLine: '*kerberos::ptt*'
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1550.003/mimikatz/windows-sysmon.log
