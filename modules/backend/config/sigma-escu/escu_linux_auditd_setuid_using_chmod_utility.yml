title: Linux Auditd Setuid Using Chmod Utility
id: 8230c407-1b47-4d95-ac2e-718bd6381386
status: experimental
description: The following analytic detects the execution of the chmod utility to set the SUID or SGID bit on files, which
  can allow users to temporarily gain root or group-level access. This detection leverages data from Linux Auditd, focusing
  on process names and command-line arguments related to chmod. This activity is significant as it can indicate an attempt
  to escalate privileges or maintain persistence on a system. If confirmed malicious, an attacker could gain elevated access,
  potentially compromising sensitive data or critical system functions.
references:
- https://research.splunk.com/8230c407-1b47-4d95-ac2e-718bd6381386/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.001
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle: '*chmod *'
  sel2:
    proctitle:
    - '* u+s *'
    - '* g+s *'
    - '* 4777 *'
    - '* 4577 *'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.001/linux_auditd_setuid/auditd_proctitle_setuid.log
