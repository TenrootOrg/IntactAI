title: Windows Set Account Password Policy To Unlimited Via Net
id: 11f93009-8083-43fd-82a7-821fcbdc8342
status: experimental
description: 'The following analytic detects the use of net.exe or net1.exe to configure the Windows maximum password age
  policy as unlimited.

  It leverages process creation telemetry from Endpoint Detection and Response (EDR) agents and identifies executions of the
  `net accounts` command using the `/maxpwage:unlimited` option.

  When specified, Windows configures the maximum password age with an unlimited value, effectively preventing passwords governed
  by the affected password policy from expiring.

  This behavior is significant because an adversary may modify password expiration settings to weaken credential security
  controls and maintain access to compromised accounts for an extended period.

  If confirmed malicious, this activity may indicate an attempt to establish or maintain persistence by preventing expected
  password rotation from invalidating credentials under the affected password policy.'
references:
- https://research.splunk.com/11f93009-8083-43fd-82a7-821fcbdc8342/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    CommandLine: '* accounts *'
  sel4:
    CommandLine: '* /maxpwage:unlimited*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
