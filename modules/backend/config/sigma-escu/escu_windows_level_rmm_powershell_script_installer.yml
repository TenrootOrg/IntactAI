title: Windows Level RMM PowerShell Script Installer
id: 1abf472a-88c9-41bb-9002-3272037531b7
status: experimental
description: 'Detects the PowerShell installer for the Level tool.

  Level is a commercial remote management tool from Level.io.

  Remote management tools, when used for legitimate purposes, can help IT professionals and system administrators remotely
  access and manage computer systems.

  However, threat actors may exploit these tools for malicious purposes.

  It can be used to maintain persistence and execution on a host by a malicious actor.'
references:
- https://research.splunk.com/1abf472a-88c9-41bb-9002-3272037531b7/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1219
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*$env:LEVEL_API_KEY *'
    - '*https://downloads.level.io/install_windows.ps1*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1219/snapattack/snapattack.log
