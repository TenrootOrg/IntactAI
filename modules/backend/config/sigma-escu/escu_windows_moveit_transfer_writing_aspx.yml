title: Windows MOVEit Transfer Writing ASPX
id: c0ed2aca-5666-45b3-813f-ddfac3f3eda0
status: experimental
description: The following analytic detects the creation of new ASPX files in the MOVEit Transfer application's "wwwroot"
  directory. It leverages endpoint data on process and filesystem activity to identify processes responsible for creating
  these files. This activity is significant as it may indicate exploitation of a critical zero-day vulnerability in MOVEit
  Transfer, used by threat actors to install malicious ASPX files. If confirmed malicious, this could lead to exfiltration
  of sensitive data, including user credentials and file metadata, posing a severe risk to the organization's security.
references:
- https://research.splunk.com/c0ed2aca-5666-45b3-813f-ddfac3f3eda0/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1133
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*\\MOVEitTransfer\\wwwroot\\*'
  sel2:
    TargetFilename:
    - '*.ashx'
    - '*.asp*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1505.003/moveit_windows-sysmon.log
