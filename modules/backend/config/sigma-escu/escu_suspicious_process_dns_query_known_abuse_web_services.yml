title: Suspicious Process DNS Query Known Abuse Web Services
id: 3cf0dc36-484d-11ec-a6bc-acde48001122
status: experimental
description: The following analytic detects a suspicious process making DNS queries to known, abused text-paste web services,
  VoIP, instant messaging, and digital distribution platforms. It leverages Sysmon EventID 22 logs to identify queries from
  processes like cmd.exe, powershell.exe, and others. This activity is significant as it may indicate an attempt to download
  malicious files, a common initial access technique. If confirmed malicious, this could lead to unauthorized code execution,
  data exfiltration, or further compromise of the target host.
references:
- https://research.splunk.com/3cf0dc36-484d-11ec-a6bc-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.005
logsource:
  product: windows
  service: sysmon
  category: dns_query
detection:
  sel1:
    EventID: '22'
  sel2:
    QueryName:
    - '*pastebin*'
    - '*discord*'
    - '*api.telegram*'
    - '*t.me*'
  sel3:
    Image:
    - '*\\cmd.exe'
    - '*powershell*'
    - '*\\pwsh.exe'
    - '*\\wscript.exe'
    - '*\\cscript.exe'
  sel4:
    Image:
    - '*\\users\\public\\*'
    - '*\\programdata\\*'
    - '*\\temp\\*'
    - '*\\Windows\\Tasks\\*'
    - '*\\appdata\\*'
    - '*\\perflogs\\*'
  condition: (sel1 and sel2 and (sel3 or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/remcos/remcos_pastebin_download/sysmon.log
