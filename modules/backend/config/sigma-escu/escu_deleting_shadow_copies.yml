title: Deleting Shadow Copies
id: b89919ed-ee5f-492c-b139-95dbb162039e
status: experimental
description: The following analytic detects the deletion of shadow copies using the vssadmin.exe or wmic.exe utilities. It
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments.
  This activity is significant because deleting shadow copies is a common tactic used by attackers to prevent recovery and
  hide their tracks. If confirmed malicious, this action could hinder incident response efforts and allow attackers to maintain
  persistence and cover their activities, making it crucial for security teams to investigate promptly.
references:
- https://research.splunk.com/b89919ed-ee5f-492c-b139-95dbb162039e/
author: Splunk Security Content (Apache-2.0), David Dorsey, Splunk
tags:
- attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\vssadmin.exe'
  sel2:
    Image: '*\\wmic.exe'
  sel3:
    CommandLine: '*delete*'
  sel4:
    CommandLine: '*shadow*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1490/atomic_red_team/windows-sysmon.log
