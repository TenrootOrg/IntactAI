title: Linux Insert Kernel Module Using Insmod Utility
id: 18b5a1a0-6326-11ec-943a-acde48001122
status: experimental
description: The following analytic detects the insertion of a Linux kernel module using the insmod utility. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs that include process names and
  command-line details. This activity is significant as it may indicate the installation of a rootkit or malicious kernel
  module, potentially allowing an attacker to gain elevated privileges and bypass security detections. If confirmed malicious,
  this could lead to unauthorized code execution, persistent access, and severe compromise of the affected system.
references:
- https://research.splunk.com/18b5a1a0-6326-11ec-943a-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1547.006
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/kmod'
    - '*/sudo'
  sel2:
    CommandLine: '*insmod*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1547.006/loading_linux_kernel_module/sysmon_linux.log
