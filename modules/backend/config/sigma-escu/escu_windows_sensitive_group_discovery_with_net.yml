title: Windows Sensitive Group Discovery With Net
id: d9eb7cda-5622-4722-bc88-7f2442f4b5af
status: experimental
description: The following analytic detects the execution of `net.exe` with command-line arguments used to query elevated
  domain or sensitive groups. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names
  and command-line executions. This activity is significant as it indicates potential reconnaissance efforts by adversaries
  to identify high-privileged users within Active Directory. If confirmed malicious, this behavior could lead to further attacks
  aimed at compromising privileged accounts, escalating privileges, or gaining unauthorized access to sensitive systems and
  data.
references:
- https://research.splunk.com/d9eb7cda-5622-4722-bc88-7f2442f4b5af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1069.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    CommandLine: '*group*'
  sel4:
    CommandLine:
    - '*Domain Admins*'
    - '*Enterprise Admins*'
    - '*Schema Admins*'
    - '*Account Operators*'
    - '*Server Operators*'
    - '*Protected Users*'
    - '*Dns Admins*'
    - '*Domain Computers*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1069.002/AD_discovery/windows-sysmon.log
