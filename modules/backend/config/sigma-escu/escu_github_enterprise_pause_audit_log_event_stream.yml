title: GitHub Enterprise Pause Audit Log Event Stream
id: 21083dcb-276d-4ef9-8f7e-2113ca5e8094
status: experimental
description: The following analytic detects when a user pauses audit log event streaming in GitHub Enterprise. The detection
  monitors GitHub Enterprise audit logs for configuration changes that temporarily suspend the audit log streaming functionality,
  which is used to send audit events to security monitoring platforms. This behavior could indicate an attacker attempting
  to prevent their malicious activities from being logged and detected by temporarily disabling the audit trail. For a SOC,
  identifying the pausing of audit logging is critical as it may be a precursor to other attacks where adversaries want to
  operate undetected during the pause window. The impact could be severe as organizations temporarily lose visibility into
  user actions, configuration changes, and security events within their GitHub Enterprise environment, potentially allowing
  attackers to perform malicious activities without detection during the pause period. This creates a temporary blind spot
  in security monitoring and incid
references:
- https://research.splunk.com/21083dcb-276d-4ef9-8f7e-2113ca5e8094/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1685.002
- attack.t1195
logsource:
  product: github
  service: audit
detection:
  sel1:
    action: audit_log_streaming.update
  sel2:
    reason: User initiated pause
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/github_audit_log_stream_modified/github.json
