title: O365 Cross-Tenant Access Change
id: 7c0fa490-12b0-4d0b-b9f5-e101d1e0e06f
status: experimental
description: The following analytic identifies when cross-tenant access/synchronization policies are changed in an Azure tenant.
  Adversaries have been observed altering victim cross-tenant policies as a method of lateral movement or maintaining persistent
  access to compromised environments. These policies should be considered sensitive and monitored for changes and/or loose
  configuration.
references:
- https://research.splunk.com/7c0fa490-12b0-4d0b-b9f5-e101d1e0e06f/
author: Splunk Security Content (Apache-2.0), Steven Dick
tags:
- attack.t1484.002
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: AzureActiveDirectory
  sel2:
    Operation:
    - Add a partner to cross-tenant access setting.
    - Delete partner specific cross-tenant access setting.
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098/o365_azure_workload_events/o365_azure_workload_events.log
