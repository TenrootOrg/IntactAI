title: Windows Registry Certificate Added
id: 5ee98b2f-8b9e-457a-8bdc-dd41aaba9e87
status: experimental
description: The following analytic detects the installation of a root CA certificate by monitoring specific registry paths
  for SetValue events. It leverages data from the Endpoint datamodel, focusing on registry paths containing "certificates"
  and registry values named "Blob." This activity is significant because unauthorized root CA certificates can compromise
  the integrity of encrypted communications and facilitate man-in-the-middle attacks. If confirmed malicious, this could allow
  an attacker to intercept, decrypt, or manipulate sensitive data, leading to severe security breaches.
references:
- https://research.splunk.com/5ee98b2f-8b9e-457a-8bdc-dd41aaba9e87/
author: Splunk Security Content (Apache-2.0), Michael Haag, Teodeerick Contreras, Splunk
tags:
- attack.t1553.004
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\certificates\\*'
  sel2:
    TargetObject: '*\\Blob'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1587.002/atomic_red_team/certblob_windows-sysmon.log
