title: Windows ESX Admins Group Creation Security Event
id: 53b4c927-5ec4-47cd-8aed-d4b303304f87
status: experimental
description: This analytic detects creation, deletion, or modification of the "ESX Admins" group in Active Directory. These
  events may indicate attempts to exploit the VMware ESXi Active Directory Integration Authentication Bypass vulnerability
  (CVE-2024-37085).
references:
- https://research.splunk.com/53b4c927-5ec4-47cd-8aed-d4b303304f87/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1136.001
- attack.t1136.002
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID:
    - '4727'
    - '4730'
    - '4737'
  sel2:
    TargetUserName: ESX Admins
  sel3:
    TargetUserName: '*ESX Admins*'
  condition: (sel1 and (sel2 or sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1136.001/atomic_red_team/windows-security-esxadmins.log
