title: Suspicious Rundll32 PluginInit
id: 92d51712-ee29-11eb-b1ae-acde48001122
status: experimental
description: The following analytic identifies the execution of the rundll32.exe process with the "plugininit" parameter.
  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events and
  command-line arguments. This activity is significant because the "plugininit" parameter is commonly associated with IcedID
  malware, which uses it to execute an initial DLL stager to download additional payloads. If confirmed malicious, this behavior
  could lead to further malware infections, data exfiltration, or complete system compromise.
references:
- https://research.splunk.com/92d51712-ee29-11eb-b1ae-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rundll32.exe'
  sel2:
    OriginalFileName: RUNDLL32.EXE
  sel3:
    CommandLine: '*PluginInit*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/icedid/inf_icedid/windows-sysmon.log
