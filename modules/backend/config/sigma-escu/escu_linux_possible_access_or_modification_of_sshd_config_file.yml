title: Linux Possible Access Or Modification Of sshd Config File
id: 7a85eb24-72da-11ec-ac76-acde48001122
status: experimental
description: The following analytic detects suspicious access or modification of the sshd_config file on Linux systems. It
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions involving processes
  like "cat," "nano," "vim," and "vi" accessing the sshd_config file. This activity is significant because unauthorized changes
  to sshd_config can allow threat actors to redirect port connections or use unauthorized keys, potentially compromising the
  system. If confirmed malicious, this could lead to unauthorized access, privilege escalation, or persistent backdoor access,
  posing a severe security risk.
references:
- https://research.splunk.com/7a85eb24-72da-11ec-ac76-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1098.004
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/cat'
    - '*/nano*'
    - '*/vim*'
    - '*/vi*'
  sel2:
    CommandLine: '*/etc/ssh/sshd_config'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098.004/ssh_authorized_keys/sysmon_linux.log
