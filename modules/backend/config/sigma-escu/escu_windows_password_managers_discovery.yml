title: Windows Password Managers Discovery
id: a3b3bc96-1c4f-4eba-8218-027cac739a48
status: experimental
description: The following analytic identifies command-line activity that searches for files related to password manager software,
  such as "*.kdbx*" and "*credential*". It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process
  execution logs. This activity is significant because attackers often target password manager databases to extract stored
  credentials, which can be used for further exploitation. If confirmed malicious, this behavior could lead to unauthorized
  access to sensitive information, enabling attackers to escalate privileges, move laterally, or exfiltrate critical data.
references:
- https://research.splunk.com/a3b3bc96-1c4f-4eba-8218-027cac739a48/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*dir *'
  sel2:
    CommandLine: '*findstr*'
  sel3:
    CommandLine:
    - '*.kdbx*'
    - '*credential*'
    - '*key3.db*'
    - '*pass*'
    - '*cred*'
    - '*key4.db*'
    - '*accessTokens*'
    - '*access_tokens*'
    - '*.htpasswd*'
    - '*Ntds.dit*'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/winpeas/winpeas_search_pwd_db/dir-db-sysmon.log
