title: Cisco Secure Firewall - Wget or Curl Download
id: 173a1cb9-1814-4128-a9dc-f29dade89957
status: experimental
description: The following analytic detects outbound connections initiated by command-line tools such as curl or wget. It
  leverages Cisco Secure Firewall Threat Defense logs and identifies allowed connections (action=Allow) where either the EVE_Process
  or ClientApplication fields indicate use of these utilities. While curl and wget are legitimate tools commonly used for
  software updates and scripting, adversaries often abuse them to download payloads, retrieve additional tools, or establish
  staging infrastructure from compromised systems. If confirmed malicious, this behavior may indicate the download phase of
  an attack chain or a command-and-control utility retrieval.
references:
- https://research.splunk.com/173a1cb9-1814-4128-a9dc-f29dade89957/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1053.003
- attack.t1059
- attack.t1071.001
- attack.t1105
logsource:
  product: cisco
  service: secure_firewall
detection:
  sel1:
    EventType: ConnectionEvent
  sel2:
    AC_RuleAction:
    - Trust
    - Allow
    - allowed
  sel3:
    EVE_Process:
    - '*curl*'
    - '*wget*'
  sel4:
    ClientApplication:
    - cURL
    - Wget
  condition: (sel1 and sel2 and (sel3 or sel4))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_firewall_threat_defense/connection_event/connection_events.log
