title: Windows Forest Discovery with GetForestDomain
id: a14803b2-4bd9-4c08-8b57-c37980edebe8
status: experimental
description: The following analytic detects the execution of the `Get-ForestDomain` cmdlet, a component of the PowerView toolkit
  used for Windows domain enumeration. It leverages PowerShell Script Block Logging (EventCode=4104) to identify this activity.
  Detecting `Get-ForestDomain` is significant because adversaries and Red Teams use it to gather detailed information about
  Active Directory forest and domain configurations. If confirmed malicious, this activity could enable attackers to understand
  the domain structure, facilitating lateral movement or privilege escalation within the environment.
references:
- https://research.splunk.com/a14803b2-4bd9-4c08-8b57-c37980edebe8/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-ForestDomain*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/windows-powershell-ForestDomain-xml.log
