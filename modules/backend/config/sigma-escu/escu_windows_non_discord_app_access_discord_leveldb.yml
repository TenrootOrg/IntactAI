title: Windows Non Discord App Access Discord LevelDB
id: 1166360c-d495-45ac-87a6-8948aac1fa07
status: experimental
description: The following analytic detects non-Discord applications accessing the Discord LevelDB database. It leverages
  Windows Security Event logs, specifically event code 4663, to identify file access attempts to the LevelDB directory by
  processes other than Discord. This activity is significant as it may indicate attempts to steal Discord credentials or access
  sensitive user data. If confirmed malicious, this could lead to unauthorized access to user profiles, messages, and other
  critical information, potentially compromising the security and privacy of the affected users.
references:
- https://research.splunk.com/1166360c-d495-45ac-87a6-8948aac1fa07/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ObjectName: '*\\discord\\Local Storage\\leveldb*'
  sel3:
    Image: '*\\discord.exe'
  sel4:
    ProcessName:
    - '*:\\Windows\\System32\\*'
    - '*:\\Windows\\SysWow64\\*'
    - '*:\\Program Files*'
    - '*:\\Windows\\*'
  condition: (sel1 and sel2 and not sel3 and not (sel4))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552/snakey_keylogger_outlook_reg_access/snakekeylogger_4663.log
