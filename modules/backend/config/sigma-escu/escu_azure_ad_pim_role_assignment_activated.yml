title: Azure AD PIM Role Assignment Activated
id: 952e80d0-e343-439b-83f4-808c3e6fbf2e
status: experimental
description: The following analytic detects the activation of an Azure AD Privileged Identity Management (PIM) role. It leverages
  Azure Active Directory events to identify when a user activates a PIM role assignment, indicated by the "Add member to role
  completed (PIM activation)" operation. Monitoring this activity is crucial as PIM roles grant elevated privileges, and unauthorized
  activation could indicate an adversary attempting to gain privileged access. If confirmed malicious, this could lead to
  unauthorized administrative actions, data breaches, or further compromise of the Azure environment.
