title: ESXi Sensitive Files Accessed
id: 6fa0073d-6ca0-4f93-913d-fb420c9de15b
status: experimental
description: This detection identifies access to sensitive system and configuration files on an ESXi host, including authentication
  data, service configurations, and VMware-specific management settings. Interaction with these files may indicate adversary
  reconnaissance, credential harvesting, or preparation for privilege escalation, lateral movement, or persistence.
references:
- https://research.splunk.com/6fa0073d-6ca0-4f93-913d-fb420c9de15b/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1003.008
- attack.t1005
logsource:
  product: esxi
detection:
  sel1:
    text: '*shell[*'
  sel2:
    text:
    - '*/etc/shadow*'
    - '*/etc/vmware/hostd/hostd.xml*'
    - '*/etc/vmware/vpxa/vpxa.cfg*'
    - '*/etc/sfcb/sfcb.cfg*'
    - '*/etc/security/*'
    - '*/etc/likewise/krb5-affinity.conf*'
    - '*/etc/vmware-vpx/vcdb.properties*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.008/esxi_sensitive_files/esxi_sensitive_files.log
