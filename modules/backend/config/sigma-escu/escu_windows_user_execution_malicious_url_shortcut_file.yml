title: Windows User Execution Malicious URL Shortcut File
id: 5c7ee6ad-baf4-44fb-b2f0-0cfeddf82dbc
status: experimental
description: The following analytic detects the creation URL shortcut files, often used by malware like CHAOS ransomware.
  It leverages the Endpoint.Filesystem datamodel to identify ".url" files created outside common directories, such as "Program
  Files". This activity can be significant as ".URL" files can be used as mean to trick the user into visiting certain websites
  unknowingly, or when placed in certain locations such as "\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\Startup\\",
  it may allow the execution of malicious code upon system reboot. If confirmed malicious, this could allow an attacker to
  achieve persistence and execute harmful payloads, potentially leading to further system compromise and data loss.
references:
- https://research.splunk.com/5c7ee6ad-baf4-44fb-b2f0-0cfeddf82dbc/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1204.002
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*:\\Program Files\\*'
    - '*:\\Program Files (x86)\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Office\\Recent\\*'
    - '*:\\Windows\\WinSxS\\*'
  sel2:
    TargetFilename: '*.url'
  condition: (not (sel1) and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/chaos_ransomware/sysmon.log
x-intact-burst: false
x-intact: 'Fired 4 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
