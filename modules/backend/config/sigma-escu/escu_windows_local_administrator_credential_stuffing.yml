title: Windows Local Administrator Credential Stuffing (counted event)
id: 09555511-aca6-484a-b6ab-72cd03d73c34-base
status: experimental
description: The following analytic detects attempts to authenticate using the built-in local Administrator account across
  more than 30 endpoints within a 5-minute window. It leverages Windows Event Logs, specifically events 4625 and 4624, to
  identify this behavior. This activity is significant as it may indicate an adversary attempting to validate stolen local
  credentials across multiple hosts, potentially leading to privilege escalation. If confirmed malicious, this could allow
  the attacker to gain widespread access and control over numerous systems within the network, posing a severe security risk.
references:
- https://research.splunk.com/09555511-aca6-484a-b6ab-72cd03d73c34/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1110.004
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4625'
  sel2:
    EventID: '4624'
  sel3:
    LogonType: '3'
  sel4:
    TargetUserName: Administrator
  condition: ((sel1 or sel2) and sel3 and sel4)
level: informational
name: escu_base_windows_local_administrator_credential_stuffing
