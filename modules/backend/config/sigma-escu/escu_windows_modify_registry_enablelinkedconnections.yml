title: Windows Modify Registry EnableLinkedConnections
id: 93048164-3358-4af0-8680-aa5f38440516
status: experimental
description: The following analytic detects a suspicious modification to the Windows registry setting for EnableLinkedConnections.
  It leverages data from the Endpoint.Registry datamodel to identify changes where the registry path is "*\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableLinkedConnections"
  and the value is set to "0x00000001". This activity is significant because enabling linked connections can allow network
  shares to be accessed with both standard and administrator-level privileges, a technique often abused by malware like BlackByte
  ransomware. If confirmed malicious, this could lead to unauthorized access to sensitive network resources, escalating the
  attacker's privileges.
references:
- https://research.splunk.com/93048164-3358-4af0-8680-aa5f38440516/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableLinkedConnections'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1112/blackbyte/enablelinkedconnections/blackbyte_sysmon.log
