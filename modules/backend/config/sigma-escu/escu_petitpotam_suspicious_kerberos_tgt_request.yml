title: PetitPotam Suspicious Kerberos TGT Request
id: e3ef244e-0a67-11ec-abf2-acde48001122
status: experimental
description: The following analytic detects a suspicious Kerberos Ticket Granting Ticket (TGT) request, identified by Event
  Code 4768. This detection leverages Windows Security Event Logs to identify TGT requests with unusual fields, which may
  indicate the use of tools like Rubeus following the exploitation of CVE-2021-36942 (PetitPotam). This activity is significant
  as it can signal an attacker leveraging a compromised certificate to request Kerberos tickets, potentially leading to unauthorized
  access. If confirmed malicious, this could allow attackers to escalate privileges and persist within the environment, posing
  a severe security risk.
references:
- https://research.splunk.com/e3ef244e-0a67-11ec-abf2-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Mauricio Velazco, Splunk
tags:
- attack.t1003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4768'
  sel2:
    TargetUserName: '*$'
  sel3:
    CertThumbprint: ''
  sel4:
    PreAuthType: '2'
  condition: (sel1 and sel2 and not sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1187/petitpotam/windows-xml-1.log
