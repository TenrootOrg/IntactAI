title: Unloading AMSI via Reflection
id: a21e3484-c94d-11eb-b55b-acde48001122
status: experimental
description: The following analytic detects the tampering of AMSI (Antimalware Scan Interface) via PowerShell reflection.
  It leverages PowerShell Script Block Logging (EventCode=4104) to capture and analyze suspicious PowerShell commands, specifically
  those involving `system.management.automation.amsi`. This activity is significant as it indicates an attempt to bypass AMSI,
  a critical security feature that helps detect and block malicious scripts. If confirmed malicious, this could allow an attacker
  to execute harmful code undetected, leading to potential system compromise and data exfiltration.
references:
- https://research.splunk.com/a21e3484-c94d-11eb-b55b-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
- attack.t1685
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*system.management.automation.amsi*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/windows-powershell-xml.log
