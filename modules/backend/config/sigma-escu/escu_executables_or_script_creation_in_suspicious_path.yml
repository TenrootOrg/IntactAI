title: Executables Or Script Creation In Suspicious Path
id: a7e3f0f0-ae42-11eb-b245-acde48001122
status: experimental
description: The following analytic identifies the creation of executables or scripts in suspicious file paths on Windows
  systems. It leverages the Endpoint.Filesystem dataset to detect files with specific extensions (e.g., .exe, .dll, .ps1)
  created in uncommon directories (e.g., \windows\fonts\, \users\public\). This activity can be significant as adversaries
  often use these paths to evade detection and maintain persistence. If confirmed malicious, this behavior could allow attackers
  to execute unauthorized code, escalate privileges, or persist within the environment, posing a significant security threat.
references:
- https://research.splunk.com/a7e3f0f0-ae42-11eb-b245-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1036
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*.bat'
    - '*.cmd'
    - '*.com'
    - '*.dll'
    - '*.exe'
    - '*.js'
    - '*.msc'
    - '*.pif'
    - '*.ps1'
    - '*.sys'
    - '*.vbe'
    - '*.vbs'
  sel2:
    TargetFilename:
    - '*:\\PerfLogs\\*'
    - '*:\\Users\\Administrator\\Music\\*'
    - '*:\\Users\\Default\\*'
    - '*:\\Users\\Public\\*'
    - '*:\\Windows\\debug\\*'
    - '*:\\Windows\\fonts\\*'
    - '*:\\Windows\\Media\\*'
    - '*:\\Windows\\repair\\*'
    - '*:\\Windows\\servicing\\*'
    - '*\\inetpub\\*'
    - '*\\Microsoft\\Windows\\Libraries\\*'
    - '*Recycle.bin*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1036/executables_suspicious_file_path/exec_susp_path2.log
