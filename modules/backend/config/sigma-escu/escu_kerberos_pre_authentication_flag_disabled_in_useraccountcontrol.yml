title: Kerberos Pre-Authentication Flag Disabled in UserAccountControl
id: 0cb847ee-9423-11ec-b2df-acde48001122
status: experimental
description: The following analytic detects when the Kerberos Pre-Authentication flag is disabled in a user account, using
  Windows Security Event 4738. This event indicates a change in the UserAccountControl property of a domain user object. Disabling
  this flag allows adversaries to perform offline brute force attacks on the user's password using the AS-REP Roasting technique.
  This activity is significant as it can be used by attackers with existing privileges to escalate their access or maintain
  persistence. If confirmed malicious, this could lead to unauthorized access and potential compromise of sensitive information.
references:
- https://research.splunk.com/0cb847ee-9423-11ec-b2df-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1558.004
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4738'
  sel2:
    UserAccountControl: '*%%2096*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1558.004/powershell/windows-security-xml.log
