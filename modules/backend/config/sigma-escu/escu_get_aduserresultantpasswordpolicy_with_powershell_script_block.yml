title: Get ADUserResultantPasswordPolicy with Powershell Script Block
id: 737e1eb0-065a-11ec-921a-acde48001122
status: experimental
description: The following analytic detects the execution of the `Get-ADUserResultantPasswordPolicy` PowerShell cmdlet, which
  is used to obtain the password policy in a Windows domain. It leverages PowerShell Script Block Logging (EventCode=4104)
  to identify this activity. Monitoring this behavior is significant as it may indicate an attempt to enumerate domain policies,
  a common tactic used by adversaries for situational awareness and Active Directory discovery. If confirmed malicious, this
  activity could allow attackers to understand password policies, aiding in further attacks such as password guessing or policy
  exploitation.
references:
- https://research.splunk.com/737e1eb0-065a-11ec-921a-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1201
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-ADUserResultantPasswordPolicy*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
