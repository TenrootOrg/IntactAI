title: Wsmprovhost LOLBAS Execution Process Spawn
id: 2eed004c-4c0d-11ec-93e8-3e22fbd008af
status: experimental
description: The following analytic identifies `Wsmprovhost.exe` spawning a LOLBAS execution process. It leverages Endpoint
  Detection and Response (EDR) data to detect when `Wsmprovhost.exe` spawns child processes that are known LOLBAS (Living
  Off the Land Binaries and Scripts) executables. This activity is significant because it may indicate an adversary using
  Windows Remote Management (WinRM) to execute code on remote endpoints, a common technique for lateral movement. If confirmed
  malicious, this could allow attackers to execute arbitrary code, escalate privileges, or maintain persistence within the
  environment.
references:
- https://research.splunk.com/2eed004c-4c0d-11ec-93e8-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\wsmprovhost.exe'
  sel2:
