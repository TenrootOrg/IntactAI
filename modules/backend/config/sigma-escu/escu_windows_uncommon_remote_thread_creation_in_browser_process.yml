title: Windows Uncommon Remote Thread Creation In Browser Process
id: 634cce27-a3a6-4079-b0d6-3ced361a0aa9
status: experimental
description: 'The following analytic identifies the creation of a remote thread by a process such as wermgr.exe or rundll32.exe
  into a browser process such as firefox.exe, chrome.exe, and others.

  These processes do not typically create remote threads, in browser processes.

  It leverages Sysmon EventID 8 to detect this behavior by monitoring SourceImage and TargetImage fields.

  This activity is significant because it is commonly associated with malware like Qakbot and IcedID, which injects malicious
  code into legitimate processes to steal information.

  If confirmed malicious, this activity could allow attackers to execute arbitrary code, escalate privileges, and exfiltrate
  sensitive data from the compromised host.'
references:
- https://research.splunk.com/634cce27-a3a6-4079-b0d6-3ced361a0aa9/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1055.001
logsource:
  product: windows
  service: sysmon
  category: create_remote_thread
