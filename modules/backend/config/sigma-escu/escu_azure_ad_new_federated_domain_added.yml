title: Azure AD New Federated Domain Added
id: a87cd633-076d-4ab2-9047-977751a3c1a0
status: experimental
description: The following analytic detects the addition of a new federated domain within an Azure Active Directory tenant.
  It leverages Azure AD AuditLogs to identify successful "Set domain authentication" operations. This activity is significant
  as it may indicate the use of the Azure AD identity federation backdoor technique, allowing an adversary to establish persistence.
  If confirmed malicious, the attacker could impersonate any user, bypassing password and MFA requirements, potentially leading
  to unauthorized access and control over the Azure AD environment.
references:
- https://research.splunk.com/a87cd633-076d-4ab2-9047-977751a3c1a0/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Gowthamaraj Rajendran, Splunk
tags:
- attack.t1484.002
logsource:
  product: azure
detection:
  sel1:
    operationName: Set domain authentication
  sel2:
    properties.result: success
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1484.002/new_federated_domain/azure-audit.log
