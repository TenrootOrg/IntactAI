title: Windows Multiple Account Passwords Changed (counted event)
id: faefb681-14be-4f0d-9cac-0bc0160c7280-base
status: experimental
description: The following analytic detects instances where more than five unique Windows account passwords are changed within
  a 10-minute interval. It leverages Event Code 4724 from the Windows Security Event Log, using the wineventlog_security dataset
  to monitor and count distinct TargetUserName values. This behavior is significant as rapid password changes across multiple
  accounts are unusual and may indicate unauthorized access or internal compromise. If confirmed malicious, this activity
  could lead to widespread account compromise, unauthorized access to sensitive information, and potential disruption of services.
references:
- https://research.splunk.com/faefb681-14be-4f0d-9cac-0bc0160c7280/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1098
- attack.t1078
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4724'
  sel2:
    status: success
  condition: (sel1 and sel2)
level: informational
name: escu_base_windows_multiple_account_passwords_changed
