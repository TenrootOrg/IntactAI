title: Azure AD Service Principal Authentication
id: 5a2ec401-60bb-474e-b936-1e66e7aa4060
status: experimental
description: The following analytic identifies authentication events of service principals in Azure Active Directory. It leverages
  the `azure_monitor_aad` data source, specifically targeting "Sign-in activity" within ServicePrincipalSignInLogs. This detection
  gathers details such as sign-in frequency, timing, source IPs, and accessed resources. Monitoring these events is significant
  for SOC teams to distinguish between normal application authentication and potential anomalies, which could indicate compromised
  credentials or malicious activities. If confirmed malicious, attackers could gain unauthorized access to resources, leading
  to data breaches or further exploitation within the environment.
references:
- https://research.splunk.com/5a2ec401-60bb-474e-b936-1e66e7aa4060/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1078.004
logsource:
  product: azure
detection:
  sel1:
    operationName: Sign-in activity
  sel2:
    category: ServicePrincipalSignInLogs
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078.004/azure_ad_service_principal_authentication/azure_ad_service_principal_authentication.log
