title: Windows Enable PowerShell Web Access
id: 175bb2de-6227-416b-9678-9b61999cd21f
status: experimental
description: The following analytic detects the enabling of PowerShell Web Access via PowerShell commands. It leverages PowerShell
  script block logging (EventCode 4104) to identify the execution of the `Install-WindowsFeature` cmdlet with the `WindowsPowerShellWebAccess`
  parameter. This activity is significant because enabling PowerShell Web Access can facilitate remote execution of PowerShell
  commands, potentially allowing an attacker to gain unauthorized access to systems and networks.
references:
- https://research.splunk.com/175bb2de-6227-416b-9678-9b61999cd21f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*Install-WindowsFeature*WindowsPowerShellWebAccess*'
    - '*Install-PswaWebApplication*'
    - '*Add-PswaAuthorizationRule*UserName *ComputerName *'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/pswa_powershell.log
