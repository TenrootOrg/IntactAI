title: Rundll32 LockWorkStation
id: fa90f372-f91d-11eb-816c-acde48001122
status: experimental
description: The following analytic detects the execution of the rundll32.exe command with the user32.dll,LockWorkStation
  parameter, which is used to lock the workstation via command line. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process names and command-line executions. This activity is significant as it is
  an uncommon method to lock a screen and has been observed in CONTI ransomware tooling for defense evasion. If confirmed
  malicious, this technique could indicate an attempt to evade detection and hinder incident response efforts.
references:
- https://research.splunk.com/fa90f372-f91d-11eb-816c-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rundll32.exe'
  sel2:
    CommandLine: '*user32.dll,LockWorkStation*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/conti/conti_leak/windows-sysmon.log
