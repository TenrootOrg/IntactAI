title: Linux c89 Privilege Escalation
id: 54c95f4d-3e5d-44be-9521-ea19ba62f7a8
status: experimental
description: The following analytic detects the execution of the 'c89' command with elevated privileges, which can be used
  to compile and execute C programs as root. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process creation events that include command-line arguments. This activity is significant because it indicates
  a potential privilege escalation attempt, allowing a user to execute arbitrary commands as root. If confirmed malicious,
  this could lead to full system compromise, enabling the attacker to gain root access and execute any command with elevated
  privileges.
references:
- https://research.splunk.com/54c95f4d-3e5d-44be-9521-ea19ba62f7a8/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*c89*'
  sel2:
    CommandLine: '*-wrapper*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/c89/sysmon_linux.log
