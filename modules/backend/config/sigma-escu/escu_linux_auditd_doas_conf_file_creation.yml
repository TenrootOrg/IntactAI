title: Linux Auditd Doas Conf File Creation
id: 61059783-574b-40d2-ac2f-69b898afd6b4
status: experimental
description: 'The following analytic detects the creation of the doas.conf file on a Linux host.

  This file is used by the doas utility to allow standard users to perform tasks as root, similar to sudo.

  The detection leverages Linux Auditd data, focusing on the creation of the doas.conf file.

  This activity is significant because it can indicate an attempt to gain elevated privileges, potentially by an adversary.
  If confirmed malicious, this could allow an attacker to execute commands with root commands with root privileges, leading
  to full system compromise.'
references:
- https://research.splunk.com/61059783-574b-40d2-ac2f-69b898afd6b4/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1548.003
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: PATH
  sel2:
    full_path|re: /etc/doas.conf.*
  condition: sel1 and sel2
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.003/auditd_path_cwd_doas_conf/path_doas.log
