title: Windows AD Privileged Object Access Activity
id: dc2f58bc-8cd2-4e51-962a-694b963acde0
status: experimental
description: The following analytic detects access attempts to privileged Active Directory objects, such as Domain Admins
  or Enterprise Admins. It leverages Windows Security Event Code 4662 to identify when these sensitive objects are accessed.
  This activity is significant because such objects should rarely be accessed by normal users or processes, and unauthorized
  access attempts may indicate attacker enumeration or lateral movement within the domain. If confirmed malicious, this activity
  could allow attackers to escalate privileges, persist in the environment, or gain control over critical domain resources.
references:
- https://research.splunk.com/dc2f58bc-8cd2-4e51-962a-694b963acde0/
author: Splunk Security Content (Apache-2.0), Steven Dick
tags:
- attack.t1087.002
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4662'
  sel2:
    ObjectName:
    - CN=Account Operators,*
    - CN=Administrators,*
    - CN=Backup Operators,*
    - CN=Cert Publishers,*
    - CN=Certificate Service DCOM Access,*
    - CN=Domain Admins,*
    - CN=Domain Controllers,*
    - CN=Enterprise Admins,*
    - CN=Enterprise Read-only Domain Controllers,*
    - CN=Group Policy Creator Owners,*
    - CN=Incoming Forest Trust Builders,*
    - CN=Microsoft Exchange Servers,*
    - CN=Network Configuration Operators,*
    - CN=Power Users,*
    - CN=Print Operators,*
    - CN=Read-only Domain Controllers,*
    - CN=Replicators,*
    - CN=Schema Admins,*
    - CN=Server Operators,*
    - CN=Exchange Trusted Subsystem,*
    - CN=Exchange Windows Permission,*
    - CN=Organization Management,*
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/4662_ad_enum/4662_priv_events.log
