title: WMI Permanent Event Subscription - Sysmon
id: ad05aae6-3b2a-4f73-af97-57bd26cee3b9
status: experimental
description: Detects the creation, modification or deletion of a WMI permanent event subscription using Sysmon EventID 21.
references:
- https://research.splunk.com/ad05aae6-3b2a-4f73-af97-57bd26cee3b9/
author: Splunk Security Content (Apache-2.0), Rico Valdez, Michael Haag, Splunk
tags:
- attack.t1546.003
logsource:
