title: Windows Disable Memory Crash Dump
id: 59e54602-9680-11ec-a8a6-acde48001122
status: experimental
description: The following analytic detects attempts to disable the memory crash dump feature on Windows systems by setting
  the registry value to 0. It leverages data from the Endpoint.Registry datamodel, specifically monitoring changes to the
  CrashDumpEnabled registry key. This activity is significant because disabling crash dumps can hinder forensic analysis and
  incident response efforts. If confirmed malicious, this action could be part of a broader attack strategy, such as data
  destruction or system destabilization, as seen with HermeticWiper, potentially leading to significant operational disruptions
  and data loss.
references:
- https://research.splunk.com/59e54602-9680-11ec-a8a6-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1485
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\CurrentControlSet\\Control\\CrashControl\\CrashDumpEnabled'
  sel2:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/hermetic_wiper/sysmon.log
