title: Remote System Discovery with Adsisearcher
id: 70803451-0047-4e12-9d63-77fa7eb8649c
status: experimental
description: The following analytic detects the use of the `[Adsisearcher]` type accelerator in PowerShell scripts to query
  Active Directory for domain computers. It leverages PowerShell Script Block Logging (EventCode=4104) to identify specific
  script blocks containing `adsisearcher` and `objectcategory=computer` with methods like `findAll()` or `findOne()`. This
  activity is significant as it may indicate an attempt by adversaries or Red Teams to perform Active Directory discovery
  and gain situational awareness. If confirmed malicious, this could lead to further reconnaissance and potential lateral
  movement within the network.
references:
- https://research.splunk.com/70803451-0047-4e12-9d63-77fa7eb8649c/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1018
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*adsisearcher*'
  sel3:
    ScriptBlockText: '*objectcategory=computer*'
  sel4:
    ScriptBlockText:
    - '*findAll()*'
    - '*findOne()*'
  condition: (sel1 and sel2 and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/adsisearcher-powershell.log
