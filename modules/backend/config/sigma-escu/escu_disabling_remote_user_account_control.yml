title: Disabling Remote User Account Control
id: bbc644bc-37df-4e1a-9c88-ec9a53e2038c
status: experimental
description: The following analytic identifies modifications to the registry key that controls the enforcement of Windows
  User Account Control (UAC). It detects changes to the registry path `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA`
  where the value is set to `0x00000000`. This activity is significant because disabling UAC can allow unauthorized changes
  to the system without user consent, potentially leading to privilege escalation. If confirmed malicious, an attacker could
  gain elevated privileges, making it easier to execute further attacks or maintain persistence within the environment.
references:
- https://research.splunk.com/bbc644bc-37df-4e1a-9c88-ec9a53e2038c/
author: Splunk Security Content (Apache-2.0), David Dorsey, Patrick Bareiss, Splunk
tags:
- attack.t1548.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\EnableLUA*'
  sel2:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.002/atomic_red_team/windows-sysmon.log
