title: Linux OpenVPN Privilege Escalation
id: d25feebe-fa1c-4754-8a1e-afb03bedc0f2
status: experimental
description: The following analytic detects the execution of OpenVPN with elevated privileges, specifically when combined
  with the `--dev`, `--script-security`, `--up`, and `sudo` options. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process command-line arguments and execution details. This activity is significant
  because it indicates a potential privilege escalation attempt, allowing a user to execute system commands as root. If confirmed
  malicious, this could lead to full system compromise, enabling an attacker to gain root access and execute arbitrary commands
  with elevated privileges.
references:
- https://research.splunk.com/d25feebe-fa1c-4754-8a1e-afb03bedc0f2/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*openvpn*'
  sel2:
    CommandLine: '*--dev*'
  sel3:
    CommandLine: '*--script-security*'
  sel4:
    CommandLine: '*--up*'
  sel5:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3 and sel4 and sel5)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/openvpn/sysmon_linux.log
