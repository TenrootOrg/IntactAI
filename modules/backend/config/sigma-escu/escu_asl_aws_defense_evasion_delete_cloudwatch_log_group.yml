title: ASL AWS Defense Evasion Delete CloudWatch Log Group
id: 0f701b38-a0fb-43fd-a83d-d12265f71f33
status: experimental
description: The following analytic detects the deletion of CloudWatch log groups in AWS, identified through `DeleteLogGroup`
  events in CloudTrail logs. This method leverages Amazon Security Lake logs parsed in the OCSF format. The activity is significant
  because attackers may delete log groups to evade detection and disrupt logging capabilities, hindering incident response
  efforts. If confirmed malicious, this action could allow attackers to cover their tracks, making it difficult to trace their
  activities and potentially leading to undetected data breaches or further malicious actions within the compromised AWS environment.
references:
- https://research.splunk.com/0f701b38-a0fb-43fd-a83d-d12265f71f33/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    api.operation: DeleteLogGroup
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
