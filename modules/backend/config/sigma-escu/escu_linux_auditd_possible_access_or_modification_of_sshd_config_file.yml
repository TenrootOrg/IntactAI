title: Linux Auditd Possible Access Or Modification Of Sshd Config File
id: acb3ea33-70f7-47aa-b335-643b3aebcb2f
status: experimental
description: 'The following analytic detects access, deletion or modification of the ssh_config file on Linux systems.

  It leverages data from Linux Auditd, focusing on events of type PATH with a nametype of ("NORMAL", "CREATE", "DELETE").

  This activity could be significant because unauthorized changes to ssh_config can allow threat actors to redirect port connections
  or use unauthorized keys, potentially compromising the system.

  Correlate this with related EXECVE or PROCTITLE events to identify the process or user responsible for the access or modification.

  If confirmed malicious, this could lead to unauthorized access, privilege escalation, or persistent backdoor access, posing
  a severe security risk.'
references:
- https://research.splunk.com/acb3ea33-70f7-47aa-b335-643b3aebcb2f/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1098.004
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: PATH
  sel2:
    full_path|re: /etc/ssh/ssh_config.*
  condition: sel1 and sel2
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098.004/auditd_path_ssh_config/path_ssh_config.log
