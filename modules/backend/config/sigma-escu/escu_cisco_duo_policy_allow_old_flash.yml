title: Cisco Duo Policy Allow Old Flash
id: f36c0d3f-d57f-4b88-a5d4-0a4c9a0752f6
status: experimental
description: The following analytic identifies instances where a Duo administrator creates or updates a policy to allow the
  use of outdated Flash components, specifically by detecting policy changes with the flash_remediation=no remediation attribute.
  It leverages Duo activity logs ingested via the Cisco Security Cloud App, searching for policy_update or policy_create actions
  and parsing the policy description for indicators of weakened security controls. This behavior is significant for a SOC
  because permitting old Flash increases the attack surface, as Flash is widely known for its security vulnerabilities and
  is no longer supported. Attackers may exploit such policy changes to bypass security controls, introduce malware, or escalate
  privileges within the environment. Detecting and responding to these policy modifications helps prevent potential exploitation,
  reduces organizational risk, and ensures adherence to security best practices. Immediate investigation is recommended to
  determine if the c
references:
- https://research.splunk.com/f36c0d3f-d57f-4b88-a5d4-0a4c9a0752f6/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1556
logsource:
  product: cisco
  service: duo
detection:
  sel1:
    action: policy_update
  sel2:
    action: policy_create
  sel3:
    flash_remediation: no remediation
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
