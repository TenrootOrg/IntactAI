title: MS Scripting Process Loading Ldap Module
id: 0b0c40dc-14a6-11ec-b267-acde48001122
status: experimental
description: The following analytic detects the execution of MS scripting processes (wscript.exe or cscript.exe) loading LDAP-related
  modules (Wldap32.dll, adsldp.dll, adsldpc.dll). It leverages Sysmon EventCode 7 to identify these specific DLL loads. This
  activity is significant as it may indicate an attempt to query LDAP for host information, a behavior observed in FIN7 implants.
  If confirmed malicious, this could allow attackers to gather detailed Active Directory information, potentially leading
  to further exploitation or data exfiltration.
references:
- https://research.splunk.com/0b0c40dc-14a6-11ec-b267-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.007
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    Image:
    - '*\\wscript.exe'
    - '*\\cscript.exe'
  sel3:
    ImageLoaded:
    - '*\\Wldap32.dll'
    - '*\\adsldp.dll'
    - '*\\adsldpc.dll'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/fin7/fin7_js_2/sysmon.log
