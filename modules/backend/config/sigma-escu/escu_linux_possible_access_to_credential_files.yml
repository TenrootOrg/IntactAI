title: Linux Possible Access To Credential Files
id: 16107e0e-71fc-11ec-b862-acde48001122
status: experimental
description: The following analytic detects attempts to access or dump the contents of /etc/passwd and /etc/shadow files on
  Linux systems. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on processes like 'cat', 'nano',
  'vim', and 'vi' accessing these files. This activity is significant as it may indicate credential dumping, a technique used
  by adversaries to gain persistence or escalate privileges. If confirmed malicious, attackers could obtain hashed passwords
  for offline cracking, leading to unauthorized access and potential system compromise.
references:
- https://research.splunk.com/16107e0e-71fc-11ec-b862-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1003.008
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image:
    - '*/cat'
    - '*/nano*'
    - '*/vim*'
    - '*/vi*'
  sel2:
    CommandLine:
    - '*/etc/shadow*'
    - '*/etc/passwd*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.008/copy_file_stdoutpipe/sysmon_linux.log
