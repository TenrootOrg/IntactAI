title: Windows IIS Components Add New Module
id: 38fe731c-1f13-43d4-b878-a5bbe44807e3
status: experimental
description: The following analytic detects the execution of AppCmd.exe to install a new module in IIS. This detection leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions. This activity
  is significant as adversaries may use it to install webshells or backdoors, leading to credit card scraping, persistence,
  and further post-exploitation. If confirmed malicious, this could allow attackers to maintain persistent access, execute
  arbitrary code, and potentially exfiltrate sensitive information from the compromised web server.
references:
- https://research.splunk.com/38fe731c-1f13-43d4-b878-a5bbe44807e3/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1505.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage:
    - '*\\msiexec.exe'
    - '*\\iissetup.exe'
  sel2:
    Image: '*\\appcmd.exe'
  sel3:
    CommandLine:
    - '*install *'
    - '*module *'
  sel4:
    CommandLine: '*image*'
  condition: (not (sel1) and sel2 and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1505.004/appcmd_install-windows-sysmon.log
