title: Windows Excessive Service Stop Attempt (counted event)
id: 8f3a614f-6b98-4f7d-82dd-d0df38452a8b-base
status: experimental
description: The following analytic detects multiple attempts to stop or delete services on a system using `net.exe` or `sc.exe`.
  It leverages Endpoint Detection and Response (EDR) telemetry, focusing on process names and command-line executions within
  a one-minute window. This activity is significant as it may indicate an adversary attempting to disable security or critical
  services to evade detection and further their objectives. If confirmed malicious, this could lead to the attacker gaining
  persistence, escalating privileges, or disrupting essential services, thereby compromising the system's security posture.
references:
- https://research.splunk.com/8f3a614f-6b98-4f7d-82dd-d0df38452a8b/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    Image: '*\\sc.exe'
  sel4:
    OriginalFileName: sc.exe
  sel5:
    CommandLine: '*stop*'
  sel6:
    CommandLine: '*delete*'
  condition: (((sel1 or sel2) or (sel3 or sel4)) and (sel5 or sel6))
level: informational
name: escu_base_windows_excessive_service_stop_attempt
