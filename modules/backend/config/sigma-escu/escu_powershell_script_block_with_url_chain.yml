title: PowerShell Script Block With URL Chain
id: 4a3f2a7d-6402-4e64-a76a-869588ec3b57
status: experimental
description: The following analytic identifies suspicious PowerShell script execution via EventCode 4104 that contains multiple
  URLs within a function or array. It leverages PowerShell operational logs to detect script blocks with embedded URLs, often
  indicative of obfuscated scripts or those attempting to download secondary payloads. This activity is significant as it
  may signal an attempt to execute malicious code or download additional malware. If confirmed malicious, this could lead
  to code execution, further system compromise, or data exfiltration. Review parallel processes and the full script block
  for additional context and related artifacts.
references:
- https://research.splunk.com/4a3f2a7d-6402-4e64-a76a-869588ec3b57/
author: Splunk Security Content (Apache-2.0), Steven Dick
tags:
- attack.t1059.001
- attack.t1105
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*http:*'
    - '*https:*'
  sel3:
    ScriptBlockText|re: ("?(https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&\/=]*))"?(?:,|\))?){2,}
  condition: ((sel1 and sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/gootloader/partial_ttps/windows-powershell-xml.log
