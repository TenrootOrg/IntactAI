title: Revil Registry Entry
id: e3d3f57a-c381-11eb-9e35-acde48001122
status: experimental
description: The following analytic identifies suspicious modifications in the registry entry, specifically targeting paths
  used by malware like REVIL. It detects changes in registry paths such as `SOFTWARE\\WOW6432Node\\Facebook_Assistant` and
  `SOFTWARE\\WOW6432Node\\BlackLivesMatter`. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on registry modifications linked to process GUIDs. This activity is significant as it indicates potential malware
  persistence mechanisms, often used by advanced persistent threats (APTs) and ransomware. If confirmed malicious, this could
  allow attackers to maintain persistence, encrypt files, and store critical ransomware-related information on compromised
  hosts.
references:
- https://research.splunk.com/e3d3f57a-c381-11eb-9e35-acde48001122/
author: Splunk Security Content (Apache-2.0), Steven Dick, Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SOFTWARE\\WOW6432Node\\Facebook_Assistant\\*'
  sel2:
    TargetObject: '*\\SOFTWARE\\WOW6432Node\\BlackLivesMatter*'
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/revil/inf1/windows-sysmon.log
