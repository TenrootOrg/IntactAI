title: Linux Auditd Disable Or Modify System Firewall
id: 07052556-d4b5-4bae-89aa-cbdc1bb11250
status: experimental
description: The following analytic detects the suspicious disable or modify system firewall. This behavior is critical for
  a SOC to monitor because it may indicate attempts to gain unauthorized access or maintain control over a system. Such actions
  could be signs of malicious activity. If confirmed, this could lead to serious consequences, including a compromised system,
  unauthorized access to sensitive data, or even a wider breach affecting the entire network. Detecting and responding to
  these signs early is essential to prevent potential security incidents.
references:
- https://research.splunk.com/07052556-d4b5-4bae-89aa-cbdc1bb11250/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1686
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: SERVICE_STOP
  sel2:
    unit:
    - firewalld
    - ufw
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.004/linux_auditd_disable_firewall/linux_auditd_disable_firewall.log
