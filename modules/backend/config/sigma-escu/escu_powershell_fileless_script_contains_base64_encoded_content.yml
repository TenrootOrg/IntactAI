title: Powershell Fileless Script Contains Base64 Encoded Content
id: 8acbc04c-c882-11eb-b060-acde48001122
status: experimental
description: The following analytic detects the execution of PowerShell scripts containing Base64 encoded content, specifically
  identifying the use of `FromBase64String`. It leverages PowerShell Script Block Logging (EventCode=4104) to capture and
  analyze the full command sent to PowerShell. This activity is significant as Base64 encoding is often used by attackers
  to obfuscate malicious payloads, making it harder to detect. If confirmed malicious, this could lead to code execution,
  allowing attackers to run arbitrary commands and potentially compromise the system.
references:
- https://research.splunk.com/8acbc04c-c882-11eb-b060-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1027
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*frombase64string*'
  sel3:
    ScriptBlockText: '*gnirtS46esaBmorF*'
  condition: (sel1 and (sel2 or sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/frombase64string.log
