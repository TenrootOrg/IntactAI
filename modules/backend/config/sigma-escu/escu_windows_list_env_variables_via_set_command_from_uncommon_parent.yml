title: Windows List ENV Variables Via SET Command From Uncommon Parent
id: aec157f4-8783-4584-aca6-754c4dc7fba9
status: experimental
description: The following analytic identifies a suspicious process command line fetching environment variables using the
  cmd.exe "set" command, with a non-shell parent process. It leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on command-line executions and parent process names. This activity could be significant as it is commonly associated
  with malware like Qakbot, which uses this technique to gather system information. If confirmed malicious, this behavior
  could indicate that the parent process has been compromised, potentially allowing attackers to execute arbitrary commands,
  escalate privileges, or persist within the environment.
references:
- https://research.splunk.com/aec157f4-8783-4584-aca6-754c4dc7fba9/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    CommandLine:
    - '*/c set'
    - '*/c "set'
  sel3:
    ParentImage:
    - '*\\cmd.exe'
    - '*\\explorer.exe'
    - '*\\powershell*'
    - '*\\pwsh.exe'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/qakbot/qbot_wermgr/sysmon_wermgr.log
