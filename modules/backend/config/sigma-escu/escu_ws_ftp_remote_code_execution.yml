title: WS FTP Remote Code Execution
id: b84e8f39-4e7b-4d4f-9e7c-fcd29a227845
status: experimental
description: 'The following analytic detects potential Remote Code Execution (RCE) attempts exploiting CVE-2023-40044 in WS_FTP
  software.

  It identifies HTTP POST requests to the "/AHT/AhtApiService.asmx/AuthUser" URL with a status code of 200.

  This detection leverages the Web datamodel to monitor specific URL patterns and HTTP status codes. This activity is significant
  as it may indicate an exploitation attempt, potentially allowing an attacker to execute arbitrary code on the server.

  If confirmed malicious, this could lead to unauthorized access, data exfiltration, or further compromise of the affected
  system.'
references:
- https://research.splunk.com/b84e8f39-4e7b-4d4f-9e7c-fcd29a227845/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/AHT/AhtApiService.asmx/AuthUser'
  sel2:
    sc-status: '200'
  sel3:
    cs-method: POST
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/ws_ftp/wsftpweb.log
