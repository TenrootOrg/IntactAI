title: Allow Inbound Traffic In Firewall Rule
id: a5d85486-b89c-11eb-8267-acde48001122
status: experimental
description: The following analytic detects a suspicious PowerShell command that allows inbound traffic to a specific local
  port within the public profile. It leverages PowerShell script block logging (EventCode 4104) to identify commands containing
  keywords like "firewall," "Inbound," "Allow," and "-LocalPort." This activity is significant because it may indicate an
  attacker attempting to establish remote access by modifying firewall rules. If confirmed malicious, this could allow unauthorized
  access to the machine, potentially leading to further exploitation and data exfiltration.
references:
- https://research.splunk.com/a5d85486-b89c-11eb-8267-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1021.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*firewall*'
  sel3:
    ScriptBlockText: '*Inbound*'
  sel4:
    ScriptBlockText: '*Allow*'
  sel5:
    ScriptBlockText: '*-LocalPort*'
  condition: (sel1 and sel2 and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021/allow_inbound_traffic_in_firewall_rule/windows-xml.log
