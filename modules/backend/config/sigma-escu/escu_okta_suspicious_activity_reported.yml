title: Okta Suspicious Activity Reported
id: bfc840f5-c9c6-454c-aa13-b46fd0bf1e79
status: experimental
description: The following analytic identifies when an associate reports a login attempt as suspicious via an email from Okta.
  It leverages Okta Identity Management logs, specifically the `user.account.report_suspicious_activity_by_enduser` event
  type. This activity is significant as it indicates potential unauthorized access attempts, warranting immediate investigation
  to prevent possible security breaches. If confirmed malicious, the attacker could gain unauthorized access to sensitive
  systems and data, leading to data theft, privilege escalation, or further compromise of the environment.
references:
- https://research.splunk.com/bfc840f5-c9c6-454c-aa13-b46fd0bf1e79/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1078.001
logsource:
  product: okta
  service: okta
detection:
  sel1:
    eventType: user.account.report_suspicious_activity_by_enduser
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078/okta_suspicious_activity_reported_by_user/okta_suspicious_activity_reported_by_user.log
