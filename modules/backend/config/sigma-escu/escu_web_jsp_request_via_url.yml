title: Web JSP Request via URL
id: 2850c734-2d44-4431-8139-1a56f6f54c01
status: experimental
description: The following analytic identifies URL requests associated with CVE-2022-22965 (Spring4Shell) exploitation attempts,
  specifically targeting webshell access on a remote webserver. It detects HTTP GET requests with URLs containing ".jsp?cmd="
  or "j&cmd=" patterns. This activity is significant as it indicates potential webshell deployment, which can lead to unauthorized
  remote command execution. If confirmed malicious, attackers could gain control over the webserver, execute arbitrary commands,
  and potentially escalate privileges, leading to severe data breaches and system compromise.
references:
- https://research.splunk.com/2850c734-2d44-4431-8139-1a56f6f54c01/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1133
- attack.t1190
- attack.t1505.003
logsource:
  category: web
detection:
  sel1:
    cs-method: GET
  sel2:
    c-uri:
    - '*.jsp?cmd=*'
    - '*j&cmd=*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/spring4shell/spring4shell_nginx.log
