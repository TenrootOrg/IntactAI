title: Linux Auditd Add User Account
id: aae66dc0-74b4-4807-b480-b35f8027abb4
status: experimental
description: The following analytic detects the creation of new user accounts on Linux systems using commands like "useradd"
  or "adduser." It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line
  executions. This activity is significant as adversaries often create new user accounts to establish persistence on compromised
  hosts. If confirmed malicious, this could allow attackers to maintain access, escalate privileges, and further compromise
  the system, posing a severe security risk.
references:
- https://research.splunk.com/aae66dc0-74b4-4807-b480-b35f8027abb4/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1136.001
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle:
    - '*useradd*'
    - '*adduser*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1136.001/linux_auditd_add_user/auditd_proctitle_user_add.log
