title: Excessive Usage Of Taskkill (counted event)
id: fe5bca48-accb-11eb-a67c-acde48001122-base
status: experimental
description: The following analytic identifies excessive usage of `taskkill.exe`, a command-line utility used to terminate
  processes. The detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on instances where `taskkill.exe`
  is executed ten or more times within a one-minute span. This behavior is significant as adversaries often use `taskkill.exe`
  to disable security tools or other critical processes to evade detection. If confirmed malicious, this activity could allow
  attackers to bypass security defenses, maintain persistence, and further compromise the system.
references:
- https://research.splunk.com/fe5bca48-accb-11eb-a67c-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\taskkill.exe'
  condition: sel1
level: informational
name: escu_base_excessive_usage_of_taskkill
