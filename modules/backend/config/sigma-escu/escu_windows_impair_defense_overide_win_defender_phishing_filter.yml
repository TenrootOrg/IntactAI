title: Windows Impair Defense Overide Win Defender Phishing Filter
id: 10ca081c-57b1-4a78-ba56-14a40a7e116a
status: experimental
description: The following analytic detects modifications to the Windows registry that disable the Windows Defender phishing
  filter. It leverages data from the Endpoint.Registry data model, focusing on changes to specific registry values related
  to Microsoft Edge's phishing filter settings. This activity is significant because disabling the phishing filter can allow
  attackers to deceive users into visiting malicious websites without triggering browser warnings. If confirmed malicious,
  this could lead to users unknowingly accessing harmful sites, resulting in potential security incidents or data compromises.
references:
- https://research.splunk.com/10ca081c-57b1-4a78-ba56-14a40a7e116a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Bhavin Patel, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\MicrosoftEdge\\PhishingFilter*'
  sel2:
    TargetObject:
    - '*\\EnabledV9'
    - '*\\PreventOverride'
  sel3:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable-windows-security-defender-features/windefender-bypas-2-sysmon.log
