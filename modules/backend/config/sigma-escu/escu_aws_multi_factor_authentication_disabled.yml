title: AWS Multi-Factor Authentication Disabled
id: 374832b1-3603-420c-b456-b373e24d34c0
status: experimental
description: The following analytic detects attempts to disable multi-factor authentication (MFA) for an AWS IAM user. It
  leverages AWS CloudTrail logs to identify events where MFA devices are deleted or deactivated. This activity is significant
  because disabling MFA can indicate an adversary attempting to weaken account security, potentially to maintain persistence
  using a compromised account. If confirmed malicious, this action could allow attackers to retain access to the AWS environment
  without detection, posing a significant risk to the security and integrity of the cloud infrastructure.
references:
- https://research.splunk.com/374832b1-3603-420c-b456-b373e24d34c0/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1556.006
- attack.t1586.003
- attack.t1621
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: DeleteVirtualMFADevice
  sel2:
    eventName: DeactivateMFADevice
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1621/aws_mfa_disabled/cloudtrail.json
