title: Active Setup Registry Autostart
id: f64579c0-203f-11ec-abcc-acde48001122
status: experimental
description: The following analytic detects suspicious modifications to the Active Setup registry for persistence and privilege
  escalation. It leverages data from the Endpoint.Registry data model, focusing on changes to the "StubPath" value within
  the "SOFTWARE\\Microsoft\\Active Setup\\Installed Components" path. This activity is significant as it is commonly used
  by malware, adware, and APTs to maintain persistence on compromised machines. If confirmed malicious, this could allow attackers
  to execute code upon system startup, potentially leading to further system compromise and unauthorized access.
references:
- https://research.splunk.com/f64579c0-203f-11ec-abcc-acde48001122/
author: Splunk Security Content (Apache-2.0), Steven Dick, Teoderick Contreras, Splunk
tags:
- attack.t1547.014
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\StubPath'
  sel2:
    TargetObject: '*\\SOFTWARE\\Microsoft\\Active Setup\\Installed Components*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/t1547.014/active_setup_stubpath/sysmon.log
x-intact-burst: false
x-intact: 'Fired 2 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
