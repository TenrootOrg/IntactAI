title: SecretDumps Offline NTDS Dumping Tool
id: 5672819c-be09-11eb-bbfb-acde48001122
status: experimental
description: The following analytic detects the potential use of the secretsdump.py tool to dump NTLM hashes from a copy of
  ntds.dit and the SAM, SYSTEM, and SECURITY registry hives. It leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on specific command-line patterns and process names associated with secretsdump.py. This activity is significant
  because it indicates an attempt to extract sensitive credential information offline, which is a common post-exploitation
  technique. If confirmed malicious, this could allow an attacker to obtain NTLM hashes, facilitating further lateral movement
  and potential privilege escalation within the network.
references:
- https://research.splunk.com/5672819c-be09-11eb-bbfb-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\python*.exe'
  sel2:
    CommandLine: '*.py*'
  sel3:
    CommandLine: '*-ntds*'
  sel4:
    CommandLine: '*-system*'
  sel5:
    CommandLine: '*-sam*'
  sel6:
    CommandLine: '*-security*'
  sel7:
    CommandLine: '*-bootkey*'
  condition: (sel1 and sel2 and sel3 and (((sel4 or sel5) or sel6) or sel7))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/honeypots/casper/datasets1/windows-sysmon.log
