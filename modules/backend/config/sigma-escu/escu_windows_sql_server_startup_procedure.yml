title: Windows SQL Server Startup Procedure
id: 7bec7c5c-2262-4adb-ba56-c8028512bc58
status: experimental
description: This detection identifies when a startup procedure is registered or executed in SQL Server. Startup procedures
  automatically execute when SQL Server starts, making them an attractive persistence mechanism for attackers. The detection
  monitors for suspicious stored procedure names and patterns that may indicate malicious activity, such as attempts to execute
  operating system commands or gain elevated privileges.
