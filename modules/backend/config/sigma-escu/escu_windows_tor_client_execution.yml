title: Windows TOR Client Execution
id: f164bc6f-ecbe-45e0-aaa6-f5c4d8c84b9a
status: experimental
description: 'The following analytic detects the execution of the TOR Browser and related TOR components on Windows endpoints
  by monitoring process creation activity.

  Adversaries and insider threats leverage TOR to anonymize command-and-control traffic, facilitate data exfiltration, and
  evade network monitoring and policy enforcement.

  While TOR can be used for legitimate research and privacy purposes, its presence on enterprise endpoints is often unusual
  and should be investigated to determine intent, scope, and any associated malicious behavior.'
references:
- https://research.splunk.com/f164bc6f-ecbe-45e0-aaa6-f5c4d8c84b9a/
author: Splunk Security Content (Apache-2.0), Vignesh Subramanian, Splunk
tags:
- attack.t1090.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\tor.exe'
  sel2:
    Image: '*\\BraveSoftware\\Brave-Browser*'
  sel3:
    Image: '*\\tor-*'
  condition: (sel1 or (sel2 and sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1090.003/windows_tor_client_execution/windows-sysmon.log
