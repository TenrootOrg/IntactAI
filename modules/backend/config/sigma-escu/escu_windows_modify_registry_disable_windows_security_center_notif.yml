title: Windows Modify Registry Disable Windows Security Center Notif
id: 27ed3e79-6d86-44dd-b9ab-524451c97a7b
status: experimental
description: The following analytic detects modifications to the Windows registry aimed at disabling Windows Security Center
  notifications. It leverages data from the Endpoint.Registry datamodel, specifically monitoring changes to the registry path
  "*\\Windows\\CurrentVersion\\ImmersiveShell\\UseActionCenterExperience*" with a value of "0x00000000". This activity is
  significant as it can indicate an attempt by adversaries or malware, such as Azorult, to evade defenses by suppressing critical
  update notifications. If confirmed malicious, this could allow attackers to persist undetected, potentially leading to further
  exploitation and compromise of the host system.
references:
- https://research.splunk.com/27ed3e79-6d86-44dd-b9ab-524451c97a7b/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows\\CurrentVersion\\ImmersiveShell\\UseActionCenterExperience*'
  sel2:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
