title: Windows Default Rdp File Unhidden
id: f5c1f64b-db59-4913-991e-3dac8adff288
status: experimental
description: This detection identifies the use of attrib.exe to remove hidden (-h) or system (-s) attributes from the Default.rdp
  file, which is automatically created in a user's Documents folder when a Remote Desktop Protocol (RDP) session is initiated
  using mstsc.exe. The Default.rdp file stores session configuration details such as the remote host address and screen settings.
  Unhiding this file is uncommon in normal user behavior and may indicate that an attacker or red team operator is attempting
  to access or manipulate RDP connection history that was previously hidden—either by default or as part of an earlier anti-forensics
  effort. This activity may represent part of a broader pattern of reconnaissance or staging for credential reuse, lateral
  movement, or forensic analysis evasion. Monitoring for this behavior can help uncover suspicious manipulation of user artifacts
  and highlight interactive attacker activity on a compromised host.
references:
- https://research.splunk.com/f5c1f64b-db59-4913-991e-3dac8adff288/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\attrib.exe'
  sel2:
    CommandLine:
    - '*-s*'
    - '*-h*'
  sel3:
    CommandLine: '*default.rdp*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.001/unhide_file/unhide_file.log
