title: Nishang PowershellTCPOneLine
id: 1a382c6c-7c2e-11eb-ac69-acde48001122
status: experimental
description: The following analytic detects the use of the Nishang Invoke-PowerShellTCPOneLine utility, which initiates a
  callback to a remote Command and Control (C2) server. It leverages Endpoint Detection and Response (EDR) data, focusing
  on PowerShell processes that include specific .NET classes like Net.Sockets.TCPClient and System.Text.ASCIIEncoding. This
  activity is significant as it indicates potential remote control or data exfiltration attempts by an attacker. If confirmed
  malicious, this could lead to unauthorized remote access, data theft, or further compromise of the affected system.
references:
- https://research.splunk.com/1a382c6c-7c2e-11eb-ac69-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    CommandLine: '*Net.Sockets.TCPClient*'
  sel8:
    CommandLine: '*System.Text.ASCIIEncoding*'
  condition: ((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) and (sel7 and sel8))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/atomic_red_team/windows-sysmon.log
