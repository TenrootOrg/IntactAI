title: PowerShell Invoke CIMMethod CIMSession
id: 651ee958-a433-471c-b264-39725b788b83
status: experimental
description: The following analytic detects the creation of a New-CIMSession cmdlet followed by the use of the Invoke-CIMMethod
  cmdlet within PowerShell. It leverages PowerShell Script Block Logging to identify these specific cmdlets in the ScriptBlockText
  field. This activity is significant because it mirrors the behavior of the Invoke-WMIMethod cmdlet, often used for remote
  code execution via NTLMv2 pass-the-hash authentication. If confirmed malicious, this could allow an attacker to execute
  commands remotely, potentially leading to unauthorized access and control over targeted systems.
references:
- https://research.splunk.com/651ee958-a433-471c-b264-39725b788b83/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1047
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*invoke-CIMMethod*'
    - '*New-CimSession*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1047/atomic_red_team/4104-cimmethod-windows-powershell.log
