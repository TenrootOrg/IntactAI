title: Detect Regasm with no Command Line Arguments
id: c3bc1430-04e7-4178-835f-047d8e6e97df
status: experimental
description: The following analytic detects instances of regasm.exe running without command line arguments. This behavior
  typically indicates process injection, where another process manipulates regasm.exe. The detection leverages Endpoint Detection
  and Response (EDR) data, focusing on process names and command-line executions. This activity is significant as it may signal
  an attempt to evade detection or execute malicious code. If confirmed malicious, attackers could achieve code execution,
  potentially leading to privilege escalation, persistence, or access to sensitive information. Investigate network connections,
  parallel processes, and suspicious module loads for further context.
references:
- https://research.splunk.com/c3bc1430-04e7-4178-835f-047d8e6e97df/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.009
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\regasm.exe'
  sel2:
    OriginalFileName: RegAsm.exe
  sel3:
    CommandLine:
    - '*regasm'
    - '*regasm.exe'
    - '*regasm.exe"'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.009/atomic_red_team/windows-sysmon.log
