title: Domain Account Discovery with Dsquery
id: b1a8ce04-04c2-11ec-bea7-acde48001122
status: experimental
description: The following analytic identifies the execution of `dsquery.exe` with command-line arguments used to discover
  domain users. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line
  executions. This activity is significant as it indicates potential reconnaissance efforts by adversaries to map out domain
  users, which is a common precursor to further attacks. If confirmed malicious, this behavior could allow attackers to gain
  insights into user accounts, facilitating subsequent actions like privilege escalation or lateral movement within the network.
references:
- https://research.splunk.com/b1a8ce04-04c2-11ec-bea7-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\dsquery.exe'
  sel2:
    CommandLine: '*user*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/windows-sysmon.log
