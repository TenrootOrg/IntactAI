title: BITSAdmin Download File
id: 80630ff4-8e4c-11eb-aab5-acde48001122
status: experimental
description: The following analytic detects the use of `bitsadmin.exe` with the `transfer` parameter to download a remote
  object. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process and command-line telemetry.
  This activity is significant because `bitsadmin.exe` can be exploited to download and execute malicious files without immediate
  detection. If confirmed malicious, an attacker could use this technique to download and execute payloads, potentially leading
  to code execution, privilege escalation, or persistent access within the environment. Review parallel and child processes,
  especially `svchost.exe`, for associated artifacts.
references:
- https://research.splunk.com/80630ff4-8e4c-11eb-aab5-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Sittikorn S
tags:
- attack.t1197
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\bitsadmin.exe'
  sel2:
    OriginalFileName: bitsadmin.exe
  sel3:
    CommandLine:
    - '*transfer*'
    - '*addfile*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1197/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1197/atomic_red_team/crowdstrike_falcon.log
