title: Windows Modify Registry AuthenticationLevelOverride
id: 6410a403-36bb-490f-a06a-11c3be7d2a41
status: experimental
description: The following analytic detects modifications to the Windows registry key "AuthenticationLevelOverride" within
  the Terminal Server Client settings. It leverages data from the Endpoint.Registry datamodel to identify changes where the
  registry value is set to 0x00000000. This activity is significant as it may indicate an attempt to override authentication
  levels for remote connections, a tactic used by DarkGate malware for malicious installations. If confirmed malicious, this
  could allow attackers to gain unauthorized remote access, potentially leading to data exfiltration or further system compromise.
references:
- https://research.splunk.com/6410a403-36bb-490f-a06a-11c3be7d2a41/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Terminal Server Client\\AuthenticationLevelOverride'
  sel2:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1112/AuthenticationLevelOverride/auth_sys.log
