title: Detect SharpHound Usage
id: dd04b29a-beed-11eb-87bc-acde48001122
status: experimental
description: The following analytic detects the usage of the SharpHound binary by identifying its original filename, `SharpHound.exe`,
  and the process name. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process
  metadata and command-line executions. SharpHound is a tool used for Active Directory enumeration, often by attackers during
  the reconnaissance phase. If confirmed malicious, this activity could allow an attacker to map out the network, identify
  high-value targets, and plan further attacks, potentially leading to privilege escalation and lateral movement within the
  environment.
references:
- https://research.splunk.com/dd04b29a-beed-11eb-87bc-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1069.001
- attack.t1069.002
- attack.t1087.001
- attack.t1087.002
- attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sharphound.exe'
  sel2:
    OriginalFileName: SharpHound.exe
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/sharphound/windows-sysmon.log
