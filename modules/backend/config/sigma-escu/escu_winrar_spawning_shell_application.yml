title: WinRAR Spawning Shell Application
id: d2f36034-37fa-4bd4-8801-26807c15540f
status: experimental
description: The following analytic detects the execution of Windows shell processes initiated by WinRAR, such as "cmd.exe",
  "powershell.exe", "certutil.exe", "mshta.exe", or "bitsadmin.exe". This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process and parent process relationships. This activity is significant because it
  may indicate exploitation of the WinRAR CVE-2023-38831 vulnerability, where malicious scripts are executed from spoofed
  ZIP archives. If confirmed malicious, this could lead to unauthorized access, financial loss, and further malicious activities
  like data theft or ransomware attacks.
references:
- https://research.splunk.com/d2f36034-37fa-4bd4-8801-26807c15540f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\winrar.exe'
  sel2:
    Image:
    - '*\\cmd.exe'
    - '*\\powershell.exe'
    - '*\\powershell_ise.exe'
    - '*\\pwsh.exe'
    - '*\\sh.exe'
    - '*\\bash.exe'
    - '*\\wscript.exe'
    - '*\\cscript.exe'
    - '*\\wt.exe'
    - '*\\WindowsTerminal.exe'
    - '*\\mshta.exe'
  sel3:
    Image:
    - '*\\certutil.exe'
    - '*\\mshta.exe'
    - '*\\bitsadmin.exe'
  condition: (sel1 and (sel2 or sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/atomic_red_team/winrar.log
