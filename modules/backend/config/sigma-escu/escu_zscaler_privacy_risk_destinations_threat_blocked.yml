title: Zscaler Privacy Risk Destinations Threat Blocked
id: 5456bdef-d765-4565-8e1f-61ca027bc50d
status: experimental
description: The following analytic identifies blocked destinations within a network that are deemed privacy risks by Zscaler.
  It leverages web proxy logs, focusing on entries marked as "Privacy Risk." Key data points such as device owner, user, URL
  category, destination URL, and IP are analyzed. This activity is significant for a SOC as it helps monitor and manage privacy
  risks, ensuring a secure network environment. If confirmed malicious, this activity could indicate attempts to access or
  exfiltrate sensitive information, posing a significant threat to data privacy and security.
references:
- https://research.splunk.com/5456bdef-d765-4565-8e1f-61ca027bc50d/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Rod Soto, Splunk
tags:
- attack.t1566
logsource:
  category: proxy
detection:
  sel1:
    action: blocked
  sel2:
    urlclass: Privacy Risk
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566/zscalar_web_proxy/zscalar_web_proxy.json
