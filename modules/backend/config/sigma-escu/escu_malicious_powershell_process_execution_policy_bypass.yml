title: Malicious PowerShell Process - Execution Policy Bypass
id: 9be56c82-b1cc-4318-87eb-d138afaaca39
status: experimental
description: The following analytic detects PowerShell processes initiated with parameters that bypass the local execution
  policy for scripts. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions
  containing specific flags like "-ex" or "bypass." This activity is significant because bypassing execution policies is a
  common tactic used by attackers to run malicious scripts undetected. If confirmed malicious, this could allow an attacker
  to execute arbitrary code, potentially leading to further system compromise, data exfiltration, or persistent access within
  the environment.
references:
- https://research.splunk.com/9be56c82-b1cc-4318-87eb-d138afaaca39/
author: Splunk Security Content (Apache-2.0), Rico Valdez, Mauricio Velazco, Splunk
tags:
- attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    CommandLine: '* -ex*'
  sel8:
    CommandLine: '* bypass *'
  condition: ((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) and (sel7 and sel8))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/encoded_powershell/windows-sysmon.log
