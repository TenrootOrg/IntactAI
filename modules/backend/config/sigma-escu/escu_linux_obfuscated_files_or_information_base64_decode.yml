title: Linux Obfuscated Files or Information Base64 Decode
id: 303b38b2-c03f-44e2-8f41-4594606fcfc7
status: experimental
description: The following analytic detects the use of the base64 decode command on Linux systems, which is often used to
  deobfuscate files. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions
  that include "base64 -d" or "base64 --decode". This activity is significant as it may indicate an attempt to hide malicious
  payloads or scripts. If confirmed malicious, an attacker could use this technique to execute hidden code, potentially leading
  to unauthorized access, data exfiltration, or further system compromise.
references:
- https://research.splunk.com/303b38b2-c03f-44e2-8f41-4594606fcfc7/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1027
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/base64'
  sel2:
    CommandLine: '*-d*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1027/atomic_red_team/linux-sysmon.log
