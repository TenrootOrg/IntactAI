title: Windows Alternate DataStream - Executable Content
id: a258bf2a-34fd-4986-8086-78f506e00206
status: experimental
description: The following analytic detects the writing of data with an IMPHASH value to an Alternate Data Stream (ADS) in
  the NTFS file system. It leverages Sysmon Event ID 15 and regex to identify files with a Portable Executable (PE) structure.
  This activity is significant as it may indicate a threat actor staging malicious code in hidden areas for persistence or
  future execution. If confirmed malicious, this could allow attackers to execute hidden code, maintain persistence, or escalate
  privileges within the environment.
references:
- https://research.splunk.com/a258bf2a-34fd-4986-8086-78f506e00206/
author: Splunk Security Content (Apache-2.0), Steven Dick, Teoderick Contreras, Splunk
tags:
- attack.t1564.004
logsource:
  product: windows
  service: sysmon
detection:
  sel1:
    EventID: '15'
  sel2:
    IMPHASH: '00000000000000000000000000000000'
  sel3:
    TargetFilename|re: (?<!\/)\b\w+(\.\w+)?:\w+(\.\w+)?$
  condition: ((sel1 and not sel2) and sel3)
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1564.004/ads_abuse/ads_abuse_sysmon.log
x-intact-burst: false
x-intact: 'Fired 8 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
