title: Add DefaultUser And Password In Registry
id: d4a3eb62-0f1e-11ec-a971-acde48001122
status: experimental
description: The following analytic detects suspicious registry modifications that implement auto admin logon by adding DefaultUserName
  and DefaultPassword values. It leverages data from the Endpoint.Registry data model, specifically monitoring changes to
  the "SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" registry path. This activity is significant because it is associated
  with BlackMatter ransomware, which uses this technique to automatically log on to compromised hosts and continue encryption
  after a safe mode boot. If confirmed malicious, this could allow attackers to maintain persistence and further encrypt the
  network, leading to significant data loss and operational disruption.
references:
- https://research.splunk.com/d4a3eb62-0f1e-11ec-a971-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk, Steven Dick
tags:
- attack.t1552.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon*'
  sel2:
    TargetObject: '*\\DefaultPassword'
  sel3:
    TargetObject: '*\\DefaultUserName'
  condition: (sel1 and (sel2 or sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552.002/autoadminlogon/windows-sysmon.log
x-intact-burst: false
x-intact: 'Fired 2 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
