title: Windows Curl Upload to Remote Destination
id: 42f8f1a2-4228-11ec-aade-acde48001122
status: experimental
description: 'The following analytic detects the use of Windows Curl.exe to upload a file to a remote destination.

  It identifies command-line arguments such as `-T`, `--upload-file`, `-d`, `--data`, and `-F` in process execution logs.

  This activity is significant because adversaries may use Curl to exfiltrate data or upload malicious payloads. If confirmed
  malicious, this could lead to data breaches or further compromise of the system.

  Analysts should review parallel processes and network logs to determine if the upload was successful and isolate the endpoint
  if necessary.'
references:
- https://research.splunk.com/42f8f1a2-4228-11ec-aade-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\curl.exe'
  sel2:
    OriginalFileName: Curl.exe
  sel3:
    CommandLine:
    - '*-T *'
    - '*--upload-file *'
    - '*-d *'
    - '*--data *'
    - '*-F *'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/atomic_red_team/windows-sysmon_curl_upload.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_network_visibility_module/cisco_nvm_flowdata/nvm_flowdata.log
