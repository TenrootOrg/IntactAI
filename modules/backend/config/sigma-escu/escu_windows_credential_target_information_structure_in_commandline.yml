title: Windows Credential Target Information Structure in Commandline
id: f79c5d7a-dd99-4263-93e1-49ace5634c82
status: experimental
description: Detects DNS-based Kerberos coercion attacks where adversaries inject marshaled credential structures into DNS
  records to spoof SPNs and redirect authentication such as in CVE-2025-33073. This detection leverages process creation events
  looking for specific CREDENTIAL_TARGET_INFORMATION structures.
references:
- https://research.splunk.com/f79c5d7a-dd99-4263-93e1-49ace5634c82/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1557.001
- attack.t1187
- attack.t1071.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*1UWhRCA*'
  sel2:
    CommandLine: '*AAAAA*'
  sel3:
    CommandLine: '*YBAAAA*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1071.004/kerberos_coercion/sysmon.log
