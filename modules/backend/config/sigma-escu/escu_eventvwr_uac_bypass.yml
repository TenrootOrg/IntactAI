title: Eventvwr UAC Bypass
id: 9cf8fe08-7ad8-11eb-9819-acde48001122
status: experimental
description: The following analytic detects an Eventvwr UAC bypass by identifying suspicious registry modifications in the
  path that Eventvwr.msc references upon execution. This detection leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on registry changes and process execution details. This activity is significant because it indicates a
  potential privilege escalation attempt, allowing an attacker to execute arbitrary commands with elevated privileges. If
  confirmed malicious, this could lead to unauthorized code execution, persistence, and further compromise of the affected
  system.
references:
- https://research.splunk.com/9cf8fe08-7ad8-11eb-9819-acde48001122/
author: Splunk Security Content (Apache-2.0), Steven Dick, Michael Haag, Splunk
tags:
- attack.t1548.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*mscfile\\shell\\open\\command\\*'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.002/atomic_red_team/windows-sysmon.log
