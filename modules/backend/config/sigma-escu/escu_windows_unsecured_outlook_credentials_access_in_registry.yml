title: Windows Unsecured Outlook Credentials Access In Registry
id: 36334123-077d-47a2-b70c-6c7b3cc85049
status: experimental
description: 'The following analytic detects unauthorized access to Outlook credentials stored in the Windows registry.

  It leverages Windows Security Event logs, specifically EventCode 4663, to identify access attempts to registry paths associated
  with Outlook profiles.

  This activity is significant as it may indicate attempts to steal sensitive email credentials, which could lead to unauthorized
  access to email accounts.

  If confirmed malicious, this could allow attackers to exfiltrate sensitive information, impersonate users, or execute further
  unauthorized actions within Outlook, posing a significant security risk.'
references:
- https://research.splunk.com/36334123-077d-47a2-b70c-6c7b3cc85049/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1552
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ObjectName:
    - '*\\Profiles\\Outlook\\9375CFF0413111d3B88A00104B2A6676*'
    - '*\\Windows Messaging Subsystem\\Profiles\\9375CFF0413111d3B88A00104B2A6676*'
  sel3:
    Image:
    - '*\\HxOutlook.exe'
    - '*\\Outlook.exe'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552/snakey_keylogger_outlook_reg_access/snakekeylogger_4663.log
