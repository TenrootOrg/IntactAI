title: GetDomainGroup with PowerShell
id: 93c94be3-bead-4a60-860f-77ca3fe59903
status: experimental
description: The following analytic detects the execution of `powershell.exe` with command-line arguments that query for domain
  groups using `Get-DomainGroup`. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process names and command-line executions mapped to the `Processes` node of the `Endpoint` data model. Monitoring this
  activity is crucial as `Get-DomainGroup` is part of PowerView, a tool often used by adversaries for domain enumeration and
  situational awareness. If confirmed malicious, this activity could allow attackers to gain insights into domain group structures,
  aiding in further exploitation and privilege escalation.
references:
- https://research.splunk.com/93c94be3-bead-4a60-860f-77ca3fe59903/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1069.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\powershell.exe'
  sel2:
    CommandLine: '*Get-DomainGroup*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1069.002/AD_discovery/windows-sysmon.log
