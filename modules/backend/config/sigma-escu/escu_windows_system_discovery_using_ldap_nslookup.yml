title: Windows System Discovery Using ldap Nslookup
id: 2418780f-7c3e-4c45-b8b4-996ea850cd49
status: experimental
description: The following analytic detects the execution of nslookup.exe to query domain information using LDAP. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments. This activity
  is significant as nslookup.exe can be abused by malware like Qakbot to gather critical domain details, such as SRV records
  and server names. If confirmed malicious, this behavior could allow attackers to map the network, identify key servers,
  and plan further attacks, potentially leading to data exfiltration or lateral movement within the network.
references:
- https://research.splunk.com/2418780f-7c3e-4c45-b8b4-996ea850cd49/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1033
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\nslookup.exe'
  sel2:
    OriginalFileName: nslookup.exe
  sel3:
    CommandLine: '*_ldap._tcp.dc._msdcs*'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1033/qakbot_discovery_cmdline/sysmon.log
