title: Shim Database File Creation
id: 6e4c4588-ba2f-42fa-97e6-9f6f548eaa33
status: experimental
description: The following analytic detects the creation of shim database files (.sdb) in default directories using the sdbinst.exe
  application. It leverages filesystem activity data from the Endpoint.Filesystem data model to identify file writes to the
  Windows\AppPatch\Custom directory. This activity is significant because shims can intercept and alter API calls, potentially
  allowing attackers to bypass security controls or execute malicious code. If confirmed malicious, this could lead to unauthorized
  code execution, privilege escalation, or persistent access within the environment.
references:
- https://research.splunk.com/6e4c4588-ba2f-42fa-97e6-9f6f548eaa33/
author: Splunk Security Content (Apache-2.0), David Dorsey, Splunk
tags:
- attack.t1546.011
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*Windows\\AppPatch\\Custom*'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
