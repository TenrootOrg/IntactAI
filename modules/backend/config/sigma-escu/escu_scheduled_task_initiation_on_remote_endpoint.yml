title: Scheduled Task Initiation on Remote Endpoint
id: 95cf4608-4302-11ec-8194-3e22fbd008af
status: experimental
description: The following analytic detects the use of 'schtasks.exe' to start a Scheduled Task on a remote endpoint. This
  detection leverages Endpoint Detection and Response (EDR) data, focusing on process details such as process name, parent
  process, and command-line executions. This activity is significant as adversaries often abuse Task Scheduler for lateral
  movement and remote code execution. If confirmed malicious, this behavior could allow attackers to execute arbitrary code
  remotely, potentially leading to further compromise of the network.
references:
- https://research.splunk.com/95cf4608-4302-11ec-8194-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk, Badoodish, Github Community
tags:
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\schtasks.exe'
  sel2:
    OriginalFileName: schtasks.exe
  sel3:
    CommandLine: '* /S *'
  sel4:
    CommandLine: '*/run*'
  condition: ((sel1 or sel2) and (sel3 and sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/lateral_movement/windows-sysmon.log
