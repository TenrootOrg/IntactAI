title: Linux PHP Privilege Escalation
id: 4fc4c031-e5be-4cc0-8cf9-49f9f507bcb5
status: experimental
description: The following analytic detects the execution of PHP commands with elevated privileges on a Linux system. It identifies
  instances where PHP is used in conjunction with 'sudo' and 'system' commands, indicating an attempt to run system commands
  as the root user. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process command-line
  arguments. This activity is significant because it can indicate an attempt to escalate privileges, potentially leading to
  full root access. If confirmed malicious, this could allow an attacker to execute arbitrary commands with root privileges,
  compromising the entire system.
references:
- https://research.splunk.com/4fc4c031-e5be-4cc0-8cf9-49f9f507bcb5/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*php*-r*'
  sel2:
    CommandLine: '*system*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/php/sysmon_linux.log
