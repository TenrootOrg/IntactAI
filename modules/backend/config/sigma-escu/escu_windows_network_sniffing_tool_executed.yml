title: Windows Network Sniffing Tool Executed
id: 0c594353-e12d-4867-92f6-2a1b8a1faf5f
status: experimental
description: 'The following analytic detects the execution of common network sniffing tools on Windows systems, including
  Wireshark, WinPcap, tcpdump, and similar utilities.

  This activity is significant because attackers use packet capture tools to intercept and analyze network traffic, enabling
  credential theft, sensitive data harvesting, and reconnaissance of internal network communications.

  While these tools have legitimate administrative uses, their presence in unexpected environments may indicate an adversary
  conducting man-in-the-middle attacks or exfiltrating sensitive information traversing the network.

  If confirmed malicious, this could lead to the exposure of credentials, session tokens, and confidential data, facilitating
  lateral movement and further compromise of the environment.'
references:
- https://research.splunk.com/0c594353-e12d-4867-92f6-2a1b8a1faf5f/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1040
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\dumpcap.exe'
    - '*\\netcap.exe'
    - '*\\netmon.exe'
    - '*\\tcpdump.exe'
    - '*\\tshark.exe'
    - '*\\windump.exe'
    - '*\\winpcap.exe'
    - '*\\wireshark.exe'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1040/windows_network_sniffing_tools/snapattack_windows.log
