title: Screensaver Event Trigger Execution
id: 58cea3ec-1f6d-11ec-8560-acde48001122
status: experimental
description: The following analytic detects modifications to the SCRNSAVE.EXE registry entry, indicating potential event trigger
  execution via screensaver settings for persistence or privilege escalation. It leverages registry activity data from the
  Endpoint data model to identify changes to the specified registry path. This activity is significant as it is a known technique
  used by APT groups and malware to maintain persistence or escalate privileges. If confirmed malicious, this could allow
  an attacker to execute arbitrary code with elevated privileges, leading to further system compromise and persistent access.
references:
- https://research.splunk.com/58cea3ec-1f6d-11ec-8560-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1546.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Control Panel\\Desktop\\SCRNSAVE.EXE*'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1546.002/scrnsave_reg/sysmon.log
