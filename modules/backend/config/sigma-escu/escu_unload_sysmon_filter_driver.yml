title: Unload Sysmon Filter Driver
id: e5928ff3-23eb-4d8b-b8a4-dcbc844fdfbe
status: experimental
description: The following analytic detects the use of `fltMC.exe` to unload the Sysmon driver, which stops Sysmon from collecting
  data. It leverages Endpoint Detection and Response (EDR) logs, focusing on process names and command-line executions. This
  activity is significant because disabling Sysmon can blind security monitoring, allowing malicious actions to go undetected.
  If confirmed malicious, this could enable attackers to execute further attacks without being logged, leading to potential
  data breaches, privilege escalation, or persistent access within the environment.
references:
- https://research.splunk.com/e5928ff3-23eb-4d8b-b8a4-dcbc844fdfbe/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\fltMC.exe'
  sel2:
    CommandLine: '*unload*'
  sel3:
    CommandLine: '*SysmonDrv*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/unload_sysmon/windows-sysmon.log
