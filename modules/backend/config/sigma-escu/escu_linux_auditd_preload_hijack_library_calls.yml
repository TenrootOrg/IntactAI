title: Linux Auditd Preload Hijack Library Calls
id: 35c50572-a70b-452f-afa9-bebdf3c3ce36
status: experimental
description: The following analytic detects the use of the LD_PRELOAD environment variable to hijack or hook library functions
  on a Linux platform. It leverages data from Linux Auditd, focusing on process execution logs that include command-line details.
  This activity is significant because adversaries, malware authors, and red teamers commonly use this technique to gain elevated
  privileges and establish persistence on a compromised machine. If confirmed malicious, this behavior could allow attackers
  to execute arbitrary code, escalate privileges, and maintain long-term access to the system.
references:
- https://research.splunk.com/35c50572-a70b-452f-afa9-bebdf3c3ce36/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1574.006
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    CommandLine: '*LD_PRELOAD*'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1574.006/linux_auditd_ldpreload/auditd_execve_ldpreload.log
