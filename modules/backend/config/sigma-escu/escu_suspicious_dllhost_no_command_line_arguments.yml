title: Suspicious DLLHost no Command Line Arguments
id: ff61e98c-0337-4593-a78f-72a676c56f26
status: experimental
description: The following analytic detects instances of DLLHost.exe executing without command line arguments. This behavior
  is unusual and often associated with malicious activities, such as those performed by Cobalt Strike. The detection leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process execution logs. This activity is significant
  because DLLHost.exe typically requires arguments to function correctly, and its absence may indicate an attempt to evade
  detection. If confirmed malicious, this could lead to unauthorized actions like credential dumping or file manipulation,
  posing a severe threat to the environment.
references:
- https://research.splunk.com/ff61e98c-0337-4593-a78f-72a676c56f26/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\dllhost.exe'
  sel2:
    OriginalFileName: dllhost.exe
  sel3:
    CommandLine:
    - '*dllhost'
    - '*dllhost.exe'
    - '*dllhost.exe"'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1055/cobalt_strike/windows-sysmon.log
