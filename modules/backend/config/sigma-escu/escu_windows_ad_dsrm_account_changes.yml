title: Windows AD DSRM Account Changes
id: 08cb291e-ea77-48e8-a95a-0799319bf056
status: experimental
description: The following analytic identifies changes to the Directory Services Restore Mode (DSRM) account behavior via
  registry modifications. It detects alterations in the registry path "*\\System\\CurrentControlSet\\Control\\Lsa\\DSRMAdminLogonBehavior"
  with specific values indicating potential misuse. This activity is significant because the DSRM account, if misconfigured,
  can be exploited to persist within a domain, similar to a local administrator account. If confirmed malicious, an attacker
  could gain persistent administrative access to a Domain Controller, leading to potential domain-wide compromise and unauthorized
  access to sensitive information.
references:
- https://research.splunk.com/08cb291e-ea77-48e8-a95a-0799319bf056/
author: Splunk Security Content (Apache-2.0), Dean Luxton
tags:
- attack.t1098
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\System\\CurrentControlSet\\Control\\Lsa\\DSRMAdminLogonBehavior'
  sel2:
    Details:
    - '* (*1)'
    - '*1'
    - '* (*2)'
    - '*2'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098/dsrm_account/windows-sysmon.log
