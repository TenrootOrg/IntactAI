title: Linux Shred Overwrite Command
id: c1952cf1-643c-4965-82de-11c067cbae76
status: experimental
description: The following analytic detects the execution of the 'shred' command on a Linux machine, which is used to overwrite
  files to make them unrecoverable. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process
  names and command-line arguments. This activity is significant because the 'shred' command can be used in destructive attacks,
  such as those seen in the Industroyer2 malware targeting energy facilities. If confirmed malicious, this activity could
  lead to the permanent destruction of critical files, severely impacting system integrity and data availability.
references:
- https://research.splunk.com/c1952cf1-643c-4965-82de-11c067cbae76/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1485
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/shred'
  sel2:
    CommandLine:
    - '*-n*'
    - '*-u*'
    - '*-z*'
    - '*-s*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1485/rm_shred_critical_dir/sysmon_linux.log
