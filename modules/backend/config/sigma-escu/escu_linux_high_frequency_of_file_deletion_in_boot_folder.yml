title: Linux High Frequency Of File Deletion In Boot Folder (counted event)
id: e27fbc5d-0445-4c4a-bc39-87f060d5c602-base
status: experimental
description: The following analytic detects a high frequency of file deletions in the /boot/ folder on Linux systems. It leverages
  filesystem event logs to identify when 200 or more files are deleted within an hour by the same process. This behavior is
  significant as it may indicate the presence of wiper malware, such as Industroyer2, which targets critical system directories.
  If confirmed malicious, this activity could lead to system instability or failure, hindering the boot process and potentially
  causing a complete system compromise.
references:
- https://research.splunk.com/e27fbc5d-0445-4c4a-bc39-87f060d5c602/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
- attack.t1485
logsource:
  category: file_delete
  product: linux
detection:
  sel1:
    TargetFilename: /boot/*
  condition: sel1
level: informational
name: escu_base_linux_high_frequency_of_file_deletion_in_boot_folder
