title: Windows InstallUtil URL in Command Line
id: 28e06670-43df-11ec-a569-acde48001122
status: experimental
description: The following analytic detects the use of Windows InstallUtil.exe with an HTTP or HTTPS URL in the command line.
  This is identified through Endpoint Detection and Response (EDR) telemetry, focusing on command-line executions containing
  URLs. This activity is significant as it may indicate an attempt to download and execute malicious code, potentially bypassing
  application control mechanisms. If confirmed malicious, this could lead to unauthorized code execution, privilege escalation,
  or persistent access within the environment. Analysts should review the parent process, network connections, file modifications,
  and related processes for further investigation.
references:
- https://research.splunk.com/28e06670-43df-11ec-a569-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\installutil.exe'
  sel2:
    OriginalFileName: InstallUtil.exe
  sel3:
    CommandLine:
    - '*http://*'
    - '*https://*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.004/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_network_visibility_module/cisco_nvm_flowdata/nvm_flowdata.log
