title: Linux Possible Ssh Key File Creation
id: c04ef40c-72da-11ec-8eac-acde48001122
status: experimental
description: The following analytic detects the creation of SSH key files in the ~/.ssh/ directory. It leverages filesystem
  data to identify new files in this specific path. This activity is significant because threat actors often create SSH keys
  to gain persistent access and escalate privileges on a compromised host. If confirmed malicious, this could allow attackers
  to remotely access the machine using the OpenSSH daemon service, leading to potential unauthorized control and data exfiltration.
references:
- https://research.splunk.com/c04ef40c-72da-11ec-8eac-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1098.004
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename: '*/.ssh*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098.004/ssh_authorized_keys/sysmon_linux.log
