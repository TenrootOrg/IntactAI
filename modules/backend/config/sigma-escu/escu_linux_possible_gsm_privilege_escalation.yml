title: Linux Possible GSM Privilege Escalation
id: ae13064b-72ea-41fb-9d29-716c27e01208
status: experimental
description: 'The following analytic detects the commands used in a race condition found in the GSM 0710 tty multiplexor in
  the Linux kernel.

  This issue occurs when two threads execute the GSMIOC_SETCONF ioctl on the same tty file descriptor with the gsm line discipline
  enabled.

  This could allow a local unprivileged user to escalate their privileges on the system.'
references:
- https://research.splunk.com/ae13064b-72ea-41fb-9d29-716c27e01208/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1068
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*rmmod *'
  sel2:
    CommandLine: '*n_gsm*'
  sel3:
    CommandLine: '*exec *'
  sel4:
    CommandLine:
    - '*/bin/bash*'
    - '*/bin/dash*'
    - '*/bin/sh*'
    - '*/bin/zsh*'
  condition: (sel1 and sel2 and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1068/linux_possible_linux_gsm_privilege_escalation/snapattack_linux.log
