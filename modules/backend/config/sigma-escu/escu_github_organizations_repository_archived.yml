title: GitHub Organizations Repository Archived
id: 4f568a0e-896f-4d94-a2f7-fa6d82ab1f77
status: experimental
description: The following analytic detects when a repository is archived in GitHub Organizations. The detection monitors
  GitHub Organizations audit logs for repository archival events by tracking actor details, repository information, and associated
  metadata. For a SOC, identifying repository archival is important as it could indicate attempts to make critical code inaccessible
  or preparation for repository deletion. While archiving is a legitimate feature, unauthorized archival of active repositories
  could signal account compromise, insider threats, or attempts to disrupt development operations. The impact of unauthorized
  repository archival includes loss of active development access, disruption to workflows and CI/CD pipelines, and potential
  business delays if critical repositories are affected. Additionally, archived repositories may be targeted for subsequent
  deletion, potentially resulting in permanent loss of intellectual property if proper backups are not maintained.
references:
- https://research.splunk.com/4f568a0e-896f-4d94-a2f7-fa6d82ab1f77/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1485
- attack.t1195
logsource:
  product: github
  service: audit
detection:
  sel1:
    action: repo.archived
  condition: sel1
level: low
x-escu:
