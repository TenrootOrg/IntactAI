title: O365 PST export alert
id: 5f694cc4-a678-4a60-9410-bffca1b647dc
status: experimental
description: The following analytic detects instances where a user has initiated an eDiscovery search or exported a PST file
  in an Office 365 environment. It leverages Office 365 management activity logs, specifically filtering for events under
  ThreatManagement with the name "eDiscovery search started or exported." This activity is significant as it may indicate
  data exfiltration attempts or unauthorized access to sensitive information. If confirmed malicious, it suggests an attacker
  or insider threat is attempting to gather or exfiltrate data, potentially leading to data breaches, loss of intellectual
  property, or unauthorized access to confidential communications. Immediate investigation is required.
references:
- https://research.splunk.com/5f694cc4-a678-4a60-9410-bffca1b647dc/
author: Splunk Security Content (Apache-2.0), Rod Soto, Splunk
tags:
- attack.t1114
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Category: ThreatManagement
  sel2:
    Name: eDiscovery search started or exported
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1114/o365_export_pst_file/o365_export_pst_file.json
