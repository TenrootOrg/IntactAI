title: Linux Auditd Nopasswd Entry In Sudoers File
id: 651df959-ad17-4b73-a323-90cb96d5fa1b
status: experimental
description: The following analytic detects the addition of NOPASSWD entries to the /etc/sudoers file on Linux systems. It
  leverages Linux Auditd data to identify command lines containing "NOPASSWD:". This activity is significant because it allows
  users to execute commands with elevated privileges without requiring a password, which can be exploited by adversaries to
  maintain persistent, privileged access. If confirmed malicious, this could lead to unauthorized privilege escalation, persistent
  access, and potential compromise of sensitive data and system integrity.
references:
- https://research.splunk.com/651df959-ad17-4b73-a323-90cb96d5fa1b/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.003
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle: '*NOPASSWD*'
  condition: sel1
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.003/linux_auditd_nopasswd/linux_auditd_nopasswd2.log
