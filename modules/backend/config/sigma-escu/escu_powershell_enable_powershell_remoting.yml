title: PowerShell Enable PowerShell Remoting
id: 40e3b299-19a5-4460-96e9-e1467f714f8e
status: experimental
description: The following analytic detects the use of the Enable-PSRemoting cmdlet, which allows PowerShell remoting on a
  local or remote computer. This detection leverages PowerShell Script Block Logging (EventCode 4104) to identify when this
  cmdlet is executed. Monitoring this activity is crucial as it can indicate an attacker enabling remote command execution
  capabilities on a compromised system. If confirmed malicious, this activity could allow an attacker to take control of the
  system remotely, execute commands, and potentially pivot to other systems within the network, leading to further compromise
  and lateral movement.
references:
- https://research.splunk.com/40e3b299-19a5-4460-96e9-e1467f714f8e/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Enable-PSRemoting*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/atomic_red_team/4104-psremoting-windows-powershell.log
