title: Detect HTML Help Using InfoTech Storage Handlers
id: 0b2eefa5-5508-450d-b970-3dd2fb761aec
status: experimental
description: The following analytic detects the execution of hh.exe (HTML Help) using InfoTech Storage Handlers to load Windows
  script code from a Compiled HTML Help (CHM) file. This detection leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on process names and command-line executions. This activity is significant because it can be used to execute
  malicious scripts embedded within CHM files, potentially leading to code execution. If confirmed malicious, this technique
  could allow an attacker to execute arbitrary code, escalate privileges, or persist within the environment.
references:
- https://research.splunk.com/0b2eefa5-5508-450d-b970-3dd2fb761aec/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\hh.exe'
  sel2:
    OriginalFileName: HH.EXE
  sel3:
    CommandLine:
    - '*its:*'
    - '*mk:@MSITStore:*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.001/atomic_red_team/windows-sysmon.log
