title: AWS Defense Evasion Delete CloudWatch Log Group
id: d308b0f1-edb7-4a62-a614-af321160710f
status: experimental
description: The following analytic detects the deletion of CloudWatch log groups in AWS, identified through `DeleteLogGroup`
  events in CloudTrail logs. This detection leverages CloudTrail data to monitor for successful log group deletions, excluding
  console-based actions. This activity is significant as it indicates potential attempts to evade logging and monitoring,
  which is crucial for maintaining visibility into AWS activities. If confirmed malicious, this could allow attackers to hide
  their tracks, making it difficult to detect further malicious actions or investigate incidents within the compromised AWS
  environment.
references:
- https://research.splunk.com/d308b0f1-edb7-4a62-a614-af321160710f/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: DeleteLogGroup
  sel2:
    eventSource: logs.amazonaws.com
  sel3:
    userAgent: console.amazonaws.com
  sel4:
    errorCode: null
  condition: (sel1 and sel2 and not sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/delete_cloudwatch_log_group/aws_cloudtrail_events.json
