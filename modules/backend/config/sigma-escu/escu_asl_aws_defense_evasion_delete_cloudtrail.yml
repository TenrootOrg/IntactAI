title: ASL AWS Defense Evasion Delete Cloudtrail
id: 1f0b47e5-0134-43eb-851c-e3258638945e
status: experimental
description: The following analytic detects AWS `DeleteTrail` events within CloudTrail logs. It leverages Amazon Security
  Lake logs parsed in the Open Cybersecurity Schema Framework (OCSF) format to identify when a CloudTrail is deleted. This
  activity is significant because adversaries may delete CloudTrail logs to evade detection and operate with stealth. If confirmed
  malicious, this action could allow attackers to cover their tracks, making it difficult to trace their activities and investigate
  other potential compromises within the AWS environment.
references:
- https://research.splunk.com/1f0b47e5-0134-43eb-851c-e3258638945e/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    api.operation: DeleteTrail
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/stop_delete_cloudtrail/asl_ocsf_cloudtrail.json
