title: Windows Exfiltration Over C2 Via Powershell UploadString
id: 59e8bf41-7472-412a-90d3-00f3afa452e9
status: experimental
description: The following analytic identifies potential data exfiltration using the PowerShell `net.webclient` command with
  the `UploadString` method. It leverages PowerShell Script Block Logging to detect instances where this command is executed.
  This activity is significant as it may indicate an attempt to upload sensitive data, such as desktop screenshots or files,
  to an external or internal URI, often associated with malware like Winter-Vivern. If confirmed malicious, this could lead
  to unauthorized data transfer, compromising sensitive information and potentially leading to further exploitation of the
  compromised host.
references:
- https://research.splunk.com/59e8bf41-7472-412a-90d3-00f3afa452e9/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1041
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Net.webclient*'
  sel3:
    ScriptBlockText: '*.UploadString*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/winter-vivern/pwh_uploadstring/windows-powershell-xml.log
