title: Linux Auditd Kernel Module Enumeration
id: d1b088de-c47a-4572-9339-bdcc26493b32
status: experimental
description: The following analytic identifies the use of the 'kmod' process to list kernel modules on a Linux system. This
  detection leverages data from Linux Auditd, focusing on process names and command-line executions. While listing kernel
  modules is not inherently malicious, it can be a precursor to loading unauthorized modules using 'insmod'. If confirmed
  malicious, this activity could allow an attacker to load kernel modules, potentially leading to privilege escalation, persistence,
  or other malicious actions within the system.
references:
- https://research.splunk.com/d1b088de-c47a-4572-9339-bdcc26493b32/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1082
- attack.t1014
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: SYSCALL
  sel2:
    comm: lsmod
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1082/linux_auditd_lsmod_new/linux_auditd_new_lsmod.log
