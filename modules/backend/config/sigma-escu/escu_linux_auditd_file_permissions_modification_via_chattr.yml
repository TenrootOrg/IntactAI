title: Linux Auditd File Permissions Modification Via Chattr
id: f2d1110d-b01c-4a58-9975-90a9edeb083a
status: experimental
description: The following analytic detects suspicious file permissions modifications using the chattr command, which may
  indicate an attacker attempting to manipulate file attributes to evade detection or prevent alteration. The chattr command
  can be used to make files immutable or restrict deletion, which can be leveraged to protect malicious files or disrupt system
  operations. By monitoring for unusual or unauthorized chattr usage, this analytic helps identify potential tampering with
  critical files, enabling security teams to quickly respond to and mitigate threats associated with unauthorized file attribute
  changes.
references:
- https://research.splunk.com/f2d1110d-b01c-4a58-9975-90a9edeb083a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1222.002
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle: '*chattr *'
  sel2:
    proctitle: '* -i*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1222.002/linux_auditd_chattr_i/auditd_proctitle_chattr.log
