title: AWS New MFA Method Registered For User
id: 4e3c26f2-4fb9-4bd7-ab46-1b76ffa2a23b
status: experimental
description: The following analytic detects the registration of a new Multi-Factor Authentication (MFA) method for an AWS
  account. It leverages AWS CloudTrail logs to identify the `CreateVirtualMFADevice` event. This activity is significant because
  adversaries who gain unauthorized access to an AWS account may register a new MFA method to maintain persistence. If confirmed
  malicious, this could allow attackers to secure their access, making it difficult to detect and remove their presence, potentially
  leading to further unauthorized activities and data breaches.
references:
- https://research.splunk.com/4e3c26f2-4fb9-4bd7-ab46-1b76ffa2a23b/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1556.006
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: CreateVirtualMFADevice
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556.006/aws_new_mfa_method_registered_for_user/cloudtrail.json
