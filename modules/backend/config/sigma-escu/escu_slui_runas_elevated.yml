title: SLUI RunAs Elevated
id: 8d124810-b3e4-11eb-96c7-acde48001122
status: experimental
description: The following analytic detects the execution of the Microsoft Software Licensing User Interface Tool (`slui.exe`)
  with elevated privileges using the `-verb runas` function. This activity is identified through logs from Endpoint Detection
  and Response (EDR) agents, focusing on specific registry keys and command-line parameters. This behavior is significant
  as it indicates a potential privilege escalation attempt, which could allow an attacker to gain elevated access and execute
  malicious actions with higher privileges. If confirmed malicious, this could lead to unauthorized system changes, data exfiltration,
  or further compromise of the affected endpoint.
references:
- https://research.splunk.com/8d124810-b3e4-11eb-96c7-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\slui.exe'
  sel2:
    CommandLine: '*-verb*'
  sel3:
    CommandLine: '*runas*'
  condition: (sel1 and (sel2 and sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.002/slui/windows-sysmon.log
