title: O365 OAuth App Mailbox Access via EWS
id: e600cf1a-0bef-4426-b42e-00176d610a4d
status: experimental
description: The following analytic detects when emails are accessed in Office 365 Exchange via Exchange Web Services (EWS)
  using OAuth-authenticated applications. It leverages the ClientInfoString field to identify EWS interactions and aggregates
  metrics such as access counts, timing, and client IP addresses, categorized by user, ClientAppId, OperationCount, and AppId.
  Monitoring OAuth applications accessing emails through EWS is crucial for identifying potential abuse or unauthorized data
  access. If confirmed malicious, this activity could lead to unauthorized email access, data exfiltration, or further compromise
  of sensitive information.
references:
- https://research.splunk.com/e600cf1a-0bef-4426-b42e-00176d610a4d/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1114.002
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: Exchange
  sel2:
    Operation: MailItemsAccessed
  sel3:
    AppId: '*'
  sel4:
    ClientAppId: '*'
  sel5:
    ClientInfoString|re: ^Client=WebServices;ExchangeWebServices
  condition: ((sel1 and sel2 and sel3 and sel4) and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1114.002/o365_oauth_app_ews_mailbox_access/o365_oauth_app_ews_mailbox_access.log
