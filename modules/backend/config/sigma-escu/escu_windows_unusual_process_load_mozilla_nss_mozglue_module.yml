title: Windows Unusual Process Load Mozilla NSS-Mozglue Module
id: 1a7e7650-b81d-492e-99d4-d5ab633afbdd
status: experimental
description: The following analytic identifies processes loading Mozilla NSS-Mozglue libraries such as mozglue.dll and nss3.dll.
  It leverages Sysmon Event logs, specifically monitoring EventCode 7, which tracks image loaded events. This activity is
  significant because it can indicate unauthorized access or manipulation of these libraries, which are commonly used by Mozilla
  applications like Firefox and Thunderbird. If confirmed malicious, this could lead to data exfiltration, credential theft,
  or further compromise of the system.
references:
- https://research.splunk.com/1a7e7650-b81d-492e-99d4-d5ab633afbdd/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1218.003
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    ImageLoaded:
    - '*\\mozglue.dll'
    - '*\\nss3.dll'
  sel3:
    Image:
    - '*:\\Program Files\\Mozilla Firefox\\firefox.exe'
    - '*:\\Program Files (x86)\\Mozilla Firefox\\firefox.exe'
    - '*:\\Program Files\\Mozilla Thunderbird\\thunderbird.exe'
    - '*:\\Program Files (x86)\\Mozilla Thunderbird\\thunderbird.exe'
    - '*\\Tor Browser\\Browser\\firefox.exe'
    - '*:\\Program Files\\Code42\\CrashPlan\\Code42Service.exe'
    - '*:\\Program Files (x86)\\Code42\\CrashPlan\\Code42Service.exe'
    - '*:\\Program Files\\Pale Moon\\palemoon.exe'
    - '*:\\Program Files (x86)\\Pale Moon\\palemoon.exe'
    - '*:\\Program Files\\Waterfox\\waterfox.exe'
    - '*:\\Program Files (x86)\\Waterfox\\waterfox.exe'
    - '*:\\Program Files\\Cyberfox\\cyberfox.exe'
    - '*:\\Program Files (x86)\\Cyberfox\\cyberfox.exe'
    - '*\\AppData\\Local\\slack\\slack.exe'
    - '*:\\Program Files (x86)\\VMware\\VMware Horizon View Client\\vmware-view.exe'
    - '*:\\Program Files (x86)\\Dropbox\\Client\\Dropbox.exe'
    - '*:\\Program Files\\Google\\Google Earth Pro\\client\\googleearth.exe'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.003/moz_lib_loaded/mozilla_lib.log
x-intact-burst: false
x-intact: 'Fired 10 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
