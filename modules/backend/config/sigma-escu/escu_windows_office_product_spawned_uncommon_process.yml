title: Windows Office Product Spawned Uncommon Process
id: 55d8741c-fa32-4692-8109-410304961eb8
status: experimental
description: The following analytic detects a Microsoft Office product spawning uncommon processes. This detection leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process creation events where Office applications are
  the parent process. This activity is significant as it may indicate an attempt of a malicious macro execution or exploitation
  of an unknown vulnerability in an office product, in order to bypass security controls. If confirmed malicious, this behavior
  could allow an attacker to execute arbitrary code, potentially leading to system compromise, data exfiltration, or further
  lateral movement within the network.
references:
- https://research.splunk.com/55d8741c-fa32-4692-8109-410304961eb8/
author: Splunk Security Content (Apache-2.0), Michael Haag, Teoderick Contreras, Splunk
tags:
- attack.t1566.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage:
    - '*\\EQNEDT32.exe'
    - '*\\excel.exe'
    - '*\\Graph.exe'
    - '*\\msaccess.exe'
    - '*\\mspub.exe'
    - '*\\onenote.exe'
    - '*\\onenoteim.exe'
    - '*\\onenotem.exe'
    - '*\\outlook.exe'
    - '*\\powerpnt.exe'
    - '*\\visio.exe'
    - '*\\winproj.exe'
    - '*\\winword.exe'
  sel2:
    Image:
    - '*\\bitsadmin.exe'
    - '*\\certutil.exe'
    - '*\\cmd.exe'
    - '*\\cscript.exe'
    - '*\\mshta.exe'
    - '*\\powershell.exe'
    - '*\\pwsh.exe'
    - '*\\regsvr32.exe'
    - '*\\rundll32.exe'
    - '*\\wmic.exe'
    - '*\\wscript.exe'
  sel3:
    OriginalFileName:
    - bitsadmin.exe
    - CertUtil.exe
    - Cmd.Exe
    - cscript.exe
    - MSHTA.EXE
    - PowerShell.EXE
    - pwsh.dll
    - REGSVR32.EXE
    - RUNDLL32.EXE
    - wmic.exe
    - wscript.exe
  condition: (sel1 and (sel2 or sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566.001/macro/windows-sysmon_macros.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566.001/datasets/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/icedid/phish_icedid/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566.002/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/trickbot/spear_phish/windows-sysmon.log
