title: Rundll32 Process Creating Exe Dll Files
id: 6338266a-ee2a-11eb-bf68-acde48001122
status: experimental
description: The following analytic detects a rundll32 process creating executable (.exe) or dynamic link library (.dll) files.
  It leverages Sysmon EventCode 11 to identify instances where rundll32.exe generates these file types. This activity is significant
  because rundll32 is often exploited by malware, such as IcedID, to drop malicious payloads in directories like Temp, AppData,
  or ProgramData. If confirmed malicious, this behavior could allow an attacker to execute arbitrary code, establish persistence,
  or escalate privileges within the environment.
references:
- https://research.splunk.com/6338266a-ee2a-11eb-bf68-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1218.011
logsource:
  product: windows
  service: sysmon
  category: file_event
detection:
  sel1:
    EventID: '11'
  sel2:
    Image: '*rundll32.exe'
  sel3:
    TargetFilename:
    - '*.exe'
    - '*.dll'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/icedid/inf_icedid/windows-sysmon.log
