title: Ivanti Connect Secure SSRF in SAML Component
id: 8e6ca490-7af3-4299-9a24-39fb69759925
status: experimental
description: The following analytic identifies POST requests targeting endpoints vulnerable to the SSRF issue (CVE-2024-21893)
  in Ivanti's products. It leverages the Web data model, focusing on endpoints such as /dana-ws/saml20.ws, /dana-ws/saml.ws,
  /dana-ws/samlecp.ws, and /dana-na/auth/saml-logout.cgi. The detection filters for POST requests that received an HTTP 200
  OK response, indicating successful execution. This activity is significant as it may indicate an attempt to exploit SSRF
  vulnerabilities, potentially allowing attackers to access internal services or sensitive data. If confirmed malicious, this
  could lead to unauthorized access and data exfiltration.
references:
- https://research.splunk.com/8e6ca490-7af3-4299-9a24-39fb69759925/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri:
    - '*/dana-ws/saml20.ws*'
    - '*/dana-ws/saml.ws*'
    - '*/dana-ws/samlecp.ws*'
    - '*/dana-na/auth/saml-logout.cgi/*'
  sel2:
    cs-method: POST
  sel3:
    sc-status: '200'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/ivanti/suricata_ivanti_saml.log
