title: Linux Auditd Install Kernel Module Using Modprobe Utility
id: 95165985-ace5-4d42-9c42-93a89a5af901
status: experimental
description: The following analytic detects the installation of a Linux kernel module using the modprobe utility. It leverages
  data from Linux Auditd, focusing on process names and command-line executions. This activity is significant because installing
  a kernel module can indicate an attempt to deploy a rootkit or other malicious kernel-level code, potentially leading to
  elevated privileges and bypassing security detections. If confirmed malicious, this could allow an attacker to gain persistent,
  high-level access to the system, compromising its integrity and security.
references:
- https://research.splunk.com/95165985-ace5-4d42-9c42-93a89a5af901/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1547.006
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    type: SYSCALL
  sel2:
    comm: modprobe
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1547.006/linux_auditd_modprobe_new/linux_auditd_new_modprobe.log
