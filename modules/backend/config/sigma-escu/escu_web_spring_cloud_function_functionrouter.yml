title: Web Spring Cloud Function FunctionRouter
id: 89dddbad-369a-4f8a-ace2-2439218735bc
status: experimental
description: The following analytic identifies HTTP POST requests to the Spring Cloud Function endpoint containing "functionRouter"
  in the URL. It leverages the Web data model to detect these requests based on specific fields such as http_method, url,
  and http_user_agent. This activity is significant because it targets CVE-2022-22963, a known vulnerability in Spring Cloud
  Function, which has multiple proof-of-concept exploits available. If confirmed malicious, this activity could allow attackers
  to execute arbitrary code, potentially leading to unauthorized access, data exfiltration, or further compromise of the affected
  system.
references:
- https://research.splunk.com/89dddbad-369a-4f8a-ace2-2439218735bc/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1133
logsource:
  category: web
detection:
  sel1:
    cs-method: POST
  sel2:
    c-uri: '*/functionRouter*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/spring4shell/all_functionrouter_http_streams.log
