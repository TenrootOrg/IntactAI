title: Linux Setuid Using Chmod Utility
id: bf0304b6-6250-11ec-9d7c-acde48001122
status: experimental
description: The following analytic detects the execution of the chmod utility to set the SUID or SGID bit on files, which
  can allow users to temporarily gain root or group-level access. This detection leverages data from Endpoint Detection and
  Response (EDR) agents, focusing on process names and command-line arguments related to chmod. This activity is significant
  as it can indicate an attempt to escalate privileges or maintain persistence on a system. If confirmed malicious, an attacker
  could gain elevated access, potentially compromising sensitive data or critical system functions.
references:
- https://research.splunk.com/bf0304b6-6250-11ec-9d7c-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.001
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/chmod'
  sel2:
    CommandLine: '*chmod *'
  sel3:
    CommandLine:
    - '* g+s *'
    - '* u+s *'
    - '* 4777 *'
    - '* 4577 *'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.001/chmod_uid/sysmon_linux.log
