title: Sdclt UAC Bypass
id: d71efbf6-da63-11eb-8c6e-acde48001122
status: experimental
description: The following analytic detects suspicious modifications to the sdclt.exe registry, a technique often used to
  bypass User Account Control (UAC). It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific
  registry paths and values associated with sdclt.exe. This activity is significant because UAC bypasses can allow attackers
  to execute payloads with elevated privileges without user consent. If confirmed malicious, this could lead to unauthorized
  code execution, privilege escalation, and potential persistence within the environment, posing a severe security risk.
references:
- https://research.splunk.com/d71efbf6-da63-11eb-8c6e-acde48001122/
author: Splunk Security Content (Apache-2.0), Steven Dick, Teoderick Contreras, Splunk
tags:
- attack.t1548.002
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows\\CurrentVersion\\App Paths\\control.exe*'
  sel2:
    TargetObject: '*\\exefile\\shell\\runas\\command\\*'
  sel3:
    TargetObject: '*\\(Default)'
  sel4:
    TargetObject: '*\\IsolatedCommand'
  condition: ((sel1 or sel2) and (sel3 or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/uac_bypass/windows-sysmon.log
