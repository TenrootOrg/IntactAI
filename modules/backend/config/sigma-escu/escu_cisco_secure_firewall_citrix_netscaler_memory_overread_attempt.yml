title: Cisco Secure Firewall - Citrix NetScaler Memory Overread Attempt
id: 93db24a0-fd21-45d7-9daf-84afd5a8cca2
status: experimental
description: 'This analytic detects exploitation activity of CVE-2025-5777 using Cisco Secure Firewall Intrusion Events.

  It leverages Cisco Secure Firewall Threat Defense IntrusionEvent logs to identify cases where Snort signature 65118 (Citrix
  NetScaler memory overread attempt) is triggered

  If confirmed malicious, this behavior is highly indicative of a potential exploitation of CVE-2025-5777.'
references:
- https://research.splunk.com/93db24a0-fd21-45d7-9daf-84afd5a8cca2/
author: Splunk Security Content (Apache-2.0), Michael Haag, Nasreddine Bencherchali, Splunk, Talos NTDR
tags:
- attack.t1203
- attack.t1059
logsource:
  product: cisco
  service: secure_firewall
detection:
  sel1:
    EventType: IntrusionEvent
  sel2:
    SignatureID: '65118'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_firewall_threat_defense/intrusion_event/intrusion_events.log
