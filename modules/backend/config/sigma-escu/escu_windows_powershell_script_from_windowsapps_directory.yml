title: Windows PowerShell Script From WindowsApps Directory
id: 8c3d1f2e-7b4a-45e3-9d8f-6a2e4c9b1234
status: experimental
description: 'The following analytic identifies the execution of PowerShell scripts from the WindowsApps directory, which
  is a common technique used in malicious MSIX package execution.

  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process command lines and parent
  process paths.

  This activity is significant as adversaries have been observed using MSIX packages with embedded PowerShell scripts (particularly
  StartingScriptWrapper.ps1) to execute malicious code.

  If confirmed malicious, this could allow attackers to execute arbitrary code, establish persistence, or deliver malware
  while evading traditional detection mechanisms.'
references:
- https://research.splunk.com/8c3d1f2e-7b4a-45e3-9d8f-6a2e4c9b1234/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
- attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\pwsh.exe'
  sel2:
    Image: '*\\powershell.exe'
  sel3:
    OriginalFileName: pwsh.dll
  sel4:
    OriginalFileName: PowerShell.EXE
  sel5:
    OriginalFileName: powershell_ise.EXE
  sel6:
    Image: '*\\powershell_ise.exe'
  sel7:
    Image: '*\\cmd.exe'
  sel8:
    OriginalFileName: Cmd.Exe
  sel9:
    ParentImage: '*\\WindowsApps\\*'
  sel10:
    CommandLine:
    - '*WindowsApps*-file *'
    - '*WindowsApps*.ps1*'
  condition: (((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) or (sel7 or sel8)) and (sel9 or sel10))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/msix_powershell/windows-sysmon.log
