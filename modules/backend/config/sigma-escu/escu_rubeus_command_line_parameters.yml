title: Rubeus Command Line Parameters
id: cca37478-8377-11ec-b59a-acde48001122
status: experimental
description: The following analytic detects the use of Rubeus command line parameters, a toolset for Kerberos attacks within
  Active Directory environments. It leverages Endpoint Detection and Response (EDR) data to identify specific command-line
  arguments associated with actions like ticket manipulation, kerberoasting, and password spraying. This activity is significant
  as Rubeus is commonly used by adversaries to exploit Kerberos for privilege escalation and lateral movement. If confirmed
  malicious, this could lead to unauthorized access, persistence, and potential compromise of sensitive information within
  the network.
references:
- https://research.splunk.com/cca37478-8377-11ec-b59a-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1550.003
- attack.t1558.003
- attack.t1558.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*ptt /ticket*'
  sel2:
    CommandLine: '* monitor /interval*'
  sel3:
    CommandLine: '* asktgt* /user:*'
  sel4:
    CommandLine: '* asktgs* /service:*'
  sel5:
    CommandLine: '* golden* /user:*'
  sel6:
    CommandLine: '* silver* /service:*'
  sel7:
    CommandLine: '* kerberoast*'
  sel8:
    CommandLine: '* asreproast*'
  sel9:
    CommandLine: '* renew* /ticket:*'
  sel10:
    CommandLine: '* brute* /password:*'
  sel11:
    CommandLine: '* brute* /passwords:*'
  sel12:
    CommandLine: '* harvest*'
  condition: (((((((((((sel1 or sel2) or sel3) or sel4) or sel5) or sel6) or sel7) or sel8) or sel9) or sel10) or sel11) or
    sel12)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1550.003/rubeus/windows-sysmon.log
