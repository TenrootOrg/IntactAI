title: Windows Modify Registry Delete Firewall Rules
id: 41c61539-98ca-4750-b3ec-7c29a2f06343
status: experimental
description: The following analytic detects a potential deletion of firewall rules, indicating a possible security breach
  or unauthorized access attempt. It identifies actions where firewall rules are removed using commands like netsh advfirewall
  firewall delete rule, which can expose the network to external threats by disabling critical security measures. Monitoring
  these activities helps maintain network integrity and prevent malicious attacks.
references:
- https://research.splunk.com/41c61539-98ca-4750-b3ec-7c29a2f06343/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  product: windows
  service: sysmon
  category: registry_event
detection:
  sel1:
    EventID: '12'
  sel2:
    TargetObject: '*\\System\\CurrentControlSet\\Services\\SharedAccess\\Parameters\\FirewallPolicy\\FirewallRules\\*'
  sel3:
    EventType: DeleteValue
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1112/firewall_modify_delete/firewall_mod_delete.log
