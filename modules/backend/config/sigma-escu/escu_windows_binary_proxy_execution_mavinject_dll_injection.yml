title: Windows Binary Proxy Execution Mavinject DLL Injection
id: ccf4b61b-1b26-4f2e-a089-f2009c569c57
status: experimental
description: The following analytic detects the use of mavinject.exe for DLL injection into running processes, identified
  by specific command-line parameters such as /INJECTRUNNING and /HMODULE. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process names and command-line executions. This activity is significant because it
  indicates potential arbitrary code execution, a common tactic for malware deployment and persistence. If confirmed malicious,
  this could allow attackers to execute unauthorized code, escalate privileges, and maintain persistence within the environment,
  posing a severe security risk.
references:
- https://research.splunk.com/ccf4b61b-1b26-4f2e-a089-f2009c569c57/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.013
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\mavinject.exe'
  sel2:
    CommandLine:
    - '*injectrunning*'
    - '*hmodule=0x*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.013/atomic_red_team/windows-sysmon.log
