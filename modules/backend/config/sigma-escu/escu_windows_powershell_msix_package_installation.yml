title: Windows PowerShell MSIX Package Installation
id: d2f77901-dbfa-42d9-8af7-dcd0f1a50a2f
status: experimental
description: The following analytic detects the execution of PowerShell commands to install unsigned AppX packages using Add-AppxPackage
  or Add-AppPackage cmdlets with the -AllowUnsigned flag. This detection leverages PowerShell Script Block Logging (EventCode=4104)
  to capture the full command content. This activity is significant as adversaries may use unsigned AppX packages to install
  malicious applications, bypass security controls, or establish persistence. If confirmed malicious, this could allow attackers
  to install unauthorized applications that may contain malware, backdoors, or other malicious components.
references:
- https://research.splunk.com/d2f77901-dbfa-42d9-8af7-dcd0f1a50a2f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
- attack.t1547.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*Add-AppPackage *'
    - '*Add-AppxPackage *'
  sel3:
    ScriptBlockText: '* -AllowUnsigned*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1553.005/msix_unsigned/windows-powershell.log
