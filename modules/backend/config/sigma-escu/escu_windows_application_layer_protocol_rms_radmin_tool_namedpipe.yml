title: Windows Application Layer Protocol RMS Radmin Tool Namedpipe
id: b62a6040-49f4-47c8-b3f6-fc1adb952a33
status: experimental
description: The following analytic detects the use of default or publicly known named pipes associated with the RMX remote
  admin tool. It leverages Sysmon EventCodes 17 and 18 to identify named pipe creation and connection events. This activity
  is significant as the RMX tool has been abused by adversaries and malware like Azorult to collect data from targeted hosts.
  If confirmed malicious, this could indicate unauthorized remote administration capabilities, leading to data exfiltration
  or further compromise of the affected system. Immediate investigation is required to determine the legitimacy of this tool's
  presence.
references:
- https://research.splunk.com/b62a6040-49f4-47c8-b3f6-fc1adb952a33/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1071
logsource:
  product: windows
  service: sysmon
  category: pipe_created
detection:
  sel1:
    EventID:
    - '17'
    - '18'
  sel2:
    EventType:
    - CreatePipe
    - ConnectPipe
  sel3:
    PipeName:
    - \\RManFUSServerNotify32
    - \\RManFUSCallbackNotify32
    - \\RMSPrint*
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
