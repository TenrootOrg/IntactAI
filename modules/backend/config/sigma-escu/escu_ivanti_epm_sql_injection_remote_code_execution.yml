title: Ivanti EPM SQL Injection Remote Code Execution
id: e20564ca-c86c-4e30-acdb-a8486673426f
status: experimental
description: 'This detection identifies potential exploitation of a critical SQL injection vulnerability in Ivanti Endpoint
  Manager (EPM), identified as CVE-2024-29824.

  The vulnerability, which has a CVSS score of 9.8, allows for remote code execution through the `RecordGoodApp` function
  in the `PatchBiz.dll` file.

  An attacker can exploit this vulnerability by manipulating the `goodApp.md5` value in an HTTP POST request to the `/WSStatusEvents/EventHandler.asmx`
  endpoint, leading to unauthorized command execution on the server.

  Monitoring for unusual SQL commands and HTTP requests to this endpoint can help identify exploitation attempts.

  Note that, the detection is focused on the URI path, HTTP method and status code of 200, indicating potential exploitation.

  To properly identify if this was successful, TLS inspection and additional network traffic analysis is required as the xp_cmdshell
  comes in via the request body.'
references:
- https://research.splunk.com/e20564ca-c86c-4e30-acdb-a8486673426f/
author: Splunk Security Content (Apache-2.0), Michael Haag
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/WSStatusEvents/EventHandler.asmx'
  sel2:
    cs-method: POST
  sel3:
    sc-status: '200'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/ivanti/suricata_ivanti_epm.log
