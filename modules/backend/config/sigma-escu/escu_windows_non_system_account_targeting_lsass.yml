title: Windows Non-System Account Targeting Lsass
id: b1ce9a72-73cf-11ec-981b-acde48001122
status: experimental
description: The following analytic identifies non-SYSTEM accounts requesting access to lsass.exe. This detection leverages
  Sysmon EventCode 10 logs to monitor access attempts to the Local Security Authority Subsystem Service (lsass.exe) by non-SYSTEM
  users. This activity is significant as it may indicate credential dumping attempts or unauthorized access to sensitive credentials.
  If confirmed malicious, an attacker could potentially extract credentials from memory, leading to privilege escalation or
  lateral movement within the network. Immediate investigation is required to determine the legitimacy of the access request
  and to mitigate any potential threats.
references:
- https://research.splunk.com/b1ce9a72-73cf-11ec-981b-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1003.001
logsource:
  product: windows
  service: sysmon
  category: process_access
detection:
  sel1:
    EventID: '10'
  sel2:
    TargetImage: '*lsass.exe'
  sel3:
    SourceUser: NT AUTHORITY\\*
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.001/atomic_red_team/windows-sysmon_creddump.log
x-intact-burst: false
x-intact: 'Fired 344 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
