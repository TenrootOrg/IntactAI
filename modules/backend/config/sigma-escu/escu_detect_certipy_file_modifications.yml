title: Detect Certipy File Modifications
id: 7e3df743-b1d8-4631-8fa8-bd5819688876
status: experimental
description: The following analytic detects the use of the Certipy tool to enumerate Active Directory Certificate Services
  (AD CS) environments by identifying unique file modifications. It leverages endpoint process and filesystem data to spot
  the creation of files with specific names or extensions associated with Certipy's information gathering and exfiltration
  activities. This activity is significant as it indicates potential reconnaissance and data exfiltration efforts by an attacker.
  If confirmed malicious, this could lead to unauthorized access to sensitive AD CS information, enabling further attacks
  or privilege escalation within the network.
references:
- https://research.splunk.com/7e3df743-b1d8-4631-8fa8-bd5819688876/
author: Splunk Security Content (Apache-2.0), Steven Dick
tags:
- attack.t1649
- attack.t1560
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*_certipy.zip'
    - '*_certipy.txt'
    - '*_certipy.json'
    - '*.ccache'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1649/certify_abuse/certify_esc1_abuse_sysmon.log
