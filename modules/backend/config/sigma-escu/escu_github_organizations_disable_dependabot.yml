title: GitHub Organizations Disable Dependabot
id: 69078d8c-0de6-45de-bb00-14e78e042fd6
status: experimental
description: The following analytic detects when a user disables Dependabot security features within a GitHub repository.
  Dependabot helps automatically identify and fix security vulnerabilities in dependencies. The detection monitors GitHub
  Enterprise logs for configuration changes that disable Dependabot functionality. This behavior could indicate an attacker
  attempting to prevent the automatic detection of vulnerable dependencies, which would allow them to exploit known vulnerabilities
  that would otherwise be patched. For a SOC, identifying the disabling of security features like Dependabot is critical as
  it may be a precursor to supply chain attacks where attackers exploit vulnerable dependencies. The impact could be severe
  if vulnerabilities remain unpatched, potentially leading to code execution, data theft, or other compromises through the
  software supply chain.
references:
- https://research.splunk.com/69078d8c-0de6-45de-bb00-14e78e042fd6/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
