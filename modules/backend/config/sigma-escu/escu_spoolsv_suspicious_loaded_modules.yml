title: Spoolsv Suspicious Loaded Modules (counted event)
id: a5e451f8-da81-11eb-b245-acde48001122-base
status: experimental
description: The following analytic detects the suspicious loading of DLLs by spoolsv.exe, potentially indicating PrintNightmare
  exploitation. It leverages Sysmon EventCode 7 to identify instances where spoolsv.exe loads multiple DLLs from the Windows
  System32 spool drivers x64 directory. This activity is significant as it may signify an attacker exploiting the PrintNightmare
  vulnerability to execute arbitrary code. If confirmed malicious, this could lead to unauthorized code execution, privilege
  escalation, and persistent access within the environment, posing a severe security risk.
references:
- https://research.splunk.com/a5e451f8-da81-11eb-b245-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Michael Haag, Teoderick Contreras, Splunk
tags:
- attack.t1547.012
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    Image: '*\\spoolsv.exe'
  sel3:
    ImageLoaded: '*\\Windows\\System32\\spool\\drivers\\x64\\*'
  sel4:
    ImageLoaded: '*.dll'
  condition: (sel1 and sel2 and sel3 and sel4)
level: informational
name: escu_base_spoolsv_suspicious_loaded_modules
