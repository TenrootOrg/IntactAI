title: Linux Curl Upload File
id: c1de2d9a-0c02-4bb4-a49a-510c6e9cf2bf
status: experimental
description: The following analytic detects the use of the curl command with specific switches (-F, --form, --upload-file,
  -T, -d, --data, --data-raw, -I, --head) to upload AWS credentials or configuration files to a remote destination. This detection
  leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions and process details.
  This activity is significant as it may indicate an attempt to exfiltrate sensitive AWS credentials, a technique known to
  be used by the TeamTNT group. If confirmed malicious, this could lead to unauthorized access and potential compromise of
  AWS resources.
references:
- https://research.splunk.com/c1de2d9a-0c02-4bb4-a49a-510c6e9cf2bf/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1105
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/curl'
  sel2:
    CommandLine:
    - '*-F *'
    - '*--form *'
    - '*--upload-file *'
    - '*-T *'
    - '*-d *'
    - '*--data *'
    - '*--data-raw *'
    - '*-I *'
    - '*--head *'
  sel3:
    CommandLine:
    - '*.aws/credentials*'
    - .
    - '*.aws/config*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/atomic_red_team/curl-linux-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_isovalent/cisco_isovalent.log
