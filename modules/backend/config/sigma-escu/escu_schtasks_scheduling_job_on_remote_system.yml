title: Schtasks scheduling job on remote system
id: 1297fb80-f42a-4b4a-9c8a-88c066237cf6
status: experimental
description: The following analytic detects the use of 'schtasks.exe' to create a scheduled task on a remote system, indicating
  potential lateral movement or remote code execution. It leverages process data from Endpoint Detection and Response (EDR)
  agents, focusing on specific command-line arguments and flags. This activity is significant as it may signify an adversary's
  attempt to persist or execute code remotely. If confirmed malicious, this could allow attackers to maintain access, execute
  arbitrary commands, or further infiltrate the network, posing a severe security risk.
references:
- https://research.splunk.com/1297fb80-f42a-4b4a-9c8a-88c066237cf6/
author: Splunk Security Content (Apache-2.0), David Dorsey, Mauricio Velazco, Splunk
tags:
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\schtasks.exe'
  sel2:
    OriginalFileName: schtasks.exe
  sel3:
    CommandLine: '*/create*'
  sel4:
    CommandLine: '*/s *'
  condition: ((sel1 or sel2) and (sel3 and sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/atomic_red_team/windows-sysmon.log
