title: GCP Successful Single-Factor Authentication
id: 40e17d88-87da-414e-b253-8dc1e4f9555b
status: experimental
description: The following analytic identifies a successful single-factor authentication event against Google Cloud Platform
  (GCP) for an account without Multi-Factor Authentication (MFA) enabled. It uses Google Workspace login event data to detect
  instances where MFA is not utilized. This activity is significant as it may indicate a misconfiguration, policy violation,
  or potential account takeover attempt. If confirmed malicious, an attacker could gain unauthorized access to GCP resources,
  potentially leading to data breaches, service disruptions, or further exploitation within the cloud environment.
references:
- https://research.splunk.com/40e17d88-87da-414e-b253-8dc1e4f9555b/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Mauricio Velazco, Splunk
tags:
- attack.t1078.004
- attack.t1586.003
logsource:
  product: google_workspace
  service: google_workspace.admin
detection:
  sel1:
    event.name: login_success
  sel2:
    login_challenge_method:
    - '*backup_code*'
    - '*google_authenticator*'
    - '*google_prompt*'
    - '*idv_any_phone*'
    - '*idv_preregistered_phone*'
    - '*internal_two_factor*'
    - '*knowledge_employee_id*'
    - '*knowledge_preregistered_email*'
    - '*login_location*'
    - '*knowledge_preregistered_phone*'
    - '*offline_otp*'
    - '*security_key*'
    - '*security_key_otp*'
  condition: (sel1 and not (sel2))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078.004/gcp_single_factor_auth/gws_login.log
