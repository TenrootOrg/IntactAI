title: AWS Defense Evasion Delete Cloudtrail
id: 82092925-9ca1-4e06-98b8-85a2d3889552
status: experimental
description: The following analytic detects the deletion of AWS CloudTrail logs by identifying `DeleteTrail` events within
  CloudTrail logs. This detection leverages CloudTrail data to monitor for successful `DeleteTrail` actions, excluding those
  initiated from the AWS console. This activity is significant because adversaries may delete CloudTrail logs to evade detection
  and operate stealthily within the compromised environment. If confirmed malicious, this action could allow attackers to
  cover their tracks, making it difficult to trace their activities and potentially leading to prolonged unauthorized access
  and further exploitation.
references:
- https://research.splunk.com/82092925-9ca1-4e06-98b8-85a2d3889552/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: DeleteTrail
  sel2:
    eventSource: cloudtrail.amazonaws.com
  sel3:
    userAgent: console.amazonaws.com
  sel4:
    errorCode: null
  condition: (sel1 and sel2 and not sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/stop_delete_cloudtrail/aws_cloudtrail_events.json
