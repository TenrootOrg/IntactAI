title: BITS Job Persistence
id: e97a5ffe-90bf-11eb-928a-acde48001122
status: experimental
description: The following analytic detects the use of `bitsadmin.exe` to schedule a BITS job for persistence on an endpoint.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific command-line parameters such as
  `create`, `addfile`, and `resume`. This activity is significant because BITS jobs can be used by attackers to maintain persistence,
  download malicious payloads, or exfiltrate data. If confirmed malicious, this could allow an attacker to persist in the
  environment, execute arbitrary code, or transfer sensitive information, necessitating further investigation and potential
  remediation.
references:
- https://research.splunk.com/e97a5ffe-90bf-11eb-928a-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1197
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\bitsadmin.exe'
  sel2:
    OriginalFileName: bitsadmin.exe
  sel3:
    CommandLine:
    - '*create*'
    - '*addfile*'
    - '*setnotifyflags*'
    - '*setnotifycmdline*'
    - '*setminretrydelay*'
    - '*setcustomheaders*'
    - '*resume*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1197/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1197/atomic_red_team/crowdstrike_falcon.log
