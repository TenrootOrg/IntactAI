title: Windows Process Accessing IronLanguages Repository On GitHub
id: bcdc2543-8c33-44c8-a723-5b7b93e06788
status: experimental
description: 'The following analytic identifies a process command line referencing the IronLanguages GitHub repository, which
  hosts .NET implementation of popular scripting engines.

  Adversaries have downloaded these .NET implementations to avoid getting detected by security controls while executing their
  payloads.

  This activity is uncommon in typical enterprise environments outside of software development contexts.'
references:
- https://research.splunk.com/bcdc2543-8c33-44c8-a723-5b7b93e06788/
author: Splunk Security Content (Apache-2.0), Onur Mustafa Erdogan, Splunk
tags:
- attack.t1059
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*/ironlanguages/*'
  sel2:
    CommandLine: '*github.com*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/ironlanguage_download/ironlanguage_download.log
