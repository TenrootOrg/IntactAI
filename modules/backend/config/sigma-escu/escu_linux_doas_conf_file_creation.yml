title: Linux Doas Conf File Creation
id: f6343e86-6e09-11ec-9376-acde48001122
status: experimental
description: The following analytic detects the creation of the doas.conf file on a Linux host. This file is used by the doas
  utility to allow standard users to perform tasks as root, similar to sudo. The detection leverages filesystem data from
  the Endpoint data model, focusing on the creation of the doas.conf file. This activity is significant because it can indicate
  an attempt to gain elevated privileges, potentially by an adversary. If confirmed malicious, this could allow an attacker
  to execute commands with root privileges, leading to full system compromise.
references:
- https://research.splunk.com/f6343e86-6e09-11ec-9376-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.003
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename: '*/etc/doas.conf'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.003/doas/sysmon_linux.log
