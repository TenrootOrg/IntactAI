title: Windows Multiple Invalid Users Fail To Authenticate Using Kerberos (counted event)
id: 001266a6-9d5b-11eb-829b-acde48001122-base
status: experimental
description: The following analytic identifies a source endpoint failing to authenticate with 30 unique invalid domain users
  using the Kerberos protocol. This detection leverages EventCode 4768, specifically looking for failure code 0x6, indicating
  the user is not found in the Kerberos database. This activity is significant as it may indicate a Password Spraying attack,
  where an adversary attempts to gain initial access or elevate privileges. If confirmed malicious, this could lead to unauthorized
  access or privilege escalation within the Active Directory environment, posing a significant security risk.
references:
- https://research.splunk.com/001266a6-9d5b-11eb-829b-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4768'
  sel2:
    TargetUserName: '*$'
  sel3:
    Status: '0x6'
  condition: (sel1 and not sel2 and sel3)
level: informational
name: escu_base_windows_multiple_invalid_users_fail_to_authenticate_using_kerberos
