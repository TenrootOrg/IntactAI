title: Zscaler Virus Download threat blocked
id: aa19e627-d448-4a31-85cd-82068dec5691
status: experimental
description: The following analytic identifies attempts to download viruses that were blocked by Zscaler within a network.
  It leverages web proxy logs to detect blocked actions indicative of virus download attempts. Key data points such as device
  owner, user, URL category, destination URL, and IP are analyzed. This activity is significant as it helps in early detection
  and remediation of potential virus threats, enhancing network security. If confirmed malicious, this activity could indicate
  an attempt to compromise the network, potentially leading to data breaches or further malware infections.
references:
- https://research.splunk.com/aa19e627-d448-4a31-85cd-82068dec5691/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Rod Soto, Splunk
