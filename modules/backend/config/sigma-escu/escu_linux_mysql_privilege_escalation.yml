title: Linux MySQL Privilege Escalation
id: c0d810f4-230c-44ea-b703-989da02ff145
status: experimental
description: The following analytic detects the execution of MySQL commands with elevated privileges using sudo, which can
  lead to privilege escalation. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process execution
  logs that include command-line details. This activity is significant because it indicates a potential misuse of MySQL to
  execute system commands as root, which could allow an attacker to gain root shell access. If confirmed malicious, this could
  result in full control over the affected system, leading to severe security breaches and unauthorized access to sensitive
  data.
references:
- https://research.splunk.com/c0d810f4-230c-44ea-b703-989da02ff145/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*mysql*-e*'
  sel2:
    CommandLine: '*\\!**'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/mysql/sysmon_linux.log
