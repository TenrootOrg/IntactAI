title: Windows Obfuscated Files or Information via RAR SFX
id: 4ab6862b-ce88-4223-96c0-f6da2cffb898
status: experimental
description: The following analytic detects the creation of RAR Self-Extracting (SFX) files by monitoring the generation of
  file related to rar sfx .tmp file creation during sfx installation. This method leverages a heuristic to identify RAR SFX
  archives based on specific markers that indicate a combination of executable code and compressed RAR data. By tracking such
  activity, the analytic helps pinpoint potentially unauthorized or suspicious file creation events, which are often associated
  with malware packaging or data exfiltration. Legitimate usage may include custom installers or compressed file delivery.
references:
- https://research.splunk.com/4ab6862b-ce88-4223-96c0-f6da2cffb898/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1027.013
logsource:
  product: windows
  service: sysmon
  category: file_event
detection:
  sel1:
    EventID: '11'
  sel2:
    TargetFilename: '*__tmp_rar_sfx_access_check*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1027.013/rar_sfx_execution/rar_sfx.log
x-intact-burst: false
x-intact: 'Fired 1 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
