title: Icacls Deny Command
id: cf8d753e-a8fe-11eb-8f58-acde48001122
status: experimental
description: 'The following analytic detects instances where an adversary modifies security permissions of a file or directory
  using commands like "icacls.exe", "cacls.exe", or "xcacls.exe" with deny options.

  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line executions.

  This activity is significant as it is commonly used by Advanced Persistent Threats (APTs) and coinminer scripts to evade
  detection and impede access to critical files.

  If confirmed malicious, this could allow attackers to maintain persistence and hinder incident response efforts.'
references:
- https://research.splunk.com/cf8d753e-a8fe-11eb-8f58-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1222
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\icacls.exe'
    - '*\\cacls.exe'
    - '*\\xcacls.exe'
  sel2:
    CommandLine:
    - '*/deny*'
    - '*/d:*'
    - '*/d *'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/xmrig_miner/windows-sysmon.log
