title: Windows Scheduled Task DLL Module Loaded
id: bc5b2304-f241-419b-874a-e927f667b7b6
status: experimental
description: The following analytic detects instances where the taskschd.dll is loaded by processes running in suspicious
  or writable directories. This activity is unusual, as legitimate processes that load taskschd.dll typically reside in protected
  system locations. Malware or threat actors may attempt to load this DLL from writable or non-standard directories to manipulate
  the Task Scheduler and execute malicious tasks. By identifying processes that load taskschd.dll in these unsafe locations,
  this detection helps security analysts flag potentially malicious activity and investigate further to prevent unauthorized
  system modifications.
references:
- https://research.splunk.com/bc5b2304-f241-419b-874a-e927f667b7b6/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1053
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    Image:
    - '*\\windows\\fonts\\*'
    - '*\\windows\\temp\\*'
    - '*\\users\\public\\*'
    - '*\\windows\\debug\\*'
    - '*\\Users\\Administrator\\Music\\*'
    - '*\\Windows\\servicing\\*'
    - '*\\Users\\Default\\*'
    - '*Recycle.bin*'
    - '*\\Windows\\Media\\*'
    - \\Windows\\repair\\*
    - '*\\temp\\*'
    - '*\\PerfLogs\\*'
  sel3:
    ImageLoaded: '*\\taskschd.dll'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053/taskschd_dll/taskschd_dll.log
x-intact-burst: false
x-intact: 'Fired 12 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
