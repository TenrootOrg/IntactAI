title: DSQuery Domain Discovery
id: cc316032-924a-11eb-91a2-acde48001122
status: experimental
description: The following analytic detects the execution of "dsquery.exe" with arguments targeting `TrustedDomain` queries
  directly from the command line. This behavior is identified using Endpoint Detection and Response (EDR) telemetry, focusing
  on process names and command-line arguments. This activity is significant as it often indicates domain trust discovery,
  a common step in lateral movement or privilege escalation by adversaries. If confirmed malicious, this could allow attackers
  to map domain trusts, potentially leading to further exploitation and unauthorized access to trusted domains.
references:
- https://research.splunk.com/cc316032-924a-11eb-91a2-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\dsquery.exe'
  sel2:
    CommandLine: '*trustedDomain*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1482/atomic_red_team/windows-sysmon.log
