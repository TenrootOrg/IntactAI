title: GetWmiObject Ds Group with PowerShell Script Block
id: 67740bd3-1506-469c-b91d-effc322cc6e5
status: experimental
description: The following analytic detects the execution of the `Get-WmiObject` commandlet with the `DS_Group` parameter
  via PowerShell Script Block Logging (EventCode=4104). This method leverages WMI to query all domain groups. Monitoring this
  activity is crucial as adversaries and Red Teams may use it for domain group enumeration, aiding in situational awareness
  and Active Directory discovery. If confirmed malicious, this activity could allow attackers to map out the domain structure,
  potentially leading to further exploitation and privilege escalation within the network.
references:
- https://research.splunk.com/67740bd3-1506-469c-b91d-effc322cc6e5/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1069.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-WmiObject*'
  sel3:
    ScriptBlockText: '*namespace root\\directory\\ldap*'
  sel4:
    ScriptBlockText: '*class ds_group*'
  condition: (sel1 and (sel2 and sel3 and sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
