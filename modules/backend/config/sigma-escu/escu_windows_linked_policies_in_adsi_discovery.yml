title: Windows Linked Policies In ADSI Discovery
id: 510ea428-4731-4d2f-8829-a28293e427aa
status: experimental
description: The following analytic detects the use of the `[Adsisearcher]` type accelerator in PowerShell Script Block Logging
  (EventCode=4104) to query Active Directory for domain organizational units. This detection leverages PowerShell operational
  logs to identify script blocks containing `[adsisearcher]`, `objectcategory=organizationalunit`, and `findAll()`. This activity
  is significant as it indicates potential reconnaissance efforts by adversaries to gain situational awareness of the domain
  structure. If confirmed malicious, this could lead to further exploitation, such as privilege escalation or lateral movement
  within the network.
references:
- https://research.splunk.com/510ea428-4731-4d2f-8829-a28293e427aa/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1087.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*[adsisearcher]*'
  sel3:
    ScriptBlockText: '*objectcategory=organizationalunit*'
  sel4:
    ScriptBlockText: '*findAll()*'
  condition: (sel1 and sel2 and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/adsi_discovery/windows-powershell-xml2.log
