title: Linux Csvtool Privilege Escalation
id: f8384f9e-1a5c-4c3a-96d6-8a7e5a38a8b8
status: experimental
description: The following analytic detects the execution of the 'csvtool' command with 'sudo' privileges, which can allow
  a user to run system commands as root. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process execution logs that include command-line details. This activity is significant because it indicates
  a potential privilege escalation attempt, where a user could gain unauthorized root access. If confirmed malicious, this
  could lead to full system compromise, allowing an attacker to execute arbitrary commands, escalate privileges, and maintain
  persistent access.
references:
- https://research.splunk.com/f8384f9e-1a5c-4c3a-96d6-8a7e5a38a8b8/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*csvtool*'
  sel2:
    CommandLine: '*call*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/csvtool/sysmon_linux.log
