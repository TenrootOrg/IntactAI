title: Linux Auditd Possible Access To Credential Files
id: 0419cb7a-57ea-467b-974f-77c303dfe2a3
status: experimental
description: The following analytic detects attempts to access or dump the contents of /etc/passwd and /etc/shadow files on
  Linux systems. It leverages data from Linux Auditd, focusing on processes like 'cat', 'nano', 'vim', and 'vi' accessing
  these files. This activity is significant as it may indicate credential dumping, a technique used by adversaries to gain
  persistence or escalate privileges. If confirmed malicious, privileges. If confirmed malicious, attackers could obtain hashed
  passwords for offline cracking, leading to unauthorized access and potential system compromise.
references:
- https://research.splunk.com/0419cb7a-57ea-467b-974f-77c303dfe2a3/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1003.008
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle:
    - '*shadow*'
    - '*passwd*'
  sel2:
    proctitle:
    - '*cat *'
    - '*nano *'
    - '*vim *'
    - '*vi *'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.008/linux_auditd_access_credential/auditd_proctitle_access_cred.log
