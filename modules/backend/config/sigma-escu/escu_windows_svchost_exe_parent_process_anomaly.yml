title: Windows Svchost.exe Parent Process Anomaly
id: 1d38e5e9-2ff8-4c47-872c-bf1657cefab5
status: experimental
description: The following analytic detects an anomaly where an svchost.exe process is spawned by a parent process other than
  the standard services.exe. In a typical Windows environment, svchost.exe is a system process that hosts Windows service
  DLLs, and is expected to be a child of services.exe. A process deviation from this hierarchy may indicate suspicious behavior,
  such as malicious code attempting to masquerade as a legitimate system process or evade detection. It is essential to investigate
  the parent process and associated behavior for further signs of compromise or unauthorized activity.
references:
- https://research.splunk.com/1d38e5e9-2ff8-4c47-872c-bf1657cefab5/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1036.009
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\services.exe'
  sel2:
    Image: '*\\svchost.exe'
  sel3:
    CommandLine: unknown
  sel4:
    ParentImage: C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\*\\MsMpEng.exe
  sel5:
    ParentImage: C:\\Program Files\\Windows Defender\\MsMpEng.exe
  condition: (not sel1 and sel2 and not sel3 and not sel4 and not sel5)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1035.009/suspicious_spawn_svchost/susp_svchost_proc.log
x-intact-burst: false
x-intact: 'Fired 20 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
