title: Anomalous usage of 7zip
id: 9364ee8e-a39a-11eb-8f1d-acde48001122
status: experimental
description: The following analytic detects the execution of 7z.exe, a 7-Zip utility, spawned from rundll32.exe or dllhost.exe.
  This behavior is identified using Endpoint Detection and Response (EDR) telemetry, focusing on process names and parent
  processes. This activity is significant as it may indicate an adversary attempting to use 7-Zip for data exfiltration, often
  by renaming the executable to evade detection. If confirmed malicious, this could lead to unauthorized data archiving and
  exfiltration, compromising sensitive information and potentially leading to further system exploitation.
references:
- https://research.splunk.com/9364ee8e-a39a-11eb-8f1d-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Teoderick Contreras, Splunk
tags:
- attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage:
    - '*\\rundll32.exe'
    - '*\\dllhost.exe'
  sel2:
    Image: '*7z*'
  sel3:
    Image: C:\\Program Files\\VMware\\VMware Tools\\7za.exe
  condition: ((sel1 and sel2) and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1560.001/archive_utility/windows-sysmon.log
