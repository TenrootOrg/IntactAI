title: Linux Setuid Using Setcap Utility
id: 9d96022e-6250-11ec-9a19-acde48001122
status: experimental
description: The following analytic detects the execution of the 'setcap' utility to enable the SUID bit on Linux systems.
  It leverages Endpoint Detection and Response (EDR) data, focusing on process names and command-line arguments that indicate
  the use of 'setcap' with specific capabilities. This activity is significant because setting the SUID bit allows a user
  to temporarily gain root access, posing a substantial security risk. If confirmed malicious, an attacker could escalate
  privileges, execute arbitrary commands with elevated permissions, and potentially compromise the entire system.
references:
- https://research.splunk.com/9d96022e-6250-11ec-9a19-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.001
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/setcap'
  sel2:
    CommandLine: '*setcap *'
  sel3:
    CommandLine:
    - '* cap_setuid=ep *'
    - '* cap_setuid+ep *'
    - '* cap_net_bind_service+p *'
    - '* cap_net_raw+ep *'
    - '* cap_dac_read_search+ep *'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.001/linux_setcap/sysmon_linux.log
