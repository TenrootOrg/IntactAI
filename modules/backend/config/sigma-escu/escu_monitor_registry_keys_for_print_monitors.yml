title: Monitor Registry Keys for Print Monitors
id: f5f6af30-7ba7-4295-bfe9-07de87c01bbc
status: experimental
description: The following analytic detects modifications to the registry key `HKLM\SYSTEM\CurrentControlSet\Control\Print\Monitors`.
  It leverages data from the Endpoint.Registry data model, focusing on events where the registry path is modified. This activity
  is significant because attackers can exploit this registry key to load arbitrary .dll files, which will execute with elevated
  SYSTEM permissions and persist after a reboot. If confirmed malicious, this could allow attackers to maintain persistence,
  execute code with high privileges, and potentially compromise the entire system.
references:
- https://research.splunk.com/f5f6af30-7ba7-4295-bfe9-07de87c01bbc/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk, Steven Dick, Bhavin Patel
tags:
- attack.t1547.010
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*CurrentControlSet\\Control\\Print\\Monitors*'
  condition: sel1
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1547.010/atomic_red_team/sysmon.log
x-intact-burst: false
x-intact: 'Fired 106 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
