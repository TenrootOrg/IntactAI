title: WMI Recon Running Process Or Services
id: b5cd5526-cce7-11eb-b3bd-acde48001122
status: experimental
description: The following analytic identifies suspicious PowerShell script execution via EventCode 4104, where WMI performs
  an event query to list running processes or services. This detection leverages PowerShell Script Block Logging to capture
  and analyze script block text for specific WMI queries. This activity is significant as it is commonly used by malware and
  APT actors to map security applications or services on a compromised machine. If confirmed malicious, this could allow attackers
  to identify and potentially disable security defenses, facilitating further compromise and persistence within the environment.
references:
- https://research.splunk.com/b5cd5526-cce7-11eb-b3bd-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1592
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*SELECT*'
  sel3:
    ScriptBlockText: '*Win32_Process*'
  sel4:
    ScriptBlockText: '*Win32_Service*'
  condition: (sel1 and sel2 and (sel3 or sel4))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/win32process.log
