title: Dump LSASS via comsvcs DLL
id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
status: experimental
description: The following analytic detects the behavior of dumping credentials from memory by exploiting the Local Security
  Authority Subsystem Service (LSASS) using the comsvcs.dll and MiniDump via rundll32. This detection leverages process information
  from Endpoint Detection and Response (EDR) logs, focusing on specific command-line executions. This activity is significant
  because it indicates potential credential theft, which can lead to broader system compromise, persistence, lateral movement,
  and privilege escalation. If confirmed malicious, attackers could gain unauthorized access to sensitive information, leading
  to data theft, ransomware attacks, or other damaging outcomes.
references:
- https://research.splunk.com/8943b567-f14d-4ee8-a0bb-2121d4ce3184/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rundll32.exe'
  sel2:
    OriginalFileName: RUNDLL32.EXE
  sel3:
    CommandLine: '*comsvcs.dll*'
  sel4:
    CommandLine:
    - '*MiniDump*'
    - '*#24*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.001/atomic_red_team/windows-sysmon.log
