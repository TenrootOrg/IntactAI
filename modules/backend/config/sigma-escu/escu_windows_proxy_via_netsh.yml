title: Windows Proxy Via Netsh
id: c137bfe8-6036-4cff-b77b-4e327dd0a1cf
status: experimental
description: The following analytic identifies the use of netsh.exe to configure a connection proxy, which can be leveraged
  for persistence by executing a helper DLL. It detects this activity by analyzing process creation events from Endpoint Detection
  and Response (EDR) agents, focusing on command-line executions involving "portproxy" and "v4tov4" parameters. This activity
  is significant because it indicates potential unauthorized network configuration changes, which could be used to maintain
  persistence or redirect network traffic. If confirmed malicious, this could allow an attacker to maintain covert access
  or manipulate network communications, posing a significant security risk.
references:
- https://research.splunk.com/c137bfe8-6036-4cff-b77b-4e327dd0a1cf/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1090.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\netsh.exe'
  sel2:
    OriginalFileName: netsh.exe
  sel3:
    CommandLine: '* portproxy *'
  sel4:
    CommandLine: '* v4tov4 *'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1090.001/netsh_portproxy/volt_sysmon.log
