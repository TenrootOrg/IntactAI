title: Ivanti EPMM Remote Unauthenticated API Access CVE-2023-35078
id: 66b9c9ba-7fb2-4e80-a3a2-496e5e078167
status: experimental
description: 'The following analytic detects attempts to exploit CVE-2023-35078, a vulnerability in Ivanti Endpoint Manager
  Mobile (EPMM) versions up to 11.4.

  It identifies HTTP requests to the endpoint "/mifs/aad/api/v2/authorized/users?*" with a status code of 200 in web logs.

  This activity is significant as it indicates unauthorized remote access to restricted functionalities or resources.

  If confirmed malicious, this could lead to data theft, unauthorized modifications, or further system compromise, necessitating
  immediate action to mitigate potential severe impacts.'
references:
- https://research.splunk.com/66b9c9ba-7fb2-4e80-a3a2-496e5e078167/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1133
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/mifs/aad/api/v2/authorized/users?*'
  sel2:
    sc-status: '200'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/ivanti/suricata_ivanti_CVE202335078.log
