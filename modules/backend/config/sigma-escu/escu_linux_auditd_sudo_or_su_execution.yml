title: Linux Auditd Sudo Or Su Execution
id: 817a5c89-5b92-4818-a22d-aa35e1361afe
status: experimental
description: The following analytic detects the execution of the "sudo" or "su" command on a Linux operating system. It leverages
  data from Linux Auditd, focusing on process names and parent process names. This activity is significant because "sudo"
  and "su" commands are commonly used by adversaries to elevate privileges, potentially leading to unauthorized access or
  control over the system. If confirmed malicious, this activity could allow attackers to execute commands with root privileges,
  leading to severe security breaches, data exfiltration, or further system compromise.
references:
- https://research.splunk.com/817a5c89-5b92-4818-a22d-aa35e1361afe/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.003
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    proctitle:
    - '*sudo *'
    - '*su *'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.003/linux_auditd_sudo_su/auditd_proctitle_sudo.log
