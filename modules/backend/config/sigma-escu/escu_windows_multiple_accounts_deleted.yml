title: Windows Multiple Accounts Deleted (counted event)
id: 49c0d4d6-c55d-4d3a-b3d5-7709fafed70d-base
status: experimental
description: The following analytic detects the deletion of more than five unique Windows accounts within a 10-minute period,
  using Event Code 4726 from the Windows Security Event Log. It leverages the `wineventlog_security` dataset, segmenting data
  into 10-minute intervals to identify suspicious account deletions. This activity is significant as it may indicate an attacker
  attempting to erase traces of their actions. If confirmed malicious, this could lead to unauthorized access removal, hindering
  incident response and forensic investigations.
references:
- https://research.splunk.com/49c0d4d6-c55d-4d3a-b3d5-7709fafed70d/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1098
- attack.t1078
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4726'
  sel2:
    status: success
  condition: (sel1 and sel2)
level: informational
name: escu_base_windows_multiple_accounts_deleted
