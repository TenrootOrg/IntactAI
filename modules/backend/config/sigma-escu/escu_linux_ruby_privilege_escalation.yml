title: Linux Ruby Privilege Escalation
id: 097b28b5-7004-4d40-a715-7e390501788b
status: experimental
description: The following analytic detects the execution of Ruby commands with elevated privileges on a Linux system. It
  identifies processes where Ruby is used with the `-e` flag to execute commands via `sudo`, leveraging Endpoint Detection
  and Response (EDR) telemetry. This activity is significant because it indicates a potential privilege escalation attempt,
  allowing a user to execute commands as root. If confirmed malicious, this could lead to full system compromise, enabling
  an attacker to gain root access, execute arbitrary commands, and maintain persistent control over the affected system.
references:
- https://research.splunk.com/097b28b5-7004-4d40-a715-7e390501788b/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*ruby*-e*'
  sel2:
    CommandLine: '*exec*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/ruby/sysmon_linux.log
