title: Windows Impair Defense Disable Win Defender Gen reports
id: 93f114f6-cb1e-419b-ac3f-9e11a3045e70
status: experimental
description: The following analytic detects modifications in the Windows registry to disable Windows Defender generic reports.
  It leverages data from the Endpoint.Registry data model, specifically monitoring changes to the "DisableGenericRePorts"
  registry value. This activity is significant as it can prevent the transmission of error reports to Microsoft's Windows
  Error Reporting service, potentially hiding malicious activities. If confirmed malicious, this action could allow attackers
  to bypass Windows Defender detections, reducing the visibility of their activities and increasing the risk of undetected
  system compromise.
references:
- https://research.splunk.com/93f114f6-cb1e-419b-ac3f-9e11a3045e70/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows Defender\\Reporting\\DisableGenericRePorts'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable-windows-security-defender-features/windefender-bypas-2-sysmon.log
