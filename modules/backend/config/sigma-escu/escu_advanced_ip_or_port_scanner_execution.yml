title: Advanced IP or Port Scanner Execution
id: 9a4e50c7-5b62-4d52-93b4-f2b61332e9a5
status: experimental
description: 'The following analytic detects the execution of network scanning utilities such as Advanced IP Scanner or Advanced
  Port Scanner.

  These legitimate administrative tools are often leveraged by threat actors and ransomware operators during the discovery
  phase to enumerate active hosts and open ports within a target environment.

  Detection is based on process creation telemetry referencing known executable names, original file names, or specific command-line
  parameters such as "/portable" and "/lng" that are characteristic of these tools.

  If confirmed malicious, this activity may indicate internal reconnaissance aimed at identifying reachable systems or services
  prior to lateral movement or further post-compromise actions.'
references:
- https://research.splunk.com/9a4e50c7-5b62-4d52-93b4-f2b61332e9a5/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1046
- attack.t1135
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\advanced_ip_scanner.exe'
    - '*\\advanced_ip_scanner_console.exe'
    - '*\\advanced_port_scanner.exe'
    - '*\\advanced_port_scanner_console.exe'
  sel2:
    OriginalFileName:
    - advanced_ip_scanner.exe
    - advanced_ip_scanner_console.exe
    - advanced_port_scanner.exe
    - advanced_port_scanner_console.exe
  sel3:
    CommandLine: '* /portable *'
  sel4:
    CommandLine: '* /lng *'
  condition: ((sel1 or sel2) or (sel3 and sel4))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1046/advanced_ip_port_scanner/advanced_ip_port_scanner.log
