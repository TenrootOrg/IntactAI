title: Linux MOTD Script Added
id: 6dd14256-559b-4364-99d8-0968407b8074
status: experimental
description: 'The following analytic detects the creation of a file within the /etc/update-motd.d directory.

  This is used to add scripts that run with Message of the Day (MOTD) when a user logs in.

  This can be used by attackers for persistence if it contains malicious code.'
references:
- https://research.splunk.com/6dd14256-559b-4364-99d8-0968407b8074/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
