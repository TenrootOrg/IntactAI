title: Process Creating LNK file in Suspicious Location
id: 5d814af1-1041-47b5-a9ac-d754e82e9a26
status: experimental
description: 'The following analytic detects a process creating a `.lnk` file in suspicious locations such as `C:\User*` or
  `*\Local\Temp\*`.

  It leverages filesystem and process activity data from the Endpoint data model to identify this behavior.

  This activity can be significant because creating `.lnk` files in these directories is a common indicator of spear phishing
  tools to establish persistence or execute malicious payloads.

  If confirmed malicious, this could allow an attacker to maintain persistence, execute arbitrary code, or further compromise
  the system.'
references:
- https://research.splunk.com/5d814af1-1041-47b5-a9ac-d754e82e9a26/
author: Splunk Security Content (Apache-2.0), Jose Hernandez, Michael Haag, Splunk
tags:
- attack.t1566.002
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename: '*.lnk'
  sel2:
    TargetFilename:
    - '*:\\AppData\\Local\\Temp\\*'
    - '*:\\Temp\\*'
    - '*:\\Users\\*'
    - '*:\\Windows\\Temp\\*'
  sel3:
    TargetFilename:
    - '*\\AppData\\Local\\Microsoft\\Windows\\WinX\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Excel\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Internet Explorer\\Quick Launch\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Office\\Recent\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Windows\\Recent\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\*'
    - '*\\AppData\\Roaming\\Microsoft\\Word\\*'
    - '*\\Links\\*'
    - '*\\OneDrive *'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566.002/lnk_file_temp_folder/windows-sysmon.log
x-intact-burst: false
x-intact: 'Fired 100 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
