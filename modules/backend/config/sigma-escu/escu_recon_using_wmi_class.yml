title: Recon Using WMI Class
id: 018c1972-ca07-11eb-9473-acde48001122
status: experimental
description: The following analytic detects suspicious PowerShell activity via EventCode 4104, where WMI performs event queries
  to gather information on running processes or services. This detection leverages PowerShell Script Block Logging to identify
  specific WMI queries targeting system information classes like Win32_Bios and Win32_OperatingSystem. This activity is significant
  as it often indicates reconnaissance efforts by an adversary to profile the compromised machine. If confirmed malicious,
  the attacker could gain detailed system information, aiding in further exploitation or lateral movement within the network.
references:
- https://research.splunk.com/018c1972-ca07-11eb-9473-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1592
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*SELECT*'
    - '*Get-WmiObject*'
  sel3:
    ScriptBlockText:
    - '*Win32_Bios*'
    - '*Win32_OperatingSystem*'
    - '*Win32_Processor*'
    - '*Win32_ComputerSystem*'
    - '*Win32_PnPEntity*'
    - '*Win32_ShadowCopy*'
    - '*Win32_DiskDrive*'
    - '*Win32_PhysicalMemory*'
    - '*Win32_BaseBoard*'
    - '*Win32_DisplayConfiguration*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/reconusingwmi.log
