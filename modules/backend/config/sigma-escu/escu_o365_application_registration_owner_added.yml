title: O365 Application Registration Owner Added
id: c068d53f-6aaa-4558-8011-3734df878266
status: experimental
description: The following analytic identifies instances where a new owner is assigned to an application registration within
  an Azure AD and Office 365 tenant. It leverages O365 audit logs, specifically events related to changes in owner assignments
  within the AzureActiveDirectory workload. This activity is significant because assigning a new owner to an application registration
  can grant significant control over the application's configuration, permissions, and behavior. If confirmed malicious, an
  attacker could modify the application's settings, permissions, and behavior, leading to unauthorized data access, privilege
  escalation, or the introduction of malicious behavior within the application's operations.
references:
- https://research.splunk.com/c068d53f-6aaa-4558-8011-3734df878266/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1098
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: AzureActiveDirectory
  sel2:
    Operation: Add owner to application.
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098/o365_add_app_registration_owner/o365_add_app_registration_owner.log
