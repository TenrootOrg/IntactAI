title: Execute Javascript With Jscript COM CLSID
id: dc64d064-d346-11eb-8588-acde48001122
status: experimental
description: The following analytic detects the execution of JavaScript using the JScript.Encode CLSID (COM Object) by cscript.exe.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names, command-line executions,
  and parent processes. This activity is significant as it is a known technique used by ransomware, such as Reddot, to execute
  malicious scripts and potentially disable AMSI (Antimalware Scan Interface). If confirmed malicious, this behavior could
  allow attackers to execute arbitrary code, evade detection, and maintain persistence within the environment.
references:
- https://research.splunk.com/dc64d064-d346-11eb-8588-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cscript.exe'
  sel2:
    CommandLine: '*-e:{F414C262-6AC0-11CF-B6D1-00AA00BBBB58}*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/ransomware_ttp/data2/windows-sysmon.log
