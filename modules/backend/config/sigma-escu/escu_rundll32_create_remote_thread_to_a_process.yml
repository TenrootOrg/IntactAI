title: Rundll32 Create Remote Thread To A Process
id: 2dbeee3a-f067-11eb-96c0-acde48001122
status: experimental
description: 'The following analytic detects the creation of a remote thread by rundll32.exe into another process. It leverages
  Sysmon EventCode 8 logs, specifically monitoring SourceImage and TargetImage fields.

  This activity is significant as it is a common technique used by malware, such as IcedID, to execute malicious code within
  legitimate processes, aiding in defense evasion and data theft.

  If confirmed malicious, this behavior could allow an attacker to execute arbitrary code, escalate privileges, and exfiltrate
  sensitive information from the compromised host.'
references:
- https://research.splunk.com/2dbeee3a-f067-11eb-96c0-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1055
logsource:
  product: windows
  service: sysmon
  category: create_remote_thread
detection:
  sel1:
    EventID: '8'
  sel2:
    SourceImage: '*\\rundll32.exe'
  sel3:
    TargetImage: '*.exe'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/icedid/inf_icedid/windows-sysmon.log
