title: Windows Visual Basic Commandline Compiler DNSQuery
id: 8976744a-ae7a-46a4-8128-690df85c2af4
status: experimental
description: The following analytic detects instances where vbc.exe, the Visual Basic Command Line Compiler, initiates DNS
  queries. Normally, vbc.exe operates locally to compile Visual Basic code and does not require internet access or to perform
  DNS lookups. Therefore, any observed DNS activity originating from vbc.exe is highly suspicious and indicative of potential
  malicious activity. This behavior often suggests that a malicious payload is masquerading as the legitimate vbc.exe process
  to establish command-and-control (C2) communication, resolve domains for data exfiltration, or download additional stages
  of malware. Security teams should investigate the process's parent, command-line arguments, and the resolved domains for
  further indicators of compromise.
references:
- https://research.splunk.com/8976744a-ae7a-46a4-8128-690df85c2af4/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1071.004
logsource:
  product: windows
  service: sysmon
  category: dns_query
detection:
  sel1:
    EventID: '22'
  sel2:
    Image: '*\\vbc.exe'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1071.004/vbc_dnsquery/vbc_dns_query.log
