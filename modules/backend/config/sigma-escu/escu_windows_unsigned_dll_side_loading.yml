title: Windows Unsigned DLL Side-Loading
id: 5a83ce44-8e0f-4786-a775-8249a525c879
status: experimental
description: The following analytic detects the creation of potentially malicious unsigned DLLs in the c:\windows\system32
  or c:\windows\syswow64 folders. It leverages Sysmon EventCode 7 logs to identify unsigned DLLs with unavailable signatures
  loaded in these critical directories. This activity is significant as it may indicate a DLL hijacking attempt, a technique
  used by attackers to gain unauthorized access and execute malicious code. If confirmed malicious, this could lead to privilege
  escalation, allowing the attacker to gain elevated privileges and further compromise the target system.
references:
- https://research.splunk.com/5a83ce44-8e0f-4786-a775-8249a525c879/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1574.001
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    Signed: 'false'
  sel3:
    OriginalFileName: '-'
  sel4:
    SignatureStatus: unavailable
  sel5:
    ImageLoaded:
    - '*:\\windows\\system32\\*'
    - '*:\\windows\\syswow64\\*'
  condition: (sel1 and sel2 and sel3 and sel4 and sel5)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/warzone_rat/unsigned_dll_loaded/loaded_unsigned_dll.log
