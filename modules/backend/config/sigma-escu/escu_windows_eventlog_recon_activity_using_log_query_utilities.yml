title: Windows EventLog Recon Activity Using Log Query Utilities
id: dc167f8b-3f9d-4460-9c98-8b6e703fd628
status: experimental
description: This analytic detects EventLog reconnaissance activity using utilities such as `wevtutil.exe`, `wmic.exe`, PowerShell
  cmdlets like `Get-WinEvent`, or WMI queries targeting `Win32_NTLogEvent`. It leverages data from Endpoint Detection and
  Response (EDR) agents, focusing on process names and command-line arguments. These tools are often used by adversaries to
  extract usernames, IP addresses, session data, and event information for credential access or situational awareness during
  lateral movement. While these utilities are legitimate, execution with specific arguments or targeting sensitive logs like
  `Security`, `PowerShell`, or specific EventIDs (e.g., 4624, 4778) can indicate malicious intent. If confirmed malicious,
  this behavior could allow an attacker to extract sensitive info and potentially have leveraged access or move laterally.
references:
- https://research.splunk.com/dc167f8b-3f9d-4460-9c98-8b6e703fd628/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1654
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\powershell.exe'
    - '*\\pwsh.exe'
    - '*\\powershell_ise.exe'
  sel2:
    OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
    - powershell_ise.EXE
  sel3:
    CommandLine:
    - '*Get-WinEvent*'
    - '*Get-EventLog*'
    - '*EventLogQuery*'
    - '*.ReadEvent(*'
  sel4:
    Image: '*\\wevtutil.exe'
  sel5:
    OriginalFileName: wevtutil.exe
  sel6:
    CommandLine:
    - '* qe *'
    - '* query-events *'
  sel7:
    Image: '*\\wmic.exe'
  sel8:
    OriginalFileName: wmic.exe
  sel9:
    CommandLine: '*ntevent*'
  sel10:
    CommandLine: '*Win32_NTLogEvent*'
  sel11:
    CommandLine: '*EventCode*'
  sel12:
    CommandLine:
    - '*PsLogList*'
    - '*Eventquery*'
  condition: ((((((sel1 or sel2) and sel3) or ((sel4 or sel5) and sel6)) or ((sel7 or sel8) and sel9)) or (sel10 and sel11))
    or sel12)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1654/eventlog_enumeration/eventlog_enumeration.log
