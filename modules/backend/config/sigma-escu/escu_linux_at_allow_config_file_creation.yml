title: Linux At Allow Config File Creation
id: 977b3082-5f3d-11ec-b954-acde48001122
status: experimental
description: The following analytic detects the creation of the /etc/at.allow or /etc/at.deny configuration files in Linux.
  It leverages file creation events from the Endpoint datamodel to identify when these files are created. This activity is
  significant as these files control user permissions for the "at" scheduling application and can be abused by attackers to
  establish persistence. If confirmed malicious, this could allow unauthorized execution of malicious code, leading to potential
  data theft or further system compromise. Analysts should review the file path, creation time, and associated processes to
  assess the threat.
references:
- https://research.splunk.com/977b3082-5f3d-11ec-b954-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1053.003
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename:
    - '*/etc/at.allow'
    - '*/etc/at.deny'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.002/at_execution/sysmon_linux.log
