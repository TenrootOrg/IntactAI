title: Windows Impair Defense Disable Web Evaluation
id: e234970c-dcf5-4f80-b6a9-3a562544ca5b
status: experimental
description: The following analytic detects modifications to the Windows registry entry "EnableWebContentEvaluation" to disable
  Windows Defender web content evaluation. It leverages data from the Endpoint.Registry datamodel, specifically monitoring
  changes where the registry value is set to "0x00000000". This activity is significant as it indicates an attempt to impair
  browser security features, potentially allowing malicious web content to bypass security checks. If confirmed malicious,
  this could lead to users interacting with harmful scripts or unsafe web elements, increasing the risk of system exploitation
  and security breaches.
references:
- https://research.splunk.com/e234970c-dcf5-4f80-b6a9-3a562544ca5b/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows\\CurrentVersion\\AppHost\\EnableWebContentEvaluation'
  sel2:
    Details:
    - '* (0)'
    - '0'
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable-windows-security-defender-features/windefender-bypas-2-sysmon.log
