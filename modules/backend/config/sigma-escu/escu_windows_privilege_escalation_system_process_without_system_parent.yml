title: Windows Privilege Escalation System Process Without System Parent
id: 5a5351cd-ba7e-499e-ad82-2ce160ffa637
status: experimental
description: The following analytic detects any system integrity level process spawned by a non-system account. It leverages
  Sysmon EventID 1, focusing on process integrity and parent user data. This behavior is significant as it often indicates
  successful privilege escalation to SYSTEM from a user-controlled process or service. If confirmed malicious, this activity
  could allow an attacker to gain full control over the system, execute arbitrary code, and potentially compromise the entire
  environment.
references:
- https://research.splunk.com/5a5351cd-ba7e-499e-ad82-2ce160ffa637/
author: Splunk Security Content (Apache-2.0), Steven Dick
tags:
- attack.t1068
- attack.t1548
- attack.t1134
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  sel1:
    EventID: '1'
  sel2:
    IntegrityLevel: system
  sel3:
    ParentUser: '*'
  sel4:
    ParentUser:
    - '*SYSTEM'
    - '*LOCAL SERVICE'
    - '*NETWORK SERVICE'
    - '*DWM-*'
    - '*$'
    - '-'
  condition: (sel1 and sel2 and sel3 and not (sel4))
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1068/windows_escalation_behavior/windows_escalation_behavior_sysmon.log
x-intact-burst: false
x-intact: 'Fired 5 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
