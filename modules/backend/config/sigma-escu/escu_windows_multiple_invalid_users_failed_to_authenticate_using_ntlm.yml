title: Windows Multiple Invalid Users Failed To Authenticate Using NTLM (counted event)
id: 57ad5a64-9df7-11eb-a290-acde48001122-base
status: experimental
description: The following analytic detects a single source endpoint failing to authenticate with 30 unique invalid users
  using the NTLM protocol. It leverages EventCode 4776 from Domain Controller logs, focusing on error code 0xC0000064, which
  indicates non-existent usernames. This behavior is significant as it may indicate a Password Spraying attack, where an adversary
  attempts to gain initial access or elevate privileges. If confirmed malicious, this activity could lead to unauthorized
  access, privilege escalation, and potential compromise of sensitive information within the Active Directory environment.
references:
- https://research.splunk.com/57ad5a64-9df7-11eb-a290-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4776'
  sel2:
    TargetUserName: '*$'
  sel3:
    Status: '0xc0000064'
  condition: (sel1 and not sel2 and sel3)
level: informational
name: escu_base_windows_multiple_invalid_users_failed_to_authenticate_using_ntlm
