title: High Process Termination Frequency (counted event)
id: 17cd75b2-8666-11eb-9ab4-acde48001122-base
status: experimental
description: The following analytic identifies a high frequency of process termination events on a computer within a short
  period. It leverages Sysmon EventCode 5 logs to detect instances where 15 or more processes are terminated within a 3-second
  window. This behavior is significant as it is commonly associated with ransomware attempting to avoid exceptions during
  file encryption. If confirmed malicious, this activity could indicate an active ransomware attack, potentially leading to
  widespread file encryption and significant data loss.
references:
- https://research.splunk.com/17cd75b2-8666-11eb-9ab4-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras
tags:
- attack.t1486
logsource:
  product: windows
  service: sysmon
detection:
  sel1:
    EventID: '5'
  condition: sel1
level: informational
name: escu_base_high_process_termination_frequency
