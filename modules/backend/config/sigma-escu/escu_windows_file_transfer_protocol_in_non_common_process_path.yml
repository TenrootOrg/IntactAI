title: Windows File Transfer Protocol In Non-Common Process Path
id: 0f43758f-1fe9-470a-a9e4-780acc4d5407
status: experimental
description: The following analytic detects FTP connections initiated by processes located in non-standard installation paths
  on Windows systems. It leverages Sysmon EventCode 3 to identify network connections where the process image path does not
  match common directories like "Program Files" or "Windows\System32". This activity is significant as FTP is often used by
  adversaries and malware, such as AgentTesla, for Command and Control (C2) communications to exfiltrate stolen data. If confirmed
  malicious, this could lead to unauthorized data transfer, exposing sensitive information and compromising the integrity
  of the affected host.
references:
- https://research.splunk.com/0f43758f-1fe9-470a-a9e4-780acc4d5407/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1071.003
logsource:
  product: windows
  service: sysmon
  category: network_connection
detection:
  sel1:
    EventID: '3'
  sel2:
    Image:
    - C:\\Program Files \\(x86\\)\\*
    - C:\\Program Files\\*
    - C:\\Windows\\System32\\*
    - C:\\Windows\\SysWOW64\\*
  sel3:
    DestinationPortName: ftp
  sel4:
    DestinationPort: '21'
  condition: (sel1 and not (sel2) and (sel3 or sel4))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/agent_tesla/agent_tesla_ftp/sysmon.log
