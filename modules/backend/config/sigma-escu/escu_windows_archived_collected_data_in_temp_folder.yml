title: Windows Archived Collected Data In TEMP Folder
id: cb56a1ea-e0b1-46d5-913f-e024cba40cbe
status: experimental
description: The following analytic detects the creation of archived files in a temporary folder, which may contain collected
  data. This behavior is often associated with malicious activity, where attackers compress sensitive information before exfiltration.
  The detection focuses on monitoring specific directories, such as temp folders, for the presence of newly created archive
  files (e.g., .zip, .rar, .tar). By identifying this pattern, security teams can quickly respond to potential data collection
  and exfiltration attempts, minimizing the risk of data breaches and improving overall threat detection.
references:
- https://research.splunk.com/cb56a1ea-e0b1-46d5-913f-e024cba40cbe/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1560
logsource:
  category: file_event
  product: windows
detection:
  sel1:
    TargetFilename:
    - '*.zip'
    - '*.rar'
    - '*.tar'
    - '*.7z'
  sel2:
    TargetFilename:
    - '*\\AppData\\Local\\Temp\\*'
    - '*\\Windows\\Temp\\*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1560/archived_in_temp_dir/braodo_zip_temp.log
x-intact-burst: false
x-intact: 'Fired 3 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
