title: Linux File Creation In System Generator Directory
id: 06c23568-e05b-4fff-95cd-8b0303b6d032
status: experimental
description: 'The following analytic detects potential persistence using a systemd generator on Linux, which involves creating
  a malicious script or binary that is typically executed during the system''s boot process.

  Systemd generators are typically placed in directories like /lib/systemd/system-generators/, where they are run early in
  the boot sequence to dynamically generate or modify unit files that control system services.

  By placing a custom generator in this directory, an attacker can ensure their code is executed each time the system starts,
  allowing them to maintain access or control even after reboots.'
references:
- https://research.splunk.com/06c23568-e05b-4fff-95cd-8b0303b6d032/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1037.005
- attack.t1547
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename: '*/lib/systemd/system-generators/*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1037.005/linux_persistence_via_system_generator/snapattack_linux.log
