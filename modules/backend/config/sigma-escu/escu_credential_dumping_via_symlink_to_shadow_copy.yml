title: Credential Dumping via Symlink to Shadow Copy
id: c5eac648-fae0-4263-91a6-773df1f4c903
status: experimental
description: The following analytic detects the creation of a symlink to a shadow copy, which may indicate credential dumping
  attempts. It leverages the Endpoint.Processes data model in Splunk to identify processes executing commands containing "mklink"
  and "HarddiskVolumeShadowCopy". This activity is significant because attackers often use this technique to manipulate or
  delete shadow copies, hindering system backup and recovery efforts. If confirmed malicious, this could prevent data restoration,
  complicate incident response, and lead to data loss or compromise. Analysts should review the process details, user, parent
  process, and any related artifacts to identify the attack source.
references:
- https://research.splunk.com/c5eac648-fae0-4263-91a6-773df1f4c903/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    OriginalFileName: Cmd.Exe
  sel3:
    CommandLine: '*mklink*'
  sel4:
    CommandLine: '*HarddiskVolumeShadowCopy*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.003/atomic_red_team/windows-sysmon.log
