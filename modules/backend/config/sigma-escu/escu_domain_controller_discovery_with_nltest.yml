title: Domain Controller Discovery with Nltest
id: 41243735-89a7-4c83-bcdd-570aa78f00a1
status: experimental
description: The following analytic detects the execution of `nltest.exe` with command-line arguments `/dclist:` or `/dsgetdc:`
  to discover domain controllers. It leverages Endpoint Detection and Response (EDR) data, focusing on process names and command-line
  arguments. This activity is significant because both Red Teams and adversaries use `nltest.exe` for situational awareness
  and Active Directory discovery. If confirmed malicious, this behavior could allow attackers to map out domain controllers,
  facilitating further attacks such as privilege escalation or lateral movement within the network.
references:
- https://research.splunk.com/41243735-89a7-4c83-bcdd-570aa78f00a1/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\nltest.exe'
  sel2:
    OriginalFileName: nltestrk.exe
  sel3:
    CommandLine: '*/dclist:*'
  sel4:
    CommandLine: '*/dsgetdc:*'
  condition: ((sel1 or sel2) and (sel3 or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1018/AD_discovery/windows-sysmon.log
