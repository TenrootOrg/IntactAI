title: Windows PowerShell ScheduleTask
id: ddf82fcb-e9ee-40e3-8712-a50b5bf323fc
status: experimental
description: The following analytic detects potential malicious activities involving PowerShell's task scheduling cmdlets.
  It leverages PowerShell Script Block Logging (EventCode 4104) to identify unusual or suspicious use of cmdlets like 'New-ScheduledTask'
  and 'Set-ScheduledTask'. This activity is significant as attackers often use these cmdlets for persistence and remote execution
  of malicious code. If confirmed malicious, this could allow attackers to maintain access, deliver additional payloads, or
  execute ransomware, leading to data theft or other severe impacts. Immediate investigation and mitigation are crucial to
  prevent further compromise.
references:
- https://research.splunk.com/ddf82fcb-e9ee-40e3-8712-a50b5bf323fc/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1053.005
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText:
    - '*New-ScheduledTask*'
    - '*New-ScheduledTaskAction*'
    - '*New-ScheduledTaskSettingsSet*'
    - '*New-ScheduledTaskTrigger*'
    - '*Register-ClusteredScheduledTask*'
    - '*Register-ScheduledTask*'
    - '*Set-ClusteredScheduledTask*'
    - '*Set-ScheduledTask*'
    - '*Start-ScheduledTask*'
    - '*Enable-ScheduledTask*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/atomic_red_team/pwsh_scheduledtask.log
