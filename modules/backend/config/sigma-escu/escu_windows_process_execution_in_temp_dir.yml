title: Windows Process Execution in Temp Dir
id: f6fbe929-4187-4ba4-901e-8a34be838443
status: experimental
description: The following analytic identifies processes running from %temp% directory file paths. It leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on specific process paths within the Endpoint data model. This activity
  is significant because adversaries often use unconventional file paths to execute malicious code without requiring administrative
  privileges. If confirmed malicious, this behavior could indicate an attempt to bypass security controls, leading to unauthorized
  software execution, potential system compromise, and further malicious activities within the environment.
references:
- https://research.splunk.com/f6fbe929-4187-4ba4-901e-8a34be838443/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1543
- attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\temp\\*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1036/process_temp_path/process_temp_path.log
x-intact-burst: false
