title: Windows Modify Registry Regedit Silent Reg Import
id: 824dd598-71be-4203-bc3b-024f4cda340e
status: experimental
description: The following analytic detects the modification of the Windows registry using the regedit.exe application with
  the silent mode parameter. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names
  and command-line executions. This activity is significant because the silent mode allows registry changes without user confirmation,
  which can be exploited by adversaries to import malicious registry settings. If confirmed malicious, this could enable attackers
  to persist in the environment, escalate privileges, or manipulate system configurations, leading to potential system compromise.
references:
- https://research.splunk.com/824dd598-71be-4203-bc3b-024f4cda340e/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\regedit.exe'
  sel2:
    OriginalFileName: regedit.exe
  sel3:
    CommandLine: '* /s *'
  sel4:
    CommandLine: '*.reg*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
x-intact-burst: false
x-intact: 'Fired 1 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
