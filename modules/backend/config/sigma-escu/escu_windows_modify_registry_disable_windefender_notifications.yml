title: Windows Modify Registry Disable WinDefender Notifications
id: 8e207707-ad40-4eb3-b865-3a52aec91f26
status: experimental
description: The following analytic detects a suspicious registry modification aimed at disabling Windows Defender notifications.
  It leverages data from the Endpoint.Registry data model, specifically looking for changes to the registry path "*\\SOFTWARE\\Policies\\Microsoft\\Windows
  Defender Security Center\\Notifications\\DisableNotifications" with a value of "0x00000001". This activity is significant
  as it indicates an attempt to evade detection by disabling security alerts, a technique used by adversaries and malware
  like RedLine Stealer. If confirmed malicious, this could allow attackers to operate undetected, increasing the risk of further
  compromise and data exfiltration.
references:
- https://research.splunk.com/8e207707-ad40-4eb3-b865-3a52aec91f26/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SOFTWARE\\Policies\\Microsoft\\Windows Defender Security Center\\Notifications\\DisableNotifications'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/redline/modify_registry/sysmon.log
