title: Windows LAPS Password Gathering Via PowerShell Script
id: 02b712b6-5996-4537-b72a-cad3cb1bb3b4
status: experimental
description: 'Detects attempts to gather LAPS passwords via PowerShell and the ms-Mcs-AdmPwd property.

  Microsoft LAPS (Local Administrator Password Solution) is a Windows native tool used to manage local Administrator accounts
  within an AD domain.

  To keep things simple, instead of requiring an administrator to manually set, rotate, and store the local Administrator
  passwords, LAPS will do this automatically while providing an easy interface for authorized users to access passwords for
  recovery and/or other admin-related tasks.

  The benefits to an organization here are obvious: automate and protect a well-known critical security challenge and free
  up IT resources on your team.

  However, the fact that LAPS has so much information means that it provides a potential avenue of attack for malicious actors
  looking to further compromise an environment.

  If LAPS isn''t properly locked down, an organization can inadvertently allow anybody to grab local Admin powers on a given
  machine.'
references:
- https://research.splunk.com/02b712b6-5996-4537-b72a-cad3cb1bb3b4/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1552
- attack.t1003
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-AdComputer*'
  sel3:
    ScriptBlockText: '*ms-Mcs-AdmPwd*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552/snapattack/snapattack.log
