title: Windows Executable in Loaded Modules
id: 3e27af56-fcf0-4113-988d-24969b062be7
status: experimental
description: The following analytic identifies instances where executable files (.exe) are loaded as modules, detected through
  'ImageLoaded' events in Sysmon logs. This method leverages Sysmon EventCode 7 to track unusual module loading behavior,
  which is significant as it deviates from the norm of loading .dll files. This activity is crucial for SOC monitoring because
  it can indicate the presence of malware like NjRAT, which uses this technique to load malicious modules. If confirmed malicious,
  this behavior could allow attackers to execute arbitrary code, maintain persistence, and further compromise the host system.
references:
- https://research.splunk.com/3e27af56-fcf0-4113-988d-24969b062be7/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1129
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    ImageLoaded: '*.dll'
  sel3:
    Signed: 'true'
  condition: (sel1 and not sel2 and not sel3)
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1129/executable_shared_modules/image_loaded_exe.log
x-intact-burst: false
x-intact: 'Fired 370 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
