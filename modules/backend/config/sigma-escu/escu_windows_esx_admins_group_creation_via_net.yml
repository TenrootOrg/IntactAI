title: Windows ESX Admins Group Creation via Net
id: 3d7df60b-3332-4667-8090-afe03e08dce0
status: experimental
description: This analytic detects attempts to create an "ESX Admins" group using the Windows net.exe or net1.exe commands.
  This activity may indicate an attempt to exploit the VMware ESXi Active Directory Integration Authentication Bypass vulnerability
  (CVE-2024-37085). Attackers can use this method to gain unauthorized access to ESXi hosts by recreating the "ESX Admins"
  group after its deletion from Active Directory.
references:
- https://research.splunk.com/3d7df60b-3332-4667-8090-afe03e08dce0/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1136.002
- attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    CommandLine: '*group*'
  sel4:
    CommandLine: '*ESX Admins*'
  sel5:
    CommandLine: '*/add*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1136.001/atomic_red_team/windows-sysmon-esxadmins.log
