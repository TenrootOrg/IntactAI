title: Linux Ngrok Reverse Proxy Usage
id: bc84d574-708c-467d-b78a-4c1e20171f97
status: experimental
description: The following analytic detects the use of Ngrok on a Linux operating system. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process names and command-line arguments associated with Ngrok. This activity
  is significant because Ngrok can be used by adversaries to establish reverse proxies, potentially bypassing network defenses.
  If confirmed malicious, this could allow attackers to create persistent, unauthorized access channels, facilitating data
  exfiltration or further exploitation of the compromised system.
references:
- https://research.splunk.com/bc84d574-708c-467d-b78a-4c1e20171f97/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1572
- attack.t1090
- attack.t1102
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/ngrok'
  sel2:
    CommandLine:
    - '*start*'
    - '*--config*'
    - '*http*'
    - '*authtoken*'
    - '*tcp*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1572/ngrok/ngrok_linux-sysmon.log
