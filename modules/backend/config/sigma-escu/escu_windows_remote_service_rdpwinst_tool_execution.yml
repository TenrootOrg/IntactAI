title: Windows Remote Service Rdpwinst Tool Execution
id: c8127f87-c7c9-4036-89ed-8fe4b30e678c
status: experimental
description: The following analytic detects the execution of the RDPWInst.exe tool, which is an RDP wrapper library used to
  enable remote desktop host support and concurrent RDP sessions. This detection leverages data from Endpoint Detection and
  Response (EDR) agents, focusing on process names, original file names, and specific command-line arguments. This activity
  is significant because adversaries can abuse this tool to establish unauthorized RDP connections, facilitating remote access
  and potential lateral movement within the network. If confirmed malicious, this could lead to unauthorized access, data
  exfiltration, and further compromise of the targeted host.
references:
- https://research.splunk.com/c8127f87-c7c9-4036-89ed-8fe4b30e678c/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\RDPWInst.exe'
  sel2:
    OriginalFileName: RDPWInst.exe
  sel3:
    CommandLine:
    - '* -i*'
    - '* -s*'
    - '* -o*'
    - '* -w*'
    - '* -r*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
