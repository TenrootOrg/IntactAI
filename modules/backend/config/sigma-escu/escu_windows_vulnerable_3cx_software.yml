title: Windows Vulnerable 3CX Software
id: f2cc1584-46ee-485b-b905-977c067f36de
status: experimental
description: The following analytic detects instances of the 3CXDesktopApp.exe with a FileVersion of 18.12.x, leveraging Sysmon
  logs. This detection focuses on identifying vulnerable versions 18.12.407 and 18.12.416 of the 3CX desktop app. Monitoring
  this activity is crucial as these specific versions have known vulnerabilities that could be exploited by attackers. If
  confirmed malicious, exploitation of this vulnerability could lead to unauthorized access, code execution, or further compromise
  of the affected system, posing significant security risks.
references:
- https://research.splunk.com/f2cc1584-46ee-485b-b905-977c067f36de/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1195.002
logsource:
  product: windows
  service: sysmon
detection:
  sel1:
    Image: '*\\3CXDesktopApp.exe'
  sel2:
    OriginalFileName: 3CXDesktopApp.exe
  sel3:
    FileVersion: 18.12.*
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1195.002/3CX/3cx_windows-sysmon.log
