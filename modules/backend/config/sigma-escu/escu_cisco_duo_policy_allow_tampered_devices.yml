title: Cisco Duo Policy Allow Tampered Devices
id: 6b813efd-8859-406f-b677-719458387fac
status: experimental
description: 'The following analytic detects when a Duo policy is created or updated to allow tampered or rooted devices,
  such as jailbroken smartphones,

  to access protected resources. It identifies this behavior by searching Duo administrator activity logs for policy changes
  where the allow_rooted_devices

  setting is enabled. This is accomplished by filtering for policy creation or update actions and parsing the policy description
  for the relevant configuration.

  Allowing tampered devices poses a significant security risk, as these devices may bypass built-in security controls, run
  unauthorized software, or be more

  susceptible to compromise. For a Security Operations Center (SOC), identifying such policy changes is critical because it
  may indicate either a

  misconfiguration or a malicious attempt to weaken authentication requirements, potentially enabling attackers to access
  sensitive systems with

  compromised devices. The impact of this attack can include unauthorized access, data breaches, and latera'
references:
- https://research.splunk.com/6b813efd-8859-406f-b677-719458387fac/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1556
logsource:
  product: cisco
  service: duo
detection:
  sel1:
    action: policy_update
  sel2:
    action: policy_create
  sel3:
    allow_rooted_devices: 'true'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556/cisco_duo_policy_allow_tampered_devices/cisco_duo_administrator.json
