title: Windows Suspicious Driver Loaded Path
id: 2ca1c4a1-8342-4750-9363-905650e0c933
status: experimental
description: The following analytic detects the loading of drivers from suspicious paths, which is a technique often used
  by malicious software such as coin miners (e.g., xmrig). It leverages Sysmon EventCode 6 to identify drivers loaded from
  non-standard directories. This activity is significant because legitimate drivers typically reside in specific system directories,
  and deviations may indicate malicious activity. If confirmed malicious, this could allow an attacker to execute code at
  the kernel level, potentially leading to privilege escalation, persistence, or further system compromise.
references:
- https://research.splunk.com/2ca1c4a1-8342-4750-9363-905650e0c933/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1543.003
logsource:
  product: windows
  service: sysmon
  category: driver_load
detection:
  sel1:
    EventID: '6'
  sel2:
    ImageLoaded:
    - '*\\windows\\fonts\\*'
    - '*\\users\\public\\*'
    - '*\\windows\\debug\\*'
    - '*\\Users\\Administrator\\Music\\*'
    - '*Recycle.bin*'
    - '*\\Windows\\Media\\*'
    - \\Windows\\repair\\*
    - '*\\PerfLogs\\*'
    - '*:\\Windows\\Prefetch\\*'
    - '*:\\Windows\\Cursors\\*'
    - '*\\temp\\*'
    - '*\\download*'
    - '*\\appdata\\*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/xmrig_miner/windows-sysmon.log
