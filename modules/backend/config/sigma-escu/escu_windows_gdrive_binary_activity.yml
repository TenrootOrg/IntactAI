title: Windows Gdrive Binary Activity
id: 9e7bd7c8-1c08-496e-9ffe-fd84ceb322e7
status: experimental
description: The following analytic detects the execution of the 'gdrive' tool on a Windows host. This tool allows standard
  users to perform tasks associated with Google Drive via the command line. This is used by actors to stage tools as well
  as exfiltrate data. The detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process
  names and command-line executions. If confirmed malicious, this could lead to compromise of systems or sensitive data being
  stolen.
references:
- https://research.splunk.com/9e7bd7c8-1c08-496e-9ffe-fd84ceb322e7/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1567
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\gdrive.exe'
  sel2:
    OriginalFileName: '*gdrive.exe'
  sel3:
    CommandLine:
    - '* download *'
    - '* upload *'
    - '* list*'
    - '* update *'
    - '* sync *'
    - '* share *'
    - '* account add*'
    - '* drives *'
    - '* files *'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1567/gdrive/gdrive_windows.log
