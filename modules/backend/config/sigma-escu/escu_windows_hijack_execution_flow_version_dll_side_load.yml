title: Windows Hijack Execution Flow Version Dll Side Load
id: 8351340b-ac0e-41ec-8b07-dd01bf32d6ea
status: experimental
description: The following analytic detects a process loading a version.dll file from a directory other than %windir%\system32
  or %windir%\syswow64. This detection leverages Sysmon EventCode 7 to identify instances where an unsigned or improperly
  located version.dll is loaded. This activity is significant as it is a common technique used in ransomware and APT malware
  campaigns, including Brute Ratel C4, to execute malicious code via DLL side loading. If confirmed malicious, this could
  allow attackers to execute arbitrary code, maintain persistence, and potentially compromise the target host.
references:
- https://research.splunk.com/8351340b-ac0e-41ec-8b07-dd01bf32d6ea/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1574.001
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    ImageLoaded: '*\\version.dll'
  sel3:
    Signed: 'false'
  sel4:
    ImageLoaded:
    - '*\\windows\\system32*'
    - '*\\windows\\syswow64\\*'
  condition: (sel1 and sel2 and (sel3 or not (sel4)))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/brute_ratel/iso_version_dll_campaign/sysmon.log
