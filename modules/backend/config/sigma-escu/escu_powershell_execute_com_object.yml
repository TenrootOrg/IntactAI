title: Powershell Execute COM Object
id: 65711630-f9bf-11eb-8d72-acde48001122
status: experimental
description: The following analytic detects the execution of a COM CLSID through PowerShell. It leverages EventCode 4104 and
  searches for specific script block text indicating the creation of a COM object. This activity is significant as it is commonly
  used by adversaries and malware, such as the Conti ransomware, to execute commands, potentially for privilege escalation
  or bypassing User Account Control (UAC). If confirmed malicious, this technique could allow attackers to gain elevated privileges
  or persist within the environment, posing a significant security risk.
references:
- https://research.splunk.com/65711630-f9bf-11eb-8d72-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1059.001
- attack.t1546.015
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*CreateInstance([type]::GetTypeFromCLSID*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1546.015/pwh_com_object/windows-powershell-xml.log
