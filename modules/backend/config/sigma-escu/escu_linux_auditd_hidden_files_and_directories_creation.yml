title: Linux Auditd Hidden Files And Directories Creation
id: 555cc358-bf16-4e05-9b3a-0f89c73b7261
status: experimental
description: The following analytic detects suspicious creation of hidden files and directories, which may indicate an attacker's
  attempt to conceal malicious activities or unauthorized data. Hidden files and directories are often used to evade detection
  by security tools and administrators, providing a stealthy means for storing malware, logs, or sensitive information. By
  monitoring for unusual or unauthorized creation of hidden files and directories, this analytic helps identify potential
  attempts to hide or unauthorized creation of hidden files and directories, this analytic helps identify potential attempts
  to hide malicious operations, enabling security teams to uncover and address hidden threats effectively.
references:
- https://research.splunk.com/555cc358-bf16-4e05-9b3a-0f89c73b7261/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1083
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    CommandLine:
    - '*touch *'
    - '*mkdir *'
    - '*vim *'
    - '*vi *'
    - '*nano *'
  sel2:
    CommandLine:
    - '* ./.*'
    - '* .*'
    - '*/.*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1083/linux_auditd_hidden_file/auditd_execve_hidden_file.log
