title: Linux Busybox Privilege Escalation
id: 387c4e78-f4a4-413d-ad44-e9f7bc4642c9
status: experimental
description: The following analytic detects the execution of BusyBox with sudo privileges, which can lead to privilege escalation
  on Linux systems. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events
  where BusyBox is executed with both 'sh' and 'sudo' commands. This activity is significant because it indicates a user may
  be attempting to gain root access, bypassing standard security controls. If confirmed malicious, this could allow an attacker
  to execute arbitrary commands as root, leading to full system compromise and potential persistence within the environment.
references:
- https://research.splunk.com/387c4e78-f4a4-413d-ad44-e9f7bc4642c9/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*busybox*'
  sel2:
    CommandLine: '*sh*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/busybox/sysmon_linux.log
