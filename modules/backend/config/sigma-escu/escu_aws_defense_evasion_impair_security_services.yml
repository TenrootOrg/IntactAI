title: AWS Defense Evasion Impair Security Services
id: b28c4957-96a6-47e0-a965-6c767aac1458
status: experimental
description: The following analytic detects attempts to impair or disable AWS security services by monitoring specific deletion
  operations across GuardDuty, AWS WAF (classic and v2), CloudWatch, Route 53, and CloudWatch Logs. These actions include
  deleting detectors, rule groups, IP sets, web ACLs, logging configurations, alarms, and log streams. Adversaries may perform
  such operations to evade detection or remove visibility from defenders. By explicitly pairing eventName values with their
  corresponding eventSource services, this detection reduces noise and ensures that only security-related deletions are flagged.
  It leverages CloudTrail logs to identify specific API calls like "DeleteLogStream" and "DeleteDetector." This activity is
  significant because it indicates potential efforts to disable security monitoring and evade detection. If confirmed malicious,
  this could allow attackers to operate undetected, escalate privileges, or exfiltrate data without triggering security alerts,
  severely comprom
references:
- https://research.splunk.com/b28c4957-96a6-47e0-a965-6c767aac1458/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Gowthamaraj Rajendran, Splunk, PashFW, Github Community
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: DeleteDetector
  sel2:
    eventSource: guardduty.amazonaws.com
  sel3:
    eventName:
    - DeleteIPSet
    - DeleteWebACL
    - DeleteRuleGroup
    - DeleteRule
  sel4:
    eventSource:
    - guardduty.amazonaws.com
    - wafv2.amazonaws.com
    - waf.amazonaws.com
  sel5:
    eventName: DeleteLoggingConfiguration
  sel6:
    eventSource:
    - wafv2.amazonaws.com
    - waf.amazonaws.com
    - route53.amazonaws.com
  condition: (((sel1 and sel2) or (sel3 and sel4)) or (sel5 and sel6))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/aws_delete_security_services/aws_cloudtrail_events.json
