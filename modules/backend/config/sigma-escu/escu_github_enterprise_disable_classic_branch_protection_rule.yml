title: GitHub Enterprise Disable Classic Branch Protection Rule
id: 372176ba-450c-4abd-9b86-419bb44c1b76
status: experimental
description: The following analytic detects when classic branch protection rules are disabled in GitHub Enterprise. The detection
  monitors GitHub Enterprise audit logs for branch protection removal events by tracking actor details, repository information,
  and associated metadata. For a SOC, identifying disabled branch protection is critical as it could indicate attempts to
  bypass code review requirements and security controls. Branch protection rules are essential security controls that enforce
  code review, prevent force pushes, and maintain code quality. Disabling these protections could allow malicious actors to
  directly push unauthorized code changes or backdoors to protected branches. The impact of disabled branch protection includes
  potential code tampering, bypass of security reviews, introduction of vulnerabilities or malicious code, and compromise
  of software supply chain integrity. This activity could be part of a larger attack chain where an adversary first disables
  security controls befo
