title: Windows Audit Policy Disabled via Legacy Auditpol
id: d2cef287-c2b7-4496-a609-7a548c1e27f9
status: experimental
description: The following analytic identifies the execution of the legacy `auditpol.exe` included with the Windows 2000 Resource
  Kit Tools, with the "/disable" command-line argument or one of the allowed category flags and the "none" option, in order
  to disable a specific logging category from the audit policy. It leverages data from Endpoint Detection and Response (EDR)
  agents, focusing on process names and command-line executions. This activity can be significant as it indicates potential
  defense evasion by adversaries or Red Teams, aiming to limit data that can be leveraged for detections and audits. If confirmed
  malicious, this behavior could allow attackers to bypass defenses, and plan further attacks, potentially leading to full
  machine compromise or lateral movement.
references:
- https://research.splunk.com/d2cef287-c2b7-4496-a609-7a548c1e27f9/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Splunk
tags:
- attack.t1685.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\auditpol.exe'
  sel2:
    OriginalFileName: AUDITPOL.EXE
  sel3:
    CommandLine: '*/disable'
  sel4:
    CommandLine:
    - '*/system:none*'
    - '*/logon:none*'
    - '*/object:none*'
    - '*/privilege:none*'
    - '*/process:none*'
    - '*/policy:none*'
    - '*/sam:none*'
  condition: (((sel1 or sel2) and sel3) or sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.002/auditpol_tampering/auditpol_tampering_sysmon.log
