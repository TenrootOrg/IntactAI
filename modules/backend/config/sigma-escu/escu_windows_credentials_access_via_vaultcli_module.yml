title: Windows Credentials Access via VaultCli Module
id: c0d89118-3f89-4cd7-8140-1f39e7210681
status: experimental
description: The following analytic detects potentially abnormal interactions with VaultCLI.dll, particularly those initiated
  by processes located in publicly writable Windows folder paths. The VaultCLI.dll module allows processes to extract credentials
  from the Windows Credential Vault. It was seen being abused by information stealers such as Meduza. The analytic monitors
  suspicious API calls, unauthorized credential access patterns, and anomalous process behaviors indicative of malicious activity.
  By leveraging a combination of signature-based detection and behavioral analysis, it effectively flags attempts to misuse
  the vault for credential theft, enabling swift response to protect sensitive user data and ensure system security.
references:
- https://research.splunk.com/c0d89118-3f89-4cd7-8140-1f39e7210681/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1555.004
logsource:
  product: windows
  service: sysmon
  category: image_load
detection:
  sel1:
    EventID: '7'
  sel2:
    ImageLoaded: '*\\vaultcli.dll'
  sel3:
    Image:
    - '*\\windows\\fonts\\*'
    - '*\\windows\\temp\\*'
    - '*\\users\\public\\*'
    - '*\\windows\\debug\\*'
    - '*\\Users\\Administrator\\Music\\*'
    - '*\\Windows\\servicing\\*'
    - '*\\Users\\Default\\*'
    - '*Recycle.bin*'
    - '*\\Windows\\Media\\*'
    - \\Windows\\repair\\*
    - '*\\appdata\\local\\temp\\*'
    - '*\\PerfLogs\\*'
    - '*:\\temp\\*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.004/vaultcli_creds/vaultcli.log
