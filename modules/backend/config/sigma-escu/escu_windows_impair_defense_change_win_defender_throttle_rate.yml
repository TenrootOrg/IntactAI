title: Windows Impair Defense Change Win Defender Throttle Rate
id: f7da5fca-9261-43de-a4d0-130dad1e4f4d
status: experimental
description: The following analytic detects modifications to the ThrottleDetectionEventsRate registry setting in Windows Defender.
  It leverages data from the Endpoint.Registry datamodel to identify changes in the registry path related to Windows Defender's
  event logging rate. This activity is significant because altering the ThrottleDetectionEventsRate can reduce the frequency
  of logged detection events, potentially masking malicious activities. If confirmed malicious, this could allow an attacker
  to evade detection by decreasing the visibility of security events, thereby hindering incident response and forensic investigations.
references:
- https://research.splunk.com/f7da5fca-9261-43de-a4d0-130dad1e4f4d/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows Defender\\NIS\\Consumers\\IPS\\ThrottleDetectionEventsRate'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
