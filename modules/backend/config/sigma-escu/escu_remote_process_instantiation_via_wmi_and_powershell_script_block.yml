title: Remote Process Instantiation via WMI and PowerShell Script Block
id: 2a048c14-4634-11ec-a618-3e22fbd008af
status: experimental
description: The following analytic detects the execution of the `Invoke-WmiMethod` commandlet with parameters used to start
  a process on a remote endpoint via WMI, leveraging PowerShell Script Block Logging (EventCode=4104). This method identifies
  specific script block text patterns associated with remote process instantiation. This activity is significant as it may
  indicate lateral movement or remote code execution attempts by adversaries. If confirmed malicious, this could allow attackers
  to execute arbitrary code on remote systems, potentially leading to further compromise and persistence within the network.
references:
- https://research.splunk.com/2a048c14-4634-11ec-a618-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1047
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Invoke-WmiMethod*'
  sel3:
    ScriptBlockText: '*-CN*'
  sel4:
    ScriptBlockText: '*-ComputerName*'
  sel5:
    ScriptBlockText: '*-Class Win32_Process*'
  sel6:
    ScriptBlockText: '*-Name create*'
  condition: (sel1 and sel2 and (sel3 or sel4) and sel5 and sel6)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1047/lateral_movement/wmi_remote_process_powershell.log
