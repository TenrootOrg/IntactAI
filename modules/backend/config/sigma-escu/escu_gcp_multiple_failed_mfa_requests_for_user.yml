title: GCP Multiple Failed MFA Requests For User (counted event)
id: cbb3cb84-c06f-4393-adcc-5cb6195621f1-base
status: experimental
description: The following analytic detects multiple failed multi-factor authentication (MFA) requests for a single user within
  a Google Cloud Platform (GCP) tenant. It triggers when 10 or more MFA prompts fail within a 5-minute window, using Google
  Workspace login failure events. This behavior is significant as it may indicate an adversary attempting to bypass MFA by
  bombarding the user with repeated authentication requests. If confirmed malicious, this activity could lead to unauthorized
  access, allowing attackers to compromise accounts and potentially escalate privileges within the GCP environment.
references:
- https://research.splunk.com/cbb3cb84-c06f-4393-adcc-5cb6195621f1/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1078.004
- attack.t1586.003
- attack.t1621
logsource:
  product: google_workspace
  service: google_workspace.admin
detection:
  sel1:
    event.name: login_failure
  sel2:
    login_challenge_method:
    - '*backup_code*'
    - '*google_authenticator*'
    - '*google_prompt*'
    - '*idv_any_phone*'
    - '*idv_preregistered_phone*'
    - '*internal_two_factor*'
    - '*knowledge_employee_id*'
    - '*knowledge_preregistered_email*'
    - '*login_location*'
    - '*knowledge_preregistered_phone*'
    - '*offline_otp*'
    - '*security_key*'
    - '*security_key_otp*'
  condition: (sel1 and sel2)
level: informational
name: escu_base_gcp_multiple_failed_mfa_requests_for_user
