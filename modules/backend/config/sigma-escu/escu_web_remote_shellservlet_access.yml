title: Web Remote ShellServlet Access
id: c2a332c3-24a2-4e24-9455-0e80332e6746
status: experimental
description: The following analytic identifies attempts to access the Remote ShellServlet on a web server, specifically targeting
  Confluence servers vulnerable to CVE-2023-22518 and CVE-2023-22515. It leverages web data to detect URLs containing "*plugins/servlet/com.jsos.shell/*"
  with a status code of 200. This activity is significant as it is commonly associated with web shells and other malicious
  behaviors, potentially leading to unauthorized command execution. If confirmed malicious, attackers could gain remote code
  execution capabilities, compromising the server and potentially the entire network.
references:
- https://research.splunk.com/c2a332c3-24a2-4e24-9455-0e80332e6746/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri: '*plugins/servlet/com.jsos.shell/*'
  sel2:
    sc-status: '200'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/confluence/nginx_shellservlet.log
