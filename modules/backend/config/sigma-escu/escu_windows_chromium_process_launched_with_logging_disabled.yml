title: Windows Chromium Process Launched with Logging Disabled
id: d31de944-4e61-468f-9154-e50690f0e99e
status: experimental
description: 'The following analytic detects instances of Chromium-based browser processes on Windows launched with logging
  disabled via command-line arguments such as --disable-logging and --disable-logging-redirect.

  The --disable-logging flag forces browser logging to be disabled, while --disable-logging-redirect disables log redirection
  and is commonly used for testing or debugging scenarios.

  Logging is enabled by default in Chromium debug builds, making these flags more likely to appear in debug or development
  environments.

  While these options may be legitimately used by automation frameworks, debugging workflows, or isolated testing environments,
  they are also leveraged by malware and malicious scripts to evade security monitoring.

  Analysts should review the parent process, full command-line parameters, and execution context to determine whether the
  behavior is expected or potentially suspicious.'
references:
- https://research.splunk.com/d31de944-4e61-468f-9154-e50690f0e99e/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1497
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image:
    - '*\\Chrome.exe'
    - '*\\Brave.exe'
    - '*\\Opera.exe'
    - '*\\Vivaldi.exe'
    - '*\\msedge.exe'
  sel2:
    CommandLine: '*--disable-logging*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1497/browser_disable_logs/chrome_disable_log.log
