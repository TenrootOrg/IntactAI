title: Detect SharpHound Command-Line Arguments
id: a0bdd2f6-c2ff-11eb-b918-acde48001122
status: experimental
description: The following analytic detects the execution of SharpHound command-line arguments, specifically `-collectionMethod`
  and `invoke-bloodhound`. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names
  and command-line executions. This activity is significant as SharpHound is commonly used for Active Directory enumeration,
  which can be a precursor to lateral movement or privilege escalation. If confirmed malicious, this activity could allow
  an attacker to map out the network, identify high-value targets, and plan further attacks, potentially compromising sensitive
  information and critical systems.
references:
- https://research.splunk.com/a0bdd2f6-c2ff-11eb-b918-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1069.001
- attack.t1069.002
- attack.t1087.001
- attack.t1087.002
- attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine:
    - '*-collectionMethod*'
    - '*invoke-bloodhound*'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/sharphound/windows-sysmon.log
