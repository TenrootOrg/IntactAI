title: Windows Masquerading Msdtc Process
id: 238f3a07-8440-480b-b26f-462f41d9a47c
status: experimental
description: The following analytic identifies the execution of msdtc.exe with specific command-line parameters (-a or -b),
  which are indicative of the PlugX malware. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process names and command-line arguments. This activity is significant because PlugX uses these parameters to
  masquerade its malicious operations within legitimate processes, making it harder to detect. If confirmed malicious, this
  behavior could allow attackers to gain unauthorized access, exfiltrate data, and conduct espionage, severely compromising
  the affected system.
references:
- https://research.splunk.com/238f3a07-8440-480b-b26f-462f41d9a47c/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1036
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\msdtc.exe'
  sel2:
    CommandLine: '*msdtc.exe*'
  sel3:
    CommandLine:
    - '* -a*'
    - '* -b*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1036/msdtc_process_param/msdtc_a_sysmon.log
