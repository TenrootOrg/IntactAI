title: Set Default PowerShell Execution Policy To Unrestricted or Bypass
id: c2590137-0b08-4985-9ec5-6ae23d92f63d
status: experimental
description: The following analytic detects changes to the PowerShell ExecutionPolicy in the registry to "Unrestricted" or
  "Bypass." It leverages data from Endpoint Detection and Response (EDR) agents, focusing on registry modifications under
  the path *Software\Microsoft\Powershell\1\ShellIds\Microsoft.PowerShell*. This activity is significant because setting the
  ExecutionPolicy to these values can allow the execution of potentially malicious scripts without restriction. If confirmed
  malicious, this could enable an attacker to execute arbitrary code, leading to further compromise of the system and potential
  escalation of privileges.
references:
- https://research.splunk.com/c2590137-0b08-4985-9ec5-6ae23d92f63d/
author: Splunk Security Content (Apache-2.0), Steven Dick, Patrick Bareiss, Splunk
tags:
- attack.t1059.001
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*Software\\Microsoft\\Powershell\\1\\ShellIds\\Microsoft.PowerShell*'
  sel2:
    TargetObject: '*\\ExecutionPolicy'
  sel3:
    Details:
    - '* (Unrestricted)'
    - Unrestricted
  sel4:
    Details:
    - '* (Bypass)'
    - Bypass
  condition: (sel1 and sel2 and (sel3 or sel4))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_execution_policy/windows-sysmon.log
