title: O365 Compliance Content Search Exported
id: 2ce9f31d-ab4f-4179-b2b7-c77a9652e1d8
status: experimental
description: The following analytic identifies when the results of a content search within the Office 365 Security and Compliance
  Center are exported. It uses the SearchExported operation from the SecurityComplianceCenter workload in the o365_management_activity
  data source. This activity is significant because exporting search results can involve sensitive or critical organizational
  data, potentially leading to data exfiltration. If confirmed malicious, an attacker could gain access to and exfiltrate
  sensitive information, posing a severe risk to the organization's data security and compliance posture.
references:
- https://research.splunk.com/2ce9f31d-ab4f-4179-b2b7-c77a9652e1d8/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1114.002
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: SecurityComplianceCenter
  sel2:
    Operation: SearchExported
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1114.002/o365_compliance_content_search_exported/o365_compliance_content_search_exported.log
