title: Get DomainUser with PowerShell Script Block
id: 61994268-04f4-11ec-865c-acde48001122
status: experimental
description: The following analytic detects the execution of the `Get-DomainUser` cmdlet using PowerShell Script Block Logging
  (EventCode=4104). This cmdlet is part of PowerView, a tool often used for domain enumeration. The detection leverages PowerShell
  operational logs to identify instances where this command is executed. Monitoring this activity is crucial as it may indicate
  an adversary's attempt to gather information about domain users, which is a common step in Active Directory Discovery. If
  confirmed malicious, this activity could lead to further reconnaissance and potential exploitation of domain resources.
references:
- https://research.splunk.com/61994268-04f4-11ec-865c-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1087.002
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-DomainUser*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1087.002/AD_discovery/windows-powershell-xml.log
