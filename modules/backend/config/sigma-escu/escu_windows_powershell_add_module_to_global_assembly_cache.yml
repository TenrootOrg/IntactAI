title: Windows PowerShell Add Module to Global Assembly Cache
id: 3fc16961-97e5-4a5b-a079-e4ab0d9763eb
status: experimental
description: The following analytic detects the addition of a DLL to the Windows Global Assembly Cache (GAC) using PowerShell.
  It leverages PowerShell Script Block Logging to identify commands containing "system.enterpriseservices.internal.publish".
  This activity is significant because adding a DLL to the GAC allows it to be shared across multiple applications, potentially
  enabling an adversary to execute malicious code system-wide. If confirmed malicious, this could lead to widespread code
  execution, privilege escalation, and persistent access across the operating system, posing a severe security risk.
references:
- https://research.splunk.com/3fc16961-97e5-4a5b-a079-e4ab0d9763eb/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1505.004
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*system.enterpriseservices.internal.publish*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1505.004/pwsh_publish_powershell.log
