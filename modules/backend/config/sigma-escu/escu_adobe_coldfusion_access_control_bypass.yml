title: Adobe ColdFusion Access Control Bypass
id: d6821c0b-fcdc-4c95-a77f-e10752fae41a
status: experimental
description: 'The following analytic detects potential exploitation attempts against Adobe ColdFusion vulnerabilities CVE-2023-29298
  and CVE-2023-26360.

  It monitors requests to specific ColdFusion Administrator endpoints, especially those with an unexpected additional forward
  slash, using the Web datamodel.

  This activity is significant for a SOC as it indicates attempts to bypass access controls, which can lead to unauthorized
  access to ColdFusion administration endpoints.

  If confirmed malicious, this could result in data theft, brute force attacks, or further exploitation of other vulnerabilities,
  posing a serious security risk to the environment.'
references:
- https://research.splunk.com/d6821c0b-fcdc-4c95-a77f-e10752fae41a/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri:
    - '*//CFIDE/adminapi*'
    - '*//CFIDE/administrator*'
    - '*//CFIDE/componentutils*'
    - '*//CFIDE/main*'
    - '*//CFIDE/restplay*'
    - '*//CFIDE/servermanager*'
    - '*//CFIDE/wizards*'
    - '*//restplay*'
  sel2:
    sc-status: '200'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/adobe/coldfusion_cve_2023_29298.log
