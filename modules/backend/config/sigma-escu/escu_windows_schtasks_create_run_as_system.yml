title: Windows Schtasks Create Run As System
id: 41a0e58e-884c-11ec-9976-acde48001122
status: experimental
description: The following analytic detects the creation of a new scheduled task using Schtasks.exe to run as the SYSTEM user.
  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions and
  process details. This activity is significant as it often indicates an attempt to gain elevated privileges or maintain persistence
  within the environment. If confirmed malicious, an attacker could execute code with SYSTEM-level privileges, potentially
  leading to data theft, ransomware deployment, or further system compromise. Immediate investigation and mitigation are crucial
  to prevent further damage.
references:
- https://research.splunk.com/41a0e58e-884c-11ec-9976-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\schtasks.exe'
  sel2:
    OriginalFileName: schtasks.exe
  sel3:
    CommandLine: '*/create *'
  sel4:
    CommandLine: '*/ru *'
  sel5:
    CommandLine: '*system*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1053.005/schtask_system/windows-sysmon.log
