title: AWS Credential Access Failed Login
id: a19b354d-0d7f-47f3-8ea6-1a7c36434968
status: experimental
description: The following analytic identifies unsuccessful login attempts to the AWS Management Console using a specific
  user identity. It leverages AWS CloudTrail logs to detect failed authentication events associated with the AWS ConsoleLogin
  action. This activity is significant for a SOC because repeated failed login attempts may indicate a brute force attack
  or unauthorized access attempts. If confirmed malicious, an attacker could potentially gain access to AWS account services
  and resources, leading to data breaches, resource manipulation, or further exploitation within the AWS environment.
references:
- https://research.splunk.com/a19b354d-0d7f-47f3-8ea6-1a7c36434968/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Bhavin Patel, Splunk
tags:
- attack.t1110.001
- attack.t1586.003
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: ConsoleLogin
  sel2:
    errorMessage: Failed authentication
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1110.001/aws_login_failure/aws_cloudtrail_events.json
