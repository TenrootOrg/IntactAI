title: DNS Exfiltration Using Nslookup App
id: 2452e632-9e0d-11eb-bacd-acde48001122
status: experimental
description: The following analytic identifies potential DNS exfiltration using the nslookup application. It detects specific
  command-line parameters such as query type (TXT, A, AAAA) and retry options, which are commonly used by attackers to exfiltrate
  data. The detection leverages Endpoint Detection and Response (EDR) telemetry, focusing on process execution logs. This
  activity is significant as it may indicate an attempt to communicate with a Command and Control (C2) server or exfiltrate
  sensitive data. If confirmed malicious, this could lead to data breaches and unauthorized access to critical information.
references:
- https://research.splunk.com/2452e632-9e0d-11eb-bacd-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk, Wouter Jansen
tags:
- attack.t1048
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\nslookup.exe'
  sel2:
    CommandLine: '*-querytype=*'
  sel3:
    CommandLine: '*-qt=*'
  sel4:
    CommandLine: '*-q=*'
  sel5:
    CommandLine: '*-type=*'
  sel6:
    CommandLine: '*-retry=*'
  condition: (sel1 and ((((sel2 or sel3) or sel4) or sel5) or sel6))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1048.003/nslookup_exfil/windows-sysmon.log
