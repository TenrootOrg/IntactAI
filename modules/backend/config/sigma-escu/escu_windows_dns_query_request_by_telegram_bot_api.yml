title: Windows DNS Query Request by Telegram Bot API
id: 86f66f44-94d9-412d-a71d-5d8ed0fef72e
status: experimental
description: The following analytic detects the execution of a DNS query by a process to the associated Telegram API domain,
  which could indicate access via a Telegram bot commonly used by malware for command and control (C2) communications. By
  monitoring DNS queries related to Telegram's infrastructure, the detection identifies potential attempts to establish covert
  communication channels between a compromised system and external malicious actors. This behavior is often observed in cyberattacks
  where Telegram bots are used to receive commands or exfiltrate data, making it a key indicator of suspicious or malicious
  activity within a network.
references:
- https://research.splunk.com/86f66f44-94d9-412d-a71d-5d8ed0fef72e/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1071.004
- attack.t1102.002
logsource:
  product: windows
  service: sysmon
  category: dns_query
detection:
  sel1:
    EventID: '22'
  sel2:
    query: api.telegram.org
  sel3:
    Image: '*\\telegram.exe'
  condition: (sel1 and sel2 and not sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1102.002/telegram_api_dns/telegram_dns.log
