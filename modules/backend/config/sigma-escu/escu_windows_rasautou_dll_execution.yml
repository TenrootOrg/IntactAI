title: Windows Rasautou DLL Execution
id: 6f42b8be-8e96-11ec-ad5a-acde48001122
status: experimental
description: The following analytic detects the execution of an arbitrary DLL by the Windows Remote Auto Dialer (rasautou.exe).
  This behavior is identified by analyzing process creation events where rasautou.exe is executed with specific command-line
  arguments. This activity is significant because it leverages a Living Off The Land Binary (LOLBin) to execute potentially
  malicious code, bypassing traditional security controls. If confirmed malicious, this technique could allow an attacker
  to execute arbitrary code, potentially leading to system compromise, privilege escalation, or persistent access within the
  environment.
references:
- https://research.splunk.com/6f42b8be-8e96-11ec-ad5a-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1055.001
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\rasautou.exe'
  sel2:
    CommandLine: '* -d *'
  sel3:
    CommandLine: '* -p *'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1055.001/rasautou/windows-sysmon.log
