title: SLUI Spawning a Process
id: 879c4330-b3e0-11eb-b1b1-acde48001122
status: experimental
description: The following analytic detects the Microsoft Software Licensing User Interface Tool (`slui.exe`) spawning a child
  process. This behavior is identified using Endpoint Detection and Response (EDR) telemetry, focusing on process creation
  events where `slui.exe` is the parent process. This activity is significant because `slui.exe` should not typically spawn
  child processes, and doing so may indicate a UAC bypass attempt, leading to elevated privileges. If confirmed malicious,
  an attacker could leverage this to execute code with elevated privileges, potentially compromising the system's security
  and gaining unauthorized access.
references:
- https://research.splunk.com/879c4330-b3e0-11eb-b1b1-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\slui.exe'
  sel2:
    Image: '*\\slui.exe'
  condition: (sel1 and not (sel2))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548.002/slui/windows-sysmon.log
