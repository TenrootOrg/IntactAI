title: Windows Credentials from Password Stores Chrome Extension Access
id: 2e65afe0-9a75-4487-bd87-ada9a9f1b9af
status: experimental
description: 'The following analytic detects non-Chrome processes attempting to access the Chrome extensions file.

  It leverages Windows Security Event logs, specifically event code 4663, to identify this behavior.

  This activity is significant because adversaries may exploit this file to extract sensitive information from the Chrome
  browser, posing a security risk.

  If confirmed malicious, this could lead to unauthorized access to stored credentials and other sensitive data, potentially
  compromising the security of the affected system and broader network.'
references:
- https://research.splunk.com/2e65afe0-9a75-4487-bd87-ada9a9f1b9af/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1012
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ObjectName: '*\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\Local Extension Settings\\*'
  sel3:
    ProcessName:
    - '*:\\Windows\\explorer.exe'
    - '*\\AppData\\Local\\Google\\Chrome Beta\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome Dev\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome SxS\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome Unstable\\Application\\chrome.exe'
    - '*\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe'
  condition: (sel1 and sel2 and not (sel3))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/redline/browser_ext_access/security-ext-raw.log
