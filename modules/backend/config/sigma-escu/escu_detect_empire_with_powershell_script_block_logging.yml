title: Detect Empire with PowerShell Script Block Logging
id: bc1dc6b8-c954-11eb-bade-acde48001122
status: experimental
description: The following analytic detects suspicious PowerShell execution indicative of PowerShell-Empire activity. It leverages
  PowerShell Script Block Logging (EventCode=4104) to capture and analyze commands sent to PowerShell, specifically looking
  for patterns involving `system.net.webclient` and base64 encoding. This behavior is significant as it often represents initial
  stagers used by PowerShell-Empire, a known post-exploitation framework. If confirmed malicious, this activity could allow
  attackers to download and execute additional payloads, leading to potential code execution, data exfiltration, or further
  compromise of the affected system.
references:
- https://research.splunk.com/bc1dc6b8-c954-11eb-bade-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*system.net.webclient*'
  sel3:
    ScriptBlockText: '*frombase64string*'
  condition: (sel1 and (sel2 and sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/empire.log
