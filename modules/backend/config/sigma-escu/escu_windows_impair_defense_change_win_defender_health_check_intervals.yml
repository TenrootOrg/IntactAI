title: Windows Impair Defense Change Win Defender Health Check Intervals
id: 5211c260-820e-4366-b983-84bbfb5c263a
status: experimental
description: The following analytic detects modifications to the Windows registry that change the health check interval of
  Windows Defender. It leverages data from the Endpoint datamodel, specifically monitoring changes to the "ServiceKeepAlive"
  registry path with a value of "0x00000001". This activity is significant because altering Windows Defender settings can
  impair its ability to perform timely health checks, potentially leaving the system vulnerable. If confirmed malicious, this
  could allow an attacker to disable or delay security scans, increasing the risk of undetected malware or other malicious
  activities.
references:
- https://research.splunk.com/5211c260-820e-4366-b983-84bbfb5c263a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\Windows Defender\\ServiceKeepAlive'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/disable-windows-security-defender-features/windefender-bypas-2-sysmon.log
