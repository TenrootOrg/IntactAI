title: Linux APT Privilege Escalation
id: 4d5a05fa-77d9-4fd0-af9c-05704f9f9a88
status: experimental
description: The following analytic detects the use of the Advanced Package Tool (APT) or apt-get with elevated privileges
  via sudo on Linux systems. It leverages Endpoint Detection and Response (EDR) telemetry to identify processes where APT
  commands are executed with sudo rights. This activity is significant because it indicates a user can run system commands
  as root, potentially leading to unauthorized root shell access. If confirmed malicious, this could allow an attacker to
  escalate privileges, execute arbitrary commands, and gain full control over the affected system, posing a severe security
  risk.
references:
- https://research.splunk.com/4d5a05fa-77d9-4fd0-af9c-05704f9f9a88/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Bhavin Patel, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*apt*'
  sel2:
    CommandLine: '*APT::Update::Pre-Invoke::*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/apt/sysmon_linux.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/apt_get/cisco_isovalent.log
