title: Windows Certutil Root Certificate Addition
id: e9926391-ec0c-4bad-8a95-e450dbf6aae4
status: experimental
description: 'The following analytic detects the use of certutil.exe to add a certificate to the Root certificate store using
  the "-addstore" flag.

  In this case, the certificate is loaded from a temporary file path (e.g., %TEMP%) or other uncommon locations (e.g. C:\\Users\\Public\\),
  which is highly suspicious and uncommon in legitimate administrative activity.

  This behavior may indicate an adversary is installing a malicious root certificate to intercept HTTPS traffic, impersonate
  trusted entities, or bypass security controls.

  The use of flags such as -f (force) and -Enterprise, combined with loading .tmp files from user-writable locations, is consistent
  with post-exploitation activity seen in credential theft and adversary-in-the-middle (AiTM) attacks.

  This should be investigated immediately, especially if correlated with unauthorized privilege use or prior certificate modifications.

  You should monitor when new certificates are added to the root store because this store is what your system uses t'
references:
- https://research.splunk.com/e9926391-ec0c-4bad-8a95-e450dbf6aae4/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Nasreddine Bencherchali, Splunk
tags:
- attack.t1587.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\certutil.exe'
  sel2:
    OriginalFileName: CertUtil.exe
  sel3:
    CommandLine: '*-addstore*'
  sel4:
    CommandLine: '*root*'
  sel5:
    CommandLine:
    - '*:\\PerfLogs\\*'
    - '*:\\Windows\\Temp\\*'
    - '*\\AppData\\Local\\Temp\\*'
    - '*\\ProgramData\\*'
    - '*\\Users\\Public\\*'
    - '*%AppData%*'
    - '*%Public%*'
    - '*%Temp%*'
    - '*%tmp%*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1587.003/add_store_cert/addstore_cert.log
