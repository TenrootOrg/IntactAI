title: Ivanti EPMM Remote Unauthenticated API Access CVE-2023-35082
id: e03edeba-4942-470c-a664-27253f3ad351
status: experimental
description: 'The following analytic detects potential unauthorized access attempts exploiting CVE-2023-35082 within Ivanti''s
  software products.

  It identifies access to the specific URI path /mifs/asfV3/api/v2/ with an HTTP 200 response code in web access logs, indicating
  successful unauthorized access.

  This activity is significant for a SOC as it highlights potential security breaches that could lead to unauthorized data
  access or system modifications.

  If confirmed malicious, an attacker could gain unbridled access to sensitive organizational data or modify systems maliciously,
  posing severe security risks.'
references:
- https://research.splunk.com/e03edeba-4942-470c-a664-27253f3ad351/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
- attack.t1133
logsource:
  category: web
detection:
  sel1:
    c-uri: '*/mifs/asfV3/api/v2/*'
  sel2:
    sc-status: '200'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/ivanti/suricata_ivanti_CVE202335082.log
