title: Windows Multiple Accounts Disabled (counted event)
id: 5d93894e-befa-4429-abde-7fc541020b7b-base
status: experimental
description: The following analytic identifies instances where more than five unique Windows accounts are disabled within
  a 10-minute window, as indicated by Event Code 4725 in the Windows Security Event Log. It leverages the wineventlog_security
  dataset, grouping data into 10-minute segments and tracking the count and distinct count of TargetUserName. This behavior
  is significant as it may indicate internal policy breaches or an external attacker's attempt to disrupt operations. If confirmed
  malicious, this activity could lead to widespread account lockouts, hindering user access and potentially disrupting business
  operations.
references:
- https://research.splunk.com/5d93894e-befa-4429-abde-7fc541020b7b/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1098
- attack.t1078
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4725'
  sel2:
    status: success
  condition: (sel1 and sel2)
level: informational
name: escu_base_windows_multiple_accounts_disabled
