title: GetDomainComputer with PowerShell Script Block
id: f64da023-b988-4775-8d57-38e512beb56e
status: experimental
description: The following analytic detects the execution of the `Get-DomainComputer` commandlet using PowerShell Script Block
  Logging (EventCode=4104). This commandlet is part of PowerView, a tool often used for enumerating domain computers within
  Windows environments. The detection leverages script block text analysis to identify this specific command. Monitoring this
  activity is crucial as it can indicate an adversary's attempt to gather information about domain computers, which is a common
  step in Active Directory reconnaissance. If confirmed malicious, this activity could lead to further network enumeration
  and potential lateral movement within the domain.
references:
- https://research.splunk.com/f64da023-b988-4775-8d57-38e512beb56e/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1018
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-DomainComputer*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/sbl_xml.log
