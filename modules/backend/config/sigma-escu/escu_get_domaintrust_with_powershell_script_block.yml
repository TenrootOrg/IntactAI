title: Get-DomainTrust with PowerShell Script Block
id: 89275e7e-0548-11ec-bf75-acde48001122
status: experimental
description: The following analytic detects the execution of the Get-DomainTrust command from PowerView using PowerShell Script
  Block Logging (EventCode=4104). This method captures the full command sent to PowerShell, allowing for detailed inspection.
  Identifying this activity is significant because it may indicate an attempt to gather domain trust information, which is
  often a precursor to lateral movement or privilege escalation. If confirmed malicious, this activity could enable an attacker
  to map trust relationships within the domain, potentially leading to further exploitation and compromise of additional systems.
references:
- https://research.splunk.com/89275e7e-0548-11ec-bf75-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1482
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*get-domaintrust*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_script_block_logging/domaintrust.log
