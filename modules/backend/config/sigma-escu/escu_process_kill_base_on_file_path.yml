title: Process Kill Base On File Path
id: 5ffaa42c-acdb-11eb-9ad3-acde48001122
status: experimental
description: The following analytic detects the use of `wmic.exe` with the `delete` command to remove an executable path.
  This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names, parent processes,
  and command-line executions. This activity is significant because it often indicates the initial stages of an adversary
  setting up malicious activities, such as cryptocurrency mining, on an endpoint. If confirmed malicious, this behavior could
  allow an attacker to disable security tools or other critical processes, facilitating further compromise and persistence
  within the environment.
references:
- https://research.splunk.com/5ffaa42c-acdb-11eb-9ad3-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\wmic.exe'
  sel2:
    OriginalFileName: wmic.exe
  sel3:
    CommandLine: '*process*'
  sel4:
    CommandLine: '*executablepath*'
  sel5:
    CommandLine: '*delete*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/xmrig_miner/windows-sysmon.log
