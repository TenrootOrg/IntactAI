title: Windows Process Injection Wermgr Child Process
id: 360ae6b0-38b5-4328-9e2b-bc9436cddb17
status: experimental
description: The following analytic identifies a suspicious instance of wermgr.exe spawning a child process unrelated to error
  or fault handling. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing on process
  relationships and command-line executions. This activity is significant as it can indicate Qakbot malware, which injects
  malicious code into wermgr.exe to evade detection and execute malicious actions. If confirmed malicious, this behavior could
  allow an attacker to conduct reconnaissance, execute arbitrary code, and persist within the network, posing a severe security
  risk.
references:
- https://research.splunk.com/360ae6b0-38b5-4328-9e2b-bc9436cddb17/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\wermgr.exe'
  sel2:
    Image:
    - '*\\WerFaultSecure.exe'
    - '*\\wermgr.exe'
    - '*\\WerFault.exe'
  condition: (sel1 and not (sel2))
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/qakbot/qbot_wermgr/sysmon_wermgr.log
