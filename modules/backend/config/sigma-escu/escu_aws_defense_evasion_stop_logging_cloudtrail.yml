title: AWS Defense Evasion Stop Logging Cloudtrail
id: 8a2f3ca2-4eb5-4389-a549-14063882e537
status: experimental
description: The following analytic detects `StopLogging` events in AWS CloudTrail logs. It leverages CloudTrail event data
  to identify when logging is intentionally stopped, excluding console-based actions and focusing on successful attempts.
  This activity is significant because adversaries may stop logging to evade detection and operate stealthily within the compromised
  environment. If confirmed malicious, this action could allow attackers to perform further activities without being logged,
  hindering incident response and forensic investigations, and potentially leading to unauthorized access or data exfiltration.
references:
- https://research.splunk.com/8a2f3ca2-4eb5-4389-a549-14063882e537/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventName: StopLogging
  sel2:
    eventSource: cloudtrail.amazonaws.com
  sel3:
    userAgent: console.amazonaws.com
  sel4:
    errorCode: null
  condition: (sel1 and sel2 and not sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/stop_delete_cloudtrail/aws_cloudtrail_events.json
