title: Azure AD Service Principal New Client Credentials
id: e3adc0d3-9e4b-4b5d-b662-12cec1adff2a
status: experimental
description: The following analytic detects the addition of new credentials to Service Principals and Applications in Azure
  AD. It leverages Azure AD AuditLogs, specifically monitoring the "Update application*Certificates and secrets management"
  operation. This activity is significant as it may indicate an adversary attempting to maintain persistent access or escalate
  privileges within the Azure environment. If confirmed malicious, attackers could use these new credentials to log in as
  the service principal, potentially compromising sensitive accounts and resources, leading to unauthorized access and control
  over the Azure environment.
references:
- https://research.splunk.com/e3adc0d3-9e4b-4b5d-b662-12cec1adff2a/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Gowthamaraj Rajendran, Splunk
tags:
- attack.t1098.001
logsource:
  product: azure
detection:
  sel1:
    category: AuditLogs
  sel2:
    operationName: 'Update application*Certificates and secrets management '
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098.001/azure_ad_service_principal_credentials/azure-audit.log
