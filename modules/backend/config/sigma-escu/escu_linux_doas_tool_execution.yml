title: Linux Doas Tool Execution
id: d5a62490-6e09-11ec-884e-acde48001122
status: experimental
description: The following analytic detects the execution of the 'doas' tool on a Linux host. This tool allows standard users
  to perform tasks with root privileges, similar to 'sudo'. The detection leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process names and command-line executions. This activity is significant as 'doas' can be exploited
  by adversaries to gain elevated privileges on a compromised host. If confirmed malicious, this could lead to unauthorized
  administrative access, potentially compromising the entire system.
references:
- https://research.splunk.com/d5a62490-6e09-11ec-884e-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/doas'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
