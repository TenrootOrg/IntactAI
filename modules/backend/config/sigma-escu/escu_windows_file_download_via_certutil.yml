title: Windows File Download Via CertUtil
id: 7fac8d40-e370-45ea-a4a3-031bbcc18b02
status: experimental
description: The following analytic detects the use of `certutil.exe` to download files using the `-URL`, `-urlcache` or '-verifyctl'
  arguments. This behavior is identified by monitoring command-line executions for these specific arguments via Endpoint Detection
  and Response (EDR) telemetry. This activity is significant because `certutil.exe` is a legitimate tool often abused by attackers
  to download and execute malicious payloads. If confirmed malicious, this could allow an attacker to download and execute
  arbitrary files, potentially leading to code execution, data exfiltration, or further compromise of the system.
references:
- https://research.splunk.com/7fac8d40-e370-45ea-a4a3-031bbcc18b02/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Michael Haag, Splunk
tags:
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\certutil.exe'
  sel2:
    OriginalFileName: CertUtil.exe
  sel3:
    CommandLine:
    - '*-URL *'
    - '*/URL *'
  sel4:
    CommandLine:
    - '*urlcache*'
    - '*verifyctl*'
  sel5:
    CommandLine:
    - '*/f *'
    - '*-f *'
  condition: ((sel1 or sel2) and (sel3 or (sel4 and sel5)))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_network_visibility_module/cisco_nvm_flowdata/nvm_flowdata.log
