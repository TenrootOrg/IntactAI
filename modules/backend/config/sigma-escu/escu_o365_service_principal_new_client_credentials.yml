title: O365 Service Principal New Client Credentials
id: a1b229e9-d962-4222-8c62-905a8a010453
status: experimental
description: The following analytic detects the addition of new credentials for Service Principals within an Office 365 tenant.
  It uses O365 audit logs, focusing on events related to credential modifications or additions in the AzureActiveDirectory
  workload. This activity is significant because Service Principals represent application identities, and their credentials
  allow applications to authenticate and access resources. If an attacker successfully adds or modifies these credentials,
  they can impersonate the application, leading to unauthorized data access, data exfiltration, or malicious operations under
  the application's identity.
references:
- https://research.splunk.com/a1b229e9-d962-4222-8c62-905a8a010453/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1098.001
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: AzureActiveDirectory
  sel2:
    Operation: 'Update application*Certificates and secrets management '
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1098.001/o365_service_principal_credentials/o365_service_principal_credentials.log
