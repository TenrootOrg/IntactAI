title: Linux Deleting Critical Directory Using RM Command
id: 33f89303-cc6f-49ad-921d-2eaea38a6f7a
status: experimental
description: The following analytic detects the deletion of critical directories on a Linux machine using the `rm` command
  with argument rf. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions
  targeting directories like /boot, /var/log, /etc, and /dev. This activity is significant because deleting these directories
  can severely disrupt system operations and is often associated with destructive campaigns like Industroyer2. If confirmed
  malicious, this action could lead to system instability, data loss, and potential downtime, making it crucial for immediate
  investigation and response.
references:
- https://research.splunk.com/33f89303-cc6f-49ad-921d-2eaea38a6f7a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1485
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/rm'
  sel2:
    CommandLine: '* -rf *'
  sel3:
    CommandLine:
    - '*/boot/*'
    - '*/var/log/*'
    - '*/etc/*'
    - '*/dev/*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1485/rm_shred_critical_dir/sysmon_linux.log
