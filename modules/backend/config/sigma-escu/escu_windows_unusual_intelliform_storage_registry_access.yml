title: Windows Unusual Intelliform Storage Registry Access
id: 99d69078-7dae-4ffe-9f3d-063242772f5a
status: experimental
description: The following analytic identifies processes accessing Intelliform Storage Registry keys used by Internet Explorer.
  It leverages Windows Security Event logs, specifically monitoring EventCode 4663, which tracks object access events. This
  activity is significant because it can indicate unauthorized access or manipulation of sensitive registry keys used for
  storing form data in Internet Explorer. If confirmed malicious, this could lead to data exfiltration, credential theft,
  or further compromise of the system.
references:
- https://research.splunk.com/99d69078-7dae-4ffe-9f3d-063242772f5a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1552.001
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ProcessName:
    - C:\\Program Files\\Internet Explorer\\iexplore.exe
    - C:\\Windows\\System32\\dllhost.exe
    - C:\\Windows\\SysWow64\\dllhost.exe
  sel3:
    ObjectName: '*Software\\microsoft\\Internet Explorer\\Intelliforms\\storage2*'
  condition: (sel1 and not (sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552.001/ie_intelliform_storage/storage2_sim.log
