title: Disable Logs Using WevtUtil
id: 236e7c8e-c9d9-11eb-a824-acde48001122
status: experimental
description: The following analytic detects the execution of "wevtutil.exe" with parameters to disable event logs. It leverages
  data from Endpoint Detection and Response (EDR) agents, focusing on process names and command-line arguments. This activity
  is significant because disabling event logs is a common tactic used by ransomware to evade detection and hinder forensic
  investigations. If confirmed malicious, this action could allow attackers to operate undetected, making it difficult to
  trace their activities and respond effectively to the incident.
references:
- https://research.splunk.com/236e7c8e-c9d9-11eb-a824-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685.005
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\wevtutil.exe'
  sel2:
    CommandLine: '*sl*'
  sel3:
    CommandLine: '*set-log*'
  sel4:
    CommandLine:
    - '*/e:false*'
    - '*/enabled:false*'
  condition: (sel1 and (sel2 or sel3) and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/ransomware_ttp/data1/windows-sysmon.log
