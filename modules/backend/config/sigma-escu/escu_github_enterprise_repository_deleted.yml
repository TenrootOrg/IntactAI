title: GitHub Enterprise Repository Deleted
id: f709e736-3e6c-492f-b865-bc7696cc24a7
status: experimental
description: The following analytic detects when a user deletes a repository in GitHub Enterprise. The detection monitors
  GitHub Enterprise audit logs for repository deletion events, which could indicate unauthorized removal of critical source
  code and project resources. For a SOC, identifying repository deletions is crucial as it may signal account compromise,
  insider threats, or malicious attempts to destroy intellectual property and disrupt development operations. The impact could
  be severe, potentially resulting in permanent loss of source code, documentation, project history, and other critical assets
  if proper backups are not maintained. Repository deletion could halt development workflows, cause significant business disruption,
  and require substantial effort to restore from backups if available. Additionally, unauthorized repository removal could
  be part of a larger attack campaign aimed at destroying or compromising enterprise assets.
references:
- https://research.splunk.com/f709e736-3e6c-492f-b865-bc7696cc24a7/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
