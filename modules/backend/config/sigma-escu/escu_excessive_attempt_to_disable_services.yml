title: Excessive Attempt To Disable Services (counted event)
id: 8fa2a0f0-acd9-11eb-8994-acde48001122-base
status: experimental
description: The following analytic identifies a suspicious series of command-line executions attempting to disable multiple
  services. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on processes where "sc.exe" is used
  with parameters like "config" or "Disabled" within a short time frame. This activity is significant as it may indicate an
  adversary's attempt to disable security or other critical services to further compromise the system. If confirmed malicious,
  this could lead to the attacker achieving persistence, evading detection, or disabling security mechanisms, thereby increasing
  the risk of further exploitation.
references:
- https://research.splunk.com/8fa2a0f0-acd9-11eb-8994-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\sc.exe'
  sel2:
    CommandLine: '*config*'
  sel3:
    CommandLine: '*Disabled*'
  condition: (sel1 and (sel2 or sel3))
level: informational
name: escu_base_excessive_attempt_to_disable_services
