title: Windows SubInAcl Execution
id: 12491419-1a6f-4af4-afc3-4e2052f0610e
status: experimental
description: The following analytic detects the execution of the SubInAcl utility. SubInAcl is a legacy Windows Resource Kit
  tool from the Windows 2003 era, used to manipulate security descriptors of securable objects. It leverages data from Endpoint
  Detection and Response (EDR) agents, specifically searching for any process execution involving "SubInAcl.exe" binary. This
  activity can be significant because the utility should be rarely found on modern Windows machines, which mean any execution
  could potentially be considered suspicious. If confirmed malicious, this could allow an attacker to blind defenses by tampering
  with EventLog ACLs or modifying the access to a previously denied resource.
references:
- https://research.splunk.com/12491419-1a6f-4af4-afc3-4e2052f0610e/
author: Splunk Security Content (Apache-2.0), Nasreddine Bencherchali, Michael Haag, Splunk
tags:
- attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\subinacl.exe'
  sel2:
    OriginalFileName: SubInAcl.exe
  condition: (sel1 or sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1222.001/subinacl/subinacl_sysmon.log
