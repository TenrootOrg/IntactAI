title: Mmc LOLBAS Execution Process Spawn
id: f6601940-4c74-11ec-b9b7-3e22fbd008af
status: experimental
description: The following analytic identifies `mmc.exe` spawning a LOLBAS execution process. It leverages data from Endpoint
  Detection and Response (EDR) agents, focusing on process creation events where `mmc.exe` is the parent process. This activity
  is significant because adversaries can abuse the DCOM protocol and MMC20 COM object to execute malicious code, using Windows
  native binaries documented by the LOLBAS project. If confirmed malicious, this behavior could indicate lateral movement,
  allowing attackers to execute code remotely, potentially leading to further compromise and persistence within the environment.
references:
- https://research.splunk.com/f6601940-4c74-11ec-b9b7-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1021.003
- attack.t1218.014
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\mmc.exe'
  sel2:
