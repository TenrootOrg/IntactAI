title: Windows Unusual FileZilla XML Config Access
id: 47dc0426-cbe4-4253-8b86-1a983c3f9951
status: experimental
description: The following analytic identifies processes accessing FileZilla XML config files such as recentservers.xml and
  sitemanager.xml. It leverages Windows Security Event logs, specifically monitoring EventCode 4663, which tracks object access
  events. This activity is significant because it can indicate unauthorized access or manipulation of sensitive configuration
  files used by FileZilla, a popular FTP client. If confirmed malicious, this could lead to data exfiltration, credential
  theft, or further compromise of the system.
references:
- https://research.splunk.com/47dc0426-cbe4-4253-8b86-1a983c3f9951/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1552.001
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4663'
  sel2:
    ProcessName:
    - C:\\Program Files\\FileZilla FTP Client\\filezilla.exe
    - C:\\Program Files (x86)\\FileZilla FTP Client\\filezilla.exe
    - C:\\Program Files\\Microsoft OneDrive\\OneDrive.exe
    - C:\\Program Files (x86)\\Microsoft OneDrive\\OneDrive.exe
  sel3:
    ObjectName:
    - '*FileZilla\\recentservers.xml*'
    - '*FileZilla\\sitemanager.xml*'
  condition: (sel1 and not (sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1552.001/file_xml_config/filezilla_obj.log
