title: Linux Telnet Authentication Bypass
id: 6e0913d4-5461-487c-9dce-6d22ef2c0f03
status: experimental
description: Detects an authentication bypass in telnet tracked as CVE-2026-24061. An attacker can supply a specifically crafted
  USER environment variable (-f root) that is passed to /usr/bin/login. Because this input isn't sanitized an attacker can
  force the system to skip authentication and login directly as root.
references:
- https://research.splunk.com/6e0913d4-5461-487c-9dce-6d22ef2c0f03/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1548
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/login'
  sel2:
    ParentImage: '*/telnetd'
  sel3:
    CommandLine: '* -p *'
  sel4:
    CommandLine: '* -f root*'
  condition: (sel1 and sel2 and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/telnet/sysmon_linux.log
