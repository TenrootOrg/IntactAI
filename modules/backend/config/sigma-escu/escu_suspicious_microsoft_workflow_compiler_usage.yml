title: Suspicious microsoft workflow compiler usage
id: 9bbc62e8-55d8-11eb-ae93-0242ac130002
status: experimental
description: The following analytic identifies the usage of microsoft.workflow.compiler.exe, a rarely utilized executable
  typically found in C:\Windows\Microsoft.NET\Framework64\v4.0.30319. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on process execution telemetry. The significance of this activity lies in its uncommon
  usage, which may indicate malicious intent such as code execution or persistence mechanisms. If confirmed malicious, an
  attacker could leverage this process to execute arbitrary code, potentially leading to unauthorized access or further compromise
  of the system.
references:
- https://research.splunk.com/9bbc62e8-55d8-11eb-ae93-0242ac130002/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\microsoft.workflow.compiler.exe'
  sel2:
    OriginalFileName: Microsoft.Workflow.Compiler.exe
  condition: (sel1 or sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1127/atomic_red_team/windows-sysmon.log
