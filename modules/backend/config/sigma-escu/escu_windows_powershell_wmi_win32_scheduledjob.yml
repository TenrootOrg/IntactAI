title: Windows PowerShell WMI Win32 ScheduledJob
id: 47c69803-2c09-408b-b40a-063c064cbb16
status: experimental
description: The following analytic detects the use of the Win32_ScheduledJob WMI class via PowerShell script block logging.
  This class, which manages scheduled tasks, is disabled by default due to security concerns and must be explicitly enabled
  through registry modifications. The detection leverages PowerShell event code 4104 and script block text analysis. Monitoring
  this activity is crucial as it may indicate malicious intent, especially if the class was enabled by an attacker. If confirmed
  malicious, this could allow attackers to persist in the environment by creating scheduled tasks.
references:
- https://research.splunk.com/47c69803-2c09-408b-b40a-063c064cbb16/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059.001
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*win32_scheduledjob*'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/atomic_red_team/win32_scheduledjob_windows-powershell.log
