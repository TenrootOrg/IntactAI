title: Windows Curl Download to Suspicious Path
id: c32f091e-30db-11ec-8738-acde48001122
status: experimental
description: 'The following analytic detects the use of Windows Curl.exe to download

  a file to a suspicious location, such as AppData, ProgramData, or Public directories.

  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on

  command-line executions that include the -O or --output options. This activity is

  significant because downloading files to these locations can indicate an attempt

  to bypass security controls or establish persistence. If confirmed malicious, this

  behavior could lead to unauthorized code execution, data exfiltration, or further

  compromise of the system.'
references:
- https://research.splunk.com/c32f091e-30db-11ec-8738-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Nasreddine Bencherchali, Splunk
tags:
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\curl.exe'
  sel2:
    OriginalFileName: Curl.exe
  sel3:
    CommandLine:
    - '*-O *'
    - '*--output*'
    - '*--output-dir*'
  sel4:
    CommandLine:
    - '*:\\PerfLogs\\*'
    - '*:\\Windows\\Temp\\*'
    - '*\\AppData\\*'
    - '*\\ProgramData\\*'
    - '*\\Users\\Public\\*'
    - '*%AppData%*'
    - '*%Public%*'
    - '*%Temp%*'
    - '*%tmp%*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1105/atomic_red_team/windows-sysmon_curl.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_network_visibility_module/cisco_nvm_flowdata/nvm_flowdata.log
