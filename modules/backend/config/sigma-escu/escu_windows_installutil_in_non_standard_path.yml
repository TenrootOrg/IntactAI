title: Windows InstallUtil in Non Standard Path
id: dcf74b22-7933-11ec-857c-acde48001122
status: experimental
description: The following analytic detects the execution of InstallUtil.exe from non-standard paths. It leverages Endpoint
  Detection and Response (EDR) data, focusing on process names and original file names outside typical directories. This activity
  is significant because InstallUtil.exe is often used by attackers to execute malicious code or scripts. If confirmed malicious,
  this behavior could allow an attacker to bypass security controls, execute arbitrary code, and potentially gain unauthorized
  access or persist within the environment.
references:
- https://research.splunk.com/dcf74b22-7933-11ec-857c-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1036.003
- attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\installutil.exe'
  sel2:
    OriginalFileName: InstallUtil.exe
  sel3:
    Image:
    - '*\\Windows\\ADWS\\*'
    - '*\\Windows\\SysWOW64*'
    - '*\\Windows\\system32*'
    - '*\\Windows\\NetworkController\\*'
    - '*\\Windows\\SystemApps\\*'
    - '*\\WinSxS\\*'
    - '*\\Windows\\Microsoft.NET\\*'
  condition: ((sel1 or sel2) and not (sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.004/atomic_red_team/windows-sysmon_installutil_path.log
