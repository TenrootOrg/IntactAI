title: Allow Network Discovery In Firewall
id: ccd6a38c-d40b-11eb-85a5-acde48001122
status: experimental
description: The following analytic detects a suspicious modification to the firewall to allow network discovery on a machine.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions involving the 'netsh'
  command to enable network discovery. This activity is significant because it is commonly used by ransomware, such as REvil
  and RedDot, to discover and compromise additional machines on the network. If confirmed malicious, this could lead to widespread
  file encryption across multiple hosts, significantly amplifying the impact of the ransomware attack.
references:
- https://research.splunk.com/ccd6a38c-d40b-11eb-85a5-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1686.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\netsh.exe'
  sel2:
    OriginalFileName: netsh.exe
  sel3:
    CommandLine: '*firewall*'
  sel4:
    CommandLine: '*group="Network Discovery"*'
  sel5:
    CommandLine: '*enable*'
  sel6:
    CommandLine: '*Yes*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5 and sel6)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/ransomware_ttp/data2/windows-sysmon.log
