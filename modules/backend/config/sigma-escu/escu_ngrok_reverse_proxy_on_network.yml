title: Ngrok Reverse Proxy on Network
id: 5790a766-53b8-40d3-a696-3547b978fcf0
status: experimental
description: The following analytic detects DNS queries to common Ngrok domains, indicating potential use of the Ngrok reverse
  proxy tool. It leverages the Network Resolution datamodel to identify queries to domains such as "*.ngrok.com" and "*.ngrok.io".
  While Ngrok usage is not inherently malicious, it has been increasingly adopted by adversaries for covert communication
  and data exfiltration. If confirmed malicious, this activity could allow attackers to bypass network defenses, establish
  persistent connections, and exfiltrate sensitive data, posing a significant threat to the network's security.
references:
- https://research.splunk.com/5790a766-53b8-40d3-a696-3547b978fcf0/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1572
- attack.t1090
- attack.t1102
logsource:
  category: dns
detection:
  sel1:
    query:
    - '*.ngrok.com'
    - '*.ngrok.io'
    - ngrok.*.tunnel.com
    - korgn.*.lennut.com
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1572/ngrok/windows-sysmon.log
