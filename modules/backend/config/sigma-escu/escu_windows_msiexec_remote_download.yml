title: Windows MSIExec Remote Download
id: 6aa49ff2-3c92-4586-83e0-d83eb693dfda
status: experimental
description: 'The following analytic detects the use of msiexec.exe with an HTTP or

  HTTPS URL in the command line, indicating a remote file download attempt. This detection

  leverages data from Endpoint Detection and Response (EDR) agents, focusing on process

  execution logs that include command-line details. This activity is significant as

  it may indicate an attempt to download and execute potentially malicious software

  from a remote server. If confirmed malicious, this could lead to unauthorized code

  execution, system compromise, or further malware deployment within the network.'
references:
- https://research.splunk.com/6aa49ff2-3c92-4586-83e0-d83eb693dfda/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\msiexec.exe'
  sel2:
    OriginalFileName: msiexec.exe
  sel3:
    CommandLine:
    - '*http://*'
    - '*https://*'
  condition: ((sel1 or sel2) and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.007/atomic_red_team/windows-sysmon.log
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_network_visibility_module/cisco_nvm_flowdata/nvm_flowdata.log
