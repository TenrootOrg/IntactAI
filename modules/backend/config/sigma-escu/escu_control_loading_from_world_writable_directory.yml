title: Control Loading from World Writable Directory
id: 10423ac4-10c9-11ec-8dc4-acde48001122
status: experimental
description: The following analytic identifies instances of control.exe loading a .cpl or .inf file from a writable directory,
  which is related to CVE-2021-40444. This detection leverages data from Endpoint Detection and Response (EDR) agents, focusing
  on process names and command-line executions mapped to the `Processes` node of the `Endpoint` data model. This activity
  is significant as it may indicate an attempt to exploit a known vulnerability, potentially leading to unauthorized code
  execution. If confirmed malicious, this could allow an attacker to gain control over the affected system, leading to further
  compromise.
references:
- https://research.splunk.com/10423ac4-10c9-11ec-8dc4-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.002
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\control.exe'
  sel2:
    OriginalFileName: CONTROL.EXE
  sel3:
    CommandLine:
    - '*\\appdata\\*'
    - '*\\windows\\temp\\*'
    - '*\\programdata\\*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.002/atomic_red_team/windows-sysmon.log
