title: Kerberoasting spn request with RC4 encryption
id: 5cc67381-44fa-4111-8a37-7a230943f027
status: experimental
description: The following analytic detects potential Kerberoasting attacks by identifying Kerberos service ticket requests
  with RC4 encryption through Event ID 4769. It leverages specific Ticket_Options values commonly used by Kerberoasting tools.
  This activity is significant as Kerberoasting allows attackers to request service tickets for domain accounts, typically
  service accounts, and crack them offline to gain privileged access. If confirmed malicious, this could lead to unauthorized
  access, privilege escalation, and further compromise of the Active Directory environment.
references:
- https://research.splunk.com/5cc67381-44fa-4111-8a37-7a230943f027/
author: Splunk Security Content (Apache-2.0), Jose Hernandez, Patrick Bareiss, Mauricio Velazco, Dean Luxton, Splunk
tags:
- attack.t1558.003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4769'
  sel2:
    ServiceName: '*$'
  sel3:
    TicketOptions: '0x40810000'
  sel4:
    TicketOptions: '0x40800000'
  sel5:
    TicketOptions: '0x40810010'
  sel6:
    TicketEncryptionType: '0x17'
  condition: (sel1 and not sel2 and ((sel3 or sel4) or sel5) and sel6)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1558.003/kerberoasting_spn_request_with_rc4_encryption/windows-xml.log
