title: Cisco Duo Policy Allow Old Java
id: ff56d843-57de-4a87-b726-13b145f6bf96
status: experimental
description: 'The following analytic detects when a Duo policy is created or updated to allow the use of outdated Java versions,
  which can introduce significant

  security risks. It works by searching Duo administrator activity logs for policy creation or update actions where the policy
  explicitly sets

  ''java_remediation'' to ''no remediation'', indicating that no restrictions are enforced against old Java. The analytic
  aggregates relevant details

  such as the user, admin email, and action context for further investigation. Identifying this behavior is critical for a
  Security Operations Center

  (SOC) because allowing outdated Java can expose an organization to known vulnerabilities, malware, and exploitation techniques.
  Attackers or malicious

  insiders may attempt to weaken security controls by modifying policies to permit insecure software, increasing the risk
  of compromise. Prompt detection

  enables SOC analysts to respond quickly, revert risky changes, and mitigate potential threats before they are exploit'
references:
- https://research.splunk.com/ff56d843-57de-4a87-b726-13b145f6bf96/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1556
logsource:
  product: cisco
  service: duo
detection:
  sel1:
    action: policy_update
  sel2:
    action: policy_create
  sel3:
    java_remediation: no remediation
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556/cisco_duo_policy_allow_old_flash_and_java/cisco_duo_administrator.json
