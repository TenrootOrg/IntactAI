title: Windows PowerView SPN Discovery
id: a7093c28-796c-4ebb-9997-e2c18b870837
status: experimental
description: The following analytic detects the execution of the `Get-DomainUser` or `Get-NetUser` PowerShell cmdlets with
  the `-SPN` parameter, indicating the use of PowerView for SPN discovery. It leverages PowerShell Script Block Logging (EventCode=4104)
  to identify these specific commands. This activity is significant as it suggests an attempt to enumerate domain accounts
  associated with Service Principal Names (SPNs), a common precursor to Kerberoasting attacks. If confirmed malicious, this
  could allow an attacker to identify and target accounts for credential theft, potentially leading to unauthorized access
  and privilege escalation within the network.
references:
- https://research.splunk.com/a7093c28-796c-4ebb-9997-e2c18b870837/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1558.003
logsource:
  product: windows
  category: ps_script
detection:
  sel1:
    EventID: '4104'
  sel2:
    ScriptBlockText: '*Get-NetUser*'
  sel3:
    ScriptBlockText: '*Get-DomainUser*'
  sel4:
    ScriptBlockText: '*-SPN*'
  condition: (sel1 and (sel2 or sel3) and sel4)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1558.003/powerview-2/windows-powershell.log
