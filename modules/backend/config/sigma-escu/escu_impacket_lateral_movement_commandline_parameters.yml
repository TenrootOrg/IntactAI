title: Impacket Lateral Movement Commandline Parameters
id: 8ce07472-496f-11ec-ab3b-3e22fbd008af
status: experimental
description: The following analytic identifies the use of suspicious command-line parameters associated with Impacket tools,
  such as `wmiexec.py`, `smbexec.py`, `dcomexec.py`, and `atexec.py`, which are used for lateral movement and remote code
  execution. It detects these activities by analyzing process execution logs from Endpoint Detection and Response (EDR) agents,
  focusing on specific command-line patterns. This activity is significant because Impacket tools are commonly used by adversaries
  and Red Teams to move laterally within a network. If confirmed malicious, this could allow attackers to execute commands
  remotely, potentially leading to further compromise and data exfiltration.
references:
- https://research.splunk.com/8ce07472-496f-11ec-ab3b-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1021.002
- attack.t1021.003
- attack.t1047
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    CommandLine: '*/Q /c * \\\\127.0.0.1\\*$*'
  sel3:
    CommandLine:
    - '*2>&1*'
    - '*2&gt;&amp;1*'
  condition: (sel1 and (sel2 and sel3))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.003/impacket/windows-sysmon.log
