title: Disable Schedule Task
id: db596056-3019-11ec-a9ff-acde48001122
status: experimental
description: The following analytic detects the execution of a command to disable an existing scheduled task using 'schtasks.exe'
  with the '/change' and '/disable' parameters. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process names and command-line arguments. Disabling scheduled tasks is significant as it is a common tactic
  used by adversaries, including malware like IcedID, to disable security applications and evade detection. If confirmed malicious,
  this activity could allow attackers to persist undetected, disable critical security defenses, and further compromise the
  targeted host.
references:
- https://research.splunk.com/db596056-3019-11ec-a9ff-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\schtasks.exe'
  sel2:
    CommandLine: '*/change*'
  sel3:
    CommandLine: '*/disable*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/icedid/disable_schtask/sysmon.log
