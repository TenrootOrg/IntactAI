title: AWS Credential Access RDS Password reset
id: 6153c5ea-ed30-4878-81e6-21ecdb198189
status: experimental
description: The following analytic detects the resetting of the master user password for an Amazon RDS DB instance. It leverages
  AWS CloudTrail logs to identify events where the `ModifyDBInstance` API call includes a new `masterUserPassword` parameter.
  This activity is significant because unauthorized password resets can grant attackers access to sensitive data stored in
  production databases, such as credit card information, PII, and healthcare data. If confirmed malicious, this could lead
  to data breaches, regulatory non-compliance, and significant reputational damage. Immediate investigation is required to
  determine the legitimacy of the password reset.
references:
- https://research.splunk.com/6153c5ea-ed30-4878-81e6-21ecdb198189/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1110
- attack.t1586.003
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventSource: rds.amazonaws.com
  sel2:
    eventName: ModifyDBInstance
  sel3:
    requestParameters.masterUserPassword: '*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1110.002/aws_rds_password_reset/aws_cloudtrail_events.json
