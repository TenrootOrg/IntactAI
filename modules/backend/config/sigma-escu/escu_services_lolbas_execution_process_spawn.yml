title: Services LOLBAS Execution Process Spawn
id: ba9e1954-4c04-11ec-8b74-3e22fbd008af
status: experimental
description: The following analytic identifies `services.exe` spawning a LOLBAS (Living Off the Land Binaries and Scripts)
  execution process. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events
  where `services.exe` is the parent process. This activity is significant because adversaries often abuse the Service Control
  Manager to execute malicious code via native Windows binaries, facilitating lateral movement. If confirmed malicious, this
  behavior could allow attackers to execute arbitrary code, escalate privileges, or maintain persistence within the environment,
  posing a severe security risk.
references:
- https://research.splunk.com/ba9e1954-4c04-11ec-8b74-3e22fbd008af/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\services.exe'
  sel2:
