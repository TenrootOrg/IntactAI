title: Windows Apache Benchmark Binary
id: 894f48ea-8d85-4dcd-9132-c66cdb407c9b
status: experimental
description: The following analytic detects the execution of the Apache Benchmark binary (ab.exe), commonly used by MetaSploit
  payloads. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process creation events where
  the original file name is ab.exe. This activity is significant as it may indicate the presence of a MetaSploit attack, which
  uses Apache Benchmark to generate malicious payloads. If confirmed malicious, this could lead to unauthorized network connections,
  further system compromise, and potential data exfiltration. Immediate investigation is required to determine the intent
  and scope of the activity.
references:
- https://research.splunk.com/894f48ea-8d85-4dcd-9132-c66cdb407c9b/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    OriginalFileName: ab.exe
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059/metasploit/apachebench_windows-sysmon.log
