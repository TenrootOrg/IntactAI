title: AWS Bedrock Delete GuardRails
id: 7a5e3d62-f743-11ee-9f6e-acde48001122
status: experimental
description: The following analytic identifies attempts to delete AWS Bedrock GuardRails, which are security controls designed
  to prevent harmful, biased, or inappropriate AI outputs. It leverages AWS CloudTrail logs to detect when a user or service
  calls the DeleteGuardrail API. This activity is significant as it may indicate an adversary attempting to remove safety
  guardrails after compromising credentials, potentially to enable harmful or malicious model outputs. Removing guardrails
  could allow attackers to extract sensitive information, generate offensive content, or bypass security controls designed
  to prevent prompt injection and other AI-specific attacks. If confirmed malicious, this could represent a deliberate attempt
  to manipulate model behavior for harmful purposes.
references:
- https://research.splunk.com/7a5e3d62-f743-11ee-9f6e-acde48001122/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1685.002
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    eventSource: bedrock.amazonaws.com
  sel2:
    eventName: DeleteGuardrail
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.008/aws_bedrock_delete_guardrails/cloudtrail.json
