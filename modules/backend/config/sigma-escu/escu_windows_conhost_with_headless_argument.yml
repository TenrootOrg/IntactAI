title: Windows ConHost with Headless Argument
id: d5039508-998d-4cfc-8b5e-9dcd679d9a62
status: experimental
description: The following analytic detects the unusual invocation of the Windows Console Host process (conhost.exe) with
  the undocumented --headless parameter. This detection leverages Endpoint Detection and Response (EDR) telemetry, specifically
  monitoring for command-line executions where conhost.exe is executed with the --headless argument. This activity is significant
  for a SOC as it is not commonly used in legitimate operations and may indicate an attacker's attempt to execute commands
  stealthily. If confirmed malicious, this behavior could lead to persistence, lateral movement, or other malicious activities,
  potentially resulting in data exfiltration or system compromise.
references:
- https://research.splunk.com/d5039508-998d-4cfc-8b5e-9dcd679d9a62/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1564.003
- attack.t1564.006
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\conhost.exe'
  sel2:
    CommandLine: '*--headless *'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1564.003/headless/4688_conhost_headless.log
x-intact-burst: false
x-intact: 'Fired 2 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
