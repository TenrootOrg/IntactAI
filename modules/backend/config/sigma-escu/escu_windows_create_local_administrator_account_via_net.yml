title: Windows Create Local Administrator Account Via Net
id: 2c568c34-bb57-4b43-9d75-19c605b98e70
status: experimental
description: The following analytic detects the creation of a local administrator account using the "net.exe" command. It
  leverages Endpoint Detection and Response (EDR) data to identify processes named "net.exe" with the "/add" parameter and
  keywords related to administrator accounts. This activity is significant as it may indicate an attacker attempting to gain
  persistent access or escalate privileges. If confirmed malicious, this could lead to unauthorized access, data theft, or
  further system compromise. Review the process details, user context, and related artifacts to determine the legitimacy of
  the activity.
references:
- https://research.splunk.com/2c568c34-bb57-4b43-9d75-19c605b98e70/
author: Splunk Security Content (Apache-2.0), Bhavin Patel, Splunk
tags:
- attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\net1.exe'
  sel2:
    OriginalFileName: net1.exe
  sel3:
    CommandLine: '*/add*'
  sel4:
    CommandLine:
    - '*administrators*'
    - '*administratoren*'
    - '*administrateurs*'
    - '*administrador*'
    - '*amministratori*'
    - '*administratorer*'
    - '*Rendszergazda*'
    - '*Администратор*'
    - '*Administratör*'
  condition: ((sel1 or sel2) and sel3 and sel4)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1136.001/atomic_red_team/windows-sysmon.log
