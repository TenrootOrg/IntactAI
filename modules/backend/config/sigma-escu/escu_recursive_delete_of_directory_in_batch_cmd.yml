title: Recursive Delete of Directory In Batch CMD
id: ba570b3a-d356-11eb-8358-acde48001122
status: experimental
description: The following analytic detects the execution of a batch command designed to recursively delete files or directories,
  a technique often used by ransomware like Reddot to delete files in the recycle bin and prevent recovery. It leverages data
  from Endpoint Detection and Response (EDR) agents, focusing on command-line executions that include specific flags for recursive
  and quiet deletions. This activity is significant as it indicates potential ransomware behavior aimed at data destruction.
  If confirmed malicious, it could lead to significant data loss and hinder recovery efforts, severely impacting business
  operations.
references:
- https://research.splunk.com/ba570b3a-d356-11eb-8358-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    OriginalFileName: Cmd.Exe
  sel3:
    CommandLine: '*/c*'
  sel4:
    CommandLine: '* rd *'
  sel5:
    CommandLine: '*/s*'
  sel6:
    CommandLine: '*/q*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5 and sel6)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/ransomware_ttp/data2/windows-sysmon.log
