title: ASL AWS New MFA Method Registered For User
id: 33ae0931-2a03-456b-b1d7-b016c5557fbd
status: experimental
description: The following analytic identifies the registration of a new Multi-Factor Authentication (MFA) method for an AWS
  account, as logged through Amazon Security Lake (ASL). It detects this activity by monitoring the `CreateVirtualMFADevice`
  API operation within ASL logs. This behavior is significant because adversaries who gain unauthorized access to an AWS account
  may register a new MFA method to maintain persistence. If confirmed malicious, this activity could allow attackers to secure
  their access, making it harder to detect and remove their presence from the compromised environment.
references:
- https://research.splunk.com/33ae0931-2a03-456b-b1d7-b016c5557fbd/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1556.006
logsource:
  product: aws
  service: cloudtrail
detection:
  sel1:
    api.operation: CreateVirtualMFADevice
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556.006/aws_new_mfa_method_registered_for_user/asl_ocsf_cloudtrail.json
