title: Linux RPM Privilege Escalation
id: f8e58a23-cecd-495f-9c65-6c76b4cb9774
status: experimental
description: The following analytic detects the execution of the RPM Package Manager with elevated privileges, specifically
  when it is used to run system commands as root via the `--eval` and `lua:os.execute` options. This detection leverages data
  from Endpoint Detection and Response (EDR) agents, focusing on command-line executions and process metadata. This activity
  is significant because it indicates a potential privilege escalation attempt, allowing a user to gain root access. If confirmed
  malicious, this could lead to full system compromise, unauthorized access to sensitive data, and further exploitation of
  the environment.
references:
- https://research.splunk.com/f8e58a23-cecd-495f-9c65-6c76b4cb9774/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Splunk
tags:
- attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    CommandLine: '*rpm*--eval*'
  sel2:
    CommandLine: '*lua:os.execute*'
  sel3:
    CommandLine: '*sudo*'
  condition: (sel1 and sel2 and sel3)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/rpm/sysmon_linux.log
