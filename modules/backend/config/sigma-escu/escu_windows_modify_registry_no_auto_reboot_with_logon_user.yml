title: Windows Modify Registry No Auto Reboot With Logon User
id: 6a12fa9f-580d-4627-8c7f-313e359bdc6a
status: experimental
description: The following analytic detects a suspicious modification to the Windows registry that disables automatic reboot
  with a logged-on user. This detection leverages the Endpoint data model to identify changes to the registry path `SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoRebootWithLoggedOnUsers`
  with a value of `0x00000001`. This activity is significant as it is commonly used by adversaries, including malware like
  RedLine Stealer, to evade detection and maintain persistence. If confirmed malicious, this could allow attackers to bypass
  security measures and deploy additional payloads without interruption.
references:
- https://research.splunk.com/6a12fa9f-580d-4627-8c7f-313e359bdc6a/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU\\NoAutoRebootWithLoggedOnUsers'
  sel2:
    Details:
    - '* (0x00000001)'
    - '0x00000001'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/redline/modify_registry/sysmon.log
