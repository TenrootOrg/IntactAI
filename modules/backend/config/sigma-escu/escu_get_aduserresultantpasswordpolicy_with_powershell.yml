title: Get ADUserResultantPasswordPolicy with Powershell
id: 8b5ef342-065a-11ec-b0fc-acde48001122
status: experimental
description: The following analytic detects the execution of `powershell.exe` running the `Get-ADUserResultantPasswordPolicy`
  cmdlet, which is used to obtain the password policy in a Windows domain. It leverages data from Endpoint Detection and Response
  (EDR) agents, focusing on process names and command-line executions. This activity is significant as it indicates potential
  enumeration of domain policies, a common tactic for situational awareness and Active Directory discovery by adversaries.
  If confirmed malicious, this could allow attackers to understand password policies, aiding in further attacks such as password
  spraying or brute force attempts.
references:
- https://research.splunk.com/8b5ef342-065a-11ec-b0fc-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Mauricio Velazco, Splunk
tags:
- attack.t1201
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\cmd.exe'
  sel2:
    Image: '*\\powershell*'
  sel3:
    CommandLine: '*Get-ADUserResultantPasswordPolicy*'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1201/pwd_policy_discovery/windows-sysmon.log
