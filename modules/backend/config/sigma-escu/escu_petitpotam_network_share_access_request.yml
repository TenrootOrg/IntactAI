title: PetitPotam Network Share Access Request
id: 95b8061a-0a67-11ec-85ec-acde48001122
status: experimental
description: The following analytic detects network share access requests indicative of the PetitPotam attack (CVE-2021-36942).
  It leverages Windows Event Code 5145, which logs attempts to access network share objects. This detection is significant
  as PetitPotam can coerce authentication from domain controllers, potentially leading to unauthorized access. If confirmed
  malicious, this activity could allow attackers to escalate privileges or move laterally within the network, posing a severe
  security risk. Ensure Event Code 5145 is enabled via Group Policy to utilize this analytic effectively.
references:
- https://research.splunk.com/95b8061a-0a67-11ec-85ec-acde48001122/
author: Splunk Security Content (Apache-2.0), Michael Haag, Mauricio Velazco, Splunk
tags:
- attack.t1187
logsource:
  product: windows
  service: security
detection:
  sel1:
    SubjectUserName: ANONYMOUS LOGON
  sel2:
    EventID: '5145'
  sel3:
    RelativeTargetName: lsarpc
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1187/petitpotam/windows-xml.log
