title: Windows Modify Registry Tamper Protection
id: 12094335-88fc-4c3a-b55f-e62dd8c93c23
status: experimental
description: The following analytic detects a suspicious modification to the Windows Defender Tamper Protection registry setting.
  It leverages data from the Endpoint datamodel, specifically targeting changes where the registry path is set to disable
  Tamper Protection. This activity is significant because disabling Tamper Protection can allow adversaries to make further
  undetected changes to Windows Defender settings, potentially leading to reduced security on the system. If confirmed malicious,
  this could enable attackers to evade detection, persist in the environment, and execute further malicious activities without
  interference from Windows Defender.
references:
- https://research.splunk.com/12094335-88fc-4c3a-b55f-e62dd8c93c23/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1112
logsource:
  category: registry_event
  product: windows
detection:
  sel1:
    TargetObject: '*\\SOFTWARE\\Microsoft\\Windows Defender\\Features\\TamperProtection'
  sel2:
    Details:
    - '* (0x00000000)'
    - '0x00000000'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/redline/modify_registry/sysmon.log
x-intact-burst: false
x-intact: 'Fired 8 time(s) on benign Windows activity (Nextron benign workstation + DC, 1.24 M events): context only, not
  counted toward a burst.'
