title: Notepad with no Command Line Arguments
id: 5adbc5f1-9a2f-41c1-a810-f37e015f8179
status: experimental
description: The following analytic identifies instances where Notepad.exe is launched without any command line arguments,
  a behavior commonly associated with the SliverC2 framework. This detection leverages process creation events from Endpoint
  Detection and Response (EDR) agents, focusing on processes initiated by Notepad.exe within a short time frame. This activity
  is significant as it may indicate an attempt to inject malicious code into Notepad.exe, a known tactic for evading detection.
  If confirmed malicious, this could allow an attacker to execute arbitrary code, potentially leading to system compromise
  and unauthorized access.
references:
- https://research.splunk.com/5adbc5f1-9a2f-41c1-a810-f37e015f8179/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\notepad.exe'
  condition: sel1
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1055/sliver/notepad_windows-sysmon.log
