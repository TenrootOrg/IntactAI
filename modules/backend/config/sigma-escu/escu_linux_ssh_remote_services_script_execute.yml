title: Linux SSH Remote Services Script Execute
id: aa1748dd-4a5c-457a-9cf6-ca7b4eb711b3
status: experimental
description: The following analytic detects the use of SSH to move laterally and execute a script or file on a remote host.
  It leverages data from Endpoint Detection and Response (EDR) agents, focusing on specific SSH command-line parameters and
  URLs. This activity is significant as it may indicate an attacker attempting to execute remote commands or scripts, potentially
  leading to unauthorized access or control over additional systems. If confirmed malicious, this could result in lateral
  movement, privilege escalation, or the execution of malicious payloads, compromising the security of the network.
references:
- https://research.splunk.com/aa1748dd-4a5c-457a-9cf6-ca7b4eb711b3/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1021.004
logsource:
  category: process_creation
  product: linux
detection:
  sel1:
    Image: '*/ssh'
  sel2:
    CommandLine:
    - '*oStrictHostKeyChecking*'
    - '*oConnectTimeout*'
    - '*oBatchMode*'
  sel3:
    CommandLine:
    - '*http:*'
    - '*https:*'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1021.004/atomic_red_team/linux-sysmon.log
