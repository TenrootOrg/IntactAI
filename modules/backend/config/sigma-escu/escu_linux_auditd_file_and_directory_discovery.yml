title: Linux Auditd File And Directory Discovery
id: 0bbfb79c-a755-49a5-a38a-1128d0a452f1
status: experimental
description: The following analytic detects suspicious file and directory discovery activities, which may indicate an attacker's
  effort to locate sensitive documents and files on a compromised system. This behavior often precedes data exfiltration,
  as adversaries seek to identify valuable or confidential information for theft. By identifying unusual or unauthorized attempts
  to browse or enumerate files and directories, this analytic helps security teams detect potential reconnaissance or preparatory
  actions by an attacker, enabling timely intervention to prevent data breaches or unauthorized access.
references:
- https://research.splunk.com/0bbfb79c-a755-49a5-a38a-1128d0a452f1/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1083
logsource:
  product: linux
  service: auditd
detection:
  sel1:
    CommandLine:
    - '*grep*'
    - '*find*'
  sel2:
    CommandLine:
    - '*.tif*'
    - '*.tiff*'
    - '*.gif*'
    - '*.jpeg*'
    - '*.jpg*'
    - '*.jif*'
    - '*.jfif*'
    - '*.jp2*'
    - '*.jpx*'
    - '*.j2k*'
    - '*.j2c*'
    - '*.fpx*'
    - '*.pcd*'
    - '*.png*'
    - '*.flv*'
    - '*.pdf*'
    - '*.mp4*'
    - '*.mp3*'
    - '*.gifv*'
    - '*.avi*'
    - '*.mov*'
    - '*.mpeg*'
    - '*.wav*'
    - '*.doc*'
    - '*.docx*'
    - '*.xls*'
    - '*.xlsx*'
    - '*.svg*'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1083/linux_auditd_find_document/auditd_execve_file_dir_discovery.log
