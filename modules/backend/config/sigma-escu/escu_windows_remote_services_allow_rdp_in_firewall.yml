title: Windows Remote Services Allow Rdp In Firewall
id: 9170cb54-ea15-41e1-9dfc-9f3363ce9b02
status: experimental
description: The following analytic detects modifications to the Windows firewall to enable Remote Desktop Protocol (RDP)
  on a targeted machine. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on command-line executions
  involving "netsh.exe" to allow TCP port 3389. This activity is significant as it may indicate an adversary attempting to
  gain remote access to a compromised host, a common tactic for lateral movement. If confirmed malicious, this could allow
  attackers to remotely control the system, leading to potential data exfiltration or further network compromise.
references:
- https://research.splunk.com/9170cb54-ea15-41e1-9dfc-9f3363ce9b02/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\netsh.exe'
  sel2:
    OriginalFileName: netsh.exe
  sel3:
    CommandLine: '*firewall*'
  sel4:
    CommandLine: '*add*'
  sel5:
    CommandLine: '*protocol=TCP*'
  sel6:
    CommandLine: '*localport=3389*'
  sel7:
    CommandLine: '*action=allow*'
  condition: ((sel1 or sel2) and sel3 and sel4 and sel5 and sel6 and sel7)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/malware/azorult/sysmon.log
