title: Kubernetes DaemonSet Deployed
id: bf39c3a3-b191-4d42-8738-9d9797bd0c3a
status: experimental
description: The following analytic detects the creation of a DaemonSet in a Kubernetes cluster. This behavior is identified
  by monitoring Kubernetes Audit logs for the creation event of a DaemonSet. DaemonSets ensure a specific pod runs on every
  node, making them a potential vector for persistent access. This activity is significant for a SOC as it could indicate
  an attempt to maintain persistent access to the Kubernetes infrastructure. If confirmed malicious, it could lead to persistent
  attacks, service disruptions, or unauthorized access to sensitive information.
references:
- https://research.splunk.com/bf39c3a3-b191-4d42-8738-9d9797bd0c3a/
author: Splunk Security Content (Apache-2.0), Patrick Bareiss, Splunk
tags:
- attack.t1204
logsource:
  product: kubernetes
  service: audit
detection:
  sel1:
    objectRef.resource: daemonsets
  sel2:
    verb: create
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1204/kubernetes_audit_daemonset_created/kubernetes_audit_daemonset_created.json
