title: Linux File Creation In Profile Directory
id: 46ba0082-61af-11ec-9826-acde48001122
status: experimental
description: The following analytic detects the creation of files in the /etc/profile.d directory on Linux systems. It leverages
  filesystem data to identify new files in this directory, which is often used by adversaries for persistence by executing
  scripts upon system boot. This activity is significant as it may indicate an attempt to maintain long-term access to the
  compromised host. If confirmed malicious, this could allow attackers to execute arbitrary code with elevated privileges
  each time the system boots, potentially leading to further compromise and data exfiltration.
references:
- https://research.splunk.com/46ba0082-61af-11ec-9826-acde48001122/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1546.004
logsource:
  category: file_event
  product: linux
detection:
  sel1:
    TargetFilename: '*/etc/profile.d/*'
  condition: sel1
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1546.004/linux_init_profile/sysmon_linux.log
