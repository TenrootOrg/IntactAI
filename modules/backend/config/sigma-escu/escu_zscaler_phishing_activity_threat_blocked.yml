title: Zscaler Phishing Activity Threat Blocked
id: 68d3e2c1-e97f-4310-b080-dea180b48aa9
status: experimental
description: The following analytic identifies potential phishing attempts blocked by Zscaler within a network. It leverages
  web proxy logs to detect actions tagged as HTML.Phish. The detection method involves analyzing critical data points such
  as user, threat name, URL, and hostname. This activity is significant for a SOC as it serves as an early warning system
  for phishing threats, enabling prompt investigation and mitigation. If confirmed malicious, this activity could indicate
  an attempt to deceive users into divulging sensitive information, potentially leading to data breaches or credential theft.
references:
- https://research.splunk.com/68d3e2c1-e97f-4310-b080-dea180b48aa9/
author: Splunk Security Content (Apache-2.0), Gowthamaraj Rajendran, Rod Soto, Splunk
tags:
- attack.t1566
logsource:
  category: proxy
detection:
  sel1:
    action: blocked
  sel2:
    threatname: HTML.Phish*
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1566/zscalar_web_proxy/zscalar_web_proxy.json
