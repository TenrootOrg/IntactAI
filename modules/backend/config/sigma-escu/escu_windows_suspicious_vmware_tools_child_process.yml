title: Windows Suspicious VMWare Tools Child Process
id: 1f77661a-0fe3-4b8d-a62c-7dff06906d26
status: experimental
description: The following analytic identifies child processes spawned by vmtoolsd.exe, the VMWare Tools service in Windows,
  which typically runs with SYSTEM privileges. This detection leverages data from Endpoint Detection and Response (EDR) agents,
  focusing on process and parent process relationships. Monitoring this activity is crucial as it can indicate exploitation
  attempts, such as CVE-2023-20867. If confirmed malicious, attackers could gain SYSTEM-level access, allowing them to execute
  arbitrary code, escalate privileges, and potentially compromise the entire system.
references:
- https://research.splunk.com/1f77661a-0fe3-4b8d-a62c-7dff06906d26/
author: Splunk Security Content (Apache-2.0), Raven Tait, Splunk
tags:
- attack.t1059
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    ParentImage: '*\\vmtoolsd.exe'
  sel2:
    Image:
    - '*\\powershell.exe'
    - '*\\cmd.exe'
    - '*\\msbuild.exe'
    - '*\\microsoft.workflow.compiler.exe'
    - '*\\searchprotocolhost.exe'
    - '*\\scrcons.exe'
    - '*\\cscript.exe'
    - '*\\wscript.exe'
    - '*\\bitsadmin.exe'
    - '*\\rundll32.exe'
    - '*\\wmic.exe'
    - '*\\mshta.exe'
    - '*\\certutil.exe'
    - '*\\schtasks.exe'
  sel3:
    Image: '*\\cmd.exe'
  sel4:
    CommandLine:
    - '*\\VMware Tools\\poweroff-vm-default.bat*'
    - '*\\VMware Tools\\poweron-vm-default.bat*'
  condition: (sel1 and sel2 and not ((sel3 and sel4)))
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059/vmtoolsd/vmtoolsd_execution.log
