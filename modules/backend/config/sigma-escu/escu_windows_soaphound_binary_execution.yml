title: Windows SOAPHound Binary Execution
id: 8e53f839-e127-4d6d-a54d-a2f67044a57f
status: experimental
description: The following analytic detects the execution of the SOAPHound binary (`soaphound.exe`) with specific command-line
  arguments. It leverages data from Endpoint Detection and Response (EDR) agents, focusing on process names, command-line
  arguments, and other process-related metadata. This activity is significant because SOAPHound is a known tool used for credential
  dumping and other malicious activities. If confirmed malicious, this behavior could allow an attacker to extract sensitive
  information, escalate privileges, or persist within the environment, posing a severe threat to organizational security.
references:
- https://research.splunk.com/8e53f839-e127-4d6d-a54d-a2f67044a57f/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1069.001
- attack.t1069.002
- attack.t1087.001
- attack.t1087.002
- attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\soaphound.exe'
  sel2:
    OriginalFileName: soaphound.exe
  sel3:
    CommandLine:
    - '*--buildcache *'
    - '*--bhdump *'
    - '*--certdump *'
    - '*--dnsdump *'
    - '*-c *'
    - '*--cachefilename *'
    - '*-o *'
    - '*--outputdirectory *'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/soaphound/sysmon_soaphound.log
