title: Azure AD User Consent Denied for OAuth Application
id: bb093c30-d860-4858-a56e-cd0895d5b49c
status: experimental
description: The following analytic identifies instances where a user has denied consent to an OAuth application seeking permissions
  within the Azure AD environment. This detection leverages Azure AD's audit logs, specifically focusing on user consent actions
  with error code 65004. Monitoring denied consent actions is significant as it can indicate users recognizing potentially
  suspicious or untrusted applications. If confirmed malicious, this activity could suggest attempts by unauthorized applications
  to gain access, potentially leading to data breaches or unauthorized actions within the environment. Understanding these
  denials helps refine security policies and enhance user awareness.
references:
- https://research.splunk.com/bb093c30-d860-4858-a56e-cd0895d5b49c/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1528
logsource:
  product: azure
detection:
  sel1:
    operationName: Sign-in activity
  sel2:
    properties.status.errorCode: '65004'
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1528/azure_ad_user_consent_declined/azure_ad_user_consent_declined.log
