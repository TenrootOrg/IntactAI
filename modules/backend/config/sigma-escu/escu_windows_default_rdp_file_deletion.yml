title: Windows Default Rdp File Deletion
id: 30a334c1-f9a5-4fbd-8958-5b65a8435cb2
status: experimental
description: This detection identifies the deletion of the Default.rdp file from a user’s Documents folder. This file is automatically
  created or updated by the Remote Desktop Connection client (mstsc.exe) whenever a user initiates an RDP session. It contains
  session configuration data, such as the remote hostname and display settings. While the presence of this file is normal
  during legitimate RDP usage, its deletion may indicate an attempt to conceal evidence of remote access activity. Threat
  actors and red team operators often remove Default.rdp as part of post-access cleanup to evade forensic detection. Detecting
  this action—especially when correlated with recent RDP activity—can help identify defense evasion techniques and uncover
  potentially malicious use of remote desktop connections. Monitoring for this file's deletion adds an important layer of
  visibility into user behavior and can serve as an early indicator of interactive attacker presence.
references:
- https://research.splunk.com/30a334c1-f9a5-4fbd-8958-5b65a8435cb2/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Splunk
tags:
- attack.t1070.004
logsource:
  product: windows
  service: sysmon
detection:
  sel1:
    EventID:
    - '23'
    - '26'
  sel2:
    TargetFilename: '*\\default.rdp'
  condition: (sel1 and sel2)
level: low
x-escu:
  type: Anomaly
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1070.004/rdp_deletion/rdp_file_deleted.log
