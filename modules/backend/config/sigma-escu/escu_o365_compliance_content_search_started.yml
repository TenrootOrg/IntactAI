title: O365 Compliance Content Search Started
id: f4cabbc7-c19a-4e41-8be5-98daeaccbb50
status: experimental
description: The following analytic detects when a content search is initiated within the Office 365 Security and Compliance
  Center. It leverages the SearchCreated operation from the o365_management_activity logs under the SecurityComplianceCenter
  workload. This activity is significant as it may indicate an attempt to access sensitive organizational data, including
  emails and documents. If confirmed malicious, this could lead to unauthorized data access, potential data exfiltration,
  and compliance violations. Monitoring this behavior helps ensure the integrity and security of organizational data.
references:
- https://research.splunk.com/f4cabbc7-c19a-4e41-8be5-98daeaccbb50/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1114.002
logsource:
  product: m365
  service: audit
detection:
  sel1:
    Workload: SecurityComplianceCenter
  sel2:
    Operation: SearchCreated
  condition: (sel1 and sel2)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1114.002/o365_compliance_content_search_started/o365_compliance_content_search_started.log
