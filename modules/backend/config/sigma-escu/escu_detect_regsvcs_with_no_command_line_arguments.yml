title: Detect Regsvcs with No Command Line Arguments
id: 6b74d578-a02e-4e94-a0d1-39440d0bf254
status: experimental
description: The following analytic detects instances of regsvcs.exe running without command line arguments. This behavior
  typically indicates process injection, where another process manipulates regsvcs.exe. The detection leverages data from
  Endpoint Detection and Response (EDR) agents, focusing on process names, IDs, and command-line executions. This activity
  is significant as it may signal an attempt to evade detection and execute malicious code. If confirmed malicious, the attacker
  could achieve code execution, potentially leading to privilege escalation, persistence, or access to sensitive information.
references:
- https://research.splunk.com/6b74d578-a02e-4e94-a0d1-39440d0bf254/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1218.009
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    Image: '*\\regsvcs.exe'
  sel2:
    OriginalFileName: RegSvcs.exe
  sel3:
    CommandLine:
    - '*regsvcs'
    - '*regsvcs.exe'
    - '*regsvcs.exe"'
  condition: ((sel1 or sel2) and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1218.009/atomic_red_team/windows-sysmon.log
