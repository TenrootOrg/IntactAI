title: Windows Modify System Firewall with Notable Process Path
id: cd6d7410-9146-4471-a418-49edba6dadc4
status: experimental
description: The following analytic detects suspicious modifications to system firewall rules, specifically allowing execution
  of applications from notable and potentially malicious file paths. This detection leverages data from Endpoint Detection
  and Response (EDR) agents, focusing on command-line executions involving firewall rule changes. This activity is significant
  as it may indicate an adversary attempting to bypass firewall restrictions to execute malicious files. If confirmed malicious,
  this could allow attackers to execute unauthorized code, potentially leading to further system compromise, data exfiltration,
  or persistence within the environment.
references:
- https://research.splunk.com/cd6d7410-9146-4471-a418-49edba6dadc4/
author: Splunk Security Content (Apache-2.0), Teoderick Contreras, Will Metcalf, Splunk
tags:
- attack.t1686
logsource:
  category: process_creation
  product: windows
detection:
  sel1:
    CommandLine: '*firewall*'
  sel2:
    CommandLine: '*allow*'
  sel3:
    CommandLine: '*add*'
  sel4:
    CommandLine: '*ENABLE*'
  sel5:
    CommandLine:
    - '*\\windows\\fonts\\*'
    - '*\\windows\\temp\\*'
    - '*\\users\\public\\*'
    - '*\\windows\\debug\\*'
    - '*\\Users\\Administrator\\Music\\*'
    - '*\\Windows\\servicing\\*'
    - '*\\Users\\Default\\*'
    - '*Recycle.bin*'
    - '*\\Windows\\Media\\*'
    - \\Windows\\repair\\*
    - '*\\temp\\*'
    - '*\\PerfLogs\\*'
  condition: (sel1 and sel2 and sel3 and sel4 and sel5)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.004/njrat_add_firewall_rule/njrat_firewall_sysmon.log
