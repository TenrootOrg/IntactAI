title: Windows IIS Components Module Failed to Load
id: 40c2ba5b-dd6a-496b-9e6e-c9524d0be167
status: experimental
description: The following analytic detects when an IIS Module DLL fails to load due to a configuration problem, identified
  by EventCode 2282. This detection leverages Windows Application event logs to identify repeated failures in loading IIS
  modules. Such failures can indicate misconfigurations or potential tampering with IIS components. If confirmed malicious,
  this activity could lead to service disruptions or provide an attacker with opportunities to exploit vulnerabilities within
  the IIS environment. Immediate investigation is required to determine the legitimacy of the failing module and to mitigate
  any potential security risks.
