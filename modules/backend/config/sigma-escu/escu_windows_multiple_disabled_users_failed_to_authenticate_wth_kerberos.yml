title: Windows Multiple Disabled Users Failed To Authenticate Wth Kerberos (counted event)
id: 98f22d82-9d62-11eb-9fcf-acde48001122-base
status: experimental
description: The following analytic detects a single source endpoint failing to authenticate with 30 unique disabled domain
  users using the Kerberos protocol within 5 minutes. It leverages Windows Security Event 4768, focusing on failure code `0x12`,
  indicating revoked credentials. This activity is significant as it may indicate a Password Spraying attack targeting disabled
  accounts, a tactic used by adversaries to gain initial access or elevate privileges. If confirmed malicious, this could
  lead to unauthorized access or privilege escalation within the Active Directory environment, posing a severe security risk.
references:
- https://research.splunk.com/98f22d82-9d62-11eb-9fcf-acde48001122/
author: Splunk Security Content (Apache-2.0), Mauricio Velazco, Splunk
tags:
- attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  sel1:
    EventID: '4768'
  sel2:
    TargetUserName: '*$'
  sel3:
    Status: '0x12'
  condition: (sel1 and not sel2 and sel3)
level: informational
name: escu_base_windows_multiple_disabled_users_failed_to_authenticate_wth_kerberos
