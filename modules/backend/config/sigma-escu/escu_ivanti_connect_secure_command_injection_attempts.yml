title: Ivanti Connect Secure Command Injection Attempts
id: 1f32a7e0-a060-4545-b7de-73fcf9ad536e
status: experimental
description: The following analytic identifies attempts to exploit the CVE-2023-46805 and CVE-2024-21887 vulnerabilities in
  Ivanti Connect Secure. It detects POST requests to specific URIs that leverage command injection to execute arbitrary commands.
  The detection uses the Web datamodel to monitor for these requests and checks for a 200 OK response, indicating a successful
  exploit attempt. This activity is significant as it can lead to unauthorized command execution on the server. If confirmed
  malicious, attackers could gain control over the system, leading to potential data breaches or further network compromise.
references:
- https://research.splunk.com/1f32a7e0-a060-4545-b7de-73fcf9ad536e/
author: Splunk Security Content (Apache-2.0), Michael Haag, Splunk
tags:
- attack.t1190
logsource:
  category: web
detection:
  sel1:
    c-uri:
    - '*/api/v1/totp/user-backup-code/../../system/maintenance/archiving/cloud-server-test-connection*'
    - '*/api/v1/totp/user-backup-code/../../license/keys-status/*'
  sel2:
    cs-method:
    - POST
    - GET
  sel3:
    sc-status: '200'
  condition: (sel1 and sel2 and sel3)
level: medium
x-escu:
  type: TTP
  tests:
  - https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1190/ivanti/suricata_ivanti_secure_connect_exploitphase.log
