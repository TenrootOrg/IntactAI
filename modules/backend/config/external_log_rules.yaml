  - id: aws-vpcflow-v2
    reason: "AWS VPC Flow Logs, default (version 2) format, no header. Unnamed, a REJECTed RDP attempt from the internet read as an answered one"
    line: '^2 (\d{12}|unknown) eni-[0-9a-f]+ \S+ \S+ \S+ \S+ \S+ \S+ \S+ \d+ \d+ (ACCEPT|REJECT|-) (OK|NODATA|SKIPDATA)\s*$'
    delimiter: " "
    quote: none
    empty: ["-"]
    columns:
      default: [version, account_id, interface_id, srcaddr, dstaddr, srcport, dstport, protocol, packets, bytes,
                start, end, action, log_status]
  - id: umbrella-dns-csv
    reason: "Cisco Umbrella DNS log export (no header), documented field order"
    line: '^"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}","[^"]*","[^"]*","[\d.]+","[\d.]+","(?:Allowed|Blocked)"'
    delimiter: ","
    columns:
      default: [timestamp, host, identities, src_ip, nat_ip, action, query_type, response_code, domain, categories,
                most_granular_identity_type, identity_types, blocked_categories]
  # Zeek / Bro TSV whose "#fields" header was stripped (SecRepo, many SIEM
  # exports): the default column order of each log, Bro 2.x. More specific
  # shapes first; conn.log last (its pattern is the loosest).
  - id: zeek-notice-tsv
    reason: "Zeek notice.log without its header"
    line: '^\d{9,10}\.\d+(\t[^\t]*){9}\t[A-Za-z_]+::[A-Za-z_]+\t'
    delimiter: "\t"
    quote: none
    empty: ["-", "(empty)"]
    columns:
      default: [ts, uid, id.orig_h, id.orig_p, id.resp_h, id.resp_p, fuid, file_mime_type, file_desc, proto, note, msg,
                sub, src, dst, p, n, peer_descr, actions, suppress_for, dropped, remote_location.country_code,
                remote_location.region, remote_location.city, remote_location.latitude, remote_location.longitude]
  - id: zeek-dns-tsv
    reason: "Zeek dns.log without its header"
    line: '^\d{9,10}\.\d+\t\S+\t[\d.:a-fA-F]+\t\d+\t[\d.:a-fA-F]+\t\d+\t(udp|tcp)\t[\d-]+\t[^\t]*\t[\d-]+\t(C_[A-Z]+|-)\t'
    delimiter: "\t"
    quote: none
    empty: ["-", "(empty)"]
    columns:
      default: [ts, uid, id.orig_h, id.orig_p, id.resp_h, id.resp_p, proto, trans_id, query, qclass, qclass_name, qtype,
                qtype_name, rcode, rcode_name, AA, TC, RD, RA, Z, answers, TTLs, rejected]
  - id: zeek-http-tsv
    reason: "Zeek http.log without its header"
