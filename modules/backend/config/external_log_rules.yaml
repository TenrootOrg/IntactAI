                filename, tags, username, password, proxied, mime_type, md5, extraction_file]
  - id: zeek-ssh-tsv
    reason: "Zeek ssh.log without its header"
    line: '^\d{9,10}\.\d+\t\S+\t[\d.:a-fA-F]+\t\d+\t[\d.:a-fA-F]+\t\d+\t(success|failure|undetermined|-)\t(INBOUND|OUTBOUND|-)\t'
    delimiter: "\t"
