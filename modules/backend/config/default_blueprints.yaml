# Default Blueprints Configuration
# Shipped with the platform and seeded on first startup.
# To customize, create override files in /data/blueprints/
#
version: 1

# ============================================================================
# Velociraptor Blueprints (includes Agentic)
# ============================================================================
velociraptor:

  # --------------------------------------------------------------------------
  # VELOCIRAPTOR BLUEPRINTS
  # --------------------------------------------------------------------------

  - id: velociraptor_quick_scan
    name: "Velociraptor: Quick Scan"
    description: "Fast detection-focused scan for rapid assessment (12 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 720
      timeout: 3600
      cpu_limit: 90
      # Flow-level resource limits (passed into the hunt's VQL `hunt(...)`).
      # Override the historical 1 GiB / 1 M-row hardcoded defaults from
      # velociraptor_service.py so big collections don't get cancelled.
      flow_max_rows: 10000000              # 10 M rows
      flow_max_logs: 1000000               # 1 M log lines
      flow_max_upload_mb: 51200            # 50 GiB total upload per flow
    artifacts:
      - DetectRaptor.Windows.Detection.Amcache
      - DetectRaptor.Windows.Detection.NamedPipes
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.LolDriversMalicious
      - DetectRaptor.Windows.Detection.YaraProcessWin
      - Windows.System.DNSCache
      - Windows.Network.NetstatEnriched
      - Windows.System.UntrustedBinaries
      - Windows.Attack.UnexpectedImagePath
      - Windows.EventLogs.RDPAuth
      - Generic.System.Pstree

  - id: velociraptor_best_practice
    name: "Velociraptor: BestPractice"
    description: "Curated best-practice artifact collection for thorough IR triage (31 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 720
      timeout: 21600
      cpu_limit: 90
      # Flow-level resource limits — see velociraptor_quick_scan for notes.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
    artifacts:
      - Generic.Forensic.SQLiteHunter
      - Windows.Analysis.EvidenceOfDownload
      - Windows.NTFS.MFT
      - Windows.Forensics.Usn
      - Windows.Network.NetstatEnriched
      - Windows.Nirsoft.LastActivityView
      - Windows.Forensics.Lnk
      - Generic.System.Pstree
      - Windows.System.UntrustedBinaries
      - Windows.Detection.Yara.Process
      - Windows.EventLogs.RDPAuth
      - Windows.Attack.UnexpectedImagePath
      - Windows.Sys.AllUsers
      - Windows.Registry.Sysinternals.Eulacheck
      - DetectRaptor.Generic.Detection.YaraWebshell
      - DetectRaptor.Windows.Detection.Amcache
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Bootloaders
      - DetectRaptor.Windows.Detection.Evtx
      - DetectRaptor.Windows.Detection.HijackLibsEnv
      - DetectRaptor.Windows.Detection.HijackLibsMFT
      - DetectRaptor.Windows.Detection.LolDriversMalicious
      - DetectRaptor.Windows.Detection.LolDriversVulnerable
      - DetectRaptor.Windows.Detection.MFT
      - DetectRaptor.Windows.Detection.NamedPipes
      - DetectRaptor.Windows.Detection.Powershell.ISEAutoSave
      - DetectRaptor.Windows.Detection.Powershell.PSReadline
      - DetectRaptor.Windows.Detection.Webhistory
      - DetectRaptor.Windows.Detection.YaraProcessWin
      - DetectRaptor.Windows.Detection.ZoneIdentifier

  - id: velociraptor_full_collection
    name: "Velociraptor: Full Collection"
    description: "Maximum artifact collection for deep forensic analysis (53 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 1080
      timeout: 43200
      cpu_limit: 90
      # Flow-level resource limits — see velociraptor_quick_scan for notes.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
    artifacts:
      # Detection
      - DetectRaptor.Windows.Detection.Amcache
      - DetectRaptor.Windows.Detection.NamedPipes
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Bootloaders
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.Evtx
      - DetectRaptor.Windows.Detection.HijackLibsEnv
      - DetectRaptor.Windows.Detection.HijackLibsMFT
      - DetectRaptor.Windows.Detection.LolDriversMalicious
      - DetectRaptor.Windows.Detection.LolDriversVulnerable
      - DetectRaptor.Windows.Detection.MFT
      - DetectRaptor.Windows.Detection.Powershell.ISEAutoSave
      - DetectRaptor.Windows.Detection.Powershell.PSReadline
      - DetectRaptor.Windows.Detection.Webhistory
      - DetectRaptor.Windows.Detection.YaraProcessWin
      - DetectRaptor.Windows.Detection.ZoneIdentifier
      - DetectRaptor.Generic.Detection.YaraWebshell
      # Forensic
      - Generic.Forensic.SQLiteHunter
      - Generic.System.Pstree
      - Windows.NTFS.MFT
      - Windows.Forensics.Usn
      - Windows.Forensics.Prefetch
      - Windows.Forensics.SRUM
      - Windows.Forensics.Shellbags
      - Windows.Forensics.RecycleBin
      - Windows.Forensics.JumpLists
      - Windows.Forensics.RecentApps
      - Windows.Forensics.Timeline
      - Windows.Forensics.SAM
      - Windows.Forensics.Lnk
