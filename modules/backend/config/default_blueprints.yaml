# ============================================================================
# Timesketch Blueprints
# ============================================================================
timesketch:

  - id: timesketch_full_triage
    name: "Full Triage"
    description: "Comprehensive triage collection with full Windows parsing"
    is_default: true
    settings:
      kape_target: "_KapeTriage"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 10000
      cpu_limit: 80
      # KAPE artifact parameters (passed to env=dict() in collect_client VQL).
      # Defaults are deliberately permissive on size + endpoint-friendly on
      # hashing; override per-blueprint if a workflow needs different behavior.
      kape_max_file_size: 10737418240      # 10 GiB — fixes the 100 MB default
                                           # that silently dropped big files
      kape_max_hash_size: 0                # 0 = hash NOTHING on the endpoint
                                           # (matches plaso_hasher: "none").
                                           # Bump to e.g. 104857600 for hashing
                                           # under 100 MB.
      kape_collection_policy: "ExcludeSigned"   # Skip files with valid trusted
                                                # signatures — typical 5-20×
                                                # collection size reduction.
      # Flow-level resource limits (passed as collect_client args). Overrides
      # the historical 1 GiB / 1 M-row hardcoded ceilings that bit us today.
      flow_max_rows: 10000000              # 10 M rows
      flow_max_logs: 1000000               # 1 M log lines
      flow_max_upload_mb: 51200            # 50 GiB total upload per flow

  - id: timesketch_event_logs
    name: "Event Logs Only"
    description: "Windows Event Logs collection with fast winevtx parsing"
    is_default: true
    settings:
      kape_target: "EventLogs"
      plaso_parser: "winevtx"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 10000
      cpu_limit: 80
      # KAPE artifact parameters — see timesketch_full_triage above for notes.
      kape_max_file_size: 10737418240
      kape_max_hash_size: 0
      kape_collection_policy: "ExcludeSigned"
      # Flow-level resource limits.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200

  - id: timesketch_basic_collection
    name: "Basic Collection"
    description: "Basic artifacts collection for quick analysis"
    is_default: true
    settings:
      kape_target: "_BasicCollection"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 10000
      cpu_limit: 80
      # KAPE artifact parameters — see timesketch_full_triage above for notes.
      kape_max_file_size: 10737418240
      kape_max_hash_size: 0
      kape_collection_policy: "ExcludeSigned"
      # Flow-level resource limits.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200

# ============================================================================
# Azure Security Blueprints
# ============================================================================
azure:

  - id: azure_quick_scan
    name: "Quick Scan"
    description: "Fast check of sign-in and audit logs (7 days)"
    is_default: true
    settings:
      sources:
        - signin_logs
        - audit_logs
      time_range_days: 7
      min_severity: low

  - id: azure_full_investigation
    name: "Full Investigation"
    description: "Complete Azure security analysis with all available sources (30 days)"
    is_default: true
    settings:
      sources:
        - all
      time_range_days: 30
      min_severity: informational

  - id: azure_identity_focus
    name: "Identity Focus"
    description: "Focus on authentication and identity threats - sign-ins and audit"
    is_default: true
    settings:
      sources:
        - signin_logs
        - audit_logs
        - risky_signins
      time_range_days: 14
      min_severity: low

  - id: azure_persistence_hunt
    name: "Persistence Hunt"
    description: "Hunt for persistence mechanisms - service principals and federation"
    is_default: true
    settings:
      sources:
        - audit_logs
        - activity_logs
        - unified_audit
      time_range_days: 30
      min_severity: low
