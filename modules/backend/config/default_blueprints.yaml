  # --------------------------------------------------------------------------
  # AGENTIC BLUEPRINTS (LLM-optimized detection)
  # --------------------------------------------------------------------------

  # CVE Scan inputs — the four artifacts the on-prem CVE Scan tab needs.
  # Operators dispatch this hunt (manually or via the CVE Scan tab's
  # "Run from Velociraptor" mode), then the tab pulls the result CSVs
  # and runs them through the NVD lookup pipeline.
  - id: cve_management
    name: "[CVE] CVE Management Collection"
    description: "Collects the four artifacts the CVE Scan tab consumes (installed programs + DetectRaptor app/LolRM tables + OS version)"
    is_default: true
    # Conservative defaults — the hunt itself stays open long enough to
    # catch hosts that come online late. The Run-from-Velociraptor UI
    # exposes a per-run "max wait" override that controls how long the
    # CVE Scan workflow polls for completion in chain mode.
    settings:
      hunt_expiry: 60          # minutes — match the per-client timeout
      timeout: 3600            # seconds (1h)
      cpu_limit: 80
      flow_max_rows: 5000000
      flow_max_logs: 500000
      flow_max_upload_mb: 10240
    artifacts:
      - Windows.Sys.Programs
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.LolRMM
      - Generic.Client.Info

  - id: agentic_quick_wins
    name: "[Agentic] Quick Wins"
    description: "Low-volume detection artifacts for fast analysis (11 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 720
      timeout: 3600
      cpu_limit: 90
      # Flow-level resource limits — see velociraptor_quick_scan for notes.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
    artifacts:
      - Windows.Hayabusa.Rules
      - Windows.Detection.Malfind
      - Windows.EventLogs.RDPAuth
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Powershell.PSReadline
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.Evtx
      - DetectRaptor.Windows.Detection.MFT
      - Windows.System.UntrustedBinaries
      - Generic.System.Pstree
      - Windows.Forensics.SAM

  - id: agentic_quick_wins_extended
    name: "[Agentic] Quick Wins Extended"
    description: "Extended detection with program execution, C2, and browser artifacts (15 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 720
      timeout: 3600
      cpu_limit: 90
      # Flow-level resource limits — see velociraptor_quick_scan for notes.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
    artifacts:
      # Core Detection
      - Windows.Hayabusa.Rules
      - Windows.Detection.Malfind
      - DetectRaptor.Windows.Detection.Evtx
      - DetectRaptor.Windows.Detection.MFT
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.Powershell.PSReadline
      # Program Execution
      - DetectRaptor.Windows.Detection.Amcache
      # C2/Network
      - DetectRaptor.Windows.Detection.NamedPipes
      - DetectRaptor.Windows.Detection.Webhistory
      # Context
      - Windows.EventLogs.RDPAuth
      - Windows.System.UntrustedBinaries
      - Generic.System.Pstree
      - Windows.Forensics.SAM
      - Windows.Forensics.Lnk

# ============================================================================
# Timesketch Blueprints
# ============================================================================
timesketch:

  - id: timesketch_full_triage
    name: "Full Triage"
    description: "Comprehensive triage collection with full Windows parsing"
    is_default: true
    settings:
      kape_target: "_KapeTriage"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 100000
      cpu_limit: 80
      # KAPE artifact parameters (passed to env=dict() in collect_client VQL).
      # Defaults are deliberately permissive on size + endpoint-friendly on
      # hashing; override per-blueprint if a workflow needs different behavior.
      kape_max_file_size: 10737418240      # 10 GiB — fixes the 100 MB default
                                           # that silently dropped big files
      kape_max_hash_size: 0                # 0 = hash NOTHING on the endpoint
                                           # (matches plaso_hasher: "none").
                                           # Bump to e.g. 104857600 for hashing
                                           # under 100 MB.
      kape_collection_policy: "ExcludeSigned"   # Skip files with valid trusted
                                                # signatures — typical 5-20×
                                                # collection size reduction.
      # Flow-level resource limits (passed as collect_client args). Overrides
      # the historical 1 GiB / 1 M-row hardcoded ceilings that bit us today.
      flow_max_rows: 10000000              # 10 M rows
      flow_max_logs: 1000000               # 1 M log lines
      flow_max_upload_mb: 51200            # 50 GiB total upload per flow
      # How long to wait for Timesketch to finish indexing the .plaso file
      # after upload completes. Old hardcoded 10000s (~2.8 h) was way too
      # tight for big collections. 3 days covers a 50 GB KAPE collection
      # being indexed on a busy OpenSearch instance with room to spare.
      timesketch_processing_timeout: 259200   # 3 days, in seconds

  - id: timesketch_event_logs
    name: "Event Logs Only"
    description: "Windows Event Logs collection with fast winevtx parsing"
    is_default: true
    settings:
      kape_target: "EventLogs"
      plaso_parser: "winevtx"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 100000
      cpu_limit: 80
      # KAPE artifact parameters — see timesketch_full_triage above for notes.
      kape_max_file_size: 10737418240
      kape_max_hash_size: 0
      kape_collection_policy: "ExcludeSigned"
      # Flow-level resource limits.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
      # See timesketch_full_triage above.
      timesketch_processing_timeout: 259200   # 3 days

  - id: timesketch_basic_collection
    name: "Basic Collection"
    description: "Basic artifacts collection for quick analysis"
    is_default: true
    settings:
      kape_target: "_BasicCollection"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 100000
      cpu_limit: 80
      # KAPE artifact parameters — see timesketch_full_triage above for notes.
      kape_max_file_size: 10737418240
      kape_max_hash_size: 0
      kape_collection_policy: "ExcludeSigned"
      # Flow-level resource limits.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
      # See timesketch_full_triage above.
      timesketch_processing_timeout: 259200   # 3 days

# ============================================================================
# Azure Security Blueprints
# ============================================================================
azure:

  - id: azure_quick_scan
    name: "Quick Scan"
    description: "Fast check of sign-in and audit logs (7 days)"
    is_default: true
    settings:
      sources:
        - signin_logs
        - audit_logs
      time_range_days: 7
      min_severity: low

  - id: azure_full_investigation
    name: "Full Investigation"
    description: "Complete Azure security analysis with all available sources (30 days)"
    is_default: true
    settings:
      sources:
        - all
      time_range_days: 30
      min_severity: informational

  - id: azure_identity_focus
    name: "Identity Focus"
    description: "Focus on authentication and identity threats - sign-ins and audit"
    is_default: true
    settings:
      sources:
        - signin_logs
        - audit_logs
        - risky_signins
      time_range_days: 14
      min_severity: low

  - id: azure_persistence_hunt
    name: "Persistence Hunt"
    description: "Hunt for persistence mechanisms - service principals and federation"
    is_default: true
    settings:
      sources:
        - audit_logs
        - activity_logs
        - unified_audit
      time_range_days: 30
      min_severity: low


# ============================================================================
# Memory Forensics Blueprints
# ============================================================================
# Three modes that share the same Velociraptor acquisition + VolWeb
# extraction backbone but differ in what gets fed to the LLM:
#
#   * memory_layered_default     — both Vol3 plugins AND yarascan (default)
#   * memory_yara_only_triage    — yarascan only; ~20x cheaper LLM bill
#   * memory_plugin_only         — Vol3 plugins only; behavioural context
#                                  without a signature corpus
#
# The 12-plugin curated set (excludes HollowProcesses — known to take
# 12+ min on a 5 GB dump) is the empirically validated sweet spot from
# the PoC at ~/volweb-poc/.
memory:

  - id: memory_layered_default
    name: "Layered (recommended)"
    description: "Both Vol3 plugins AND yarascan, fed to the LLM with a tiered prompt. Best for single-host deep analysis — attributes YARA hits to specific PIDs."
    is_default: true
    settings:
      mode: layered
      plugin_set:
        - volatility3.plugins.windows.pslist.PsList
        - volatility3.plugins.windows.psscan.PsScan
        - volatility3.plugins.windows.pstree.PsTree
        - volatility3.plugins.windows.cmdline.CmdLine
        - volatility3.plugins.windows.dlllist.DllList
        - volatility3.plugins.windows.malfind.Malfind
        - volatility3.plugins.windows.svcscan.SvcScan
        - volatility3.plugins.windows.mutantscan.MutantScan
        - volatility3.plugins.windows.netscan.NetScan
        - volatility3.plugins.windows.netstat.NetStat
        - volatility3.plugins.windows.registry.userassist.UserAssist
        - volatility3.plugins.windows.registry.printkey.PrintKey
      yara_rulesets: []           # empty = all seeded
      compression: "None"         # MUST stay None — see services/memory/defaults.py
      max_bytes: 68719476736      # 64 GiB cap
      cpu_limit: 80

  - id: memory_yara_only_triage
    name: "YARA-only (scale-out triage)"
    description: "Yarascan hits only, ~20x cheaper LLM bill. Use for fan-out hunting across many hosts. Graduates to layered analysis only on hosts with multiple distinct rule families."
    is_default: true
    settings:
      mode: yara
      plugin_set: []              # plugin extraction is skipped in this mode
      yara_rulesets: []
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  - id: memory_plugin_only
    name: "Plugins only (no signatures)"
    description: "Vol3 plugin output only — behavioural context without a signature corpus. Use when YARA would add no signal (e.g. zero-day or living-off-the-land suspected) or when no LLM API key is configured."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.pslist.PsList
        - volatility3.plugins.windows.psscan.PsScan
        - volatility3.plugins.windows.pstree.PsTree
        - volatility3.plugins.windows.cmdline.CmdLine
        - volatility3.plugins.windows.dlllist.DllList
        - volatility3.plugins.windows.malfind.Malfind
        - volatility3.plugins.windows.svcscan.SvcScan
        - volatility3.plugins.windows.mutantscan.MutantScan
        - volatility3.plugins.windows.netscan.NetScan
        - volatility3.plugins.windows.netstat.NetStat
        - volatility3.plugins.windows.registry.userassist.UserAssist
        - volatility3.plugins.windows.registry.printkey.PrintKey
      yara_rulesets: []
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80
