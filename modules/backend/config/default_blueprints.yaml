      # Registry
      - Windows.Registry.AppCompatCache
      - Windows.Registry.UserAssist
      - Windows.Registry.Sysinternals.Eulacheck
      - Windows.Registry.RecentDocs
      # Event logs
      - Windows.EventLogs.RDPAuth
      - Windows.EventLogs.ScheduledTasks
      - Windows.EventLogs.Evtx
      # System
      - Windows.System.DNSCache
      - Windows.System.UntrustedBinaries
      - Windows.System.Services
      - Windows.System.TaskScheduler
      - Windows.Sysinternals.Autoruns
      # Network
      - Windows.Network.NetstatEnriched
      - Windows.Network.ArpCache
      # Applications
      - Windows.Applications.Chrome.History
      - Windows.Applications.Edge.History
      - Windows.Analysis.EvidenceOfDownload
      - Windows.Nirsoft.LastActivityView
      # Attack detection
      - Windows.Attack.UnexpectedImagePath
      - Windows.Detection.Yara.Process
      - Windows.Sys.AllUsers

  # --------------------------------------------------------------------------
  # AGENTIC BLUEPRINTS (LLM-optimized detection)
  # --------------------------------------------------------------------------

  - id: agentic_quick_wins
    name: "Velociraptor Agentic QuickWins Windows"
    description: "The agentic detection set — program execution, C2, defense-evasion, persistence & identity (19 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 720
      timeout: 3600
      cpu_limit: 90
      # Flow-level resource limits — see velociraptor_quick_scan for notes.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
    artifacts:
      # Core Detection
      - Windows.Hayabusa.Rules
      - Windows.Detection.Malfind
      - DetectRaptor.Windows.Detection.Evtx
      - DetectRaptor.Windows.Detection.MFT
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Applications
      - DetectRaptor.Windows.Detection.Powershell.PSReadline
      # Program Execution
      - DetectRaptor.Windows.Detection.Amcache
      # C2/Network
      - DetectRaptor.Windows.Detection.NamedPipes
      - DetectRaptor.Windows.Detection.Webhistory
      # Defense evasion / priv-esc (DLL sideload, BYOVD, bootkit)
      - DetectRaptor.Windows.Detection.HijackLibsMFT
      - DetectRaptor.Windows.Detection.HijackLibsEnv
      - DetectRaptor.Windows.Detection.LolDriversMalicious
      - DetectRaptor.Windows.Detection.Bootloaders
      # Persistence
      - Windows.Analysis.SuspiciousWMIConsumers
      # Context
      - Windows.Forensics.SAM
      # Authentication / lateral movement (domain hosts) + Kerberos abuse
      - Windows.EventLogs.CondensedAccountUsage
      - Windows.Kerberos.GoldenTicketTriage

  # --------------------------------------------------------------------------
  # LINUX BLUEPRINT
  # --------------------------------------------------------------------------
  # Dedicated Linux triage set. Every other blueprint above is Windows-centric;
  # building a collector from them for a Linux target used to fail (Windows-only
  # VQL: Symbol Memory/TokenIsElevated not found, users()/token() not implemented,
  # ntfs/registry accessors absent) and broad Generic scanners crawled the whole
  # filesystem. These artifacts all exist + collect on a Linux endpoint (verified
  # against the shipped velociraptor binary) and avoid the filesystem-wide scanners.
  - id: agentic_linux_triage
    name: "Velociraptor Agentic QuickWins Linux"
    description: "Linux endpoint triage — processes, persistence, accounts, logs (17 artifacts)"
    is_default: true
    os: linux
    settings:
      hunt_expiry: 720
      timeout: 3600
      cpu_limit: 90
      # Flow-level resource limits — see velociraptor_quick_scan for notes.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
    artifacts:
      # Processes / network
      - Linux.Sys.Pslist
      - Generic.System.Pstree
      - Linux.Network.NetstatEnriched
      - Linux.Proc.Arp
      # Persistence
      - Linux.Sys.Services
      - Linux.Sys.Crontab
      - Linux.Ssh.AuthorizedKeys
      - Linux.Ssh.KnownHosts
      # Execution evidence
      - Linux.Sys.BashHistory
      - Linux.Sys.LastUserLogin
      # Accounts / privilege
      - Linux.Sys.Users
      - Linux.Sys.Groups
      - Linux.Sys.SUID
      # Kernel / rootkits
      - Linux.Proc.Modules
      # Logs
      - Linux.Syslog.SSHLogin
      - Linux.Forensics.Journal
      # Packages
      - Linux.Debian.Packages

# ============================================================================
# Timesketch Blueprints
# ============================================================================
timesketch:

  - id: timesketch_full_triage
    name: "Forensic Timeline: Full Triage"
    description: "Comprehensive triage timeline collection with full Windows parsing"
    is_default: true
    settings:
      kape_target: "_KapeTriage"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 100000
      cpu_limit: 80
      # KAPE artifact parameters (passed to env=dict() in collect_client VQL).
      # Defaults are deliberately permissive on size + endpoint-friendly on
      # hashing; override per-blueprint if a workflow needs different behavior.
      kape_max_file_size: 10737418240      # 10 GiB — fixes the 100 MB default
                                           # that silently dropped big files
      kape_max_hash_size: 0                # 0 = hash NOTHING on the endpoint
                                           # (matches plaso_hasher: "none").
                                           # Bump to e.g. 104857600 for hashing
                                           # under 100 MB.
      kape_collection_policy: "ExcludeSigned"   # Skip files with valid trusted
                                                # signatures — typical 5-20×
                                                # collection size reduction.
      # Flow-level resource limits (passed as collect_client args). Overrides
      # the historical 1 GiB / 1 M-row hardcoded ceilings that bit us today.
      flow_max_rows: 10000000              # 10 M rows
      flow_max_logs: 1000000               # 1 M log lines
      flow_max_upload_mb: 51200            # 50 GiB total upload per flow
      # How long to wait for Timesketch to finish indexing the .plaso file
      # after upload completes. Old hardcoded 10000s (~2.8 h) was way too
      # tight for big collections. 3 days covers a 50 GB KAPE collection
      # being indexed on a busy OpenSearch instance with room to spare.
      timesketch_processing_timeout: 259200   # 3 days, in seconds

  - id: timesketch_event_logs
    name: "Forensic Timeline: Event Logs Only"
    description: "Windows Event Logs timeline collection with fast winevtx parsing"
    is_default: true
    settings:
      kape_target: "EventLogs"
      plaso_parser: "winevtx"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 100000
      cpu_limit: 80
      # KAPE artifact parameters — see timesketch_full_triage above for notes.
      kape_max_file_size: 10737418240
      kape_max_hash_size: 0
      kape_collection_policy: "ExcludeSigned"
      # Flow-level resource limits.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
      # See timesketch_full_triage above.
      timesketch_processing_timeout: 259200   # 3 days

  - id: timesketch_basic_collection
    name: "Forensic Timeline: Basic Collection"
    description: "Basic artifacts timeline collection for quick analysis"
    is_default: true
    settings:
      kape_target: "_BasicCollection"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 100000
      cpu_limit: 80
      # KAPE artifact parameters — see timesketch_full_triage above for notes.
      kape_max_file_size: 10737418240
      kape_max_hash_size: 0
      kape_collection_policy: "ExcludeSigned"
      # Flow-level resource limits.
      flow_max_rows: 10000000
      flow_max_logs: 1000000
      flow_max_upload_mb: 51200
      # See timesketch_full_triage above.
      timesketch_processing_timeout: 259200   # 3 days

# ============================================================================
# Azure Security Blueprints
# ============================================================================
azure:

  - id: azure_quick_scan
    name: "Quick Scan"
    description: "Fast check of sign-in and audit logs (7 days)"
    is_default: true
    settings:
      sources:
        - signin_logs
        - audit_logs
      time_range_days: 7
      min_severity: low

  - id: azure_full_investigation
    name: "Full Investigation"
    description: "Complete Azure security analysis with all available sources (30 days)"
    is_default: true
    settings:
      sources:
        - all
      time_range_days: 30
      min_severity: informational

  - id: azure_identity_focus
    name: "Identity Focus"
    description: "Focus on authentication and identity threats - sign-ins and audit"
    is_default: true
    settings:
      sources:
        - signin_logs
        - audit_logs
        - risky_signins
      time_range_days: 14
      min_severity: low

  - id: azure_persistence_hunt
    name: "Persistence Hunt"
    description: "Hunt for persistence mechanisms - service principals and federation"
    is_default: true
    settings:
      sources:
        - audit_logs
        - activity_logs
        - unified_audit
      time_range_days: 30
      min_severity: low


# ============================================================================
# Memory Forensics Blueprints
# ============================================================================
# Each blueprint defines what to extract (`plugin_set`) and, optionally,
# how to SCOPE the YARA scan (`yara_categories`). Whether yarascan runs
# at all is still the operator's separate decision in the Memory page
# (the "Include YARA" checkbox); `yara_categories` only narrows WHICH
# rules run when it does.
#
# `yara_categories` (threat-type tokens — see services/memory/defaults.py
# YARA_CATEGORY_KEYWORDS: ransomware, hacktool, webshell, apt, trojan,
# exploit, stealer) cuts the 1,467-rule full corpus to a focused subset:
# faster, lighter on the yarascan worker, fewer false positives — at the
# cost of breadth. So only FOCUSED blueprints scope; the broad-net ones
# (Curated standard, the dedicated YARA-only sweep, the all-plugins deep
# dive) leave it empty (`[]`) = scan the full corpus. An unknown token or
# a zero-rule match fails open to the full corpus (a memory sweep that
# scans nothing is worse than one that scans everything). The `mode:`
# field stays a schema-only placeholder the runtime overrides.
#
# The 12-plugin curated set (excludes HollowProcesses — known to take
# 12+ min on a 5 GB dump) is the empirically validated sweet spot from
# the PoC at ~/volweb-poc/.
memory:

  - id: memory_layered_default
    name: "Memory Analysis: Curated standard (recommended)"
    description: "12-plugin curated set covering process discovery, persistence, network, and registry — the empirically-validated sweet spot from the PoC. Excludes HollowProcesses (12+ min on a 5 GB dump)."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.pslist.PsList
        - volatility3.plugins.windows.psscan.PsScan
        - volatility3.plugins.windows.pstree.PsTree
        - volatility3.plugins.windows.cmdline.CmdLine
        - volatility3.plugins.windows.dlllist.DllList
        - volatility3.plugins.windows.malfind.Malfind
        - volatility3.plugins.windows.svcscan.SvcScan
        - volatility3.plugins.windows.mutantscan.MutantScan
        - volatility3.plugins.windows.netscan.NetScan
        - volatility3.plugins.windows.netstat.NetStat
        - volatility3.plugins.windows.registry.userassist.UserAssist
        - volatility3.plugins.windows.registry.printkey.PrintKey
      yara_rulesets: []
      yara_categories: []          # broad-net: scan the full corpus (recommended default)
      compression: "None"         # MUST stay None — see services/memory/defaults.py
      max_bytes: 68719476736      # 64 GiB cap
      cpu_limit: 80

  - id: memory_yara_only_triage
    name: "Memory Analysis: Empty (no plugins)"
    description: "Empty plugin set — skips Vol3 extraction entirely. Pair with the 'Include YARA' checkbox in the Memory page for fast YARA-only triage (~20× cheaper across many hosts) before graduating suspicious endpoints to a real plugin blueprint."
    is_default: true
    settings:
      mode: plugin
      plugin_set: []
      yara_rulesets: []
      yara_categories: []          # broad-net: dedicated YARA sweep wants full coverage
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  # --------------------------------------------------------------------------
  # Speed-tiered triage (orthogonal to scenario-specific blueprints below)
  # --------------------------------------------------------------------------

  - id: memory_quick_wins
    name: "Memory Analysis: Quick Wins (fast triage)"
    description: "5 fastest-signal plugins — catches process injection + live network state in under a minute. Triage tool when fanning out across many hosts. Misses persistence + credentials by design."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.pslist.PsList
        - volatility3.plugins.windows.cmdline.CmdLine
        - volatility3.plugins.windows.malfind.Malfind
        - volatility3.plugins.windows.netscan.NetScan
        - volatility3.plugins.windows.netstat.NetStat
      yara_rulesets: []
      # Fast triage: "is this box owned right now" — the high-signal,
      # actively-malicious families. Skips the APT + exploit/vuln long
      # tail to keep the scan quick.
      yara_categories: [ransomware, hacktool, trojan, webshell]
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  - id: memory_all_plugins
    name: "Memory Analysis: All plugins (deep dive)"
    description: "Every plugin VolWeb advertises for this dump — resolved at runtime via volweb.list_plugins(). Includes HollowProcesses (12+ min by itself). Use only after triage has flagged a host worth the wall-clock."
    is_default: true
    settings:
      mode: plugin
      # `['*']` is a marker — pipeline.py expands it at dispatch time by
      # asking VolWeb which plugins are available for this evidence,
      # so the set stays correct as VolWeb adds/removes plugins
      # without us hardcoding 60+ class paths here.
      plugin_set:
        - '*'
      yara_rulesets: []
      yara_categories: []          # broad-net: deep dive scans the full corpus (the "run all")
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  # --------------------------------------------------------------------------
  # Scenario blueprints — one per investigation focus. Each one is the
  # "deep" variant (covers the full kill chain for that scenario). Pair
  # with the operator's "Include YARA" checkbox in the Memory page when
  # signature-based detection is also wanted.
  # --------------------------------------------------------------------------

  - id: memory_process_deep
    name: "Memory Analysis: Process Anomalies"
    description: "Process discovery + lineage + DLL inventory, code-injection finder (Malfind), and the expensive HollowProcesses + Hollowfind structural checks. ~6 min runtime — worth it on a confirmed-bad host."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.pslist.PsList
        - volatility3.plugins.windows.psscan.PsScan
        - volatility3.plugins.windows.pstree.PsTree
        - volatility3.plugins.windows.cmdline.CmdLine
        - volatility3.plugins.windows.dlllist.DllList
        - volatility3.plugins.windows.handles.Handles
        - volatility3.plugins.windows.malfind.Malfind
        - volatility3.plugins.windows.hollowfind.Hollowfind
        - volatility3.plugins.windows.hollowprocesses.HollowProcesses
      yara_rulesets: []
      # Process anomalies: in-memory implants, injected code, offensive
      # tooling staged in a process.
      yara_categories: [trojan, hacktool, apt]
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  - id: memory_persistence_deep
    name: "Memory Analysis: Persistence"
    description: "Services, named mutexes, loaded kernel modules, execution-history (UserAssist, Run/RunOnce registry keys) and kernel-level hooks (DriverScan, Callbacks, SSDT) — catches persistence techniques that survive a reboot. ~3 min."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.svcscan.SvcScan
        - volatility3.plugins.windows.mutantscan.MutantScan
        - volatility3.plugins.windows.modules.Modules
        - volatility3.plugins.windows.registry.userassist.UserAssist
        - volatility3.plugins.windows.registry.printkey.PrintKey
        - volatility3.plugins.windows.driverscan.DriverScan
        - volatility3.plugins.windows.callbacks.Callbacks
        - volatility3.plugins.windows.ssdt.SSDT
      yara_rulesets: []
      # Persistence: backdoors/implants and the offensive tooling that
      # installs them.
      yara_categories: [trojan, apt, hacktool]
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  - id: memory_network_deep
    name: "Memory Analysis: Network"
    description: "Live TCP/UDP connections + listening sockets, correlated back to processes — pslist + cmdline + dlllist so the LLM can attribute each connection to a process and DLL set. ~2 min."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.netscan.NetScan
        - volatility3.plugins.windows.netstat.NetStat
        - volatility3.plugins.windows.pslist.PsList
        - volatility3.plugins.windows.cmdline.CmdLine
        - volatility3.plugins.windows.dlllist.DllList
      yara_rulesets: []
      # Network: C2 — remote-access trojans, backdoors, and APT/offensive
      # frameworks (Cobalt Strike, Metasploit) that own the connections.
      yara_categories: [trojan, apt, hacktool]
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80

  - id: memory_credentials_deep
    name: "Memory Analysis: Credentials"
    description: "SAM hash extraction, cached domain credentials, plus LSA secrets (machine account, service creds). ~2 min. Bootkey-dependent so will fail cleanly on dumps from Win11 24H2+ that VolWeb can't decrypt yet."
    is_default: true
    settings:
      mode: plugin
      plugin_set:
        - volatility3.plugins.windows.hashdump.Hashdump
        - volatility3.plugins.windows.cachedump.Cachedump
        - volatility3.plugins.windows.lsadump.Lsadump
      yara_rulesets: []
      # Credentials: credential-theft tooling — Mimikatz/Rubeus and
      # info-stealers that harvest secrets from memory.
      yara_categories: [hacktool, stealer]
      compression: "None"
      max_bytes: 68719476736
      cpu_limit: 80
