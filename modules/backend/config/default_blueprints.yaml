      - Generic.System.Pstree

  - id: agentic_purple_team
    name: "[Agentic] Purple Team Detection"
    description: "Low-volume detection artifacts for purple team testing (11 artifacts)"
    is_default: true
    settings:
      hunt_expiry: 120
      timeout: 120
      cpu_limit: 80
    artifacts:
      - Windows.Hayabusa.Rules
      - Windows.Detection.Malfind
      - Windows.EventLogs.RDPAuth
      - DetectRaptor.Windows.Detection.BinaryRename
      - DetectRaptor.Windows.Detection.Powershell.PSReadline
