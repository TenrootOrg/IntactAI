# ============================================================================
# Reusable Settings Templates
# ============================================================================
default_settings:
  standard:
    hunt_expiry: 120
    timeout: 3600
    cpu_limit: 90

  quick:
    hunt_expiry: 120
    timeout: 120
    cpu_limit: 90

  timesketch_default:
    plaso_workers: 2
    plaso_hasher: "none"
    plaso_hasher_size: 100
    collection_timeout: 10000

# ============================================================================
# Velociraptor Blueprints
# ============================================================================
velociraptor:
  - id: velociraptor_quick_scan
    name: "[Velociraptor] Quick Scan"
    description: "Fast detection-focused scan for rapid assessment"
    is_default: true
    artifacts: $velociraptor_quick_scan
    settings: $quick

  - id: velociraptor_best_practice
    name: "[Velociraptor] BestPractice"
    description: "Curated best-practice artifact collection for thorough IR triage"
    is_default: true
    artifacts: $velociraptor_best_practice
    settings: $standard

  - id: velociraptor_full_collection
    name: "[Velociraptor] Full Collection"
    description: "Maximum artifact collection for deep forensic analysis"
    is_default: true
    artifacts: $velociraptor_full_collection
    settings:
      hunt_expiry: 180
      timeout: 7200
      cpu_limit: 90

# ============================================================================
# Agentic Blueprints
# ============================================================================
agentic:
  - id: agentic_test
    name: "[Agentic] Test (Quick)"
    description: "Fast test - forensically interesting artifacts that run in seconds"
    is_default: true
    artifacts: $agentic_test
    settings: $quick

  - id: agentic_quick_wins
    name: "[Agentic] Quick Wins"
    description: "Fast detection-focused scan with low data output"
    is_default: true
    artifacts: $agentic_quick_wins
    settings: $quick

  - id: agentic_standard
    name: "[Agentic] Standard"
    description: "Full detection suite optimized for LLM analysis"
    is_default: true
    artifacts: $agentic_standard
    settings: $standard

# ============================================================================
# Timesketch Blueprints
# ============================================================================
timesketch:
  - id: timesketch_full_triage
    name: "Full Triage"
    description: "Comprehensive KAPE triage collection with full Windows parsing"
    is_default: true
    settings:
      kape_target: "_KapeTriage"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 10000

  - id: timesketch_event_logs
    name: "Event Logs Only"
    description: "Windows Event Logs collection with fast winevtx parsing"
    is_default: true
    settings:
      kape_target: "EventLogs"
      plaso_parser: "winevtx"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 10000

  - id: timesketch_basic_collection
    name: "Basic Collection"
    description: "Basic artifacts collection for quick analysis"
    is_default: true
    settings:
      kape_target: "_BasicCollection"
      plaso_parser: "win7"
      plaso_workers: 2
      plaso_hasher: "none"
      plaso_hasher_size: 100
      collection_timeout: 10000
