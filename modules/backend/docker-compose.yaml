# Intact.AI Backend API
# Port: 5001

services:
  backend:
    container_name: intact_backend
    image: intact-backend:${BACKEND_VERSION:-1.0.0}
    # `intact-backend` is a private local image name. See the matching
    # comment in modules/velociraptor/docker-compose.yaml for why we
    # need pull_policy: build — same reason here.
    pull_policy: build
    build:
      context: ../..
      dockerfile: modules/backend/Dockerfile
    env_file:
      - .env
    environment:
      # These override .env if needed, but .env provides defaults
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT}
      - TIMESKETCH_HOST=${TIMESKETCH_HOST}
      - TIMESKETCH_USER=${TIMESKETCH_USER}
      - TIMESKETCH_PASS=${TIMESKETCH_PASS}
      - VELO_CONFIG_PATH=${VELO_CONFIG_PATH}
      - CONFIG_PATH=${CONFIG_PATH}
      # Host path for upgrade operations (Docker needs host paths for volume mounts)
      - INTACT_HOST_PATH=${INTACT_HOST_PATH:-/home/tenroot/intact}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw  # Docker socket for container access (rw for upgrades)
      - /tmp/plaso:/tmp/plaso  # Plaso output directory for Timesketch import
      - ../velociraptor/config:/app/config/velociraptor:ro  # Velociraptor API config
      - ../timesketch/config:/app/config/timesketch:rw  # Timesketch config (writable for LLM settings)
      - ../../config.yaml:/app/config.yaml:ro  # Main config file
      - ../../client_installers:/app/client_installers:rw  # Client installers (writable for MSI generation)
      - ../../data:/app/data  # SQLite database (intact.db) for workflows, configs, and reports
      - ../nginx/html/downloads:/app/downloads:rw  # Velociraptor binaries for offline collectors
      - ./app.py:/app/app.py:ro  # Mount app.py for live code updates
      - ./config.py:/app/config.py:ro  # Mount config.py for live code updates
      - ./services:/app/services:ro  # Mount services for live code updates
      - ./routes:/app/routes:ro  # Mount routes for live code updates
      - ./config/default_blueprints.yaml:/app/config/default_blueprints.yaml:ro  # Live blueprint updates
      - /app/logs  # Logs directory
      - upload_data:/data/uploads  # Shared volume for tus uploads
      # Shared memory-dump staging — same `intact_memory_dumps` docker
      # volume mounted into Velociraptor + VolWeb. Lets the backend's
      # memory pipeline coordinate (preflight disk check, cleanup) on
      # the same files the other two containers operate on. Created by
      # install.sh:ensure_shared_volumes() so it exists at compose-up
      # time on a fresh box.
      - memory_dumps_shared:/data/memory_dumps:rw
      # Persist run/report downloads + the last upgrade package on named volumes.
      # Without these they lived in the container's writable layer — bloating it and,
      # worse, getting WIPED on every container recreate (upgrade/redeploy), which
      # silently dropped run results in /data/downloads. Volumes = durable + de-bloated.
      - report_downloads:/data/downloads:rw
      - upgrade_packages:/data/upgrade_packages:rw
      - ../..:/app/workdir:rw  # Intact.AI root for upgrade operations
      # Also mount at the install's real host path so `docker run -v ${host}:...`
      # calls issued from inside the backend (Plaso, DFIR-O365RC, etc.) resolve
      # correctly. install.sh exports INTACT_HOST_PATH=$SCRIPT_DIR so this works
      # from any install location, not just /home/tenroot/intact.
      - ${INTACT_HOST_PATH:-/home/tenroot/intact}:${INTACT_HOST_PATH:-/home/tenroot/intact}:rw
      - /opt/sigma-rules:/opt/sigma-rules:ro  # SIGMA detection rules for Azure automation
    ports:
      - "5001:5001"
    restart: unless-stopped
    # Flask + celery workers cache one SQLite connection per worker
    # thread in threading.local() (services/storage/base.py,
    # services/cve_scan/local_db.py). Over a long-lived backend the
    # thread pool grows under load and each thread holds a conn open
    # against intact.db, intact.db-wal, cves.db, cves.db-wal — easily
    # 1000+ FDs total. The Docker default of 1024 soft-nofile gets
    # exhausted and the backend wedges with "Too many open files",
    # spinning at 100% CPU retrying every operation while the UI
    # times out. 65536 leaves comfortable headroom; the hard limit
    # stays at the kernel default (524288).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - intact_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # tusd - Resumable upload server (tus protocol)
  tusd:
    container_name: intact_tusd
    # Pinned (was :latest) so the upload server is reproducible across
    # installs/upgrades. Bump deliberately when upgrading tus support.
    image: tusproject/tusd:v2.9.2
    restart: unless-stopped
    user: root  # Run as root to write to shared volume
    command:
      - -upload-dir=/data/uploads
      - -hooks-http=http://intact_backend:5001/api/uploads/hook
      - -hooks-enabled-events=pre-create,post-create,post-receive,post-finish
      - -behind-proxy
    volumes:
      - upload_data:/data/uploads
    networks:
      - intact_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  upload_data:
  report_downloads:      # /data/downloads — run/report downloads (was ephemeral)
  upgrade_packages:      # /data/upgrade_packages — last upgrade package (was ephemeral)
  # Shared memory-dump staging — pre-created externally by install.sh
  # so the backend can come up even when Velociraptor + VolWeb composes
  # haven't run yet on a fresh install.
  memory_dumps_shared:
    external: true
    name: intact_memory_dumps

networks:
  intact_network:
    external: true
