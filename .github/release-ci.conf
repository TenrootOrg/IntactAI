# WHICH WORKFLOW BUILDS A RELEASE. Edit this line, commit, push.
#
#   is_new_CI = TRUE    -> per-module assets  (build-release-assets.yml)
#   is_new_CI = FALSE   -> single-asset bundle (build-release-package.yml)
#
# Exactly one BUILDS. Both still APPEAR in the Actions list on every release,
# and that is expected: GitHub cannot consult a file before starting a run, so
# both workflows start, both read THIS file in their `gate` job, and the one
# that is not selected skips its build and finishes as a no-op. Its job summary
# says "STOOD DOWN -- nothing to cancel". Do not cancel it by hand; cancelling
# is indistinguishable from a failed release in the run history.
#
# Only one may build because they upload to the same release, and the
# per-module one re-drafts it at the start and un-drafts it at the end -- so a
# concurrent legacy job could be attaching its 5.5 GB bundle while the release
# flips public underneath it.
#
# The gate reads this file from the DEFAULT BRANCH, not from the release tag.
# It used to read the tag (checkout's default ref on a release event), which
# meant every tag cut before this file existed fell through to the default and
# editing the switch here changed nothing at all.
#
# FALSE is what a stuck intact-20260726 box needs: the single bundle is the only
# shape it can read. TRUE is what every current box prefers and what a customer
# release should ship.
#
# Running either by hand (Actions -> Run workflow) ignores this file, so you can
# always produce the other shape for one tag without flipping it.

is_new_CI = FALSE
