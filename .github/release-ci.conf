# WHICH WORKFLOW BUILDS A RELEASE. Edit this line, commit, push.
#
#   is_new_CI = TRUE    -> per-module assets  (build-release-assets.yml)
#   is_new_CI = FALSE   -> single-asset bundle (build-release-package.yml)
#
# Exactly one runs, always. Both workflows read THIS file and gate on it, so
# there is no setting -- and no half-finished edit -- that starts both. They
# upload to the same release, and the per-module one re-drafts it at the start
# and un-drafts it at the end, so a concurrent legacy job can be attaching its
# 5.5 GB bundle while the release flips public underneath it.
#
# FALSE is what a stuck intact-20260726 box needs: the single bundle is the only
# shape it can read. TRUE is what every current box prefers and what a customer
# release should ship.
#
# Running either by hand (Actions -> Run workflow) ignores this file, so you can
# always produce the other shape for one tag without flipping it.

is_new_CI = TRUE
