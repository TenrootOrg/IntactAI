name: test

# Zero-dependency test suite for install.sh/lib/*.sh: bash -n, shellcheck,
# and tests/run_tests.sh (plain bash + stdlib python3, nothing to install).
# Runs on the same triggers as secret-scan.yml.

# RESTORED 2026-09-06, per the note this replaces. The triggers were turned off
# on 2026-08-12 "while the 0726 -> 0811 customer failure is being worked",
# because the suite was reporting red during release work, and that note asked
# for them back "when the release work settles -- a suite nobody runs stops being
# true within about a week". It was three and a half weeks, and the suite is
# green (864 passing).
#
# It mattered: for those weeks the ONLY automatic check on a push was
# secret-scan, so every green tick proved that no credential leaked and nothing
# else. `development` is dropped from the branch list -- that branch no longer
# exists.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax-check every shell script
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/upgrade.sh
          for f in lib/*.sh lib/upgrade/*.sh scripts/*.sh scripts/dev/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck (informational)
        # Full-severity output for visibility. NOT the gate -- this codebase
        # carries ~125 pre-existing warning/info/style findings (104 of them
        # SC2155, "declare and assign separately", across code that predates
        # this workflow). Fixing those is a large, unrelated cleanup this
        # workflow isn't the place to force; see the next step for what
        # actually blocks the build.
        run: |
          shellcheck install.sh lib/*.sh lib/upgrade/*.sh \
                     scripts/prepare_package.sh scripts/*.sh || true

      - name: "shellcheck (gate: errors only)"
        run: |
          shellcheck --severity=error install.sh lib/*.sh lib/upgrade/*.sh \
                     scripts/prepare_package.sh scripts/*.sh

      - name: Run the test suite
        run: bash tests/run_tests.sh
