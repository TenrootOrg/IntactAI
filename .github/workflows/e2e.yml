name: e2e (manual)

# Install a whole appliance on a runner, enrol a Velociraptor client on it, drive
# the backend over real HTTP, and report. Nothing else in this repo does this:
# the other workflows build and publish releases, and the test suite is static.
# Every bug found in the 20260818 release was found by a hand-run install like
# this one, which is the argument for automating it.
#
# MANUAL ONLY, and deliberately so. A run costs a whole VM for up to three hours
# and destroys everything on it. It must never fire from a push, a PR or a
# release.
#
# BEFORE IT CAN BE RUN AT ALL: GitHub only exposes workflow_dispatch for files
# that exist on the DEFAULT branch. While this file lives only on a side branch
# the API answers 404 and the "Run workflow" button never appears -- verified,
# not assumed. Once it is on main you may still dispatch it against any ref, and
# the definition used is the one on the ref you pick.
#
# WHAT A GREEN RUN DOES AND DOES NOT PROVE. install.sh takes its service images
# from a published RELEASE and refuses to build them (lib/modules/backend.sh),
# so this exercises the chosen ref's installer, libraries, compose files, nginx
# config and version pins against the release's containers -- unless
# `build_images` rebuilds them. Only two images in the product are first-party
# (backend, velociraptor); everything else is upstream software at versions the
# ref itself pins. The report's Provenance section says which was which, and the
# summary repeats it, because "green on this branch" is a stronger claim than
# the default configuration supports.

on:
  # Pushing to this one branch is the RUN button while e2e.yml is not on main.
  # The default-branch rule above applies only to workflow_dispatch; a push
  # event runs the workflow file from the branch that was pushed, so a dedicated
  # trigger branch gives manual-feeling runs with main untouched.
  #
  # To start a run:   git push --force origin development:e2e-trigger
  # Every input then takes its default (see the `|| ` fallbacks below), because
  # a push event carries no inputs.
  #
  # TEMPORARY. Delete this trigger once the file reaches main and
  # workflow_dispatch works properly, or every push to the branch spends a VM.
  push:
    branches: [e2e-trigger]

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to install and test (e.g. development, main)"
        required: true
        default: development
      runner:
        description: "Runner label (e.g. ubuntu-latest). Swap for a larger or self-hosted label without editing this file."
        required: true
        default: ubuntu-latest
      build_images:
        description: "Which first-party images to rebuild from this ref: backend | none. (velociraptor needs binaries install.sh stages, so it is not offered yet.)"
        required: true
        default: backend
      version_override:
        description: "Release tag supplying the upstream images (e.g. intact-20260818). Empty = the ref's own VERSION file."
        required: false
        default: ''
      module_set:
        description: "all | lean   — all enables every module including o365rc; lean drops elk and iris for a 16 GB runner"
        required: true
        default: all
      phases:
        description: "Comma-separated qa phase list to run (--only). Empty = the whole Linux profile."
        required: false
        default: ''
      install_timeout_min:
        description: "Minutes install.sh may run before the phase is failed"
        required: true
        default: '90'
      windows_evidence:
        description: "true to run the windows-latest evidence job (real .evtx, and memory if the driver loads)"
        required: false
        default: 'true'

# Read-only. This workflow downloads release assets and reads the repo; it
# publishes nothing and must never be able to.
permissions:
  contents: read

concurrency:
  # Per ref, and queued rather than cancelled: killing a run halfway leaves a
  # half-installed appliance and a half-written report, which is worse than
  # waiting.
  group: e2e-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------
  # Real Windows evidence, from a machine that genuinely has some.
  #
  # This job CANNOT reach the appliance -- it is a separate VM with no shared
  # network -- so it does not try. It harvests its own event logs and, if the
  # kernel will let it, its own memory, and hands them over as an artifact.
  # That covers exactly the two things a Linux host cannot provide: winevtx
  # input for Timesketch, and an image Volatility can actually analyse.
  #
  # Free: standard runners are unmetered for public repositories.
  windows-evidence:
    if: ${{ (github.event.inputs.windows_evidence || 'true') == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Harvest this runner's own Windows event logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # KAPE layout: the pipeline's detector keys off a `C/` prefix, so the
          # tree must start there. These are the runner's real logs, written by
          # the real Windows it is running.
          $dest = "$env:RUNNER_TEMP\evidence\C\Windows\System32\winevt\Logs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $src = "$env:SystemRoot\System32\winevt\Logs"
          # The channels an investigator actually reads first, and the only ones
          # with meaningful content on a fresh CI VM.
          $want = @('Security.evtx','System.evtx','Application.evtx',
                    'Microsoft-Windows-PowerShell%4Operational.evtx',
                    'Microsoft-Windows-Windows Defender%4Operational.evtx',
                    'Microsoft-Windows-TaskScheduler%4Operational.evtx')
          $copied = 0
          foreach ($n in $want) {
            $p = Join-Path $src $n
            if (Test-Path -LiteralPath $p) {
              try {
                Copy-Item -LiteralPath $p -Destination $dest -Force -ErrorAction Stop
                $copied++
              } catch {
                # A channel held open by the service is normal; wevtutil can
                # export a consistent copy where a plain read cannot.
                $out = Join-Path $dest $n
                & wevtutil epl ($n -replace '%4','/' -replace '\.evtx$','') $out 2>$null
                if (Test-Path -LiteralPath $out) { $copied++ }
              }
            }
          }
          Write-Host "collected $copied event log(s)"
          if ($copied -eq 0) { throw "no event logs could be collected" }
          Compress-Archive -Path "$env:RUNNER_TEMP\evidence\C" `
                           -DestinationPath "$env:RUNNER_TEMP\winevtx.zip" -Force
          Get-Item "$env:RUNNER_TEMP\winevtx.zip" |
            ForEach-Object { Write-Host ("zip: {0:N1} MB" -f ($_.Length/1MB)) }

      - name: Try to acquire memory
        shell: pwsh
        continue-on-error: true          # a blocked driver is a result, not a failure
        run: |
          # winpmem needs to load a kernel driver, which a hosted VM may refuse.
          # Per "try it then we choose": attempt it, and let the Linux job report
          # an honest skip if nothing lands here.
          $ErrorActionPreference = 'Continue'
          $url = 'https://github.com/Velocidex/WinPmem/releases/download/v4.0.rc1/winpmem_mini_x64_rc2.exe'
          $exe = "$env:RUNNER_TEMP\winpmem.exe"
          try {
            Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing -TimeoutSec 120
          } catch { Write-Host "::warning::could not download winpmem: $_"; exit 0 }
          $img = "$env:RUNNER_TEMP\evidence\memory.raw"
          & $exe $img 2>&1 | Select-Object -Last 5
          if (Test-Path -LiteralPath $img) {
            $mb = (Get-Item -LiteralPath $img).Length / 1MB
            Write-Host ("acquired {0:N0} MB" -f $mb)
            # Below 16 MB the ingest rejects it as too small to be a dump.
            if ($mb -lt 16) { Remove-Item -LiteralPath $img -Force
                              Write-Host "::warning::image too small; discarding" }
          } else {
            Write-Host "::warning::memory acquisition produced no image (driver likely blocked)"
          }

      - name: Stage the evidence bundle
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\bundle"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:RUNNER_TEMP\winevtx.zip" $out -Force
          $img = "$env:RUNNER_TEMP\evidence\memory.raw"
          if (Test-Path -LiteralPath $img) { Move-Item $img $out -Force }
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          path: ${{ runner.temp }}/bundle
          retention-days: 1        # real host evidence; keep it briefly
          compression-level: 0     # the zip is already compressed, the image is huge
          if-no-files-found: warn

  e2e:
    needs: [windows-evidence]
    # Runs even if the Windows job failed entirely: the Linux pipelines are the
    # bulk of the value and must not be held hostage to a runner that would not
    # load a driver.
    if: ${{ always() }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    # GitHub's hosted ceiling is 360; leave room for the summary and artifact
    # steps to run after a timed-out install rather than losing the evidence.
    timeout-minutes: 330

    env:
      APPLIANCE: /mnt/intact
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      # ------------------------------------------------------------------ 1 --
      - name: Validate the inputs
        env:
          BUILD_IMAGES: ${{ github.event.inputs.build_images || 'backend' }}
          MODULE_SET: ${{ github.event.inputs.module_set || 'all' }}
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override || '' }}
          TIMEOUT_MIN: ${{ github.event.inputs.install_timeout_min || '90' }}
        run: |
          set -euo pipefail
          # Re-validated here rather than trusted, matching the release
          # workflows: a typo must fail in ten seconds, not after a 40-minute
          # install has already destroyed the runner's state.
          case "$BUILD_IMAGES" in backend|none) ;; *)
            echo "::error::build_images must be 'backend' or 'none', got '$BUILD_IMAGES'"; exit 1 ;; esac
          case "$MODULE_SET" in all|lean) ;; *)
            echo "::error::module_set must be 'all' or 'lean', got '$MODULE_SET'"; exit 1 ;; esac
          case "$TIMEOUT_MIN" in ''|*[!0-9]*)
            echo "::error::install_timeout_min must be a number, got '$TIMEOUT_MIN'"; exit 1 ;; esac
          if [ -n "$VERSION_OVERRIDE" ]; then
            case "$VERSION_OVERRIDE" in intact-*) ;; *)
              echo "::error::version_override must look like intact-YYYYMMDD, got '$VERSION_OVERRIDE'"; exit 1 ;; esac
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          fetch-depth: 1

      # ------------------------------------------------------------------ 2 --
      - name: "Capacity: measure, reclaim, measure"
        run: |
          set -euo pipefail
          snap() { echo "$1"; free -g | sed -n '1,3p'; df -h / /mnt 2>/dev/null || df -h /; echo "cpus=$(nproc)"; }
          snap "== BEFORE ==" | tee /tmp/cap-before.txt

          # The standard hosted-runner reclaim, as used by the release
          # workflows. ~30 GB of preinstalled toolchains this job never touches.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true

          # /mnt is the runner's large ephemeral disk. BOTH the docker store and
          # the appliance tree go there: a measured full install is ~39 GB under
          # /var/lib/docker plus ~7 GB of appliance data, and the root
          # filesystem has nothing like that free.
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo mkdir -p /mnt/docker "${APPLIANCE}"
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl start docker
          docker info --format 'docker root: {{.DockerRootDir}}'

          # 16 GB of RAM against a documented 16 GB minimum, across ~30
          # containers including BOTH Elasticsearch and OpenSearch. Swap is what
          # turns "OOM-killed at minute 50" into "slow but finished" -- and a
          # finished run produces a report, which is the entire point.
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile >/dev/null
          sudo swapon /mnt/swapfile
          sudo sysctl -w vm.max_map_count=262144        # Elasticsearch/OpenSearch refuse to start below this

          snap "== AFTER ==" | tee /tmp/cap-after.txt
          {
            echo "## Runner capacity"
            echo '```'
            cat /tmp/cap-before.txt /tmp/cap-after.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          FREE=$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)
          if [ "${FREE:-0}" -lt 60 ]; then
            echo "::error title=Runner too small::/mnt has ${FREE} GB free after reclaim. A measured full install needs ~46 GB (39 GB docker + 7 GB data) and the release package adds ~6 GB. Re-dispatch with a larger 'runner' label."
            exit 1
          fi
          echo "::notice::/mnt has ${FREE} GB free after reclaim"

      - name: "Capacity: sample every 30s"
        run: |
          set -euo pipefail
          # Peak usage MEASURED, not guessed. This is what answers "does a
          # hosted runner actually fit?" after the first run.
          nohup bash -c 'while true; do
            printf "%s avail_mb=%s used_mem_mb=%s swap_mb=%s\n" \
              "$(date -Is)" \
              "$(df -BM --output=avail /mnt | tail -1 | tr -dc 0-9)" \
              "$(free -m | awk "/^Mem:/{print \$3}")" \
              "$(free -m | awk "/^Swap:/{print \$3}")"
            sleep 30
          done' > /tmp/capacity.log 2>&1 &
          echo "sampler started"

      # ------------------------------------------------------------------ 3 --
      - name: Resolve the release that supplies the images
        id: images
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override || '' }}
        run: |
          set -euo pipefail
          TAG="${VERSION_OVERRIDE:-$(cat VERSION)}"
          case "$TAG" in intact-*) ;; *)
            echo "::error::VERSION says '$TAG', which is not an intact-* release tag. Set version_override."; exit 1 ;; esac

          # install.sh takes images ONLY from release assets -- there is
          # deliberately no registry fallback -- so a tag without assets dies
          # about two minutes in with a message that does not say why.
          COUNT=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error title=No installable images::$TAG has no published release assets. Pick a tag that does, via the version_override input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::upstream images come from $TAG ($COUNT assets)"

      - name: Build the backend image from this ref
        id: build
        if: ${{ (github.event.inputs.build_images || 'backend') == 'backend' }}
        run: |
          set -euo pipefail
          # WHY. main's engine advances continuously while versions.backend
          # still names the last release's image, so engine-from-this-ref paired
          # with backend-from-the-release is a combination no customer ever
          # runs: an install or an upgrade always brings both from the same
          # release. Building here makes the pair coherent.
          #
          # HOW, with no code change. deploy_backend looks for
          # intact-backend:${BACKEND_VERSION} in the local image store and logs
          # "not building" when it is already there. BACKEND_VERSION comes from
          # modules/backend/.env, which update_env_files writes from
          # config.yaml versions.backend -- so tagging our build and pointing
          # that pin at it is enough.
          TAG="ref-$(git rev-parse --short HEAD)"
          docker build -f modules/backend/Dockerfile -t "intact-backend:${TAG}" .
          echo "backend_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::built intact-backend:${TAG} from $(git rev-parse --short HEAD)"

      # ------------------------------------------------------------------ 4 --
      - name: Stage and configure the appliance
        id: host
        env:
          MODULE_SET: ${{ github.event.inputs.module_set || 'all' }}
          BACKEND_TAG: ${{ steps.build.outputs.backend_tag }}
        run: |
          set -euo pipefail
          sudo rsync -a --exclude .git ./ "${APPLIANCE}/"
          cd "${APPLIANCE}"

          # A routable address, never 127.0.0.1. It becomes the TLS CN and the
          # address the Velociraptor client calls back to -- and loopback would
          # additionally collapse the suite's unauthenticated-caller checks,
          # because the backend's auth gate exempts loopback by design.
          IP="$(hostname -I | awk '{print $1}')"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

          sudo sed -i "s|^domain:.*|domain: ${IP}|" config.yaml
          sudo sed -i "s|^first_login:.*|first_login: true|" config.yaml

          # o365rc is the only module disabled in the shipped config, so "all
          # modules" means turning exactly this one on. The heredoc body is
          # indented to this block's base: YAML strips that indent, so the shell
          # still sees the body and the PY terminator at column 0 — a terminator
          # that ends up indented is never matched and the script runs off the end.
          sudo python3 - config.yaml "$MODULE_SET" <<'PY'
          import re, sys
          path, module_set = sys.argv[1], sys.argv[2]
          if module_set == "all":
              s = open(path).read()
              s, n = re.subn(r"(\n  o365rc:\n(?:.*\n)*?    enabled: )false",
                             r"\1true", s, count=1)
              if not n:
                  sys.exit("could not enable o365rc — the config.yaml shape changed")
              open(path, "w").write(s)
          PY

          if [ -n "${BACKEND_TAG:-}" ]; then
            # Point the pin at the image just built. deploy_backend then finds
            # it locally and skips both the build and the asset load.
            sudo sed -i "s|^  backend:.*|  backend: '${BACKEND_TAG}'|" config.yaml
          fi

          echo "--- config.yaml, as this run will use it ---"
          grep -nE "^(schema_version|domain|first_login)|^  (backend|o365rc):" config.yaml || true

          # THE SILENT FALSE PASS. If this marker exists, check_initialization_marker
          # prompts, `read` sees closed stdin, and install.sh prints
          # "Installation cancelled by user" and exits ZERO having done nothing.
          # The harness asserts on the log text as well; this is the other half.
          sudo rm -f /etc/intact-initialized

      - name: Fetch the Windows evidence bundle
        uses: actions/download-artifact@v4
        continue-on-error: true      # absent bundle -> honest skip, not a failure
        with:
          name: windows-evidence
          path: ${{ runner.temp }}/windows-evidence

      - name: Report what Windows evidence arrived
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/windows-evidence"
          if [ -d "$DIR" ] && [ -n "$(ls -A "$DIR" 2>/dev/null)" ]; then
            ls -lh "$DIR"
            echo "::notice::Windows evidence present — winevtx and memory pipelines will run"
          else
            echo "::warning::no Windows evidence — the winevtx and memory pipelines will report as skipped"
          fi

      - name: Install the QA harness dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pyyaml requests
          # paramiko is NOT installed: it exists to drive a Windows target over
          # SSH, and this profile has none. The preflight check for it is gated
          # on the same condition.

      # ------------------------------------------------------------------ 5 --
      - name: Run the QA harness
        id: qa
        continue-on-error: true       # the report and artifacts must survive a failure
        env:
          QA_PLATFORM_HOST: ${{ steps.host.outputs.ip }}
          QA_SUDO_USER: runner
          # Hosted runners are NOPASSWD; `sudo -S` reads this and ignores it.
          QA_SUDO_PASS: ci-runner-passwordless-sudo
          QA_REPO_DIR: /mnt/intact
          QA_LINUX_CLIENT: '1'
          QA_FEATURE_SWEEP: '1'
          QA_PIPELINES: '1'
          QA_WINDOWS_EVIDENCE: ${{ runner.temp }}/windows-evidence
          QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          QA_REF: ${{ github.event.inputs.ref || github.ref_name }}
          QA_IMAGES_TAG: ${{ steps.images.outputs.tag }}
          QA_BUILT_IMAGES: ${{ steps.build.outputs.backend_tag && format('intact-backend:{0}', steps.build.outputs.backend_tag) || '' }}
          PHASES: ${{ github.event.inputs.phases || '' }}
        run: |
          set -uo pipefail
          cd "${APPLIANCE}"
          # From the WORKSPACE, not the appliance tree: the staging step
          # rsyncs with --exclude .git, so /mnt/intact is not a git repo at all
          # and this reported "unknown" — leaving the report unable to name the
          # commit it had just tested, which is most of the point of Provenance.
          export QA_COMMIT="$(git -C "${GITHUB_WORKSPACE}" rev-parse --short HEAD 2>/dev/null || echo unknown)"

          # --skip wipe: a fresh runner has nothing to tear down, and skipping
          # it also avoids run_qa.py relocating itself to ~/.qa-runner (which it
          # only does because wipe deletes the tree it lives in).
          python3 qa/run_qa.py --skip wipe --no-relocate ${PHASES:+--only "$PHASES"}
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ 6 --
      - name: Stage the artifacts
        if: always()
        id: stage
        run: |
          set -euo pipefail
          RUN_DIR="$(ls -dt "$HOME"/qa-runs/* 2>/dev/null | head -1 || true)"
          if [ -z "$RUN_DIR" ]; then
            echo "::warning::no run directory was produced"
            echo "dir=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p _artifacts
          # An ALLOWLIST. The exclusions are deliberate and this repo is public:
          #   support-bundle.zip      not redacted; a real password was once found in one
          #   dashboard-credentials   exists to hold a credential
          #   client binaries         27 MB, embed the appliance's client CA, no diagnostic value
          #   memory images           same reasoning, much larger
          for item in REPORT.md results.json timeline.jsonl timeline.md; do
            [ -f "$RUN_DIR/$item" ] && cp "$RUN_DIR/$item" _artifacts/ || true
          done
          [ -d "$RUN_DIR/phases" ] && cp -r "$RUN_DIR/phases" _artifacts/ || true
          if [ -d "$RUN_DIR/logs" ]; then
            mkdir -p _artifacts/logs
            find "$RUN_DIR/logs" -maxdepth 1 -type f \( -name '*.log' -o -name '*.json' \) \
                 -exec cp {} _artifacts/logs/ \; || true
          fi
          cp /tmp/capacity.log _artifacts/ 2>/dev/null || true
          cp /tmp/cap-before.txt /tmp/cap-after.txt _artifacts/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" _artifacts
          chmod -R u+rw _artifacts
          echo "dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          du -sh _artifacts

      - name: Scan the staged artifacts for secrets
        if: always()
        run: |
          set -euo pipefail
          [ -d _artifacts ] || exit 0
          # A third independent layer. The harness already redacts at write time
          # and self-tests with a canary at report time; this repo is public, so
          # the cost of a miss is permanent and the cost of the check is seconds.
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          if ! /tmp/gitleaks detect --no-git --source _artifacts \
                 --config .gitleaks.toml --redact --no-banner; then
            echo "::error title=Artifact upload restricted::gitleaks matched something in the staged run directory. Keeping REPORT.md only."
            find _artifacts -type f ! -name REPORT.md -delete
          fi

      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.event.inputs.ref || github.ref_name }}-${{ github.run_id }}
          path: _artifacts
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------------------ 7 --
      - name: Render the summary
        if: always()
        env:
          RUN_DIR: ${{ steps.stage.outputs.dir }}
          IMAGES_TAG: ${{ steps.images.outputs.tag }}
          BACKEND_TAG: ${{ steps.build.outputs.backend_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Provenance"
            echo ""
            echo "| what | value |"
            echo "|---|---|"
            echo "| ref | \`${{ github.event.inputs.ref || github.ref_name }}\` |"
            echo "| upstream images from | \`${IMAGES_TAG:-unknown}\` |"
            echo "| built from this ref | \`${BACKEND_TAG:+intact-backend:$BACKEND_TAG}\`${BACKEND_TAG:+ }${BACKEND_TAG:-none} |"
            echo ""
            if [ -z "${BACKEND_TAG:-}" ]; then
              echo "> No image was rebuilt from this ref, so this run pairs this ref's engine with the release's containers — a combination no customer runs."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${RUN_DIR:-}" ] && [ -f "$RUN_DIR/REPORT.md" ]; then
            # REPORT.md is redacted at write time and is already ordered
            # bugs-first. The summary has a 1 MiB cap.
            head -c 900000 "$RUN_DIR/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No REPORT.md was produced — see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate every failed and skipped check
        if: always()
        env:
          RUN_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          [ -n "${RUN_DIR:-}" ] && [ -f "$RUN_DIR/results.json" ] || exit 0
          python3 - "$RUN_DIR/results.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          for ph in data.get("phases", []):
              for chk in ph.get("checks", []):
                  if chk.get("ok"):
                      continue
                  # "phase", not "name": PhaseResult.to_dict() spells the phase's own
          # key "phase" while each check inside it uses "name". Reading the
          # wrong one annotates every failure with a literal None.
          print(f"::error title={ph.get('phase')}::{chk.get('name')} "
                        f"expected={chk.get('expected')} actual={chk.get('actual')}")
          c = data.get("counts", {})
          print(f"::notice title=e2e verdict::{c.get('pass',0)} passed, "
                f"{c.get('fail',0)} failed, {c.get('error',0)} errored, "
                f"{c.get('skip',0)} skipped")
          PY

      # ------------------------------------------------------------------ 8 --
      - name: Tear the appliance down
        if: always()
        run: |
          set -uo pipefail
          # Free, and one more real assertion: clean.sh is the documented
          # uninstall and a failure here is a product bug worth seeing.
          cd "${APPLIANCE}" 2>/dev/null || exit 0
          sudo bash scripts/clean.sh --all --force || \
            echo "::warning::scripts/clean.sh --all --force did not exit 0"

      - name: Verdict
        if: always()
        env:
          RUN_DIR: ${{ steps.stage.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_DIR:-}" ] || [ ! -f "$RUN_DIR/results.json" ]; then
            echo "::error::the harness produced no results.json — it did not complete"
            exit 1
          fi
          python3 - "$RUN_DIR/results.json" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1])).get("counts", {})
          bad = int(c.get("fail", 0)) + int(c.get("error", 0))
          print(f"counts: {c}")
          sys.exit(1 if bad else 0)
          PY
