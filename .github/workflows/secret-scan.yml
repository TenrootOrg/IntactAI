name: secret-scan

# Runs gitleaks on every push and PR. The repo's `.gitleaks.toml`
# (rules + allowlist) is the single source of truth.
#
# We invoke the gitleaks binary directly instead of `gitleaks-action@v2`
# because that action requires a `GITLEAKS_LICENSE` secret for any repo
# owned by a GitHub organization — free for personal accounts only.
# Calling the OSS binary ourselves avoids the licensing requirement and
# gives us tighter control over the exact command line.

on:
  push:
    branches: ["main", "development"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers every commit on push, not
          # just the latest one.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history
        # On push, scan the full git log against `.gitleaks.toml`.
        # On PR, GitHub Actions fetches the PR diff base; the same
        # command works either way because gitleaks reads the local
        # repo state.
        run: |
          gitleaks detect \
            --no-banner \
            --redact \
            --config .gitleaks.toml
