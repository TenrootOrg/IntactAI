name: secret-scan

# Runs gitleaks on every push and PR. The repo's `.gitleaks.toml` is used
# as-is (rules + allowlist). Catches secrets that bypassed the local
# pre-commit hook (e.g. with `--no-verify`).

on:
  push:
    branches: ["main", "development"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so PRs can be scanned commit-by-commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scan the full repo history on push, the PR diff on PR.
          # GITLEAKS_LICENSE is only needed for the org-scale paid
          # tier; the OSS path doesn't.
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
