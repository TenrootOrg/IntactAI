name: Verify release excludes tests and the QA harness

# Guard: a published release must NOT ship the test suite. The actual exclusion is
# done by `.gitattributes` (`/tests export-ignore`), which `git archive` — and thus
# GitHub's codeload source tarball that services/upgrade/package.py downloads at the
# release tag — honours. This workflow downloads that exact tarball and FAILS the
# release if a tests/ folder ever leaked in (e.g. .gitattributes got dropped or the
# release was cut from a ref without it). Tests still live in development/main.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-no-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release source tarball (codeload — what operators install)
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "Fetching codeload tarball for ${tag}"
          curl -fsSL --retry 3 -o release-src.tar.gz \
            "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${tag}"

      - name: Assert no tests/ or qa/ folder is in the release
        run: |
          # codeload tarballs are prefixed with a top-level <repo>-<sha>/ dir.
          leaked="$(tar tzf release-src.tar.gz | grep -E '^[^/]+/(tests|qa)/' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::Release tarball for ${{ github.event.release.tag_name }} contains a tests/ or qa/ folder."
            echo "$leaked" | head -20
            echo "Fix: ensure '/tests export-ignore' and '/qa export-ignore' are in .gitattributes at the released ref."
            exit 1
          fi
          echo "OK — no tests/ or qa/ folder in the release source tarball."
