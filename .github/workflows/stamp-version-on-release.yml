name: Stamp VERSION on release

# Updates the repo's `VERSION` file every time a new release is
# published on GitHub. This is the canonical version source the
# `services/upgrade/base.py:get_current_versions` reader consults
# at install time — when an operator applies an upgrade package,
# the `source/intact/VERSION` file lands at `WORKDIR/VERSION` and
# the dashboard's Settings → System page reports the new release
# automatically.
#
# Why a workflow + commit, not just a release artifact:
#   We want offline operators to get the right version too. The
#   prepare-package flow pulls the source tarball at the release
#   tag the operator types into the modal — that tarball is the
#   GitHub-served source tree, so whatever VERSION lives in the
#   tree at that tag is what ships. By committing the update after
#   publish, the NEXT release cut from that same branch carries the
#   stamped VERSION at its own ref.
#
# The branch is RESOLVED from the release, not hardcoded. This job used
# to always check out `development` and push there, which was correct
# only while every release came off development. The moment a release is
# cut from `main` that hardcoding is wrong twice over: development gets
# credited with a release it did not produce, and main never gets stamped
# at all — so every main-based release ships reporting the PREVIOUS
# version. Both failures are silent; the run is green and the artifact
# looks fine until an operator reads Settings → System.
#
# Belt-and-suspenders: `services/upgrade/package.py` ALSO writes
# VERSION into the package's source tree during prepare, so even
# packages targeting branches or commit SHAs (where VERSION isn't
# pre-stamped) carry the correct value.
#
# GUARD (added after intact-20260808 shipped with zero installable assets):
# this fires off the same `release: published` webhook as
# build-release-assets.yml, with no ordering guarantee between the two --
# and on this repo a release goes public the instant it's published, before
# that workflow has uploaded anything. Stamping VERSION here right away would
# point every future install/upgrade at a tag that, for the next ~90 minutes
# (or forever, if that build fails), has nothing installable on it. So the
# first step below waits for at least one asset to actually be attached
# before touching VERSION at all -- if the wait times out, this job fails
# without committing anything, and `main`'s VERSION stays on the last tag
# that's known to actually work.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to stamp VERSION for (e.g. intact-20260809) — use this to retry a stamp that timed out waiting for assets."
        required: true

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets before stamping VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -uo pipefail
          # build-release-assets.yml's `build` job alone is allowed up to 90
          # minutes (a matrix across every module), before resolve/index/
          # publish even run -- so the wait budget has to clear that, not
          # just dodge a normal-speed race.
          DEADLINE=$(( $(date +%s) + 110*60 ))
          while :; do
            COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
            if [ "${COUNT:-0}" -gt 0 ]; then
              echo "$TAG has $COUNT asset(s) attached — proceeding to stamp VERSION."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::${TAG} still has zero assets after 110 minutes — refusing to stamp VERSION. main stays on the last known-good release. Once build-release-assets.yml finishes for this tag, re-run this workflow manually (workflow_dispatch, tag=${TAG}) to stamp it."
              exit 1
            fi
            sleep 60
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need every branch + tag to resolve the target
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the branch this release was cut from
        id: target
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -uo pipefail
          # 1) target_commitish is the branch when the release was created
          #    against one. It can also be a raw SHA (release cut from a
          #    detached commit), so it is verified rather than trusted.
          if [ -n "${TARGET}" ] && git show-ref --verify --quiet "refs/remotes/origin/${TARGET}"; then
            BRANCH="${TARGET}"
            HOW="release target_commitish"
          else
            # 2) Otherwise use whichever long-lived branch actually contains
            #    the tag. main wins when both do: a tag reachable from main is
            #    a stable release, and development having it too only means it
            #    was merged forward.
            BRANCH=""
            HOW=""
            for candidate in main development; do
              if git branch -r --contains "refs/tags/${TAG}" 2>/dev/null \
                   | tr -d ' ' | grep -qx "origin/${candidate}"; then
                BRANCH="${candidate}"
                HOW="tag reachable from ${candidate}"
                break
              fi
            done
          fi
          if [ -z "${BRANCH}" ]; then
            echo "::warning::${TAG} is not on main or development — skipping the VERSION stamp."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Stamping ${BRANCH} (resolved via ${HOW})"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Write VERSION and push
        if: steps.target.outputs.skip == 'false'
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git checkout "${BRANCH}"
          git pull --ff-only origin "${BRANCH}"
          echo "Stamping VERSION as: ${TAG} on ${BRANCH}"
          echo "${TAG}" > VERSION

          # config.yaml versions.backend MUST move with VERSION.
          #
          # It is the tag compose resolves ${BACKEND_VERSION} to, so when the
          # two disagree the box looks for an image the package never shipped
          # and `up -d` rebuilds the backend from source -- observed on
          # intact-20260804, where VERSION said 20260804 and this key still
          # said 20260803, costing ~380 lines of live PyPI and replacing the
          # tested image with an untested local build.
          #
          # Stamping only VERSION here is what caused that drift: prepare
          # writes the right value INTO the package, so the artifact is always
          # correct and only the repo -- and therefore every fresh checkout and
          # every tagged tree -- carries the stale one. Nothing surfaced it
          # because the failure is a silent rebuild, not an error.
          #
          # Same single-quoted form _pin_module_version uses, so a date-like
          # tag is never YAML-cast to an int.
          python3 - "${TAG}" <<'PY' || echo "::warning::could not stamp config.yaml versions.backend"
          import re, sys
          tag = sys.argv[1]
          path = 'config.yaml'
          try:
              lines = open(path).readlines()
          except FileNotFoundError:
              sys.exit(0)
          out, in_versions, stamped = [], False, False
          for line in lines:
              indent = re.match(r'^(\s*)', line).group(1)
              if line.startswith('versions:'):
                  in_versions = True
                  out.append(line)
                  continue
              if in_versions:
                  stripped = line.strip()
                  # a new top-level key ends the versions: block
                  if not indent and stripped and not stripped.startswith('#'):
                      in_versions = False
                  elif re.match(r'^\s+backend\s*:', line):
                      out.append(f"{indent}backend: '{tag}'\n")
                      stamped = True
                      continue
              out.append(line)
          if stamped:
              open(path, 'w').writelines(out)
              print(f"Stamped config.yaml versions.backend as {tag}")
          else:
              print("::warning::no versions.backend key in config.yaml — not stamped")
          PY

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain VERSION config.yaml)" ]]; then
            echo "VERSION and config.yaml already up to date — nothing to commit."
            exit 0
          fi
          git add VERSION config.yaml
          git commit -m "chore: stamp VERSION + versions.backend as ${TAG} [skip ci]"
          git push origin "${BRANCH}"
