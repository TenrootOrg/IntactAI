# ============================================================================
# OLD  --  the single-asset release shape.
#
# Shared vocabulary, so "old" and "new" mean one thing in code, in the Actions
# list and in conversation:
#
#   OLD  single-asset   one intact-upgrade-<tag>.tar[.gz] carrying every
#                       module.  THIS WORKFLOW.  Every release published
#                       BEFORE intact-20260811 is this shape.
#   NEW  per-module     one asset per module + <tag>.index.json.
#                       build-release-assets.yml.  intact-20260811 onward.
#
# The boundary is 20260811, NOT 20260726. 0726 is the oldest box in the field
# that cannot upgrade itself -- a fleet problem, not a format one. Releases
# between 0726 and 0811 are OLD-shape too, and calling them "post-0726" is how
# that gets mixed up.
#
# Still dispatchable on purpose: a box old enough to need an OLD-shape package
# is exactly the box that cannot fetch a NEW-shape one. The engine reads both
# (lib/upgrade/package.sh package_kind, lib/upgrade/refs.sh shape detection).
# ============================================================================
# Build the version-pinned upgrade package for a release, IN CI.
#
# Why: the package is built by the TARGET release's own code (this checkout),
# so it always knows every module the release ships — the real fix for the
# factor-5 / "Unknown module" class where an older on-box backend can't package
# a module a newer release added or renamed. The finished tarball is attached
# to the GitHub Release as an asset; customers download + apply it (offline/
# import today; the online path switches to downloading it in a later phase),
# instead of building it on their own box.
#
# The build runs the exact same prepare_upgrade_package() the platform uses,
# headless, inside a container from the release's freshly-built backend image
# (which has the code + deps), with the docker socket, a freshly-cloned
# /opt/sigma-rules (for the aws_sigma rule pack), and an output dir mounted.
# THIS SHAPE SHIPS `intact` AND NOTHING ELSE (--only-modules intact).
#
# The legacy single bundle exists for one job: hop a pre-bash box
# (intact-20260726) onto the new engine. Such a box cannot read per-module
# assets at all -- find_release_package hardcodes intact-upgrade-<tag>.tar.gz --
# so this is the only shape it can consume.
#
# It carries only the platform because their engine is the broken part. A 0726
# box runs Phase 2 IN-PROCESS with its own code, which has no mount-asset
# delivery: given a full bundle it fabricates an empty directory where
# modules/elk/config/setup-kibana-user.sh belongs, intact_elk_setup execs a
# directory and dies with exit 126, and the run reports "completed" over
# [FAILED] elk and [FAILED] portainer. Reproduced on a rebuilt 0726 appliance
# 2026-08-13; three customer imports had already failed exactly that way.
#
# With only `intact` in the manifest there is nothing for that Phase 2 to
# apply, so it cannot fail. The box lands on the new platform, ensure_host_engine
# puts scripts/upgrade.sh and lib/upgrade/ on disk, and the NEXT release upgrades
# the modules with the engine that delivers mounts properly. Verified end to end:
# 0726 -> 0811 (zero failed modules) -> 0814 (elk 9.4.2 -> 9.4.4, elk_setup
# Exited (0)).
#
# Also 433 MB instead of 4.1 GB, and it clears 0726's disk preflight, which
# demanded 17.4 GiB for the full bundle and refused the upgrade outright.
#
# NOT INSTALLABLE. install.sh takes images only from the package with no
# registry fallback, so a clean install from this asset comes up with the backend
# and nothing else. The packager prints "!! PARTIAL RELEASE -- 1 of 9 modules"
# for exactly this reason: expected here, not a warning to silence.
#
# See scripts/ci/build_release_package.py.

name: OLD (pre-20260811) — single-asset release package

on:
  # Auto-trigger disabled 2026-08-11. Every release from intact-20260812 on is
  # per-module (build-release-assets.yml), which is the shape every box that
  # can reach a modern release actually prefers -- so building a second ~5.5 GB
  # copy of the same release on every publish buys nothing and roughly doubles
  # the time to cut one.
  #
  # The single bundle is still the ONLY shape a stuck intact-20260726 box can
  # take: those appliances predate the per-module index entirely and
  # upgrade_fetch_release has no index.json to find. That path is not removed,
  # only taken off the automatic trigger -- if such a box turns up, dispatch
  # this workflow by hand against the tag and it produces exactly the bundle it
  # used to. The code that builds and applies it stays.
  #
  # TEMPORARY (2026-08-12) — re-enabled to test the intact-20260726 ->
  # intact-20260811 upgrade path end to end via a real release publish.
  # That test finished; this was never turned back off, so every release
  # since kept building a second ~5.5 GB copy of itself for nothing --
  # confirmed 2026-08-16 with both workflows firing on the same publish, the
  # OLD one finishing while the NEW one was still running.
  #
  # RE-DISABLED 2026-08-16 (commented back out, as the note above always said
  # to do once the test was done). workflow_dispatch stays live below: if a
  # stuck intact-20260726 box turns up, dispatch this workflow by hand
  # against the tag and it produces exactly the bundle that box can take.
  # release:
  #   types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. intact-20260722)"
        required: true
      since:
        description: "Baseline release to diff against (e.g. intact-20260615). Leave empty to auto-resolve the previous intact-* tag."
        required: false

permissions:
  contents: write            # upload the package as a Release asset

jobs:
  # Reads .github/release-ci.conf so the choice is one line in one file
  # rather than a YAML edit in two. See that file for the rule.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      # The DEFAULT BRANCH, explicitly -- NOT the release tag. On a
      # `release: published` event checkout's default ref is the tag, so this
      # gate was reading release-ci.conf out of the TAG's tree. Every tag cut
      # before that file existed carries no conf at all, so both gates fell
      # through to the default whatever main said: editing the switch,
      # committing and pushing changed nothing -- which is exactly what the
      # file instructs you to do. Sparse: the conf is all this job reads.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/release-ci.conf
          sparse-checkout-cone-mode: false
      - id: c
        run: |
          set -euo pipefail
          # Default TRUE when the file or the key is missing: per-module is the
          # shape releases are moving to, and forgetting to add the key must not
          # keep the legacy build alive forever.
          NEW=true
          if [ -f .github/release-ci.conf ] \
             && grep -qiE '^[[:space:]]*is_new_CI[[:space:]]*=[[:space:]]*(false|no|0)[[:space:]]*$' \
                  .github/release-ci.conf; then
            NEW=false
          fi
          echo "is_new_CI = ${NEW}  (read from ${GITHUB_REF_NAME}'s default branch, not the tag)"
          # Both workflows are release-triggered, so BOTH always show up in the
          # Actions list -- GitHub cannot consult a file before starting a run.
          # Only one BUILDS. Say which, loudly, so the other one does not look
          # like something that needs cancelling.
          if [ "$NEW" = "false" ]; then
            echo "### BUILDING -- legacy single-bundle" >> "$GITHUB_STEP_SUMMARY"
            echo "\`is_new_CI = ${NEW}\`, so this workflow owns the release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### STOOD DOWN -- nothing to cancel" >> "$GITHUB_STEP_SUMMARY"
            echo "\`is_new_CI = ${NEW}\`, so **per-module assets (NEW)** builds this release." >> "$GITHUB_STEP_SUMMARY"
            echo "This run is a no-op by design; let it finish." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Stood down::per-module assets (NEW) is building this release. Nothing to cancel."
          fi
          [ "$NEW" = "false" ] && echo "run=yes" >> "$GITHUB_OUTPUT" || echo "run=no" >> "$GITHUB_OUTPUT"

  build-package:
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 90       # full package = backend build + all sidecar image saves
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          case "$TAG" in
            intact-*) ;;
            *) echo "::error::Not an intact-* release tag ($TAG) — nothing to build"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release package for $TAG"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0        # need all tags to resolve the diff baseline

      # The package ships only what CHANGED since the baseline (plus intact +
      # cve_scan, which a version diff structurally cannot see). An explicit
      # `since` input wins; otherwise the script falls back to
      # DEFAULT_SINCE_REF — the OLDEST release a customer may still be
      # upgrading FROM, not merely the previous tag.
      #
      # Deliberately NOT auto-resolved as "the tag before this one". The online
      # flow downloads ONE package for the target ref; it does not walk the
      # chain. So diffing against the immediately-preceding tag silently drops
      # every module that changed in the gap a customer skipped. Concretely:
      # 0721 -> 0722 has ZERO module pin changes, so that baseline would ship
      # intact + cve_scan only, and a box on 0615 would upgrade the platform
      # while staying on old timesketch/plaso/iris/portainer/velociraptor with
      # no aws_sigma at all — reporting success the whole way.
      - name: Resolve diff baseline
        id: since
        run: |
          SINCE="${{ github.event.inputs.since }}"
          if [ -n "$SINCE" ]; then
            echo "Diffing module scope against explicit baseline $SINCE"
          else
            echo "No explicit baseline — script will use its DEFAULT_SINCE_REF"
          fi
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

      # The full package saves several GB of sidecar images (timesketch/
      # opensearch/plaso/...) as tars; a stock runner's ~14GB free disk is
      # tight, so reclaim the big preinstalled toolchains up front.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker image prune -af || true
          df -h /

      - name: Seed SigmaHQ rules (aws_sigma rule pack source)
        run: |
          sudo mkdir -p /opt/sigma-rules
          sudo chown "$(id -un)" /opt/sigma-rules
          git clone --depth 1 https://github.com/SigmaHQ/sigma /opt/sigma-rules
          echo "AWS sigma rules: $(find /opt/sigma-rules/rules/cloud/aws -name '*.yml' | wc -l)"

      - name: Build the release backend image (packager runtime)
        run: docker build -f modules/backend/Dockerfile -t intact-backend:ci-packager .

      - name: Build the release package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -e INTACT_PATH="$GITHUB_WORKSPACE" \
            -e INTACT_HOST_PATH="$GITHUB_WORKSPACE" \
            -v /opt/sigma-rules:/opt/sigma-rules:ro \
            -v "$GITHUB_WORKSPACE/ci-output:/output" \
            intact-backend:ci-packager \
            python3 "$GITHUB_WORKSPACE/scripts/ci/build_release_package.py" \
              --tag "${{ steps.tag.outputs.tag }}" --out /output \
              --only-modules intact \
              ${{ steps.since.outputs.since && format('--since {0}', steps.since.outputs.since) || '' }}
          echo "== built =="; ls -lh "$GITHUB_WORKSPACE/ci-output"

      # A GitHub Release asset is capped at 2 GiB per file. The full package
      # (backend image + ~22 sidecar image tars + velociraptor binaries) is
      # several GB, so a single asset upload is rejected. Split it into
      # <2 GiB parts and record the sha256 of the WHOLE tarball so the consumer
      # can `cat *.part-* > pkg.tar.gz` and verify. Keep tar-as-asset (air-gap
      # friendly) — no registry. Parts are named <pkg>.part-00, .part-01, ...
      - name: Split package into release-sized parts
        run: |
          cd "$GITHUB_WORKSPACE/ci-output"
          PKG="$(ls *.tar.gz 2>/dev/null | head -1)"
          if [ -z "$PKG" ]; then echo "::error::no .tar.gz produced"; ls -lh; exit 1; fi
          sha256sum "$PKG" > "$PKG.sha256"          # sha of the whole, pre-split
          SIZE=$(stat -c%s "$PKG")
          LIMIT=$((1900 * 1024 * 1024))             # 1900 MiB < 2 GiB, safe margin
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Package is $((SIZE/1024/1024)) MiB (> 2 GiB asset limit) — splitting into parts"
            split -b 1900m -d -a 2 "$PKG" "$PKG.part-"
            rm -f "$PKG"                            # upload only the parts, not the monolith
          else
            echo "Package is $((SIZE/1024/1024)) MiB — under the limit, uploading whole"
          fi
          echo "== to upload =="; ls -lh

      # Runs on a real release, and also on a manual dispatch IF a release
      # already exists for the tag — so `workflow_dispatch` (from any branch)
      # exercises the exact split + 2 GiB-limited release-asset path, letting
      # us iterate on `development` before merging to the default branch.
      - name: Attach package to the GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$GITHUB_WORKSPACE"/ci-output/* --clobber
            echo "Attached package parts to release $TAG"
          else
            echo "No release exists for $TAG — skipping asset attach (artifact upload covers this run)"
          fi

      - name: Upload package as a workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.tag.outputs.tag }}
          path: ci-output/*
          retention-days: 7

      # VERSION lived only in the per-module workflow, so a legacy single-bundle
      # release left the branch's VERSION at whatever the PREVIOUS release set --
      # and with is_new_CI = FALSE that is every release. A box upgraded by this
      # bundle then reports a version the branch never claims.
      #
      # Last step, after the assets are attached: the action's own contract says
      # to call it only once that has happened, because the caller's job graph
      # is the proof that stamping is safe (it replaced a workflow that polled
      # for up to 110 minutes precisely because it could not know).
      #
      # `uses: ./` resolves against the checked-out RELEASE TAG, so the tag must
      # carry .github/actions/stamp-version. Every tag from intact-20260811 on
      # does; re-building something older by hand would skip stamping with a
      # "local action not found" error rather than a silent no-op.
      - name: Stamp VERSION on the source branch
        if: github.event_name == 'release'
        uses: ./.github/actions/stamp-version
        with:
          tag: ${{ steps.tag.outputs.tag }}
          target-commitish: ${{ github.event.release.target_commitish }}
