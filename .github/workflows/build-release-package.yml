# Build the ONE-FILE upgrade package for a release, IN CI.
#
# SUPERSEDED by build-release-assets.yml, which builds an asset per module and
# is what releases use now. This is kept for the single case that one cannot
# serve: a box old enough to predate the release index looks for exactly
# `intact-upgrade-<tag>.tar.gz` and nothing else, and someone hand-carrying one
# file into an air-gapped site would rather carry one than nine.
#
# RESTORED to `release: published` auto-trigger (2026-08-09, same day it was
# briefly swapped off): the fleet is NOT actually on the per-module wrapper
# format yet, despite 20260807/08/09 having shipped -- real boxes still need
# this single-file bundle on every release, not just on demand. Swap this
# back off (and build-release-assets.yml's auto-trigger back on) once the
# fleet has genuinely moved past pre-index releases. workflow_dispatch still
# works the same as always for a one-off manual build.
#
# Original reasoning for why this was ever on-demand-only, preserved because
# it still applies whenever the swap-back eventually happens: running on
# every release publish means every release quietly starts a second,
# differently-shaped build and attaches a whole-stack tarball nobody asked
# for, and two workflows racing to upload assets under one tag is how the
# last round of confusion started.
#
# The build runs the exact same prepare_upgrade_package() the platform uses,
# headless, inside a container from the release's freshly-built backend image
# (which has the code + deps), with the docker socket, a freshly-cloned
# /opt/sigma-rules (for the aws_sigma rule pack), and an output dir mounted.
# See scripts/ci/build_release_package.py.

name: Build release upgrade package (single file, on demand)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. intact-20260722). Not needed when triggered by publishing a release -- the release's own tag is used automatically."
        required: false

permissions:
  contents: write            # upload the package as a Release asset

# Same reasoning as build-release-assets.yml's identical guard: two runs for
# one tag (an auto-trigger plus a manual dispatch, say) would race on
# `gh release upload --clobber` and interleave assets from two builds under
# one release. Queue rather than cancel -- a half-uploaded release is worse
# than a slow one.
concurrency:
  group: release-package-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # full package = backend build + all sidecar image saves
    steps:
      - name: Resolve tag
        id: tag
        env:
          # inputs.tag for a manual dispatch; release.tag_name when the
          # trigger is an actual release publish (inputs.tag is unset then,
          # since github.event.inputs only exists on workflow_dispatch).
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          case "$TAG" in
            intact-*) ;;
            *) echo "::error::Not an intact-* release tag ($TAG) — nothing to build"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building release package for $TAG"

      # FIRST THING after the tag is known, before the ~90min build even
      # starts. This repo publishes releases directly (no draft-first step),
      # so a `release: published` trigger means the release is ALREADY
      # public with zero assets at this exact moment -- and unlike
      # build-release-assets.yml, this workflow used to do nothing about
      # that: it just uploaded at the very end if the release still existed,
      # with nothing ever hiding it in between. That is the same "public,
      # zero-asset release" shape as intact-20260808, just produced by this
      # pipeline instead. Re-drafting immediately closes that window; the
      # "Attach" step below only flips it back once the upload succeeds.
      # Skipped on workflow_dispatch (re-running a build against an
      # already-good release shouldn't yank it offline).
      - name: Immediately re-draft the release (hide until the package is attached)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=true --repo "${{ github.repository }}" \
            && echo "$TAG re-drafted; hidden until the package is attached." \
            || echo "::warning::could not re-draft $TAG — it stays publicly visible until the package is attached"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Docker + every INTACT_HOST_DEPS package (lib/docker.sh:38-48), bundled
      # as real .deb files plus a pre-built local apt repo index, so
      # install.sh never touches download.docker.com or a live apt mirror --
      # online or air-gapped, the package is the only source. Placed into
      # ci-output/ so the existing "Attach package to the GitHub Release"
      # step below (already a wildcard glob over that directory) picks it up
      # with no changes needed there. Identical recipe to the equivalent step
      # in build-release-assets.yml -- see that file's system-bundle job for
      # the full "why" (the naive bare-.deb-glob approach was tried first and
      # confirmed broken empirically; this is the tested, working version).
      - name: Build the Docker + host-dependency bundle
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output" "$GITHUB_WORKSPACE/bundle-out"
          cat > "$GITHUB_WORKSPACE/build_bundle.sh" << 'BUILDEOF'
          #!/bin/bash
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq curl gnupg ca-certificates lsb-release

          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq

          # Critical: purge bootstrap tools (NOT ca-certificates) before the
          # real capture, or apt treats their transitive deps as already-
          # satisfied and silently skips capturing them.
          apt-get purge -y -qq curl gnupg lsb-release
          apt-get autoremove -y -qq --purge

          mkdir -p /bundle
          rm -f /var/cache/apt/archives/*.deb
          apt-get install -y -qq --download-only --reinstall \
            docker-ce docker-ce-cli containerd.io docker-compose-plugin \
            curl wget git python3 python3-pip python3-yaml openssl jq dnsutils lsb-release ca-certificates gnupg
          cp /var/cache/apt/archives/*.deb /bundle/

          apt-get install -y -qq dpkg-dev
          cd /bundle
          dpkg-scanpackages . /dev/null > Packages 2>/dev/null
          gzip -kf Packages

          . /etc/os-release
          echo "$VERSION_ID" > /bundle/ubuntu-version
          echo "== bundle built: $(ls /bundle | wc -l) files =="
          du -sh /bundle
          BUILDEOF
          docker run --rm \
            -v "$GITHUB_WORKSPACE/build_bundle.sh:/build_bundle.sh:ro" \
            -v "$GITHUB_WORKSPACE/bundle-out:/bundle" \
            ubuntu:24.04 bash /build_bundle.sh

          cd "$GITHUB_WORKSPACE/bundle-out"
          tar -cf "$GITHUB_WORKSPACE/ci-output/${TAG}-system-bundle.tar" .
          sha256sum "$GITHUB_WORKSPACE/ci-output/${TAG}-system-bundle.tar" \
            > "$GITHUB_WORKSPACE/ci-output/${TAG}-system-bundle.tar.sha256"
          ls -lh "$GITHUB_WORKSPACE/ci-output/${TAG}-system-bundle.tar"

      # This builds EVERY module into one file -- no baseline, no diff. That is
      # the point of it: the thing it produces is the whole stack, for a
      # consumer that can only take one file.
      #
      # A runner is a fresh VM, but it ships with ~30 GB of preinstalled
      # toolchains and ~21 GB free. Saving every sidecar image as a tar and
      # then compressing the lot needs more room than that leaves, so reclaim
      # the toolchains first. Nothing here is cleaning up after us.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker image prune -af || true
          df -h /

      - name: Seed SigmaHQ rules (aws_sigma rule pack source)
        run: |
          sudo mkdir -p /opt/sigma-rules
          sudo chown "$(id -un)" /opt/sigma-rules
          git clone --depth 1 https://github.com/SigmaHQ/sigma /opt/sigma-rules
          echo "AWS sigma rules: $(find /opt/sigma-rules/rules/cloud/aws -name '*.yml' | wc -l)"

      - name: Build the release backend image (packager runtime)
        run: docker build -f modules/backend/Dockerfile -t intact-backend:ci-packager .

      - name: Build the release package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          args=(--tag "$TAG" --out /output)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -e INTACT_PATH="$GITHUB_WORKSPACE" \
            -e INTACT_HOST_PATH="$GITHUB_WORKSPACE" \
            -v /opt/sigma-rules:/opt/sigma-rules:ro \
            -v "$GITHUB_WORKSPACE/ci-output:/output" \
            intact-backend:ci-packager \
            python3 "$GITHUB_WORKSPACE/scripts/ci/build_release_package.py" "${args[@]}"
          echo "== built =="; ls -lh "$GITHUB_WORKSPACE/ci-output"

      # A GitHub Release asset is capped at 2 GiB per file. The full package
      # (backend image + ~22 sidecar image tars + velociraptor binaries) is
      # several GB, so a single asset upload is rejected. Split it into
      # <2 GiB parts and record the sha256 of the WHOLE tarball so the consumer
      # can `cat *.part-* > pkg.tar.gz` and verify. Keep tar-as-asset (air-gap
      # friendly) — no registry. Parts are named <pkg>.part-00, .part-01, ...
      - name: Split package into release-sized parts
        run: |
          cd "$GITHUB_WORKSPACE/ci-output"
          PKG="$(ls *.tar.gz 2>/dev/null | head -1)"
          if [ -z "$PKG" ]; then echo "::error::no .tar.gz produced"; ls -lh; exit 1; fi
          sha256sum "$PKG" > "$PKG.sha256"          # sha of the whole, pre-split
          SIZE=$(stat -c%s "$PKG")
          LIMIT=$((1900 * 1024 * 1024))             # 1900 MiB < 2 GiB, safe margin
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Package is $((SIZE/1024/1024)) MiB (> 2 GiB asset limit) — splitting into parts"
            split -b 1900m -d -a 2 "$PKG" "$PKG.part-"
            rm -f "$PKG"                            # upload only the parts, not the monolith
          else
            echo "Package is $((SIZE/1024/1024)) MiB — under the limit, uploading whole"
          fi
          echo "== to upload =="; ls -lh

      # Attaches only if a release already exists for the tag; otherwise the
      # artifact upload below is the deliverable.
      - name: Attach package to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$GITHUB_WORKSPACE"/ci-output/* --clobber
            echo "Attached package parts to release $TAG"
            # ONLY NOW -- the package is attached -- is it safe to make the
            # release public again. set -e means a failed upload never
            # reaches this line, so the release stays in draft with nothing
            # public instead of going live empty.
            if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
              echo "Publishing $TAG now that the package is attached..."
              gh release edit "$TAG" --draft=false
            fi
          else
            echo "No release exists for $TAG — skipping asset attach (artifact upload covers this run)"
          fi

      # LAST, and only for a real `release: published` run -- a manual
      # workflow_dispatch is normally someone rebuilding an EXISTING release
      # on demand (a lost asset, a one-off), and moving VERSION for that
      # would walk it backward the moment the tag being rebuilt is not the
      # newest one. See .github/actions/stamp-version for why this can run
      # right here with no wait/poll: the Attach step above already proved
      # the package is on the release before this runs.
      - name: Stamp VERSION on the source branch
        if: github.event_name == 'release'
        uses: ./.github/actions/stamp-version
        with:
          tag: ${{ steps.tag.outputs.tag }}
          target-commitish: ${{ github.event.release.target_commitish }}

      - name: Upload package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.tag.outputs.tag }}
          path: ci-output/*
          retention-days: 7
