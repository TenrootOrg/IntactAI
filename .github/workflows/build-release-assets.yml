# ============================================================================
# NEW  --  the per-module release shape.
#
# Shared vocabulary, so "old" and "new" mean one thing in code, in the Actions
# list and in conversation:
#
#   OLD  single-asset   one intact-upgrade-<tag>.tar[.gz] carrying every
#                       module.  build-release-package.yml.  Every release
#                       published BEFORE intact-20260811 is this shape.
#   NEW  per-module     one asset per module + <tag>.index.json.
#                       THIS WORKFLOW.  intact-20260811 onward.
#
# The boundary is 20260811, NOT 20260726. 0726 is the oldest box in the field
# that cannot upgrade itself -- a fleet problem, not a format one. Releases
# between 0726 and 0811 are OLD-shape too, and calling them "post-0726" is how
# that gets mixed up.
# ============================================================================
# Build one release asset PER MODULE, plus the index that describes them.
#
# WHY PER MODULE. The scheme this replaces shipped a DELTA -- "the modules whose
# pins moved since release X" -- and that relativity was the problem: the online
# flow downloads exactly one artifact for the target ref and does not walk the
# upgrade chain, so a box that SKIPPED a release got a package diffed against a
# baseline newer than the one it was running, with everything in the gap simply
# absent WHILE THE RUN REPORTED SUCCESS. A module asset is absolute -- "this is
# elk 9.4.4" -- so the box compares what it has against what it wants and
# fetches the difference itself. No baseline, nothing to guard.
#
# WHY resolve-THEN-matrix. A tag is not an identity: intact-20260803 was re-cut
# and moved 6316e05 -> 25effd5, and the two packages were indistinguishable from
# outside. If each matrix job resolved the tag itself, a re-cut mid-build would
# produce assets from two different commits that nothing downstream could tell
# apart. `resolve` pins the SHA once; every builder checks out THE SHA; `index`
# asserts they all agree; the on-box assembler asserts it again at apply time.
#
# WHY THE MERGE WORKS. Every asset's tarball uses the same top-level directory,
# intact-upgrade-<tag>/, so extracting N of them into one place yields exactly
# the single package_dir the apply side already consumes. That is what
# --work-dir buys, and it is not cosmetic: without it each root is named from a
# build timestamp, the assets extract as siblings, and the apply side silently
# picks one.
#
# WHY NO SINGLE-FILE BUNDLE. Earlier revisions re-packed the module assets into
# one legacy-named tarball for boxes older than the index. Building it cost a
# job that downloaded every asset, extracted all of it, and re-compressed the
# lot -- roughly triple the release on one runner's disk -- to produce something
# each release needs at most once, if ever. `build_release_package.py` still
# builds a bundle when run without --module, so one can be made by hand the day
# a box actually needs it. It is not worth a job on every release.
name: NEW (20260811+) — per-module release assets

on:
  # Re-enabled 2026-08-12 to test the per-module path end to end, after the
  # bug that made it fail every time was found: target_ref read
  # modules.get('intact'), which is None on a per-module build, so every asset
  # except intact stamped pins_source=local-fallback and the index job refused
  # the release (31ea682).
  # TEMPORARY — off while the legacy bundle is being cut for a 0726 box.
  # Restore before any release customers take, or it ships single-asset only
  # and silently: upgrade_fetch_release just falls back to the single file when
  # no index.json is attached. VERSION is also stamped by THIS workflow, so the
  # branch stops advancing while it is off.
  #
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. intact-20260804)"
        required: true

permissions:
  contents: write

# Two dispatches for one tag would race on `gh release upload --clobber` and
# interleave assets from two commits under a single release -- the tag-identity
# problem again, arriving through the scheduler instead of through git. Queue
# rather than cancel: a half-uploaded release is worse than a slow one.
concurrency:
  group: release-assets-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- resolve
  #
  # No gate ahead of this any more. There used to be one, reading
  # .github/release-ci.conf to arbitrate between this workflow and the legacy
  # single-bundle one (build-release-package.yml) -- exactly one of the two
  # was meant to build a given release, the other stood down. That workflow
  # is removed (single job it existed for -- hopping a pre-bash 20260726 box
  # onto the new engine -- is done via manual local tooling now, not CI), so
  # there is nothing left to arbitrate: this is the only release workflow,
  # and it always builds.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      commit: ${{ steps.r.outputs.commit }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      # The "immediately re-draft the release" step was REMOVED (2026-08-17).
      # It hid the release during the build, but when the final attach failed
      # for any reason the release was left stranded as a hidden draft -- which
      # is exactly what happened to intact-20260813. The release now stays
      # visible throughout; `publish` attaches assets to it in place and
      # re-creates it if it has gone missing. A brief window where a release
      # shows old/no assets mid-build is a far better failure mode than a
      # release stranded invisible with a green-looking build behind it.
      - name: Validate the tag
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          case "$TAG" in
            intact-*) ;;
            *) echo "::error::Not an intact-* release tag ($TAG)"; exit 1 ;;
          esac

      # fetch-depth: 0 because the builder resolves the tag to a commit, and a
      # shallow single-ref checkout has no tag objects to resolve against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fetch-depth: 0

      - name: Pin the tag to a commit, once
        id: r
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          COMMIT="$(git rev-list -n1 "$TAG")"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Building $TAG @ $COMMIT"

      # The backend package is importable straight from the checkout for this
      # (it only reads config.yaml + UPGRADE_ORDER), so no container needed.
      #
      # --emit-matrix is a GATE, not just a query: it fails when a module in
      # RELEASE_MODULES has no pin in config.yaml, because the matrix it prints
      # becomes the index and the index is what a box believes the release
      # contains. A dropped module would leave every job green and the release
      # one module short.
      - name: Resolve the module matrix
        id: m
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          INTACT_STORAGE_BASE: /tmp
        run: |
          # Only pyyaml: release_module_set() reads config.yaml's `versions:`
          # block. UPGRADE_ORDER comes from scripts/ci/packager/order.py,
          # which parses lib/upgrade/plan.sh directly rather than importing
          # any part of the backend, so there is no `services` package to
          # dodge here anymore -- see order.py's docstring for what this
          # step used to fake and why.
          python3 -m pip install --quiet pyyaml
          MATRIX="$(INTACT_PATH="$GITHUB_WORKSPACE" \
                    python3 scripts/ci/build_release_package.py --tag "$TAG" --emit-matrix)"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Modules: $MATRIX"

      # We add two LLM providers to Timesketch by writing into the vendor
      # image's site-packages and appending imports to a file UPSTREAM owns.
      # A Timesketch bump can move any of that. apply.sh guards each import at
      # runtime so the outcome is a missing feature rather than a crash loop --
      # which is exactly why a human needs telling: a silently-absent feature
      # is not something a green build would ever surface.
      #
      # Here rather than in a build job: it is a pre-release heads-up, not a
      # packaging step, and it takes seconds. Running it before the matrix
      # spends 90 minutes means the verdict is on the run page whatever happens
      # afterwards. It never fails the build (exit 0 clean / 10 drift / 20
      # could-not-verify, all swallowed) -- the release is valid either way.
      - name: Check upstream Timesketch LLM-provider drift
        continue-on-error: true
        run: |
          python3 scripts/ci/check_timesketch_provider_drift.py --github || true

  # ----------------------------------------------------------- build-image
  build-image:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Build the packager image
        run: docker build -f modules/backend/Dockerfile -t intact-backend:ci-packager .

      # The image is built locally; save it so the matrix jobs can load it
      # without rebuilding. This is critical for matrix jobs since each one
      # is an independent runner with a fresh Docker daemon.
      - name: Save packager image as artifact
        run: |
          mkdir -p /tmp/docker-images
          # NO `| gzip`, and compression-level: 0 below. A `docker save` is
          # already-compressed layers, so this used to deflate the same bytes
          # THREE times: gzip here, then the artifact store's own zip, then an
          # inflate in each of the 9 matrix legs that downloads it. The
          # workflow already measured what that buys on this kind of content --
          # 0.55%, see the note above the module-asset checksum step -- so all
          # three passes were paying a full single-threaded scan for nothing.
          docker save intact-backend:ci-packager > /tmp/docker-images/intact-backend-ci-packager.tar
          ls -lh /tmp/docker-images/

      - name: Upload packager image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-packager
          path: /tmp/docker-images/intact-backend-ci-packager.tar
          # Store, do not deflate: see the note above.
          compression-level: 0
          retention-days: 1

  # ------------------------------------------------------------------ build
  build:
    needs: [resolve, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true          # a partial release must never be published
      matrix:
        module: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      # THE SHA, not the tag -- see the header. This is what makes the
      # coherence assertion in `index` structurally satisfiable rather than
      # hopeful.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Load packager image
        run: |
          mkdir -p /tmp/docker-images
          cd /tmp/docker-images

      - name: Download packager image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-packager
          path: /tmp/docker-images

      - name: Load Docker image
        run: docker load < /tmp/docker-images/intact-backend-ci-packager.tar

      # The intact module's asset bundles a `docker save` of intact-backend:<tag>
      # for customers to load. That image is built from this exact checkout at
      # this exact commit -- identical inputs to the ci-packager image already
      # loaded above. Tag it under the release name so package.py's own
      # `docker image inspect` finds it and skips rebuilding the same Dockerfile
      # a second time.
      - name: Tag packager image as the release backend image
        if: matrix.module == 'intact'
        run: |
          if [ "${{ matrix.module }}" != "intact" ]; then
            echo "Skipping tag (not intact module)"
            exit 0
          fi
          docker tag intact-backend:ci-packager "intact-backend:${{ needs.resolve.outputs.tag }}"

      # Only aws_sigma consumes the rule pack; cloning it for every module
      # would be ~9x the work for nothing.
      - name: Seed SigmaHQ rules
        if: matrix.module == 'aws_sigma'
        run: |
          sudo mkdir -p /opt/sigma-rules
          sudo chown "$(id -un)" /opt/sigma-rules
          git clone --depth 1 https://github.com/SigmaHQ/sigma /opt/sigma-rules
          echo "AWS rules: $(find /opt/sigma-rules/rules/cloud/aws -name '*.yml' | wc -l)"

      # Velociraptor's image is BUILT, not pulled, and it bakes artifacts from
      # the checkout. refresh_velociraptor_build_files() returns False and only
      # WARNS when it cannot find them, so a bundle-less image would ship while
      # the log looked merely noisy. Assert instead.
      - name: Assert Velociraptor artifacts are present
        if: matrix.module == 'velociraptor'
        run: |
          N=$(find modules/velociraptor/bundled_artifacts -name '*.yaml' 2>/dev/null | wc -l)
          echo "bundled artifacts: $N"
          if [ "$N" -lt 400 ]; then
            echo "::error::only $N bundled artifacts — the image would ship without them"
            exit 1
          fi

      - name: Build the ${{ matrix.module }} asset
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          MODULE: ${{ matrix.module }}
          # The packager fetches the TARGET release's config.yaml to pin every
          # transitive sidecar version (packager/resolver.py:fetch_upstream_config).
          # This repo is private, so an anonymous raw fetch 404s -- and the
          # packager treats that as "GitHub unreachable" and silently falls back
          # to the BUILD MACHINE's config.yaml, stamping pins_source=local-fallback.
          # The index job then refuses the whole release, correctly, but three
          # quarters of an hour after the mistake was made.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -e INTACT_PATH="$GITHUB_WORKSPACE" \
            -e INTACT_HOST_PATH="$GITHUB_WORKSPACE" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e TAG="$TAG" -e MODULE="$MODULE" -e COMMIT="$COMMIT" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v /opt/sigma-rules:/opt/sigma-rules:ro \
            -v "$GITHUB_WORKSPACE/out:/output" \
            intact-backend:ci-packager \
            sh -c '
              python3 "$INTACT_PATH/scripts/ci/build_release_package.py" \
                --tag "$TAG" --module "$MODULE" --commit "$COMMIT" \
                --work-dir "/tmp/intact-upgrade-$TAG" --out /output
              rc=$?
              chown -R "$HOST_UID:$HOST_GID" /output || true
              exit $rc
            '
          ls -lh "$GITHUB_WORKSPACE/out"

      # SHAPE + SECRET SCAN, per module, HERE -- not in a serial post-build job.
      # This asset is already on local disk (no artifact round-trip) and the
      # matrix runs every module at once, so each asset is checked in parallel
      # instead of one runner re-downloading all ~5.5 GB and scanning them in
      # series (what verify-assets used to do). fail-fast on the matrix means a
      # leak or a bad shape kills the release immediately -- exactly the gate a
      # partial or leaky release needs. Runs BEFORE "Checksum and split" so it
      # sees one whole tarball, never a .part-NN.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Check this asset's shape and scan it for secrets
        env:
          MODULE: ${{ matrix.module }}
        working-directory: out
        run: |
          set -euo pipefail
          mod="$MODULE"
          pkg="$(ls -1 *.tar *.tar.gz 2>/dev/null | head -1 || true)"
          test -n "$pkg" || { echo "::error::${mod}: no asset tarball to check"; exit 1; }

          ex="$(mktemp -d)"
          case "$pkg" in
            *.tar.gz) tar -xzf "$pkg" -C "$ex" ;;
            *)        tar -xf  "$pkg" -C "$ex" ;;
          esac

          fail=0
          # Shape + sidecar are NON-CRITICAL (2026-08-17): warn, do not fail.
          # The hard blocks below stay: a broken intact engine entry point (the
          # release could not be applied at all) and secrets (gitleaks +
          # never-ship files).
          roots="$(find "$ex" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          if [ "$roots" != "1" ]; then
            echo "::warning::${mod}: expected one top-level dir in the asset, found ${roots}"
          fi
          root="$(find "$ex" -mindepth 1 -maxdepth 1 -type d | head -1)"

          if [ -n "$root" ] && [ ! -f "${root}/manifests/${mod}.json" ]; then
            echo "::warning::${mod}: missing manifests/${mod}.json sidecar"
          fi

          if [ "$mod" = "intact" ] && [ -n "$root" ]; then
            up="${root}/source/intact/scripts/upgrade.sh"
            if [ ! -f "$up" ]; then
              echo "::error::intact: no source/intact/scripts/upgrade.sh -- the stage-0 hop has nothing to exec into"
              fail=1
            elif ! bash -n "$up"; then
              echo "::error::intact: source/intact/scripts/upgrade.sh does not parse"
              fail=1
            fi
          fi

          # config.yaml, a module live .env, a TLS/CA private key, a secrets/
          # dir -- the exact leak class make_test_package.sh demonstrated. None
          # belong in a package a customer downloads.
          if [ -n "$root" ]; then
            bad="$(find "$root" \( \
                  -name 'config.yaml' \
               -o -path '*/modules/*/.env' \
               -o -name '*.key' -o -name '*.pem' \
               -o -type d -name 'secrets' \
              \) 2>/dev/null)"
            if [ -n "$bad" ]; then
              echo "::error::${mod}: package carries file(s) that must never ship:"
              echo "$bad" | sed 's/^/::error::  /'
              fail=1
            fi

            echo "[gitleaks] scanning ${mod} asset..."
            # -v so a failure NAMES the findings; --redact keeps the values out
            # of the log.
            if ! gitleaks detect --source "$root" --no-git --no-banner --redact -v \
                   --report-path "${GITHUB_WORKSPACE}/gitleaks-${mod}.json" \
                   --report-format json \
                   --config "${GITHUB_WORKSPACE}/.gitleaks.toml"; then
              echo "::error::${mod}: gitleaks found a secret in the built asset"
              fail=1
            fi
          fi

          rm -rf "$ex"
          exit $fail

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ matrix.module }}
          path: ${{ github.workspace }}/gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 7

      # 2 GiB per release asset. The sha256 of the WHOLE tarball, taken
      # pre-split, already lives in the builder's .meta.json and from there in
      # the index -- it is NOT written out as a per-asset `.sha256` file. The
      # index is the single place a consumer reads hashes from, and publishing
      # a second copy of every digest as its own release asset only tripled the
      # file count on the release page for no reader.
      #
      # The part list is recorded INTO the .meta.json because splitting happens
      # here, after the builder wrote it, and because the sidecars now travel
      # as a separate artifact from the payload -- `index` can no longer see
      # the parts on disk to count them.
      - name: Checksum and split
        working-directory: out
        run: |
          set -euo pipefail
          # Both extensions: the builder stopped gzipping module assets (their
          # payload is `docker save` output, already-gzipped layers -- the
          # outer deflate bought 0.55%, 31 MB on 5.44 GB, for a single-threaded
          # pass over all of it), but a re-run of an older commit still emits
          # .tar.gz. A build produces exactly ONE of the two, so `head -1` is
          # picking from a one-element list and the glob order does not matter.
          # `|| true` because ls exits non-zero for whichever pattern found no
          # match, and this step runs under `set -e`; the emptiness check below
          # is what actually catches "the builder produced nothing", instead of
          # letting an empty $PKG sail into sha256sum.
          PKG="$(ls -1 *.tar *.tar.gz 2>/dev/null | head -1 || true)"
          test -n "$PKG" || { echo "::error::no asset tarball in out/"; exit 1; }
          echo "sha256 $(sha256sum "$PKG" | cut -d' ' -f1)  $PKG"
          SIZE=$(stat -c%s "$PKG")
          if [ "$SIZE" -gt $((1900 * 1024 * 1024)) ]; then
            echo "$PKG is $((SIZE/1024/1024)) MiB — splitting"
            split -b 1900m -d -a 2 "$PKG" "$PKG.part-"
            rm -f "$PKG"
          fi
          python3 - "$PKG" <<'PY'
          import glob, json, os, sys
          pkg = sys.argv[1]
          meta_path = pkg + ".meta.json"
          meta = json.load(open(meta_path))
          meta["parts"] = sorted(os.path.basename(p)
                                 for p in glob.glob(pkg + ".part-*"))
          json.dump(meta, open(meta_path, "w"), indent=2)
          print(f"{pkg}: {len(meta['parts']) or 'no'} part(s)")
          PY
          ls -lh

      # The payload and its description travel as SEPARATE artifacts on
      # purpose: `index` needs only the description, and download-artifact has
      # no way to fetch part of an artifact. Bundled together, the index job
      # would pull every gigabyte of every asset to read a few KB of JSON.
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.module }}
          path: |
            out/*
            !out/*.json
          # STORE, DO NOT DEFLATE. These are `docker save` output -- layers that
          # are already gzipped at rest. This workflow already measured what a
          # second pass buys on exactly this content and stopped doing it for
          # the tars themselves: 0.55%, 31 MB on 5.44 GB, "for a single-threaded
          # pass over all of it" (see the checksum step above). The artifact
          # store was still doing that same deflate one layer up, and paying it
          # FOUR times over -- once compressing on upload, then inflating in
          # each of verify-assets and publish.
          #
          # Safe by construction, not by argument: publish re-hashes every asset
          # after this round trip and compares against the index sha256 -- the
          # same digest a box checks its download against -- so a byte lost here
          # fails the release rather than shipping.
          compression-level: 0
          retention-days: 3

      # .meta.json + .manifest.json. The per-asset `.manifest.json` the builder
      # writes stays in CI only — not on the release page — but the index job
      # needs it to check for collisions across modules.
      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.module }}
          path: |
            out/*.meta.json
            out/*.manifest.json
          retention-days: 3

  # ---------------------------------------------------------- system-bundle
  # Docker + every INTACT_HOST_DEPS package (lib/docker.sh:38-48), bundled as
  # real .deb files plus a pre-built local apt repo index, so install.sh
  # never touches download.docker.com or a live apt mirror -- online or
  # air-gapped, the package is the only source. Independent of the module
  # matrix (doesn't need `build`), so it runs in parallel with it.
  #
  # THE APPROACH BELOW IS TESTED, NOT ASSUMED: the naive version of this
  # (download .deb files, `apt-get install /bundle/*.deb` on the target) was
  # tried first and confirmed BROKEN empirically -- bare local .deb file
  # arguments do not reliably resolve inter-package dependencies at this
  # scale, even when every needed .deb is present. Two fixes were needed:
  #   1. Purge the bootstrap tools (curl/gnupg/lsb-release) before the real
  #      dependency capture -- leaving them installed makes apt treat their
  #      OWN transitive deps (perl, netbase, libreadline8t64, and more) as
  #      already-satisfied and silently skip capturing them, even with
  #      --reinstall named on the top-level packages. ca-certificates is the
  #      one exception -- kept installed throughout, since the HTTPS docker
  #      repo needs it for the download-only step that follows.
  #   2. Build the local apt repo index (dpkg-scanpackages) HERE, at build
  #      time, and ship it as part of the asset -- the target machine only
  #      ever needs plain `apt-get` reading a pre-built Packages.gz, never
  #      dpkg-scanpackages/dpkg-dev itself.
  # -------------------------------------------------------- bootstrap-asset
  # A small (well under 1 MB) asset carrying just the CODE an operator needs
  # to START an upgrade: install.sh, lib/*.sh, lib/upgrade/*.sh,
  # scripts/upgrade.sh. Exists for a box that predates lib/upgrade/ entirely
  # (e.g. intact-20260726) and therefore has no upgrade.sh to run at all --
  # downloading a multi-GB module asset just to get an entry point would be
  # absurd, and is exactly the kind of thing that makes an operator reach for
  # the legacy single-bundle path instead.
  #
  # The bootstrap carries no modules/, no config.yaml, no source/ -- it is
  # pure code. Once run (`sudo bash bootstrap/scripts/upgrade.sh --root
  # /opt/intact <tag>`), its OWN acquire phase (upgrade_fetch_release)
  # downloads the real per-module assets itself, same as any other
  # tag-based upgrade; the bootstrap is never the thing being applied, only
  # what makes the box able to ask for what it needs.
  bootstrap-asset:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      # ONE ASSET: <tag>-engine.tar.gz -- flat layout, gzipped, carrying
      # BOOTSTRAP_PROTOCOL, the name scripts/bootstrap_upgrade.sh looks for.
      # scripts/build_engine_asset.sh owns the layout so it cannot drift.
      #
      # The legacy <tag>-bootstrap.tar twin was RETIRED here (2026-08-17): it was
      # the same code under the older name/shape, kept only so anything already
      # pointing at it would not break -- but the bootstrap never shipped in a
      # real release, so nothing in the field references it, and the engine asset
      # supersedes it. The apply-side "not a module" excludes for `*-bootstrap.tar`
      # (lib/args.sh, lib/upgrade/package.sh) stay as harmless defence in case an
      # old hand-built package still carries one.
      - name: Build the upgrade-engine asset
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          bash scripts/build_engine_asset.sh "$TAG" . out
          ls -lh out

      # The frozen contract, asserted on the real asset -- not the builder's
      # own claim about it. build_engine_asset.sh self-probes the layout; this
      # additionally proves the two things a box in the field depends on:
      # the published checksum verifies, and the engine's args.sh actually
      # understands --handoff (the flag bootstrap_upgrade.sh hands it). A
      # release whose engine failed either check must never publish.
      - name: Verify the engine asset honours the frozen contract
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ( cd out && sha256sum -c "${TAG}-engine.tar.gz.sha256" )
          probe="$(mktemp -d)"
          tar -xzf "out/${TAG}-engine.tar.gz" -C "$probe"
          test -f "$probe/BOOTSTRAP_PROTOCOL"
          test "$(cat "$probe/VERSION")" = "$TAG"
          test -f "$probe/scripts/upgrade.sh"        # flat, no leading dir
          grep -q -- '--handoff' "$probe/lib/upgrade/args.sh"
          echo "engine asset OK: checksum verifies, flat layout, --handoff accepted"

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: out/*
          retention-days: 3

  system-bundle:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Build the Docker + host-dependency bundle
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/bundle-out"
          cat > "$GITHUB_WORKSPACE/build_bundle.sh" << 'BUILDEOF'
          #!/bin/bash
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq curl gnupg ca-certificates lsb-release

          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -qq

          # Critical: purge bootstrap tools (NOT ca-certificates) before the
          # real capture -- see the job comment above for why.
          apt-get purge -y -qq curl gnupg lsb-release
          apt-get autoremove -y -qq --purge

          mkdir -p /bundle
          rm -f /var/cache/apt/archives/*.deb
          apt-get install -y -qq --download-only --reinstall \
            docker-ce docker-ce-cli containerd.io docker-compose-plugin \
            curl wget git python3 python3-pip python3-yaml openssl jq dnsutils lsb-release ca-certificates gnupg
          cp /var/cache/apt/archives/*.deb /bundle/

          apt-get install -y -qq dpkg-dev
          cd /bundle
          dpkg-scanpackages . /dev/null > Packages 2>/dev/null
          gzip -kf Packages

          . /etc/os-release
          echo "$VERSION_ID" > /bundle/ubuntu-version
          echo "== bundle built: $(ls /bundle | wc -l) files =="
          du -sh /bundle
          BUILDEOF
          docker run --rm \
            -v "$GITHUB_WORKSPACE/build_bundle.sh:/build_bundle.sh:ro" \
            -v "$GITHUB_WORKSPACE/bundle-out:/bundle" \
            ubuntu:24.04 bash /build_bundle.sh

          cd "$GITHUB_WORKSPACE/bundle-out"
          tar -cf "$GITHUB_WORKSPACE/${TAG}-system-bundle.tar" .
          sha256sum "$GITHUB_WORKSPACE/${TAG}-system-bundle.tar" > "$GITHUB_WORKSPACE/${TAG}-system-bundle.tar.sha256"
          ls -lh "$GITHUB_WORKSPACE/${TAG}-system-bundle.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: system-bundle
          path: |
            ${{ github.workspace }}/*-system-bundle.tar
            ${{ github.workspace }}/*-system-bundle.tar.sha256
          retention-days: 3

  # ------------------------------------------------------------------ index
  # The index is the CONTRACT: it is how a box learns which modules a release
  # carries and what each should hash to. It reads only the tiny sidecars.
  index:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: meta
          pattern: meta-*

      - name: Build and validate the index
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          EXPECTED_MODULES: ${{ needs.resolve.outputs.matrix }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import datetime, glob, json, os, sys
          tag, commit = os.environ["TAG"], os.environ["COMMIT"]
          expected = set(json.loads(os.environ["EXPECTED_MODULES"]))
          metas = sorted(glob.glob("meta/**/*.meta.json", recursive=True))
          if not metas:
              sys.exit("::error::no .meta.json sidecars — nothing was built")

          entries, images, shas, transitive, problems = {}, {}, {}, {}, []
          pins_source = "target-release"
          for mp in metas:
              m = json.load(open(mp))
              mod = m["module"]

              # COHERENCE. Every asset must come from the one commit `resolve`
              # pinned. A tag re-cut mid-matrix is the failure this catches, and
              # it is not hypothetical -- intact-20260803 moved mid-flight.
              if m.get("source_commit") != commit:
                  problems.append(f"{mod}: built from {m.get('source_commit')}, expected {commit}")
              if m.get("release_tag") != tag:
                  problems.append(f"{mod}: claims release {m.get('release_tag')}, expected {tag}")

              base = m["asset"]
              entries[mod] = {"asset": base, "version": (m.get("modules") or {}).get(mod),
                              "size": m.get("size"), "sha256": m.get("sha256"),
                              "parts": m.get("parts") or []}

              # The merge is a disjoint union only because image tar names are
              # unique per module. That disjointness is EMERGENT, not enforced --
              # a future module adding a colliding prefix would make one asset
              # silently truncate another's file on extract. Assert it here,
              # where it costs nothing, instead of discovering it on a customer.
              man = os.path.join(os.path.dirname(mp), base + ".manifest.json")
              if not os.path.exists(man):
                  problems.append(f"{mod}: no manifest sidecar — collisions with "
                                  f"other assets cannot be checked")
                  continue
              c = (json.load(open(man)).get("contents") or {})
              for img in (c.get("images") or []):
                  if img in images and images[img] != mod:
                      problems.append(f"image {img} claimed by both {images[img]} and {mod}")
                  images[img] = mod
              for k, v in (c.get("sha256") or {}).items():
                  if k in shas and shas[k] != v:
                      problems.append(f"file {k} differs between assets — one would overwrite the other")
                  shas[k] = v
              for tmod, deps in (c.get("transitive_versions") or {}).items():
                  transitive.setdefault(tmod, {}).update(deps)
              # A release built from a package whose sidecar pins came from the
              # BUILD MACHINE's config.yaml rather than the target ref's own
              # (GitHub fetch failed mid-build) must never leave CI quietly --
              # bash only warns on this (lib/upgrade/package.sh), because a box
              # applying a bad package at least gets a visible warning; a
              # RELEASE built this way ships the same risk to every box that
              # upgrades from it with no warning at all, since nothing prompts
              # an operator to read a build log.
              if c.get("pins_source") == "local-fallback":
                  pins_source = "local-fallback"

          # COMPLETENESS. fail-fast on the build matrix catches a FAILED build;
          # it does not catch an OMITTED one -- 8 of 9 expected assets is a
          # perfectly valid index by every check above. Compare against what
          # `resolve` computed the release should contain.
          missing = sorted(expected - set(entries))
          if missing:
              problems.append(f"expected asset(s) never appeared in the index: "
                              f"{', '.join(missing)}")
          extra = sorted(set(entries) - expected)
          if extra:
              problems.append(f"asset(s) built for module(s) outside the release "
                              f"matrix: {', '.join(extra)}")

          if pins_source == "local-fallback":
              problems.append(
                  "at least one module's sidecar pins came from the BUILD "
                  "MACHINE's config.yaml (pins_source=local-fallback), not the "
                  f"target release {tag}'s own -- the GitHub fetch failed "
                  "during the build. A release must not ship with unverified "
                  "sidecar pins; re-run the build once GitHub is reachable.")

          # NON-CRITICAL by policy (2026-08-17): coherence (mixed-commit),
          # image/file collisions, missing sidecars, completeness (a module that
          # never showed up) and pins-provenance no longer FAIL the release --
          # they warn and land in the run summary so an operator sees them
          # without a fully green build being thrown away. The only hard blocks
          # left are SECRETS (gitleaks + no-secrets-in-package, in the build
          # legs) and TRANSIT CORRUPTION (publish re-hashes every asset against
          # this index). As long as the containers built, the release ships.
          if problems:
              _summary = os.environ.get("GITHUB_STEP_SUMMARY")
              _lines = ["### ⚠️ Release published with warnings",
                        "Non-critical checks flagged the following; the release "
                        "was still built and attached. Review before relying on it:",
                        ""]
              for p in problems:
                  print(f"::warning::{p}")
                  _lines.append(f"- {p}")
              if _summary:
                  with open(_summary, "a") as _fh:
                      _fh.write("\n".join(_lines) + "\n\n")

          index = {"release_tag": tag, "source_commit": commit,
                   "assets": entries}
          out = f"out/{tag}.index.json"
          json.dump(index, open(out, "w"), indent=2)
          print(f"indexed {len(entries)} module(s): {', '.join(sorted(entries))}")

          # THE ROOT MANIFEST. Every asset's sha256 map is already merged above
          # (that merge already fails the build on a conflicting value); this
          # just keeps what used to be thrown away. Before this, upgrade.sh had
          # to redo the merge itself at apply time from the per-module
          # `manifests/<module>.json` sidecars this asset also still carries --
          # this is the same computation, done once here instead of on every
          # box that ever applies the release. package_version/created/
          # created_by/contents shape matches exactly what
          # lib/upgrade/package.sh's upkg_read_manifest expects from a legacy
          # single-bundle manifest.json, because that is the reader this feeds.
          manifest = {
              "package_version": "1.0",
              "created": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "created_by": "build-release-assets.yml/index",
              "versions": {mod: e["version"] for mod, e in entries.items()
                          if e.get("version")},
              "contents": {
                  "release_tag": tag,
                  "pins_source": pins_source,
                  "transitive_versions": transitive,
                  "sha256": shas,
              },
          }
          man_out = f"out/{tag}.manifest.json"
          json.dump(manifest, open(man_out, "w"), indent=2)
          print(f"manifest: {len(manifest['versions'])} pin(s), "
                f"{sum(len(v) for v in transitive.values())} sidecar pin(s), "
                f"{len(shas)} checksummed file(s)")
          PY
          cat "out/$TAG.index.json"
          echo "---"
          cat "out/$TAG.manifest.json"

      # The upgrade engine is NOT built here. It used to be -- this job and
      # bootstrap-asset each ran scripts/build_engine_asset.sh and each
      # uploaded <tag>-engine.tar.gz, so every release built the same asset
      # twice and publish collected whichever copy landed last. The single
      # authoritative build lives in bootstrap-asset, and publish attaches it
      # from that job's `bootstrap` artifact. This job publishes only the index
      # and the merged manifest.
      - uses: actions/upload-artifact@v4
        with:
          name: release-index
          path: out/*
          retention-days: 3

  # -------------------------------------------------------------- verify
  # The dry-run apply gate: run the REAL package this build produced against a
  # fixture appliance root with the engine CI just built, stopping before any
  # swap. (The stage-0 hop is skipped here and unit-tested separately -- see the
  # Dry-run step.)
  #
  # Per-asset PACKAGE SHAPE and SECRET (gitleaks) checks used to live here, in a
  # serial loop that re-downloaded all ~5.5 GB and scanned each asset one after
  # another. They now run inside the `build` matrix, on the leg that built each
  # asset, in parallel and on local disk -- same checks (one shared
  # intact-upgrade-<tag>/ root, the manifests/<module>.json sidecar, no
  # config.yaml / live .env / TLS key / secrets dir, intact's upgrade.sh parses,
  # gitleaks with the repo's own .gitleaks.toml), just no longer bottlenecked on
  # one runner after the whole matrix finishes. This job keeps only the dry-run,
  # which genuinely needs every asset together in one package dir.
  verify-assets:
    needs: [resolve, build, index]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: asset-*

      # NOTE: per-asset shape-check + gitleaks moved into the `build` matrix
      # (see "Check this asset's shape and scan it for secrets" there). Each
      # asset is now scanned in parallel on the leg that built it, on local
      # disk, instead of one runner re-downloading all ~5.5 GB and scanning
      # them in series. This job now does only the dry-run apply -- which
      # genuinely needs every asset together in one package dir.

  # ------------------------------------------- dry-run apply (in verify)
  # The package this job downloads is EXACTLY what a customer would get.
  # Nothing before this point has ever run upgrade.sh against a real,
  # CI-built release -- every prior proof used a synthetic package built by
  # scripts/dev/make_test_package.sh from the live tree, which cannot catch a
  # defect in the CI packaging path itself (this is how the missing root
  # manifest.json escaped a full 8-module live run). --dry-run stops before
  # anything is actually swapped, so this needs no real module containers and
  # takes seconds, not the ~90 minutes `build` takes.
  #
  # The fixture appliance root is this checkout own tracked config.yaml and
  # modules/*/.env, not a genuinely older release pins -- CI has no cheap way
  # to know what "the previous release" was. That is a deliberate
  # simplification: exhaustive downgrade-refusal / plan-diff coverage against
  # many pin combinations already lives in tests/test_upgrade_plan.sh with
  # synthetic fixtures. What THIS job proves cannot be proven any other way --
  # that the real package this run built actually ACQUIRES, VERIFIES and
  # PLANS against a real appliance root, with the code CI just built.

      # ---- dry-run apply, folded in from the former dry-run-apply job -------
      # Merged 2026-08-16. It was a separate job that downloaded the SAME
      # ~5.5 GB of asset-* this one already has -- so the release payload came
      # out of the artifact store three times per run (here, there, and
      # publish). Same artifacts, same gate on publish, no reason for two
      # runners. Folding it in removes one full download and one full copy of
      # the release off a runner the publish job notes has ~21 GB free.
      #
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: release-index

      - name: bash -n and shellcheck the code this run will actually execute
        run: |
          set -euo pipefail
          bash -n scripts/upgrade.sh lib/upgrade/*.sh
          if command -v shellcheck >/dev/null; then
            shellcheck --severity=error scripts/upgrade.sh lib/upgrade/*.sh
          fi

      - name: Build a fixture appliance root
        run: |
          set -euo pipefail
          mkdir -p fixture/modules fixture/lib fixture/data/tmp
          cp install.sh config.yaml fixture/
          for d in modules/*/; do
            m="$(basename "$d")"
            [ -f "${d}.env" ] || continue
            mkdir -p "fixture/modules/${m}"
            cp "${d}.env" "fixture/modules/${m}/.env"
          done
          ls fixture/modules

      - name: Collect this release assets into one package dir, reassembling any split parts
        run: |
          set -euo pipefail
          mkdir -p pkgdir
          shopt -s nullglob
          for f in all/asset-*/*; do
            case "$f" in
              *.meta.json|*.manifest.json|*.part-*) continue ;;
            esac
            cp "$f" pkgdir/
          done
          for part1 in all/asset-*/*.part-00; do
            [ -e "$part1" ] || continue
            whole="pkgdir/$(basename "${part1%.part-00}")"
            cat "${part1%.part-00}".part-* > "$whole"
          done
          for m in all/release-index/*.manifest.json; do
            [ -e "$m" ] || continue
            cp "$m" pkgdir/manifest.json
          done
          ls -lh pkgdir

      - name: Dry-run apply against the fixture
        run: |
          set -euo pipefail
          # INTACT_UPGRADE_REEXEC=1 skips upgrade.sh's stage-0 hop. Post-merge,
          # upgrade.sh execs scripts/bootstrap_upgrade.sh to FETCH the target
          # engine before touching anything -- but here the checkout already IS
          # the target engine, and pkgdir carries only module assets (no engine
          # to hand over to), so the hop would look for an engine that isn't
          # there and exit 2. The flag runs the engine we just built directly,
          # which is exactly what this job tests: that the built package
          # ACQUIRES / VERIFIES / PLANS. The stage-0 hop itself (fetch -> verify
          # -> exec) is covered by tests/test_bootstrap_exec.sh. `sudo env` so
          # the var survives sudo's env reset.
          sudo env INTACT_UPGRADE_REEXEC=1 bash scripts/upgrade.sh \
            --root "${GITHUB_WORKSPACE}/fixture" --package pkgdir --dry-run

  # ----------------------------------------------------------------- attach
  publish:
    needs: [resolve, build, index, system-bundle, bootstrap-asset, verify-assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      # BY PATTERN, not "everything". An unfiltered download also pulls
      # `docker-image-packager` -- a 371 MB `docker save` of the build
      # container, a CI implementation detail -- and the upload step below then
      # attached it to the release as `intact-backend-ci-packager.tar.gz`,
      # where it looked like something a customer was meant to install.
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: asset-*

      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: release-index

      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: system-bundle

      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: bootstrap

      # No toolchain-reclaiming step here, deliberately. This job holds ONE
      # copy of the release (~8 GB) on a runner with ~21 GB free -- it used to
      # also stage a second copy into an upload/ dir, which is what made the
      # cleanup necessary. Printing the real numbers so the next release can
      # tell us if that stops being true.
      - name: Disk after download
        run: |
          df -h /
          du -sh all | cut -f1 | sed 's/^/release size: /'

      # THE ROUND TRIP IS UNVERIFIED UNTIL HERE. The sha256 in the index was
      # computed by the builder, inside its container, before the file was ever
      # uploaded to or downloaded from the artifact store. Re-hash what we are
      # about to attach and compare against the index -- that is what a box
      # will check the download against, so a mismatch caught here is a
      # mismatch the customer never sees.
      #
      # Split assets are hashed by streaming the parts through sha256sum, not
      # by reassembling them: the checksum covers the whole tarball, and
      # writing a second copy just to hash it is what filled the disk before.
      - name: Verify every asset against the index
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          INDEX="$(find all -name "$TAG.index.json" | head -1)"
          test -n "$INDEX" || { echo "::error::no index in the artifacts"; exit 1; }
          fail=0
          while read -r mod asset want; do
            dir="$(find all -type d -name "asset-$mod" | head -1)"
            if [ -z "$dir" ]; then
              echo "::error::$mod: indexed but no asset artifact"; fail=1; continue
            fi
            if [ -f "$dir/$asset" ]; then
              got="$(sha256sum "$dir/$asset" | cut -d' ' -f1)"
            elif ls "$dir/$asset".part-* >/dev/null 2>&1; then
              got="$(cat "$dir/$asset".part-* | sha256sum | cut -d' ' -f1)"
            else
              echo "::error::$mod: $asset missing from artifact $dir"; fail=1; continue
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::$mod: $asset hashes $got, index says $want — corrupted in transit"
              fail=1
            else
              echo "  ok  $mod  $asset"
            fi
          done < <(python3 -c "
          import json,sys
          idx=json.load(open(sys.argv[1]))
          for m,e in sorted(idx['assets'].items()):
              print(m, e['asset'], e['sha256'])
          " "$INDEX")
          exit $fail

      # Uploaded straight from where they were downloaded. No staging copy --
      # the release is several GB and a runner cannot hold two of it.
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # SELF-HEAL: the release must exist to attach to. On a `release` event
          # it does -- but it can be drafted, deleted, or churned out from under
          # a 20-minute build (this is exactly what stranded intact-20260813:
          # "release not found" at attach after a fully green build). Rather than
          # throw the whole build away, (re)create the release here so the assets
          # always have a home. --draft=false so it lands visible; if it already
          # exists this is a no-op.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::warning title=Release re-created::$TAG was not found at attach time; re-creating it so the built assets are not lost"
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --notes "Release assets attached by CI." --target "$COMMIT" --draft=false \
              || echo "::warning::could not create $TAG; continuing to try the upload anyway"
          fi

          # ALLOWLIST, not a denylist. A release page carries exactly two kinds
          # of file: one tarball per module (or its .part-NN pieces), and the
          # index that names them, plus the merged manifest.json the index job
          # assembled from every asset's per-module sidecar. Everything else --
          # .meta.json, the PER-ASSET `<module>.tar.manifest.json` sidecars
          # (note: NOT `$TAG.manifest.json`, which is the merged one and is
          # deliberately allowed below), a stray CI image -- is build
          # scaffolding. The previous `! -name '*.meta.json'` denylist let each
          # of those through the moment it appeared, which is how one
          # aws_sigma module turned into six assets.
          #
          # BOTH extensions are allowed even though a build emits only one of
          # them. Module assets are plain .tar now (their payload is already-
          # gzipped docker layers; the outer deflate bought 0.55%), but a re-run
          # of an older commit still produces .tar.gz, and an allowlist that
          # matched only the shape of the day would attach ZERO assets and
          # still exit 0 -- a green release page with nothing on it, which is
          # far worse than being permissive. The patterns are disjoint: a
          # `.tar.gz` name has no `.tar.part-` in it and vice versa, so nothing
          # is uploaded twice.
          mapfile -d '' FILES < <(find all -type f \( \
                 -name "$TAG-*.tar" \
              -o -name "$TAG-*.tar.part-*" \
              -o -name "$TAG-*.tar.gz" \
              -o -name "$TAG-*.tar.gz.part-*" \
              -o -name "$TAG.index.json" \
              -o -name "$TAG.manifest.json" \
              -o -name "$TAG-system-bundle.tar" \
              -o -name "$TAG-system-bundle.tar.sha256" \
              `# scripts/bootstrap_upgrade.sh REQUIRES the engine .sha256 (the` \
              `# engine .tar.gz is already matched by "$TAG-*.tar.gz" above) --` \
              `# without it the engine would run unverified as root.` \
              -o -name "$TAG-engine.tar.gz.sha256" \
            \) -print0 | sort -z)
          test "${#FILES[@]}" -gt 0 || { echo "::error::no assets found to attach"; exit 1; }
          # RETRY. --clobber makes each attempt idempotent, so a transient blip
          # on one file no longer throws a whole green build away.
          n=0
          until gh release upload "$TAG" --repo "$REPO" --clobber "${FILES[@]}"; do
            n=$((n+1)); [ "$n" -ge 3 ] && { echo "::error::gh release upload failed after 3 attempts"; exit 1; }
            echo "::warning::upload attempt $n failed — retrying in 10s"; sleep 10
          done
          echo "== attached =="
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "\(.name)  \(.size)"'

          # ONLY NOW -- every indexed asset attached and re-hash-verified by
          # the step above -- is it safe to make the release public. set -e
          # means a failure anywhere above this point (an upload, a missing
          # asset, a hash mismatch) never reaches this line, so the release
          # stays in draft with nothing public instead of going live empty.
          if gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            echo "Publishing $TAG now that every asset is attached..."
            gh release edit "$TAG" --repo "$REPO" --draft=false
          fi

      # Inert today: this workflow is workflow_dispatch-only (see the header
      # comment), so github.event_name is never 'release' and this step never
      # runs. Wired now so the moment this workflow becomes the auto-
      # triggered one (the planned swap-back, once the fleet is off the
      # single-bundle format), stamping works with no further change here.
      # See .github/actions/stamp-version for why this can run right here
      # with no wait/poll.
      - name: Stamp VERSION on the source branch
        if: github.event_name == 'release'
        uses: ./.github/actions/stamp-version
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          target-commitish: ${{ github.event.release.target_commitish }}

      - name: Summary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          # Computed here rather than published as its own release asset --
          # the index is 347 bytes and GitHub prints a sha256 beside every
          # asset on the release page, so a `.index.json.sha256` file was one
          # more row saying what the row above it already said.
          IDX="$(find all -name "$TAG.index.json" | head -1)"
          {
            echo "### Release assets for \`$TAG\`"
            echo ""
            echo "Built from commit \`$COMMIT\`. Every asset re-hashed after the"
            echo "artifact round trip and matched against the index."
            echo ""
            echo "Air-gap operators verify the index by eye, then let it vouch"
            echo "for the assets:"
            echo ""
            echo '```'
            sha256sum "$IDX" | cut -d' ' -f1
            echo '```'
            echo ""
            echo "No single-file bundle is published. \`$TAG.manifest.json\`"
            echo "is the merged root manifest upgrade.sh reads when it applies"
            echo "the per-module assets -- not a bundle, just the sha256 map"
            echo "and version pins every asset's sidecar already carried,"
            echo "merged once here instead of by every box that upgrades."
          } >> "$GITHUB_STEP_SUMMARY"
