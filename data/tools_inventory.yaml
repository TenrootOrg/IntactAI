# Velociraptor Tools Inventory
# This file controls which tools are downloaded during installation and maintenance
# Set enabled: false to disable a tool (keeps it in config but skips download)
#
# TWO TIERS (apply to both the download sections and `velociraptor_inventory`):
#   * enabled: true  = DEFAULT tier. The ONLY tools the shipped default
#     blueprints actually use (verified against config/default_blueprints.yaml
#     via the live artifact `tools` deps): the forensic tools
#     lolrmm.csv / Autoruns / LastActivityView, plus (inventory only) the
#     Velociraptor agent + collector binaries needed to enrol clients and build
#     offline collectors. These ALWAYS download/configure — at install, in
#     System Maintenance, and bundled into Prepare-Package / Online-Upgrade.
#   * enabled: false = OPTIONAL tier (Hayabusa, YARA, the Eric Zimmerman EZ
#     tools, Sysmon, OSQuery, WinPmem, etc.). NOT used by any default blueprint
#     (DetectRaptor/Forensics artifacts parse those formats in pure VQL;
#     Hayabusa/YARA artifacts use Velociraptor's built-in plugins). These
#     download/configure ONLY when the operator sets options.download_tools:
#     true. Don't flip one to true without confirming a default blueprint needs it.
#
# Tool types:
#   github_release: Download from GitHub releases API
#   direct_url: Direct download URL
#   page_scrape: Scrape URL from a webpage
#
# Author: Based on 10Root download script

settings:
  # Path inside Velociraptor container where tools are stored
  # Mount your VelociraptorPlus folder to this path in docker-compose
  tools_directory: "/tools"
  timeout: 300
  retry_count: 3

# ============================================================================
# VELOCIRAPTOR CORE
# ============================================================================
velociraptor_core: []
# REMOVED: 9 redundant Velociraptor binary entries. The platform now
# stages the binaries it actually needs in two other places:
#   - modules/velociraptor/clients/{linux,mac,windows}/  (Dockerfile build)
#   - modules/nginx/html/downloads/                       (offline-collector serving)
# Pulling them a third time into /data/tools/ wasted ~385 MB at install
# time and never served any feature. See services/upgrade/velociraptor.py
# `_stage_binaries_for_build` for the staging contract.

# ============================================================================
# EVENT LOG ANALYSIS
# ============================================================================
event_log_tools:
  - name: "Hayabusa"
    enabled: false
    type: github_release
    repo: "Yamato-Security/hayabusa"
    pattern: "hayabusa-.*-win-x64\\.zip$"
    category: detection
    description: "SIGMA-based Windows event log analyzer"

  - name: "Hayabusa Live Response"
    enabled: false
    type: github_release
    repo: "Yamato-Security/hayabusa"
    pattern: "hayabusa-.*-win-x64-live-response\\.zip$"
    category: detection

  - name: "EVTXHussar"
    enabled: false
    type: github_release
    repo: "yarox24/EvtxHussar"
    pattern: ".*windows_amd64\\.zip$"
    category: detection
    description: "EVTX parsing and analysis"

  # Chainsaw removed — Velociraptor's Windows.EventLogs.Chainsaw
  # artifact auto-fetches it via Server.Utils.GetDependency on first
  # use, and the offline-collector bundler has its own self-contained
  # download URL in services/offline_collector/constants.py. Saved
  # ~45 MB of pre-positioning that nobody used at install time.

  - name: "Takajo"
    enabled: false
    type: github_release
    repo: "Yamato-Security/takajo"
    pattern: "takajo.*-win-x64\\.zip$"
    category: detection
    description: "Hayabusa timeline analysis"

  # Zircolite removed — overlaps with Hayabusa (kept) and Chainsaw
  # (removed). The Velociraptor Zircolite artifact is rarely chosen
  # over Hayabusa in practice.

