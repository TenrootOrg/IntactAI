    file_pattern: "(?i)^velociraptor-v.*-linux-amd64"
    enabled: true

  - tool_name: "VelociraptorWindows"
    file_pattern: "(?i)^velociraptor-v.*-windows-amd64.exe$"
    enabled: true

  - tool_name: "VelociraptorWindowsMSI"
    file_pattern: "(?i)^velociraptor-v.*-windows-amd64.msi$"
    enabled: true

  # The four below are OPTIONAL because install.sh / the upgrade path never
  # fetch them: _velociraptor_binary_set stages exactly linux-amd64,
  # darwin-amd64, windows-amd64.exe and windows-amd64.msi. Leaving these
  # enabled meant configure_inventory looked for files nothing ever produces
  # and reported "File not found: N" on every healthy install — a permanent
  # phantom that made a real gap impossible to spot (2026-07-23 support
  # bundles showed 12 and 11 with no way to tell which mattered).
  # Flip to true only alongside code that actually downloads them.
  - tool_name: "VelociraptorWindows_x86"
    file_pattern: "(?i)^velociraptor-v.*-windows-386.exe$"
    enabled: false

  - tool_name: "VelociraptorWindows_x86MSI"
    file_pattern: "(?i)^velociraptor-v.*-windows-386.msi$"
    enabled: false

  - tool_name: "VelociraptorDebian"
    file_pattern: "(?i)^velociraptor.*_amd64.deb$"
    enabled: false

  - tool_name: "VelociraptorRedHat"
    file_pattern: "(?i)^velociraptor.*.x86_64.rpm$"
    enabled: false

  - tool_name: "VelociraptorCollector"
    file_pattern: "(?i)^velociraptor-collector$"
    enabled: true

  # OSQuery
  - tool_name: "OSQueryWindows"
    # Must mirror the osquery_tools download pattern above — upstream ships
    # `osquery-<ver>.msi`, never a `.windows.x86_64` infix.
    file_pattern: "(?i)^osquery-[0-9.]+\\.msi$"
    enabled: false

  - tool_name: "OSQueryLinux"
    file_pattern: "(?i)^osquery_.*\\.linux_amd64\\.deb$"
    enabled: false

  - tool_name: "OSQueryDarwin"
    file_pattern: "(?i)^osquery-.*\\.pkg$"
    enabled: false

  # Network tools
  - tool_name: "etl2pcapng"
    file_pattern: "(?i)^etl2pcapng\\.exe$"
    enabled: false
