  # YARA rule bundles we already ship. Not required for any platform
  # workflow.

# ============================================================================
# OSQUERY
# ============================================================================
osquery_tools:
  - name: "OSQuery Windows"
    enabled: false
    type: github_release
    repo: "osquery/osquery"
    # Upstream ships the Windows installer as plain `osquery-<ver>.msi` — the
    # `.windows.x86_64` infix this used to match has never existed on any
    # release (verified against osquery/osquery 5.23.1: the assets are
    # osquery-5.23.1.msi and osquery-5.23.1.windows_x86_64.zip). The old
    # pattern could therefore never match, so enabling this tool silently
    # downloaded nothing. The Linux/macOS patterns beside it are correct.
    pattern: "osquery-[0-9.]+\\.msi$"
    category: monitoring
    description: "OS instrumentation framework for Windows"

  - name: "OSQuery Linux"
    enabled: false
    type: github_release
    repo: "osquery/osquery"
    # Real osquery .deb release names look like
    # `osquery_5.16.0-1.linux_amd64.deb` — the segment before
    # `.linux_amd64` ends with `-1`, NOT `_1`. The prior pattern's
    # `_1` would never match the actual artifact name, so this entry
    # was effectively dead and the inventory's OSQueryLinux fell into
    # the "no download source" warning bucket. Loosen to accept any
    # trailing segment.
    pattern: "osquery_.*\\.linux_amd64\\.deb$"
    category: monitoring
    description: "OS instrumentation framework for Linux"

  - name: "OSQuery macOS"
    enabled: false
    type: github_release
    repo: "osquery/osquery"
    pattern: "osquery-.*\\.pkg$"
    category: monitoring
    description: "OS instrumentation framework for macOS"

