# Velociraptor Tools Inventory
# This file controls which tools are downloaded during installation and maintenance
# Set enabled: false to disable a tool (keeps it in config but skips download)
#
# Tool types:
#   github_release: Download from GitHub releases API
#   direct_url: Direct download URL
#   page_scrape: Scrape URL from a webpage
#
# Author: Based on 10Root download script

settings:
  # Path inside Velociraptor container where tools are stored
  # Mount your VelociraptorPlus folder to this path in docker-compose
  tools_directory: "/tools"
  timeout: 300
  retry_count: 3

# ============================================================================
# VELOCIRAPTOR CORE
# ============================================================================
velociraptor_core:
  - name: "Velociraptor Windows x64"
    enabled: true
    type: github_release
    repo: "Velocidex/velociraptor"
    pattern: ".*windows-amd64\\.exe$"
    category: core

  - name: "Velociraptor Windows MSI"
    enabled: true
    type: github_release
    repo: "Velocidex/velociraptor"
    pattern: ".*windows-amd64\\.msi$"
    category: core

  - name: "Velociraptor Collector"
    enabled: true
    type: github_release
    repo: "Velocidex/velociraptor"
    pattern: "velociraptor-collector"
    category: core

  - name: "Velociraptor Linux x64"
    enabled: true
    type: github_release
    repo: "Velocidex/velociraptor"
    pattern: ".*linux-amd64$"
    category: core

  # NOTE: v0.74.1 binaries for Offline Collector are static in modules/nginx/html/downloads/
  # They are NOT downloaded via maintenance (v0.75+ has CLI bug with Generic Collector)

# ============================================================================
# EVENT LOG ANALYSIS
# ============================================================================
event_log_tools:
  - name: "Hayabusa"
    enabled: true
    type: github_release
    repo: "Yamato-Security/hayabusa"
    pattern: "hayabusa-.*-win-x64\\.zip$"
    category: detection
    description: "SIGMA-based Windows event log analyzer"

  - name: "Hayabusa Live Response"
    enabled: true
    type: github_release
    repo: "Yamato-Security/hayabusa"
    pattern: "hayabusa-.*-win-x64-live-response\\.zip$"
    category: detection

  - name: "EVTXHussar"
    enabled: true
    type: github_release
    repo: "yarox24/EvtxHussar"
    pattern: ".*windows_amd64\\.zip$"
    category: detection
    description: "EVTX parsing and analysis"

  - name: "Chainsaw"
    enabled: true
    type: github_release
    repo: "WithSecureLabs/chainsaw"
    pattern: "chainsaw_all_platforms\\+rules.*\\.zip$"
    category: detection
    description: "Fast Windows event log analysis with SIGMA"

  - name: "Takajo"
    enabled: true
    type: github_release
    repo: "Yamato-Security/takajo"
    pattern: "takajo.*-win-x64\\.zip$"
    category: detection
    description: "Hayabusa timeline analysis"

  - name: "Zircolite"
    enabled: true
    type: direct_url
    url: "https://github.com/wagga40/Zircolite/releases/download/2.40.0/zircolite_win_x64_2.40.0.7z"
    filename: "zircolite_win_x64_2.40.0.7z"
    category: detection
    description: "SIGMA-based EVTX analyzer"

# ============================================================================
# PERSISTENCE DETECTION
# ============================================================================
persistence_tools:
  - name: "PersistenceSniper"
    enabled: true
    type: github_release
    repo: "last-byte/PersistenceSniper"
    pattern: "PersistenceSniper\\.zip$"
    category: detection
    description: "PowerShell persistence scanner"

  - name: "PersistenceSniper False Positives"
    enabled: true
    type: direct_url
    url: "https://raw.githubusercontent.com/ablescia/Windows.PersistenceSniper/main/false_positives.csv"
    category: detection

  - name: "Trawler"
    enabled: false
    type: github_release
    repo: "joeavanzato/Trawler"
    pattern: ".*\\.zip$"
    category: detection
    description: "Persistence hunting tool"

