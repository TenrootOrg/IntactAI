name: Custom.Elastic.Flows.Upload
description: |
  This server side event monitoring artifact waits for new artifacts
  to be collected from endpoints and automatically uploads those to an
  elastic server.

  We use the artifact name as the name of the index. This allows users
  to adjust the index size/lifetime according to the artifact it is
  holding.

  Index pattern: artifact_[artifact_name]
  Example: artifact_windows_forensics_prefetch

type: SERVER_EVENT

sources:
  - queries:
      # Elasticsearch now requires authentication (xpack.security.enabled).
      # Read the credentials from this (server) process's own environment
      # rather than hardcoding them, so they stay in sync with the
      # ELASTIC_USER/ELASTIC_PASSWORD set in modules/velociraptor/.env.
      - LET _creds <= SELECT ELASTIC_USER, ELASTIC_PASSWORD FROM environ()

      - LET completions = SELECT * FROM watch_monitoring(
             artifact="System.Flow.Completion")
             WHERE Flow.artifacts_with_results

      - LET documents = SELECT * FROM foreach(row=completions,
          query={
             SELECT * FROM foreach(
                 row=Flow.artifacts_with_results,
                 query={
                     SELECT *, _value AS Artifact,
                            timestamp(epoch=now()) AS `@timestamp`,
                            ClientId, Flow.session_id AS FlowId,
                            "artifact_" + regex_replace(source=_value,
                               re='[/.]', replace='_') as _index
                     FROM source(
                        client_id=ClientId,
                        flow_id=Flow.session_id,
                        artifact=_value)
                 })
          })

      - SELECT * FROM elastic_upload(
            query=documents,
            addresses=["http://intact_elasticsearch:9200"],
            index="velociraptor",
            type="artifact",
            username=_creds[0].ELASTIC_USER,
            password=_creds[0].ELASTIC_PASSWORD)
